# cargo-nextest config for ah-engine (used by ./test.sh). Per-test timeouts: a hung test (a daemon that never answers,
# a socket that never closes) is killed and reported instead of stalling the whole run.
[profile.default]
# Flag a test as slow after 60 s; terminate it after 3 periods (180 s).
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[profile.ci]
inherits = "default"
slow-timeout = { period = "60s", terminate-after = 5 }
retries = 0

# Known slow tests: the Node parity sweeps (api_guard alone runs ~244 s) and the memory soak exceed 180 s when the machine
# is loaded. Only these get a longer budget (10 min); every other test keeps the 180 s default above.
[[profile.default.overrides]]
filter = 'test(api_guard_matches_node) | test(coordinator_post) | test(git_audit) | test(/^memory_soak::/)'
slow-timeout = { period = "120s", terminate-after = 5 }
