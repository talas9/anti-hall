# Source rules the scripted-check logic (plugins/anti-hall/engine/logic/**/*.js) must keep. Local tooling thresholds: they are
# not settings of the shipped plugin (tests/logic_charwise_concat.rs and tests/logic_alloc_budget.rs read this file).

[charwise_concat]
# Why: QuickJS reallocates the whole string on every `s += x`, so a scanner that appends one character at a time to a growing
# string allocates in proportion to (length x characters). One 15 KB command made the `git`, `command` and `coordinator-work-guard`
# checks allocate 38-42 MB each per call (measured 2026-11-07). Build such text in an array and `.join('')` it, or slice the source.
# The rule is a SHAPE, not a list of variable names: `<lhs> += <one-character expression>` with or without spaces around `+=`, where a
# one-character expression (atom) is a short identifier (up to 3 letters: c, ch, nx), any identifier indexed by a single-letter counter
# (`line[i]`, `input[i + 1]`), `.charAt(<counter>)`, or a literal of up to 2 characters; two atoms joined by `+`; or a ternary whose both
# arms are atoms. `{ATOM}` below stands for the atom.
atom = "(?:[A-Za-z_$][A-Za-z_$0-9]{0,2}|[A-Za-z_$][A-Za-z_$0-9.]*\\[[a-z]\\]|[A-Za-z_$][A-Za-z_$0-9.]*\\[[a-z] *[+-] *[0-9a-z]\\]|[A-Za-z_$][A-Za-z_$0-9.]*\\.charAt\\([a-z](?: *[+-] *[0-9a-z])?\\)|'(?:[^'\\\\]|\\\\.){0,2}'|\"(?:[^\"\\\\]|\\\\.){0,2}\")"
forms = [
  "{ATOM}",
  "{ATOM} *\\+ *{ATOM}",
  "[^;?{}]*\\? *{ATOM} *: *{ATOM}",
]
# Lines to leave alone, as "file:substring of the line". Each is a NUMBER accumulated (the rule cannot tell `n` the count from `c` the
# character) or ONE append per call (a path part, a flag), never a per-character build.
allow = [
  "sibling-sweep.js:bytes += n",
  "model-routing.js:used += n",
  "command.js:k += n;",
  "command.js:f += 'i'",
  "lib/50-posix.js:path += '/'",
  "git.js:cur += '/' + segs[i]",
  "reply-length-guard.js:codeChars += n",
  "reply-length-guard.js:tabChars += n",
  "reply-length-guard.js:chars += n",
  "afk-mode.js:t += byId[k]",
  "coordinator-work-guard.js:e[k] += s[k]",
]

# Cells that pin the rule: every `positive` line must be flagged, no `negative` line may be.
[[charwise_concat.cell]]
line = "cur += c;"
flag = true
[[charwise_concat.cell]]
line = "    cur += nx; else cur += '\\\\' + nx;"
flag = true
[[charwise_concat.cell]]
line = "out+=c;"
flag = true
[[charwise_concat.cell]]
line = "out += cond ? x : y;"
flag = true
[[charwise_concat.cell]]
line = "out += /[A-Za-z0-9._-]/.test(id.charAt(i)) ? id.charAt(i) : '_';"
flag = true
[[charwise_concat.cell]]
line = "w += raw[i + 1];"
flag = true
[[charwise_concat.cell]]
line = "res += line[i];"
flag = true
[[charwise_concat.cell]]
line = "res += input[i];"
flag = true
[[charwise_concat.cell]]
line = "cleaned += ' ';"
flag = true
[[charwise_concat.cell]]
line = "cur += c + c2;"
flag = true
[[charwise_concat.cell]]
line = "score += weights[field];"
flag = false
[[charwise_concat.cell]]
line = "i += 2;"
flag = false
[[charwise_concat.cell]]
line = "msg += 'a longer literal text';"
flag = false
[[charwise_concat.cell]]
line = "out += text.slice(at, h[0]);"
flag = false
[[charwise_concat.cell]]
line = "body += lines.join('\\n');"
flag = false

[logic_alloc]
# tests/logic_alloc_budget.rs: bytes ONE call of a check may allocate (total, the counting allocator's `alloc`) on a PreToolUse Bash
# payload whose command is `echo ` followed by 3000 words (15 KB), or a 15 KB quoted-heredoc commit. In-process, before the fix
# (origin/dev logic): git 37 MiB, compact-declaration-guard 37 MiB; heredoc commit: git 69 MiB, merge-side-pick 17 MiB. After: git 5.7,
# compact 4.4; heredoc git 7.1, merge-side-pick 0.8. Budgets sit between the two so the regression fails and noise does not.
command_len_words = 3000
# QuickJS-ng serves blocks of up to 512 bytes from arenas of at most 4096 bytes (JS_ARENA_SIZE) and frees an arena as soon as it is
# empty, so a loop making and dropping a small string pays one arena malloc/free per step or none, depending on the heap layout (lib
# files loaded). Only requests above this size are counted; the 15 KB charwise-concat blow-up lives in those.
arena_max_bytes = 4096
heredoc_lines = 160
# per check, MiB
[logic_alloc.echo_mib]
git = 12
command = 4
compact-declaration-guard = 8
api-guard = 4
ship-it-guard = 4
scan-throttle = 4
broad-kill-guard = 4
[logic_alloc.heredoc_mib]
merge-side-pick = 4
git = 14
command = 6
[logic_alloc.braces_mib]
git = 14
[logic_alloc.redirects_mib]
git = 48
