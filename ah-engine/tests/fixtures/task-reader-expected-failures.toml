defect = "XF-D2"
lane = "W1-5"
reason = "TodoWrite tasks 1 (pending, store says completed) and 2 (in progress) stay open: ladder blocks, by-id spawns #1 and #2 are proven, tracker states 2; the base lets the store override"

[[decision]]
