defect = "XF-D1"
lane = "W1-4"
reason = "store task 1 + an unreadable record: TodoWrite task 2 is open, so a by-id spawn #2 is proven, the tracker states 2 open tasks and tasklist-guard computes over {1,2}; the base drops task 2"

[[decision]]
case = "oblig|d1|junk_record_keeps_the_todowrite_task"
defect = "XF-D1"
lane = "W1-4"
reason = "as the unreadable-record cell with a record that is not JSON"

[[decision]]
