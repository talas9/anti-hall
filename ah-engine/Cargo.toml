[package]
name = "ah-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
libc = "0.2.190"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
# panic stays "unwind": the client wraps everything in catch_unwind so a bug fails open (exit 0), never SIGABRT.

# Self-contained: this directory is its own Cargo workspace (never a submodule, D69), so it can move to its own repo unchanged.
[workspace]
