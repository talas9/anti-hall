[package]
name = "ah-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
libc = "0.2.190"
# Embedded storage (D19, D73): SQLite compiled in (`bundled`), so there is nothing for the user to install; `backup` is the
# online backup API used by `ah-engine backup` (D27).
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "cache"] }
# Jev (D34-D38): a pure-Rust HTTPS client. `ureq` over `rustls` (ring provider, webpki roots) is blocking, which suits the
# daemon's thread model, has no OpenSSL or async runtime, and exposes the knobs the key rules need (no redirects, no proxy,
# one global deadline). `ring` is already in the tree through rustls; it is named here only for its SHA-256.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
ring = { version = "0.17", default-features = false }

[build-dependencies]
# Compiles defaults/*.toml into static data (build.rs); not linked into the binary.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
# panic stays "unwind": the client wraps everything in catch_unwind so a bug fails open (exit 0), never SIGABRT.

# Self-contained: this directory is its own Cargo workspace (never a submodule, D69), so it can move to its own repo unchanged.
[workspace]
