unit = "utf16-code-units"

[model_routing.jev_budget_ms]
doc = "Synchronous Jev budget for model-routing relaxation, matching the Node hook."
value = 1200
min = 1
unit = "ms"

[model_routing.jev_label_mechanical]
doc = "Jev answer label that keeps the model-routing block."
value = "mechanical"

[model_routing.jev_label_authoring]
doc = "Jev answer label for authoring work."
value = "authoring"

[model_routing.jev_label_research]
doc = "Jev answer label for research work."
value = "research"

[model_routing.jev_label_plan_review]
doc = "Jev answer label for planning/review work."
value = "plan-review"

[model_routing.msg_fail_closed_what]
doc = "Fail-closed headline for internal model-routing errors."
value = "model-routing could not safely evaluate this spawn."

[model_routing.msg_fail_closed_why]
doc = "Fail-closed reason for internal model-routing errors."
value = "The built-in check hit a decode/config/runtime error; a silent allow would violate fail-closed routing."

[model_routing.msg_fail_closed_instead]
doc = "Fail-closed advice for internal model-routing errors."
value = "run the Node hook fallback or set an explicit safe model before spawning."

[model_routing.msg_row3_what]
doc = "Row-3 advisory headline."
value = "execution-shaped task on a flagship model ('{model}') via custom subagent_type '{subagent_type}'."

[model_routing.msg_row3_instead]
doc = "Row-3 advisory advice."
value = "unless that agent is pinned to a flagship on purpose, prefer model:'haiku'."

[model_routing.msg_row4_what]
doc = "Row-4 advisory headline."
value = "planning-shaped task (architecture/design/plan/brainstorm/deep review) runs on haiku."

[model_routing.msg_row4_instead]
doc = "Row-4 advisory advice."
value = "consider opus or fable for deeper reasoning."

[model_routing.msg_row6_what]
doc = "Row-6 advisory headline."
value = "research/read-only-shaped spawn uses subagent_type:'general-purpose'."

[model_routing.msg_row6_instead]
doc = "Row-6 advisory advice."
value = "re-dispatch as subagent_type:'Explore' (WebSearch/WebFetch, no Agent tool, so it cannot recurse). Keep general-purpose only if it must write files or spawn sub-agents."

[model_routing.msg_row6_why]
doc = "Row-6 advisory reason."
value = "general-purpose carries the Agent tool and can recurse; chains waste ~7x tokens by depth 5."
