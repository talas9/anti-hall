  "shared", "exclusive", "unlock", "nonblock", "nb", "close", "no-fork", "verbose",
], big_l = ["wait", "timeout", "conflict-exit-code"], ops = 1 }, setsid = { s = "cfw", v = "", l = ["ctty", "fork", "wait"], big_l = [], ops = 0 }, chrt = { s = "abdefiomrRpv", v = "TPD", l = [
