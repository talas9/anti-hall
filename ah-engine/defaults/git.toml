# ---- limits, budgets and timeouts ------------------------------------------------------------------------

[git.max_chain]
doc = "Longest git alias chain followed before giving up."
value = 10

[git.alias_depth]
doc = "Deepest alias or shell-definition expansion that is rescanned."
value = 3

[git.max_nest]
doc = "Nesting limit for the substitution scanners (JS overflows its stack far deeper and its caller then scans the raw text, which is what a bail-out means here)."
value = 1500

[git.launcher_hops]
doc = "Most symlink hops followed when resolving a dangling launcher link."
value = 10

[git.cd_max_chars]
