[git.label_override]
doc = "Label of the override line."
value = "Override (only if the user explicitly asked): "

[git.file_write_tip]
doc = "Added to a block when the command writes a file with shell text: the file was scanned as shell."
value = "\nTip: this file's content was scanned as shell. Write the file with the Write or Edit tool (not shell-scanned) instead of a Bash heredoc, then reference its path in a plain follow-up command (e.g. `devswarm.js send --message-file <path>`)."

[git.handover_skipped_advisory]
doc = "Advisory when the handover check ran out of budget. Placeholder: {n}."
value = "anti-hall git-guard: the handover-commit check was skipped for {n} commit(s) in this command (too many distinct commits/repos to check). Make sure none of them includes a session handover (.anti-hall/handovers/**, HANDOVER*.md, CONTINUE-HERE.md)."

[git.check_summary]
doc = "One-line description of the check for the generated reference."
value = "Port of the git-guard hook: blocks force pushes, remote ref deletion, AI self-credit in commits, handover commits, launcher-directory writes and the same through aliases, runners and heredocs"

[git.note_git_alias_def]
doc = "Note on a block found inside an alias definition made with -c or git config. Placeholder: {name}."
value = "defining git alias `{name}` to run a blocked command:"

[git.note_shell_alias_def]
doc = "Note on a block found inside a shell alias definition. Placeholder: {name}."
value = "defining shell alias `{name}` to run a blocked command:"

[git.note_env_alias_def]
doc = "Note on a block found inside an alias defined through GIT_CONFIG_VALUE_<n>. Placeholder: {name}."
value = "defining a git alias via `{name}` to run a blocked command:"

[git.note_shell_def_use]
doc = "Note on a block reached through a shell alias or function. Placeholders: {kind}, {name}."
value = "via shell {kind} `{name}`:"

[git.word_alias]
doc = "The word for a shell alias in notes."
value = "alias"

[git.word_function]
doc = "The word for a shell function in notes."
value = "function"

[git.note_git_alias_use]
doc = "Note on a block reached through a git alias chain. Placeholder: {chain}."
value = "via git alias `{chain}`:"

[git.chain_joiner]
doc = "Separator between the aliases of a chain in a note."
value = "` -> `"

[git.origin_template]
doc = "Where a reused message came from: the commit template."
value = "the commit template"

[git.origin_amend]
doc = "Where a reused message came from: an amend."
value = "HEAD (`--amend` reuses it)"

[git.origin_commit]
doc = "Where a reused message came from: a named commit. Placeholder: {ref}."
value = "commit `{ref}`"

[git.more_marker]
doc = "Appended to a list that was cut short."
value = ", ..."

[git.msg_launcher]
doc = "Block: a write into the launcher directory."
value = { what = "a write into ~/.anti-hall/bin/ (the stable launcher directory) is blocked.", why = "anti-hall installs those files itself (update / doctor --repair); overwriting one would run arbitrary code (such as a force push) under a trusted launcher name.", instead = "leave that directory alone; if the path only appears as prose in a heredoc/brief, write that text with the Write tool instead." }

[git.msg_reused_message]
doc = "Block: a reused commit message carries an AI self-credit. Placeholder: {origin}."
value = { what = "a commit whose message is taken from {origin} and carries an AI/assistant self-credit trailer is blocked.", why = "Commits carry no AI co-author credit, even when the message is reused rather than typed.", instead = "commit with an explicit clean message (`-m \"<msg>\"` or `-F <file>`) instead of reusing that one." }

[git.msg_gh_credit]
doc = "Block: a gh pr, issue or release body or title carries an AI self-credit."
value = { what = "a gh pr/issue/release body or title carries AI/assistant self-credit (\"Generated with\" footer, Co-Authored-By, a claude.com/claude-code link) is blocked.", why = "PRs and issues carry no AI attribution.", instead = "remove it and re-run." }

[git.msg_runner_placeholder]
doc = "Block: a runner placeholder stands for the command or subcommand beside a force or delete flag."
value = { what = "a command whose name or git subcommand is an xargs / find / parallel placeholder, with a force or delete flag, is blocked.", why = "The placeholder is filled from input at run time, so the command may be `git push`.", instead = "run the git command directly with an explicit subcommand and arguments." }

[git.msg_runner_no_subcommand]
doc = "Block: a runner with git and no subcommand beside a force or delete flag. Placeholder: {runner}."
value = { what = "`{runner} git` with no subcommand, beside a force or delete flag, is blocked.", why = "{runner} reads the subcommand from its input, so it may be `push` with that flag.", instead = "run the git command directly with an explicit subcommand and arguments." }

[git.msg_runner_push]
doc = "Block: a push through xargs or parallel. Placeholder: {runner}."
value = { what = "force push via `{runner} git push` is blocked.", why = "{runner} appends input words to the command, so the full argv (and any hidden --force/-f) cannot be verified statically.", instead = "run `git push` directly with explicit arguments." }

[git.msg_find_push]
doc = "Block: a push through find -exec."
value = { what = "push via `find -exec git push ... {}` is blocked.", why = "find puts file names where {} stands, so the refspecs (a `+ref` is a force push) cannot be verified statically.", instead = "run `git push` directly with explicit arguments." }

[git.msg_handover]
doc = "Block: a commit that includes a session handover. Placeholders: {shown}, {skip}."
value = { what = "this commit includes a session handover ({shown}) and is blocked.", why = "Handovers are local session state and are never committed.", instead = "unstage a NEW one with `git restore --staged <path>`; if ALREADY tracked, `git rm --cached <path>` and commit that removal (allowed).", override = "{skip} (only if the owner explicitly asked to commit this file)" }

[git.msg_force_push]
doc = "Block: a force push."
value = { what = "force push is blocked.", why = "Rewriting published history is a deliberate human action.", instead = "do it manually with explicit owner confirmation, never from an automated push." }

[git.msg_delete_ref]
doc = "Block: remote ref deletion. Placeholder: {skip}."
value = { what = "remote ref deletion (push --delete / -d / --prune / an empty-source :<ref> refspec) is blocked.", why = "Deleting published branches or tags needs explicit owner confirmation.", instead = "leave the ref.", override = "{skip} (only if the owner asked for this exact deletion)" }

[git.msg_push_cmdsubst]
doc = "Block: a push argument produced by command substitution."
value = { what = "`git push` with an argument produced by command substitution / backticks is blocked.", why = "It can smuggle a --force flag past static inspection.", instead = "run the push with literal arguments (no dollar-paren or backticks). If this is message text in printf/echo written to a file, write that file with the Write tool instead." }

[git.push_cmdsubst_heredoc_note]
doc = "Appended to the remedy of the push_cmdsubst block when the command contains a heredoc."
value = " Heredoc bodies are scanned as shell even when a script only reads them as text: write the script or note with the Write tool, then run or reference the file."

[git.msg_trailer_remap]
doc = "Block: a trailer remap to an AI self-credit key."
value = { what = "a `-c trailer.*.key=` remap to an AI self-credit key (Co-Authored-By / Generated-with) is blocked.", why = "Commits carry no AI co-author credit.", instead = "remove the trailer remap." }

[git.msg_commit_credit]
doc = "Block: an inline commit message with an AI self-credit."
value = { what = "a commit message with an AI/assistant self-credit trailer (Co-Authored-By / \"Generated with <AI>\") is blocked.", why = "Commits carry no AI co-author credit.", instead = "re-run the commit without that trailer." }

[git.msg_commit_file_credit]
doc = "Block: a commit message read from a file or heredoc with an AI self-credit."
value = { what = "a commit message (via `-F`/`--file`, from a heredoc body or file) with an AI/assistant self-credit trailer is blocked.", why = "Commits carry no AI co-author credit.", instead = "re-run the commit without that trailer." }

[git.msg_creating_credit]
doc = "Block: a commit-creating command with an AI self-credit line. Placeholder: {sub}."
value = { what = "a command that creates a commit (git {sub}) and carries an AI/assistant self-credit trailer line is blocked.", why = "Commits carry no AI co-author credit, however the line reaches git (pipe, variable, file written in the same command).", instead = "remove the trailer line and re-run." }


# ---- PostToolUse audit (git-guard.js --audit) --------------------------------------------------------------------

[git_audit.summary]
doc = "One-line description of the git-audit check in the generated reference."
value = "Advisory after a commit-creating git command: a commit made in the last 15 minutes carries an AI self-credit trailer (port of git-guard.js --audit)."

[git_audit.window_s]
doc = "How recent, in seconds, a commit must be for the audit to look at it."
value = 900
min = 1
max = 86400

[git_audit.commits]
doc = "How many commits at HEAD the audit reads."
value = 20
min = 1
max = 1000

[git_audit.timeout_ms]
doc = "Timeout of the git log the audit runs in each repository."
value = 4000
unit = "ms"

[git_audit.argv_log]
doc = "git arguments of the audit's log query; {dir} is the repository directory and {n} the number of commits. Fields are separated by US (0x1f) and records end with RS (0x1e)."
value = ["-C", "{dir}", "log", "-n", "{n}", "--format=%h%x1f%ct%x1f%B%x1e", "HEAD"]

[git_audit.record_sep]
doc = "The character that ends one commit record of the audit's log output (RS)."
value = "\u001e"

[git_audit.field_sep]
doc = "The character that separates the fields of one commit record (US)."
value = "\u001f"

[git_audit.max_depth]
doc = "How deep eval and shell -c payloads are followed when looking for commit-creating git commands."
value = 3
min = 0
max = 16

[git_audit.msg]
doc = "Advisory text. Placeholders: {window_min} (minutes) and {hits} (comma separated short hashes)."
value = "anti-hall git-guard (audit): recent commit(s) on HEAD (committed in the last {window_min} min) {hits} carry an AI/assistant self-credit trailer (Co-Authored-By / \"Generated with <AI>\") - added by a git hook, template, cherry-pick/rebase, or an editor. Commits carry no AI co-author credit: reword them now (`git commit --amend` for HEAD, `git rebase -i` for older ones) BEFORE pushing."

[git_audit.cd_verb]
doc = "The verb whose directory argument moves the audit's working directory."
value = "cd"

[git_audit.eval_verb]
doc = "The verb whose payload is scanned as a command."
value = "eval"

[git_audit.git_verb]
doc = "The verb of a git command."
value = "git"

[git_audit.opts_with_value]
doc = "Global git options that take a value in the next word (skipped when looking for the repository directory)."
value = ["-c", "--git-dir", "--work-tree", "--namespace", "--config-env"]

[git_audit.dir_opt]
doc = "The global git option that changes the repository directory."
value = "-C"

[git_audit.event]
doc = "The hook event name in the audit's output."
value = "PostToolUse"

[git_audit.max_buffer]
doc = "Largest log output, in bytes, the audit accepts from one repository (Node's child-process buffer cap: a larger output is dropped)."
value = 1048576
min = 1024
max = 268435456
