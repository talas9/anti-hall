# ah-engine shipped defaults for the session-maintenance checks ported from Node (version-alert, devswarm-version,
# claude-cli-version, repo-self-drift, defect-nudge, progress-prune) and the helpers they share (D17, D30).
#
# Every file name, limit, switch, regex and message of these checks lives here. A relative path is under the home
# directory unless its doc says otherwise. Regex sources use JavaScript syntax (the Node hooks are the authority) and are
# translated by `checks::guardkit::jsre`; they are written as TOML literal strings so no backslash is doubled. Format: see
# the header of engine.toml.

# ---- shared ------------------------------------------------------------------------------------------------

[session.event]
doc = "The only event these hooks run on, and the event name in the advisory envelope they print."
value = "SessionStart"

[session.judge_child_env]
doc = "The environment variable that marks the judge child process, inside which every hook is a silent no-op (judge-child-exit.js)."
value = "ANTIHALL_JUDGE_CHILD"

[session.judge_child_on]
doc = "The value of the judge-child variable that turns the no-op on."
value = "1"

[session.state_dir]
doc = "The anti-hall state directory, under the home directory."
value = ".anti-hall"

[session.day_ms]
doc = "Milliseconds in a day, for the UTC date arithmetic of the hooks."
value = 86400000
unit = "ms"
min = 1000

[session.drift_cache_ttl_ms]
doc = "How long a drift probe's cache (claude-cli-version, devswarm-version, repo-self-drift) counts as fresh; an older one makes Node refresh it, which defers the engine's answer."
value = 86400000
unit = "ms"
min = 1000

[session.older_suffix]
doc = "Appended to a drift advisory when the installed version is OLDER than the audited baseline."
value = " (newer)"

[session.drift_why]
doc = "The Why line of the DevSwarm and Claude CLI drift advisories."
value = "Behavior may have drifted."

[session.git_binary]
doc = "The git program the gitignore probe runs, found on the PATH the client forwarded."
value = "git"

# ---- switches (resolved like the Node settings: env, settings.json, plugin option, default) -----------------------------

[session.setting_version_alert]
doc = "Switch: alert when a newer anti-hall release is available (versionAlerts.antiHall)."
value = { section = "versionAlerts", key = "antiHall", env = "ANTIHALL_VERSION_ALERT", option = "version_alerts_anti_hall", default = true }

[session.setting_claude_cli]
doc = "Switch: alert when the Claude Code CLI drifted from the audited version (versionAlerts.claudeCli)."
value = { section = "versionAlerts", key = "claudeCli", env = "ANTIHALL_CLAUDE_CLI_VERSION_ALERT", option = "version_alerts_claude_cli", default = true }

[session.setting_devswarm]
doc = "Switch: alert when the DevSwarm CLI drifted from the verified version (versionAlerts.devswarm)."
value = { section = "versionAlerts", key = "devswarm", env = "ANTIHALL_DEVSWARM_VERSION_ALERT", option = "version_alerts_devswarm", default = true }

[session.setting_repo_self_drift]
doc = "Switch: anti-hall's own repo-drift self-check (guards.repoSelfDrift)."
value = { section = "guards", key = "repoSelfDrift", env = "ANTIHALL_REPO_SELF_DRIFT", option = "guards_repo_self_drift", default = true }

[session.setting_gitignore_hint]
doc = "Switch: the weekly reminder to git-ignore .anti-hall/ (guards.gitignoreHint)."
value = { section = "guards", key = "gitignoreHint", env = "ANTIHALL_GITIGNORE_HINT", option = "guards_gitignore_hint", default = true }

[session.setting_progress_prune]
doc = "Switch: archive stale per-session progress files into the history ledger (maintenance.progressPrune); it has no environment variable."
value = { section = "maintenance", key = "progressPrune", env = "", option = "maintenance_progress_prune", default = true }

[session.setting_defect_nudge]
doc = "Switch: the once-a-day note about the defect channel (context.defectNudge); it has no environment variable."
value = { section = "context", key = "defectNudge", env = "", option = "context_defect_nudge", default = true }

# ---- version-alert (hooks/version-alert.js) --------------------------------------------------------------------

[session.version_alert_summary]
doc = "One-line description of the version-alert check in the generated reference."
value = "SessionStart advisory: a newer anti-hall release is available or already mirrored locally (port of version-alert.js); a stale remote cache defers to Node, which starts the refresh."

[session.version_alert_guard]
doc = "The guard id of version-alert, in its messages and in the skip file."
value = "version-alert"

[session.version_alert_ttl_ms]
doc = "How long the remote-latest cache counts as fresh (a release can ship within a day, so this is short)."
value = 7200000
unit = "ms"
min = 1000

[session.version_check_file]
doc = "The remote-latest cache the background refresh writes, under the home directory."
value = ".anti-hall/version-check.json"

[session.reload_mark_file]
doc = "The once-per-session marker of the reload advisory, under the home directory (separate from the remote-latest cache)."
value = ".anti-hall/version-alert-reload.json"

[session.plugin_json]
doc = "The running plugin's manifest, relative to the plugin root."
value = ".claude-plugin/plugin.json"

[session.mirror_cache_root]
doc = "Where the update skill mirrors each release, one version-named directory each, under the home directory."
value = ".claude/plugins/cache/anti-hall/anti-hall"

[session.marketplace_dir]
doc = "The marketplace clone, under the home directory; the host's plugin registry sits two levels above it."
value = ".claude/plugins/marketplaces/anti-hall"

[session.marketplace_env]
doc = "The environment variable that points the update skill at another marketplace directory (used by its tests); honoured only for an absolute path to an existing directory."
value = "ANTIHALL_MARKETPLACE_DIR"

[session.registry_file]
doc = "The host's plugin registry, relative to the plugins root."
value = "installed_plugins.json"

[session.registry_key]
doc = "The registry key of this plugin."
value = "anti-hall@anti-hall"

[session.registry_max_bytes]
doc = "The largest registry file read (a bigger one counts as unreadable)."
value = 4194304
unit = "bytes"
min = 1024

[session.changelog_file]
doc = "The changelog of a mirrored release, relative to its directory."
value = "CHANGELOG.md"

[session.headline_max]
doc = "The longest changelog highlight quoted, in UTF-16 units."
value = 160
min = 1

[session.highlight_prefix]
doc = "The prefix of the changelog highlight line."
value = "Highlight: "

[session.case_reload]
doc = "The case name stored in the reload advisory's dedupe key."
value = "reload"

[session.case_update]
doc = "The case name stored in the update advisory's dedupe key."
value = "update"

[session.reload_what]
doc = "Headline when a newer release is already mirrored and the registry is up to date; {mirrored} and {running} are the two versions."
value = "v{mirrored} is already downloaded (you are running v{running})."

[session.reload_instead]
doc = "Advice for that case when the registry does not name a newer build than the running one."
value = "tell the user now: run /reload-plugins (Claude; restart Claude Code if a hook or skill path still shows the old version afterwards) or restart Codex / start a fresh session (Codex)."

[session.reload_instead_ahead]
doc = "Advice for that case when the registry already names a newer build than the running one ({running} is the running version)."
value = "tell the user now: run /reload-plugins to load it (if a hook or skill path still shows v{running} afterwards, restart Claude Code: exit and resume the session). Codex: restart Codex / start a fresh session."

[session.unregistered_what]
doc = "Headline when a newer release is mirrored but the host has not registered it."
value = "v{mirrored} is downloaded locally (you are running v{running}) but the Claude Code harness has not registered it yet."

[session.unregistered_why]
doc = "Why line for that case."
value = "A reload alone will not pick it up until the harness registers it."

[session.unregistered_instead]
doc = "Advice for that case."
value = "tell the user now: run /anti-hall:update (Claude; syncs the cache AND the harness registration) or the anti-hall-update skill (Codex), then /reload-plugins (Claude) or restart (Codex)."

[session.update_what]
doc = "Headline when the remote-latest cache names a newer release; {latest} and {running} are the two versions."
value = "v{latest} is available (you are running v{running})."

[session.update_instead]
doc = "Advice for that case."
value = "tell the user now: run /anti-hall:update (Claude) or the anti-hall-update skill (Codex), then do what it ends with: /reload-plugins (Claude; restart Claude Code only if a hook or skill path still shows the old version afterwards); restart Codex / start a fresh session (Codex)."

# ---- devswarm-version (hooks/devswarm-version.js, hooks/lib/devswarm-baseline.js) --------------------------------------

[session.devswarm_summary]
doc = "One-line description of the devswarm-version check in the generated reference."
value = "SessionStart advisory: the DevSwarm CLI drifted by major or minor from the verified version (port of devswarm-version.js); a stale cache defers to Node, which starts the probe."

[session.devswarm_guard]
doc = "The guard id of devswarm-version, in its messages and in the skip file."
value = "devswarm-version"

[session.devswarm_cache]
doc = "The DevSwarm version cache the background probe writes, under the home directory."
value = ".anti-hall/devswarm-version.json"

[session.devswarm_baseline]
doc = "The DevSwarm CLI version anti-hall's integration was verified against (hooks/lib/devswarm-baseline.js); a test keeps the two equal."
value = "2.5.1"

[session.devswarm_what]
doc = "Headline of the DevSwarm drift advisory; {installed}, {baseline} and {newer} (the older-suffix or nothing)."
value = "DevSwarm {installed} is installed; anti-hall's integration is verified against {baseline}{newer}."

[session.devswarm_instead]
doc = "Advice of the DevSwarm drift advisory."
value = "see docs/KB-devswarm-hivecontrol.md."

