# ---- repo-self-drift (hooks/repo-self-drift.js, hooks/lib/repo-audit-baseline.js) ----------------------------------------

[session.repo_self_drift_summary]
doc = "One-line description of the repo-self-drift check in the generated reference."
value = "SessionStart advisory: docs/KB.md's claimed hook and skill counts differ from disk, or the model KBs were audited too long ago (port of repo-self-drift.js)."

[session.repo_self_drift_guard]
doc = "The guard id of repo-self-drift, in the skip file."
value = "repo-self-drift"

[session.repo_self_drift_cache]
doc = "The repo-self-drift scan cache, under the home directory."
value = ".anti-hall/repo-self-drift.json"

[session.hooks_dir]
doc = "The hooks directory, relative to the plugin root."
value = "hooks"

[session.skills_dir]
doc = "The skills directory, relative to the plugin root."
value = "skills"

[session.js_ext]
doc = "The extension that makes a file in the hooks directory count as a hook."
value = ".js"

[session.kb_installed]
doc = "Where docs/KB.md sits in an installed plugin, relative to the plugin root."
value = "docs/KB.md"

[session.kb_repo]
doc = "Where docs/KB.md sits in the development repository (three levels above the hooks directory), relative to the plugin root."
value = "../../docs/KB.md"

[session.hooks_claim_re]
doc = "Regex source (JavaScript syntax) of the hook count docs/KB.md claims; the first group is the number."
value = 'Hooks:\s*\*\*(\d+)\*\*\s*`\.js`\s*files'

[session.skills_claim_re]
doc = "Regex source (JavaScript syntax) of the skill count docs/KB.md claims; the first group is the number."
value = 'Claude\s*\n?>?\s*skills:\s*\*\*(\d+)\*\*'

[session.claim_max_digits]
doc = "The most digits of a claimed count compared here; a longer one is rounded by JavaScript, so the hook defers."
value = 15
min = 1
max = 15

[session.model_kb_audit_date]
doc = "The UTC date (YYYY-MM-DD) the model KBs were last audited (hooks/lib/repo-audit-baseline.js); a test keeps the two equal."
value = "2026-09-03"

[session.staleness_threshold_days]
doc = "How many days after the audit the model KBs count as stale (hooks/lib/repo-audit-baseline.js); a test keeps the two equal."
value = 60
min = 1

[session.drift_counts_line]
doc = "The count-drift advisory line; {parts} are the differing counts."
value = "anti-hall repo self-drift — {parts} (docs/KB.md)"

[session.drift_hooks_part]
doc = "The hook-count part of the count-drift line."
value = "hooks: KB.md claims {claimed}, actual {actual}"

[session.drift_skills_part]
doc = "The skill-count part of the count-drift line."
value = "skills: KB.md claims {claimed}, actual {actual}"

[session.parts_sep]
doc = "Separator between the parts of the count-drift line."
value = "; "

[session.drift_stale_line]
doc = "The model-KB staleness advisory line; {date}, {age} and {threshold} are the audit date and the days."
value = "anti-hall model KBs last audited {date} ({age}d ago, threshold {threshold}d) — re-verify model lineup/pricing"

# ---- defect-nudge (hooks/defect-nudge.js, hooks/lib/defect-store.js) -------------------------------------------------

[session.defect_nudge_summary]
doc = "One-line description of the defect-nudge check in the generated reference."
value = "SessionStart advisory, at most daily: unfinished defect reports (in the anti-hall repository) or rulings on defects this project reported (port of defect-nudge.js); counts and ages only."

[session.defect_nudge_guard]
doc = "The guard id of defect-nudge, in its messages and in the skip file."
value = "defect-nudge"

[session.defects_dir]
doc = "The defect store, relative to the state directory."
value = "defects"

[session.archive_dir]
doc = "Archived defects, relative to the defect store; one directory per month."
value = "archive"

[session.history_dir]
doc = "Backfilled history, relative to the defect store or to the project's .anti-hall directory (the progress ledger)."
value = "history"

[session.defect_ext]
doc = "The extension of a defect file."
value = ".jsonl"

[session.defect_stamp]
doc = "The once-a-day stamp of the defect sweep, relative to the state directory."
value = ".defects-nudge-stamp.json"

[session.defect_throttle_ms]
doc = "The least time between two defect sweeps."
value = 86400000
unit = "ms"
min = 1000

[session.anti_hall_marker]
doc = "The file whose presence in the working directory marks the anti-hall repository itself (the maintainer's view)."
value = "plugins/anti-hall/.claude-plugin/plugin.json"

[session.defect_open]
doc = "The status of a defect nobody has ruled on."
value = "open"

[session.defect_report]
doc = "The line type of a report."
value = "report"

[session.defect_ruling]
doc = "The line type of a ruling."
value = "ruling"

[session.defect_backfill]
doc = "The line type of a defect imported from git history."
value = "backfill"

[session.defect_fixed]
doc = "The ruling status that opens the regression cycle."
value = "fixed"

[session.defect_regressed]
doc = "The derived status of a fixed defect reported again by a build at or after its fix."
value = "regressed"

[session.defect_closed]
doc = "The statuses that mean a defect is finished (everything else is unfinished work)."
value = ["fixed", "wontfix", "notabug", "dup"]

[session.defect_maintainer_what]
doc = "Headline of the maintainer's nudge; {active}, {regressed} and {oldest} are counts and days."
value = "{active} unfinished defect reports ({regressed} regressed), oldest {oldest}d."

[session.defect_maintainer_instead]
doc = "Advice of the maintainer's nudge."
value = "run /anti-hall:defects."

[session.defect_reporter_what]
doc = "Headline of the reporter's nudge; {count} is the number of defects with a later ruling."
value = "rulings on {count} defects you reported."

[session.defect_reporter_instead]
doc = "Advice of the reporter's nudge."
value = "run /anti-hall:defects mine."

# ---- progress-prune (hooks/progress-prune.js, hooks/lib/gitignore-hint.js) -----------------------------------------------

[session.progress_prune_summary]
doc = "One-line description of the progress-prune check in the generated reference."
value = "SessionStart maintenance: archives stale per-session progress files into the history ledger before removing them, and reminds weekly to git-ignore .anti-hall/ (port of progress-prune.js)."

[session.progress_state_file]
doc = "The per-directory prune throttle state, relative to the state directory."
value = "progress-prune-state.json"

[session.gitignore_state_file]
doc = "The per-project gitignore reminder state, relative to the state directory."
value = "gitignore-hint-state.json"

[session.anti_hall_dir]
doc = "The per-project directory that holds progress, history and handovers."
value = ".anti-hall"

[session.progress_dir]
doc = "Per-session progress files, relative to the project's .anti-hall directory; one directory per UTC date."
value = "progress"

[session.progress_skip]
doc = "Entries of the progress directory that are never pruned."
value = ["legacy", "INDEX.md"]

[session.md_ext]
doc = "The extension of a progress or history file."
value = ".md"

[session.prune_safety_ms]
doc = "A progress file modified more recently than this is never archived."
value = 21600000
unit = "ms"
min = 1000

[session.prune_throttle_ms]
doc = "The least time between two prune passes of one working directory."
value = 86400000
unit = "ms"
min = 1000

[session.cwd_key_prefix]
doc = "Prefix of the throttle key made from a working directory."
value = "cwd_"

[session.quote_prefix]
doc = "Prefix of every archived line (a Markdown block quote)."
value = "> "

[session.archive_entry]
doc = "What is appended to the history ledger for one pruned progress file; {pruned_at} is the UTC time and {quote} the quoted content."
value = "\n## Archived progress (pruned {pruned_at})\n\n{quote}\n"

[session.dot_git]
doc = "The name that marks a git checkout's root."
value = ".git"

[session.gitdir_tag]
doc = "The prefix of the single line of a `.git` file that points at the real git directory."
value = "gitdir:"

[session.check_ignore_args]
doc = "The git arguments (after -C <root>) that ask whether .anti-hall/ is ignored: exit 0 ignored, 1 not ignored."
value = ["check-ignore", "-q", ".anti-hall/probe"]

[session.git_scrub_env]
doc = "Environment variables removed before git runs, so the answer derives from the project directory alone."
value = ["GIT_DIR", "GIT_WORK_TREE", "GIT_COMMON_DIR", "GIT_INDEX_FILE", "GIT_PREFIX"]

[session.gitignore_probe_ms]
doc = "The longest the engine waits for the gitignore probe before it hands the hook to Node. Node waits 3000 ms, but the client gives up on the engine after client.deadline_ms, so a longer wait here could answer after the client has already left; a test keeps the shipped value below that deadline."
value = 1000
env = "AH_ENGINE_GITIGNORE_PROBE_MS"
unit = "ms"
min = 10

[session.git_poll_ms]
doc = "How often the gitignore probe checks whether git has finished."
value = 5
unit = "ms"
min = 1
max = 100

[session.gitignore_remind_ms]
doc = "The least time between two gitignore reminders for one project."
value = 604800000
unit = "ms"
min = 1000

[session.gitignore_guard]
doc = "The guard id of the gitignore reminder in its message."
value = "gitignore-hint"

[session.gitignore_what]
doc = "Headline of the gitignore reminder."
value = ".anti-hall/ is not git-ignored in this repo."

[session.gitignore_why]
doc = "Why line of the gitignore reminder."
value = "Session notes must never be committed."

[session.gitignore_instead]
doc = "Advice of the gitignore reminder."
value = "add `.anti-hall/` to .gitignore (or run /anti-hall:doctor --repair)."
