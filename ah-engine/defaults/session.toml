value = "claude-cli-version"

[session.claude_cli_cache]
doc = "The Claude CLI version cache the background probe writes, under the home directory."
value = ".anti-hall/claude-cli-version.json"

[session.claude_cli_baseline]
doc = "The Claude Code version the harness KB was last audited against (hooks/lib/claude-cli-baseline.js); a test keeps the two equal."
