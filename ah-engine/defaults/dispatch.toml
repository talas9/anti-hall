[dispatch.msg_why_incomplete]
doc = "Reason in dispatch.msg_fail_closed when a guard event's Node hook finished but a process it left behind kept its output open, so the output is incomplete. Placeholder: {id}."
value = "hook {id} finished with incomplete output"

[dispatch.msg_stdin_over_cap]
doc = "Event-log detail when the payload on stdin is longer than client.max_stdin and is sent to Node hooks through an anonymous open file. Placeholder: {max}."
