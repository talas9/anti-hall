# ah-engine shipped defaults for the per-event dispatcher (D58, D87): `ah-engine hook --event <Event>` runs every hook
# entry of the table below that applies to the event and payload, built-in checks in the engine and the rest as their Node
# hooks, then combines the results the way the host combines separate hooks. Format: see the header of engine.toml.
#
# D87: THIS FILE IS THE TABLE OF RECORD, edited by hand. The plugin's `hooks.json` files (one thin trigger per event) and
# the wrapper's fallback list and map are generated FROM it by `ah-engine gen-hooks` and kept equal to it by
# tests/hooks_files.rs. A new hook or check is one row in the table of its host and event (plus, where it needs one, a
# `[entries.<id>]` default in hooks.toml); nothing else lists hooks.
#
# How the host combines hooks (the model the dispatcher reproduces):
# - Claude Code: "All matching hooks run in parallel"; exit 2 blocks and "even a JSON permissionDecision of allow
#   can't override it"; "When several hooks return additionalContext for the same event, Claude receives all of the
#   values"; "When multiple PreToolUse hooks return different decisions, precedence is deny > defer > ask > allow"
#   (code.claude.com/docs/en/hooks, sections Hook handler types, Exit code 2, Add context for Claude, PreToolUse
#   decision control).
# - Codex: "Multiple matching command hooks for the same event are launched concurrently, so one hook can't prevent
#   another matching hook from starting"; "Codex evaluates each matching handler independently"
#   (developers.openai.com/codex/hooks).
# One process returns one exit code and one stdout, so several values are joined into one in hooks.json order; see
# docs/AH-ENGINE.md (Dispatcher) for what that cannot express and when the dispatcher defers instead.

[dispatch.in_process]
doc = "Run the built-in checks inside the hook client (1) instead of asking the daemon (0, the default)."
value = 0
env = "AH_ENGINE_DISPATCH_IN_PROCESS"
min = 0
max = 1

[dispatch.default_host]
doc = "The host whose table is used when `--host` is not given."
value = "claude"

[dispatch.root_vars]
doc = "Per host, the environment variables that hold the plugin root, first set one wins; the host exports them to hook commands, a command naming an unset one cannot run, and a built-in check gets the root as its plugin_root."
value = { claude = ["CLAUDE_PLUGIN_ROOT"], codex = ["PLUGIN_ROOT", "CLAUDE_PLUGIN_ROOT"] }

[dispatch.shell]
doc = "The shell a Node hook command runs under, with its command flag (hooks.json commands are shell-form strings)."
value = ["/bin/sh", "-c"]

[dispatch.default_timeout_s]
doc = "The timeout of a Node hook whose hooks.json entry has none (0 in the table): the host's own default for a command hook (600 s on Claude per docs/KB-claude-code-hooks.md; Codex's default is not verified here, so the same bound is used). Never zero: a zero timeout would kill the hook at its first poll."
value = 600
unit = "s"
min = 1
max = 86400

[dispatch.max_timeout_s]
doc = "An upper bound on any Node hook's timeout, whatever its hooks.json entry says (the default is above every real timeout, so it changes nothing; tests lower it to exercise a hook that never exits)."
value = 86400
unit = "s"
env = "AH_ENGINE_DISPATCH_MAX_TIMEOUT_S"
min = 1
max = 86400

[dispatch.poll_ms]
doc = "How often the dispatcher checks whether its Node hooks have finished."
value = 2
unit = "ms"
min = 1
max = 100

[dispatch.read_ms]
doc = "How long the dispatcher waits for a finished Node hook's output pipes to drain."
value = 2000
unit = "ms"
min = 10
max = 30000

[dispatch.matcher_mode]
doc = "Per host, how a matcher is read: exact_or_regex (Claude: only letters, digits and the exact_chars is an exact name or a list split on | and comma, anything else an unanchored regex) or regex (Codex: always an unanchored regex)."
value = { claude = "exact_or_regex", codex = "regex" }

[dispatch.exact_chars]
doc = "Besides letters and digits, the characters a Claude matcher may contain and still be an exact name or list."
value = "_- ,|"

[dispatch.list_separators]
doc = "Characters that separate the names of an exact-list matcher."
value = "|,"

[dispatch.match_all]
doc = "Matcher values that match every occurrence of the event."
value = ["", "*"]

[dispatch.matcher_field]
doc = "Per event, the payload field a matcher is tested against; on an event not listed here the matcher is ignored."
value = { PreToolUse = "tool_name", PostToolUse = "tool_name", PostToolUseFailure = "tool_name", PermissionRequest = "tool_name", SessionStart = "source", SubagentStart = "agent_type", SubagentStop = "agent_type", PreCompact = "trigger", PostCompact = "trigger" }

[dispatch.tool_aliases]
doc = "Per host, extra names a tool also answers to when matching (Codex: matcher values Edit and Write also match apply_patch)."
value = { claude = {}, codex = { apply_patch = ["Edit", "Write"] } }

[dispatch.decision_precedence]
doc = "PreToolUse permissionDecision values, strongest first: the combined decision is the strongest any hook returned (Claude docs: deny > defer > ask > allow)."
value = ["deny", "defer", "ask", "allow"]

[dispatch.blocking_decisions]
doc = "JSON fields and values that block without exit 2: a top-level decision, or a hookSpecificOutput permissionDecision."
value = { decision = ["block"], permissionDecision = ["deny"] }

[dispatch.context_joiner]
doc = "Text placed between the additionalContext values of several hooks when they are joined into one."
value = "\n\n"

[dispatch.plain_context_events]
doc = "Events on which plain-text stdout (exit 0) is context for the model (docs/KB-claude-code-hooks.md: UserPromptSubmit, UserPromptExpansion, SessionStart, PostModelSwitch). When the dispatcher must deliver such text next to a hook's JSON it folds it into the merged additionalContext instead of moving it to stderr, where the model would not see it."
value = ["UserPromptSubmit", "UserPromptExpansion", "SessionStart", "PostModelSwitch"]

[dispatch.message_joiner]
doc = "Text placed between the systemMessage values of several hooks when they are joined into one."
value = "\n"

[dispatch.context_cap]
doc = "Per host, the characters of one hook's additionalContext the host delivers inline (Claude: 10000, documented at code.claude.com/docs/en/hooks; over it the host spills the whole value to a file and leaves a ~2000 character preview). The dispatcher joins several hooks' contexts into one value, so a join over the cap is logged as dispatch_context_over_cap; the host then spills it the way it spills any over-cap hook output, and nothing is cut by the engine. Codex documents its cap in tokens; the same count is a conservative proxy."
value = { claude = 10000, codex = 10000 }

[dispatch.msg_context_over_cap]
doc = "Event-log detail when the joined additionalContext of an event is over the host's inline cap."
value = "joined context is {len} characters, over the {cap} the host delivers inline"

[dispatch.guard_events]
doc = "Events whose hooks can block (guards): PreToolUse and PermissionRequest decide a tool call (Claude ignores exit 2 on PermissionRequest, so a fail-closed exit 2 there is harmless, and the event stays listed so a hook registered on it later is guarded from the start), Stop and SubagentStop can refuse to let the agent finish. When the dispatcher cannot run the Node hook of such an event it fails CLOSED (exit 2 with dispatch.msg_fail_closed): a deferral there must never read as an allow (D74)."
value = ["PreToolUse", "PermissionRequest", "Stop", "SubagentStop"]

[dispatch.stop_events]
doc = "Guard events whose exit 2 keeps the agent running instead of denying one call (Stop, SubagentStop). A fail-closed block there must be bounded, or an agent whose hooks cannot run could never finish: the payload's stop_hook_active true fails open, and so do more than dispatch.stop_block_cap consecutive fail-closed blocks in one session (the Node Stop hooks make the same stop_hook_active check)."
value = ["Stop", "SubagentStop"]

[dispatch.stop_block_cap]
doc = "How many consecutive fail-closed blocks a Stop or SubagentStop may answer in one session before every later one fails open with a log (the count resets when the guards run fine again)."
value = 2
min = 0
max = 100

[dispatch.stop_state_dir]
doc = "The directory under the state dir holding one consecutive-block counter file per event and session."
value = "stop-blocks"

[dispatch.stop_state_max_age_days]
doc = "Counter files of the Stop block counter older than this many days are removed (a session that ended while its guards were failing leaves one behind)."
value = 7
unit = "days"
min = 1
max = 365

[dispatch.stop_unknown_session]
doc = "Counter key for a Stop whose payload names no session (unreadable or cut off)."
value = "unknown"

[dispatch.spool_stale_s]
doc = "Age at which a named raw-payload stdin spool file from an older build or unlink failure is considered stale and removed. Keep this larger than the longest hook timeout."
value = 1800
unit = "s"
min = 1
max = 86400

[dispatch.msg_stop_active]
doc = "Printed on stderr (exit 0) when a Stop or SubagentStop would fail closed but the host says a Stop hook already blocked this turn (stop_hook_active). Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}), and a Stop hook already held this turn, so the agent is let finish rather than looped. Repair the install (`doctor --repair`)."

[dispatch.msg_stop_capped]
doc = "Printed on stderr (exit 0) when a Stop or SubagentStop would fail closed once more than dispatch.stop_block_cap times in a row. Placeholders: {event}, {cap}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}) {cap} times in a row, so the agent is let finish rather than looped. Repair the install (`doctor --repair`)."

[dispatch.msg_stop_uncounted]
doc = "Printed on stderr (exit 0) when a Stop or SubagentStop would fail closed but the consecutive-block count cannot be recorded, so the loop could not be bounded. Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}) and cannot count its blocks, so the agent is let finish rather than risk a loop. Repair the install (`doctor --repair`)."

[dispatch.defer_exit]
doc = "Exit code with which the dispatcher asks its wrapper to run the event's Node hooks one by one, as the host does (the joined output could not be delivered faithfully). EX_TEMPFAIL; the host reads it as a non-blocking hook error and shows stderr, so without a wrapper the deferral is visible, never silent."
value = 75
min = 1
max = 255

[dispatch.msg_fail_closed]
doc = "Printed on stderr (exit 2) when a guard event's Node hooks cannot run. Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}). The call is blocked rather than allowed unguarded; repair the install (`doctor --repair`) or retry."

[dispatch.msg_fail_closed_stop]
doc = "Printed on stderr (exit 2) when a Stop or SubagentStop cannot run its guards and the block is still within dispatch.stop_block_cap. Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}). The agent is held from finishing rather than let go unguarded; repair the install (`doctor --repair`) or retry (it is let finish after a few attempts)."

[dispatch.msg_panic]
doc = "Reason given in dispatch.msg_fail_closed when the dispatcher panicked."
value = "the dispatcher hit an internal error"

[dispatch.msg_defer_separately]
doc = "Printed on stderr with dispatch.defer_exit when the joined output is over the host's cap. Placeholders: {event}, {len}, {cap}."
value = "anti-hall: the joined {event} context is {len} characters, over the {cap} the host delivers inline; the hooks must run separately"

[dispatch.msg_skipped_entry]
doc = "Event-log detail when a non-guard event goes on without an entry that has no runnable Node command. Placeholder: {id}."
value = "entry {id} skipped: no runnable Node command"

[dispatch.msg_skipped_entry_stderr]
doc = "Printed on stderr when a non-guard event goes on without an entry that has no runnable Node command. Placeholders: {event}, {id}."
value = "anti-hall: skipped {event} Node hook {id}: no runnable Node command"

[dispatch.msg_defer]
doc = "Event-log detail when the dispatcher cannot answer an event and defers the whole call."
value = "dispatcher deferred the whole call: {why}"

[dispatch.msg_no_fallback]
doc = "Reason logged when a deferred hook entry has no runnable Node command."
value = "entry {id} deferred with no runnable Node command"

[dispatch.msg_conflict]
doc = "Reason logged when several hooks returned output one hook output cannot combine."
value = "hooks {ids} returned outputs that cannot be combined into one"

[dispatch.msg_unknown_host]
doc = "Error printed when `--host` names a host the dispatch table does not have."
value = "unknown host {host}: the dispatch table has {hosts}"

[dispatch.msg_bad_map]
doc = "Error printed when the `--fallback-map` file cannot be read as a JSON object of events to hook ids to commands."
value = "cannot read the fallback map {path}: {err}"

[protocol.dispatch]
doc = "The built-in checks of one event's dispatch table, evaluated by the daemon; the client runs the other entries and every deferral as their Node hooks."
value = { request = "D <client-version>\n<meta JSON: host, event, tool, root>\n<hook payload JSON>", reply = "OK <JSON array of [id, verdict, text]> | BUSY | ERR <reason>" }

[dispatch.msg_hook_timeout]
doc = "Event-log detail when a Node hook was still running at its timeout and was killed with its group (the host discards such a hook, so the call goes on)."
value = "the hook ran past its timeout and was killed; the host discards a timed-out hook"

[dispatch.msg_hook_died]
doc = "Event-log detail when a Node hook was killed by a signal or could not be waited for."
value = "the hook was killed by a signal or could not be waited for"

[dispatch.msg_hook_spawn]
doc = "Event-log detail when a Node hook's command could not be started."
value = "the hook's command could not be started"

[dispatch.msg_why_spawn]
doc = "Reason in dispatch.msg_fail_closed when a guard event's Node hook could not be started. Placeholder: {id}."
value = "hook {id} could not be started"

[dispatch.msg_why_died]
doc = "Reason in dispatch.msg_fail_closed when a guard event's Node hook was killed by a signal. Placeholder: {id}."
