[dispatch.thin_timeout_s]
doc = "The timeout of the thin trigger of an event the table has no entry for (an event with entries takes the longest timeout among them)."
value = 10
unit = "s"
min = 1
max = 3600

# D87: the events every host gets a thin trigger for, whether or not the table has an entry for them yet: the engine decides
# per event from the table and the config what to run, and answers the host with the neutral no-op when nothing applies.
# Claude: all 33 events of the official hooks reference (docs/KB-claude-code-hooks.md section 1) EXCEPT WorktreeCreate and
# WorktreeRemove (decision D87 exception, 1.43): a WorktreeCreate hook REPLACES the default worktree creation (it must create
# the worktree and print its path) and a non-zero exit on either event fails the operation, so a silent trigger would break
# worktree creation in every project; no neutral pass-through exists for an event whose hook is the operation. They get a
# trigger when the engine implements worktree create/remove itself, with tests.
# Codex: the events the Codex hooks reference lists (docs/KB-codex-platform-hooks-plugins.md).
[dispatch.thin_events]
doc = "Per host, the events that get a thin trigger in the generated hooks.json besides the events the table has entries for (D87; WorktreeCreate and WorktreeRemove are excluded on Claude because a hook there replaces the operation and cannot be a silent trigger)."
