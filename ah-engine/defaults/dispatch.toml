[dispatch.msg_spool_sweep]
doc = "Event-log detail when stale named raw-payload spool files were removed. Placeholder: {n}."
value = "removed {n} stale dispatch stdin spool file(s)"

[dispatch.thin_command]
doc = "The command of each event's thin trigger in the generated hooks.json (D87). Placeholders: {var} the host's plugin-root variable (the first of dispatch.root_vars), {event} the event, {extra} the host's dispatch.thin_host_args."
