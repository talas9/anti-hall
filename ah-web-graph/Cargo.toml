[package]
name = "ah-web-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared node-graph component for the Command Center (agents, system topology, rules/hooks editor): Full (wgpu + DOM cards) and Lite (static SVG) tiers"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Full tier: the WebGPU wire/particle layer. Lite = this feature off (no wgpu in the binary).
full = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "DomRect",
  "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "EventTarget", "Event", "DomTokenList", "CssStyleDeclaration",
  "Performance", "console", "MediaQueryList", "ResizeObserver", "ResizeObserverEntry", "DomRectReadOnly", "Navigator",
] }
js-sys = "0.3"
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = { version = "0.8.3", default-features = false, features = ["stable_graph"] }
rust-sugiyama = "0.4.0"
fdg-sim = { version = "0.9.1", default-features = false }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"], optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
