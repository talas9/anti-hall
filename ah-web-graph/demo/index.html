<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ah-web-graph demo</title>
<link rel="stylesheet" href="graph.css">
<style>
  :root { color-scheme: dark; --bg: oklch(0.13 0.03 262); --line: oklch(0.28 0.045 262); --text: oklch(0.92 0.02 262); --muted: oklch(0.71 0.05 262); --cy: oklch(0.83 0.13 210); }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: radial-gradient(1200px 600px at 35% 35%, oklch(0.2 0.05 262), var(--bg) 70%); color: var(--text); font: 14px Inter, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font: 600 16px "Space Grotesk", Inter, system-ui, sans-serif; letter-spacing: .04em; }
  h1 small { color: var(--muted); letter-spacing: .18em; text-transform: uppercase; font-weight: 400; margin-left: 8px; }
  .chip { font: 12px ui-monospace, Menlo, monospace; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  nav { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  button, a.btn { min-height: 36px; padding: 0 16px; border: 0; background: transparent; color: var(--muted); font: 600 12px Inter, system-ui, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button[aria-pressed="true"] { background: oklch(0.83 0.13 210 / .14); color: var(--cy); }
  main { flex: 1; display: flex; flex-direction: column; padding: 18px 20px; min-height: 0; }
  section.graph { height: calc(100dvh - 190px); min-height: 480px; }
  section[hidden] { display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
</style>
</head>
<body>
<header>
  <h1>anti-hall<small>Command Center</small></h1>
  <span class="chip">graph component demo</span>
  <span class="chip">tier: <b id="tier">?</b></span>
  <span class="chip">backend: <b id="backend">?</b></span>
  <span style="flex:1"></span>
  <nav aria-label="Tier"><a class="btn" href="?tier=full">Full</a><a class="btn" href="?tier=lite">Lite</a></nav>
</header>
<main>
  <div class="row">
    <nav aria-label="Graphs">
      <button data-tab="agents" aria-pressed="true">Agents (30)</button>
      <button data-tab="topology" aria-pressed="false">Topology (15)</button>
      <button data-tab="hooks" aria-pressed="false">Rules / hooks (40)</button>
    </nav>
    <button id="trace" style="border:1px solid var(--line);border-radius:10px">Trace execution</button>
  </div>
  <section class="graph" id="s-agents"><div id="g-agents" style="height:100%"></div></section>
  <section class="graph" id="s-topology" hidden><div id="g-topology" style="height:100%"></div></section>
  <section class="graph" id="s-hooks" hidden><div id="g-hooks" style="height:100%"></div></section>
</main>
<script type="module" src="boot.js"></script>
<script type="module">
  setInterval(() => { const g = document.querySelector('section:not([hidden]) .ahg'); if (g) document.getElementById('backend').textContent = g.dataset.backend; }, 500);
</script>
</body>
</html>
