[afk.msg_needs_owner_head]
doc = "Heading of the NEEDS OWNER list printed first by back / progress. Placeholders: {n}."
value = "NEEDS OWNER ({n}):"

[afk.action_nudged]
doc = "afk_question_parked action label: a turn ending on a plain-text question was held with the ladder."
value = "nudged"

[afk.action_listed]
doc = "afk_question_parked action label: NEEDS OWNER bullets printed by back / progress."
value = "listed"

[afk.concise_text]
doc = "The concise reply rule injected at session start on Codex (Claude gets it from the shipped output style `concise`)."
value = "Reply style: lead with the answer; 1-3 lines unless asked for detail; no recap of what you did; no narration between tool calls."

[afk.window_bytes]
doc = "Transcript tail window (bytes) read at Stop to find the turn's assistant entries and their usage."
value = 2097152
min = 65536
max = 16777216

[afk.line_max_bytes]
doc = "Longest transcript line parsed for usage (a longer line is skipped; its tokens are not counted)."
value = 1048576
min = 4096
max = 16777216

[afk.max_lines]
doc = "Most transcript lines parsed at Stop (the newest)."
value = 3000
min = 10
max = 100000

[afk.mode_afk]
doc = "Label value of afk_output_tokens / afk_turns_measured for a turn that ended while AFK."
value = "afk"

[afk.mode_present]
doc = "Label value for a turn that ended while the owner was present."
value = "present"

[afk.action_nudge]
doc = "afk_overlong_turns action label: the first overlong reply (nudged on the next turn)."
value = "nudge"

[afk.action_block]
doc = "afk_overlong_turns action label: an overlong reply held at Stop."
value = "block"

[afk.action_capped]
doc = "afk_overlong_turns action label: an overlong reply let through because afk.max_blocks was reached."
value = "capped"

[cmd.afk]
doc = "AFK mode, machine-wide: `on` starts it (agents work silently and log milestone bullets to their progress files), `off` ends it, `status` shows it. Lasts until `back` / `off`. Settings: afk.*."
value = { args = "on|off|status", read_only = false, read_only_args = ["status"], status = "implemented" }

[cmd.back]
doc = "End AFK mode and print each session's digest: the checklist bullets after the AFK marker in its progress file, with the percentage of [x] bullets."
value = { args = "", read_only = false, status = "implemented" }

[metric.afk_entered]
doc = "AFK periods started, by how (manual = ah-engine afk on, prompt = typed afk, idle = idle detection). Counted by the first hook that sees the new period."
value = { kind = "counter", unit = "events", labels = ["how"] }

[metric.afk_turns]
doc = "Main-session turns that ended (Stop) while AFK."
value = { kind = "counter", unit = "turns", labels = [] }

[metric.digest_entries]
doc = "Digest bullets printed by back / progress (CLI counts are added by the next hook)."
value = { kind = "counter", unit = "entries", labels = [] }

[metric.idle_trips]
doc = "AFK periods started by idle detection."
value = { kind = "counter", unit = "events", labels = [] }

[metric.afk_overlong_turns]
doc = "Overlong AFK replies, by action (nudge, block, capped)."
value = { kind = "counter", unit = "events", labels = ["action"] }

[metric.afk_lock_lost]
doc = "Flag writes of a hook that did not publish: the flag lock was taken over before the fenced commit (afk.fence_infix), or the write failed. Nothing of that hook landed."
value = { kind = "counter", unit = "events", labels = [] }

[metric.afk_idle_revoked]
doc = "Idle AFK entries discarded while their fenced commit was pending because the owner presence or the flag's `ended` watermark (a `back`) moved past the value the idle decision used: found by the host re-check right before the rename, or after a lost lock (counted here, not afk_lock_lost, when the watched value moved). Nothing of that hook landed."
value = { kind = "counter", unit = "events", labels = [] }

[metric.afk_question_denied]
doc = "AFK question-tool calls denied with the question ladder, by tool (every call while AFK; no cap)."
value = { kind = "counter", unit = "events", labels = ["tool"] }

[metric.afk_plan_autoapproved]
doc = "Plan-approval tool calls auto-approved while AFK (afk.planAutoApprove) after a fresh advisor consult of the same session's main thread."
value = { kind = "counter", unit = "events", labels = [] }

[metric.afk_plan_autoapprove_denied]
doc = "Plan-approval tool calls left to the normal approval prompt, by reason (afk.plan_reason_*: off, afk_off, subagent, no_input, no_marker, stale, state_error, clock_backwards, owner_prompt, plan_unbound, plan_changed, plan_mismatch, afk_changed)."
value = { kind = "counter", unit = "events", labels = ["reason"] }

[metric.afk_plan_stamp_failed]
doc = "Plan auto-approve stamps that could not be written and read back, by field (witness, promptSeq, planSeq, consultSeq); a failed consult stamp only means no auto-approval, a failed prompt stamp is caught by the witness."
value = { kind = "counter", unit = "events", labels = ["field"] }

[metric.afk_question_parked]
doc = "AFK questions turned into work, by action: nudged (a turn ending on a plain-text question held with the ladder), capped (let through after afk.question_max_holds), listed (NEEDS OWNER bullets printed by back / progress; CLI counts are added by the next hook)."
value = { kind = "counter", unit = "events", labels = ["action"] }

[metric.afk_output_tokens]
doc = "Output tokens of main-session turns (transcript usage, deduplicated by message id), by mode (afk, present). Divide by afk_turns_measured for the per-turn average."
value = { kind = "counter", unit = "tokens", labels = ["mode"] }

[metric.afk_turns_measured]
doc = "Main-session turns whose output tokens were measured, by mode (afk, present)."
value = { kind = "counter", unit = "turns", labels = ["mode"] }
