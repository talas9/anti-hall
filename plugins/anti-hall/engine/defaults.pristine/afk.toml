[afk.session_prefix]
doc = "Prefix of the per-session AFK state file under the per-user state directory (the sanitised session id and the JSON extension follow). `ah-engine back` reads these to find each session's progress file."
value = "afk-sess-"

[afk.lock_file]
doc = "The cross-process lock file (under the per-user state directory) every read-modify-write of the flag file takes: hooks and `ah-engine afk` / `back` re-read the flag under it, so a stale ON copy never overwrites a newer OFF. A hook that cannot take it writes nothing."
value = "afk.json.lock"

[afk.lock_stale_ms]
doc = "A flag lock older than this is taken over, whatever its holder. The holder it was taken from can no longer publish: every flag write is a fenced commit (afk.fence_infix)."
value = 5000
unit = "ms"
min = 100
max = 600000

[afk.lock_wait_ms]
doc = "The lock budget of one hook call: all its tries for the flag lock together wait at most this long, and after a failed try the call takes no other (it then writes nothing)."
value = 300
unit = "ms"
min = 1
max = 10000

[afk.cli_lock_wait_ms]
doc = "How long `ah-engine afk on|off` and `ah-engine back` retry the flag lock (a live holder is never taken over); still busy: they write nothing, print afk.msg_lock_busy and exit non-zero. Keep it below afk.lock_stale_ms."
value = 3000
unit = "ms"
min = 1
max = 60000

[afk.fence_infix]
doc = "The fenced commit of the flag file (GH #426): a holder stages <flag><infix><its lock token>, re-checks that the lock is still its own, then renames; every holder removes all <flag><infix>* stages right after taking the lock, before reading the flag. So a holder whose expired lock was taken over can never publish a stale ON over the new holder's OFF. Must not be empty."
value = ".stage-"

[afk.msg_lock_lost]
doc = "The `why` placeholder of afk.msg_write_failed when the flag lock was taken over before the command published (nothing was written)."
value = "the flag lock was taken over before the write; nothing written"

[afk.lock_step_ms]
doc = "The pause between two tries for the flag lock."
value = 5
unit = "ms"
min = 1
max = 1000

[afk.lock_reclaim_stale_ms]
doc = "A takeover marker of the flag lock older than this is taken over."
value = 5000
unit = "ms"
min = 100
max = 600000

[afk.lock_release_tries]
doc = "How many times a release of the flag lock tries to take the takeover marker."
value = 5
min = 1
max = 100

[afk.lock_release_step_ms]
doc = "The pause between those tries."
value = 10
unit = "ms"
min = 1
max = 1000

[afk.lock_boot_slop_s]
doc = "Two boot times closer than this many seconds are the same boot (flag lock holder liveness)."
value = 5
