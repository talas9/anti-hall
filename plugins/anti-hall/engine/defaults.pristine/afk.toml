# AFK mode (GH #425): silent work with a bullet digest while the owner is away. One check, `afk-mode` (engine-only, no Node twin),
# runs on UserPromptSubmit, PreToolUse, PostToolUse and Stop (Claude) and on SessionStart, UserPromptSubmit, PostToolUse and Stop
# (Codex; there Stop only holds a question):
#   1. signals: the machine-wide flag file (afk.flag_file under the per-user state directory) is set by `ah-engine afk on`, by the
#      owner typing `afk`, or by idle detection (no owner prompt for afk.idleMinutes); it lasts until `back` (`ah-engine back` or the
#      owner typing `back`); an idle-entered AFK also ends on the owner's next prompt;
#   2. behaviour: the rule (afk.rule_text) is injected once per session when AFK starts, plus a short reminder at a capped interval in
#      long turns; existing guards are unchanged;
#   3. digest: the session's own progress file (.anti-hall/progress/<date>/<session>.md) gets an AFK marker line; the agent appends
#      one checklist bullet per milestone after it; `back` / `progress` print the bullets since the marker with a percentage;
#   4. enforcement (owner decision, overrides #425 (d) "no blocking guard"): while AFK, a Stop whose final reply is over the limits
#      is nudged once, then held at most afk.max_blocks times per AFK period and session (never on stop_hook_active, fail-open);
#   5. measurement: output tokens per turn from the transcript usage fields, split AFK vs present (afk_output_tokens{mode});
#   6. no blocking questions (owner requirement on #425): while AFK a PreToolUse hook denies the harness question tool
#      (afk.question_tools) EVERY time with the question ladder (afk.msg_ladder_deny; no cap, only a hook error lets it through), and
#      a turn that ends on a plain-text question is held at Stop with the ladder (capped, afk.question_max_holds); `back` / `progress`
#      list NEEDS OWNER bullets first;
#   7. subagents (payloads with an agent marker) never get the rule and never touch the parent's once-per-session state; their
#      question-tool calls ARE denied while AFK (they are part of the autonomous run);
#   8. the flag file is only rewritten under its lock (afk.lock_file), re-read inside it, so OFF wins over a stale ON; every write is
#      a fenced commit (afk.fence_infix), so a holder whose expired lock was taken over never publishes after the new holder; a hook has
#      one lock budget per call (afk.lock_wait_ms) and writes nothing without the lock; `ah-engine afk` / `back` wait at most
#      afk.cli_lock_wait_ms, never take over a live holder, and exit non-zero writing nothing when the lock stays busy;
#   9. owner presence (afk.presence_file) never moves backwards, and idle detection counts from the later of the last owner prompt
#      and the flag's `ended` time (the last `back`), so a stale presence write cannot re-enter AFK right after `back`;
#  10. plan auto-approve (afk.planAutoApprove, Claude only), FAIL CLOSED: while AFK the PreToolUse hook approves the plan-approval
#      tool (afk.plan_tools) with allow + updatedInput (the input echoed) only when this session's main thread has a hook-recorded
#      advisor consult (PostToolUse on advisor.tool_names) that is SEQUENCE-newer (not wall-clock) than its last plan-file write,
#      plan-approval attempt and owner prompt; the consult is bound to the plan file's path + SHA-256, the AFK period (flag epoch) and
#      the per-session owner-prompt witness (afk.plan_prompt_ns); a clock earlier than the newest one seen, an unreadable/unwritable
#      record (read back after every write), a changed plan file or plan text, or a flag that is not on with the same epoch when
#      re-read at decision time: nothing is approved. One consult approves one attempt. Every denial is counted
#      (afk_plan_autoapprove_denied{reason}); a stamp that could not be recorded is counted (afk_plan_stamp_failed{field}).
#      Codex has no plan-approval tool in the anti-hall hook table, so nothing is approved there.
# Logic: engine/logic/afk-mode.js. Every phrase, pattern, number and text is here (D88). Regular expressions are Rust syntax.

[afk.set_enabled]
doc = "The afk.enabled setting (master switch): off turns the whole AFK feature off (no idle detection, no prompt commands, no rule, no enforcement, no measurement); the `ah-engine afk` verbs still edit the flag."
