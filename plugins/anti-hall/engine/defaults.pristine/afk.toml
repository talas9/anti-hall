value = { section = "afk", key = "noQuestions", kind = "bool", env = "", aliases = [], option = "", manifest_default = "", default = true }

[afk.set_plan_autoapprove]
doc = "The afk.planAutoApprove setting: while AFK only, approve the plan-approval tool (afk.plan_tools) from its PreToolUse hook (allow + updatedInput, the documented contract) when this session's main thread consulted the advisor after (by sequence, not wall clock) its last plan-file write, plan-approval attempt and owner prompt, the plan file still has the consulted content, the clock never went backwards and AFK is still on in the same period when re-read. Fail closed: anything else (no or stale consult, AFK off or cycled, a subagent, a state read/write error, a changed plan, a clock rollback, a hook error) leaves the normal approval prompt. Off = never auto-approved."
value = { section = "afk", key = "planAutoApprove", kind = "bool", env = "", aliases = [], option = "", manifest_default = "", default = true }

[afk.guard_name]
doc = "The guard id this check answers to in skip.json and in its messages."
value = "afk-mode"

[afk.summary]
doc = "One-line description of the afk-mode check in the generated reference."
value = "UserPromptSubmit, PreToolUse, PostToolUse, Stop (Claude) / SessionStart, UserPromptSubmit, PostToolUse, Stop (Codex): AFK mode. Machine-wide flag (ah-engine afk on|off, typed afk/back/progress, idle detection), a once-per-session rule and capped reminders, a checklist digest in the session progress file (NEEDS OWNER bullets first), a capped Stop hold of overlong AFK replies, no blocking questions (AskUserQuestion denied with the question ladder, a capped hold of a turn ending on a question), output tokens per turn AFK vs present (afk.*)."

[afk.flag_file]
doc = "The machine-wide AFK flag file, under the per-user state directory (replykit.state_dir). JSON {on, how, since, epoch, counted, pending_digest}."
value = "afk.json"

[afk.presence_file]
doc = "The machine-wide owner-presence file (time of the last owner prompt), under the per-user state directory."
