# ah-engine shipped defaults for the `session-end-mcp-reaper` check (hooks/session-end-mcp-reaper.js and companion/mcp-reaper.js):
# the SessionEnd sweep that terminates orphaned MCP server processes a crashed earlier session left behind. Format: see the
# header of engine.toml.
#
# Every selection rule of the Node hook is a setting here: which processes count as MCP servers, the age floor, the runners and
# dev servers that are never reaped, the init names PID 1 must carry, the cap, and the grace period between the polite and the
# forced signal. The decision is the plugin script `engine/logic/session-end-mcp-reaper.js` (D88); the process listing, the age and
# service-manager probes, the bounded signal and the bounded sleep it calls are the generic `ah.proc.*` primitives, configured in
# host_proc.toml. The engine kills exactly what the Node hook would and never more: a process is a candidate only when ALL of
# these hold: the sweep reason is a real termination, PID 1 is an init process, the process is parented to PID 1, its command line
# matches the MCP signature, it is not excluded by the user's pattern or the runner list, it is old enough, and the platform's
# service manager does not own it. What the host cannot decide the way Node would (a probe it cannot read, an ambiguous local time)
# is handed to the Node hook before anything is written or signalled.
#
# The regular expressions are JavaScript source (case-insensitive unless noted), the very ones the Node companion has.

[mcp_reaper.summary]
doc = "One-line description of the session-end-mcp-reaper check in the generated reference."
value = "SessionEnd sweep of orphaned MCP server processes (parent PID 1, MCP command signature, old enough, not service-managed, never test runners), with Node's selection rules and audit log; a user pattern or start time it cannot read exactly defers to Node (port of session-end-mcp-reaper.js)."

[mcp_reaper.setting]
doc = "Where the reaper's on/off switch is read from (maintenance.sessionEndReaper, default on; the deprecated environment alias is read too)."
value = { section = "maintenance", key = "sessionEndReaper", env = "ANTIHALL_SESSION_END_REAPER", aliases = ["ANTI_HALL_SESSION_END_REAPER"], option = "maintenance_session_end_reaper", default = true }

[mcp_reaper.match_setting]
doc = "Where the user's extra MCP process pattern is read from (guards.reaperMatch, a JavaScript regular expression, empty = none)."
value = { section = "guards", key = "reaperMatch", env = "ANTIHALL_REAPER_MATCH", default = "" }

[mcp_reaper.exclude_setting]
doc = "Where the user's exclusion pattern is read from (guards.reaperExclude, a JavaScript regular expression, empty = none): a process it matches is never reaped."
value = { section = "guards", key = "reaperExclude", env = "ANTIHALL_REAPER_EXCLUDE", default = "" }

[mcp_reaper.act_reasons]
doc = "The SessionEnd reasons on which the sweep runs at all; any other reason (clear, resume, logout) does nothing and runs no process listing."
value = ["prompt_input_exit", "other"]

[mcp_reaper.reason_fields]
doc = "The payload fields that carry the reason, in order: the measured wire field first, the documented one as a fallback."
value = ["reason", "end_reason"]

[mcp_reaper.min_age_env]
doc = "The environment variable that sets the age floor in seconds (a number, read the way JavaScript's Number reads it; anything not a finite number of at least zero falls back to the default)."
value = "ANTI_HALL_SESSION_END_REAPER_MIN_AGE_S"

[mcp_reaper.min_age_default_s]
doc = "The age floor in seconds: a process younger than this is never reaped."
value = 60
unit = "s"

[mcp_reaper.max_env]
doc = "The environment variable that sets the cap on processes reaped per sweep (read like the age floor)."
value = "ANTI_HALL_SESSION_END_REAPER_MAX"

[mcp_reaper.max_default]
doc = "The cap on processes reaped per sweep."
value = 16

[mcp_reaper.grace_ms]
doc = "How long the sweep waits between the polite signal and the re-check that decides who gets the forced one."
value = 500
unit = "ms"

[mcp_reaper.log_max_bytes]
doc = "The audit log stops growing past this size."
value = 5242880
unit = "bytes"

[mcp_reaper.log_dir]
doc = "The audit log directory under the base directory."
value = "logs"

[mcp_reaper.log_file]
doc = "The audit log file name."
value = "session-end-reaper.log"

[mcp_reaper.mcp_self_re]
doc = "JavaScript regex source (case-insensitive) of a command line that is never an MCP server: the reaper tooling itself."
value = 'mcp-reaper'

[mcp_reaper.runtime_re]
doc = "JavaScript regex source (case-sensitive) of the program names (argv0 basename) that legitimately launch MCP servers."
value = '^(node|nodejs|npx|npm|pnpm|yarn|deno|bun|python|python3|uvx|uv)$'

[mcp_reaper.modelctx_re]
doc = "JavaScript regex source (case-insensitive) of the @modelcontextprotocol package scope, always a match."
value = '@?modelcontextprotocol\b'

[mcp_reaper.token_re]
doc = "JavaScript regex source (case-insensitive) of a boundary-anchored mcp-server or server-sequential-thinking token."
value = '(^|[\s/])(mcp[-_]server|server-sequential-thinking)'

[mcp_reaper.token_argv0_re]
doc = "JavaScript regex source (case-insensitive) of a program name that is itself such a token."
value = '^(mcp[-_]server|server-sequential-thinking)'

[mcp_reaper.start_re]
doc = "JavaScript regex source (case-insensitive) of `mcp start` as a discrete command token."
value = '(^|\s)mcp\s+start(\s|$)'

[mcp_reaper.start_program]
doc = "The program name that may itself be the `mcp start` command."
value = "mcp"

[mcp_reaper.suffix_re]
doc = "JavaScript regex source (case-insensitive) of a `<name>-mcp` package token, bounded on the left by the start, white space or a slash and on the right by white space, a slash or the end."
value = '(^|[\s/])([a-z0-9][a-z0-9._-]*-mcp)(?=[\s/]|$)'

[mcp_reaper.scoped_re]
doc = "JavaScript regex source (case-insensitive) of an `@scope/mcp` package token."
value = '(^|\s)@[a-z0-9][a-z0-9._-]*/mcp(?=[\s/]|$)'

[mcp_reaper.suffix_argv0_re]
doc = "JavaScript regex source (case-insensitive) of a program name that is itself a `<name>-mcp` binary."
value = '-mcp$'

[mcp_reaper.runner_exclude_res]
doc = "JavaScript regex sources (case-insensitive) of test runners and dev servers that are never reaped, even when a file name merely looks like an MCP server."
value = [
  '(^|[\s/\\])vitest\b',
  '(^|[\s/\\])jest(-worker)?\b',
  '(^|[\s/\\])playwright\b',
  '(^|[\s/\\])ts-node\b',
  '(^|[\s/\\])tsx\b',
  '(^|[\s/\\])next(-server\b|\s+dev\b)',
  '(^|[\s/\\])webpack(-dev-server\b|\s+serve\b)',
]

[mcp_reaper.init_names]
doc = "The program names PID 1 must carry for the sweep to run at all: in a container PID 1 is the entrypoint and every child of it is normal, not a leaked orphan."
value = ["launchd", "systemd", "init"]

[mcp_reaper.orphan_ppid]
doc = "The parent pid that marks an orphan: the kernel reparents a process whose parent died to PID 1."
value = 1

[mcp_reaper.event_scan]
doc = "The audit log event name of a completed scan."
value = "scan"

[mcp_reaper.event_skip]
doc = "The audit log event name of a sweep that did not run."
value = "skip"

[mcp_reaper.action_skip]
doc = "The audit log action of a candidate that was skipped."
value = "skip"

[mcp_reaper.action_term]
doc = "The audit log action of the polite signal."
value = "term"

[mcp_reaper.action_kill]
doc = "The audit log action of the forced signal."
value = "kill"

[mcp_reaper.reason_pid1]
doc = "The audit log reason when PID 1 is not an init process."
value = "pid1-not-init"

[mcp_reaper.reason_launchd]
doc = "The audit log reason for a candidate the macOS service manager owns."
value = "launchd-managed"

[mcp_reaper.reason_launchd_unverifiable]
doc = "The audit log reason for every candidate when the service-manager listing failed."
value = "launchd-unverifiable"

[mcp_reaper.reason_systemd]
doc = "The audit log reason for a candidate that is a systemd service."
value = "systemd-service"


# ---- the standalone reaper as an engine schedule job (port of companion/mcp-reaper.js + install-reaper.js) -------------------
#
# The opt-in background reaper the Node companion ran every 60 s from its own launchd / systemd unit is the engine schedule job
# `mcp_reaper`: the daemon's scheduler runs `ah-engine mcp-reaper run` as a subprocess, and the selection is the plugin script
# `engine/logic/rules/mcp-reaper.js` (D88). The selection is the companion's own, which is broader than the SessionEnd sweep above:
# a process is an orphan when its command line has the MCP signature, the user's exclusion does not match it, and its parent is
# PID 1, or is in the snapshot and is a reaper (launchd, `systemd --user`, the WSL relay). A parent missing from the snapshot is
# unsure and skipped. Signals go out polite first, then, after the grace period and a fresh listing that must select the same pid
# again, forced. The log lines are the companion's, in the companion's log file.

[cmd.mcp-reaper]
doc = "The standalone MCP orphan reaper as an engine command (the port of companion/mcp-reaper.js): `run` makes one sweep (the scheduled job `mcp_reaper` runs it every mcp_reaper.job_every_ms), `--dry-run` logs what it would reap and signals nothing. It does nothing while maintenance.mcpReaperJob is off, on auto until the Node reaper's opt-in was carried over (`ah-engine units heal`), and while a Node reaper unit is still installed, so the reaper never runs twice. Prints one JSON line."
value = { args = "run [--dry-run]", read_only = false, status = "implemented" }

[job.mcp_reaper]
doc = "The standalone MCP orphan reaper (the companion's 60 s background job): one `ah-engine mcp-reaper run` per interval, as a subprocess in its own process group. The run itself decides whether the reaper is on (maintenance.mcpReaperJob)."
value = { kind = "engine", action = "mcp_reaper", every_key = "mcp_reaper.job_every_ms", jitter_ms = 0, timeout_ms = 60000, retries = 0, backoff_ms = 5000, backoff_max_ms = 60000, cooldown_ms = 60000, catch_up = "skip", persist = false }

[mcp_reaper.job_every_ms]
doc = "Interval of the mcp_reaper job (the Node unit's StartInterval was 60 s); 0 turns the job off."
value = 60000
env = "AH_ENGINE_MCP_REAPER_MS"
unit = "ms"

[mcp_reaper.job_setting]
doc = "The switch of the reaper job, maintenance.mcpReaperJob: off never runs it; on always runs it; auto (the default) runs it once the Node reaper's opt-in was carried over, which `ah-engine units heal` records when it retires a Node reaper unit. The Node reaper was opt-in (installed by hand), so auto keeps exactly the machines that had it."
value = { section = "maintenance", key = "mcpReaperJob", env = "ANTIHALL_MCP_REAPER_JOB", aliases = [], option = "", default = "auto", values = ["auto", "on", "off"] }

[mcp_reaper.job_word_off]
doc = "The value of maintenance.mcpReaperJob that switches the job off."
value = "off"

[mcp_reaper.job_word_auto]
doc = "The value of maintenance.mcpReaperJob that runs the job only once the Node opt-in was carried over."
value = "auto"

[mcp_reaper.job_optin_rel]
doc = "The marker of a carried-over Node opt-in, relative to the home directory: written by `ah-engine units heal` when it retires a Node reaper unit, read by the job on auto."
value = ".anti-hall/ah-engine/units/mcp-reaper.optin"

[mcp_reaper.job_node_units]
doc = "The unit files the Node installer (companion/install-reaper.js) writes, relative to the home directory. While one exists the job stands down: the Node reaper still runs, and two reapers never run at once."
value = ["Library/LaunchAgents/com.anti-hall.mcp-reaper.plist", ".config/systemd/user/anti-hall-mcp-reaper.timer", ".config/systemd/user/anti-hall-mcp-reaper.service"]

[env.mcp_reap_dryrun]
doc = "The environment variable that makes a reaper run a dry run when it is exactly mcp_reaper.job_dry_word (the companion's MCP_REAP_DRYRUN). The command reads it and hands it to the script."
value = "MCP_REAP_DRYRUN"

[mcp_reaper.job_dry_word]
doc = "The value of the dry-run variable that turns dry running on."
value = "1"

[env.mcp_reap_grace]
doc = "The environment variable that sets the reaper's grace period between the polite and the forced signal, in seconds (the companion's MCP_REAP_GRACE, read the way JavaScript's Number reads it; not a finite number of at least zero falls back to the default; an explicit 0 is honoured). The command reads it and hands it to the script."
value = "MCP_REAP_GRACE"

[mcp_reaper.job_grace_default_s]
doc = "The grace period between the polite and the forced signal, in seconds, when the variable does not set one. The wait is bounded by hostproc.sleep_total_max_ms."
value = 3
unit = "s"

[mcp_reaper.job_relay_re]
doc = "JavaScript regex source (case-sensitive) of the WSL relay as it shows in a parent's command line (a display name, not a program path): such a parent is a reaper."
value = '\bRelay\('

[mcp_reaper.job_reaper_programs]
doc = "Parent program names (argv0 basename) that are always reapers. PID 1 is one whatever its name; a program merely named init is NOT one (real init is always PID 1)."
value = ["launchd"]

[mcp_reaper.job_user_manager]
doc = "The parent program name that is a reaper only as the per-user manager (with the flag below)."
value = "systemd"

[mcp_reaper.job_user_flag_re]
doc = "JavaScript regex source of the per-user manager's flag as a discrete token."
value = '(^|\s)--user(\s|$)'

[mcp_reaper.job_log_rel]
doc = "The companion's log file, relative to the home directory (the job appends its lines there, as the Node reaper did); it stops growing past mcp_reaper.log_max_bytes."
value = ".anti-hall/mcp-reaper.log"

[mcp_reaper.job_line]
doc = "One log line: the ISO time, a space, the message, a newline. {ts} {msg}."
value = "{ts} {msg}\n"

[mcp_reaper.job_msg_none]
doc = "Logged when a sweep finds no orphan (also when the process listing failed: nothing is reaped then)."
value = "scan: no orphans"

[mcp_reaper.job_msg_dry]
doc = "Logged per orphan on a dry run. {pid} {ppid} {cmd}."
value = "DRYRUN would reap pid={pid} ppid={ppid} cmd={cmd}"

[mcp_reaper.job_msg_term]
doc = "Logged per polite signal sent. {pid} {ppid} {cmd}."
value = "SIGTERM pid={pid} ppid={ppid} cmd={cmd}"

[mcp_reaper.job_msg_kill]
doc = "Logged per forced signal sent (only to a pid the fresh listing still selects). {pid} {cmd}."
value = "SIGKILL pid={pid} cmd={cmd}"

[mcp_reaper.job_script]
doc = "The plugin script that holds the job's logic, and its entry function (`script::call_fn`)."
value = { script = "rules/mcp-reaper", entry = "reap" }

[mcp_reaper.job_sub_run]
doc = "The subcommand of `ah-engine mcp-reaper` that makes one sweep."
value = "run"

[mcp_reaper.job_flag_dry]
doc = "The option of `ah-engine mcp-reaper run` that makes it a dry run."
value = "--dry-run"

[mcp_reaper.job_msg_usage]
doc = "Printed (stderr) for a command line `mcp-reaper` does not know."
value = "usage: ah-engine mcp-reaper run [--dry-run] [--json]"

[mcp_reaper.job_msg_failed]
doc = "Printed (stderr) when the reaper script gave no answer (missing, switched off, or it failed; the reason is in the engine log). Nothing was signalled after the failure point."
value = "anti-hall mcp-reaper: the reaper script gave no answer (see the engine log)"
