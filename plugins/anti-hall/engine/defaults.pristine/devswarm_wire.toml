[devswarm_wire.check_summary]
doc = "The one-line description of the devswarm-rt-advisory hook check in the generated reference."
value = "Tells the main session which DevSwarm workspace changes (stuck, CI, PR, lifecycle) it has not seen yet; engine-only."

[devswarm_wire.check_event]
doc = "The hook event the devswarm-rt-advisory check answers."
value = "UserPromptSubmit"

[devswarm_wire.ctl_advisory]
doc = "The control request the `advisory` verb sends the daemon. {session} is the session id."
value = "devswarm advisory session={session}"

[devswarm_wire.ctl_advisory_word]
doc = "The first word of the control request that asks for an advisory (the other request is the state summary)."
value = "advisory"

[devswarm_wire.ctl_kv]
doc = "How a control argument is introduced; {name} is the argument name."
value = "{name}="

[devswarm_wire.ctl_none]
doc = "The control answer meaning 'nothing to say' (no advisory, or the layer is not running)."
value = "-"

[devswarm_wire.sql_last_selected]
doc = "The statement that reads when a workspace was last selected in the app. {col} {table} {id} are the column, table and id column names."
value = "SELECT {col} FROM {table} WHERE {id} = ?1"

[devswarm_wire.label_chars]
doc = "How many characters of a workspace id stand in for a missing label in an advisory."
value = 8
min = 1
max = 64

[devswarm_wire.check_script]
doc = "The name of the plugin script (engine/logic/<name>.js) that decides the advisory."
value = "devswarm-rt-advisory"

[metric.dswire_stall_actions]
doc = "Pokes and escalations of silent workspaces the engine ran or refused (feature 5), by kind (poke, escalate) and outcome (ok, failed, refused); the same actions, their inputs and the mistake signals found later are in the action log (`ah-engine telemetry actions stall`)."
value = { kind = "counter", unit = "actions", labels = ["kind", "outcome"] }

[devswarm_wire.batch_role_dirs]
doc = "The DevSwarm state directories a watcher batch is classified by, as defaults keys; the same position in `batch_role_names` is the role."
value = ["mesh_write.dir_heartbeats", "mesh_write.dir_workspaces", "mesh_write.dir_summaries", "mesh_write.dir_plans"]

[devswarm_wire.batch_role_names]
doc = "The role label (work counter `dswire_batches.<role>`) of each directory in `batch_role_dirs`."
value = ["heartbeat", "descriptor", "summary", "plan"]

[devswarm_wire.batch_role_mixed]
doc = "The role label of a watcher batch whose paths fall in different state directories."
value = "mixed"

[devswarm_wire.batch_role_other]
doc = "The role label of a watcher batch with paths outside the state directories (transcripts, repositories)."
value = "other"

[devswarm_wire.probe_site_default]
doc = "The site label of a probe read made outside any attributed code path (work counter `probe_reads.<site>.<cause>`)."
value = "other"

[devswarm_wire.probe_cause_default]
doc = "The cause label of a probe read made outside any reconcile (work counter `probe_reads.<site>.<cause>`)."
value = "none"
