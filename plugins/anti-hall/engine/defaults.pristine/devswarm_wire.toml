# ---- owner verbs and roles --------------------------------------------------------------------------------------------------

[devswarm_wire.owner_verbs]
doc = "The `ah-engine devswarm <verb>` verbs and what each does: status, line, advisory, supervisor, ingest and ledger (the action audit: per-feature counts, success rate, refusals by reason, mistake rate, in-doubt keys, witness agreement) read the state; archive, plan-prune and prune act at the owner's request; recover is always refused (the engine never kills or resumes a session: the on-demand kill is Node's recovery code); wake-watch runs the idle-wake Monitor until the session ends. `create` and `merge` are ah-engine mesh verbs (compat_verbs): `create` is `spawn` (the source-freshness check, the hivecontrol create, the registry seed, title, plan and launch check), `merge` runs the hivecontrol merge itself."
value = ["status", "line", "advisory", "supervisor", "ingest", "ledger", "archive", "plan-prune", "prune", "recover", "create", "merge", "wake-watch"]

[devswarm_wire.compat_verbs]
