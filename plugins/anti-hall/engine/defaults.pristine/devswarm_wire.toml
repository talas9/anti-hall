# ah-engine shipped defaults for the DevSwarm wiring (lane dswire, `src/dswire`): the daemon thread that keeps the realtime state
# live from file events, the triggers of the DevSwarm actions, the consumers (advisory, statusline line, Jev dirty flags), the
# per-action cutover switch and the role matrix of the owner verbs. Format: see the header of engine.toml. Every key can be
# overridden in the `devswarm_wire` / `devswarm_rt` sections of settings.json.

# ---- cutover: who runs each action ------------------------------------------------------------------------------------------
# `engine` (the default for auto-archive, owner 2026-10-08: the engine is always live) runs the action in the daemon; poke and escalate default to `node`.
# `node` leaves it to the Node supervisor (the engine stands down and counts it). `off` runs it nowhere. `auto` (poke and escalate)
# is `engine` when devswarm_sup.mode is `engine`, else `node`. When the engine owns an action the Node supervisor job must be off
# (see docs/AH-ENGINE.md, "DevSwarm supervisor cutover"); the double-run guard holds poke and escalate back while it is not.

[devswarm_rt."act.auto_archive.executor"]
doc = "Who runs the automatic archive of finished workspaces: engine | node | off. The engine honours the Node setting devswarm.autoArchive.{mode,idleMin,maxPerSweep,ignorePings} unchanged. With `engine` the Node supervisor's autoArchive must be switched off for the same machine (ANTIHALL_DEVSWARM_AUTO_ARCHIVE_MODE=off in the supervisor job's environment); the durable auto-archived.json still stops either side from repeating an archive at one HEAD."
value = "engine"

[devswarm_rt."act.poke.executor"]
doc = "Who pokes a stale workspace (its descriptor's nudgeCommand): auto | engine | node | off. Default auto: the engine once devswarm_sup.mode is `engine` (the engine owns every supervisor duty and the Node supervisor job is off), otherwise node. An explicit `engine` while the Node supervisor still runs is held back by the double-run guard (devswarm_sup.guard_ms)."
value = "auto"

[devswarm_rt."act.escalate.executor"]
doc = "Who escalates a stale workspace once its pokes are used up (its descriptor's escalateCommand, once, and the one-time notice to the parent): auto | engine | node | off. Same default and guard as poke."
value = "auto"

[devswarm_wire.executor_auto]
doc = "The executor word that follows devswarm_sup.mode (poke and escalate only; auto-archive has no auto word)."
value = "auto"

[devswarm_wire.executor_words]
doc = "The words of the executor settings, in the order engine, node, off. Anything else reads as node (the engine stands down)."
value = ["engine", "node", "off"]

[devswarm_wire.act_kinds]
doc = "The automatic action kinds that have an executor switch, in the order auto_archive, poke, escalate (the key segment under devswarm_rt.act)."
value = ["auto_archive", "poke", "escalate"]

# ---- the daemon thread ------------------------------------------------------------------------------------------------------

[devswarm_wire.wait_ms]
doc = "The longest the DevSwarm thread sleeps. It sleeps until the next thing is due (a file event, a deferred reconcile, a store poll, a gate deadline, an action or stall deadline), and never longer than this, so the daemon's drain and a change of devswarm_rt.mode are noticed within it."
value = 2000
min = 10
max = 60000
unit = "ms"

[devswarm_wire.min_sleep_ms]
doc = "The shortest sleep of the DevSwarm thread: a deadline that is already due is handled at once, but never busy-waits."
value = 10
min = 1
max = 1000
unit = "ms"

[devswarm_wire.store_poll_ms]
doc = "How often the held connection of each active mesh store, and of the app database, is asked `PRAGMA data_version` (it changes when another process commits). This replaces watching the SQLite files, which a reader's own open touches."
value = 500
min = 50
max = 60000
unit = "ms"

[devswarm_wire.transcript_min_interval_ms]
doc = "The least time between two reactions to one workspace's transcript growing (a Jev sweep mark and a stuck re-check). The gate only stats the transcript files (inode, size): growth inside the interval is acted on once, when the interval ends."
value = 5000
min = 0
max = 3600000
unit = "ms"

[devswarm_wire.jev_dirty_flush_ms]
doc = "How often the in-memory Jev dirty queue is written to its file when it changed (it is also written when the thread stops). A crash loses at most this much of queue changes; the scheduled sweep still covers every workspace."
value = 5000
min = 100
max = 600000
unit = "ms"

[devswarm_wire.events_recheck_ms]
doc = "How long the event-driven auto-archive waits before looking at its dirty workspaces again when it cannot act (the event trigger is off or the engine is not the executor)."
value = 30000
min = 1000
max = 3600000
unit = "ms"

[devswarm_wire.reconcile_min_gap_ms]
doc = "The least time between two reconciles the file events ask for. Changes inside the gap are folded into one reconcile at its end (none is lost), so a burst of changes, or a source that changes all the time, costs at most one reconcile per gap. 0 reconciles on every batch."
value = 1000
min = 0
max = 600000
unit = "ms"

[devswarm_wire.periodic_full_sweep_ms]
doc = "The longest the periodic reconcile goes without a full action sweep (every workspace's git facts, the mistake scan, the nag pass). In between it sweeps in full only when the reconcile saw a change in the DevSwarm state; edges are acted on through the event path either way."
value = 300000
min = 0
max = 86400000
unit = "ms"

[devswarm_wire.act_min_gap_ms]
doc = "The least time between two action sweeps (auto-archive, poke/escalate). An event burst triggers at most one sweep per gap; the periodic reconcile always triggers one."
value = 5000
min = 0
max = 3600000
unit = "ms"

[devswarm_wire.act_edge_kinds]
doc = "The kinds of state change that trigger an action sweep right away (the others wait for the periodic reconcile)."
value = ["lifecycle", "activity", "pr", "unread"]

[devswarm_wire.git_timeout_ms]
doc = "Time limit of each git call that reads a workspace's facts (HEAD, status, merge proof). A call over the limit is killed and the fact counts as not proven."
value = 4000
min = 100
max = 600000
unit = "ms"

[devswarm_wire.git_bin]
doc = "The git executable the fact readers run."
value = "git"

[devswarm_wire.git_commondir_file]
doc = "The file in a linked worktree's git directory that names the repository's common directory (where the refs and packed-refs live)."
value = "commondir"

[devswarm_wire.git_cache_exit_codes]
doc = "The exit statuses of `git status` and `git rev-parse HEAD` that are an answer worth remembering; any other (a locked index, a missing repository) is asked again at the next call."
value = ["0"]

[devswarm_wire.git_cache_proof_exit_codes]
doc = "The exit statuses of the merge and pushed proofs that are an answer worth remembering: 0, and 1 (`git merge-base --is-ancestor` answers a proven 'not merged' with it); any other is asked again at the next call."
value = ["0", "1"]

[devswarm_wire.git_cache_max_entries]
doc = "Most git answers remembered at once (workspace x call); past it the memory is cleared and refilled by the next reconcile."
value = 4096
min = 16
max = 1000000

[devswarm_wire.git_cache_status_wt]
doc = "Paths in the worktree whose change makes a remembered `git status` stale ('.' is the top directory: a file added or removed there). Edits to tracked files are caught by the age limits below, since they move no git file until staged."
value = ["."]

[devswarm_wire.git_cache_status_gitdir]
doc = "Files of the worktree's git directory whose change makes a remembered `git status` stale (staging writes the index; a commit or checkout moves HEAD and appends to its reflog)."
value = ["index", "HEAD", "logs/HEAD"]

[devswarm_wire.git_cache_status_common]
doc = "Files of the repository's common directory whose change makes a remembered `git status` stale."
value = []

[devswarm_wire.git_cache_status_max_ms]
doc = "The longest a remembered CLEAN `git status` is kept while its files are unchanged. A clean tree turns dirty by an edit that moves no git file, so this is the staleness bound of the clean answer."
value = 120000
min = 1000
max = 86400000
unit = "ms"

[devswarm_wire.git_cache_status_dirty_max_ms]
doc = "The longest a remembered DIRTY `git status` is kept while its files are unchanged. A dirty tree turns clean only by staging, a commit or a checkout, each of which moves a signature file, so this is a safety net and the answer errs towards 'not clean'."
value = 600000
min = 1000
max = 86400000
unit = "ms"

[devswarm_wire.git_cache_ref_wt]
doc = "Paths in the worktree whose change makes a remembered HEAD stale."
value = []

[devswarm_wire.git_cache_ref_gitdir]
doc = "Files of the worktree's git directory whose change makes a remembered HEAD stale."
value = ["HEAD", "logs/HEAD"]

[devswarm_wire.git_cache_ref_common]
doc = "Files of the repository's common directory whose change makes a remembered HEAD stale."
value = []

[devswarm_wire.git_cache_ref_max_ms]
doc = "The longest a remembered HEAD is kept while its files are unchanged (a safety net for a repository that keeps no reflog)."
value = 600000
min = 1000
max = 86400000
unit = "ms"

[devswarm_wire.git_cache_proof_wt]
doc = "Paths in the worktree whose change makes a remembered merge or pushed proof stale."
value = []

[devswarm_wire.git_cache_proof_gitdir]
doc = "Files of the worktree's git directory whose change makes a remembered merge or pushed proof stale."
value = ["HEAD", "logs/HEAD"]

[devswarm_wire.git_cache_proof_common]
doc = "Files of the repository's common directory whose change makes a remembered merge or pushed proof stale (a fetch moves the remote branches; the top directory of a remote catches a ref written in it)."
value = ["packed-refs", "refs/remotes/origin", "refs/remotes/origin/HEAD"]

[devswarm_wire.git_cache_proof_max_ms]
doc = "The longest a remembered merge or pushed proof is kept while its files are unchanged (a remote branch in a sub-directory moves no signature file; a later merge is then seen at most this late)."
value = 300000
min = 1000
max = 86400000
unit = "ms"

[devswarm_wire.watch_state_dirs]
doc = "Directories under the DevSwarm state directory whose changes are hints for a reconcile (each key is a mesh_write.* setting that names the directory)."
value = ["mesh_write.dir_heartbeats", "mesh_write.dir_plans", "mesh_write.dir_workspaces", "mesh_write.dir_summaries", "mesh_write.dir_archived"]

[devswarm_wire.state_ignore_prefixes]
doc = "File-name prefixes in the watched state directories that are not hints for a reconcile (each key is a setting that names the prefix). The ingest daemons' heartbeats (ingest-*.json, written every ~2 s) are never a reconcile input; without this they drove most reconciles."
value = ["mesh_write.ingest_beat_prefix"]

[devswarm_wire.state_ignore_contains]
doc = "Name fragments in the watched state directories that are not hints for a reconcile (each key is a setting that names the fragment). A writer stages a file as `<name>.json.tmp.<pid>` and renames it; the rename is the event, the staged name is noise (Node's heartbeat and plan writers made several hints per write)."
value = ["mesh_write.tmp_suffix"]

[devswarm_wire.beat_dir_key]
doc = "The mesh_write.* setting that names the heartbeats directory, whose files are workspace heartbeats: the beat of a workspace the state calls working is not a hint to reconcile (see devswarm_rt.stall_ms: the deadline check re-reads it when the silence clock runs out); every other beat is."
value = "mesh_write.dir_heartbeats"

[devswarm_wire.watch_git_names]
doc = "Files of a worktree's git directory whose change means a commit or a checkout happened (a Jev hint for that workspace)."
value = ["HEAD", "index", "ORIG_HEAD", "FETCH_HEAD"]

[devswarm_wire.git_dir_file]
doc = "The file a linked worktree has in place of a .git directory, and the prefix of its one line."
value = { file = ".git", prefix = "gitdir:" }

[devswarm_wire.transcript_dir]
doc = "Where Claude Code keeps session transcripts, relative to the home directory; a worktree's directory is its path with the characters in transcript_encode replaced by '-'."
value = ".claude/projects"

[devswarm_wire.transcript_encode]
doc = "The characters of a worktree path replaced by '-' to name its transcript directory."
value = "/\\:."

[devswarm_wire.transcript_ext]
doc = "The extension of a session transcript file."
value = ".jsonl"

