# Claim-evidence guard (GH #313, part of #307), Stop, Claude, engine-only (no Node twin). One check, two rules, each with its own switch:
#   1. claim needs evidence: a reply that asserts a completed check or outcome ("tests pass", "verified", "deployed", "is fixed") must be
#      backed by a tool call of THIS turn that could have produced it; a bare assertion is held once.
#   2. pushed is not done: a reply that calls the work done after a push or PR in this turn, with no later look at CI or the merge
#      state, is held once.
# Logic: engine/logic/claim-evidence-guard.js (reads the reply, the engine's evidence walk and the commands of the turn). Every
# phrase, pattern, number and text is here (D88). Regular expressions are Rust syntax (linear time, no look-around). Codex payloads are
# not judged: the evidence walk reads Claude transcripts only. The judgement parts (is this claim about the turn's work at all?) are
# not asked of Jev yet: they ship after the rule has a measured catch rate and noise (#313, #316).

[claim_evidence.sw_claim]
doc = "Switch guards.claimEvidence (default on): off lets a reply assert a check or outcome with no matching tool call this turn."
value = { section = "guards", key = "claimEvidence", type = "boolean", env = "ANTIHALL_CLAIM_EVIDENCE", option = "", default = true }

[claim_evidence.sw_pushed]
doc = "Pushed work is not done switch. Switch guards.pushedNotDone (default on): off lets a reply call pushed work done without a look at CI or the merge state."
value = { section = "guards", key = "pushedNotDone", type = "boolean", env = "ANTIHALL_PUSHED_NOT_DONE", option = "", default = true }

[claim_evidence.sw_telemetry]
doc = "Switch guards.claimEvidenceTelemetry (default on): off stops the claim-evidence fired / suppressed counters (metrics claim_evidence_fired, claim_evidence_suppressed; advisory counters in status); the guard's decisions do not change."
value = { section = "guards", key = "claimEvidenceTelemetry", type = "boolean", env = "ANTIHALL_CLAIM_EVIDENCE_TELEMETRY", option = "", default = true }

[claim_evidence.sw_strict]
doc = "Switch guards.claimEvidenceStrict (default on): a suppressor must not let a bare factual claim through (GH #427). A filler opener ('If you ask', 'If true'), a reporting word that is a noun after an article ('the reports') or the start of a compound ('doc-string'), a negated or noun-like label ('not unverified', 'unchecked boxes', 'unverified aside') and a source phrase closed by a comma are judged by the lists below. Off restores the earlier looser reading."
value = { section = "guards", key = "claimEvidenceStrict", type = "boolean", env = "ANTIHALL_CLAIM_EVIDENCE_STRICT", option = "", default = true }

[claim_evidence.sw_focus]
doc = "Switch guards.claimEvidenceFocus (default OFF; R-claim, plan v2 section 4): the claim and hedge checks stop blocking replies that are honest or evidenced, and every block names the exact check that clears it. On: (1) the tool calls of a turn are counted since the last OWNER prompt, so a background-task notification or an injected hook message between the check and the reply no longer hides the check (transcript.ev_cont_*); (2) the extra honest-label phrasings of claim_evidence.ack_focus_res and speculation_guard.ack_focus_ci count ('I haven't confirmed that', 'unconfirmed'); (3) a 'must be shown failing' style requirement is no guess (speculation_guard.obligation_focus_re); (4) a claim block says which command clears it (the row's clears text). Off: today's behaviour, byte for byte."
value = { section = "guards", key = "claimEvidenceFocus", type = "boolean", env = "ANTIHALL_CLAIM_EVIDENCE_FOCUS", option = "", default = false }

[metric.claim_focus_cleared]
doc = "Replies or claims the R-claim focus switch (guards.claimEvidenceFocus) let through that today's checks would have kept as a claim or hedge, by guard (claim-evidence-guard, speculation-guard) and by what cleared them (turn_continued: the check was in the same owner turn, before a notification; label: an extra honest-label phrasing; obligation: a requirement, not a guess). turn_continued is exact (today's evidence count would have held the reply); label counts a claim or hedge the extra phrasing covered (for the hedge check only when the turn's tool output did not already cite it); obligation counts a hedge skipped because of the extra requirement words."
value = { kind = "counter", unit = "replies", labels = ["guard", "by"] }

[metric.claim_after_block]
doc = "Replies that follow a hold of the claim-evidence guard (the Stop that carries stop_hook_active, which the guard always lets through), by outcome: passed (the reply no longer states a claim) or still_claiming (it still does). Counted only while guards.claimEvidenceFocus is on (and guards.claimEvidenceTelemetry); the share still_claiming / all is the part of holds that changed nothing. The count reads the reply text, not the transcript, so it says the claim is still stated, not that no check ran."
value = { kind = "counter", unit = "stops", labels = ["outcome"] }

[metric.claim_evidence_suppressor_rejected]
doc = "Suppressor candidates the claim-evidence guard refused because they do not really cover the claim, by reason (filler_opener, source_noun, source_compound, label_not_a_label); each refused candidate is one that used to let a claim through (GH #427)."
value = { kind = "counter", unit = "candidates", labels = ["reason"] }

[metric.claim_evidence_fired]
doc = "Replies the claim-evidence guard held or logged (a claim with no matching check, or pushed work called done), by rule (claim, pushed)."
value = { kind = "counter", unit = "replies", labels = ["rule"] }

[metric.claim_evidence_suppressed]
doc = "Claim hits the claim-evidence guard let pass, by reason (negated, future, reported, criterion, labelled, quoted)."
value = { kind = "counter", unit = "claims", labels = ["reason"] }

[claim_evidence.guard_name]
doc = "The guard id this check answers to in skip.json and in its messages."
value = "claim-evidence-guard"

[claim_evidence.summary]
doc = "One-line description of the claim-evidence-guard check in the generated reference."
value = "Stop (Claude): holds once a reply that claims a result (tests pass, verified, deployed, is fixed) with no matching tool call this turn (guards.claimEvidence), or that calls work done after a push with no look at CI or the merge state (guards.pushedNotDone)."

[claim_evidence.mode]
doc = "What a hit does: block (the Stop is held once per reply, the reply is asked to run the check or label the claim) or log (the hit is only written to the engine log, for measuring noise before it acts)."
value = "block"

[claim_evidence.max_blocks]
doc = "Most holds per cap_scope window; a new real owner turn resets it. Same-text dedupe is independent: the same reply is never held twice."
value = 2
min = 1
max = 20

[claim_evidence.cap_scope]
doc = "Block-cap scope: owner_turn (default) resets max_blocks on a new real user turn; session keeps a session-wide cap."
value = "owner_turn"

[claim_evidence.state_prefix]
doc = "Prefix of the per-session state file name under the replykit state directory (the sanitised session id and the JSON extension follow)."
value = "claim-evidence-state-"

[claim_evidence.log_kind]
doc = "Engine log kind written for a hit (block or log mode)."
value = "claim_evidence"

[claim_evidence.ack_res]
doc = "An honest label on a claim (rule 1): the claim is negated, hedged, or tied to an earlier run. It covers only a claim in its own sentence within claim_evidence.reach_label words of it. Regular expressions, case-insensitive, matched against the claim's sentence with quoted text and code removed."
value = [
  '\b(?:not|never|n.t|un|without)\s*(?:yet\s+|been\s+|fully\s+)?(?:verified|verifying|tested|run|ran|checked|confirmed|deployed|released|merged)\b',
  '\bunverified\b',
  '\b(?:did|do|does|have|has|had|was|were|am|is|are)(?:n.t| not)\s+(?:able to\s+)?(?:run|check|verify|test|confirm|deploy)',
  '\b(?:no|zero)\s+(?:tests?|checks?|runs?)\s+(?:were\s+|was\s+)?(?:run|ran|executed)\b',
  '\b(?:from|in|per|as of)\s+(?:the\s+)?(?:earlier|previous|prior|last|preceding)\s+(?:turn|run|session|check|result|message|commit)',
  '\b(?:earlier|previously|before)\s+(?:i\s+|we\s+)?(?:ran|verified|checked|confirmed|tested)\b',
  '\b(?:pending|awaiting|waiting for)\s+(?:ci|review|the run|the check)',
  '\b(?:expected|supposed|meant|intended)\s+to\s+(?:pass|work|be)\b',
]

[claim_evidence.ack_focus_res]
doc = "More honest-label phrasings (rule 1), read only while guards.claimEvidenceFocus is on, with the same reach as claim_evidence.ack_res: the writer says it did not confirm the claim ('I haven't confirmed that', 'could not verify', 'unconfirmed', 'not yet proven'). Regular expressions, case-insensitive, matched against the claim's sentence with quoted text and code removed. A dot stands for either apostrophe."
value = [
  '\b(?:haven.t|have not|hadn.t|had not|did not|didn.t|could not|couldn.t|can.t|cannot|was not able to|wasn.t able to|am not able to|unable to)\s+(?:yet\s+|fully\s+|really\s+)?(?:confirm|verif|check|test|validat|reproduc|prov|measur)\w*\b',
  '\bunconfirmed\b',
  '\bunproven\b',
  '\b(?:not|never)\s+(?:yet\s+|been\s+|fully\s+)?(?:confirmed|validated|reproduced|proven|established|measured)\b',
]

[claim_evidence.focus_turn_calls]
doc = "Read only while guards.claimEvidenceFocus is on: the most tool calls (counted back from the reply) that the widened turn (everything since the last owner prompt) may reach. A long autonomous session has hours of calls between two owner prompts; a check older than this many calls backs nothing. The turn the guard sees without the switch is never narrowed by it. Default 30, from one live session's 79 claim blocks replayed through the engine: of the 62 the engine still holds, a reach of 20 clears 17, 30 clears 18 and 40 clears 18, so the farthest clearing command sat 21 to 30 calls back."
value = 30
min = 1
max = 1000

[claim_evidence.trailing_label_focus_re]
doc = "Read only while guards.claimEvidenceFocus is on, as well as claim_evidence.trailing_label_re: an honest label that closes the sentence as its own clause, in the way people write it ('Tests pass, but I haven't confirmed that.', 'Tests pass; I couldn't verify it.'). It covers every claim before it in that sentence. Rust regular expression, case-insensitive, matched against the sentence; a short object (up to 30 characters, no sentence punctuation) may follow the verb."
value = '[,;:(\u2014\u2013]\s*(?:but\s+|and\s+|though\s+)?(?:i\s+|we\s+)?(?:(?:haven.t|have not|could not|couldn.t|can.t|cannot|did not|didn.t)\s+(?:yet\s+|fully\s+)?(?:confirm|verif|check|test|validat|prov)\w*|(?:not|never)\s+(?:yet\s+)?(?:confirmed|verified|validated|proven))\b[^.;\n]{0,30}\W*$'

[claim_evidence.msg_claim_instead_focus]
doc = "Rule 1 advice while guards.claimEvidenceFocus is on: it names the check that clears this claim (the block advice is cut to 115 characters by the message layer, so the clears texts are short). Placeholder: {clears} the claim row's `clears` text."
value = "run {clears}, or mark it not verified."

[claim_evidence.sentence_end_re]
doc = "Where a sentence of the reply ends (a claim is judged inside its own sentence). Rust regular expression."
value = '[.!?]+\s|\n+'

[claim_evidence.clause_break_re]
doc = "Where a clause ends inside a sentence: negation, tense and attribution words only govern a claim in the same clause. Rust regular expression."
value = '[,;:()]|\s[-\u2013\u2014]\s|\b(?:but|and then|however|although)\b'

[claim_evidence.skip_window]
doc = "Most characters before a claim (inside its clause) that are searched for a suppressor (claim_evidence.suppress)."
value = 60
min = 10
max = 400

[claim_evidence.neg_res]
doc = "Negation on the claim's own verb or a negative pronoun as its subject (rule 1): 'is not confirmed green', 'not yet verified', 'never verified', 'nothing is merged', 'none of this is verified'. A bare 'not' counts only on a verb ('is not', 'have not', 'not yet'), never before the claim's subject ('Whether acknowledged or not CI is green' stays a claim). Reach claim_evidence.reach_verb: only skip words (gap_skip_re) may stand between it and the claim, so 'Without any further delay the suite is passing' stays a claim. Regular expressions, case-insensitive, matched against the clause before the claim."
value = [
  '\b(?:is|are|was|were|am|be|been|has|have|had|do|does|did|can|could|will|would|should|may|might|must)\s+not\b',
  '\bnot\s+(?:yet|fully|been)\b',
  '\b(?:never|without|cannot|nothing|none|nobody|neither|nor)\b',
  '\b(?:is|are|was|were|has|have|had|does|do|did|can|could|will|would|should|wo|ca)n.t\b',
]

[claim_evidence.neg_subject_res]
doc = "'no' before the claim's subject (rule 1): 'no PR is merged'. Reach claim_evidence.reach_subject (the subject's own noun); a certainty idiom after it (claim_evidence.no_idiom_re: 'no doubt', 'no wonder') never suppresses. Regular expressions, case-insensitive, matched against the clause before the claim."
value = ['\bno\b']

[claim_evidence.no_idiom_re]
doc = "The words after a 'no' (neg_subject_res) that make it a certainty idiom, not a negated subject: 'No doubt it is merged', 'No wonder it is live' stay claims. Rust regular expression, case-insensitive, matched against the 'no' and the text after it up to the claim."
value = '^no\s+(?:doubt|doubts|wonder|question|questions|kidding|way|problem|problems|worries|surprise|joke|matter|need|denying)\b'

[claim_evidence.modal_res]
doc = "A modal or future marker on the claim's own verb (rule 1): 'must have been merged', 'will have been deployed'. Reach claim_evidence.reach_verb, so 'We must hurry because PR #405 is merged' and 'We will celebrate given that ...' stay claims. Regular expressions, case-insensitive, matched against the clause before the claim."
value = [
  '\b(?:will|would|shall|going to|gonna|should|might|may|must|can|could)\b',
  '\b(?:to be|needs?\s+to be|ready to be|waiting to be|yet to be|about to be)\b',
]

[claim_evidence.future_res]
doc = "A conditional, temporal or 'whether' word that opens the claim's own clause (rule 1): 'once #1 and #2 are merged', 'if CI is green', 'only when X is merged', 'until the tests pass', 'whether that version is live'. Reach claim_evidence.reach_clause. Regular expressions, case-insensitive, matched against the clause before the claim."
value = ['\b(?:once|after|when|whenever|if|until|unless|before|as soon as|assuming|provided|whether|in case)\b']

[claim_evidence.opener_idiom_re]
doc = "The words after a clause opener (future_res) that make it an idiom, not a condition on the claim: 'Once again CI is green', 'If anything', 'If needed', 'Until now', 'After all', 'whether ... or not' stay claims, while 'once all PRs are merged' is a condition. Each idiom is paired with its opener. Only an opener followed by the claim's own subject covers it. Rust regular expression, case-insensitive, matched against the opener and the text after it up to the claim."
value = '^(?:once\s+(?:again|more)|(?:if|when|whenever)\s+(?:asked|anything|needed|necessary|possible|so|ever)|until\s+(?:now|today|tonight|then|yesterday|recently)|after\s+all\s+(?:it|this|that|they|we|the|everything)|before\s+(?:now|today))\b|^after\s+all\W*$|^whether\b.*\bor\s+(?:not|no)\b'

[claim_evidence.opener_filler_re]
doc = "Filler words after a clause opener (future_res) that make it no condition on the claim, only when guards.claimEvidenceStrict is on: 'If you ask tests pass', 'If true CI is green', 'When convenient ...'. Rust regular expression, case-insensitive, matched against the opener and the text after it up to the claim."
value = '^(?:if|when|whenever)\s+(?:you\s+(?:ask|want|like|prefer|need|wish|insist)|you.d\s+(?:like|prefer)|true|convenient|desired|curious|wanted|preferred|requested)\b'

[claim_evidence.noun_before_re]
doc = "Text that ends right before a reporting word and makes it a noun, not a verb (strict mode): 'According to the reports CI is green' ('reports' after 'the'). Rust regular expression, case-insensitive, matched against the clause up to the reporting word; it must end with $."
value = '\b(?:the|a|an|its|this|these|those|our|their|my|your)\s+$'

[claim_evidence.compound_after_re]
doc = "Text that starts right after a source word and makes it the start of a compound, not the source itself (strict mode): 'doc-string', 'report-card', 'issue-tracker'. Rust regular expression matched against the text after the source word."
value = '^[-_/]\w'

[claim_evidence.clause_join_re]
doc = "A phrase that, when it ends right before a clause break, keeps the clause going (strict mode): 'According to the PR body, the change is merged' stays one clause so the source still governs it. Rust regular expression, case-insensitive, matched against the sentence up to the break; it must end with $."
value = '\baccording\s+to\s+(?:[\w#\x27-]+\s+){0,3}[\w#\x27-]+$'

[claim_evidence.clause_join_break_re]
doc = "Which clause break may keep a clause going after a source phrase (strict mode): only a comma ('According to the docs, CI is green' stays one clause); a semicolon, dash or other break ends it ('I updated the config according to the docs; CI is green' leaves the second claim bare). Rust regular expression, case-insensitive, matched against the break text itself."
value = '^,$'

[claim_evidence.ack_before_not_re]
doc = "Text that ends right before an honest-label word and negates it (strict mode): 'not unverified', 'never unverified'. Rust regular expression, case-insensitive, matched against the sentence up to the label; it must end with $."
value = '\b(?:not|never|no|n.t)\s+$'

[claim_evidence.ack_after_not_re]
doc = "Text that starts right after an honest-label word and shows it is no label (strict mode): 'unverified is false', 'unverified meaning not', 'unchecked boxes remain', 'unverified claims aside'. A noun ('boxes', 'files') only counts right after the word with nothing but spaces between, so an explicit label with punctuation keeps its effect: 'Unverified: files are deployed', 'Unverified - files ...', '(Unverified) files ...'. Rust regular expression, case-insensitive, matched against the text after the label."
value = '^(?:\W*(?:(?:is|are|was|were)\s+(?:false|untrue|wrong|incorrect|not)\b|meaning\s+not\b|(?:\w+\s+)?aside\b)|\s+(?:boxes|checkboxes|items?|tasks?|files?)\b)'

[claim_evidence.reported_res]
doc = "A reporting verb, or 'according to' a named source, that opens the claim's own clause (rule 1): 'the bot reported that tests pass', 'the old comment said it is fixed', 'according to the PR body the change is merged' ('according to plan' names no source). Quoted text is a claim like any other unless one of these opens its clause. Reach claim_evidence.reach_clause. Regular expressions, case-insensitive, matched against the clause before the claim."
value = [
  '\b(?:says?|said|saying|reports?|reported|reporting|claims?|claimed|states?|stated|wrote|writes|written|mentions?|mentioned|shows?|showed|reads?|quotes?|quoted|asserts?|asserted)(?:\s+that)?\b',
  '\baccording\s+to\s+(?:the\s+|a\s+|its\s+|this\s+|that\s+)?(?:pr\s+(?:body|description)|report|logs?|bot|comment|changelog|release\s+notes|docs?|issue|ticket|commit\s+message|status\s+page|dashboard)\b',
]

[claim_evidence.criterion_res]
doc = "A requirement whose 'that' opens the claim's own clause (rule 1): 'SAFE-TO-REMOVE requires that the branch is merged'. 'required' as an adjective ('All required tests pass') stays a claim. Reach claim_evidence.reach_clause. Regular expressions, case-insensitive, matched against the clause before the claim."
value = ['\b(?:requires?|requiring|required|ensures?)\s+that\b']

[claim_evidence.reach_verb]
doc = "Most counted words (not gap_skip_re) between a negation or modal (neg_res, modal_res) and the claim it covers: 0 = it must sit on the claim's own verb."
value = 0
min = 0
max = 3

[claim_evidence.reach_subject]
doc = "Most counted words between a negated subject word (neg_subject_res) and the claim: 1 = its own noun ('no PR is merged')."
value = 1
min = 0
max = 3

[claim_evidence.reach_clause]
doc = "Most counted words between a clause opener (future_res, reported_res, criterion_res) and the claim: the claim's own subject ('once a NAS that has it is deployed'). Any word beyond it (a second predicate, an unknown connector) ends the opener's reach and the claim is judged as fact."
value = 2
min = 0
max = 6

[claim_evidence.reach_label]
doc = "Most counted words between a claim and the honest label (ack_res) in its own sentence that covers it (1 = the claim's own subject) ('Tests pass per the earlier run', 'Unverified: the service is live'). A label elsewhere in the reply covers nothing."
value = 1
min = 0
max = 3

[claim_evidence.reach_consequent]
doc = "Most counted words between a claim covered by a chain row of claim_evidence.suppress (a conditional opener) and a following claim in the same clause that is its consequent: the consequent's own subject ('If CI is green the change is merged')."
value = 1
min = 0
max = 3

[claim_evidence.trailing_label_re]
doc = "An honest label that closes the claim's sentence as its own clause ('Tests pass in my head but I did not run them; unverified.'): it covers every claim before it in that sentence. A leading 'Unverified claims aside, ...' is not one. Rust regular expression, case-insensitive, matched against the sentence."
value = '[;:(—–]\s*(?:unverified|untested|unchecked|not\s+(?:yet\s+)?(?:verified|checked|tested|run))\W*$'

[claim_evidence.quote_mark_re]
doc = "Quote marks taken out of the reply before claims are looked for (an apostrophe inside a word stays): a claim in quotes ('\"It is merged.\"', 'CI is \"green\"') is judged like any other, so only a reporting verb that opens its clause (reported_res) covers it. Code, fences and blockquotes stay masked. Rust regular expression."
value = '["“”]|\B[\x27‘’]|[\x27‘’]\B'

[claim_evidence.gap_word_re]
doc = "One word of the text between a suppressor and the claim (punctuation is not a word: a lone dash in 'Unverified - files are deployed' counts nothing). Rust regular expression."
value = '[\w#@][\w#@\x27\x{2019}/-]*'

[claim_evidence.gap_skip_re]
doc = "Words that never count against a reach: articles, determiners, possessives, quantifiers, 'of'/'and'/'or', 'it'/'this'/'that', '#refs' and numbers (they belong to the claim's subject). Every other word counts, so a word the list does not know uses up the reach instead of extending it. Rust regular expression, case-insensitive, matched against one whole word."
value = '^(?:the|a|an|this|that|these|those|it|its|their|our|my|your|his|her|all|every|each|both|any|some|of|and|or|#\S*|v?\d\S*)$'

[claim_evidence.gap_restart_re]
doc = "A word that starts a new noun phrase: seen after a counted word, the gap holds two phrases (a second clause) and the suppressor's reach ends ('Once again the build is green', 'According to the PR body the change is merged'). Rust regular expression, case-insensitive, matched against one whole word."
value = '^(?:the|a|an)$'

[claim_evidence.suppress]
doc = "Why a claim hit is not a claim, in the order checked: reason = the label written to the log, list = the config key of the pattern list (matched against the clause before the hit), reach = the config key of the most counted words allowed between a list hit and the claim (gap_skip_re words are free; gap_restart_re after a counted word ends the reach). idiom (optional) = the config key of a regex matched against the text between a list hit and the claim: a match makes that hit an idiom that covers nothing. chain = true: a claim that follows a claim this row covered, in the same clause with at most claim_evidence.reach_consequent counted words between them, is that condition's consequent and is covered too ('If CI is green the change is merged by the bot'). Every hit of every list is tried; the first row with a hit in reach names the reason."
value = [
  { reason = "negated", list = "claim_evidence.neg_res", reach = "claim_evidence.reach_verb" },
  { reason = "negated", list = "claim_evidence.neg_subject_res", reach = "claim_evidence.reach_subject", idiom = "claim_evidence.no_idiom_re" },
  { reason = "future", list = "claim_evidence.modal_res", reach = "claim_evidence.reach_verb" },
  { reason = "future", list = "claim_evidence.future_res", reach = "claim_evidence.reach_clause", idiom = "claim_evidence.opener_idiom_re", idiom_strict = "claim_evidence.opener_filler_re", chain = true },
  { reason = "reported", list = "claim_evidence.reported_res", reach = "claim_evidence.reach_clause", noun_before = "claim_evidence.noun_before_re", compound = "claim_evidence.compound_after_re" },
  { reason = "criterion", list = "claim_evidence.criterion_res", reach = "claim_evidence.reach_clause" },
]

[claim_evidence.ack_reason]
doc = "Log reason for a claim covered by an honest label in its own sentence (ack_res, within claim_evidence.reach_label)."
value = "labelled"

[claim_evidence.quoted_reason]
doc = "Log reason for a claim that appears only inside code, a fence or a blockquote."
value = "quoted"

[claim_evidence.max_suppress_logs]
doc = "Most suppressed-hit log lines (claim_evidence.log_kind) written for one reply."
value = 5
min = 0
max = 50

[claim_evidence.msg_suppressed]
doc = "Log line for a claim the guard let pass. Placeholders: {reason} why (negated, future, reported, criterion, labelled, quoted), {claim} the claim kind, {quote} the words found."
value = "suppressed ({reason}): \"{quote}\" ({claim})"

# ---- rule 1: claim needs evidence ---------------------------------------------------------------------------

[claim_evidence.claims]
doc = "The result claims rule 1 looks for, in order; the first row that matches a reply decides. id: the label in the message and the log. re: Rust regular expression (case-insensitive) on the reply with quoted text and code removed. clears: the check that clears the claim, named in the block while guards.claimEvidenceFocus is on. needs: command patterns (Rust syntax) of which at least one must match a command run this turn; empty means any tool call this turn is enough. With no tool call at all this turn, every row fires."
value = [
  { id = "tests pass", clears = "the project's test runner and quote its summary line", re = '\b(?:all\s+)?(?:\d[\d,]*\s+)?(?:unit\s+|integration\s+|e2e\s+)?tests?\s+(?:(?:are|is|now|all|still)\s+)*(?:pass(?:es|ed|ing)?|green)\b|\b\d[\d,]*\s+(?:tests?\s+)?passed\b|\b(?:build|ci|suite|checks?|lint)\s+(?:(?:is|are|now|all)\s+)*(?:green|passing|passes|passed)\b', needs = ['\b(?:cargo\s+(?:test|nextest|check|clippy|build)|node\s+--test|npm\s+(?:run\s+)?(?:test|build|lint)|pnpm\s+(?:run\s+)?(?:test|build|lint)|yarn\s+(?:test|build|lint)|pytest|go\s+(?:test|build|vet)|jest|vitest|flutter\s+(?:test|analyze)|dart\s+(?:test|analyze)|gradlew?\s+\S*(?:test|build)|make\s+(?:test|check|build)|tsc|eslint|clippy|dotnet\s+(?:test|build)|bun\s+(?:test|run)|deno\s+test|swift\s+(?:test|build)|xcodebuild|mvn|rspec|phpunit|mix\s+test|gh\s+run\s+(?:view|watch|list)|gh\s+pr\s+checks|\S*test\S*\.(?:sh|js|py))\b'] },
  { id = "shipped", clears = "gh pr view <n> --json state (or git log, a health curl)", re = '\b(?:has\s+been|have\s+been|is|are|was|were|now)\s+(?:deployed|released|published|merged|live)\b|\b(?:deployed|released|published)\s+(?:to\s+\S+|as\s+v?\d)|\bnot\s+only\s+(?:is|are|was|were|has\s+been|have\s+been)\s+[\w#-]+\s+(?:deployed|released|published|merged|live)\b', needs = ['\b(?:deploy|release|publish|merge|gh\s+(?:pr|release|run|api)|git\s+(?:push|tag|merge)|curl|wget|http|git\s+(?:log|show|branch|status|rev-parse|merge-base|ls-remote|fetch)|firebase|npm\s+publish|cargo\s+publish|kubectl|vercel|fastlane)\b'] },
  { id = "verified", clears = "the check you verified with and quote its output", re = '\b(?:(?:i|we|it|they|all|now|has|have|is|are|was|were|been|got|fully|also|personally|independently|just|successfully)(?:\x27ve|\x27s|\x27re)?\s+)+(?:verified|confirmed)\b|\b(?:verified|confirmed)\s+(?:that|working|fixed|green|passing|merged|deployed|successful(?:ly)?|every|each|the|it|this|all|both)\b|^\W*(?:verified|confirmed)\b|(?:^|\s)(?:verified|confirmed)\s*(?:[:\u2014-]|$)', needs = [] },
  { id = "fixed", clears = "the failing test or repro and quote it passing", re = '\b(?:is|are|now|been)\s+(?:now\s+)?fixed\b|\bfixed\s+and\s+(?:verified|working|tested)\b', needs = [] },
  { id = "all done", clears = "the task list or acceptance check and quote it", re = '\ball\s+(?:the\s+)?(?:tasks?\s+|items?\s+|work\s+|steps?\s+)?(?:are\s+)?(?:done|complete[d]?|finished)\b', needs = [] },
]

[claim_evidence.msg_claim_what]
doc = "Rule 1 headline. Placeholders: {claim} the claim kind, {quote} the words found."
value = "\"{quote}\" ({claim}) has no matching check run this turn."

[claim_evidence.msg_claim_instead]
doc = "Rule 1 advice."
value = "run the check and show its result, or say it was not verified."

# ---- rule 2: pushed is not done -----------------------------------------------------------------------------

[claim_evidence.done_res]
doc = "Completion words of rule 2. Regular expressions, case-insensitive, matched against the reply with quoted text and code removed."
value = [
  '\b(?:all\s+)?(?:done|finished|shipped|delivered|landed|resolved|wrapped up|all set)\b',
  '\bcomplete[d]?\b',
  '\bready\s+(?:to|for)\s+(?:merge|ship|release|review|use)\b',
]

[claim_evidence.push_res]
doc = "Commands that publish work: matched against each command run this turn (Rust syntax). A hit starts rule 2's clock."
value = ['\bgit\s+push\b', '\bgh\s+pr\s+create\b']

[claim_evidence.state_res]
doc = "Commands that look at CI or the merge state: matched against the commands run AFTER the last push of the turn. Any hit satisfies rule 2."
value = [
  '\bgh\s+run\s+(?:view|watch|list)\b',
  '\bgh\s+pr\s+(?:checks|view|merge|status|list)\b',
  '\bgh\s+(?:api|workflow\s+(?:view|run))\b',
  '\bgh\s+release\s+(?:view|list)\b',
  '\bgit\s+(?:ls-remote|fetch)\b',
]

[claim_evidence.ack_pushed_res]
doc = "A reply that states the CI or merge state honestly is never held by rule 2 (CI pending or unchecked, not merged, awaiting review). Regular expressions, case-insensitive."
value = [
  '\b(?:ci|checks?|pipeline|actions?|build)\b[^.\n]{0,40}\b(?:pending|running|queued|not\s+(?:yet\s+)?(?:checked|verified|run|green|finished|done)|unchecked|unverified|failed|red|green|passed|passing)\b',
  '\b(?:not|never|un)\s*(?:yet\s+)?(?:merged|checked|verified|released|deployed)\b',
  '\bunmerged\b',
  '\b(?:pending|awaiting|waiting\s+(?:for|on))\s+(?:ci|review|merge|checks?|the\s+run)\b',
  '\bpushed\b[^.\n]{0,60}\b(?:not|but|only)\b',
  '\bdo\s+not\s+(?:merge|wait)\b',
]

[claim_evidence.msg_pushed_what]
doc = "Rule 2 headline."
value = "pushed this turn, then called done, but CI and merge state were never checked."

[claim_evidence.msg_pushed_instead]
doc = "Rule 2 advice."
value = "check the run (gh run list, gh pr checks), or report it as pushed, not done."
