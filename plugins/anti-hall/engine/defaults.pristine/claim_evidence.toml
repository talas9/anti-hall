# Claim-evidence guard (GH #313, part of #307), Stop, Claude, engine-only (no Node twin). One check, two rules, each with its own switch:
#   1. claim needs evidence: a reply that asserts a completed check or outcome ("tests pass", "verified", "deployed", "is fixed") must be
#      backed by a tool call of THIS turn that could have produced it; a bare assertion is held once.
#   2. pushed is not done: a reply that calls the work done after a push or PR in this turn, with no later look at CI or the merge
#      state, is held once.
# Logic: engine/logic/claim-evidence-guard.js (reads the reply, the engine's evidence walk and the commands of the turn). Every
# phrase, pattern, number and text is here (D88). Regular expressions are Rust syntax (linear time, no look-around). Codex payloads are
# not judged: the evidence walk reads Claude transcripts only. The judgement parts (is this claim about the turn's work at all?) are
# not asked of Jev yet: they ship after the rule has a measured catch rate and noise (#313, #316).

[claim_evidence.sw_claim]
doc = "Switch guards.claimEvidence (default on): off lets a reply assert a check or outcome with no matching tool call this turn."
value = { section = "guards", key = "claimEvidence", type = "boolean", env = "ANTIHALL_CLAIM_EVIDENCE", option = "", default = true }

[claim_evidence.sw_pushed]
doc = "Switch guards.pushedNotDone (default on): off lets a reply call pushed work done without a look at CI or the merge state."
value = { section = "guards", key = "pushedNotDone", type = "boolean", env = "ANTIHALL_PUSHED_NOT_DONE", option = "", default = true }

[claim_evidence.guard_name]
doc = "The guard id this check answers to in skip.json and in its messages."
value = "claim-evidence-guard"

[claim_evidence.summary]
doc = "One-line description of the claim-evidence-guard check in the generated reference."
value = "Stop (Claude): holds once a reply that claims a result (tests pass, verified, deployed, is fixed) with no matching tool call this turn (guards.claimEvidence), or that calls work done after a push with no look at CI or the merge state (guards.pushedNotDone)."

[claim_evidence.mode]
doc = "What a hit does: block (the Stop is held once per reply, the reply is asked to run the check or label the claim) or log (the hit is only written to the engine log, for measuring noise before it acts)."
value = "block"

[claim_evidence.max_blocks]
doc = "Most holds per cap_scope window; a new real owner turn resets it. Same-text dedupe is independent: the same reply is never held twice."
value = 2
min = 1
max = 20

[claim_evidence.cap_scope]
doc = "Block-cap scope: owner_turn (default) resets max_blocks on a new real user turn; session keeps a session-wide cap."
value = "owner_turn"

[claim_evidence.state_prefix]
doc = "Prefix of the per-session state file name under the replykit state directory (the sanitised session id and the JSON extension follow)."
value = "claim-evidence-state-"

[claim_evidence.log_kind]
doc = "Engine log kind written for a hit (block or log mode)."
value = "claim_evidence"

[claim_evidence.ack_res]
doc = "A reply that already labels itself honest is never held (rule 1): the claim is negated, hedged, or tied to an earlier run. Regular expressions, case-insensitive, matched against the reply with quoted text and code removed."
value = [
  '\b(?:not|never|n.t|un|without)\s*(?:yet\s+|been\s+|fully\s+)?(?:verified|verifying|tested|run|ran|checked|confirmed|deployed|released|merged)\b',
  '\bunverified\b',
  '\b(?:did|do|does|have|has|had|was|were|am|is|are)(?:n.t| not)\s+(?:able to\s+)?(?:run|check|verify|test|confirm|deploy)',
  '\b(?:no|zero)\s+(?:tests?|checks?|runs?)\s+(?:were\s+|was\s+)?(?:run|ran|executed)\b',
  '\b(?:from|in|per|as of)\s+(?:the\s+)?(?:earlier|previous|prior|last|preceding)\s+(?:turn|run|session|check|result|message|commit)',
  '\b(?:earlier|previously|before)\s+(?:i\s+|we\s+)?(?:ran|verified|checked|confirmed|tested)\b',
  '\b(?:pending|awaiting|waiting for|once)\s+(?:ci|review|the run|the check)',
  '\b(?:expected|supposed|meant|intended)\s+to\s+(?:pass|work|be)\b',
]

# ---- rule 1: claim needs evidence ---------------------------------------------------------------------------

[claim_evidence.claims]
doc = "The result claims rule 1 looks for, in order; the first row that matches a reply decides. id: the label in the message and the log. re: Rust regular expression (case-insensitive) on the reply with quoted text and code removed. needs: command patterns (Rust syntax) of which at least one must match a command run this turn; empty means any tool call this turn is enough. With no tool call at all this turn, every row fires."
value = [
  { id = "tests pass", re = '\b(?:all\s+)?(?:\d[\d,]*\s+)?(?:unit\s+|integration\s+|e2e\s+)?tests?\s+(?:(?:are|is|now|all|still)\s+)*(?:pass(?:es|ed|ing)?|green)\b|\b\d[\d,]*\s+(?:tests?\s+)?passed\b|\b(?:build|ci|suite|checks?|lint)\s+(?:(?:is|are|now|all)\s+)*(?:green|passing|passes|passed)\b', needs = ['\b(?:cargo\s+(?:test|nextest|check|clippy|build)|node\s+--test|npm\s+(?:run\s+)?(?:test|build|lint)|pnpm\s+(?:run\s+)?(?:test|build|lint)|yarn\s+(?:test|build|lint)|pytest|go\s+(?:test|build|vet)|jest|vitest|flutter\s+(?:test|analyze)|dart\s+(?:test|analyze)|gradlew?\s+\S*(?:test|build)|make\s+(?:test|check|build)|tsc|eslint|clippy|gh\s+run\s+(?:view|watch|list)|gh\s+pr\s+checks|\S*test\S*\.(?:sh|js|py))\b'] },
  { id = "shipped", re = '\b(?:has\s+been|have\s+been|is|are|was|were|now)\s+(?:deployed|released|published|merged|live)\b|\b(?:deployed|released|published)\s+(?:to\s+\S+|as\s+v?\d)', needs = ['\b(?:deploy|release|publish|merge|gh\s+(?:pr|release|run|api)|git\s+(?:push|tag|merge)|firebase|npm\s+publish|cargo\s+publish|kubectl|vercel|fastlane)\b'] },
  { id = "verified", re = '\b(?:verified|confirmed)\b', needs = [] },
  { id = "fixed", re = '\b(?:is|are|now|been)\s+(?:now\s+)?fixed\b|\bfixed\s+and\s+(?:verified|working|tested)\b', needs = [] },
  { id = "all done", re = '\ball\s+(?:the\s+)?(?:tasks?\s+|items?\s+|work\s+|steps?\s+)?(?:are\s+)?(?:done|complete[d]?|finished)\b', needs = [] },
]

[claim_evidence.msg_claim_what]
doc = "Rule 1 headline. Placeholders: {claim} the claim kind, {quote} the words found."
value = "\"{quote}\" ({claim}) has no matching check run this turn."

[claim_evidence.msg_claim_instead]
doc = "Rule 1 advice."
value = "run the check and show its result, or say it was not verified."

# ---- rule 2: pushed is not done -----------------------------------------------------------------------------

[claim_evidence.done_res]
doc = "Completion words of rule 2. Regular expressions, case-insensitive, matched against the reply with quoted text and code removed."
value = [
  '\b(?:all\s+)?(?:done|finished|shipped|delivered|landed|resolved|wrapped up|all set)\b',
  '\bcomplete[d]?\b',
  '\bready\s+(?:to|for)\s+(?:merge|ship|release|review|use)\b',
]

[claim_evidence.push_res]
doc = "Commands that publish work: matched against each command run this turn (Rust syntax). A hit starts rule 2's clock."
value = ['\bgit\s+push\b', '\bgh\s+pr\s+create\b']

[claim_evidence.state_res]
doc = "Commands that look at CI or the merge state: matched against the commands run AFTER the last push of the turn. Any hit satisfies rule 2."
value = [
  '\bgh\s+run\s+(?:view|watch|list)\b',
  '\bgh\s+pr\s+(?:checks|view|merge|status|list)\b',
  '\bgh\s+(?:api|workflow\s+(?:view|run))\b',
  '\bgh\s+release\s+(?:view|list)\b',
  '\bgit\s+(?:ls-remote|fetch)\b',
]

[claim_evidence.ack_pushed_res]
doc = "A reply that states the CI or merge state honestly is never held by rule 2 (CI pending or unchecked, not merged, awaiting review). Regular expressions, case-insensitive."
value = [
  '\b(?:ci|checks?|pipeline|actions?|build)\b[^.\n]{0,40}\b(?:pending|running|queued|not\s+(?:yet\s+)?(?:checked|verified|run|green|finished|done)|unchecked|unverified|failed|red|green|passed|passing)\b',
  '\b(?:not|never|un)\s*(?:yet\s+)?(?:merged|checked|verified|released|deployed)\b',
  '\bunmerged\b',
  '\b(?:pending|awaiting|waiting\s+(?:for|on))\s+(?:ci|review|merge|checks?|the\s+run)\b',
  '\bpushed\b[^.\n]{0,60}\b(?:not|but|only)\b',
  '\bdo\s+not\s+(?:merge|wait)\b',
]

[claim_evidence.msg_pushed_what]
doc = "Rule 2 headline."
value = "pushed this turn, then called done, but CI and merge state were never checked."

[claim_evidence.msg_pushed_instead]
doc = "Rule 2 advice."
value = "check the run (gh run list, gh pr checks), or report it as pushed, not done."
