# ah-engine shipped defaults for the operator helper commands (D81): `jev-setup`, `capability-scan`, `harvest` and `briefing`
# (the `src/setup/` module). Format: see the header of engine.toml.
#
# Every entry names the Node script it mirrors. The message texts are the Node ones word for word, because the parity tests
# compare the commands' output with the scripts' byte for byte.

[env.setup_host_plugin_root]
doc = "The plugin-root variable the host exports to hooks and skills; `capability-scan` and `briefing` read the plugin tree it names when `--root` is not given."
value = "CLAUDE_PLUGIN_ROOT"

# ---- shared ---------------------------------------------------------------------------------------------------------

[setup.json_max_depth]
doc = "Nesting past which a JSON file the helper commands read is treated as unreadable (JSON.parse reads deeper than the port does)."
value = 512
min = 8
max = 100000

[setup.read_max_bytes]
doc = "Largest configuration or state file the helper commands read; a larger file is refused, never read in part or held in memory."
value = 8388608
unit = "bytes"
min = 1024

[setup.stdin_max_bytes]
doc = "Most bytes `jev-setup set-key` reads from stdin; a key is a short single line."
value = 65536
unit = "bytes"
min = 16

[setup.log_max_bytes]
doc = "Most bytes of one Jev decision-log file `jev-setup status` reads to count the last day's calls; the log rotates at 2 MB."
value = 16777216
unit = "bytes"
min = 1024

[setup.msg_too_large]
doc = "Why a file was not read: it is larger than the limit. Placeholders: path, max."
value = "{path} is larger than {max} bytes, so it is not read"

[setup.msg_treated_absent]
doc = "A file or directory could not be read and is treated as absent, as the Node script treats it. Placeholder: error."
value = "warning: {error}; treated as absent"

[setup.msg_git_reader_panicked]
doc = "The thread that reads git's answer ended abnormally, so the file has no last-commit time."
value = "warning: reading git's answer failed; the file has no last-commit time"

[setup.what_write_stdout]
doc = "What was being done when writing to standard output failed."
value = "write to standard output"

[setup.what_cwd]
doc = "What was being done when the current directory could not be read."
value = "read the current directory"

[setup.what_read]
doc = "What was being done when a file could not be read, followed by its path."
value = "read"

[setup.what_list]
doc = "What was being done when a directory could not be listed, followed by its path."
value = "list"

[setup.what_resolve]
doc = "What was being done when the plugin tree named by --root could not be resolved, followed by its path."
value = "resolve"

[setup.what_stat]
doc = "What was being done when a path could not be examined, followed by its path."
value = "examine"

[setup.what_git]
doc = "What was being done when git could not be run for a last-commit time."
value = "ask git for a last-commit time"

[setup.compare_chunk_bytes]
doc = "Size of the chunks two files are compared in, so that neither is held in memory whole."
value = 65536
unit = "bytes"
min = 16

[setup.what_crontab]
doc = "What was being done when the crontab could not be read."
value = "ask crontab for the managed cron markers"

[setup.brief_scan_bytes]
doc = "How much of a hook file's start is read to find its header comment (Node reads the file and looks at its first 38 lines)."
value = 262144
unit = "bytes"
min = 1024

[setup.git_binary]
doc = "The git program `harvest` asks for a file's last commit time."
value = "git"

[setup.git_timeout_ms]
doc = "Longest `harvest` waits for git to name one file's last commit time (Node: 5000 ms); a slower answer counts as no answer."
value = 5000
unit = "ms"
min = 100
max = 60000

[setup.msg_no_plugin_root]
doc = "Printed when a command that reads a plugin tree was given neither --root nor a plugin-root variable."
value = "no plugin tree to read: pass --root <plugin directory>, or run it where the host exports the plugin root"

[setup.msg_no_home]
doc = "Printed by the helper commands when the home directory variable is not set, because their files live under it."
value = "the home directory is not set"

# ---- harvest (scripts/harvest-debt.js) ---------------------------------------------------------------------------------

[setup.harvest_leaders]
doc = "The comment leaders a debt marker may follow, in the order the Node pattern tries them."
value = ["//", "#", "--", "/*", "<!--"]

[setup.harvest_tag]
doc = "The word that makes a comment a debt marker, after the comment leader."
value = "anti-hall:"

[setup.harvest_closers]
doc = "The comment terminators trimmed off a marker's text (block comments and HTML comments)."
value = ["*/", "-->"]

[setup.harvest_max_file_bytes]
doc = "Largest file `harvest` reads (Node: 2 MB); bigger files are skipped."
value = 2097152
unit = "bytes"
min = 1

[setup.harvest_binary_check_bytes]
doc = "How much of a file's start is checked for a NUL byte before it is treated as binary and skipped (Node: 4096)."
value = 4096
unit = "bytes"
min = 1

[setup.harvest_skip_dirs]
doc = "Directory names `harvest` never descends into (names starting with a dot are skipped too)."
value = [".git", "node_modules"]

[setup.harvest_default_stale_days]
doc = "Days after which an untouched file's marker counts as stale when --stale-days is not given (Node: 90)."
value = 90
unit = "days"
min = 1

[setup.harvest_w_file]
doc = "Width of the file column of the `harvest` text table (Node: 40)."
value = 40
min = 8

[setup.harvest_w_line]
doc = "Width of the line column of the `harvest` text table (Node: 6)."
value = 6
min = 1

[setup.harvest_w_ceiling]
doc = "Width of the ceiling column of the `harvest` text table (Node: 20)."
value = 20
min = 3

[setup.harvest_w_when]
doc = "Width of the trigger column of the `harvest` text table (Node: 26)."
value = 26
min = 3

[setup.harvest_w_rot]
doc = "Longest rot-risk text of the `harvest` text table (Node: 40)."
value = 40
min = 5

[setup.harvest_rule_extra]
doc = "How much longer than the four columns the rule under the `harvest` table header is (Node: 30)."
value = 30
min = 0

[setup.git_output_max_bytes]
doc = "Most bytes of git's answer to a last-commit-time question that are read; the answer is one number."
value = 64
min = 16
max = 4096

[setup.msg_no_trigger]
doc = "The rot reason of a marker with no payback trigger."
value = "no payback trigger (when is absent)"

[setup.msg_stale]
doc = "The rot reason of a marker in a file not touched for the stale window. Placeholder: days."
value = "file not touched in >{days} days"

[setup.msg_none_found]
doc = "Printed by `harvest` when the tree holds no marker."
value = "No anti-hall debt markers found."

[setup.msg_table_title]
doc = "The title line of the `harvest` text table."
value = "anti-hall debt markers"

