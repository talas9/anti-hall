# ah-engine shipped defaults for the native ingest drain (lane l7b, `src/dssup/ingest`): what the old Node ingest daemon
# (one launchd / systemd unit per project) did - the single-consumer drain of `hivecontrol workspace
# monitor` into the per-repo store - taken over by the engine so those units can be uninstalled. Format: see the header of
# engine.toml. Every key can be overridden in the `devswarm_ingest` section of settings.json. Nothing here is compiled into the binary.
#
# THE SWITCH: `devswarm_ingest.mode`. `engine` (the default) makes the engine's daemon run one drain per project. While a Node daemon still holds a project's lock the engine waits for
# it (a live holder's lock is never taken over, so a destructive queue is never read by two consumers) and takes over as soon as the
# holder is gone. The go-live steps are in docs/AH-ENGINE.md, "DevSwarm supervisor and ingest cutover".

[devswarm_ingest.mode]
doc = "Who drains the DevSwarm native queue: engine (the default: the engine's daemon runs one drain per project; a live Node daemon holding a project's lock is waited for, never taken over) | witness (the Node ingest daemons do; the engine starts nothing). Anything else reads as witness, so a typo never starts a second consumer. The engine never edits any settings file or any launchd / systemd unit."
value = "engine"

[devswarm_ingest.mode_words]
doc = "The words of devswarm_ingest.mode, in the order witness, engine."
value = ["witness", "engine"]

[devswarm_ingest.projects]
doc = "Extra projects to drain, as paths of a git repository separated by the character in projects_separator (any worktree of it will do). Projects of registered DevSwarm workspaces, projects with a fresh Node ingest heartbeat and the ones an earlier run remembered are drained too (those three only when they qualify, see require_registered)."
value = ""

[devswarm_ingest.projects_separator]
doc = "The character that separates paths in devswarm_ingest.projects."
value = ":"

[devswarm_ingest.remembered]
doc = "The projects the engine has drained or found, a JSON list of paths, in the engine state directory. Nothing is ever removed from it."
value = "devswarm-ingest-projects.json"

[devswarm_ingest.require_registered]
doc = "Drain only projects that DevSwarm registered: a project qualifies when a workspace descriptor (devswarm/workspaces/*.json) carries its repo key. A scratch clone, a plugin checkout or any other git directory an agent happened to work in never qualifies. Paths in devswarm_ingest.projects always qualify. The registered workspaces' worktrees are also a discovery source, so a new project is drained by the engine without a Node ingest unit."
value = true

[devswarm_ingest.owner_file]
doc = "The ownership marker the engine writes in the DevSwarm state directory (devswarm/<this>): {owner, pid, ts, validForMs}. owner is a word of devswarm_ingest.mode_words. The Node ingest installer, the ah-hook mesh self-heal, doctor --repair and the update heal read it and install or heal no Node ingest unit while owner is engine and ts is younger than validForMs."
value = "ingest-owner.json"

[devswarm_ingest.owner_refresh_ms]
doc = "How often the engine rewrites the ownership marker while it owns the drain."
value = 60000
min = 1000
max = 86400000
unit = "ms"

[devswarm_ingest.owner_valid_ms]
doc = "How long the ownership marker stays valid after its last write (written into the marker as validForMs). It spans engine restarts, so a restart window never lets Node reinstall a retired unit; an engine that is gone for longer hands installs back to Node."
value = 3600000
min = 60000
max = 604800000
unit = "ms"

[devswarm_ingest.discover_ms]
doc = "How often the engine looks for projects it does not drain yet."
value = 60000
min = 1000
max = 86400000
unit = "ms"

[devswarm_ingest.discover_max_age_ms]
doc = "A Node ingest heartbeat written within this long names a project the Node daemon serves, so the engine serves it after the cutover."
value = 900000
min = 60000
max = 31536000000
unit = "ms"

# ---- the monitor call ------------------------------------------------------------------------------------------------------

[devswarm_ingest.set_timeout_sec]
doc = "The -t of every monitor call: it long-polls at most this long, then exits (an empty exit is a quiet poll, not an error). Node: devswarm.monitorTimeoutSec. A value that is not a positive number reads as the default."
value = { type = "number", section = "devswarm", key = "monitorTimeoutSec", env = "ANTIHALL_DEVSWARM_MONITOR_TIMEOUT_SEC", default = 30 }

[devswarm_ingest.interval_sec]
doc = "The -i of every monitor call, and the least time between two calls after a successful one (Node: DEFAULT_MONITOR_INTERVAL_SEC was 3). Each call is a Node process of the DevSwarm CLI whose CPU (about 70 ms) is its start-up, not its polling, so the pause is what bounds the cost: 30 s halves the calls per minute, and a native message waits at most this long longer (the native queue is the discouraged channel; the mesh is not affected)."
value = 30
min = 1
max = 3600
unit = "s"

[devswarm_ingest.hard_margin_ms]
doc = "How long beyond its own -t a monitor call may run before the engine kills its own child (a hivecontrol that ignores its timeout must not park the drain). What it printed before the kill is kept."
value = 10000
min = 1000
max = 600000
unit = "ms"

[devswarm_ingest.max_pace_ms]
doc = "The ceiling of the pause after a successful call, whatever interval_sec says."
value = 300000
min = 1000
max = 3600000
unit = "ms"

[devswarm_ingest.output_cap_bytes]
doc = "Most bytes of one monitor call's output kept. The read is destructive, so this is far above any real batch; a batch that still exceeds it is logged, quarantined and kept whole in the WAL only up to this size."
value = 67108864
min = 1048576
max = 1073741824

[devswarm_ingest.monitor_args]
doc = "The words after the executable of a monitor call."
value = ["workspace", "monitor"]

[devswarm_ingest.flag_interval]
doc = "The monitor option for the poll interval."
value = "-i"

[devswarm_ingest.flag_timeout]
doc = "The monitor option for the long-poll timeout."
value = "-t"

[devswarm_ingest.scrub_env_prefixes]
doc = "Environment variables whose name starts with one of these are removed from the monitor child, so a daemon started from inside a workspace never reads the queue as that workspace."
value = ["DEVSWARM_"]

[devswarm_ingest.env_hivecontrol]
doc = "The environment variable that names the hivecontrol executable (the installer baked it into the unit; the engine reads it too)."
value = "ANTIHALL_DEVSWARM_HIVECONTROL"

[devswarm_ingest.hc_cache]
doc = "The path cache the installer writes, relative to the DevSwarm state directory."
value = "hivecontrol-path.json"

[devswarm_ingest.hc_cache_key]
doc = "The key of the path cache that holds the executable."
value = "hivecontrol"

[devswarm_ingest.env_path]
doc = "The environment variable the heartbeat records the daemon's PATH from."
value = "PATH"

[devswarm_ingest.src_env]
doc = "The heartbeat's word for an executable named by the environment variable."
value = "env"

[devswarm_ingest.src_cache]
doc = "The heartbeat's word for an executable taken from the path cache."
value = "cache"

[devswarm_ingest.src_path]
doc = "The heartbeat's word for a bare executable name left to the OS to resolve."
value = "path"

[devswarm_ingest.stderr_tail_chars]
doc = "Most characters of a failed monitor call's stderr kept in the error."
value = 2048
min = 0
max = 1000000

[devswarm_ingest.code_timeout]
doc = "The error code of a monitor call the engine killed at its hard limit."
value = "ETIMEDOUT"

[devswarm_ingest.spawn_error_codes]
doc = "How the operating system's words for a failed spawn map to the configuration-fault codes of the breaker: the first entry whose text the error contains."
value = [
  { text = "No such file or directory", code = "ENOENT" },
  { text = "Permission denied", code = "EACCES" },
  { text = "Not a directory", code = "ENOTDIR" },
]

[devswarm_ingest.permanent_codes]
doc = "The error codes that are CONFIGURATION faults (retrying every few seconds cannot fix them): the breaker escalates the backoff and logs only on a change."
value = ["ENOENT", "EACCES", "ENOTDIR"]

[devswarm_ingest.permanent_steps]
doc = "Multipliers of backoff_base_ms for the successive configuration failures (the last one repeats)."
value = ["1", "2.5", "15", "60", "150"]

[devswarm_ingest.backoff_base_ms]
doc = "The base of both backoff ladders: a transient failure waits base x 2^(n-1), a configuration failure base x the n-th step."
value = 2000
min = 10
max = 600000
unit = "ms"

[devswarm_ingest.backoff_shift_max]
doc = "The largest doubling exponent of a transient failure's backoff, before transient_cap_ms."
value = 30
min = 0
max = 62

[devswarm_ingest.transient_cap_ms]
doc = "The longest backoff after a transient failure."
value = 300000
min = 1000
max = 3600000
unit = "ms"

[devswarm_ingest.permanent_cap_ms]
doc = "The longest backoff after a configuration failure."
value = 300000
min = 1000
max = 3600000
unit = "ms"

[devswarm_ingest.rollup_ms]
doc = "Once the configuration-failure ladder is capped, one 'still failing' line at most this often."
value = 900000
min = 1000
max = 86400000
unit = "ms"

# ---- lock, legacy consumers, loop ------------------------------------------------------------------------------------------


[devswarm_ingest.lock_prefix]
doc = "The start of a project's lock file name (followed by the repo key and the lock suffix), relative to the DevSwarm locks directory. Node's file."
value = "ingest-project-"

[devswarm_ingest.legacy_lock_prefix]
doc = "The start of a legacy per-worktree consumer's lock file name (followed by the worktree hash)."
value = "ingest-"

[devswarm_ingest.lock_stale_ms]
doc = "A lock record older than this whose holder is not a live local process is taken over (Node: INGEST_LOCK_STALE_MS). A live holder's lock is never taken over."
value = 900000
min = 1000
max = 86400000
unit = "ms"

[devswarm_ingest.lock_retry_ms]
doc = "How long the drain of a project waits before trying the lock (and the other start conditions) again after a refusal."
value = 30000
min = 100
max = 3600000
unit = "ms"

[devswarm_ingest.legacy_probe]
doc = "1: do not drain a repo while a legacy per-worktree ingest consumer of it is alive (the reap-before-drain probe; it removes nothing). 0: skip the probe, for after the Node units are uninstalled."
value = 1
min = 0
max = 1

[devswarm_ingest.git_worktree_args]
doc = "The words after git of the command that lists a repo's worktrees."
value = ["worktree", "list", "--porcelain"]

[devswarm_ingest.porcelain_worktree]
doc = "The start of a worktree line in that listing."
value = "worktree "

[devswarm_ingest.shutdown_wait_ms]
doc = "How long the daemon waits at shutdown for the drain threads to finish the monitor call in flight (it has already taken its messages off the native queue, so they must reach the WAL and the store before the process exits)."
value = 60000
min = 1000
max = 600000
unit = "ms"

[devswarm_ingest.stop_poll_ms]
doc = "How often the manager checks whether a worker it asked to stop has finished (the joins of a lowered cap and of a shutdown). The naps of an ingest thread that only waits are devswarm_ingest.idle_poll_ms."
value = 200
min = 10
max = 10000
unit = "ms"

[devswarm_ingest.worker_idle_wait_ms]
doc = "How long an idle drain worker blocks on the job queue before it looks at its own stop flag again. A job, a stop message or the queue closing wakes it at once; but a stop message goes to whichever idle worker takes it first, so the worker that was told to retire (a lowered cap) can only learn it by this timeout. Longer means fewer idle wake-ups and a slower retirement."
value = 1000
min = 100
max = 600000
unit = "ms"

[devswarm_ingest.idle_poll_ms]
doc = "How often an ingest thread that is only waiting (the manager between two discoveries, a drain between two monitor calls, a drain waiting for a Node holder's lock) looks at its stop flag: its sleep is split into naps this long. Every nap is a wake-up of an otherwise idle thread, so a shorter value costs idle CPU for every project; it is also the longest a waiting drain takes to notice a stop. A drain that is working checks the flag between steps (devswarm_ingest.stop_poll_ms is the poll of the stop-side joins)."
value = 1000
min = 10
max = 10000
unit = "ms"

[devswarm_ingest.worker_thread_name]
doc = "The name of a drain worker thread (what `status --threads` and a stack sample call it)."
value = "ah-ingest-worker"

[devswarm_ingest.beat_every_ms]
doc = "While the drain waits, how often it re-stamps its lock and heartbeat (consumers judge a daemon dead after 3 minutes)."
value = 30000
min = 1000
max = 170000
unit = "ms"

