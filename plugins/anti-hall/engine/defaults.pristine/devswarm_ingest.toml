value = "\n...[truncated at {n} bytes]"

[devswarm_ingest.msg_no_detail]
doc = "The error text of a failed monitor call that carried none."
value = "monitor run failed (no error detail)"

[devswarm_ingest.msg_spawn_failed]
doc = "The error of a monitor child that could not be started. {bin} {code}."
value = "spawn {bin} {code}"

[devswarm_ingest.msg_timeout]
doc = "The error of a monitor child killed at its hard limit. {bin} {ms}."
value = "monitor {bin} ETIMEDOUT after {ms}ms"

[devswarm_ingest.msg_exit_stderr]
doc = "The note of a monitor child that exited non-zero. {bin} {status} {tail}."
value = "monitor {bin} exited {status} - stderr: {tail}"

[devswarm_ingest.msg_exit_no_stderr]
doc = "The note of a monitor child that exited non-zero with no stderr. {bin} {status}."
value = "monitor {bin} exited {status} (no stderr output)"

[devswarm_ingest.msg_log_transient]
doc = "The log line of a transient monitor failure. {error}."
value = "monitor call failed (transient): {error}"

[devswarm_ingest.msg_log_permanent]
doc = "The log line of a configuration monitor failure. {code} {n} {since} {backoff} {error}."
value = "monitor spawn failing with a CONFIGURATION error ({code}): {error} - {n} consecutive, {since} since the last line. Retrying is futile until it is fixed: set ANTIHALL_DEVSWARM_HIVECONTROL to the absolute path of the hivecontrol CLI. Backing off {backoff} ms."

[devswarm_ingest.msg_log_recovered]
doc = "The log line when the monitor works again after configuration failures. {n}."
value = "monitor spawn recovered after {n} consecutive configuration failure(s)"

[devswarm_ingest.drop_reason_defer]
doc = "The drop reason when the identity resolver cannot tell the project's repository without git (detail: the deferral code, e.g. git-superproject)."
value = "identity-deferred"

[devswarm_ingest.drop_reason_non_git]
doc = "The drop reason for a path that is not in a git repository or no longer exists (detail: the kind the resolver reported)."
value = "not-a-repository"

[devswarm_ingest.drop_reason_no_main]
doc = "The drop reason when the repository's main worktree is not an existing directory (detail: that path)."
value = "main-worktree-missing"

[devswarm_ingest.drop_reason_no_key]
doc = "The drop reason when the resolver gave no repo key."
value = "no-repo-key"

[devswarm_ingest.drop_reason_primary_id]
doc = "The drop reason when the Primary's workspace id could not be derived (detail: the resolver's code)."
value = "primary-id-error"

[devswarm_ingest.drop_reason_unregistered]
doc = "The drop reason for a project no workspace descriptor names while devswarm_ingest.require_registered is on (detail: its repo key)."
value = "not-registered"

[devswarm_ingest.msg_project_dropped]
doc = "The log line when a path found as a project is not drained, written once per (path, reason). {path} {reason} {detail}."
value = "ingest project skipped: path={path}, reason={reason}, detail={detail}"

[devswarm_ingest.drop_log_max_paths]
doc = "Most paths whose last drop reason is remembered (the once-per-reason memory); past it the memory starts over, which can repeat a line."
value = 1024
min = 1

[metric.ingest_drops]
doc = "Paths found as ingest projects that were not drained, counted when the reason is first seen or changes, by reason."
value = { kind = "counter", unit = "paths", labels = ["reason"] }
