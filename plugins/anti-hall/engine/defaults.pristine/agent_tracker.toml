# ---- the owner's channel and the stop action for stuck agents (task #207, src/agents/escalate.rs; the nudge loop is agent_nudge.toml) ----------------------------------------------

[agent_tracker.act_setting]
doc = "Where the switch of the stuck-agent action is read from (agents.actOnStuck, default on): on, a child whose nudge was escalated to the owner and is still open past agent_tracker.escalate.act_after_ms is stopped by the means its kind allows (a one-shot Codex run: SIGTERM by the pid that holds its rollout open, re-checked; a DevSwarm workspace: the stop request of `agents send`; a subagent or teammate: a stop request to its live coordinator). Primaries are never acted on. Off, it is only escalated."
value = { section = "agents", key = "actOnStuck", env = "ANTIHALL_AGENT_ACT_ON_STUCK", aliases = [], option = "", default = true }

[agent_tracker.escalate]
doc = "The owner's channel and the stop action for stuck agents (src/agents/escalate.rs, used by the nudge loop of agent_nudge.toml). act_after_ms: a nudge that was escalated to the owner and is still open this long after it was first sent runs the action of the child's kind (agent_tracker.act_setting), once. exempt_kinds: kinds never nudged about or acted on (a Primary may run for hours; a DevSwarm Primary's session is exempt by its descriptor prefix agent_tracker.primary_prefix). codex_hung_ms: a one-shot Codex run quiet this long with no terminal record, whose process still holds its rollout open, is hung (a nudge to the session that launched it). term_cmds: the command substrings a process must show to be signalled for a Codex row (one-shot runs only: a shared Codex server holds many sessions' rollouts and never matches)."
value = { act_after_ms = 3600000, exempt_kinds = ["main"], codex_hung_ms = 1800000, term_cmds = ["codex exec"] }

[agent_tracker.escalate_words]
doc = "The action words the stop action writes to telemetry (field action)."
value = { act_term = "term", act_stop_request = "stop_request", act_none = "none" }

