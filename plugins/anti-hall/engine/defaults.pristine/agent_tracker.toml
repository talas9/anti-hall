[msg.agent_armed_lapsed]
doc = "What {armed} reads when the last one has lapsed; {ago} is how long ago."
value = "the last one lapsed {ago} ago"

[msg.agent_no_tool]
doc = "What {tool} reads when the agent's last activity was not a tool call."
value = "its own reply"

[msg.agent_status_empty]
doc = "What `agents status` prints when no agent is tracked."
value = "no agents tracked"

[msg.agent_status_totals]
doc = "The summary line under the status table. Placeholders: {agents}, {flagged}, {signals}, {queued}, {delivered}, {suppressed}, {recovered}, {fp}, {burned}."
value = "agents {agents}, flagged {flagged}; today: signals {signals}, reminders queued {queued}, delivered {delivered}, held back {suppressed}, recoveries {recovered}, false positives {fp}, tokens burned by flagged agents {burned}"

[msg.agent_status_source]
doc = "The status footer for the Claude Code CLI source. Placeholders: {version}, {ok}."
