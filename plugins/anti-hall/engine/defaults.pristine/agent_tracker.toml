[msg.agent_wake_reason_no_session]
doc = "Why the wake-watch did not arm: no session id in the environment."
value = "no session id in the environment"

[msg.agent_wake_reason_held]
doc = "Why the wake-watch did not arm: another live watcher already covers this session."
value = "another wake-watch already covers this session"

[msg.agent_armed_never]
