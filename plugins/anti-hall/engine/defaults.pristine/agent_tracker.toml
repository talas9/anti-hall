value = " Sent SIGTERM to Codex pid {pid} (it held the session's rollout open)."

[msg.agent_act_workspace]
doc = "Appended to the escalation when a hung DevSwarm workspace was asked to stop."
value = " Asked the workspace to stop (agents send --stop-request)."

[msg.agent_act_child]
doc = "Appended to the escalation when the live coordinator of a hung subagent or teammate was asked to stop it. Placeholder: {parent}."
value = " Asked its coordinator {parent} to stop it."

[msg.agent_act_child_request]
