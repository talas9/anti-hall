[webtel.export_path]
doc = "The route that downloads one table: `?table=<id>&format=csv|json&q=<filter>`."
value = "/api/telemetry/export"

[webtel.telemetry_path]
doc = "The route the Telemetry screen reads."
value = "/api/telemetry"

[webtel.impact_path]
doc = "The route the Impact screen reads."
value = "/api/impact"
