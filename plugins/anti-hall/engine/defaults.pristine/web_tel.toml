# ah-engine shipped defaults for the Command Center's Telemetry and Impact screens (ah-web). Format: see the header of engine.toml.
# `ah-web` reads this file next to web.toml (start-up, and again when it changes); the compiled server and page carry none of these
# numbers, sentences or metric definitions. Edit here, reload the page.
#
# Metric sources (what a daily series is read from, one engine `telemetry summary` window per day):
#   invocations              all hook decisions
#   outcome:<name>           decisions with that outcome (allow, advise, block, defer, error, skip, timeout)
#   kind:<name>              events of that kind (check, act, agent, jev, route, spill, ...)
#   hook:<check>:n           times one check ran
#   hook:<check>:<outcome>   times one check ended in that outcome
#   jev:calls                Jev judgements asked

[webtel.series_days]
doc = "How many days (today included) the daily series and the period comparisons look back. Needs the engine's telemetry retention to cover it."
value = 14
unit = "days"
min = 2
max = 30

[webtel.cache_s]
doc = "Seconds the built Telemetry and Impact documents are reused before the engine is asked again (one build costs one engine read per day of history)."
value = 20
unit = "s"
min = 1

[webtel.refresh_s]
doc = "Seconds between two reads of a screen while it is open (the server reuses its own read for cache_s)."
value = 30
unit = "s"
min = 5

[webtel.rows_shown]
doc = "Table rows the page draws before 'show more'."
value = 100
min = 10

[webtel.boot_keys]
doc = "The texts of `texts` the server also puts into the page's start-up data, so the navigation can name the screens before any is opened."
value = ["nav_telemetry", "nav_impact", "title_telemetry", "title_impact"]

[webtel.events_rows]
doc = "Raw telemetry events fetched for the Events table (newest first)."
value = 400
min = 10
max = 5000

[webtel.table_rows_max]
doc = "Most rows one table carries to the page and into an export."
value = 1000
min = 10
max = 100000

[webtel.spark_points]
doc = "Most points a sparkline draws (the newest days)."
value = 14
min = 2

[webtel.cmd_timeout_ms]
doc = "How long a helper engine command (coverage, usage) may run before its part is left out."
value = 8000
unit = "ms"
min = 500

[webtel.z_threshold]
doc = "How many robust standard deviations from a metric's own rolling median a day must be to count as unusual."
value = 3.5
min = 1.0

[webtel.mad_scale]
doc = "The factor that turns the median absolute deviation into a standard deviation for normally spread data."
value = 1.4826

[webtel.mad_floor_frac]
doc = "The smallest spread, as a fraction of the median, used when a metric's days are nearly identical (so a flat metric does not flag every wobble)."
value = 0.1
min = 0.0

[webtel.min_history_days]
doc = "Days before today a metric needs before it is judged at all."
value = 5
min = 2

[webtel.min_day_fraction]
doc = "Today is judged only once this fraction of the (UTC) day has passed; before that its count is too small to project."
value = 0.25
min = 0.01
max = 1.0

[webtel.min_abs_change]
doc = "An unusual day must also differ from the median by at least this many events."
value = 20
min = 1

[webtel.min_rel_change]
doc = "An unusual day must also differ from the median by at least this fraction of the median."
value = 0.3
min = 0.0

[webtel.pct_min_baseline]
doc = "A change is shown as a percentage only when the usual figure it is measured against is at least this many events; below that the plain change is shown."
value = 20
min = 1

[webtel.pct_cap]
doc = "The largest percentage shown for a change; a larger one is shown as this."
value = 1000
min = 1

[webtel.anomalies_max]
doc = "Most anomalies listed."
value = 6
min = 1

[webtel.movers_max]
doc = "Most rows per top-movers list."
value = 6
min = 1

[webtel.headline_checks]
doc = "How many of the most-blocking checks get their own headline."
value = 3
min = 1

[webtel.heat_rows]
doc = "Most checks in the day-by-check heatmap."
value = 14
min = 2

[webtel.mover_measures]
doc = "What top movers are ranked on: the per-check figure (`n` runs, or an outcome), its label and glossary text key, and whether a check that is unusual on it is also listed as an anomaly."
value = [
  { id = "block", measure = "block", anomaly = true, label = "Blocks", hint = "gl_mover_block" },
  { id = "runs", measure = "n", anomaly = false, label = "Runs", hint = "gl_mover_runs" },
]

[webtel.metrics]
doc = "The metric cards: id, label, source (see the header), unit (count, us, bytes, usd, tokens), good (which direction is better: down, up or neutral) and the glossary text key."
value = [
  { id = "decisions", label = "Hook decisions", source = "invocations", unit = "count", good = "neutral", hint = "gl_decisions" },
  { id = "blocks", label = "Blocked", source = "outcome:block", unit = "count", good = "neutral", hint = "gl_blocks" },
  { id = "advisories", label = "Advised", source = "outcome:advise", unit = "count", good = "neutral", hint = "gl_advisories" },
  { id = "errors", label = "Errors", source = "outcome:error", unit = "count", good = "down", hint = "gl_errors" },
  { id = "defers", label = "Deferred", source = "outcome:defer", unit = "count", good = "down", hint = "gl_defers" },
  { id = "timeouts", label = "Timeouts", source = "outcome:timeout", unit = "count", good = "down", hint = "gl_timeouts" },
  { id = "acts", label = "Autonomous actions", source = "kind:act", unit = "count", good = "neutral", hint = "gl_acts" },
  { id = "routes", label = "Model routing", source = "kind:route", unit = "count", good = "neutral", hint = "gl_routes" },
  { id = "jev", label = "Jev judgements", source = "jev:calls", unit = "count", good = "neutral", hint = "gl_jev" },
]

[webtel.periods]
doc = "The period comparisons of the Impact screen: `cur` and `prev` are [from, to) in days ago (0 = today so far). A period that includes today is compared per day, so a part-day is not set against a whole one."
value = [
  { id = "day", label = "Today vs yesterday", cur = [0, 1], prev = [1, 2] },
  { id = "week", label = "This week vs last week", cur = [0, 7], prev = [7, 14] },
]

[webtel.prevention]
doc = "Impact rows for what the guards stopped: id, label, the checks whose `outcome` decisions are summed, and the glossary text key."
value = [
  { id = "guard_blocks", label = "Guard blocks", hooks = ["*"], outcome = "block", hint = "gl_i_guard_blocks" },
  { id = "burn_breaker", label = "Burn-breaker trips", hooks = ["burn-breaker"], outcome = "block", hint = "gl_i_burn_breaker" },
  { id = "refused_spawns", label = "Refused spawns", hooks = ["swarm-guard", "model-routing-guard", "orch-on-spawn"], outcome = "block", hint = "gl_i_refused_spawns" },
  { id = "blocked_suites", label = "Blocked test suites", hooks = ["lane-test-guard"], outcome = "block", hint = "gl_i_blocked_suites" },
  { id = "git_blocks", label = "Blocked git actions", hooks = ["git-guard", "uncommitted-guard", "merge-gate"], outcome = "block", hint = "gl_i_git_blocks" },
  { id = "advice", label = "Advisories given", hooks = ["*"], outcome = "advise", hint = "gl_i_advice" },
]

[webtel.failures]
doc = "Impact rows for what went wrong: id, label, source (see the header) and the glossary text key."
value = [
  { id = "errors", label = "Errors", source = "outcome:error", hint = "gl_errors" },
  { id = "timeouts", label = "Timeouts", source = "outcome:timeout", hint = "gl_timeouts" },
  { id = "defers", label = "Deferred to the fallback", source = "outcome:defer", hint = "gl_defers" },
]

[webtel.usage_cmd]
doc = "The engine command that prints the weekly-limit usage (JSON: weekly, fiveHour, resetsAt)."
value = ["codex-limit-status"]

[webtel.coverage_cmd]
doc = "The engine command that prints which features the dashboard covers (JSON)."
value = ["describe", "--coverage", "--json"]

[webtel.week_hours]
doc = "Hours in the weekly limit window (the forecast spreads the used share over the part of it already elapsed)."
value = 168
unit = "h"

[webtel.forecast_bad_pct]
doc = "A projected weekly use above this percentage is shown as a warning."
value = 100
unit = "%"

[webtel.forecast_warn_pct]
doc = "A projected weekly use above this percentage is shown as a caution."
value = 85
unit = "%"

[webtel.fmt_us]
doc = "How a duration in microseconds is written (the same step format as web.number_units)."
value = { decimals = 1, units = [ { suffix = " us", from = 0, div = 1 }, { suffix = " ms", from = 1000, div = 1000 }, { suffix = " s", from = 1000000, div = 1000000 } ] }

[webtel.fmt_bytes]
doc = "How a size in bytes is written."
value = { decimals = 1, units = [ { suffix = " B", from = 0, div = 1 }, { suffix = " kB", from = 1000, div = 1000 }, { suffix = " MB", from = 1000000, div = 1000000 }, { suffix = " GB", from = 1000000000, div = 1000000000 } ] }

[webtel.fmt_age]
doc = "How an age in seconds is written (followed by the 'ago' text)."
value = { decimals = 0, units = [ { suffix = " s", from = 0, div = 1 }, { suffix = " min", from = 60, div = 60 }, { suffix = " h", from = 3600, div = 3600 }, { suffix = " d", from = 86400, div = 86400 } ] }

[webtel.uc_per_usd]
doc = "How many of the engine's cost units (cost_uc, as Jev records them) make one US dollar."
value = 1000000.0

[webtel.usd_decimals]
doc = "Digits after the point for a dollar figure."
value = 3

[webtel.apex]
doc = "The Full tier's chart library: a single vendored file (ApexCharts 4.7.0, MIT; later 5.x releases are under a revenue-limited community license and are not used) served from this server (script-src 'self', no CDN) and loaded only when the Telemetry or Impact screen opens. `file` is under the static directory. Colours are hex because the library blends them; the page theme picks the dark or light set."
value = { file = "vendor/apexcharts.min.js", load_timeout_ms = 8000, version = "4.7.0", palette = ["#4f8cff", "#3fb950", "#d29922", "#f85149", "#a371f7", "#39c5cf", "#db61a2", "#8b949e"], ok = "#3fb950", warn = "#d29922", bad = "#f85149", info = "#4f8cff", neutral = "#8b949e", dark = { fg = "#c9d1d9", grid = "#30363d", cell_gap = "#0d1117" }, light = { fg = "#24292f", grid = "#d0d7de", cell_gap = "#ffffff" }, heat = { dark = ["#161b22", "#1f3a6b", "#2b5aa8", "#3d7ae8", "#7fb0ff"], light = ["#eaeef2", "#c6dbff", "#8db8ff", "#4f8cff", "#1d5fd6"] }, height_main = 300, height_brush = 90, height_small = 240, zoom = true, animations = true }

