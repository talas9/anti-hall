# ---- expected-failure classifier (hooks/lib/expected-failure.js) -------------------------------------------

[expected_failure.predicate_verbs]
doc = "Verbs whose exit status 1 means no, different or false rather than broken."
value = ["grep", "egrep", "fgrep", "ugrep", "rg", "ag", "ack", "test", "[", "[[", "diff", "cmp", "pgrep", "which", "type"]

[expected_failure.trivial_verbs]
doc = "Statements that cannot fail on their own and may sit in an && chain."
value = ["echo", "printf", "true", ":"]

[expected_failure.pass_through]
doc = "Wrappers that pass the inner command's exit status through unchanged."
value = ["command", "builtin", "env", "time", "nice", "nohup"]

[expected_failure.predicate_exit]
doc = "The only exit code (as text) that counts as a predicate's answer."
value = "1"

[expected_failure.command_v_verb]
doc = "The verb name reported for the command -v form."
value = "command -v"

[expected_failure.git_verb]
doc = "The verb whose read-only predicate forms are recognised by git_predicates."
value = "git"

[expected_failure.git_predicates]
doc = "Regex sources (JavaScript syntax) over the arguments of a git command that make it a predicate (exit 1 is the answer)."
value = [
  '^(?:-C\s+\S+\s+)?diff\b.*(?:--quiet|--exit-code)\b',
  '^(?:-C\s+\S+\s+)?merge-base\b.*--is-ancestor\b',
  '^(?:-C\s+\S+\s+)?grep\b',
  '^(?:-C\s+\S+\s+)?cat-file\b.*\s-e\b',
  '^(?:-C\s+\S+\s+)?ls-files\b.*--error-unmatch\b',
  '^(?:-C\s+\S+\s+)?show-ref\b.*(?:--verify|--quiet|-q)\b',
]

[expected_failure.bail]
doc = "Regex source of the constructs that make the last statement not decide the exit status (heredocs, set -e, pipefail, trap, exec, eval, shells run with -e)."
value = '<<|\bset\s+-[A-Za-z]*e|\bset\s+-o\b|\bpipefail\b|\berrexit\b|\btrap\b|\bexec\b|\beval\b|\bbash\s+-[A-Za-z]*e\b|\bsh\s+-[A-Za-z]*e\b'

[expected_failure.assign]
doc = "Regex source of a leading VAR=value assignment word."
value = '^[A-Za-z_][A-Za-z0-9_]*='

[expected_failure.command_v]
doc = "Regex source of the command -v / command -V form (with optional leading assignments)."
value = '^(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*command\s+-[vV]\b'

[expected_failure.control]
doc = "Regex source of a statement that starts a shell control construct (never classified)."
value = '^(?:if|for|while|until|case|select|function|do|then|else|fi|done|esac)\b'

[expected_failure.trailing_bg]
doc = "Regex source of a statement ending in an ampersand."
value = '&\s*$'

[expected_failure.trailing_and]
doc = "Regex source of a statement ending in a double ampersand."
value = '&&\s*$'

[expected_failure.comment_or_empty]
doc = "Regex source of a statement that is a comment or empty."
value = '^\s*(?:#|$)'

[expected_failure.subst]
doc = "Regex source of a command substitution (dollar-parenthesis or backtick)."
value = '\$\(|`'

[expected_failure.redirect_split]
doc = "Regex source that finds the first redirection in a deciding command."
value = '\s(?:2?>|&>|<)'

[expected_failure.exit_code]
doc = "Regex source of the exit code stated in a failed tool call's error text; group 1 is the number."
value = '^\s*Exit code (\d+)\b'

[expected_failure.refusal]
doc = "Regex source of an error text that is a harness refusal: the command never ran."
value = '^\s*This (?:agent|session) is isolated in the worktree\b'

