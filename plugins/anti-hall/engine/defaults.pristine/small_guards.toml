doc = "Where the switch for checking the code a shell write puts in a file is read from (guards.shellWriteChecks, default on)."
value = { section = "guards", key = "shellWriteChecks", env = "ANTIHALL_SHELL_WRITE_CHECKS", aliases = [], option = "", default = true }

[api_guard.thirdparty_setting]
doc = "Where the switch for also verifying installed third-party packages is read from (guards.apiGuardThirdparty, default off)."
value = { section = "guards", key = "apiGuardThirdparty", env = "ANTIHALL_API_GUARD_THIRDPARTY", aliases = [], option = "", default = false }

[api_guard.tool_write]
doc = "Tool whose code is `tool_input.content`."
value = "Write"

[api_guard.tool_edit]
doc = "Tool whose code is `tool_input.new_string`."
value = "Edit"

[api_guard.tool_multi]
doc = "Tool whose code is the `new_string` of each entry of `tool_input.edits`."
value = "MultiEdit"

[api_guard.tool_shell]
doc = "Tool whose command can write a code file."
value = "Bash"

[api_guard.tool_patch]
doc = "Codex tool whose patch text carries the code."
value = "apply_patch"

[api_guard.python_extensions]
doc = "File extensions (lower-case) the guard checks as Python."
value = ["py", "pyi"]

[api_guard.js_extensions]
doc = "File extensions (lower-case) the guard checks as JavaScript or TypeScript."
value = ["js", "mjs", "cjs", "ts", "tsx", "jsx"]

[api_guard.extension_pattern]
doc = "Regex source (case-insensitive) of a file name's extension, group 1."
value = '\.([a-z]+)$'

[api_guard.code_name_pattern]
doc = "Regex source (case-insensitive) that finds a code file name inside a Bash command or an apply_patch text. Written without a word boundary, so it finds every spelling the Node guard's own pattern finds, and more."
value = '\.(?:py|pyi|js|mjs|cjs|ts|tsx|jsx)'

[api_guard.shell_write_pattern]
doc = "Regex source (case-sensitive) of the Node pre-filter that says a Bash command could write a file (a redirect, tee, an in-place editor, cp or mv, an inline-code write); a command it does not match yields no code chunk, so the guard allows it."
value = '[>]|\btee\b|\bsed\b|\bperl\b|\bcp\b|\bmv\b|\bopen\b|createWriteStream|File(?:Sync)?\s*\(|\.write\('

[api_guard.noise_pattern]
doc = "Regex source (global) of the characters dropped from a Bash command before the verifiable-reference test: every character that is not an ASCII letter, digit, underscore or dot. The code a shell write puts in a file is built from the command text by quote removal and escape decoding, so its words are contiguous runs of what remains."
value = '[^A-Za-z0-9_.]'

[api_guard.python_stdlib]
doc = "Python standard-library modules whose attributes the Node guard verifies by default."
value = ["os", "sys", "math", "cmath", "random", "json", "re", "collections", "itertools", "functools", "pathlib", "asyncio", "datetime", "time", "statistics", "heapq", "bisect", "string", "textwrap", "shutil", "glob", "csv", "sqlite3", "decimal", "fractions", "secrets", "uuid", "contextlib", "operator", "inspect", "abc", "numbers", "array", "enum", "dataclasses", "typing", "io", "struct", "hashlib", "base64", "binascii", "copy", "pprint", "queue", "threading", "socket"]

[api_guard.node_builtins]
doc = "Node built-in modules whose attributes the Node guard verifies by default."
value = ["fs", "path", "os", "crypto", "util", "stream", "buffer", "events", "url", "querystring", "http", "https", "net", "dns", "zlib", "readline", "child_process", "assert", "timers", "string_decoder", "tls", "dgram", "process"]

[api_guard.js_globals]
doc = "JavaScript global builtins whose members the Node guard verifies by default."
value = ["Array", "String", "Object", "Promise", "Map", "Set", "WeakMap", "WeakSet", "Number", "Math", "JSON", "Reflect", "Symbol", "Date", "RegExp", "BigInt", "Buffer"]

[api_guard.python_import_word]
doc = "The word a Python module reference needs before the guard can resolve an attribute against it."
value = "import"

