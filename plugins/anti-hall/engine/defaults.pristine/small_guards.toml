min = 1
unit = "characters"

[model_routing.flagship_models]
doc = "Explicit model enum values treated as flagship tiers for row 1 and row 3."
value = ["opus", "fable"]

[model_routing.tier_haiku]
doc = "The cheap execution model tier recommended by rows 1, 2 and 3."
value = "haiku"

[model_routing.tier_opus]
doc = "The planning advisory's default stronger tier."
value = "opus"

[model_routing.tier_main]
doc = "Pseudo-tier used when the guard forces work back to the main session."
value = "main"

[model_routing.tier_inherit]
doc = "Pseudo-tier used in telemetry when an omitted model inherits from the parent."
value = "inherit"

[model_routing.model_rank]
doc = "Rank table for the deploy/migration/secret model floor."
value = { haiku = 1, sonnet = 2, opus = 3, fable = 3 }

[model_routing.mechanical]
doc = "Mechanical execution-only signal phrases, matched as token phrases after compatibility folding."
value = ["fetch", "download", "curl", "grep", "glob", "search files", "run command", "run script", "install", "build", "run tests", "git push", "deploy", "dump", "export", "tail", "read logs", "list", "check status"]

[model_routing.hard_execution]
doc = "Mechanical signals that suppress the row-1 research exemption."
value = ["run script", "install", "build", "run tests", "git push", "deploy"]

[model_routing.complex]
doc = "Complex/planning signal phrases whose presence vetoes rows that steer to haiku."
value = ["plan", "planning", "design", "architect", "review", "audit", "regression", "coupling", "merge order", "critique", "debate", "validate", "simulate", "root cause", "workflow analysis", "logic", "mockup", "security"]

[model_routing.role_word_re]
doc = "Debate-role exemption regex matched against the description only."
value = '\b(reviewer|auditor|critic|debate|deadly[- ]?loop)\b'

[model_routing.research_re]
doc = "Research/read-only regex for the row-1 research exemption and row-6 Explore advisory."
value = '\b(research|investigate|find|search|audit|survey|read[ -]?only|locate|map|gather|explore|scout|look\s+up|trace|reconnaissance)\b'

[model_routing.write_re]
doc = "Write/execute regex that suppresses the row-6 Explore advisory."
value = '\b(write|edit|modif|commit|push|changelog|create\s+(?:an?\s+|the\s+|new\s+)?files?|migrat|refactor|implement)\b'

[model_routing.write_imperative_re]
doc = "Instruction-position ambiguous write/execute regex that suppresses the row-6 Explore advisory."
value = '(?:^|[\n\r\u2028\u2029]|[.;:!?]\s+|\b(?:then|and|also|please|to)\s+)(?:tag|release|bump|apply|patch|build|deploy|install|fix)\b'

[model_routing.write_phrase_re]
doc = "Explicit write phrase regex that suppresses the row-6 Explore advisory even when read-only override words are present."
value = '\bsave\s+(?:[\w-]+\s+){0,4}?(?:to|into)\s+\S|\bclone\s+(?:\S+\s+){0,3}?(?:into|to)\s+\S|\bgit\s+(?:clone|format-patch)\b|(?:^|[\n\r\u2028\u2029]|[.;:]\s+|\b(?:then|and)\s+)run\s+(?:the\s+)?(?:generators?|tests?|test\s+suite|build)\b'

[model_routing.readonly_override_re]
doc = "Explicit read-only statement regex that overrides ambiguous write words for row 6."
value = '''\b(?:report\s+only|read[- ]?only|(?:do\s+not|don'?t|never)\s+(?:edit|modify|write|change|commit)|no\s+(?:edits|changes|writes))\b'''

[model_routing.deploy_strong_re]
doc = "Strong deploy/migration/secret regex that activates the deploy floor."
value = '\b(deploy\w*|redeploy\w*|migrat\w*|rollbacks?|roll\s+back|token\s+rotation|rotat\w*\s+(?:the\s+|a\s+)?(?:api\s+)?(?:tokens?|keys?|secrets?|credentials?)|wrangler|terraform|kubectl\s+apply|helm\s+(?:install|upgrade)|firebase\s+deploy|db\s+migrate)\b'

[model_routing.deploy_weak_re]
doc = "Weak deploy/migration/secret words; two distinct kinds activate the deploy floor."
value = '\b(prod|production|secrets?|credentials?)\b'

[model_routing.deploy_weak_aliases]
doc = "Weak deploy/migration/secret words normalized before distinct-kind counting. This mirrors Node's production -> prod policy."
value = { production = "prod" }

[model_routing.update_qualifier]
doc = "Lowercase qualifier required with a generic update.js command before it is treated as an anti-hall update-in-session."
value = "anti-hall"

[model_routing.update_node_re]
doc = "Regex for node commands that run an update.js script."
value = '''\bnode\s+["']?\S*update\.js\b'''

[model_routing.update_skill_path_re]
doc = "Regex for node commands that run anti-hall's update skill script."
value = '''\bnode\s+["']?\S*skills[\\/]update[\\/]scripts[\\/]update\.js\b'''

[model_routing.update_slash_re]
doc = "Regex for explicit requests to invoke the anti-hall update skill."
value = '\b(?:run|invoke|execute)\s+`?/anti-hall:update\b'

[model_routing.planning_intent_re]
doc = "Strict planning-intent regex for the row-4 haiku advisory."
value = '\b(architect(?:ure)?|brainstorm|design\s+(?:a|the|an)\b|plan\s+(?:a|the|an|out)\b|deep\s+review|code\s+review|design\s+review|security\s+review|review\s+the\s+(?:code|design|architecture|plan)|review\s+(?:this|the|a)\s+(?:pr|pull\s+request|diff|patch|change(?:s|set)?)|audit\s+(?:the|this)\b|critique|debate|merge\s+order|workflow\s+analysis|root[- ]cause\s+analysis|(?:find|identify|determine|diagnose|trace)\s+(?:the\s+)?root[- ]cause|root[- ]cause\s+(?:why|how|the|this)|regression\s+analysis|security\s+audit)\b'

[model_routing.readonly_re]
doc = "Read-only/mechanical marker regex used to suppress row-4 false positives."
value = '\b(verbatim|read[- ]?only|mechanical|append\s*only|run\s+exactly|do\s+nothing\s+else|nothing\s+else|no\s+other\s+file\s+edits|no\s+repo\s+edits|no\s+source\s+edits)\b'

[model_routing.mechanical_shape_re]
doc = "Fixed-command or bounded-output regex used to suppress row-4 false positives."
value = '\b(run\s+exactly|run\s+only|run\s+(?:this|these|the\s+following)\s+(?:exact\s+)?commands?|exactly\s+(?:this|these)\s+commands?|verbatim|append\s*only|do\s+nothing\s+else|nothing\s+else|return\s+(?:only\s+)?(?:at\s+most\s+|no\s+more\s+than\s+|under\s+|up\s+to\s+)?\d+\s+lines?)\b|return\s+(?:only\s+)?(?:≤|<=)\s*\d+\s+lines?\b'

[model_routing.review_design_verb_re]
doc = "Review/design/analysis verb regex that keeps row 4 live despite read-only markers."
value = '\b(review|audit|design|architect(?:ure)?|plan|brainstorm|critique|analy[sz]e|analysis|investigate|root[- ]cause)\b'

[model_routing.reasoning_re]
doc = "Heavy reading and synthesis regex that vetoes rows steering to haiku."
value = '\b(analy[sz]\w*|synthesi[sz]\w*|summari[sz]\w*|reconcil\w*|evaluat\w*|interpret\w*|distill\w*|compare|comparison)\b|\bread\w*\b[^.\n]{0,60}\b(?:pdf|pdfs|pages?|papers?|documents?|specs?|transcripts?|articles?|books?|manuals?|whitepapers?)\b|\b\d+[- ]page\b|\bpage[- ]by[- ]page\b'

[model_routing.handover_noun_re]
doc = "Handover noun regex for the handover-delegation advisory."
value = '\b(handover|handoff)\b'

[model_routing.handover_verb_re]
doc = "Handover write-verb regex for the handover-delegation advisory."
value = '\b(write|prepare|create|author|draft)\b'

[model_routing.code_fence_re]
doc = "Regex for fenced code spans stripped before planning and reasoning regexes."
value = '```[\s\S]*?```'

[model_routing.inline_code_re]
doc = "Regex for inline code spans stripped before planning and reasoning regexes."
value = '`[^`]*`'

[model_routing.session_safe_re]
doc = "Regex whose non-matching characters are replaced in the handover advisory state file name."
value = '[^A-Za-z0-9_.-]'

[model_routing.state_dir]
doc = "State directory, relative to home, for the handover-delegation advisory cap."
value = ".anti-hall"

[model_routing.handover_state_prefix]
doc = "Prefix of the per-session handover-delegation advisory cap file."
value = "model-routing-guard-handover-state-"

[model_routing.handover_state_suffix]
doc = "Suffix of the per-session handover-delegation advisory cap file."
value = ".json"

[model_routing.unknown_session]
doc = "Fallback session id used in the handover advisory state file name."
value = "unknown-session"

[model_routing.handover_state_json]
doc = "JSON written to cap the handover-delegation advisory."
value = '{"advised":true}'

