[model_routing.message_guard]
doc = "The guard label used in ordinary routing advisory text."
value = "model-routing"

[model_routing.handover_guard]
doc = "The guard label used in the handover-delegation advisory."
value = "handover"

[model_routing.update_setting]
doc = "Where the update-in-session switch is read from (guards.updateInSession, default on)."
