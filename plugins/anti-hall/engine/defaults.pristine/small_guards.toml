# ---- merge-gate (hooks/merge-gate.js) ---------------------------------------------------------------------

[merge_gate.summary]
doc = "One-line description of the merge-gate check in the generated reference."
value = "Opt-in false-done backstop: answers every Bash call natively, including the block of an auto-merge after an unresolved self-hedge and the Jev shadow ask that goes with a hedge; defers only a relative transcript path, a transcript line the engine cannot parse and a text window that would cut a surrogate pair (port of merge-gate.js)."

[merge_gate.guard_name]
doc = "The guard id this check answers to in skip.json."
value = "merge-gate"

[merge_gate.setting]
doc = "Where the opt-in switch is read from (guards.mergeGate, default off)."
value = { section = "guards", key = "mergeGate", env = "ANTIHALL_MERGE_GATE", aliases = [], option = "guards_merge_gate", default = false }

[merge_gate.window_bytes]
doc = "How much of the end of the transcript is scanned for a self-hedge (the same bounded tail the Node gate reads)."
value = 131072
unit = "bytes"
min = 1024
max = 16777216

[merge_gate.hedge_phrases]
doc = "Self-hedge phrases, matched case-insensitively as plain text in the recent assistant output."
value = ["pending owner", "do not merge", "pending review", "needs your review", "needs your eyes", "review it in the build", "built, pending"]

[merge_gate.hedge_patterns]
doc = "Self-hedge phrases with punctuation or spacing variants: regex sources (case-insensitive) matched against the recent assistant output."
value = ['first[- ]pass', 'not pixel[- ]perfect']

[merge_gate.resolutions]
doc = "Phrases that resolve a hedge when a REAL user prompt typed after the hedge contains one (case-insensitive plain text); the assistant can never clear its own hedge."
value = ["owner approved", "owner signed off", "sign-off received", "fidelity verified", "verified against", "resolved:"]

[merge_gate.injected_user]
doc = "Regex source (case-insensitive) of the user-role bodies that are not a human typing (task notifications, system reminders, hook feedback, cross-session messages)."
value = '^\s*(<(task-notification|system-reminder|command-name|command-message|local-command|user-prompt-submit-hook|cross-session-message)\b|Stop hook feedback:)|Another Claude session sent a message|<cross-session-message\b'

[merge_gate.system_reminder]
doc = "Regex source (case-insensitive) of a system-reminder block, removed from a user prompt before it is judged."
value = '<system-reminder>[\s\S]*?<\/system-reminder>'

[merge_gate.non_human_origins]
doc = "The origin kinds of a user record that still count as a human typing."
value = ["human", "user"]

[merge_gate.jev_id]
doc = "The Jev integration id of the shadow question asked when a hedge is found on a merge command."
value = "mergeGateHedge"

[merge_gate.jev_instructions]
doc = "The Noul question text of the mergeGateHedge shadow ask (byte-identical to the Node gate's)."
value = 'Does the recent reply text below contain an UNRESOLVED self-hedge (e.g. "pending review", "first-pass", "do not merge") that was never followed by a resolution/sign-off?'

[merge_gate.jev_true]
doc = "The label for a true answer of the mergeGateHedge question."
value = "unresolved hedge present"

[merge_gate.jev_false]
doc = "The label for a false answer of the mergeGateHedge question."
value = "no unresolved hedge"

[merge_gate.jev_state_chars]
doc = "How many trailing UTF-16 units of the assistant text the mergeGateHedge ask evaluates (Node: text.slice(-4000))."
value = 4000
min = 1

[merge_gate.msg_what]
doc = "The block message's first line; {hedge} is the last hedge phrase found."
value = 'auto-merge blocked: your recent output flagged a deliverable as pending/unverified ("{hedge}").'

[merge_gate.msg_why]
doc = "The block message's reason."
value = "A self-issued hedge blocks auto-merge (false-done backstop)."

[merge_gate.msg_instead]
doc = "The block message's alternative."
value = "verify it against its agreed criterion or get owner sign-off, then merge."

[merge_gate.msg_override]
doc = "The block message's override line."
value = "set ANTIHALL_MERGE_GATE=off, or skip merge-gate"

[merge_gate.segment_split]
doc = "Regex source that splits a Bash command into the segments the auto-merge scan looks at (shell separators; quotes are not honoured, on purpose, as in the Node gate)."
value = '&&|\|\||[;&|\n]'

[merge_gate.env_assign]
doc = "Regex source of a leading environment assignment the scan skips before the command word."
value = '^[A-Za-z_][A-Za-z0-9_]*='

[merge_gate.protected_target]
doc = "Regex source (case-insensitive) of the branch names a plain `git merge` must name to count as an auto-merge."
value = '^(main|master|develop|origin\/(main|master|develop))$'

[merge_gate.merge_rules]
doc = "The command shapes that are an auto-merge intent. verb: the command word (after leading assignments); prefix: the words that must follow it, in order; includes_any: when present, at least one of these words must appear after the prefix; needs_target: when true, a word after the prefix must match protected_target."
value = [
  { verb = "gh", prefix = ["pr", "merge"] },
  { verb = "gh", prefix = ["pr", "review"], includes_any = ["--approve"] },
  { verb = "git", prefix = ["merge"], includes_any = ["--no-ff", "--ff", "--ff-only"], needs_target = true },
  { verb = "hivecontrol", prefix = ["workspace", "merge-into-source"] },
  { verb = "hivecontrol", prefix = ["workspace", "merge-from-source"] },
]

# ---- api-guard (hooks/api-guard.js) -----------------------------------------------------------------------

[api_guard.summary]
doc = "One-line description of the api-guard check in the generated reference."
value = "Fabricated-API guard: answers every call the Node api-guard would allow without probing an interpreter (guard off or skipped, a target that is not Python or JavaScript, code that names no verifiable module or global, a Bash command that names no code file, or whose text cannot hold a verifiable reference or cannot write a file) and defers the rest, so every interpreter probe stays with the Node hook (port of api-guard.js)."

