# ah-engine shipped defaults for the small Bash guards ported from Node (merge-side-pick, ship-it-guard,
# scan-throttle, coordinator-work-guard, compact-declaration-guard) and the helpers they share (D17, D30).
#
# Every pattern, message, setting name and limit of these checks lives here. Regex sources use JavaScript syntax
# (the Node guards are the authority) and are translated by `checks::guardkit::jsre`; they are written as TOML
# literal strings so no backslash is doubled. Format: see the header of engine.toml.

# ---- shared helpers (checks::guardkit) --------------------------------------------------------------------

[guardkit.js_space]
doc = "Characters JavaScript treats as white space, written as the body of a regex character class; used to translate the JS escapes for white space exactly (Rust's own class differs: it has U+0085 and lacks U+FEFF)."
value = '\t\n\x0b\x0c\r    -     　﻿'

[guardkit.line_terminators]
doc = "Characters JavaScript's dot excludes, as the body of a regex character class."
value = '\n\r  '

[guardkit.settings_file]
doc = "Settings file, relative to the home directory."
value = ".anti-hall/settings.json"

[guardkit.skip_file]
doc = "Skip file, relative to the home directory (a skipped guard is allowed until its expiry time)."
value = ".anti-hall/skip.json"

[guardkit.claude_settings_file]
doc = "The host's own settings file, relative to the home directory, where plugin options are stored."
value = ".claude/settings.json"

[guardkit.plugin_config_keys]
doc = "Keys of the host settings file's pluginConfigs map under which this plugin's options may be stored, lowest priority first."
value = ["anti-hall", "anti-hall@anti-hall"]

[guardkit.plugin_option_prefix]
doc = "Prefix of the environment variables the host sets from plugin options."
value = "CLAUDE_PLUGIN_OPTION_"

[guardkit.true_tokens]
doc = "Environment or settings strings that mean on (compared after trimming and lower-casing)."
value = ["1", "on", "true", "yes"]

[guardkit.false_tokens]
doc = "Environment or settings strings that mean off (compared after trimming and lower-casing)."
value = ["0", "off", "false", "no"]

[guardkit.destructive_guards]
doc = "Guards that a broad skip of everything does not cover; they must be named in the skip file."
value = ["git-guard", "devswarm-read-guard", "git-stash-guard"]

[guardkit.skip_all_key]
doc = "Key of the skip file that skips every guard not listed in destructive_guards."
value = "all"

[guardkit.state_cap]
doc = "How many per-session state entries the in-memory guard state keeps before it evicts the least recently written one."
value = 4096
min = 16
max = 1000000

[guardkit.session_key_max]
doc = "Longest session key, in UTF-16 units, after the characters outside letters, digits, dot, underscore and hyphen are replaced (the Node state file name limit)."
value = 120

[guardkit.plugin_manifest]
doc = "The plugin manifest, relative to the plugin root (its version is the one the settings migration stamp is compared with)."
value = ".claude-plugin/plugin.json"

[guardkit.migration_markers_file]
doc = "The per-migration marker file, relative to the home directory."
value = ".anti-hall/update-sweep-state.json"

[guardkit.jev_legacy_file]
doc = "The legacy Jev settings file (settings.js reads it below settings.json for the Jev keys), relative to the home directory."
value = ".anti-hall/jev.json"

[guardkit.settings_migration_key]
doc = "Key of the marker that says the legacy settings were forward-migrated into settings.json for a plugin version."
value = "migrateSettingsFromLegacy"

[guardkit.settings_dir]
doc = "The anti-hall directory under the home directory, where the legacy settings files live."
value = ".anti-hall"

[guardkit.icons]
doc = "Leading icon of a block or advisory message, by kind."
value = { block = "⛔", warn = "⚠️", tip = "💡", ok = "✅", update = "⬆️", error = "❌" }

[guardkit.msg_head]
doc = "Text between the icon and the guard name in every block or advisory message."
value = " anti-hall · "

[guardkit.render_reserve]
doc = "Extra bytes reserved beyond a message template's length when its placeholders are filled (a capacity hint, not a limit)."
value = 32
unit = "bytes"
min = 0
max = 65536

[guardkit.msg_labels]
doc = "Labels of the optional lines of a block or advisory message."
value = { why = "Why: ", instead = "Do instead: ", allowed = "Allowed here: ", override = "Override (only if the user explicitly asked): " }

# ---- merge-side-pick (hooks/merge-side-pick.js, hooks/lib/merge-side-pick.js) ----------------------------

[merge_side_pick.summary]
doc = "One-line description of the merge-side-pick check in the generated reference."
value = "Advisory: a push after a conflict was resolved by taking one side wholesale, with no test run since (port of merge-side-pick.js)."

[merge_side_pick.guard_name]
doc = "The guard id this check answers to in skip.json and in messages."
value = "merge-side-pick"

[merge_side_pick.setting]
doc = "Where the on/off switch is read from (guards.mergeSidePickAdvisory, default on)."
value = { section = "guards", key = "mergeSidePickAdvisory", env = "ANTIHALL_MERGE_SIDE_PICK_ADVISORY", aliases = [], option = "", default = true }

[merge_side_pick.state_ns]
doc = "Namespace of this check's per-session state in the guard state store."
value = "merge-side-pick"

[merge_side_pick.quote_masks]
doc = "Regexes whose matches (quoted spans) are blanked before a command is split into segments, so quoted text is never mistaken for a command (maskShellQuotes)."
value = ['\x27[^\x27\n]*\x27', '"(?:[^"\\\n]|\\.)*"']

[merge_side_pick.segment_split]
doc = "Regex that splits a masked command into segments (semicolon, ampersand, pipe, newline)."
value = '[;&|\n]+'

[merge_side_pick.git_prefix]
doc = "Regex source that every git pattern starts with: the git word with optional -C, -c and --no-pager options."
value = '(?:^|\s)git(?:\s+-C\s+\S+|\s+-c\s+\S+|\s+--no-pager)*\s+'

[merge_side_pick.pick_tails]
doc = "Regex sources, each appended to git_prefix, that recognise taking one side of a conflict wholesale (checkout or restore --ours, -X ours, -s ours)."
value = [
  '(?:checkout|restore)\b[^\n]*?\s--(?:ours|theirs)\b',
  '(?:merge|pull|rebase|cherry-pick|revert)\b[^\n]*?\s(?:-X\s*|--strategy-option[= ])(?:ours|theirs)\b',
  '(?:merge|pull)\b[^\n]*?\s(?:-s\s*|--strategy[= ])ours\b',
]

[merge_side_pick.push_tail]
doc = "Regex source appended to git_prefix that recognises a push."
value = 'push\b'

[merge_side_pick.dry_run]
doc = "Regex that marks a push segment as a dry run, which is not a push."
value = '\s(?:--dry-run|-n)\b'

[merge_side_pick.test_patterns]
doc = "Regex sources that recognise a test run in a command segment."
value = [
  '(?:^|\s)(?:npm|pnpm|yarn|bun)\s+(?:run\s+)?(?:test|t)\b',
  '(?:^|\s)(?:npx|bunx|pnpm\s+exec)\s+(?:jest|vitest|mocha|ava)\b',
  '(?:^|\s)(?:jest|vitest|mocha|pytest|py\.test|tox|nox|rspec|phpunit|ctest)\b',
  '(?:^|\s)node\s+(?:\S+\s+)*--test\b',
  '(?:^|\s)python3?\s+-m\s+(?:pytest|unittest)\b',
  '(?:^|\s)(?:go|cargo|flutter|dart|deno)\s+test\b',
  '(?:^|\s)cargo\s+nextest\b',
  '(?:^|\s)(?:\./)?(?:mvn|mvnw|gradle|gradlew)\s+(?:\S+\s+)*(?:test|verify|check)\b',
  '(?:^|\s)(?:make|just)\s+(?:test|tests|check)\b',
  '(?:^|\s)(?:bundle\s+exec\s+)?rake\s+test\b',
  '(?:^|\s)dotnet\s+test\b',
]

[merge_side_pick.cmd_keep]
doc = "How many UTF-16 units of the side-pick command are kept for the advisory."
value = 120

[merge_side_pick.msg_what]
doc = "Advisory headline; {pick} is the recorded side-pick command."
value = "pushing after a conflict was resolved by taking one side wholesale ({pick}) with no test run since"

[merge_side_pick.msg_why]
doc = "Advisory reason."
value = "taking --ours/--theirs (or -X ours/theirs) silently drops the other side's changes, and nothing has verified the result."

[merge_side_pick.msg_instead]
doc = "Advisory advice."
value = "run the tests first, review the discarded side in `git diff`, then push."

[merge_side_pick.fallback_cmd]
doc = "Text used for the side-pick command when none was recorded."
value = "a side-pick"

# ---- ship-it-guard (hooks/ship-it-guard.js) ----------------------------------------------------------------

[ship_it.summary]
doc = "One-line description of the ship-it-guard check in the generated reference."
value = "Opt-in plan gate: blocks edits to hard-risk files with no PLAN.md and advises on files a plan's phases do not declare (port of ship-it-guard.js)."

[ship_it.guard_name]
doc = "The guard id this check answers to in skip.json and in messages."
value = "ship-it-guard"

[ship_it.setting]
doc = "Where the opt-in switch is read from (guards.shipitGate, default off)."
value = { section = "guards", key = "shipitGate", env = "ANTIHALL_SHIPIT_GATE", aliases = [], option = "guards_shipit_gate", default = false }

[ship_it.deferred_tools]
doc = "Tool names whose targets the engine cannot derive exactly (shell writes need the command-guard parser, apply_patch needs the Codex patch parser): with the gate on they defer to the Node guard."
value = ["Bash", "apply_patch"]

[ship_it.plan_file]
doc = "Name of the plan file looked for in the working directory."
value = "PLAN.md"

[ship_it.hard_risk]
doc = "Regex sources (case-insensitive) of hard-risk paths: CI workflows, migrations, auth, security."
value = [
  '(^|[\\/])\.github[\\/]workflows[\\/]',
  '(^|[\\/])migrations?[\\/]',
  '(^|[\\/])migrate[\\/]',
  '[._-]migration[s]?\.[a-z]+$',
  '(^|[\\/])(auth|authn|authz)[\\/]',
  '[._-](auth|authn|authz|login|session|password|credential|token|secret)s?\.[a-z]+$',
  '(^|[\\/])(security|crypto)[\\/]',
]

[ship_it.non_code_name]
doc = "Lower-cased base name that is never gated (the plan file itself)."
value = "plan.md"

[ship_it.non_code_ext]
doc = "Regex source (case-insensitive), tested on the lower-cased base name, for documentation extensions that are never gated."
value = '\.(md|mdx|markdown|txt|rst)$'

[ship_it.non_code_test_file]
doc = "Regex source (case-insensitive), tested on the lower-cased base name, for test file names that are never gated."
value = '\.(test|spec)\.[a-z0-9]+$'

[ship_it.non_code_test_dir]
doc = "Regex source (case-insensitive), tested on the whole path, for test directories that are never gated."
value = '(^|[\\/])(tests?|__tests__|spec)([\\/]|$)'

[ship_it.phases_head]
doc = "Regex source (case-insensitive) of the line that opens the Phases section of a plan."
value = '(?:^|\n)##[ \t]+Phases\b'

[ship_it.phases_end]
doc = "Regex source that finds where the Phases section ends: the next level-two heading."
value = '\n##[ \t]+\S'

[ship_it.phase_split]
doc = "Regex source that finds the line break before each phase heading, where the Phases section is split."
value = '\n###[ \t]+'

[ship_it.phase_head]
doc = "Regex source a phase section must start with."
value = '^###[ \t]+'

[ship_it.files_head]
doc = "Regex source (case-insensitive) of the files field a phase declares, up to where its value starts."
value = '\n-[ \t]*files:[ \t]*'

[ship_it.files_end]
doc = "Regex source (case-insensitive) that finds where a files value ends: the next field bullet or phase heading."
value = '\n-[ \t]*[\w][\w ]*:|\n###[ \t]'

[ship_it.token_separators]
doc = "Characters that separate path tokens inside a files value, besides white space."
value = ",`\"'()"

[ship_it.token_trim]
doc = "Trailing characters stripped from a path token."
value = ".,;:"

[ship_it.token_ext_max]
doc = "Longest dotted extension that makes a token without a slash look like a path."
value = 10

[ship_it.msg_block_what]
doc = "Block headline; {file} is the first hard-risk file."
value = "L-risk file {file} edited with no PLAN.md."

[ship_it.msg_block_why]
doc = "Block reason."
value = "This path is a hard-risk trigger (migration / auth / CI-workflow / security); per the ship-it skill, L-tier changes go through plan mode and a PLAN.md before code."

[ship_it.msg_block_instead]
doc = "Block advice."
value = "create PLAN.md (repo root) first."

[ship_it.msg_block_override]
doc = "Block override hint."
value = "if this is genuinely a smaller change, unset ANTIHALL_SHIPIT_GATE or use the documented skip hatch"

[ship_it.msg_adv_what]
doc = "Advisory headline; {file} is the first target outside the declared files and {plan} the plan path."
value = "{file} does not appear in any phase's declared \"files:\" list in {plan} (advisory, not a block)."

[ship_it.msg_adv_why]
doc = "Advisory reason."
value = "It may be a legitimate shared-file touch (`files:` is free text, so false positives are expected) or scope drift."

[ship_it.msg_adv_instead]
doc = "Advisory advice."
value = "if intentional, proceed; if not, update the PLAN.md Blast radius / phase `files:` list, or re-plan this phase."

# ---- scan-throttle (hooks/scan-throttle.js) ----------------------------------------------------------------

[scan_throttle.summary]
doc = "One-line description of the scan-throttle check in the generated reference."
value = "Advisory: recommends the background-throttled form of a user-configured heavy scan command (port of scan-throttle.js)."

[scan_throttle.guard_name]
doc = "The guard id this check answers to in messages."
value = "scan-throttle"

[scan_throttle.setting]
doc = "Where the on/off switch is read from (guards.scanThrottle, default on; the old ANTI_HALL_SCAN_THROTTLE name is an alias)."
value = { section = "guards", key = "scanThrottle", env = "ANTIHALL_SCAN_THROTTLE", aliases = ["ANTI_HALL_SCAN_THROTTLE"], option = "guards_scan_throttle", default = true }

[scan_throttle.patterns_env]
doc = "Environment variable holding the comma-separated regex sources of the scan commands to advise on; with none set the check matches nothing."
value = "ANTI_HALL_THROTTLE_PATTERNS"

[scan_throttle.known_prefixes]
doc = "Every throttle prefix this check itself generates; a command that already starts with one is left alone."
value = ["taskpolicy -c utility nice -n 19 ", "ionice -c 3 nice -n 19 ", "nice -n 19 "]

[scan_throttle.darwin]
doc = "The macOS throttle tool that must exist on PATH, and the prefix it gives."
value = { tool = "taskpolicy", prefix = "taskpolicy -c utility nice -n 19 " }

[scan_throttle.linux]
doc = "The Linux throttle tool that must exist on PATH, the prefix it gives, and the optional I/O tool with its own prefix."
value = { tool = "nice", prefix = "nice -n 19 ", io_tool = "ionice", io_prefix = "ionice -c 3 " }

[scan_throttle.path_separator]
doc = "Separator of the entries of the PATH variable."
value = ":"

[scan_throttle.path_var]
doc = "Name of the variable that holds the executable search path."
value = "PATH"

[scan_throttle.assign_one]
doc = "Regex source of one leading NAME=value assignment (quoted or unquoted value)."
value = '^[A-Za-z_][A-Za-z0-9_]*=(?:"(?:[^"\\]|\\.)*"|\x27[^\x27]*\x27|[^\s]*)'

[scan_throttle.unsafe_start_chars]
doc = "Characters that, as the first character where the prefix would go, make the position unsafe (subshell, group, separator, backtick)."
value = ")(;{}|&`"

[scan_throttle.unsafe_start_subst]
doc = "Text that, at the position where the prefix would go, starts a command substitution and makes the position unsafe."
value = "$("

[scan_throttle.pattern_literal_chars]
doc = "ASCII characters a user pattern may contain as plain literals for the engine to match it itself; a pattern with any other construct defers to the Node guard, whose regex engine is the authority."
value = " !#%&',-/:;<=>@_\"~`ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"

[scan_throttle.pattern_escapes]
doc = "Characters that may follow a backslash in a user pattern the engine matches itself (escaped punctuation, class escapes, newline, tab)."
value = ".-/\\()[]*+?|^$sSdDwWbBnt{}"

[scan_throttle.msg_group_what]
doc = "Advisory headline when the scan is not the first simple command."
value = "a repo-wide scan command was detected in a compound or grouped command (not the first simple command); it was NOT modified."

[scan_throttle.msg_group_instead]
doc = "Advice when the scan is not the first simple command; {prefix} is the throttle prefix without its trailing space."
value = "consider running the scan background-throttled, e.g. `{prefix} <that command>`."

[scan_throttle.msg_first_what]
doc = "Advisory headline when the scan is the first simple command."
value = "this is a heavy repo-wide scan; the command was NOT modified."

[scan_throttle.msg_first_why]
doc = "Advisory reason when the scan is the first simple command."
value = "To keep the machine responsive."

[scan_throttle.msg_first_instead]
doc = "Advice when the scan is the first simple command; {throttled} is the command with the prefix in place."
value = "re-run it background-throttled: `{throttled}`."

# ---- coordinator-work-guard (hooks/coordinator-work-guard.js, hooks/coordinator-detect.js) -----------------

[coordinator_work.summary]
doc = "One-line description of the coordinator-work-guard check in the generated reference."
value = "Main-thread work window. PreToolUse: allows subagent Bash calls in the engine and defers the rest (the classification and the block stay with Node). PostToolUse: records the call in the window, nudges once per crossing and folds stale session files, when the call's classification is already known (the Node pre-verdict of the same tool call) or provably not work; otherwise defers (port of coordinator-work-guard.js)."

[coordinator_work.agent_markers]
doc = "Payload fields the host puts on a subagent's hook payload and never on the main thread's."
value = ["agent_id", "agent_type"]

[coordinator_work.codex_markers]
doc = "Payload fields that, both non-empty strings, identify a Codex payload."
value = ["turn_id", "model"]

# ---- compact-declaration-guard (hooks/compact-declaration-guard.js, hooks/lib/compact-advice.js) ------------

[compact_decl.summary]
doc = "One-line description of the compact-declaration-guard check in the generated reference."
value = "Allows new work unless the current turn may hold a SAFE TO COMPACT declaration; a possible declaration defers to the Node guard, which decides and blocks (port of compact-declaration-guard.js)."

[compact_decl.setting]
doc = "Where the on/off switch is read from (guards.compactDeclarationGuard, default on; it has no environment variable)."
value = { section = "guards", key = "compactDeclarationGuard", env = "", aliases = [], option = "guards_compact_declaration_guard", default = true }

[compact_decl.guard_name]
doc = "The guard id this check answers to in skip.json."
value = "compact-declaration-guard"

[compact_decl.agent_markers]
doc = "Payload fields that, present and non-null, prove the call comes from a subagent."
value = ["agent_id", "agent_type"]

[compact_decl.work_tools]
doc = "Tools that always start new work (spawns and file edits)."
value = ["Agent", "Task", "Write", "Edit", "MultiEdit", "NotebookEdit"]

[compact_decl.handover_file]
doc = "Rust regex source, tested on a resolved path, for a file inside the handovers directory: writing it is the very thing a block tells the agent to do, so it is never new work."
value = '(?s)(?:^|/)\.anti-hall/handovers/[^/]'

[compact_decl.bash_work_always]
doc = "Regex sources (case-insensitive) of shell commands that change state wherever they appear in a command with quoted text blanked."
value = [
  '\bgit\s+(?:commit|rebase|merge|cherry-pick|stash|reset|apply|am)\b',
  '\bgit\s+(?:checkout|switch|restore|clean)\b',
  '\bsed\s+-i',
  '\bnpm\s+(?:install|i|ci)\b',
  '\b(?:pnpm|yarn)\s+(?:add|install)\b',
  '\bpip\s+install\b',
  '\bpatch\b',
]

[compact_decl.bash_work_command_position]
doc = "Regex source (case-insensitive) of the bare state-changing verbs, which count only at command position (line start, or after a separator, parenthesis, backtick or substitution)."
value = '(?:\A|[\n\r  ;&|`(]|\$\()\s*(?:rm|cp|mv|tee|mkdir|touch|make|chmod)\b'

[compact_decl.bash_work_extra]
doc = "Regex source (case-insensitive) of the pushes, tags and pull-request writes this guard counts as work on top of the shared list."
value = '\bgit\s+(?:push|tag)\b|\bgh\s+pr\s+(?:merge|create)\b'

[compact_decl.tail_bytes]
doc = "How many bytes from the end of the transcript are read (the Node guard reads the same)."
value = 1572864
min = 1024

[compact_decl.safe_word]
doc = "Word a declaration must contain (compared without regard to ASCII case); a turn without it cannot hold one."
value = "safe"

[compact_decl.not_typed]
doc = "Regex source for injected user content that never starts a turn (task notification, local command output, system reminder, shell output)."
value = '^\s*<(task-notification|local-command-|system-reminder|bash-std(out|err))'

[compact_decl.notify]
doc = "Regex source for a background task notification."
value = '^\s*<task-notification>'

[compact_decl.compact_command]
doc = "Regex source for the compact command line the host writes as a user entry."
value = '^\s*<command-name>\s*/compact\s*</command-name>'

[compact_decl.reminder_tags]
doc = "Opening and closing tag of an injected system reminder, which may precede the real prompt."
value = { open = "<system-reminder>", close = "</system-reminder>" }

[compact_decl.deep_json_depth]
doc = "Nesting depth beyond which a transcript line the engine cannot parse is deferred to Node (the Node parser has no such limit)."
value = 100

[compact_decl.codex_text_types]
doc = "Content block types that carry assistant text in a Codex rollout entry."
value = ["output_text", "text"]

