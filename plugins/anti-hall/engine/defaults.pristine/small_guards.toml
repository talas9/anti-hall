[model_routing.mode_setting]
doc = "Where the model-routing mode (strict, advisory, off) is read from (guards.modelRouting): the environment variable, settings.json, then the plugin option; strict when none holds a valid value."
value = { section = "guards", key = "modelRouting", env = "ANTIHALL_MODEL_ROUTING", aliases = [], option = "guards_model_routing", default = "strict", values = ["strict", "advisory", "off"] }

[model_routing.deploy_floor_setting]
doc = "Where the deploy/migration/secret model floor (sonnet, opus, off) is read from (guards.modelRoutingDeployFloor): the environment variable, settings.json, then the plugin option; sonnet when none holds a valid value."
value = { section = "guards", key = "modelRoutingDeployFloor", env = "ANTIHALL_MODEL_ROUTING_DEPLOY_FLOOR", aliases = [], option = "guards_model_routing_deploy_floor", default = "sonnet", values = ["sonnet", "opus", "off"] }

[model_routing.advisory_mode]
doc = "Routing-mode value that downgrades omitted-model strict blocks to advisories."
value = "advisory"

[model_routing.off_mode]
doc = "Routing-mode value that disables model-routing."
value = "off"

[model_routing.deploy_floor_default]
