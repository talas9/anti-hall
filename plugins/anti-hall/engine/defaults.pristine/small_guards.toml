value = [".anti-hall", "bin"]

[edit_guard.msg_launcher_what]
doc = "Launcher-directory block headline; {tool} is the tool name."
value = "{tool} into ~/.anti-hall/bin/ (the stable launcher directory) is blocked."

[edit_guard.msg_launcher_why]
