value = "inherit"

[model_routing.model_rank]
doc = "Rank table for the deploy/migration/secret model floor."
value = { haiku = 1, sonnet = 2, opus = 3, fable = 3 }

[model_routing.mechanical]
doc = "Mechanical execution-only signal phrases, matched as token phrases after compatibility folding."
value = ["fetch", "download", "curl", "grep", "glob", "search files", "run command", "run script", "install", "build", "run tests", "git push", "deploy", "dump", "export", "tail", "read logs", "list", "check status"]

[model_routing.hard_execution]
doc = "Mechanical signals that suppress the row-1 research exemption."
value = ["run script", "install", "build", "run tests", "git push", "deploy"]

[model_routing.complex]
doc = "Complex/planning signal phrases whose presence vetoes rows that steer to haiku."
value = ["plan", "planning", "design", "architect", "review", "audit", "regression", "coupling", "merge order", "critique", "debate", "validate", "simulate", "root cause", "workflow analysis", "logic", "mockup", "security"]

[model_routing.role_word_re]
doc = "Debate-role exemption regex matched against the description only."
value = '\b(reviewer|auditor|critic|debate|deadly[- ]?loop)\b'

[model_routing.research_re]
doc = "Research/read-only regex for the row-1 research exemption and row-6 Explore advisory."
value = '\b(research|investigate|find|search|audit|survey|read[ -]?only|locate|map|gather|explore|scout|look\s+up|trace|reconnaissance)\b'

[model_routing.write_re]
doc = "Write/execute regex that suppresses the row-6 Explore advisory."
value = '\b(write|edit|modif|commit|push|changelog|create\s+(?:an?\s+|the\s+|new\s+)?files?|migrat|refactor|implement)\b'

[model_routing.write_imperative_re]
doc = "Instruction-position ambiguous write/execute regex that suppresses the row-6 Explore advisory."
value = '(?:^|[\n\r\u2028\u2029]|[.;:!?]\s+|\b(?:then|and|also|please|to)\s+)(?:tag|release|bump|apply|patch|build|deploy|install|fix)\b'

[model_routing.write_phrase_re]
doc = "Explicit write phrase regex (a save-to, clone, git clone/format-patch/mv/rm, opening a PR, running the generators or tests) that suppresses the row-6 Explore advisory even when read-only override words are present."
value = '\bsave\s+(?:[\w-]+\s+){0,4}?(?:to|into)\s+\S|\bclone\s+(?:\S+\s+){0,3}?(?:into|to)\s+\S|\bgit\s+(?:clone|format-patch|mv|rm)\b|\bopen(?:s|ing)?\s+(?:an?\s+|the\s+)?(?:pr|pull\s+request)\b|(?:^|[\n\r\u2028\u2029]|[.;:]\s+|\b(?:then|and)\s+)run\s+(?:the\s+)?(?:generators?|tests?|test\s+suite|build)\b'

[model_routing.commit_phrase_re]
doc = "Regex (case-insensitive) of a brief that tells the agent to commit or open a git worktree: a writing brief however many read-only words it quotes, so it suppresses the row-6 Explore advisory and cannot be overridden by an explicit read-only statement. A negated commit is removed first (negated_commit_re)."
value = '\bgit\s+(?:commit|push|worktree\s+add|checkout\s+-b)\b|\bcommit(?:s|ting)?\s+(?:per|each|every|it\b|them\b|your\b|after|before|the\s+(?:fix|fixes|change|changes|work)|with\s+a)\b|\bcommit\s+(?:and|&)\s+push\b'

[model_routing.quoted_text_re]
doc = "Regex (global) of quoted text in a brief: a single-quoted span that opens after a non-word character (so an apostrophe in a contraction never opens one) or a double-quoted span, at most 1000 characters (a quoted issue comment or log excerpt can span lines). The deploy floor reads the brief with these spans blanked (group 1 is kept): a word that is only quoted ('deploy' in a question about the word) is not a deploy task."
value = '''(^|[^\w'])'[^']{1,1000}'|"[^"]{1,1000}"'''

[model_routing.negated_commit_re]
doc = "Regex (case-insensitive, global) of a negated commit, push or worktree instruction ('never commit', 'do not push'); removed from the brief before commit_phrase_re is tested."
value = '''\b(?:do\s+not|don'?t|never|without|no)\s+(?:\w+\s+){0,3}?(?:git\s+)?(?:commit|push|worktree)\w*(?:\s*(?:,|or|and|nor)\s+(?:git\s+)?(?:commit|push|worktree)\w*)*'''

[model_routing.strong_write_re]
doc = "Regex (case-insensitive) of a brief that clearly writes: commits files or changes, pushes, creates issues, labels, branches, PRs or files, labels issues, edits or writes files or code, or runs a state-changing gh command (gh issue/label/pr/release/secret create|edit|comment|close|merge|delete|set, gh api -X POST|PATCH|PUT|DELETE). A writing brief whatever read-only words it quotes, so it suppresses the row-6 Explore advisory. Negated forms are removed first (negated_write_re)."
value = '''\bgh\s+(?:issue|label|pr|release|secret|repo|milestone)\s+(?:create|edit|comment|close|merge|delete|set|reopen)\b|\bgh\s+api\b[^\n]{0,200}?(?:-X|--method)[\s=]*(?:POST|PATCH|PUT|DELETE)\b|\bcommit(?:s|ting)?\s+(?:(?:the|all|its|your|each|every|those|these|any)\s+)?(?:files?|changes?|fix(?:es)?|work|results?|edits?|patch(?:es)?)\b|\bpush(?:es|ing)?\s+(?:it|them|the\s+\w+|to\s+\S+|your\s+\w+|its\s+\w+|branch\w*)\b|\b(?:and|then)\s+push(?:es)?\b|\bcreat(?:e|es|ing)\s+(?:(?:a|an|the|new|any|its|missing|all|\d+)\s+)?(?:gh\s+|github\s+)?(?:issues?|labels?|milestones?|pull\s+requests?|prs?|branch(?:es)?|commits?|files?|tests?)\b|\blabel(?:s|ling)?\s+(?:(?:the|each|all|every|its)\s+)?(?:issues?|prs?|pull\s+requests?)\b|\b(?:edit|write|modify|update)s?\s+(?:(?:the|a|its|your|this|that|these|those)\s+)?(?:files?|code|tests?|source|config)\b|\b(?:edit|write|modify)s?\s+\S+\.(?:js|ts|rs|toml|md|json|py|sh|ya?ml)\b'''

[model_routing.negated_write_re]
doc = "Regex (case-insensitive, global) of a negated write instruction ('never commit', 'do not push', 'don't create files', 'no edits or commits'); removed from the brief before strong_write_re is tested."
value = '''\b(?:do\s+not|don'?t|never|without|no|not)\s+(?:\w+\s+){0,3}?(?:git\s+|gh\s+)?(?:commit|push|edit|writ|creat|modif|label|updat)\w*(?:\s*(?:,|or|and|nor)\s+(?:git\s+|gh\s+)?(?:commit|push|edit|writ|creat|modif|label|updat)\w*)*'''

[model_routing.session_model_families]
doc = "Model families an omitted model can inherit, matched in order as a substring of the session's model id (the payload's parent model, else the newest transcript assistant entry); each must be a model_rank key. An omitted model whose inherited family ranks at or above the deploy floor gets no deploy-floor advisory."
value = ["fable", "opus", "sonnet", "haiku"]

[model_routing.session_model_window_bytes]
doc = "Bytes of the transcript tail read to find the session's model for an omitted-model spawn."
value = 262144
unit = "bytes"
min = 4096
max = 8388608

[model_routing.session_model_line_max_bytes]
doc = "The longest transcript line parsed when looking for the session's model (longer lines are skipped)."
value = 1048576
unit = "bytes"
min = 1024
max = 16777216

[model_routing.session_model_max_lines]
doc = "The newest transcript lines examined when looking for the session's model."
value = 400
min = 1
max = 100000

[model_routing.readonly_override_re]
doc = "Explicit read-only statement regex that overrides ambiguous write words for row 6."
value = '''\b(?:report\s+only|read[- ]?only|(?:do\s+not|don'?t|never)\s+(?:edit|modify|write|change|commit)|no\s+(?:edits|changes|writes))\b'''

[model_routing.deploy_strong_re]
doc = "Strong deploy/migration/secret regex that activates the deploy floor."
value = '\b(deploy\w*|redeploy\w*|migrat\w*|rollbacks?|roll\s+back|token\s+rotation|rotat\w*\s+(?:the\s+|a\s+)?(?:api\s+)?(?:tokens?|keys?|secrets?|credentials?)|wrangler|terraform|kubectl\s+apply|helm\s+(?:install|upgrade)|firebase\s+deploy|db\s+migrate)\b'

[model_routing.deploy_weak_re]
doc = "Weak deploy/migration/secret words; two distinct kinds activate the deploy floor."
value = '\b(prod|production|secrets?|credentials?)\b'

[model_routing.deploy_weak_aliases]
