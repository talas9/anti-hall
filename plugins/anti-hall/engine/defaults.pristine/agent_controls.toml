# ah-engine shipped defaults for the agent and transcript controls ported from Node: ask-guard, silent-agent-nudge and
# stale-agent-stop-note, and the transcript agent scan they share (hooks/lib/agent-scan.js). Every pattern, message, setting
# name and limit of these checks lives here (D17, D30). Regex sources are written as TOML literal strings so no backslash is
# doubled; those under `agent_scan.re_` are JavaScript sources translated by `checks::guardkit::jsre` unless their doc says
# they are Rust regex sources. Format: see the header of engine.toml.

# ---- the transcript agent scan (hooks/lib/agent-scan.js, hooks/lib/transcript-tail.js) --------------------------

[agent_scan.tail_bytes]
doc = "Bytes read from the end of a transcript by the default scan (MAX_TAIL_BYTES of hooks/lib/transcript-tail.js)."
value = 1572864
unit = "bytes"

[agent_scan.wide_tail_bytes]
doc = "Bytes read by the one widened scan that proves a zero running-agent count on a transcript longer than the default window (WIDE_TAIL_BYTES of hooks/lib/agent-scan.js)."
value = 12582912
unit = "bytes"

[agent_scan.retain_bytes]
doc = "Most text of tool results the scan keeps for its delivered-but-unnotified safety net; a scan that would keep more defers to the Node hook so the daemon's memory stays bounded."
value = 8388608
unit = "bytes"

[agent_scan.pending_silence_ms]
doc = "How long a teammate with an unanswered message still counts as running without a sign of life (PENDING_MESSAGE_SILENCE_MS of hooks/lib/agent-scan.js)."
value = 1200000
unit = "ms"

[agent_scan.report_future_skew_ms]
doc = "How far past its own entry a teammate report's inner timestamp may lie before the report is treated as forged (REPORT_FUTURE_SKEW_MS)."
value = 5000
unit = "ms"

[agent_scan.resume_skew_slack_ms]
doc = "How far before a resume record a terminal notice may be stamped and still stand (RESUME_SKEW_SLACK_MS)."
value = 2000
unit = "ms"

[agent_scan.safe_int]
doc = "Largest integer JavaScript prints exactly (2^53 - 1); a tool input holding a number outside it is judged by the Node hook, whose number text differs."
value = 9007199254740991

[agent_scan.launch_text]
doc = "Text a launch tool_result begins with."
value = "Async agent launched successfully"

[agent_scan.notification_tag]
doc = "The opening tag of a completion notice."
value = "<task-notification>"

[agent_scan.agent_tool]
doc = "Name of the tool whose input carries the description of a launched agent."
value = "Agent"

[agent_scan.stop_tool]
doc = "Name of the tool that stops an agent."
value = "TaskStop"

[agent_scan.launch_tools]
doc = "Tools whose tool_result can be a launch of an agent."
value = ["Agent", "Task"]

[agent_scan.resume_tools]
doc = "Tools whose tool_result can be a resume of an agent."
value = ["SendMessage", "Agent", "Task"]

[agent_scan.delivery_tools]
doc = "Tools whose tool_result can deliver an agent's result."
value = ["TaskOutput", "SendMessage"]

[agent_scan.send_tools]
doc = "Tools whose tool_result can be a message sent to a teammate's inbox."
value = ["SendMessage"]

[agent_scan.prefilter]
doc = "Substrings that decide whether a transcript line is parsed at all: a launch, a completion notice, an Agent or TaskStop tool call (with and without a space after the colon), a tool result, a tool use, a task_status attachment and a teammate idle notice."
value = { launch = "Async agent launched successfully", notification = "<task-notification>", agent_use = '"name":"Agent"', agent_use_spaced = '"name": "Agent"', tool_result = "tool_result", taskstop = '"name":"TaskStop"', taskstop_spaced = '"name": "TaskStop"', task_status = '"task_status"', tool_use = '"tool_use"', idle = "idle_notification" }

[agent_scan.teammate_report_prefix]
doc = "Text a teammate report entry begins with."
value = "Another Claude session sent a message:"

[agent_scan.not_a_report_keys]
doc = "Keys the host stamps on records that come from a person, a queue, a tool result or a compaction, and never on a real teammate report (NOT_A_REPORT_KEYS)."
value = ["origin", "promptSource", "turnOrigin", "permissionMode", "isMeta", "isCompactSummary", "isSidechain", "toolUseResult", "sourceToolAssistantUUID", "imagePasteIds", "queuePriority", "scheduledTaskId"]

[agent_scan.sidechain_key]
doc = "The one key of the list above that only counts when it is true."
value = "isSidechain"

[agent_scan.resuming_word]
doc = "Word a resume tool_result carries."
value = "Resuming"

[agent_scan.resumed_key]
doc = "Field of a resume tool_result that holds the full agent id."
value = "resumedAgentId"

[agent_scan.queued_phrase]
doc = "Phrase of the result of a message queued for a running agent."
value = "Message queued for delivery to"

[agent_scan.inbox_phrase]
doc = "Phrase of the result of a message sent to a teammate's inbox."
value = "'s inbox"

[agent_scan.empty_object]
doc = "What JSON.stringify gives for a missing tool input."
value = "{}"

[agent_scan.object_string]
doc = "What String() gives for an object."
value = "[object Object]"

[agent_scan.undefined_string]
doc = "What String() gives for a missing value."
value = "undefined"

[agent_scan.utc_suffix]
doc = "Suffix of a clock time in a note."
value = " UTC"

[agent_scan.transcript_ext]
doc = "Extension of a transcript file."
value = ".jsonl"

[agent_scan.subagents_dir]
doc = "Directory, beside a transcript's own name, that holds the transcripts of its subagents."
value = "subagents"

[agent_scan.sidechain_prefix]
doc = "Prefix of a subagent transcript's file name."
value = "agent-a"

[agent_scan.json_unsupported]
doc = "Fragments of a JSON parser error that mean the text is JSON to JavaScript but not to serde (nesting past the parser's limit, a number past f64 range); such a line defers to the Node hook."
value = ["recursion limit", "out of range"]

[agent_scan.re_surrogate_escape]
doc = "Rust regex source of an escape for a UTF-16 surrogate half: JavaScript reads a lone one, serde does not, so text that holds one and fails to parse defers to the Node hook."
value = '\\u[dD][89a-fA-F][0-9a-fA-F]{2}'

[agent_scan.re_notification_block]
doc = "Rust regex source of one completion notice block, lazily to the first closing tag."
value = '(?s)<task-notification>(.*?)</task-notification>'

[agent_scan.re_task_id]
doc = "Rust regex source of the task id inside a notice."
value = '<task-id>([^<]*)</task-id>'

[agent_scan.re_status]
doc = "Rust regex source of the status inside a notice."
value = '<status>([^<]*)</status>'

[agent_scan.re_agent_id]
doc = "JavaScript regex source of the agent id in a launch result."
value = 'agentId:\s*([0-9a-fA-F]{6,40})'

[agent_scan.re_output_file]
doc = "JavaScript regex source of the output file in a launch result."
value = 'output_file:\s*(\S+)'

[agent_scan.re_resume_message]
doc = "JavaScript regex source (case-insensitive) of the start of a resume message."
value = '^Resuming\s+agent\s+([0-9a-fA-F]{6,40})'

[agent_scan.re_hex_id]
doc = "Rust regex source of a whole agent id."
value = '^[0-9a-fA-F]{6,40}$'

[agent_scan.re_hex_run]
doc = "Rust regex source of a run of hex digits that may name an agent by prefix."
value = '[0-9a-fA-F]{7,40}'

[agent_scan.re_running_row]
doc = "JavaScript regex source (case-insensitive) of a status row that says an agent is still running."
value = '·\s*running\b'

[agent_scan.re_notification_in_reminder]
doc = "JavaScript regex source of a completion notice directly inside a system reminder."
value = '<system-reminder>\s*<task-notification>'

[agent_scan.re_inbox_send]
doc = "JavaScript regex source of the message of a send to a teammate's inbox."
value = "^Message sent to (.+)'s inbox$"

[agent_scan.re_teammate_block]
doc = "Rust regex source of one teammate message block at the start of the text, lazily to the first closing line."
value = '(?s)\A<teammate-message teammate_id="([^"]+)"[^>]*>\n(.*?)\n</teammate-message>'

[agent_scan.re_queued_message]
doc = "JavaScript regex source of the message of a send to a running agent."
value = '^Message queued for delivery to\s'

[agent_scan.re_iso_datetime]
doc = "Rust regex source of the ISO date-time with an explicit zone that the scan reads itself; other timestamp forms defer to the Node hook."
value = '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2})(?::([0-9]{2})(?:\.([0-9]+))?)?(Z|[+-][0-9]{2}:[0-9]{2})$'

[agent_scan.re_iso_date]
doc = "Rust regex source of the ISO date alone (read as UTC midnight)."
value = '^([0-9]{4})-([0-9]{2})-([0-9]{2})$'

# ---- shared setting reading --------------------------------------------------------------------------------

[guardkit.js_decimal_re]
doc = "Rust regex source of the text JavaScript's Number() reads as a decimal number (the hexadecimal, octal and binary forms are read separately)."
value = '^[+-]?(?:[0-9]+\.?[0-9]*|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'

