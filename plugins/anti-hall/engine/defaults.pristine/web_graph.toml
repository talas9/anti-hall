# ah-engine shipped defaults for the shared node-graph component of the Command Center (ah-web-graph: agent graph, system
# topology, rules/hooks editor). Format: see the header of engine.toml. `ah-web` serves these keys to the page as JSON: every
# dot after `web.graph.` is one level of nesting (web.graph.theme.kinds.agent.color -> theme.kinds.agent.color), and the WASM
# component compiles in none of them. Colours are OKLCH tokens; the canvas/GPU layers convert them at start-up.

