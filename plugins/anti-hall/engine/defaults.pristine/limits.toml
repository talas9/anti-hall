# Limits, sizes, phrases and short texts that were literals in the engine's source (D17 amendment: nothing is compiled in).
# Each entry sits next to the section it belongs to by name; the file is only a place to keep the late additions together.

[io.chunk_bytes]
doc = "Size of the buffer used to copy a hook payload between pipes and files: spooling stdin, scanning it for the tool name, feeding a spooled file to a hook."
value = 65536
unit = "bytes"
min = 4096
max = 4194304

[io.small_chunk_bytes]
doc = "Size of the buffer used to read a request from the daemon socket and a hook child's output."
value = 8192
unit = "bytes"
min = 512
max = 1048576

[guardkit.tail_reader_buf_bytes]
doc = "Capacity of the buffered reader the shared transcript tail reader (`guardkit::tail::tail_lines`) streams lines through."
value = 65536
unit = "bytes"
min = 4096

[agent_scan.cut_check_lines]
doc = "How many transcript lines the agent scan reads between two looks at its request's client deadline: a scripted check cut at that deadline (script.cut_at_request_deadline) stops its scan there instead of reading the rest of a window of many megabytes, which the interpreter cannot interrupt (measured 2026-10-09 under load: silent-agent-nudge's 64 MB scan ran 4.4 s past a 0.7 s remainder)."
value = 256
min = 1

[agent_scan.reader_buf_bytes]
doc = "Capacity of the buffered reader over the tail of a transcript the agent scan reads."
value = 1048576
unit = "bytes"
min = 4096
max = 67108864

[git.max_recursion]
doc = "Deepest nesting of wrapper commands (`xargs xargs ...`) the git check follows before it defers to Node, whose own stack overflows at about this depth."
value = 1500
min = 10
max = 100000

[git.path_arg_max_chars]
doc = "Longest directory argument (in characters) the git check tracks through a `cd`; a longer one is left to Node."
value = 4096
min = 64
max = 1048576

[git.handover_adds_max]
doc = "Most `git add` commands the git check remembers in one command line when it looks for a staged handover file."
value = 50
min = 1
max = 10000

[git.shown_hits]
doc = "How many commit hashes the handover message names before it adds the more-marker."
value = 3
min = 1
max = 100

[git.self_credit_coauthor_key]
doc = "The trailer key (lowercase) that credits a co-author; an AI tool named after it is a self-credit."
value = "co-authored-by"

[git.self_credit_generated_prefix]
doc = "The footer prefix (lowercase, with its trailing space) after which an AI tool name is a self-credit."
value = "generated with "

[git.self_credit_trailer_keys]
doc = "The trailer keys (lowercase) that a `-c trailer.<key>.key=` remap must not write a credit under."
value = ["co-authored-by", "generated-with", "generated with", "claude-session"]

[codex_handover.nudge_shown_files]
doc = "How many edited file names the Codex handover nudge lists before it adds the more-marker."
value = 3
min = 1
max = 100

[guardkit.settings_seen_max]
doc = "Most settings files the guard kit remembers the validity of before it starts over."
value = 256
min = 1
max = 100000

[guardkit.settings_invalid_pending_max]
doc = "Most out-of-range settings numbers (such as 1e400) noted between two telemetry drains; the rest are dropped from the settings_value_invalid count, never from the settings file's other keys."
value = 256
min = 1
max = 100000

[gitcache.content_cap_bytes]
doc = "Bytes of a signed file read when the cache fingerprints a repository (a HEAD or a loose ref is a few dozen bytes)."
value = 4096
unit = "bytes"
min = 64
max = 1048576

[dispatch.stop_id_max_chars]
doc = "Longest session or agent id the stop-loop guard keeps in a state file name; the rest is cut."
value = 64
min = 8
max = 255

[coordinator_work.window_default]
doc = "Default of the coordinator work window setting, in minutes, when the setting is absent or unusable."
value = 10
min = 0

[coordinator_work.nudge_default]
doc = "Default of the coordinator work nudge threshold when the setting is absent or unusable."
value = 4
min = 0

[coordinator_work.block_default]
doc = "Default of the coordinator work block threshold when the setting is absent or unusable."
value = 7
min = 0

[coordinator_work.cap_default]
doc = "Default of the coordinator work tracked-call cap when the setting is absent or unusable."
value = 50
min = 1

[taskstate.no_tasks_marker]
doc = "The text in a task tool result that says the list is empty."
value = "No tasks found"

[msg.client_what_timeout]
doc = "What the client was doing when a socket option could not be set (the {what} of msg.client_io)."
value = "set timeout"

[jev.what_read_requests]
doc = "What the Jev `ask` command was doing when reading its stdin failed."
value = "read the requests from stdin"

[jev.what_read_texts]
doc = "What the Jev `scrub` command was doing when reading its stdin failed."
value = "read the texts from stdin"

[jev.what_create_dir]
doc = "What the decision log was doing when creating its directory failed."
value = "create the directory of"

[msg.cli_usage_schedule_run]
doc = "The usage line of `schedule run`."
value = "schedule run <job>"

[msg.cli_usage_restore]
doc = "The usage line of `restore`."
value = "restore <snapshot-dir>"

[task_lifecycle_log.index_file]
doc = "Name of the per-kind session index file the lifecycle log maintains under the state directory."
value = "INDEX.md"


# ---- rc97: literals moved out of the engine source (owner rule: nothing hardcoded, nothing compiled) -------------------------

[entry_audit.shebang_read_bytes]
doc = "How many bytes of a file the entry audit reads to see whether it starts with an interpreter line (entry_audit.shebang)."
value = 256
unit = "bytes"
min = 16
max = 65536

[mem.leak_msg_evidence_failed]
doc = "The leak notice when its evidence file could not be written. Placeholders: text (the notice, mem.leak_msg_notice), err (why the write failed)."
value = "{text} [evidence not written: {err}]"

[mem.bytes_per_mb]
doc = "Bytes in one megabyte as the leak sentinel counts them (1,048,576 = 2^20): converts a byte slope or footprint to MB."
value = 1048576
unit = "bytes"
min = 1

[mem.seconds_per_hour]
doc = "Seconds in one hour: converts the leak sentinel's per-second slope to MB per hour."
value = 3600
unit = "s"
min = 1

[webapi.msg_audit_not_written]
doc = "The note a settings or rules change carries when its audit row could not be written and no other note exists. Placeholder: err."
value = "audit not written: {err}"

[webapi.msg_audit_not_written_after]
doc = "The note when the audit row could not be written and the change already carries a note. Placeholders: note (the existing note), err."
value = "{note}; audit not written: {err}"

[web.msg_query_no_source]
doc = "Said when a dashboard query names a data source the engine does not have. Placeholder: what (the name asked for)."
value = "no source '{what}'"

[web.query_day_ms]
doc = "Milliseconds in one day: converts the dashboard query window given in days to the millisecond clock the stores use."
value = 86400000
unit = "ms"
min = 1

[web.io_buckets]
doc = "Number of latency buckets of the dashboard's served-call histogram; bucket b holds calls of 2^b up to 2^(b+1) microseconds and the last bucket takes everything slower (24 buckets reach about 17 s, so a slow call is told apart from an overflow)."
value = 24
min = 2
max = 64

[web.valueless_flags]
doc = "Flags of the dashboard's engine verbs that take no value, so the word after them is a positional argument, not their value."
value = ["--confirmed", "--json", "--all"]

[web.build_sha_bytes]
doc = "How many leading bytes of the engine binary's SHA-256 the pulse shows as the build id (each byte is two hex digits; the deploy kit verifies the same figure)."
value = 4
min = 1
max = 32

[web.exit_unavailable]
doc = "Exit code of the web CLI when the server binary is missing or did not come up (sysexits EX_UNAVAILABLE, 69, the code every unavailable verb of the engine uses)."
value = 69
min = 1
max = 255

[web.probe_connect_ms]
doc = "How long the web CLI waits for the server's port to accept a connection before it treats the recorded server as gone."
value = 500
unit = "ms"
min = 10

[act.stop_poll_floor_ms]
doc = "The shortest sleep between two looks at a process a stop is waiting on, so the last poll before the deadline never spins."
value = 1
unit = "ms"
min = 1

[act.proc_actions]
doc = "The actions `proc <action> <pid>` accepts besides `list`."
value = ["status", "stop", "restart"]

[mesh_events.sql_messages]
doc = "The query behind `CTL mesh-events` messages (heartbeats left out). Placeholder: order (ASC, or DESC for `latest=`). Parameters: ?1 the id after which to read, ?2 the row limit."
value = "SELECT id, workspace_id, ts, sender, recipient, mtype, urgency, needs_reply, seq, length(body) FROM messages WHERE id > ?1 AND COALESCE(is_heartbeat, 0) = 0 ORDER BY id {order} LIMIT ?2"

[mesh_events.sql_reads]
doc = "The query behind `CTL mesh-events` read cursors. Parameter: ?1 the updated_at after which to read."
value = "SELECT partition, ns, reader, value, updated_at FROM reader_cursors WHERE updated_at > ?1 ORDER BY updated_at"

[mesh_events.sql_body]
doc = "The query behind `CTL mesh-msg`. Parameter: ?1 the message id."
value = "SELECT body FROM messages WHERE id = ?1"

[mesh_write.known_block_skip]
doc = "Keys of the read-side block that `inbox` leaves out of its own reply because it adds its own totals around them."
value = ["meshGroupUnresolved", "meshGroupError", "totalsPartial"]

[mesh_write.refusal_fields]
doc = "Fields of an ensure refusal that carry the reason, tried in order; the first one present is the reason a pull was held."
value = ["reason", "error"]

[devswarm_parent.drift_cache_cwd_factor]
doc = "How many times devswarm_parent.drift_cache_keys_max the per-file cwd cache may hold before it is emptied."
value = 64
min = 1
