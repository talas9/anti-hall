# ah-engine shipped defaults for the DevSwarm CLI verbs ported from scripts/devswarm.js (lane l8): `help` (and the unknown-verb
# answer), `skip`, `archive-ignore`, `archive-unignore`, `gate-intent` and `notice --list`. Format: see the header of engine.toml.
# They run as `ah-engine mesh <devswarm.js argv>` (the launcher's route) or `ah-engine devswarm <verb> <args>` (under the role
# matrix of devswarm_wire.toml). Every verb name, flag, path, limit and message text lives here; the values are Node's own
# (scripts/devswarm.js, scripts/devswarm-lib/misc-verbs.js, archive.js, companion/lib/devswarm-maintainer-notice.js), and the
# parity test (tests/devswarm_cli_parity.rs) compares them with the Node CLI, including the help table below.

[devswarm_cli.verbs]
doc = "The verbs scripts/devswarm.js dispatches, in the order of its switch (the order `help` lists them and the unknown-command message names them). A verb the engine does not port is still listed: it is Node's."
value = ["primary", "register", "ensure", "heartbeat", "inbox", "workspaces", "gate", "done", "nudge", "archive", "reap-orphans", "reconcile-registry", "unarchive", "archive-ignore", "archive-unignore", "archive-request", "register-primary", "migrate", "logs", "migrate-owner-keys", "send", "relay", "roster", "wake-directive", "app-state", "sync-ui", "app-sync", "diagnose", "plan", "scope", "supervision-report", "respawn", "correct", "healthcheck", "ready-check", "mesh", "reconcile", "reap-stale", "reconcile-active", "spawn", "merge", "skip", "auto-archive", "prune-archived", "gate-intent", "retention", "notice"]

[devswarm_cli.help]
doc = "The one-line synopsis and the side-effect note of every verb (scripts/devswarm.js VERB_HELP), by verb name. `mutates` absent means none is on file."
value = { "primary" = { synopsis = "primary [status|takeover] [--session S] — status (default, read-only) prints this checkout's Primary-seat verdict; takeover re-registers the Primary seat to this session (--force), demoting the other holder (run it in the Primary checkout)", mutates = "`status` is read-only; `takeover` rewrites the Primary descriptor/registry row" }, "register" = { synopsis = "register a new workspace descriptor", mutates = "writes the descriptor file + store registry + summary" }, "ensure" = { synopsis = "like register, but idempotent: creates the descriptor when absent, otherwise keeps the existing one (backfilling missing fields only); refuses an archived workspace", mutates = "writes the descriptor file + store registry + summary" }, "heartbeat" = { synopsis = "record a liveness heartbeat for a workspace [--summary TEXT] [--step N --status doing|done|blocked] (--step records progress on the workspace's step plan)", mutates = "writes a heartbeat file; may emit a mesh broadcast; --step updates the plan file" }, "inbox" = { synopsis = "inbox subcommands: count | read | ack | pull | tick | messages | read-primary | ack-primary | peek-primary | drain-primary-legacy (drain = read-primary, consume, then the returned ack-primary --receipt command). `tick <id> [--child]` is the mailbox-wake cron's one-command drain: with --child it runs `pull` first, then reports the `count` shape and writes the wake-tick marker + heartbeat ts. `read-primary <id> --format text` prints one `from/seq/body` line per message instead of the raw JSON (still two-step by default: nothing is acked). `read-primary <id> --ack-after-print` is opt-in: acks immediately after printing (equivalent to running the returned `ackCommand` right away) — omit it and the two-step read-then-`ack-primary --receipt` default is unchanged. `inbox messages <id> [--limit N] [--since <index>|<ISO date>] [--tail N]` bounds a non-acking read: --since (a per-partition message index, or a parseable date such as ISO 8601) filters to rows at/after that point BEFORE the per-source --limit cap is applied, so a recent window is never emptied by an old, oversized inbox; --tail N keeps only the newest N of what --since (if given) returned, and refuses outright (rather than guess) if the --limit cap itself still truncated. --since/--tail are rejected on any ack-bearing call (read-primary/ack/pull/etc) — use the non-acking `messages` read for a bounded view.", mutates = "`pull`/`ack`/`ack-primary`/`drain-primary-legacy` mutate cursors; `tick` writes the wake-tick marker + heartbeat ts (and pulls with --child); `read-primary` writes only a read receipt (or also acks, with --ack-after-print); the rest are read-only" }, "workspaces" = { synopsis = "list registered workspaces", mutates = "read-only" }, "gate" = { synopsis = "set/clear merge gates on a workspace (--set/--clear)", mutates = "writes gate state to the store" }, "done" = { synopsis = "child: report this workspace done (sets the `done` gate on your own id + one [[ANTIHALL_DONE]] message to the Primary; idempotent) [--summary TEXT]", mutates = "writes the done gate + one mesh-direct message to the Primary" }, "nudge" = { synopsis = "send a nudge command to a workspace", mutates = "runs the configured nudge command against the workspace" }, "archive" = { synopsis = "archive (tombstone) a workspace registry row", mutates = "writes an archive tombstone to the store" }, "reap-orphans" = { synopsis = "clean up orphaned partitions across stores", mutates = "mutates store partitions; may rehome/heal registry rows" }, "reconcile-registry" = { synopsis = "reconcile the workspace registry against descriptors on disk", mutates = "writes registry rows" }, "unarchive" = { synopsis = "restore a previously archived workspace", mutates = "reverses an archive tombstone in the store" }, "archive-ignore" = { synopsis = "mark an archived workspace to be ignored by reap/heal", mutates = "writes an ignore marker" }, "archive-unignore" = { synopsis = "clear the archive-ignore marker on a workspace", mutates = "removes an ignore marker" }, "archive-request" = { synopsis = "request another session archive its own workspace", mutates = "mesh-direct store write" }, "register-primary" = { synopsis = "register the primary session for the current project", mutates = "MUTATES the store — writes a primary registry row derived from cwd" }, "migrate" = { synopsis = "run the store forward-migration", mutates = "MUTATES the store — this is a real migration run, not a dry check" }, "logs" = { synopsis = "query the shared devswarm JSONL log", mutates = "read-only" }, "migrate-owner-keys" = { synopsis = "forward-migrate descriptor owner keys", mutates = "MUTATES descriptor files on disk" }, "send" = { synopsis = "send a mesh message: --to <id>[,<id2>…]|--to-primary|--broadcast --message TEXT|--message-file <path>|--message-stdin [--urgency low|normal|high|urgent] [--question] [--answers] [--quiet] [--cc-primary]. `--quiet` prints one line (\"sent seq N -> X, B bytes, ok\") instead of the full JSON, and still prints \"ok:false ...\" + a non-zero exit on failure. `--cc-primary` (direct --to sends only) ALSO copies the Primary with the identical message body, best-effort — reported under the result's `ccPrimary`, never flips the primary send's own ok/exit code. Several recipients (`--to a,b` or a repeated `--to`, deduped) each get the same body; every one is attempted, results come back per recipient (ok, seq, bytes), and the exit is non-zero if any failed.", mutates = "MUTATES the store — appends a mesh message (and, with --cc-primary, a second one to the Primary) and may wake recipients" }, "relay" = { synopsis = "relay <seq|receipt> --to <id> [--note-file <path>] — forward a message THIS caller already received (its own inbox) to <id> verbatim, prefixed with a provenance header (\"relayed from X, seq N, M bytes\"). <seq> is the row's own `seq` (from `inbox messages`/`read-primary`); <receipt> is a read-primary readReceiptId and resolves only when it covers exactly one message. relay never acks: the read still needs its own `inbox ack-primary --receipt <receipt>`. Verifies the relayed byte length against the source and refuses (ok:false) on a mismatch or an empty source body — never a silent partial relay. Example: `relay 42 --to sibling-workspace-id`.", mutates = "MUTATES the store — appends one mesh message (via `send`, under this file's own Primary-seat gate)" }, "roster" = { synopsis = "show the mesh roster as a compact table of live workspaces (--all adds archived rows, --json prints the full data, --ack clears your own broadcast-unread)", mutates = "read-only, unless --ack is passed (clears broadcastUnread)" }, "wake-directive" = { synopsis = "reprint the SessionStart mailbox wake directive", mutates = "read-only" }, "app-state" = { synopsis = "DevSwarm app-DB summary: open workspaces by sidebar rank, PR/brief signals, session map, drift, message gaps (--json)", mutates = "read-only" }, "sync-ui" = { synopsis = "reconcile a transcribed DevSwarm sidebar screenshot (--titles-json <file>|--stdin) against the app DB; dry run unless --yes", mutates = "with --yes: archived markers (app-DB-proven only, never deletes) + names cache" }, "app-sync" = { synopsis = "run the supervisor app-DB sync now (archived markers, names cache, app-state.json; --dry-run)", mutates = "writes archived markers (never deletes), names cache, app-state.json" }, "diagnose" = { synopsis = "read-only mesh-health projection", mutates = "read-only" }, "plan" = { synopsis = "plan set <id> --steps \"1. …\\n2. …\"|--steps-file <path> [--scope glob,glob] — write the workspace's numbered step plan (idempotent); plan show <id> — print it with its step label", mutates = "`set` writes ~/.anti-hall/devswarm/plans/<key>.json; `show` is read-only" }, "scope" = { synopsis = "scope add <id> --glob <glob> [--glob …] --note TEXT — child: record extra work the user asked for, so the off-scope straying signal treats it as sanctioned and the Primary sees the note (idempotent)", mutates = "writes the plan file's extras" }, "supervision-report" = { synopsis = "supervision-report [--days N] [--json] — how DevSwarm supervision performed: straying warnings by signal, repeats, corrections followed by step progress, extras tagged, time-to-done and steps done vs planned, Jev shadow agreement (default 7 days)", mutates = "nothing (read-only)" }, "respawn" = { synopsis = "respawn <id> [--dry-run] — Primary only, after a `correct` warning and devswarm.respawnGraceMin minutes: ask the child to commit+push, park anything left on a new pushed park/<branch>-<ts> branch (abort if that fails), write plans/<id>.handover.md, spawn <branch>-r<N> from the default branch with the handover + remaining steps, archive the old id (--dry-run prints the plan only)", mutates = "one mesh send, a new park branch (pushed), the handover file, a new workspace, the old workspace archived" }, "correct" = { synopsis = "correct <id> [--dry-run] — Primary: send a straying child the correction \"step N '<text>': <reasons>. Return to step N or reply BLOCKED <why>\" and record warned_at (--dry-run prints it only)", mutates = "one mesh-direct send + the plan file's warned_at" }, "healthcheck" = { synopsis = "pass/fail health gate over the same data as diagnose", mutates = "read-only" }, "ready-check" = { synopsis = "ready-check <sha> [--base <ref>] [--allow glob,glob] [--watch-deletions dir,dir] [--fetch] — read-only readiness verdict (ok|review|block) for a child's \"READY <sha>\" claim: fast-forward vs base (default origin/main), gitlink changes, watched-dir deletions, files outside --allow", mutates = "read-only (--fetch runs `git fetch`)" }, "mesh" = { synopsis = "mesh subcommands: read", mutates = "read-only" }, "reconcile" = { synopsis = "rehome/heal descriptors across stores", mutates = "MUTATES the store — rehomes descriptors, heals the registry, spawns `inbox pull` per descriptor" }, "reap-stale" = { synopsis = "reap stale workspaces past their liveness window", mutates = "MUTATES the store — archives/tombstones stale rows" }, "reconcile-active" = { synopsis = "reconcile active workspaces against liveness", mutates = "MUTATES the store" }, "spawn" = { synopsis = "spawn <branch> [-s|--source <branch>] [-a|--agent <agent>] [-p|--prompt <text>] [-r|--remote] [-t|--title <title>] [--from-local] — create a new workspace via `hivecontrol workspace create` (raw argv tail forwarded verbatim; anti-hall adds ONLY `--from-local`, which it strips before forwarding). -s/--source: source branch to branch from (default: your current branch). -a/--agent: AI agent to use (default: repo default, then claude). -p/--prompt: initial prompt for the AI to start on immediately (also used to derive the workspace title when -t is absent). -r/--remote: use an existing remote branch (fetches from origin). -t/--title: display title (defaults to the branch name; anti-hall applies it via a separate update-title follow-up, reported as `titled`). --from-local: spawn from local HEAD even when it is stale/diverged from origin (anti-hall's own freshness gate; never forwarded to hivecontrol). Example: `spawn feature/foo -p \"implement X end to end\" -t \"Feature X\"`. Follow-up brief to an already-spawned child: `send --to <childId> --message \"...\"` (mesh-direct, this file's own delivery+ack path) — hivecontrol's own `workspace message-child <branch> \"<message>\"` also exists but bypasses anti-hall's mesh/ack bookkeeping, so prefer `send`. Read a child's status: `roster` (mesh-wide liveness/gates) or `inbox pull <childId>`/`inbox messages <childId>` (its own inbox).", mutates = "MUTATES — forwards the raw argv tail straight to the hivecontrol child process" }, "merge" = { synopsis = "check-merge + merge-into-source via hivecontrol (raw argv pass-through)", mutates = "MUTATES — forwards to hivecontrol AND unconditionally sends a mesh broadcast reporting the outcome" }, "skip" = { synopsis = "skip <guard> [--ttl <minutes>] — temporarily disable an anti-hall guard", mutates = "writes a skip-file entry" }, "auto-archive" = { synopsis = "show the auto-archive plan (done+merged+clean+no-unread+idle workspaces)", mutates = "read-only" }, "prune-archived" = { synopsis = "prune-archived --older-than <days> (dry run) | --confirm-ids <ids> --plan <nonce>", mutates = "dry run writes a plan file; --confirm-ids DELETES the listed archived workspaces via hivecontrol (owner-approved only)" }, "gate-intent" = { synopsis = "record a stated-intent signal for the Stop-hook parent gate", mutates = "writes a gate-intent record" }, "retention" = { synopsis = "message retention: status | run [--dry-run] [--store X] | restore --store X --month yyyy-mm", mutates = "`run` archives then prunes old message bodies (rows, positions and hashes stay) and VACUUMs; `restore` re-imports an archive month; `status`/`run --dry-run` are read-only" }, "notice" = { synopsis = "notice --post \"<text>\" [--ttl 7d] | notice --list — the anti-hall dev agent's cross-project maintainer broadcast", mutates = "`--post` appends one entry to ~/.anti-hall/devswarm/maintainer-notices.jsonl (refused unless devswarm.maintainerNotice.post=true AND this checkout is anti-hall itself); `--list` is read-only" } }

