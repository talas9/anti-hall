value = "APP SIDE EFFECT: {message} {changed}"

[devswarm_cli.msg_app_step_ok]
doc = "The manual step of an archive that also archived in the app; `{retry}` is empty or the retry note."
value = "archived in the DevSwarm app too (isActive=0/isHidden=1, verified){retry}."

[devswarm_cli.msg_app_retry_note]
doc = "The retry note."
value = " — succeeded on retry"

[devswarm_cli.msg_app_step_fail]
doc = "The manual step of an archive whose app side is not done; `{tail}` says why."
value = "run `{cmd}` (or archive it manually in the DevSwarm app) to also archive workspace {id} there — anti-hall's own archive only tombstoned its local descriptor/registry (archive keeps disk contents; never delete without confirmation).{tail}"

[devswarm_cli.msg_app_tail_attempted]
doc = "The tail of that step when an app archive was tried."
value = " [app archive attempted, NOT verified: {error}]"

[devswarm_cli.msg_app_tail_skipped]
doc = "The tail of that step when an app archive was not tried."
value = " [app archive not attempted: {reason}]"

[devswarm_cli.msg_app_error_unknown]
doc = "The error named in the tail when none is known."
value = "unknown"

[devswarm_cli.msg_live_child_warning]
doc = "The warning of an archive whose child still beats."
value = "child session still live for {id} (fresh heartbeat) — it may re-register and reappear; close its terminal or it will keep coming back"

[devswarm_cli.app_reason_absent]
doc = "The reason the capability gate gives when `hivecontrol` cannot be found."
value = "hivecontrol-absent"

# ---- register-primary ---------------------------------------------------------------------------------------------------

[devswarm_cli.verb_register_primary]
doc = "The verb that registers the Primary checkout's own workspace."
value = "register-primary"

[devswarm_cli.action_register_primary]
doc = "The `action` a register-primary result carries."
value = "register-primary"

[devswarm_cli.flag_force]
doc = "The flag that registers the Primary over a live holder, or from a child workspace."
value = "force"

[devswarm_cli.reason_not_primary_checkout]
doc = "The `reason` of the refusal to register a child workspace as the Primary."
value = "not-primary-checkout"

[devswarm_cli.reason_live_primary_conflict]
doc = "The `reason` of the refusal to register over a live Primary session."
value = "live-primary-conflict"

[devswarm_cli.msg_regprim_no_worktree]
doc = "The refusal outside a git worktree without --worktree."
value = "register-primary must run inside a git worktree (or pass --worktree <path>)"

[devswarm_cli.msg_regprim_child]
doc = "The refusal to register a child workspace; {worktree} is the path as JSON."
value = "register-primary refused: {worktree} is a DevSwarm CHILD workspace, not the project's Primary checkout. A child is addressed by its own workspace id; pass --force only if this worktree really hosts the Primary."

[devswarm_cli.msg_regprim_conflict]
doc = "The refusal to register over a live Primary session; {worktree}, {id} and {session} are JSON strings."
value = "register-primary refused: worktree {worktree} already has a LIVE Primary row {id} registered under a different, currently-live session ({session}). Registering now would silently overwrite that session's ownership of this row (anti-hall: ONE Primary per project). Pass --force to register anyway."

[devswarm_cli.regprim_builder_env]
doc = "The variable that names a child's own builder id; register-primary falls back to it for the session."
value = "DEVSWARM_BUILDER_ID"

[devswarm_cli.regprim_child_env]
doc = "The variable DevSwarm sets only on a child workspace."
value = "DEVSWARM_SOURCE_BRANCH"
