# ah-engine shipped defaults for the DevSwarm gate checks (devswarm-child-gate, devswarm-parent-reply-tracker,
# devswarm-child-drain). Format: see the header of engine.toml. The checks decide natively what the Node hooks decide (the role and
# switch gates, the child's own mailbox through the mesh store, the stop budgets, the reply records); what they cannot read exactly
# defers to the Node hook before anything is written (D11, D45).

[devswarm_gates.child_gate_summary]
doc = "One-line description of the devswarm-child-gate check in the generated reference."
value = "DevSwarm child Stop gate: makes a child workspace report to its parent (a heartbeat summary) and drain its parent mail before it stops, within a per-kind block budget; an archived workspace and the shapes it cannot read exactly defer to the Node gate."

[devswarm_gates.reply_tracker_summary]
doc = "One-line description of the devswarm-parent-reply-tracker check in the generated reference."
value = "DevSwarm Primary reply tracker: records a direct `devswarm send` (or a send receipt of this turn) as the Primary's reply to that child, so the Stop gate stops counting the child's question as unanswered; silent for every other Bash call."

[devswarm_gates.child_drain_summary]
doc = "One-line description of the devswarm-child-drain check in the generated reference."
value = "DevSwarm child mailbox drain nudge: after a Bash call of a child workspace's main thread, tells the child how many parent messages it has not read (its durable inbox plus the mesh store) and how to drain them, throttled while the count is unchanged."

[devswarm_gates.child_gate_setting]
doc = "Where the devswarm-child-gate on/off switch is read from (devswarm.childGate, default on; no environment variable)."
value = { section = "devswarm", key = "childGate", env = "", aliases = [], option = "devswarm_child_gate", default = true }

[devswarm_gates.reply_tracker_setting]
doc = "Where the devswarm-parent-reply-tracker on/off switch is read from (devswarm.parentReplyTracker, default on; no environment variable)."
value = { section = "devswarm", key = "parentReplyTracker", env = "", aliases = [], option = "devswarm_parent_reply_tracker", default = true }

[devswarm_gates.child_drain_setting]
doc = "Where the devswarm-child-drain on/off switch is read from (devswarm.childDrain, default on; no environment variable)."
value = { section = "devswarm", key = "childDrain", env = "", aliases = [], option = "devswarm_child_drain", default = true }

[devswarm_gates.supervisor_mode]
doc = "Where the DevSwarm supervisor mode (auto, on, off) is read from (devswarm.supervisorMode; headline plugin option)."
value = { section = "devswarm", key = "supervisorMode", env = "ANTIHALL_DEVSWARM_SUPERVISOR", option = "devswarm_supervisor_mode", default = "auto", values = ["auto", "on", "off"] }

[devswarm_gates.child_gate_guard_name]
doc = "The guard id the devswarm-child-gate check answers to in skip.json."
value = "devswarm-child-gate"

[devswarm_gates.kill_env]
doc = "Environment variable that, set to exactly `1`, turns the DevSwarm integration off for the process."
value = "DISABLE_ANTIHALL_DEVSWARM"

[devswarm_gates.kill_env_value]
doc = "The value of the kill variable that turns the integration off."
value = "1"

[devswarm_gates.repo_id_env]
doc = "Environment variable DevSwarm sets on a workspace's processes; non-empty means the supervisor is in play in auto mode."
value = "DEVSWARM_REPO_ID"

[devswarm_gates.source_branch_env]
doc = "Environment variable DevSwarm sets only on a child workspace; non-empty means this session is a child."
value = "DEVSWARM_SOURCE_BRANCH"

[devswarm_gates.mode_on]
doc = "Supervisor mode value that forces the integration on."
value = "on"

[devswarm_gates.mode_off]
doc = "Supervisor mode value that forces the integration off."
value = "off"

[devswarm_gates.send_words]
doc = "Words that must both appear (ASCII case-insensitive, at word boundaries, in any order) in a Bash command for it to plausibly be a devswarm send; `devswarm` also matches before `.js`."
value = ["devswarm", "send"]

[devswarm_gates.bash_tool]
doc = "The tool name the reply tracker and the drain nudge observe."
value = "Bash"

[devswarm_gates.readside_builder_env]
doc = "Environment variable that holds a child workspace's own id (the name of its descriptor file)."
value = "DEVSWARM_BUILDER_ID"

[devswarm_gates.readside_id_extra]
doc = "Characters besides ASCII letters and digits that a workspace id may contain (an id with `..` is never safe)."
value = "._-"

[devswarm_gates.readside_descriptor_dir]
doc = "Directory of the workspace descriptors, relative to the home directory."
value = ".anti-hall/devswarm/workspaces"

[devswarm_gates.readside_descriptor_ext]
doc = "File extension of a workspace descriptor."
value = ".json"

[devswarm_gates.readside_inbox_field]
doc = "Descriptor field naming the workspace's durable inbox file; without it the drain nudge has nothing to count and stays silent."
value = "inboxPath"

[devswarm_gates.readside_tool_field]
doc = "Hook payload field that names the tool of a PostToolUse call."
value = "tool_name"

[devswarm_gates.readside_input_field]
doc = "Hook payload field that holds the tool's input."
value = "tool_input"

[devswarm_gates.readside_command_field]
doc = "Field of the tool input that holds the Bash command."
value = "command"

[devswarm_gates.readside_subagent_fields]
doc = "Payload fields the host stamps only on a subagent's own calls; either one present and not null marks the call as a subagent's, which the drain nudge never addresses."
value = ["agent_id", "agent_type"]

[devswarm_gates.readside_read_primary_re]
doc = "JavaScript regex source (case-insensitive) for a Bash command that reads the Primary-originated channel (`inbox ... read-primary`); the drain nudge skips that one call so it does not contradict the read's own follow-up instruction."
value = '\binbox\s+(?:-\S+(?:\s+[^-\s]\S*)?\s+)*read-primary\b'

[devswarm_gates.readside_stop_field]
doc = "Stop payload field that is exactly `true` when the model is already continuing because of an earlier Stop block; the Primary Stop gate then allows without reading anything."
value = "stop_hook_active"

[devswarm_gates.cg_hook]
doc = "The hook name of the child Stop gate in the shared stop-policy budgets (`<session>|<hook>|<kind>`)."
value = "child-gate"

[devswarm_gates.cg_policy_dir]
doc = "Directory of the shared stop-policy budget files, under the DevSwarm state directory."
value = "stop-policy"

[devswarm_gates.cg_state_dir]
doc = "Directory of the child gate's own per-session state files (block and check times, the one-shot notice flags), under the DevSwarm state directory."
value = "child-gate"

[devswarm_gates.cg_unknown_session]
doc = "The session key of a Stop payload with neither a session id nor a transcript path."
value = "unknown"

[devswarm_gates.cg_session_hash_len]
doc = "Hex characters of the SHA-1 of the transcript path that key a session without a session id."
value = 16

[devswarm_gates.cg_max_blocks]
doc = "Intentional per-stable-kind, per-session budget before the child gate yields (MAX_BLOCKS), rather than an owner-turn cap: a kind re-opens only when its condition is observed cleared. New owner turns alone must not re-arm an unresolved mailbox or heartbeat condition."
value = 2

[devswarm_gates.cg_reset_ms]
doc = "The first Stop check's report window (RESET_MS): a report older than this before the session's first check does not satisfy it."
value = 300000

[devswarm_gates.cg_tick_fresh_ms]
doc = "How recent a zero-unread `inbox tick` marker must be to count as liveness proof for this Stop (TICK_MARKER_FRESH_MS)."
value = 120000

[devswarm_gates.cg_kind_cron]
doc = "The stop-policy kind of the mailbox-cron-missing block."
value = "cron-missing"

[devswarm_gates.cg_kind_report]
doc = "The stop-policy kind of the heartbeat report the child owes."
value = "heartbeat-report"

[devswarm_gates.cg_kind_inbox]
doc = "The stop-policy kind of known unread parent mail."
value = "inbox"

[devswarm_gates.cg_kind_unknown]
doc = "The stop-policy kind of an unread count the gate cannot prove empty."
value = "inbox-unknown"

[devswarm_gates.cg_repos_dir]
doc = "The DevSwarm worktree layout under the home directory: a session cwd under it corroborates the child role (only Node knows its own working directory, so the engine defers when it exists)."
value = ".devswarm/repos"

[devswarm_gates.cg_heartbeats_dir]
doc = "Directory of the workspace heartbeat files, under the DevSwarm state directory (the session-age proxy of the cron check)."
value = "heartbeats"

[devswarm_gates.cg_attempts_dir]
doc = "Directory of the dropped-summary attempt records, under the DevSwarm state directory (per project key: a directory of per-writer files, or the legacy flat file)."
value = "summary-attempts"

[devswarm_gates.cg_attempts_ext]
doc = "File extension of a drop-attempt record file."
value = ".ndjson"

[devswarm_gates.cg_nonce_prefix_len]
doc = "Characters of a reader nonce shown in the attempt-mismatch notice."
value = 12

[devswarm_gates.cg_cron_metric_file]
doc = "The report-only counter of shown mailbox-cron-missing warnings, under the DevSwarm state directory (one `{ts}` line each)."
value = "cron-missing-warned.jsonl"

[devswarm_gates.cg_cron_metric_cap]
doc = "Newest lines the cron-missing counter keeps."
value = 500

[devswarm_gates.cg_strict_setting]
doc = "The setting devswarm.childGateStrict (on by default): when the durable inbox shows nothing, the gate also asks the native queue (`hivecontrol workspace message-count`). The engine answers only while it is unset."
value = { section = "devswarm", key = "childGateStrict", env = "ANTIHALL_DEVSWARM_CHILD_GATE_STRICT", option = "", default = true }

[devswarm_gates.cg_path_env]
doc = "The environment variable the native probe program is looked up in."
value = "PATH"

[devswarm_gates.cg_probe_program]
doc = "The native message-count probe program (bare name, also listed in script.exec_programs)."
value = "hivecontrol"

[devswarm_gates.cg_probe_args]
doc = "Arguments of the non-destructive native message-count probe."
value = ["workspace", "message-count"]

[devswarm_gates.cg_probe_timeout_ms]
doc = "Time limit of the native probe; a probe that runs past it is unknown in Node, so the engine defers."
value = 5000

[devswarm_gates.cg_probe_count_re]
doc = "JavaScript regex source of the count in the probe output (the first match is parsed as a base-10 integer)."
value = "-?\\d+"

[devswarm_gates.cg_headline]
doc = "Headline of the child gate block."
value = "workspace reporting or inbox duties are unfinished."

[devswarm_gates.cg_why]
doc = "Why line of the child gate block."
value = "Your parent orchestrator relies on your heartbeat and a drained inbox."

[devswarm_gates.cg_wake_tick]
doc = "The tick command of the child's mailbox-wake re-verify line: {id}."
value = "`\"$CLI\" inbox tick {id} --child --quiet`"

[devswarm_gates.cg_cron_missing_tick]
doc = "The mailbox-cron-missing text when the last tick marker is too old: {m} (its age in whole minutes); the wake re-verify line follows."
value = "Mailbox cron missing: no inbox tick for {m}m — run `CronList`; if no tick cron exists, `CronCreate` it with the tick prompt (see SessionStart directive)."

[devswarm_gates.cg_cron_missing_hb]
doc = "The mailbox-cron-missing text when no tick marker exists and the heartbeat is old: {m} (heartbeat age in whole minutes); the wake re-verify line follows."
value = "Mailbox cron missing: no inbox tick this session (heartbeat is {m}m old) — run `CronList`; if no tick cron exists, `CronCreate` it with the tick prompt (see SessionStart directive)."

[devswarm_gates.cg_drop_labels]
doc = "Whitelisted label of each known drop reason of a refused heartbeat summary (any other reason is never echoed)."
value = { "unresolvable-caller-identity" = "your caller identity could not be resolved", "caller-not-registered" = "your workspace is not yet registered with the parent", "ownership-mismatch" = "the heartbeat was not recognized as coming from this workspace" }

[devswarm_gates.cg_drop_remedies]
doc = "Remedy of each known drop reason; the id placeholder (devswarm_role.id_placeholder) is replaced by the workspace id."
value = { "unresolvable-caller-identity" = "run `inbox pull <DEVSWARM_BUILDER_ID>` to establish your identity with the parent, then re-run the heartbeat", "caller-not-registered" = "run `inbox pull <DEVSWARM_BUILDER_ID>` to register with the parent, then re-run the heartbeat", "ownership-mismatch" = "run the heartbeat from the workspace root (cwd was not recognized as this workspace)" }

[devswarm_gates.cg_drop_known]
doc = "The drop description of a known reason: {label}, {remedy}."
value = "your last heartbeat summary was DROPPED — {label}. {remedy}"

[devswarm_gates.cg_drop_unknown]
doc = "The drop description of a reason the gate does not recognize."
value = "your last heartbeat summary was dropped (reason not recognized)"

[devswarm_gates.cg_heartbeat_drop]
doc = "The outbound line after a dropped report: {drop}."
value = "Heartbeat: {drop}, THEN stop."

[devswarm_gates.cg_heartbeat]
doc = "The outbound line that asks for a heartbeat report: {cli}, {id}."
value = "Heartbeat: before you stop, emit a heartbeat / self-report to your parent orchestrator so you do not silently drop off its radar and later read as stale. Run `{cli} heartbeat {id} --summary \"<status>\"` with a one-line status (e.g. \"done — awaiting next task\", \"blocked on X\", or \"idle — reassign or archive me\"), THEN stop. This keeps the parent's task list honest instead of leaving you unnoticed."

[devswarm_gates.cg_inbox_pending]
doc = "The inbound line for known unread parent mail: {cli}, {id}."
value = "Inbox: you have unpulled/unread parent message(s): run `{cli} inbox pull {id}` (or `inbox read` if already pulled), then `inbox ack` once addressed — BEFORE you stop. "

[devswarm_gates.cg_inbox_native_only]
doc = "The one-time inbound line when only the native probe is unknown and the report is satisfied: {cli}, {id}."
value = "Inbox: the native `hivecontrol workspace message-count` probe failed or timed out, so this gate cannot prove your native queue is empty (your mesh inbox and report are fine). Try `{cli} inbox pull {id}` once and handle any mail; if it fails the same way the native channel is unreachable from here, so you may stop — this warning will not repeat."

[devswarm_gates.cg_inbox_native_unknown]
doc = "The inbound line when the native probe is unknown: {cli}, {id}."
value = "Inbox: your NATIVE unread count is UNKNOWN (the `hivecontrol workspace message-count` probe failed or timed out), so this gate cannot prove your native queue is empty. Run `{cli} inbox pull {id}` and handle any mail BEFORE you stop. "

[devswarm_gates.cg_inbox_durable_unknown]
doc = "The inbound line when the child's own durable unread count is unknown (its store could not be read): {cli}, {id}, {reason}."
value = "Inbox: your unread count is UNKNOWN ({reason}): the store could not be read, so this gate cannot prove your inbox is empty. Run `{cli} inbox count {id}` and read any mail BEFORE you stop. "

[devswarm_gates.cg_unknown_reason_default]
doc = "The reason named in that line when the host cannot say why the store could not be read."
value = "store-read-error"

[devswarm_gates.cg_err_mismatch]
doc = "The once-per-session stderr notice of an own-id drop-attempt record that authenticates against neither the nonce nor the session: {sid}, {row}, {own} (JSON texts)."
value = "⚠️ workspace check: the saved attempt is unauthenticated.\nDo instead: report from this workspace again.\n"

[devswarm_gates.cg_err_cap]
doc = "The once-per-episode stderr notice that the block budget is spent: {max}, {sid} (JSON text)."
value = "⚠️ workspace check: the stop reminder limit was reached.\nDo instead: send a fresh heartbeat before stopping.\n"

[devswarm_gates.cd_state_dir]
doc = "Directory of the drain nudge's per-workspace throttle state (last count, last shown time), under the DevSwarm state directory."
value = "child-drain"

[devswarm_gates.cd_throttle_ms]
doc = "How long an unchanged unread count stays quiet after the drain nudge showed it (THROTTLE_MS); a changed count is shown at once."
value = 600000

[devswarm_gates.cd_message_unknown]
doc = "The drain nudge when the child's unread count could not be read (a project or message store the engine cannot read exactly): {cli} (the DevSwarm CLI path), {id} (the workspace id). Shown instead of silence, throttled like the counted nudge."
value = "⚠️ inbox check: the unread count is unknown.\nDo instead: read and address your mesh inbox."

[devswarm_gates.cd_unknown_count]
doc = "The count the drain nudge's throttle state records for an unreadable mailbox (below zero, so it never equals a real count and the nudge repeats only after devswarm_gates.cd_throttle_ms)."
value = -1

[devswarm_gates.cd_unknown_age]
doc = "The age text of a backlog whose oldest message has no usable time."
value = "unknown age"

[devswarm_gates.cd_minutes_suffix]
doc = "Suffix of the oldest-message age in whole minutes."
value = "m"

[devswarm_gates.cd_event]
doc = "The hook event name the drain nudge answers in."
value = "PostToolUse"

[devswarm_gates.cd_message]
doc = "The drain nudge: {n} (unread count), {age}, {cli} (the DevSwarm CLI path), {id} (the workspace id)."
value = "⚠️ inbox check: {n} unread messages need attention.\nDo instead: read and address your mesh inbox."

[devswarm_gates.rt_send_action]
doc = "The `action` of a send line in the DevSwarm CLI output and of a send receipt."
value = "send"

[devswarm_gates.rt_direct_type]
doc = "The `type` of a direct send, the only kind that is recorded as a reply."
value = "direct"

[devswarm_gates.rt_receipts_dir]
doc = "Directory of the per-day send receipts (`<YYYY-MM-DD>/*.json`), under the DevSwarm state directory."
value = "send-receipts"

[devswarm_gates.rt_day_ms]
doc = "Length of a day: the receipt sweep reads today's and yesterday's receipt directory (UTC days of the turn's time)."
value = 86400000

[devswarm_gates.rt_clock_skew_ms]
doc = "How far in the future a receipt file may be dated and still count (clock skew tolerance)."
value = 60000

[devswarm_gates.rt_window_setting]
doc = "The setting devswarm.receiptWindowMs: how recent a send receipt must be to credit a reply this turn. The engine answers only while it is unset."
value = { section = "devswarm", key = "receiptWindowMs", env = "ANTIHALL_DEVSWARM_RECEIPT_WINDOW_MS", option = "", default = 300000 }

[devswarm_gates.rt_state_dir]
doc = "Directory of the reply records, under the DevSwarm state directory."
value = "parent-gate"

[devswarm_gates.rt_replies_suffix]
doc = "Suffix of a project's reply record file after its sanitized project key."
value = "-replies.json"

[devswarm_gates.rt_record_cap]
doc = "Largest appended reply record in bytes (the separating newline included); a larger one is skipped so the append stays one atomic write."
value = 480

[devswarm_gates.cg_kind_archived]
doc = "The stop-policy kind of the archived-workspace block (its own budget, never shared with the heartbeat-report or inbox kinds)."
value = "archived-stop"

[devswarm_gates.cg_archived_cap]
doc = "How many times an archived workspace's Stop is blocked (once, then it may stop freely)."
value = 1

[devswarm_gates.cg_archived_block]
doc = "The reason an archived workspace's Stop is blocked ({ask} is the handover request, {path} the canonical handover path)."
value = "Archived: this workspace was archived. {ask}, THEN stop — this workspace is no longer tracked and you will not be asked again. Delete your own `inbox tick` cron (CronList, CronDelete); the mailbox watcher is already silent."

[devswarm_gates.cg_archived_ask]
doc = "The handover request in the archived block ({path} is the canonical handover path)."
value = "Save a handover (`/anti-hall:handover`) to `{path}` (never a flat file) if you have not already"

[devswarm_gates.cg_archived_path_fallback]
doc = "The handover path named when the canonical one cannot be worked out."
value = ".anti-hall/handovers/<YYYY-MM-DD>/<session_id>/HANDOVER.md"

[devswarm_gates.cg_short_instead]
doc = "Compact guard message text."
value = "complete the pending workspace duty."
