# ---- Transcript protection (GH #802): no agent writes a session transcript ----
# Every guard that trusts "the latest human prompt" reads the session transcript. An agent that can append a forged
# human-looking entry to its own transcript (`printf '{"type":"user","origin":{"kind":"human"}...}' >> <transcript>`, `tee -a`, `cp`,
# `sed -i`, an Edit/Write of the .jsonl) fools all of them, including the owner-approval pass (guards.ownerApprovalPass). The harness is
# the only writer of a transcript. command-guard blocks a Bash write to a protected path, in or out of the session project, for every
# agent and even when the command is otherwise allowed; edit-guard blocks Edit/Write/MultiEdit/NotebookEdit/apply_patch to one. Reading
# stays allowed (cat, grep, jq, anti-hall's own verbs). Memory notes (`~/.claude/projects/*/memory/*.md`) are not transcripts: not matched.

[transcript_protect.sw]
doc = "Transcript protection. Switch guards.transcriptProtect (default ON: it only stops agent writes to session transcripts; nothing legitimate writes them from a tool call). On: command-guard and edit-guard block a write to a path of transcript_protect.globs (or the payload's own transcript_path), for every agent. Off: every answer is unchanged and nothing is counted."
value = { section = "guards", key = "transcriptProtect", type = "boolean", env = "ANTIHALL_TRANSCRIPT_PROTECT", option = "", default = true }

[transcript_protect.globs]
doc = "Protected paths (`~` is the home directory; `*` is one path part, `**` any depth). Session transcripts and the tool results saved beside them. The payload's own transcript_path is always protected too. A memory note (`.md`) is not matched."
value = ["~/.claude/projects/**/*.jsonl", "~/.claude/projects/**/tool-results/**", "~/.codex/sessions/**"]

[transcript_protect.case_insensitive]
doc = "Match protected paths without regard to case (macOS and Windows volumes ignore it, so `.Claude/Projects` is the same folder)."
value = true

[transcript_protect.anchors]
doc = "Text that marks a Bash write whose target the parser cannot name (`truncate`, `perl -i`, `find -delete`, a `$(...)` path) as a write to a protected folder: the write is blocked when its command part holds one of these. Plain text, not a pattern."
value = [".claude/projects", ".codex/sessions"]

[transcript_protect.hints]
doc = "Text (case-insensitive) a Bash command must hold for the write parse to run: anything that can name a protected path holds one of these (a home-folder spelling, a transcript file name, the word `transcript`). A command with none is not parsed, so a long commit message or script costs nothing. A command that builds the path from pieces (a glob like `.cl*`, a concatenation) is not caught: this guard stops the plain forms, it is not a sandbox."
value = [".claude", ".codex", ".jsonl", "transcript"]

[transcript_protect.destructive_re]
doc = "Pattern (case-insensitive) for a command part that removes or moves what it names; for such a part a target that is a PARENT of a protected folder (`rm -r ~/.claude/projects`) is blocked too, since it takes the transcripts with it."
value = '(?:^|[\s;&|(])(?:rm|mv|unlink|rmdir|trash)(?:\s|$)'

[transcript_protect.link_re]
doc = "Pattern (case-insensitive) for a command part that makes a link (`ln`): a link whose source is a protected path is blocked, because a later write through the link would reach the transcript (the link does not exist yet when the command is judged)."
value = '(?:^|[\s;&|(])ln(?:\s|$)'

[transcript_protect.token_re]
doc = "Pattern that cuts a command into path-like words, for the inline-code check (a path inside a `python -c` or heredoc script)."
value = '''[^\s'"`;|&()<>=,]+'''

[transcript_protect.inline_write_res]
doc = "Patterns (case-insensitive) that say inline code (python, node, perl, ruby, php, a heredoc, awk) WRITES, found in the whole command. Each capture group is the write call's OWN target argument(s): the first argument of a write-mode open or writeFile, the destination of shutil.copy or copyFileSync, every argument of a rename/remove/move, the string an awk `>`/`>>` names. The command is blocked only when a captured argument is a protected path, spelled out or through a variable the command assigns (`T='<transcript>'; open(T,'a')`); reading a transcript and writing elsewhere (`shutil.copy(T,'/tmp/c')`, `open(T).read()` then `open('/tmp/o','w')`) is allowed. A pattern with no capture group falls back to: the command names a protected path anywhere. A plain read (`open(p).read()`, `sys.stdout.write`) matches none."
value = [
  '''\bopen\s*\(\s*([^,)]+?)\s*,\s*(?:mode\s*=\s*)?['"][^'"]*[wax+]''',
  '\b(?:writeFile|appendFile|writeFileSync|appendFileSync|createWriteStream|truncateSync|unlinkSync|rmSync)\s*\(\s*([^,)]+)',
  '\b(?:fs|fsp|promises|fsPromises)\.(?:rm|unlink|truncate)\s*\(\s*([^,)]+)',
  '\b(?:renameSync|rename)\s*\(\s*([^)]*)',
  '\b(?:copyFileSync|copyFile|cpSync)\s*\(\s*[^,)]+,\s*([^,)]+)',
  '\bos\.(?:replace|remove|unlink|truncate|system)\s*\(\s*([^)]*)',
  '\bshutil\.copy\w*\s*\(\s*[^,)]+,\s*([^,)]+)',
  '\bshutil\.(?:move|rmtree)\s*\(\s*([^)]*)',
  '''\bPath\(\s*([^)]*)\)\s*\.\s*(?:write_text|write_bytes|unlink|rename|replace|touch|open\([^)]*['"][wax+])''',
  '\bFile\.(?:write|binwrite|delete|rename|unlink)\s*\(\s*([^)]*)',
  '''\bFile\.open\s*\(\s*([^,)]+)\s*,\s*['"][wax+]''',
  '\bfile_put_contents\s*\(\s*([^,)]+)',
  '''\bfopen\s*\(\s*([^,)]+)\s*,\s*['"][wax+]''',
  '\bFileUtils\.\w+\s*\(\s*([^)]*)',
  '''\bg?awk\b[^|]*?>>?\s*\(?\s*"([^"]*)"''',
  '\bg?awk\b[^\n;|]*\s-i\s*inplace\b([^\n;|]*)',
]

[transcript_protect.inline_interp_res]
doc = "Patterns (case-insensitive): a command that runs an inline interpreter script (`python3 -c`, `node -e`, `perl -e`, `ruby -e`, a heredoc fed to one, ...) holds an interpreter command word. For such a command the check FAILS CLOSED (transcript_protect.inline_write_marks, inline_calls, inline_receiver_re): when it names a protected path and can write, it is blocked unless every write call provably targets a non-protected path."
value = ['(?:^|[\s;&|(/])(?:python[\d.]*|pypy[\d.]*|node|nodejs|deno|bun|ruby|perl[\d.]*|php|lua|osascript|pwsh|powershell|Rscript|julia|tclsh|groovy|jshell)(?:\s|$)']

[transcript_protect.inline_write_marks]
doc = "Text (case-insensitive) that says an inline script CAN write: with none of these the script only reads and the fail-closed check lets it through. A protected path named in a script that holds one of these is blocked unless every write call in it has a provably non-protected literal target."
value = ["open(", "'a'", "'w'", "\">>\"", "\">\"", "'>>'", "'>'", ".write", "writefile", "appendfile", "openSync", "os.open", "O_APPEND", "O_WRONLY", "O_RDWR", "O_CREAT", "shutil.", "copy", "move", "rename", "print $", "fs.", "unlink", "remove", "rmtree", "truncate", "symlink", "link(", "system", "popen", "subprocess", "spawn", "exec", "touch", "fopen", "file_put_contents", "Bun.write"]

[transcript_protect.inline_receiver_re]
doc = "Pattern (case-insensitive): a write whose target is the RECEIVER, not an argument (`Path(..).write_text(..)`, `Path(..).expanduser().open('a')`, `p.unlink()`), so no call argument can be checked. In a script that names a protected path (and is an inline interpreter command) any of these blocks."
value = '''\.\s*(?:write_text|write_bytes|touch|unlink|rename|symlink_to|hardlink_to|truncate|chmod)\s*\(|\.\s*open\s*\(\s*(?:mode\s*=\s*)?['"][rwxabt+U]{1,4}['"]'''

[transcript_protect.inline_readonly_mode_re]
doc = "Pattern (case-insensitive) for an open call's mode (or flags) argument that only READS (`'r'`, `'rb'`, perl `'<'`, `os.O_RDONLY`). Any other mode, or one the script computes, is a write."
value = '''^(?:['"]\s*(?:r[bt]?|[bt]r|U|<[^'"+>]*)\s*['"]|(?:[\w.]+\.)?O_RDONLY)$'''

[transcript_protect.inline_handle_re]
doc = "Pattern for the mode argument of perl's 3-argument open (`open(my $f, '>>', $path)`), where the first argument is a file handle and the path is the third."
value = '''^\s*['"]\s*\+?[<>]{1,2}'''

[transcript_protect.literal_re]
doc = "Pattern for a plain string literal argument: no interpolation, no f/r/b prefix, no variable or template marker. Group 2 is its text. Only such a literal (an absolute path, or `~/...`) that is not a protected path proves a write goes elsewhere."
value = '''^\s*(['"])([^'"\\$`{}%]*)\1\s*$'''

[transcript_protect.inline_calls]
doc = "Write calls the fail-closed inline check examines (found in the whole script, argument list read with matched parentheses). `args` says which arguments are the call's targets, and each must be a plain literal non-protected absolute path (or a variable only ever assigned one): open = the first argument of an open call whose mode is not read-only (perl 3-argument form: the third); first = the first argument; last = the last (the destination of a copy or link); two = the first two (a rename or move); shell = a command string run by a shell, judged as a Bash command when it names a protected folder."
value = [
  { args = "open", re = '\b(?:open|openSync|sysopen|fopen)\s*\(' },
  { args = "first", re = '\b(?:writeFile|appendFile|writeFileSync|appendFileSync|createWriteStream|truncate|truncateSync|unlink|unlinkSync|rmSync|rmdirSync|writeTextFile|writeTextFileSync|outputFile|file_put_contents)\s*\(|\b(?:fs|fsp|promises|fsPromises)\.(?:rm|rmdir)\s*\(|\bos\.(?:remove|rmdir|removedirs)\s*\(|\bshutil\.rmtree\s*\(|\bBun\.write\s*\(|\bFile\.(?:write|binwrite|delete|unlink)\s*\(|\bFileUtils\.(?:rm\w*|remove\w*)\s*\(' },
  { args = "last", re = '\b(?:copyFile|copyFileSync|cpSync)\s*\(|\b(?:shutil|fs|fsp|promises|fsPromises|os|FileUtils|File)\.(?:copy\w*|cp\w*|symlink\w*|link\w*|ln\w*|install)\s*\(' },
  { args = "two", re = '\b(?:rename|renameSync)\s*\(|\bos\.(?:rename|renames|replace)\s*\(|\bshutil\.move\s*\(|\bFile\.rename\s*\(|\bFileUtils\.(?:mv|move)\s*\(' },
  { args = "shell", re = '\b(?:os\.(?:system|popen)|popen|system|execSync|execFileSync|spawnSync|spawn|subprocess\.\w+|child_process\.\w+|Popen|check_output|check_call)\s*\(' },
]

[transcript_protect.walk_max_entries]
doc = "Most directory entries the folder check reads when it asks whether a folder holds a protected file at any depth (a remove or move of a project folder, or of the projects folder, takes its transcripts along). Past the limit the folder counts as holding one."
value = 5000

[transcript_protect.walk_max_depth]
doc = "Deepest folder level that walk descends; a deeper folder counts as holding a protected file."
value = 6

[transcript_protect.indirect_arg_re]
doc = "Pattern (case-insensitive): a write call's target argument (or the value of a variable it names) that reads its path at run time (`sys.argv[1]`, `os.environ[...]`, `process.argv`, `$VAR`, stdin) cannot be tied to a path in the command, so the check falls back to: the command names a protected path anywhere. A bare variable the command never assigns falls back the same way."
value = '''\bargv\b|\benviron\b|\bgetenv\b|\bprocess\.env\b|\bARGV\b|\bENV\b|\$\w|\bstdin\b|\binput\s*\('''

[transcript_protect.copy_verbs]
doc = "Commands that copy or move their sources INTO the last argument: when that is a directory (a trailing `/`, `.`, or an existing folder) each source lands there under its own name, so `cp /tmp/s1.jsonl <project folder>/` writes a transcript. The write is tested as `<folder>/<source name>`; a recursive copy (a recursive option, or a source that is a folder's contents: `dir/`, `dir/.`) is blocked when a file could land there as the transcript_protect.probe_name. Being inside a protected folder alone never blocks (a memory `.md` copy stays allowed)."
value = ["cp", "mv", "rsync", "ditto", "install"]

[transcript_protect.recursive_opt_res]
doc = "Patterns for an option word that makes a copy recursive (`-r`, `-R`, `-a`, `-avz`, `--recursive`, `--archive`)."
value = ['^-[A-Za-z]*[rRa][A-Za-z]*$', '^--(?:recursive|archive)$']

[transcript_protect.extract_res]
doc = "Patterns (case-sensitive) on a command word plus its arguments that EXTRACT an archive into a folder named by the command (`tar -x -C <dir>`, `tar xzf a.tgz -C <dir>`, `unzip -d <dir>`): the contents are unknown, so the write is blocked when a file could land in the folder as the transcript_protect.probe_name."
value = ['^tar\b.*(?:\s-[A-Za-z]*x|\s--(?:extract|get)\b)', '^tar\s+[A-Za-z]*x', '^unzip\b']

[transcript_protect.probe_name]
doc = "File name used to ask whether an unknown file could land in a folder as a protected path (`<folder>/<this>` against transcript_protect.globs): a recursive copy or an extraction into a protected folder."
value = "probe.jsonl"

[transcript_protect.kinds]
doc = "Counter label `kind` values: bash_write (a named Bash write target), bash_remove (a remove/move of a parent folder), bash_unnamed (a write whose target the parser cannot name, in a part that names a protected folder), bash_inline (inline code that writes a named protected path), edit (an Edit/Write/MultiEdit/NotebookEdit/apply_patch target)."
value = { write = "bash_write", remove = "bash_remove", unnamed = "bash_unnamed", inline = "bash_inline", edit = "edit" }

[transcript_protect.msg_what]
doc = "The one-line block text, for a Bash command and for an edit."
value = "that write to a session transcript was stopped: transcripts are append-only for the harness, never the agent."

[metric.transcript_write_blocked]
doc = "Writes to a protected transcript path stopped (guards.transcriptProtect on), by kind: bash_write, bash_remove, bash_unnamed, bash_inline (command-guard), edit (edit-guard)."
value = { kind = "counter", unit = "blocks", labels = ["kind"] }
