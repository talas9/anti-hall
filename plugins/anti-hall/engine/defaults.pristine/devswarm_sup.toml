value = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const R=require(process.argv[1]+"/companion/lib/recovery.js");const L=require(process.argv[1]+"/companion/lib/liveness.js");const h=process.argv[2];const d=S.readDescriptors(h).find((x)=>x.id===process.argv[3]);let v={};try{v=JSON.parse(require("fs").readFileSync(L.livenessPathFor(process.argv[3],h),"utf8"))}catch(e){}if(d)R.notifyParentEscalation(d,v,{home:h});console.log(JSON.stringify({notified:!!d}))'

