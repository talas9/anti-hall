# ah-engine shipped defaults for the DevSwarm supervisor duties (lane l7, `src/dssup`): everything the Node liveness supervisor
# (companion/devswarm-supervisor.js, run by launchd / systemd / cron every 60-120 s) does besides auto-archive, so the engine's
# scheduler can take them over and the Node job can be switched off as a whole. Format: see the header of engine.toml. Every key
# can be overridden in the `devswarm_sup` section of settings.json. Nothing here is compiled into the binary.
#
# THE SWITCH: `devswarm_sup.mode`. `witness` (the default) leaves every duty to the Node supervisor and the engine runs none of
# them. `engine` makes the engine's scheduler job `devswarm_supervisor` run the duties below, takes poke and escalate (their
# executors default to `auto`, which follows this mode), and refuses to act while the Node supervisor is still running (the
# double-run guard). The go-live steps are in docs/AH-ENGINE.md, "DevSwarm supervisor cutover".

[devswarm_sup.mode]
doc = "Who owns the supervisor duties: witness (the Node supervisor job does; the engine runs none of them) | engine (the engine's scheduler runs them, poke and escalate follow). Anything else reads as witness, so a typo never starts a second actor. The engine never edits any settings file or any launchd / systemd unit."
value = "witness"

[devswarm_sup.mode_words]
doc = "The words of devswarm_sup.mode, in the order witness, engine."
value = ["witness", "engine"]

[devswarm_sup.tick_ms]
doc = "How often the scheduler job `devswarm_supervisor` runs while the mode is `engine` (Node's installer sweeps every 60-120 s). The job does nothing where DevSwarm is absent or the mode is witness."
value = 60000
min = 10000
max = 3600000
unit = "ms"

[devswarm_sup.tick_budget_ms]
doc = "Most time one tick spends starting duties; a duty not yet started when it is spent waits for the next tick. Each duty is also bounded by its own timeout_ms."
value = 900000
min = 1000
max = 3600000
unit = "ms"

# ---- the double-run guard --------------------------------------------------------------------------------------------------

[devswarm_sup.guard_ms]
doc = "The Node supervisor counts as running when its log (or the rotated copy) was written within this long. While it runs, the engine's supervisor duties AND the engine's poke / escalate stand down, so two actors never run one duty. Node writes one line per sweep and sweeps at least every 120 s."
value = 360000
min = 60000
max = 86400000
unit = "ms"

[devswarm_sup.node_log]
doc = "The Node supervisor's log, relative to the home directory (the launchd / systemd / cron job writes its sweep line there)."
value = ".anti-hall/devswarm-supervisor.log"

[devswarm_sup.log_backup_suffix]
doc = "The suffix of the one rotated generation of a log."
value = ".1"

[devswarm_sup.reason_no_log]
doc = "The rotation answer when the log does not exist yet (Node's words, so the two reports read alike)."
value = "no log file yet"

[devswarm_sup.reason_under]
doc = "The rotation answer when the log is not over the threshold."
value = "under threshold"

[devswarm_sup.reason_rotated]
doc = "The rotation answer after a rotation. {backup} is the rotated file."
value = "rotated to {backup}"

[devswarm_sup.reason_rotate_failed]
doc = "The rotation answer when the rename failed. {err}."
value = "rotation failed: {err}"

[devswarm_sup.engine_log]
doc = "The engine's own record of its ticks (one JSON line each), relative to the home directory. Kept apart from the Node log so the engine never trips its own guard."
value = ".anti-hall/logs/devswarm-supervisor-engine.ndjson"

[devswarm_sup.lock_file]
doc = "The single-flight sweep lock, relative to the DevSwarm state directory: the Node supervisor's own file, taken the same way (a dead holder or one older than lock_stale_ms is taken over), so while a tick runs a Node sweep exits at once."
value = "locks/sweep.lock"

[devswarm_sup.lock_stale_ms]
doc = "A sweep lock older than this is taken over (Node: SWEEP_LOCK_STALE_MS)."
value = 300000
min = 1000
max = 86400000
unit = "ms"

# ---- settings Node reads for these duties (same keys, tiers and defaults) --------------------------------------------------

[devswarm_sup.set_log_rotate_bytes]
doc = "Size above which the supervisor log is rotated to its .1 copy. Node: devswarm.supervisorLogRotateBytes."
value = { type = "number", section = "devswarm", key = "supervisorLogRotateBytes", env = "ANTIHALL_DEVSWARM_SUPERVISOR_LOG_ROTATE_BYTES", min = 1, max = 1099511627776, default = 10485760 }

[devswarm_sup.set_reconcile_mode]
doc = "Reconcile sweep switch: auto / on / off. Node: devswarm.reconcileSweep."
value = { type = "enum", section = "devswarm", key = "reconcileSweep", env = "ANTIHALL_DEVSWARM_RECONCILE_SWEEP", values = ["auto", "on", "off"], default = "auto" }

[devswarm_sup.set_reconcile_sec]
doc = "Least time between two reconcile sweeps. Node: devswarm.reconcileSweepSec (floor 300)."
value = { type = "number", section = "devswarm", key = "reconcileSweepSec", env = "ANTIHALL_DEVSWARM_RECONCILE_SWEEP_SEC", min = 300, max = 100000000, default = 900 }

[devswarm_sup.set_housekeeping_mode]
doc = "Housekeeping sweep switch: auto / on / off. Node: devswarm.housekeepingSweep."
value = { type = "enum", section = "devswarm", key = "housekeepingSweep", env = "ANTIHALL_DEVSWARM_HOUSEKEEPING_SWEEP", values = ["auto", "on", "off"], default = "auto" }

[devswarm_sup.set_housekeeping_sec]
doc = "Least time between two housekeeping sweeps. Node: devswarm.housekeepingSweepSec (floor 300)."
value = { type = "number", section = "devswarm", key = "housekeepingSweepSec", env = "ANTIHALL_DEVSWARM_HOUSEKEEPING_SWEEP_SEC", min = 300, max = 100000000, default = 3600 }

[devswarm_sup.set_max_recoveries]
doc = "Most kill-and-resume recoveries of one workspace. Node: devswarm.maxRecoveries."
value = { type = "number", section = "devswarm", key = "maxRecoveries", env = "ANTIHALL_DEVSWARM_MAX_RECOVERIES", min = 1, max = 20, default = 3 }

# ---- the duties ------------------------------------------------------------------------------------------------------------
# One table per duty, run in this order by the tick. kind `native` is done by the engine itself; kind `node` runs the Node
# supervisor's own function for the duty in a bounded `node` subprocess (the engine owns the schedule, the cool-down gate, the
# lock, the bound and the record; the function keeps writing the files it writes today, so every shared file stays byte-for-byte
# Node's). gate `tick` runs on every tick, gate `cooldown` only when its state file's lastRunAt plus the `sec` setting has passed
# and the `mode` setting is not off. The snippet's arguments are: the plugin root, the home directory, and `engine` or `node`
# (who pokes: `node` only when both executors are node).

[devswarm_sup.duties]
doc = "The duties of one tick, in order (the order of Node's main(): log rotation, the liveness sweep, reconcile, deferred stage, app sync, retention, housekeeping; auto-archive is the engine's own action layer and poke / escalate its action sweeps)."
value = ["log_rotate", "verdicts", "reconcile", "deferred", "app_sync", "retention", "housekeeping"]

[devswarm_sup."duty.log_rotate"]
doc = "Rotate the supervisor log (and the engine's own tick log) to one .1 generation when it passes set_log_rotate_bytes. Native. Only the supervisor's own bounded log is touched."
value = { kind = "native", gate = "tick", timeout_ms = 5000, witness_snippet = 'process.env.HOME=process.argv[2];const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const env=Object.assign({},process.env,{ANTIHALL_DEVSWARM_SUPERVISOR_LOG_ROTATE_BYTES:process.argv[3]});console.log(JSON.stringify(S.rotateSupervisorLogIfNeeded({home:process.argv[2],env})))' }

[devswarm_sup."duty.verdicts"]
doc = "The liveness sweep: compute and write every workspace's liveness verdict file natively; a workspace that is stale, has a Jev blocker or a step plan, or that the engine cannot prove it decides like Node, goes to Node's own sweep (suppressors, the forced parent notice for an urgent mesh unread, straying and the Jev blocker label), and parked escalation notices are re-sent by Node. When the engine owns poke and escalate Node's poke step is switched off (the engine's action layer pokes)."
value = { kind = "node", native = true, gate = "tick", timeout_ms = 300000, witness_timeout_ms = 120000, witness_snippet = 'const fs=require("fs");const path=require("path");const root=process.argv[1];const home=process.argv[2];process.env.HOME=home;const spec=JSON.parse(fs.readFileSync(process.argv[3],"utf8"));const L=require(root+"/companion/lib/liveness.js");const S=require(root+"/companion/devswarm-supervisor.js");const prev=new Map(spec.items.map((i)=>[L.livenessPathFor(i.id,home),i.prev]));const block=()=>undefined;const guard=Object.assign({},fs,{readFileSync:(p,...a)=>{if(prev.has(String(p))){const t=prev.get(String(p));if(t===null){const e=new Error("ENOENT");e.code="ENOENT";throw e}return t}return fs.readFileSync(p,...a)},appendFileSync:block,mkdirSync:block,writeFileSync:block,renameSync:block});const ds=new Map(S.readDescriptors(home).map((d)=>[d.id,d]));const out={};for(const i of spec.items){const d=ds.get(i.id);if(!d){out[i.id]=null;continue}try{out[i.id]=JSON.stringify(L.computeLiveness({descriptor:d,now:spec.now,home,idleThresholdMs:spec.idleMs,nudgeWindowMs:spec.nudgeWindowMs,runners:{fs:guard}}))}catch(e){out[i.id]="error: "+String(e&&e.message)}}console.log(JSON.stringify(out))', snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const o=Object.assign({home:process.argv[2]},S.resolveThresholdsFromEnv(process.env));if(process.argv[3]==="engine")o.deps={pokeOrEscalate:()=>({action:"engine-owned"})};const r=S.sweepOnce(o);console.log(JSON.stringify({sweep:r.length,drained:r.escalationsDrained}))', tail_snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const fs=require("fs");const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const L=require(process.argv[1]+"/companion/lib/liveness.js");const spec=JSON.parse(process.argv[4]);const tail=new Set(spec.tail);const all=new Set(spec.tail.concat(spec.full));const o=Object.assign({home:process.argv[2]},S.resolveThresholdsFromEnv(process.env));o.deps={readDescriptors:(h,F)=>S.readDescriptors(h,F).filter((d)=>all.has(d.id)),computeLiveness:(x)=>tail.has(x.descriptor.id)?JSON.parse(fs.readFileSync(L.livenessPathFor(x.descriptor.id,x.home),"utf8")):L.computeLiveness(x),writeVerdict:(id,v,h,F)=>tail.has(id)?null:L.writeVerdict(id,v,h,F)};if(process.argv[3]==="engine")o.deps.pokeOrEscalate=()=>({action:"engine-owned"});const r=S.sweepOnce(o);console.log(JSON.stringify({sweep:r.length,drained:r.escalationsDrained}))' }

[devswarm_sup."duty.reconcile"]
doc = "The reconcile sweep: drain stranded per-worktree queues into the shared store (reconcile), fold duplicate mesh rows, probe the active workspace list for the app-side archive cache, and sample start-up. Node's state file reconcile-sweep-state.json keeps the cool-down, so either side finding it fresh does nothing."
value = { kind = "node", gate = "cooldown", state = "reconcile-sweep-state.json", sec = "devswarm_sup.set_reconcile_sec", mode = "devswarm_sup.set_reconcile_mode", timeout_ms = 900000, snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const r=S.reconcileSweepIfDue({home:process.argv[2]});console.log(JSON.stringify(S.compactReconcileForLog(r,null).line))' }

[devswarm_sup."duty.deferred"]
doc = "One stage of the deferred post-update sweep per tick (fold-all-stores, heal-orphan-partitions, fold-archived-rows, heal-registry-rows, in rotation), only when its marker says work is pending. The rotation cursor (deferred-sweep-state.json), the marker peek and the nothing-pending answer are native; a stage that has work runs as Node's own runDeferredStage (the store folds of update.js stay Node's)."
value = { kind = "node", native = true, gate = "tick", timeout_ms = 120000, snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");console.log(JSON.stringify(S.deferredSweepIfDue({home:process.argv[2]})))', stage_snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const stage=process.argv[3];try{const budgetMs=S.resolveSupervisorSweepBudgetMs(process.env);const result=S.runDeferredStage(stage,{home:process.argv[2],env:process.env,budgetMs});console.log(JSON.stringify({stage,ran:true,budgetMs,result}))}catch(e){console.log(JSON.stringify({stage:null,ran:false,error:String(e&&e.message||e)}))}' }

[devswarm_sup."duty.app_sync"]
doc = "Sync the DevSwarm app state (archived markers, titles, message gaps) into app-state.json and the names cache. Native: one read of the app database per tick, no Node process on a quiet tick; a marker is written, and a stale marker retired, only when Node's own function (run read only) names the same workspaces, and the retirement itself is executed by Node's function after that agreement."
value = { kind = "node", native = true, gate = "tick", timeout_ms = 120000, snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");console.log(JSON.stringify(S.appDbSyncIfDue({home:process.argv[2]})))', witness_timeout_ms = 120000, mark_dry_snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";if(process.argv[3])process.env.ANTIHALL_DEVSWARM_APP_DB=process.argv[3];const C=require(process.argv[1]+"/scripts/devswarm.js");const r=C.markAppArchivedDescriptors(process.argv[2],{env:process.env,now:Number(process.argv[4]),dryRun:true});console.log(JSON.stringify({ids:r.results.filter((x)=>x.action).map((x)=>x.id),pending:r.pending,errors:r.errors,appDb:r.appDb}))', retire_dry_snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";if(process.argv[3])process.env.ANTIHALL_DEVSWARM_APP_DB=process.argv[3];const C=require(process.argv[1]+"/scripts/devswarm.js");const r=C.retireStaleArchivedMarkers(process.argv[2],{env:process.env,now:Number(process.argv[4]),dryRun:true});console.log(JSON.stringify({ids:r.results.filter((x)=>x.action==="would-retire").map((x)=>x.id),pending:r.pending,errors:r.errors,appDb:r.appDb}))', retire_snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";if(process.argv[3])process.env.ANTIHALL_DEVSWARM_APP_DB=process.argv[3];const C=require(process.argv[1]+"/scripts/devswarm.js");const r=C.retireStaleArchivedMarkers(process.argv[2],{env:process.env,now:Number(process.argv[4])});console.log(JSON.stringify({retired:r.retired,pending:r.pending,errors:r.errors,left:r.left}))', witness_snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";if(process.argv[3])process.env.ANTIHALL_DEVSWARM_APP_DB=process.argv[3];const C=require(process.argv[1]+"/scripts/devswarm.js");const r=C.syncAppState(process.argv[2],{env:process.env,now:Number(process.argv[4]),dryRun:true});console.log(String(JSON.stringify(r.state)))' }

[devswarm_sup."duty.retention"]
doc = "Bounded growth of the message stores: archive-first tombstoning of old, fully read message bodies (never a row delete; positions and dedupe depend on every row staying), native in the armed state. The engine plans natively and writes only when Node's own planner, run read only on the same store, agrees on the exact rows; a disagreement or a witness that cannot run does nothing and is logged. The one-time dry-run report phase, the journal fold and the archive cap stay Node's own functions."
value = { kind = "node", native = true, gate = "tick", timeout_ms = 300000, witness_timeout_ms = 120000, snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";console.log(JSON.stringify(require(process.argv[1]+"/companion/lib/devswarm-retention.js").sweep({home:process.argv[2]})))', witness_snippet = 'process.env.HOME=process.argv[2];const R=require(process.argv[1]+"/companion/lib/devswarm-retention.js");const spec=JSON.parse(process.argv[3]);const home=process.argv[2];const st={stores:{},holds:spec.holds||{},phase:"armed"};const plan=R.planStore({home,hash:spec.hash,settings:spec.settings,now:spec.now,state:st,ignoreAge:true});const dry=R.pruneStore({home,hash:spec.hash,settings:spec.settings,now:spec.now,state:st,dryRun:true});const p={};for(const k of Object.keys(plan.partitions)){const x=plan.partitions[k];p[k]={rows:x.rows,candidates:x.candidates,candidateBytes:x.candidateBytes,tombstoned:x.tombstoned,bound:x.bound,protected:{tooNew:x.protected.tooNew,keepLast:x.protected.keepLast,unread:x.protected.unread,question:x.protected.question,ndjson:x.protected.ndjson,broadcast:x.protected.broadcast,held:x.protected.held}}}console.log(JSON.stringify({cands:plan.candidates.map((c)=>[c.id,c.pos,c.partition,c.blen,c.oldEnough?1:0]),dry:{ok:dry.ok,error:dry.error,skipped:dry.skipped||null,ageCandidates:dry.ageCandidates,sizeCandidates:dry.sizeCandidates,candidateBytes:dry.candidateBytes,overLimit:dry.overLimit,overLimitProtected:dry.overLimitProtected},parts:p}))', fold_snippet = 'process.env.HOME=process.argv[2];const R=require(process.argv[1]+"/companion/lib/devswarm-retention.js");console.log(JSON.stringify(R.foldLegacyJournal({home:process.argv[2],hash:process.argv[3],env:process.env})))', cap_snippet = 'process.env.HOME=process.argv[2];const R=require(process.argv[1]+"/companion/lib/devswarm-retention.js");console.log(JSON.stringify(R.enforceArchiveCap({home:process.argv[2],settings:JSON.parse(process.argv[3])})))', fold_dry_snippet = 'process.env.HOME=process.argv[2];const R=require(process.argv[1]+"/companion/lib/devswarm-retention.js");console.log(JSON.stringify(R.foldLegacyJournal({home:process.argv[2],hash:process.argv[3],env:process.env,dryRun:true})))', cap_dry_snippet = 'process.env.HOME=process.argv[2];const R=require(process.argv[1]+"/companion/lib/devswarm-retention.js");console.log(JSON.stringify(R.enforceArchiveCap({home:process.argv[2],settings:JSON.parse(process.argv[3]),dryRun:true})))' }

[devswarm_sup."duty.housekeeping"]
doc = "Disk hygiene: sweep the reaped-workspace logs and the child-gate files by the doctor's repair rules. Node's housekeeping-sweep-state.json keeps the cool-down. Native: removes only files older than the retention window, one directory level, only the sweep's own suffix."
value = { kind = "node", native = true, gate = "cooldown", state = "housekeeping-sweep-state.json", sec = "devswarm_sup.set_housekeeping_sec", mode = "devswarm_sup.set_housekeeping_mode", timeout_ms = 300000, witness_snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const env=Object.assign({},process.env,{ANTIHALL_DEVSWARM_REAPED_RETENTION_DAYS:process.argv[3],ANTIHALL_DEVSWARM_CHILD_GATE_RETENTION_DAYS:process.argv[4]});const r=S.housekeepingSweepIfDue({home:process.argv[2],env,now:Number(process.argv[5])});const rows=[];for(const k of Object.keys((r&&r.results)||{}))for(const x of r.results[k])rows.push([x.status,x.file]);console.log(JSON.stringify(rows))', snippet = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");console.log(JSON.stringify(S.housekeepingSweepIfDue({home:process.argv[2]})))' }

[devswarm_sup.node_duties]
doc = "Duties that have a native implementation but are to run as Node's own function instead (the rollback lever for one duty: name it here and the next tick runs Node's function in a bounded subprocess, as before the port). Empty: every ported duty runs natively."
value = []

# ---- the non-acting Node witness ---------------------------------------------------------------------------------------------
# For a duty the engine ran natively, Node's own function runs in a scratch HOME over a scratch MIRROR of the inputs (names,
# sizes, modification times; never contents) and the two outcomes are compared; one line per comparison goes to witness_file.

[devswarm_sup.set_witness]
doc = "Run the non-acting Node witness for the native supervisor duties: on | off. The witness only ever touches scratch copies; it costs one short Node run per duty per witness_every_ms."
value = { type = "enum", section = "devswarm_sup", key = "witness", env = "ANTIHALL_DEVSWARM_SUP_WITNESS", values = ["on", "off"], default = "on" }

[devswarm_sup.witness_off]
doc = "The word of devswarm_sup.witness that switches the witness off."
value = "off"

[devswarm_sup.witness_every_ms]
doc = "Least time between two witness comparisons of one duty."
value = 21600000
min = 1000
max = 31536000000
unit = "ms"

[devswarm_sup.witness_max_files]
