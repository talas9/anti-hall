# ah-engine shipped defaults for `ah-engine doctor` (D81): the health check and repair of anti-hall as the engine runs it. The
# finding texts are the Node doctor's (`hooks/doctor.js`), byte for byte, for every check the engine also makes, so the two
# reports can be read side by side (tests/doctor_parity.rs compares them). Format: see the header of engine.toml.

[doctor.plugin_root_envs]
doc = "Environment variables that name the plugin root, first set one wins, after the engine's own and the --plugin-root flag."
value = ["CLAUDE_PLUGIN_ROOT", "CODEX_PLUGIN_ROOT"]

[doctor.hooks_dir]
doc = "The hooks directory under the plugin root."
value = "hooks"

[doctor.hooks_json]
doc = "The generated hook registration file under the hooks directory."
value = "hooks.json"

[doctor.hooks_registry]
doc = "The per-hook registry under the hooks directory, which lists the hook scripts the thin triggers hand to the engine."
value = "hooks.registry.json"

[doctor.script_re]
doc = "The name pattern of a hook script in the registry."
value = "[\\w-]+\\.js"

[doctor.workflow_patterns]
doc = "The names of the saved Workflow templates the doctor looks for (case-insensitive patterns)."
value = ["(?i)^deadly-loop.*\\.js$", "(?i)^ship-it.*\\.js$"]

[doctor.workflow_dir]
doc = "The directory of saved Workflow templates under the home directory and under the project (relative to each)."
value = ".claude/workflows"

[doctor.statusline_scopes]
doc = "Where a statusLine command may be configured, in order: label and file relative to the project (a leading ~ means the home directory)."
value = [
  { label = "project-local", file = ".claude/settings.local.json", home = false },
  { label = "project", file = ".claude/settings.json", home = false },
  { label = "user", file = ".claude/settings.json", home = true },
]

[doctor.statusline_marker]
doc = "A statusLine command that contains this is the anti-hall dispatcher."
value = "statusline.js"

[doctor.statusline_shown]
doc = "How many UTF-16 units of a custom statusLine command the doctor shows."
value = 48

[doctor.unhandled_flags]
doc = "Flags of the Node doctor that the engine doctor does not handle yet; each is reported and the run continues."
value = ["--prune-cache", "--reclaim-ingest-lock", "--repair-ingest-orphans", "--repair-test-stores", "--repair-resurrected", "--logs"]

[doctor.selftest_home_prefix]
doc = "The name prefix of the throwaway home the live self-tests run against."
value = "anti-hall-doctor-"

[doctor.decision_block_re]
doc = "The pattern of a Stop hook's block decision in what a guard prints."
value = "\"decision\"\\s*:\\s*\"block\""

[doctor.version_alert_re]
doc = "The pattern of the version nudge in what the version-alert check prints; {stale} is the cached newer version, already escaped."
value = "\"additionalContext\"\\s*:\\s*\"[^\"]*version-alert: v{stale} is available \\(you are running v"

[doctor.node_timeout_ms]
doc = "How long a Node hook gets in a live self-test before it is killed and the self-test fails."
value = 30000
unit = "ms"

[doctor.max_hook_output]
doc = "The most bytes of a Node hook's output a live self-test keeps."
value = 1048576
unit = "bytes"

[doctor.node_default]
doc = "The Node binary a live self-test runs a deferred hook with when the engine's own variable for it is not set."
value = "node"

[doctor.version_alert_script]
doc = "The Node hook that answers the version-alert self-test when the engine defers it."
value = "version-alert.js"

[doctor.version_check_file]
doc = "The cached latest-version file the version-alert self-test seeds, under the anti-hall directory."
value = "version-check.json"

[doctor.stale_version]
doc = "The version the version-alert self-test caches as newer than the running one."
value = "999.0.0"

# ---- the live self-tests: each runs a built-in check on a crafted payload and expects a block or an allow --------------------------

[doctor.selftests]
doc = "The live self-tests. Each runs the named built-in check in-process (when the engine defers the payload, as the dispatcher would, its Node hook `script` is run instead) on the payload with the given environment (HOME is always the throwaway home) and expects: block (the guard denies: exit 2), allow (it does not), stop-block (a Stop decision of block), or alert-stale (see version-alert). `ok` and `bad` are the findings; `warn` is used instead of `bad` when set."
value = [
  { check = "git", script = "git-guard.js", want = "block", payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git push --force origin main\"}}", ok = "git-guard blocks `git push --force`", bad = "git-guard did NOT block force-push" },
  { check = "git", script = "git-guard.js", want = "block", payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git commit -m \\\"x\\n\\nCo-Authored-By: Claude <noreply@anthropic.com>\\\"\"}}", ok = "git-guard blocks AI self-credit trailer", bad = "git-guard did NOT block AI self-credit" },
  { check = "git", script = "git-guard.js", want = "allow", payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git status\"}}", ok = "git-guard allows `git status`", bad = "git-guard wrongly blocked `git status`" },
  { check = "command", script = "command-guard.js", want = "block", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"npm run build\"}}", ok = "command-guard blocks heavy cmd in coordinator", bad = "command-guard did NOT block heavy cmd in coordinator" },
  { check = "command", script = "command-guard.js", want = "allow", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"npm run build\"},\"agent_id\":\"test-agent\",\"agent_type\":\"general-purpose\"}", ok = "command-guard ALLOWS heavy cmd in subagent (payload agent_id)", bad = "command-guard wrongly blocked a subagent — delegation would deadlock" },
  { check = "command", script = "command-guard.js", want = "allow", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git status\"}}", ok = "command-guard allows light cmd in coordinator", bad = "command-guard wrongly blocked a light cmd" },
  { check = "command", script = "command-guard.js", want = "block", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git status && npm run build\"}}", ok = "command-guard blocks heavy SECOND segment (`git status && npm run build`)", bad = "command-guard MISSED heavy second segment — per-segment fix regressed" },
  { check = "command", script = "command-guard.js", want = "block", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cd app && npm test\"}}", ok = "command-guard blocks heavy cmd after `cd` (`cd app && npm test`)", bad = "command-guard MISSED heavy cmd after cd — per-segment fix regressed" },
  { check = "command", script = "command-guard.js", want = "block", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"echo \\\"$(npm run build)\\\"\"}}", ok = "command-guard blocks heavy cmd in $(...) substitution (`echo \"$(npm run build)\"`)", bad = "command-guard MISSED heavy cmd in command substitution — recursive-parse fix regressed" },
  { check = "command", script = "command-guard.js", want = "block", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"bash -c \\\"npm run build\\\"\"}}", ok = "command-guard blocks heavy `bash -c \"npm run build\"` payload", bad = "command-guard MISSED heavy bash -c payload — recursive-parse fix regressed" },
  { check = "command", script = "command-guard.js", want = "allow", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"echo \\\"$(date)\\\"\"}}", ok = "command-guard allows benign substitution (`echo \"$(date)\"` — date is not heavy)", bad = "command-guard wrongly blocked benign `echo \"$(date)\"` — over-blocking substitutions" },
  { check = "command", script = "command-guard.js", want = "block", env = ["CLAUDE_CODE_ENTRYPOINT=cli", "ANTIHALL_DEVSWARM_SUPERVISOR=on", "DEVSWARM_REPO_ID=repo-x"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"hivecontrol workspace monitor\"}}", ok = "command-guard blocks `hivecontrol workspace monitor` under DevSwarm (blocking long-poll)", bad = "command-guard did NOT block hivecontrol monitor under DevSwarm — destructive-read redirect regressed" },
  { check = "command", script = "command-guard.js", want = "allow", env = ["CLAUDE_CODE_ENTRYPOINT=cli", "ANTIHALL_DEVSWARM_SUPERVISOR=on", "DEVSWARM_REPO_ID=repo-x"], payload = "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"grep -n 'hivecontrol workspace monitor' docs/KB.md\"}}", ok = "command-guard allows grep of quoted hivecontrol DATA under DevSwarm (no false-positive)", bad = "command-guard wrongly blocked a grep of quoted hivecontrol data — destructive-read redirect over-blocks" },
  { check = "edit-guard", script = "edit-guard.js", want = "block", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"src/x.js\",\"old_string\":\"a\",\"new_string\":\"b\"}}", ok = "edit-guard blocks coordinator edit", bad = "edit-guard did NOT block coordinator edit" },
  { check = "edit-guard", script = "edit-guard.js", want = "allow", env = ["CLAUDE_CODE_ENTRYPOINT=cli"], payload = "{\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"src/x.js\",\"old_string\":\"a\",\"new_string\":\"b\"},\"agent_id\":\"test-agent\",\"agent_type\":\"general-purpose\"}", ok = "edit-guard ALLOWS subagent edit", bad = "edit-guard wrongly blocked a subagent edit — delegation would deadlock" },
  { check = "speculation-guard", script = "speculation-guard.js", want = "stop-block", event = "Stop", transcript = ["{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"text\",\"text\":\"That change should be fine.\"}]}}"], payload = "{\"transcript_path\":\"{TRANSCRIPT}\",\"session_id\":\"doctor-spec-{NOW}\"}", ok = "speculation-guard flags \"should be fine\" (hedge w/o evidence)", bad = "speculation-guard did NOT flag \"should be fine\"" },
  { check = "tasklist-guard", script = "tasklist-guard.js", want = "stop-block", event = "Stop", transcript = ["{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"tool_use\",\"name\":\"Edit\",\"id\":\"toolu_e0\",\"input\":{\"file_path\":\"/x/f0\"}}]}}", "{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"tool_use\",\"name\":\"Edit\",\"id\":\"toolu_e1\",\"input\":{\"file_path\":\"/x/f1\"}}]}}", "{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"tool_use\",\"name\":\"Edit\",\"id\":\"toolu_e2\",\"input\":{\"file_path\":\"/x/f2\"}}]}}", "{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"tool_use\",\"name\":\"Edit\",\"id\":\"toolu_e3\",\"input\":{\"file_path\":\"/x/f3\"}}]}}"], payload = "{\"transcript_path\":\"{TRANSCRIPT}\",\"cwd\":\"{CWD}\",\"session_id\":\"doctor-tl-{NOW}\"}", ok = "tasklist-guard blocks untracked work (4 edits, no tasks, no progress file)", bad = "tasklist-guard did NOT block untracked work" },
  { check = "codex-nudge", script = "codex-nudge.js", want = "stop-block", event = "Stop", transcript = ["{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"tool_use\",\"name\":\"Edit\",\"id\":\"toolu_a.ts\",\"input\":{\"file_path\":\"/x/a.ts\"}}]}}", "{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"tool_use\",\"name\":\"Edit\",\"id\":\"toolu_b.ts\",\"input\":{\"file_path\":\"/x/b.ts\"}}]}}", "{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"tool_use\",\"name\":\"Edit\",\"id\":\"toolu_c.ts\",\"input\":{\"file_path\":\"/x/c.ts\"}}]}}"], payload = "{\"transcript_path\":\"{TRANSCRIPT}\",\"session_id\":\"doctor-cx-{NOW}\"}", ok = "codex-nudge flags substantial code change with no Codex review", bad = "codex-nudge did NOT flag uncovered code change" },
  { check = "model-routing", script = "model-routing-guard.js", want = "block", payload = "{\"tool_name\":\"Agent\",\"tool_input\":{\"model\":\"opus\",\"subagent_type\":\"general-purpose\",\"description\":\"fetch and download the build artifacts\",\"prompt\":\"fetch and download the build artifacts from the CI bucket\"}}", ok = "model-routing-guard blocks mechanical task pinned to flagship model (opus + fetch/download)", bad = "model-routing-guard did NOT block mechanical+flagship spawn — routing guard not firing" },
  { check = "model-routing", script = "model-routing-guard.js", want = "allow", payload = "{\"tool_name\":\"Agent\",\"tool_input\":{\"description\":\"summarise the findings from the last round\",\"prompt\":\"summarise the findings from the last round\"}}", ok = "model-routing-guard allows benign spawn with no model and no mechanical signals", bad = "model-routing-guard wrongly blocked a benign spawn" },
  { check = "swarm-guard", script = "swarm-guard.js", want = "allow", payload = "{\"tool_name\":\"Agent\",\"tool_input\":{}}", ok = "swarm-guard allows a spawn under normal memory", warn = "swarm-guard returned exit {code} (blocked) — check memory pressure" },
]

# ---- finding texts ----------------------------------------------------------------------------------------------------------------

[doctor_msg.title]
doc = "The first line of the report. Placeholder: {version}."
value = "anti-hall doctor v{version}"

[doctor_msg.verdict_ok]
doc = "The verdict when nothing failed. Placeholder: {pass}."
value = "✅ anti-hall · doctor: active, {pass} checks passed"

[doctor_msg.verdict_warn]
doc = "Appended to the passing verdict when there are warnings. Placeholder: {warn}."
value = ", {warn} warning(s)"

[doctor_msg.verdict_fail]
doc = "The verdict when something failed. Placeholders: {fail}, {pass}, {warn}."
value = "❌ anti-hall · doctor: {fail} failure(s), {pass} passed, {warn} warning(s)"

[doctor_msg.platform]
doc = "The platform finding. Placeholders: {platform}, {arch}."
value = "Platform {platform} / {arch}"

[doctor_msg.plugin_version]
doc = "The plugin version finding. Placeholder: {version}."
