# ah-engine shipped defaults for `ah-engine audit entry-paths`: the mechanical inspection that no js/sh/wrong-entry leftover ships.
# Owner design rule: no js and no sh in the plugin except the installer hooks/install.sh; `ah-hook` is only the hook trigger (hooks.json
# runs `ah-hook <Event>`); every agent-facing command calls the engine directly (`ah-engine <verb>`); the QuickJS logic files under
# engine/logic run in-process and are not entry points; the retired Node backup tree is out of scope and nothing in scope may point
# into it. Everything the audit looks for, allows and prints is here (D88): editing this file changes the audit, never a rebuild.
# Format: see the header of engine.toml. Regexes use the Rust `regex` syntax; `\x22` is a double quote, `\x27` a single quote.

[entry_audit.sections]
doc = "The sections of the report, in order: files (executable / shebang / script-extension files of the plugin tree), commands (every command string an agent or hook is told to run), generated (every file the engine itself writes into a launcher directory), live (read-only look at the running machine)."
value = ["files", "commands", "generated", "live"]

[entry_audit.subcommand]
doc = "The word after `audit` that runs the entry-path inventory."
value = "entry-paths"

[entry_audit.plugin_rel]
doc = "The plugin directory under a repository checkout. `audit entry-paths --root <dir>` takes a repository root (this directory is under it) or a plugin root (the directory itself)."
value = "plugins/anti-hall"

[entry_audit.repo_cmd_roots]
doc = "Paths under a repository root, besides the plugin directory, whose files are scanned for command strings (docs, README, llms.txt)."
value = ["docs", "README.md", "llms.txt", "scripts/engine-deploy.sh"]

[entry_audit.skip_dirs]
doc = "Directory names the tree walks never enter (version control, dependency and build directories)."
value = [".git", "node_modules", "target"]

[entry_audit.file_exts]
doc = "Extensions (with the dot, lower case) that make a file a script for the files section and for the launcher directories."
value = [".sh", ".js", ".mjs", ".cjs", ".py"]

[entry_audit.shebang]
doc = "The first bytes of an interpreter-run file."
value = "#!"

[entry_audit.cmd_files]
doc = "Regexes on the path (relative to the scanned root) of the files whose lines are checked for command strings: hooks.json and the hook registry of both ports, the engine defaults (engine/defaults.pristine is a byte-identical copy, compared by the deploy kit, so it is not scanned twice), skills of both ports, docs, README, llms.txt, PROTOCOL.md, monitors files and the rules file."
value = [
  '(^|/)hooks/hooks(\.registry)?\.json$',
  '(^|/)engine/defaults/[^/]+\.toml$',
  '(^|/)engine/rules\.json$',
  '(^|/)skills/.+\.(md|txt|json)$',
  '(^|/)monitors/[^/]+\.json$',
  '(^|/)PROTOCOL\.md$',
  '(^|/)README\.md$',
  '(^|/)SECURITY\.md$',
  '(^|/)statusline/.+\.md$',
  '^llms\.txt$',
  '^scripts/engine-deploy\.sh$',
  '^docs/.+\.(md|txt)$',
]

[entry_audit.max_file_bytes]
doc = "A file larger than this is not read for command strings."
value = 4194304

[entry_audit.text_max]
doc = "The table cuts the offending text to this many characters (the JSON report keeps the whole trimmed line)."
value = 90

# ---- the rules -------------------------------------------------------------------------------------------------------------
# A forbidding rule has `re`: a line it matches is a finding. A requiring rule has `path`, `line` and `must`: a line of a file whose
# path matches `path` that matches `line` but not `must` is a finding. `scope` (default: all) names the sections the rule applies to
# (commands, generated, live). `not_path` exempts the files whose path matches it.

[entry_audit.rules]
doc = "The command-string rules. Allowed forms: `ah-hook <Event>` in hooks.json; `ah-engine <verb>` everywhere else."
value = [
  { id = "node-invocation", re = '(?:^|[\s\x22\x27`(;&|=])node\s+(?:(?:-[\w-]+\s+)*[\x22\x27]?(?:[~$/]|\.{1,2}/|[\w.-]*/|[\w.-]*\.(?:c|m)?js\b)|-[ep]\s)', reason = "runs a Node script; agent-facing commands call the engine directly" },
  { id = "shell-invocation", re = '(?:^|[\s\x22\x27`(;&|=])(?:sh|bash|zsh)\s+(?:-\w+\s+)*[\x22\x27]?(?:[~$/]|\.{1,2}/|[\w.-]*/|[\w.-]*\.sh\b)', reason = "runs a shell script; only the installer hooks/install.sh may be a shell file" },
  { id = "script-path", re = '(?:[\w.${}~@-]+/)+[\w.-]*\.(?:sh|js|mjs|cjs|py)\b', reason = "names a js/sh/py file; commands call the engine directly" },
  { id = "named-launcher", re = '\b(?:devswarm|wake-watch)\.js\b', reason = "names a retired Node launcher; use `ah-engine devswarm ...` / `ah-engine mesh ...`" },
  { id = "node-dir", re = 'anti-hall-node', reason = "points into the retired Node backup tree" },
  { id = "hook-verb", re = '(?:^|[/\x22\x27`])ah-hook(?:\\?[\x22\x27])?\s+[a-z][\w-]*', reason = "ah-hook is only the hook trigger (`ah-hook <Event>` in hooks.json), not a CLI; call `ah-engine <verb>`" },
  { id = "hooks-form", path = '(^|/)hooks/hooks(\.registry)?\.json$', line = '"command"\s*:', must = 'ah-hook\\?"\s+[A-Z]\w+', scope = ["commands", "live"], reason = "a hook command must run `ah-hook <Event>`" },
  { id = "interp-arg", re = '<string>(?:[^<\s]*/)?(?:node|sh|bash|zsh)</string>', scope = ["live"], reason = "a unit runs an interpreter" },
]

# ---- the allowlist ---------------------------------------------------------------------------------------------------------
# A finding is dropped when an entry matches: its `section`, and every one of `path` (regex on the path), `text` (regex on the
# offending line) and `rule` (the rule id) that the entry names. Every entry carries its reason.

[entry_audit.allow]
doc = "What the audit lets through, each with its reason."
value = [
  { section = "files", path = '(^|/)engine/logic/.+\.js$', reason = "QuickJS logic files: the engine runs them in-process; they are not entry points (owner design rule)" },
  { section = "files", path = '(^|/)hooks/install\.sh$', reason = "the one allowed shell file: the installer" },
  { section = "files", path = '(^|/)skills/[^/]+/references/[^/]+\.workflow\.js$', reason = "scripts for Claude Code's Workflow tool: the host runs them, they are not entry points" },
  { section = "files", path = '(^|/)web/static/', reason = "browser assets served by the dashboard (ah-web): they run in the browser and are never invoked as a command" },
  { section = "commands", text = 'hooks/install\.sh', reason = "the installer hooks/install.sh is the one allowed shell file; hooks.json falls back to it while the thin client is missing" },
  { section = "commands", path = '(^|/)engine/defaults/entry_audit\.toml$', reason = "the audit's own rule file names the patterns it forbids" },
  { section = "commands", path = '^docs/(plans|archive|specs|superpowers)/', reason = "historical record" },
  { section = "commands", path = '^docs/(KB-[^/]+|CODEX-KB-MIGRATION-MAP|CONTEXT-PRESERVATION-KB|gsd-distilled|BENCHMARK-METHOD)\.md$', reason = "historical record (knowledge-base notes and research, written against the Node-era code)" },
  { section = "live", text = 'hooks/install\.sh', reason = "the installer hooks/install.sh is the one allowed shell file" },
  { section = "live", rule = "live-process", text = '/private/tmp/claude-\d+/', reason = "the tool shell of a Claude Code session: its scratch path names the project directory, it is not an anti-hall script" },
]

# ---- generated output ------------------------------------------------------------------------------------------------------
# `kind = "unit"`: setup/units: the unit files of the engine for the manager `os_key` names (a units.os_* setting).

[entry_audit.generators]
doc = "Every generator of files the engine itself writes outside the plugin tree: the service units."
value = [
  { id = "engine-unit-launchd", kind = "unit", os_key = "units.os_launchd" },
  { id = "engine-unit-systemd", kind = "unit", os_key = "units.os_systemd" },
]

# ---- live ------------------------------------------------------------------------------------------------------------------

[entry_audit.live_ps]
doc = "The command that lists the running processes: one `<pid> <command line>` per line."
value = ["ps", "-axo", "pid=,command="]

[entry_audit.live_proc_tokens]
doc = "How many leading words of a process command line are matched against audit.live_proc_re (the interpreter and its script, not the arguments of a long prompt)."
value = 3

[entry_audit.live_proc_re]
doc = "A process whose leading words match is an interpreter running an anti-hall script, or such a script itself."
value = '(?i)^(?:\S*/)?(?:node|sh|bash|zsh|python3?)\s+(?:-\S+\s+)*\S*(?:anti-hall|wake-watch)\S*|^\S*(?:anti-hall|wake-watch)\S*\.(?:sh|c?m?js|py)\b'

[entry_audit.live_crontab]
doc = "The command that prints the user's crontab."
value = ["crontab", "-l"]

[entry_audit.live_cron_re]
doc = "Only a crontab line that references anti-hall (the ~/.anti-hall tree, a plugin root, or anti-hall in a path) is checked; other projects' jobs are not ours."
value = '(?i)anti-hall'

[entry_audit.live_plist_dir]
doc = "The LaunchAgents directory under the home directory."
value = "Library/LaunchAgents"

[entry_audit.live_plist_re]
doc = "The file names in the LaunchAgents directory that are anti-hall's."
value = '(?i)(?:anti-hall|devswarm).*\.plist$'

[entry_audit.live_installed_json]
doc = "The host's installed-plugins file under the home directory."
value = ".claude/plugins/installed_plugins.json"

[entry_audit.live_enabled_file]
doc = "The host settings file (under the home directory) whose enabledPlugins map says which installs are live: a disabled install is not scanned."
value = ".claude/settings.json"

[entry_audit.live_enabled_pointer]
doc = "The JSON pointer of the enabled-plugins map in that file."
value = "/enabledPlugins"

[entry_audit.live_plugin_key_re]
doc = "The keys of the installed-plugins file that are anti-hall's; each one's installPath is a live plugin root."
value = '^anti-hall@'

[entry_audit.live_roots_extra]
doc = "Other live plugin roots, relative to the home directory (scanned only when an anti-hall install is enabled)."
value = [".anti-hall/ah-engine-live/state/marketplace/plugins/anti-hall"]

[entry_audit.live_root_files]
doc = "The files of a live plugin root whose commands are checked."
value = ["hooks/hooks.json", "hooks/hooks.registry.json", "codex/hooks/hooks.json", "codex/hooks/hooks.registry.json", "monitors/monitors.json"]

[entry_audit.live_bin_dirs]
doc = "Launcher directories under the home directory: a file there with a script extension or a shebang is a finding."
value = [".anti-hall/bin", ".anti-hall/ah-engine/bin"]

[entry_audit.live_settings]
doc = "Host settings files under the home directory whose statusLine command is checked when it is anti-hall's."
value = [".claude/settings.json"]

[entry_audit.live_settings_re]
doc = "A statusLine command that matches is anti-hall's."
value = '(?i)anti-hall'

