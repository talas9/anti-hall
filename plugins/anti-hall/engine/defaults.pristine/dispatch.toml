[dispatch.native]
doc = "1 (the default) = the dispatcher decides every event itself: its built-in checks answer, no hook command is launched, and a path it cannot decide answers by dispatch.failure_mode. 0 = the diagnostic switch is off: the dispatcher runs nothing, every event is let through with a loud stderr line (dispatch.msg_disabled), a log line and a `disabled` count; guards are NOT running while it is 0."
