max = 31536000

[dispatch.msg_spill_pointer]
doc = "The last line of a spilled additionalContext: tells the model where the rest of the session context is. Placeholders: {path} (absolute file path), {hooks} (how many hooks' contexts are in the file), {chars} (their size)."
