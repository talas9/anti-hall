# ---- THE TABLE (hand-maintained, D87) ----
# One key per host and event: dispatch.hooks_<host>_<Event>. Each value lists the hook entries in the order the dispatcher
# combines their results in (the order the old per-hook hooks.json registered them):
#   id       stable name of the entry within its event (script, then its arguments; "#n" for a repeat); keys the fallback
#            map and `[entries.<id>]` in the config
#   matcher  which occurrences of the event the entry applies to ("" = every one), read the host's way (dispatch.matcher_mode)
#   command  (optional, normally absent) a Node command written in the row itself; the Node hook the dispatcher runs when no
#            built-in check answers is normally the entry's id in the host's commands file (launcher.fallback_map_<host>, the
#            hand-kept ah-fallback*.map.json of the Node backup plugin); an engine-only entry has neither
#   timeout  the timeout in seconds (the host discards a hook that runs longer); the thin trigger of the event takes the
#            longest of its entries
#   check    the built-in check that answers this entry in the engine ("" = always the Node hook)
#   when     (optional) a declarative predicate over the payload, the settings, the request environment, the session and
#            the transcript facts; an entry whose predicate is false is skipped. Absent = always applies. See hooks.toml.

# ENGINE-ONLY rows (sibling-sweep, agent-reminders, broad-kill-guard, ...) have a built-in check and no Node twin: they carry no
