# ah-engine shipped defaults for the per-event dispatcher (D58, D87): `ah-engine hook --event <Event>` runs every hook
# entry of the table below that applies to the event and payload, built-in checks in the engine and the rest as their Node
# hooks, then combines the results the way the host combines separate hooks. Format: see the header of engine.toml.
#
# D87: THIS FILE IS THE TABLE OF RECORD, edited by hand. The plugin's `hooks.json` files (one thin trigger per event) and
# the wrapper's fallback list and map are generated FROM it by `ah-engine gen-hooks` and kept equal to it by
# tests/hooks_files.rs. A new hook or check is one row in the table of its host and event (plus, where it needs one, a
# `[entries.<id>]` default in hooks.toml); nothing else lists hooks.
#
# How the host combines hooks (the model the dispatcher reproduces):
# - Claude Code: "All matching hooks run in parallel"; exit 2 blocks and "even a JSON permissionDecision of allow
#   can't override it"; "When several hooks return additionalContext for the same event, Claude receives all of the
#   values"; "When multiple PreToolUse hooks return different decisions, precedence is deny > defer > ask > allow"
#   (code.claude.com/docs/en/hooks, sections Hook handler types, Exit code 2, Add context for Claude, PreToolUse
#   decision control).
# - Codex: "Multiple matching command hooks for the same event are launched concurrently, so one hook can't prevent
#   another matching hook from starting"; "Codex evaluates each matching handler independently"
#   (developers.openai.com/codex/hooks).
# One process returns one exit code and one stdout, so several values are joined into one in hooks.json order; see
# docs/AH-ENGINE.md (Dispatcher) for what that cannot express and when the dispatcher defers instead.

[dispatch.in_process]
doc = "Run the built-in checks inside the hook client (1) instead of asking the daemon (0, the default)."
value = 0
env = "AH_ENGINE_DISPATCH_IN_PROCESS"
min = 0
max = 1

[dispatch.default_host]
doc = "The host whose table is used when `--host` is not given."
value = "claude"

[dispatch.root_vars]
doc = "Per host, the environment variables that hold the plugin root, first set one wins; the host exports them to hook commands, a command naming an unset one cannot run, and a built-in check gets the root as its plugin_root."
value = { claude = ["CLAUDE_PLUGIN_ROOT"], codex = ["PLUGIN_ROOT", "CLAUDE_PLUGIN_ROOT"] }

[dispatch.shell]
doc = "The shell a Node hook command runs under, with its command flag (hooks.json commands are shell-form strings)."
value = ["/bin/sh", "-c"]

[dispatch.default_timeout_s]
doc = "The timeout of a Node hook whose hooks.json entry has none (0 in the table): the host's own default for a command hook (600 s on Claude per docs/KB-claude-code-hooks.md; Codex's default is not verified here, so the same bound is used). Never zero: a zero timeout would kill the hook at its first poll."
value = 600
unit = "s"
min = 1
max = 86400

[dispatch.max_timeout_s]
doc = "An upper bound on any Node hook's timeout, whatever its hooks.json entry says (the default is above every real timeout, so it changes nothing; tests lower it to exercise a hook that never exits)."
value = 86400
unit = "s"
env = "AH_ENGINE_DISPATCH_MAX_TIMEOUT_S"
min = 1
max = 86400

[dispatch.poll_ms]
doc = "How often the dispatcher checks whether its Node hooks have finished."
value = 2
unit = "ms"
min = 1
max = 100

[dispatch.read_ms]
doc = "How long the dispatcher waits for a finished Node hook's output pipes to drain."
value = 2000
unit = "ms"
min = 10
max = 30000

[dispatch.matcher_mode]
doc = "Per host, how a matcher is read: exact_or_regex (Claude: only letters, digits and the exact_chars is an exact name or a list split on | and comma, anything else an unanchored regex) or regex (Codex: always an unanchored regex)."
value = { claude = "exact_or_regex", codex = "regex" }

[dispatch.exact_chars]
doc = "Besides letters and digits, the characters a Claude matcher may contain and still be an exact name or list."
value = "_- ,|"

[dispatch.list_separators]
doc = "Characters that separate the names of an exact-list matcher."
value = "|,"

[dispatch.payload_hash_checks]
doc = "Built-in checks whose Node hook derives something from the exact stdin bytes (verify-first rotates its reminder by the SHA-1 of the whole payload): the dispatcher hands these the SHA-1 of the raw payload, computed only when one of them is selected."
value = ["verify-first"]

[dispatch.match_all]
doc = "Matcher values that match every occurrence of the event."
value = ["", "*"]

[dispatch.matcher_field]
doc = "Per event, the payload field a matcher is tested against; on an event not listed here the matcher is ignored."
value = { PreToolUse = "tool_name", PostToolUse = "tool_name", PostToolUseFailure = "tool_name", PermissionRequest = "tool_name", SessionStart = "source", SubagentStart = "agent_type", SubagentStop = "agent_type", PreCompact = "trigger", PostCompact = "trigger" }

[dispatch.tool_aliases]
doc = "Per host, extra names a tool also answers to when matching (Codex: matcher values Edit and Write also match apply_patch)."
value = { claude = {}, codex = { apply_patch = ["Edit", "Write"] } }

[dispatch.decision_precedence]
doc = "PreToolUse permissionDecision values, strongest first: the combined decision is the strongest any hook returned (Claude docs: deny > defer > ask > allow)."
value = ["deny", "defer", "ask", "allow"]

[dispatch.blocking_decisions]
doc = "JSON fields and values that block without exit 2: a top-level decision, or a hookSpecificOutput permissionDecision."
value = { decision = ["block"], permissionDecision = ["deny"] }

[dispatch.context_joiner]
doc = "Text placed between the additionalContext values of several hooks when they are joined into one."
value = "\n\n"

[dispatch.plain_context_events]
doc = "Events on which plain-text stdout (exit 0) is context for the model (docs/KB-claude-code-hooks.md: UserPromptSubmit, UserPromptExpansion, SessionStart, PostModelSwitch). When the dispatcher must deliver such text next to a hook's JSON it folds it into the merged additionalContext instead of moving it to stderr, where the model would not see it."
value = ["UserPromptSubmit", "UserPromptExpansion", "SessionStart", "PostModelSwitch"]

[dispatch.reason_joiner]
doc = "Text placed between the block reasons of several hooks that block the same event, when they are joined into the one block the dispatcher answers (the host shows the model every hook's block reason; Claude Code gives each Stop/SubagentStop block its own message)."
value = "\n\n"

[dispatch.stop_advisory_chars]
doc = "Most characters of the other hooks' advisories folded into a Stop or SubagentStop block reason (#516): the model reads only the reason there, never a systemMessage or context. Folds only while nudges.enabled is on. The text is cut at a word; 0 = nothing is folded, not even the header."
value = 2000
min = 0

[dispatch.msg_stop_advisories]
doc = "The part of a Stop or SubagentStop block reason that carries the advisories of the hooks that did not block. Placeholders: {text}."
value = "Also from other hooks:\n{text}"

[dispatch.message_joiner]
doc = "Text placed between the systemMessage values of several hooks when they are joined into one."
value = "\n"

[dispatch.context_cap]
doc = "Per host, the characters of one hook's additionalContext the host delivers inline (Claude: 10000, documented at code.claude.com/docs/en/hooks; over it the host spills the whole value to a file and leaves a ~2000 character preview). The dispatcher joins several hooks' contexts into one value, so a join over the cap is logged as dispatch_context_over_cap; the host then spills it the way it spills any over-cap hook output, and nothing is cut by the engine. Codex documents its cap in tokens; the same count is a conservative proxy."
value = { claude = 10000, codex = 10000 }

[dispatch.msg_context_over_cap]
doc = "Event-log detail when the joined additionalContext of an event is over the host's inline cap."
value = "joined context is {len} characters, over the {cap} the host delivers inline"

[dispatch.guard_events]
doc = "Events whose hooks can block (guards): PreToolUse and PermissionRequest decide a tool call (Claude ignores exit 2 on PermissionRequest, so a fail-closed exit 2 there is harmless, and the event stays listed so a hook registered on it later is guarded from the start), Stop and SubagentStop can refuse to let the agent finish. When the dispatcher cannot run the Node hook of such an event it fails CLOSED (exit 2 with dispatch.msg_fail_closed): a deferral there must never read as an allow (D74)."
value = ["PreToolUse", "PermissionRequest", "Stop", "SubagentStop"]

[script.notice_guard_events_only]
doc = "1 = the guard-down notice (script.msg_guard_down) is shown only for a check that failed open on a guard event (dispatch.guard_events: PreToolUse, PermissionRequest, Stop, SubagentStop), where a call went through unchecked. A check that failed open on any other event (UserPromptSubmit, SessionStart, PostToolUse ...) is advisory: its dropped answer is only a missing hint, so the drop is logged and counted (script.notice_suppressed_counter) and the user is told nothing. 0 = every failed-open check tells the user, as before."
value = 1
min = 0
max = 1

[script.notice_suppressed_counter]
doc = "The status counter group (status.advisory.<group>.<check>) that counts a failed-open check whose guard-down notice was not shown because the event is not a guard event (script.notice_guard_events_only)."
value = "notice_suppressed"

[script.notice_why_rules]
doc = "How the guard-down notice names a failure in one short line. The first rule whose `contains` is found in the failure text gives its `text`; a failure that matches none and is a single short line (script.notice_why_max_chars) is told as it is, else script.notice_why_default. The full text (a script stack, the limits) goes to the log only."
value = [ { contains = "cpu limit", text = "it ran past its CPU limit" }, { contains = "wall-clock backstop", text = "it ran past its time limit" }, { contains = "request deadline", text = "it ran past the request deadline" } ]

[script.notice_why_max_chars]
doc = "Longest single-line failure text the guard-down notice tells as it is; anything longer or multi-line is told as script.notice_why_default."
value = 80
min = 20
max = 400

[script.notice_why_default]
doc = "What the guard-down notice says when a failure has no short rule and is not a single short line."
value = "it hit an internal error"

[dispatch.stop_events]
doc = "Guard events whose exit 2 keeps the agent running instead of denying one call (Stop, SubagentStop). A fail-closed block there must be bounded, or an agent whose hooks cannot run could never finish: the payload's stop_hook_active true fails open, and so do more than dispatch.stop_block_cap consecutive fail-closed blocks in one session (the Node Stop hooks make the same stop_hook_active check)."
value = ["Stop", "SubagentStop"]

[dispatch.stop_block_cap]
doc = "How many consecutive fail-closed blocks a Stop or SubagentStop may answer in one session before every later one fails open with a log (the count resets when the guards run fine again)."
value = 2
min = 0
max = 100

[dispatch.stop_state_dir]
doc = "The directory under the state dir holding one consecutive-block counter file per event and session."
value = "stop-blocks"

[dispatch.stop_state_max_age_days]
doc = "Counter files of the Stop block counter older than this many days are removed (a session that ended while its guards were failing leaves one behind)."
value = 7
unit = "days"
min = 1
max = 365

[dispatch.stop_unknown_session]
doc = "Counter key for a Stop whose payload names no session (unreadable or cut off)."
value = "unknown"

[dispatch.spool_stale_s]
doc = "Age at which a named raw-payload stdin spool file from an older build or unlink failure is considered stale and removed. Keep this larger than the longest hook timeout."
value = 1800
unit = "s"
min = 1
max = 86400

[dispatch.msg_stop_active]
doc = "Printed on stderr (exit 0) when a Stop or SubagentStop would fail closed but the host says a Stop hook already blocked this turn (stop_hook_active). Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}), and a Stop hook already held this turn, so the agent is let finish rather than looped. Repair the install (`doctor --repair`)."

[dispatch.msg_stop_capped]
doc = "Printed on stderr (exit 0) when a Stop or SubagentStop would fail closed once more than dispatch.stop_block_cap times in a row. Placeholders: {event}, {cap}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}) {cap} times in a row, so the agent is let finish rather than looped. Repair the install (`doctor --repair`)."

[dispatch.msg_stop_uncounted]
doc = "Printed on stderr (exit 0) when a Stop or SubagentStop would fail closed but the consecutive-block count cannot be recorded, so the loop could not be bounded. Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}) and cannot count its blocks, so the agent is let finish rather than risk a loop. Repair the install (`doctor --repair`)."

[dispatch.spill_over_cap]
doc = "1 = a SessionStart (or any event that cannot block) whose joined additionalContext is over dispatch.context_cap is delivered natively: the hooks' contexts that fit stay inline whole and in priority order (dispatch.context_priority), the rest is written to a file under dispatch.spill_dir and a pointer line (dispatch.msg_spill_pointer) names it, so nothing is cut and no Node hook runs. The host would spill an over-cap value itself but keeps only about 2000 characters of it inline. 0 = deliver the join and let the host spill it. Used only when the join is exactly the hooks' contexts joined by dispatch.context_joiner and the file can be written; otherwise the previous answer stands."
value = 1
env = "AH_ENGINE_SPILL_OVER_CAP"
min = 0
max = 1

[dispatch.priority_order]
doc = "1 = the hooks of an event that cannot block are combined in priority order (dispatch.context_priority, highest first, hook order among equals): the context an over-cap join keeps inline is the most important, and what goes to the spill file is the least (#311). 0 = hook order, as before."
value = 1
env = "AH_ENGINE_PRIORITY_ORDER"
min = 0
max = 1

[dispatch.context_priority_default]
doc = "The priority of a hook entry that has no row in dispatch.context_priority."
value = 50
min = 0
max = 1000

[dispatch.context_pin_priority]
doc = "A hook entry at or above this priority is pinned: it is placed first and is meant to stay inline. A pinned context that still had to spill (the pinned ones alone are over the cap) is counted in `status` delivery.pinned_spills and logged, so the cap or the priorities can be tuned."
value = 80
min = 0
max = 1000

[dispatch.context_priority]
doc = "Per hook entry id (a variant suffix after ':' or '#' takes its base name's row), the priority of its additionalContext in the combined output of an event that cannot block: protocol and role text and the reminders an agent must act on are pinned (>= dispatch.context_pin_priority), housekeeping notices are lowest. Blocks and decisions are not contexts and are never spilled."
value = { "rule-digest" = 93, "verify-first" = 95, "verify-first-full" = 95, "verify-first-orch" = 90, "verify-first-orch-codex" = 90, "verify-first-subagent" = 95, "devswarm-child-role" = 90, "engine-role-note" = 85, "handover-resume" = 90, "auto-handover" = 90, "task-tracker" = 85, "devswarm-parent-inbox" = 85, "devswarm-child-turn" = 85, "devswarm-rt-advisory" = 80, "agent-reminders" = 80, "limit-conserve-inject" = 70, "version-alert" = 60, "switch-notice" = 60, "defect-nudge" = 40, "handover-hygiene" = 30, "procwatch-advisory" = 30, "gh-rt-advisory" = 30, "repo-self-drift" = 30, "fable-availability" = 25, "codex-availability" = 25, "devswarm-version" = 25, "claude-cli-version" = 25, "jev-review-reminder" = 20, "jev-weekly-scorecard" = 10 }

[dispatch.spill_label]
doc = "Telemetry label (kind spill, status delivery.spills_by_event) of an over-cap spill whose file holds only context below dispatch.context_pin_priority."
value = "dispatcher"

[dispatch.spill_pinned_label]
doc = "Telemetry label of an over-cap spill whose file holds a context at or above dispatch.context_pin_priority (counted in status delivery.pinned_spills)."
value = "dispatcher-pinned"

[dispatch.spill_dir]
doc = "The directory under the state dir that holds the over-cap context files (mode 0600, one per spilled event)."
value = "context-spill"

[dispatch.spill_file]
doc = "File name of one spilled context. Placeholders: {event} (letters and digits of the hook event), {ts} (milliseconds), {pid}, {seq} (a per-process counter: the daemon dispatches on several threads, so two same-millisecond spills never share a name)."
value = "{event}-{ts}-{pid}-{seq}.txt"

[dispatch.spill_stale_s]
doc = "Age at which a spilled context file is removed. A session reads its file soon after it starts, so a week is generous; the file only holds text the hooks print again at the next start."
value = 604800
unit = "s"
min = 3600
max = 31536000

[dispatch.msg_spill_pointer]
doc = "The last line of a spilled additionalContext: tells the model where the rest of the session context is. Placeholders: {path} (absolute file path), {hooks} (how many hooks' contexts are in the file), {chars} (their size)."
value = "[anti-hall: the context of {hooks} more hook(s), {chars} characters, did not fit the {cap} characters a hook may inject inline. Read it with the Read tool: {path}]"

[dispatch.msg_context_spilled]
doc = "Event-log detail when an over-cap joined context was spilled to a file. Placeholders: {inline}, {file}, {hooks}, {path}."
value = "joined context spilled: {inline} characters inline, {file} characters of {hooks} hook(s) in {path}"

[dispatch.msg_spill_failed]
doc = "Event-log detail when the spill file could not be written (the previous over-cap answer stands). Placeholder: {err}."
value = "context spill file not written: {err}"

[dispatch.msg_spill_sweep]
doc = "Event-log detail after stale spill files were removed. Placeholder: {n}."
value = "removed {n} stale context spill file(s)"

[dispatch.native]
doc = "1 (the default) = the dispatcher decides every event itself: its built-in checks answer, no hook command is launched, and a path it cannot decide answers by dispatch.failure_mode. 0 = the diagnostic switch is off: the dispatcher runs nothing, every event is let through with a loud stderr line (dispatch.msg_disabled), a log line and a `disabled` count; guards are NOT running while it is 0."
value = 1
min = 0
max = 1

[dispatch.msg_disabled]
doc = "Printed on stderr (exit 0) for each event while the dispatcher is switched off (dispatch.native 0). Placeholder: {event}."
value = "anti-hall: the dispatcher is switched off (dispatch.native = 0); the {event} hooks did not run and this call went through UNGUARDED"

[dispatch.msg_disabled_event]
doc = "Event-log detail for an event let through by a switched-off dispatcher. Placeholder: {event}."
value = "dispatcher switched off: {event} not dispatched"

[dispatch.msg_hook_not_launched]
doc = "The reason a hook entry ends as one that could not run: the dispatcher launches no hook command; only a built-in check decides."
value = "no hook command is launched; the built-in check did not answer"

[dispatch.failure_mode]
doc = "What a GUARD event does when the engine cannot decide, per path: `budget` (the event's budget_ms passed before every hook could start), `infra` (an unreadable payload or map, an entry whose check gave no answer, a lost table row, no engine answer), `panic` (the dispatcher hit an internal error) and `capacity` (no check could run for lack of capacity: the daemon shed the request with a BUSY reply, a full queue or a rate limit, or a scripted check hit its wall-clock backstop, script.wall_limit_factor, while its thread waited for a core). `closed` blocks (exit 2, dispatch.msg_fail_closed, bounded on Stop events by dispatch.stop_block_cap), `open` lets the call through with a loud stderr line (dispatch.msg_no_node_open). A panic is `open` because a bug of the engine's own must not lock the user out of every tool. `capacity` is `open`: under load it decides INSTEAD of each check's failure mode (script.failure_mode_by_check), so a loaded machine never turns every safety guard into a block of every tool call (P0 2026-11-20: six read-only Bash calls refused by five guards at once), the same as a daemon that gave no reply in time; told once per session (msg.engine_unreachable_why_busy) and counted (dispatch:capacity). A check that ran and failed (an exception, a bad verdict, its CPU limit) still takes its own failure mode; an ERR reply still takes `infra`. `closed` = the capacity no-answer takes each check's failure mode, as before."
value = { budget = "closed", infra = "closed", panic = "open", capacity = "open" }

[dispatch.msg_no_node_skipped]
doc = "Printed on stderr (exit 0) when an event that cannot block is skipped because the engine cannot decide it and no Node hooks exist. Placeholders: {event}, {why}."
value = "anti-hall: the {event} hooks were skipped ({why}); run `ah-engine doctor` if it keeps happening"

[dispatch.capacity_hold]
doc = "Risk classes of a guard call that no check could decide for lack of capacity (dispatch.failure_mode `capacity`: a BUSY reply, a late reply, a slow-streak marker files.daemon_slow_marker, a script starved of a core). Blocks must protect, not disrupt: a read-only call or a reversible local change always passes (with the once-per-session notice); only a call whose `field` of tool_input, for a tool in `tools` (Claude Code and Codex both name their shell tool Bash), matches one of `rules` (name = regular expression, case-insensitive, matched anywhere in the command) is held, exit 2 with dispatch.msg_capacity_hold (the rule, a reason and a retry hint): an irreversible or shared-remote action (a push, a merge, a gh pr/issue/release text that could carry an AI credit, a gh api write, a recursive delete, a deploy, a publish, a money-moving call, an eFuse write, a dropped table or deleted rows, a pipe into a shell). Rule config-write holds a write into the agent configuration (a redirection, tee, or the target of cp, mv, ln, install or rsync, into ~/.claude, ~/.codex, ~/.anti-hall except its work/ and history/ directories, $CLAUDE_CONFIG_DIR, $CODEX_HOME, any .claude/settings*.json or .mcp.json; ~, $HOME, ${HOME} and /Users/<name> spellings). A plain read that only names the words passes: a command the whole of which matches `read_only` (its first word a read-only reader such as echo, printf, grep, rg, cat, git log/show/diff or gh pr view, its words split by spaces or tabs only, and no ; & | ` $ ( ) < > or newline after it, so nothing is chained, substituted or redirected) and does not match `read_only_unless` (a reader flag that runs a command, such as rg --pre). A command no check could read is held too (#920): a script run by path (./x.sh, bash x.sh, node x.js) is read when at most script.max_bytes and matched by the same rules (a script too big or unreadable is held under script.rule_unread when the command matches script.risky), the code of an interpreter one-liner (python -c, node -e, perl -e, ruby -e) is read by the inline-* rules (a recursive-delete or push API, an exec of a built command string), a gh subcommand outside gh.known (a gh alias) is held under gh.rule, and a command name outside unknown.known that is no binary on PATH (a shell alias or function defined earlier in the session) is held under unknown.rule (unknown.path_lookup 0: any name outside the list; unknown.path_env names the environment variable that holds the search path). The parsed read exemption (`parsed`) passes a list of such reads too, read word by word the shell's way: the list is split at the `seps` separators (a `|` joins a pipeline; any other separator, a heredoc or a substitution $(..), a backtick or <(..) exempts nothing); a `skip` command (cd, pushd, sleep) alone in its pipeline is dropped; an argument may hold `$NAME` or `${NAME}` of a `vars` variable (an environment path or name, never a flag; read as `placeholder`), while `${..}` with an operator, `${!x}`, $1, $@ and any other variable exempt nothing, so a value can not smuggle in a reader flag that runs a command; an assignment alone in its pipeline is dropped and its variable resolves later in the list (#971: any value the reading resolves, a literal ID=abc or S=/tmp/x, an unquoted use only a value with no space or glob character, which the shell would split; an assignment of an `assign_deny` variable or of a `vars` one exempts nothing, and one after && or ||, before & or in a pipeline, or after an `assigners` command such as printf -v, leaves its variable unknown), but only a value that is the engine's own binary (`programs`, a leading $HOME/, `${HOME}/` or the home path read as ~/, `home_env`) lets its variable stand as a command word (E=\"$HOME/.anti-hall/ah-engine/bin/ah-engine\"; \"$E\" mesh send ..; an assignment in front of a command, E=x \"$E\", resolves nothing, as in the shell); each pipeline must then match `read_only` (minus `read_only_unless`) as a whole, or be the engine program with one of its local, reversible `verbs` (its leading words, `*` = any one word, and the flags, words that start with -, that must stand as a whole word after it: config set --check is a dry run; agents nudge <child> stop is left out), each redirection (#971: operator and target joined, 2>&1, >/dev/null, >>/tmp/x, the target's assigned variables resolved, no `vars` variable) matching `redirs` and not `redirs_unless` (an allow list: fd duplication, /dev/null in or out and files under /tmp; a config file, a relative path, a .. or a .git path is held), and a pipe tail that matches `read_only` or, the whole of it, `tail_ok` (jq, yq, python3 -m json.tool, cut, tr, single-quoted arguments allowed: filters that run no code; python3 -c does). A word with no expansion outside single quotes is its text (a $, a backtick or <( in a single-quoted message is data), and the value of a `text_opts` option (--message, --summary) with no unquoted expansion and, inside double quotes, nothing but text and plain $NAME, ${NAME} or $1 is data, whatever it holds (#971 review: no substitution, operator, flag, subscript or modifier: zsh ${(e)X}, bash ${X@P} and an arithmetic subscript ${Z[Y]} or zsh $Z[Y] run code; a missing value or a redirection in its place exempts nothing). An unquoted ( ) < or > inside a word (a zsh multi-name function a b () .., a glob qualifier *(e:..:), a redirection joined to a word x>f), an assignment value the reading can not resolve (a substitution, a backtick, ${x:=..}, whether or not it runs), a pipeline that starts with an assignment (X=1 | git push: read as a whole), an unreadable cd, an assigning expansion and an append or element assignment (zsh commands[x]=, fpath+=) exempt nothing and mask nothing from there on. A reader spelled by a `bin_dirs` path (/usr/bin/grep) reads as its name. A list the exemption can not pass as a whole has each engine-local call it would pass (verb, tail and redirections as above) replaced by `mask` (a no-op command; empty