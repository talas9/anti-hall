[dispatch.msg_capacity_hold]
doc = "Stderr of a guard call held because no check could decide it for lack of capacity and it falls in a hold class (dispatch.capacity_hold). Placeholders: {tool}, {rule}."
value = "anti-hall: the engine was too busy to check this {tool} call, and it is too risky to let through unchecked (hold rule {rule}: an irreversible or shared-remote action). Nothing ran. Retry it in a few seconds; read-only and local calls still go through while the machine is loaded."

[dispatch.msg_capacity_hold_engine]
doc = "#969: stderr of an engine call held because no check could decide it for lack of capacity and its verb is not one of the local, reversible ones (dispatch.capacity_hold parsed.verbs). Placeholders: {tool}, {rule}."
value = "anti-hall: the engine was too busy to check this {tool} call, and it is an engine call that may write settings or stop agents (hold rule {rule}). Nothing ran. Retry it in a few seconds; the engine's read-only and local verbs (status, version, mesh send/read, inbox, heartbeat, config set --check) still go through while the machine is loaded."

[dispatch.msg_capacity_hash_line]
doc = "One line of `capacity-hashes`: the state of a trusted-scripts entry (or of a path given), its path and the file's current sha256. Placeholders: {state}, {path}, {sha256}."
value = "{state}  {path}  {sha256}"

[dispatch.msg_capacity_hash_match]
doc = "State word of `capacity-hashes`: the file's hash is the entry's."
value = "trusted"

[dispatch.msg_capacity_hash_changed]
doc = "State word of `capacity-hashes`: the file's hash differs from the entry's, so the script is checked like any other until the entry is refreshed."
value = "changed"

[dispatch.msg_capacity_hash_missing]
doc = "State word of `capacity-hashes`: the entry's file is not found (or is a glob, read from the repo root of the current directory)."
value = "missing"

[dispatch.msg_capacity_hash_current]
doc = "State word of `capacity-hashes`: a path given on the command line (no entry to compare); the entry to paste into script.trusted follows."
value = "current"

[dispatch.msg_no_node_open]
doc = "Printed on stderr (exit 0) when a guard event is let through because the engine cannot decide it and its failure mode is open. Placeholders: {event}, {why}."
value = "anti-hall: the guards for {event} could not run ({why}); this call went through UNGUARDED. Run `ah-engine doctor`."

[dispatch.msg_no_node_event]
doc = "Event-log detail for a path that answered without Node. Placeholders: {path}, {why}."
value = "{path}: {why}"

[dispatch.defer_exit]
doc = "Exit code with which the dispatcher asks its wrapper to run the event's Node hooks one by one, as the host does (the joined output could not be delivered faithfully). EX_TEMPFAIL; the host reads it as a non-blocking hook error and shows stderr, so without a wrapper the deferral is visible, never silent."
value = 75
min = 1
max = 255


[dispatch.fail_open_setting]
doc = "Non-safety guards pass when unanswered. Setting guards.failOpenNonSafety (default on): a guard event's entry whose check gave no answer (a late or missing daemon reply, a spent event budget) and that is not a safety guard (script.failure_mode_by_check lists the safety guards as `closed`: git, command, api-guard, edit-guard, ship-it-guard, merge-gate, compact-declaration-guard, devswarm-comms-guard, inbox-read-guard, ask-guard) is let through instead of blocking the tool call or holding the Stop. The pass is counted per check (status: advisory.fail_open) and told to the user once per session (script.msg_guard_down). Off = every unanswered guard entry blocks, as before."
value = { section = "guards", key = "failOpenNonSafety", env = "ANTIHALL_FAIL_OPEN_NON_SAFETY", aliases = [], option = "", default = true }

[dispatch.fail_open_counter]
doc = "The status counter group (status.advisory.<group>.<check>) that counts the unanswered guard entries let through under guards.failOpenNonSafety."
value = "fail_open"

[dispatch.fail_open_notice_tag]
doc = "The stamp tag of the could-not-run notice (a non-safety check let through unanswered, or a call passed because the daemon gave no reply): joined with the hook event, it is told at most once per session and event family, on stderr, and only once it is in the final answer."
value = "dispatch-fail-open"

[dispatch.msg_fail_open_log]
doc = "Event-log detail of an unanswered non-safety guard entry that was let through. Placeholders: {check}, {event}."
value = "{check} ({event}): no answer, not a safety guard: let through"

[dispatch.msg_fail_closed]
doc = "Printed on stderr (exit 2) when a guard event's Node hooks cannot run. Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}). The call is blocked rather than allowed unguarded; repair the install (`doctor --repair`) or retry."

[dispatch.msg_fail_closed_stop]
doc = "Printed on stderr (exit 2) when a Stop or SubagentStop cannot run its guards and the block is still within dispatch.stop_block_cap. Placeholders: {event}, {why}."
value = "anti-hall: the engine could not run the guards for {event} ({why}). The agent is held from finishing rather than let go unguarded; repair the install (`doctor --repair`) or retry (it is let finish after a few attempts)."

[dispatch.msg_panic]
doc = "Deferral reason (event log and stderr) when the dispatcher panicked on a guard event: the Node hooks answer instead of a block."
value = "the dispatcher hit an internal error: the Node hooks decide"

[dispatch.msg_unanswered_why]
doc = "Reason text of an abandoned decision for an entry whose check gave no answer in this call. The daemon logs the cause (event-log kinds answer_dropped / guard_answer_dropped, status answers_dropped); a call that got no reply at all logs client_late / client_slow / client_fail_open. Placeholder: {event}."
value = "{event}: the check gave no answer (cause in the event log: answer_dropped, guard_answer_dropped, client_slow)"

[dispatch.msg_skipped_entry]
doc = "Event-log detail when a non-guard event goes on without an entry that has no runnable Node command. Placeholder: {id}."
value = "entry {id} skipped: no runnable Node command"

[dispatch.msg_skipped_entry_stderr]
doc = "Printed on stderr when a non-guard event goes on without an entry that has no runnable Node command. Placeholders: {event}, {id}."
value = "anti-hall: skipped the {event} hook {id}: it has no runnable command on this install"

[dispatch.msg_defer]
doc = "Event-log detail when the dispatcher cannot answer an event and defers the whole call."
value = "dispatcher deferred the whole call: {why}"

[dispatch.msg_no_fallback]
doc = "Reason logged when a deferred hook entry has no runnable Node command."
value = "entry {id} deferred with no runnable Node command"

[dispatch.msg_conflict]
doc = "Reason logged when several hooks returned output one hook output cannot combine."
value = "hooks {ids} returned outputs that cannot be combined into one: {why}"

[dispatch.msg_conflict_exit]
doc = "Why a combine conflicted: a hook exited with a non-zero (or no) status."
value = "hook {id} exited with status {code}"

[dispatch.msg_conflict_plain]
doc = "Why a combine conflicted: a hook printed output that is not a JSON object while others were combined."
value = "hook {id} printed output that is not a JSON object"

[dispatch.msg_conflict_field]
doc = "Why a combine conflicted: two hooks set the same top-level field to different values; `id` is the later hook."
value = "hook {id} set field {field} to a value another hook set differently"

[dispatch.msg_unknown_host]
doc = "Error printed when `--host` names a host the dispatch table does not have."
value = "unknown host {host}: the dispatch table has {hosts}"

[dispatch.msg_bad_map]
doc = "Error printed when the `--fallback-map` file cannot be read as a JSON object of events to hook ids to commands."
value = "cannot read the fallback map {path}: {err}"

[protocol.dispatch]
doc = "The built-in checks of one event's dispatch table, evaluated by the daemon; the client runs the other entries and every deferral as their Node hooks."
value = { request = "D <client-version>\n<meta JSON: host, event, tool, root>\n<hook payload JSON>", reply = "OK <JSON array of [id, verdict, text]> | BUSY | ERR <reason>" }

[dispatch.msg_hook_timeout]
doc = "Event-log detail when a Node hook was still running at its timeout and was killed with its group (the host discards such a hook, so the call goes on)."
value = "the hook ran past its timeout and was killed; the host discards a timed-out hook"

[dispatch.msg_hook_died]
doc = "Event-log detail when a Node hook was killed by a signal or could not be waited for."
value = "the hook was killed by a signal or could not be waited for"

[dispatch.msg_hook_spawn]
doc = "Event-log detail when a Node hook's command could not be started (the event code is the hook id). Placeholders: {errno} (os<n>, the OS error number), {err} (its text)."
value = "the hook's command could not be started: {errno} {err}"

[dispatch.msg_why_spawn]
doc = "Reason in dispatch.msg_infra_defer when a guard event's Node hook could not be started (EAGAIN, EMFILE, ENOMEM: the Node hooks then decide). Placeholder: {id}."
value = "hook {id} could not be started"

[dispatch.msg_why_died]
doc = "Reason in dispatch.msg_fail_closed when a guard event's Node hook was killed by a signal. Placeholder: {id}."
value = "hook {id} was killed before it could answer"

[dispatch.msg_why_incomplete]
doc = "Reason in dispatch.msg_fail_closed when a guard event's Node hook finished but a process it left behind kept its output open, so the output is incomplete. Placeholder: {id}."
value = "hook {id} finished with incomplete output"

[dispatch.msg_stdin_over_cap]
doc = "Event-log detail when the payload on stdin is longer than client.max_stdin and is sent to Node hooks through an anonymous open file. Placeholder: {max}."
value = "the hook payload is larger than {max} bytes; built-in checks are skipped and Node hooks receive the full payload from an anonymous spool file"

[dispatch.msg_spool_sweep]
doc = "Event-log detail when stale named raw-payload spool files were removed. Placeholder: {n}."
value = "removed {n} stale dispatch stdin spool file(s)"

[dispatch.thin_host_args]
