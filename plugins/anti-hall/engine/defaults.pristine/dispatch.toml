city_parsed_read). Empty `seps` = off. The exemption is the only way past a rule: a spelling it does not know is held (a false hold costs a retry, a false pass costs the action). An empty `read_only` exempts nothing; a `read_only` or `read_only_unless` that does not compile exempts nothing. Both the engine and the ah-hook launcher apply the same keys (Unicode and ASCII builds); a rule that does not compile is skipped and logged (capacity_hold_rule). An empty `rules` lets every capacity no-answer through. #907: with `normalise` 1 the command is also read the way the shell reads it before the rules and the read exemption see it: in-word quotes and backslashes are dropped (g\"i\"t pu\\sh = git push), only an UNQUOTED separator splits a command (a quoted ; & | or newline inside an argument is data, so it neither ends nor hides a command), and the rules match the raw text and this normalised text (a command the reading can not balance, a quote or a substitution left open, is held under rule `unreadable` unless the read exemption passes its raw text: matched quote-blind, any such tail would switch the reading off; empty = match the raw text only). `text` names the free text a command publishes: the values of `opts` (--body, --title, --notes, --body-file ...) of a `verb` (gh) `subs` command (pr, issue, release; gh api is not one) are data and are not matched, unless the value holds a substitution that could run something; the command words themselves (gh pr merge, gh issue create) still are. `git` holds a git subcommand that is not in `known` (git's own subcommands, which an alias can not shadow: so a config alias or an external git-<name> command), held under rule `rule` without reading any git config; `opts_with_arg` are the global options that take the next word, `wrappers` the words that run another command. 0 = match the raw text only. Both the engine and the ah-hook launcher read the same keys; each hold decided only by the normalised text, and each text value that kept a rule from matching, is counted (capacity_hold normalised / text_exempt). The reading follows what the shell does that a word list misses: an unquoted # at the start of a word comments out the rest of its line (a quote in it opens nothing), a heredoc body is data up to its delimiter line (what an unquoted one substitutes, $(..) or a backtick, is read as a command, `body_depth` levels deep, 0 = not at all), <(..) and >(..) run a command (a gh value that is one is not data), $\"..\" is a quoted word, \\u and \\U spell a character in $'..', a brace list {a,b} expands to words (at most `brace_cap`, 0 = not expanded), an arithmetic << is a shift and no heredoc, a substitution inside double quotes opens a new quoting context, a git command can open with ( { ! $( <( or a backtick or sit in an assignment's substitution, and git in any case is git (a case-insensitive file system runs it). `passes` (0 = once) is how many levels deep a word that holds a space, a newline or a separator is read again as the value the shell passes on (quoted newlines intact, a substitution's body unwrapped), so a string a nested shell runs (sh -c '..', eval \"..\", env -S '..', git -c core.pager='..') is read like a command too; each re-reading is matched as well. The rules shell-heredoc, interpreter-heredoc, pipe-to-interpreter, dynamic-command and exec-list-dynamic are off by default (removed from `rules`, `inline_rules` and `script.raw_rules`; `script.body_skip` empty): they held safe local work under load; the wrapper words of pipe-to-shell take option values (sudo -u root sh, xargs -n 1 sh; a || is no pipe) and the gh subcommand rules allow options before the action (gh pr -R o/r merge). #920: under load a script run by path (./x.sh, bash x.sh, source x, an interpreter named by its path, a command after a find `script.markers` word such as -exec) is read when at most `script.max_bytes` and matched by the same rules (held as `script.rule_prefix` + the rule), and the scripts it runs in tu