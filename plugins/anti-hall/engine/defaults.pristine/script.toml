# ah-engine shipped defaults for scripted check logic (D88 spike): hook DECISION logic lives in editable plugin JavaScript
# (`engine/logic/<check>.js`, shared helpers in `engine/logic/lib/*.js`), run by an embedded QuickJS-NG runtime. The engine
# keeps only generic, read-only primitives the scripts call. Format: see the header of engine.toml.

[script.enabled]
doc = "1: a check whose script exists runs the script instead of its compiled port; 0: the compiled port always runs (the parity baseline)."
value = 1
env = "AH_ENGINE_SCRIPT"
min = 0
max = 1

[script.logic_dir]
doc = "Directory of the shipped check scripts, relative to the plugin root."
value = "engine/logic"

[script.override_dir]
doc = "Owner override directory, relative to the home directory: a script (or lib file) of the same name there takes precedence over the shipped one."
value = ".anti-hall/logic"

[script.lib_dir]
doc = "Sub-directory (of both the shipped and the override directory) whose `*.js` files are evaluated, in file-name order, before a check script."
value = "lib"

[script.ext]
doc = "File extension of a check script and of a lib file."
value = ".js"

[script.entry]
doc = "Global function a check script defines; it is called with the hook payload and returns the verdict."
value = "decide"

[script.check_scope]
doc = "How a check's own files (its includes, then its script, joined by newlines) are evaluated in the one context a worker thread shares between all checks: as the body of a function, so the check's top-level declarations (its entry and helpers) stay private to it while the lib files are evaluated once per thread. The value it evaluates to must be the check's entry function. Placeholders: {entry} (script.entry), {source}. Measured 2026-10-09 (DECISIONS.md 1.111, one thread, the 16 shipped scripts): a context per check held 3.3 MB of interpreter heap (about 150 KB per check for the intrinsics, host bindings and lib files again), one shared context 1.0 MB."
value = "(function () {\n{source}\n;return typeof {entry} === 'function' ? {entry} : undefined;\n}).call(globalThis)"

[script.heap_budget_base_bytes]
doc = "Memory budget the interpreter test holds one worker thread to (DECISIONS.md 1.111): this much for the runtime, the shared context, the host bindings and the lib files, plus script.heap_budget_per_check_bytes for every check script it has run. Measured 2026-10-09: 224 KB base, 1.04 MB with all 16 shipped scripts (git.js 365 KB, the others 1-195 KB); a context per check held 3.3 MB."
value = 524288
unit = "bytes"

[script.heap_budget_per_check_bytes]
doc = "Per check script share of the interpreter budget above (DECISIONS.md 1.111)."
value = 98304
unit = "bytes"

[script.registry_global]
doc = "Global object of the shared context that holds each loaded check's entry function, by check name."
value = "__ahCheckEntries"

[script.msg_no_entry]
doc = "Reason logged (then the failure policy applies) when a check's script defines no entry function. Placeholders: {check}, {entry}."
value = "{check}: the script defines no {entry} function"

[script.time_limit_ms]
doc = "CPU-time limit of one script call (the interpreter thread's own CPU time, see script.wall_limit_factor for the wall-clock backstop); past it the interpreter is interrupted and the call defers to Node (never a silent allow)."
value = 50
env = "AH_ENGINE_SCRIPT_TIME_MS"
min = 1
unit = "ms"

[script.cut_at_request_deadline]
doc = "1 = a scripted check still running when its request's client stops waiting (client.deadline_ms minus daemon.reply_slack_ms) is interrupted there, and a check not yet started by then is not started: each such entry defers to its own Node hook while the entries answered in time keep the engine's answer, so a loaded machine costs single checks instead of the whole event (before, the reply came after the client had given up and every entry of the event ran in Node). Not counted as a script error. An engine-only check whose failure mode is closed (script.failure_mode_by_check) keeps only its own limit on a guard event. 0 = the checks run to their own limits whatever the client's deadline."
value = 1
env = "AH_ENGINE_SCRIPT_CUT_AT_DEADLINE"
min = 0
max = 1

[script.msg_deadline_cut]
doc = "Log detail (code script_deadline, rate-limited) of a check cut or not started at its request's client deadline; it defers to its Node hook. Placeholders: {check}, {event}."
value = "{check} ({event}): past the client's deadline, deferred to its Node hook"

[script.msg_scan_cut]
doc = "Exception a native transcript scan raises in a script call cut at its request's client deadline; the call then defers to its check's Node hook."
value = "the request's client stopped waiting during the scan"

[script.wall_limit_factor]
doc = "The wall-clock backstop of a script call, as a multiple of its time limit. The limit itself counts the interpreter thread's CPU time, so a thread kept waiting for a core by a loaded machine is not interrupted; the backstop ends a script that waits without using CPU. Time a host function spends blocked (a child process, a lock) is credited back to the backstop."
value = 10
min = 1
max = 1000

[script.call_memory_bytes]
doc = "Heap a single script call may allocate above the runtime's size after its scripts were loaded; past it the call fails and defers."
value = 16777216
min = 1048576
unit = "bytes"

[script.stack_bytes]
doc = "Largest interpreter stack one script call may use."
value = 262144
min = 65536
unit = "bytes"

[script.read_max_bytes]
doc = "Upper bound of one `ah.fs.readText` read, whatever the script asks for."
value = 4194304
min = 1024
unit = "bytes"

[script.regex_cache_max]
doc = "Compiled regular expressions kept per worker thread for `ah.re.*`; the cache is cleared when it is full."
value = 256
min = 8

[script.p95_budget_us]
doc = "Latency a scripted check may ADD over its compiled port at the 95th percentile, per call (the D88 go/no-go gate measures against it; the primitives a script calls, such as a transcript read, cost the same either way)."
value = 1000
unit = "us"

[script.msg_invalid_pattern]
doc = "Error a script sees when it hands `ah.re.*` a pattern that does not compile."
value = "invalid pattern {src}"

[script.msg_no_request]
doc = "Error a host function raises when it is called outside a check call (no request state)."
value = "no request state"

[script.msg_unknown_key]
doc = "Error a script sees when it asks `ah.cfg` for a key that is not shipped."
value = "unknown defaults key {key}"

[script.msg_not_number]
doc = "Error a script sees when it asks `ah.cfgNum` for a key whose value is not a number."
value = "{key} is not a number"

[script.msg_bad_verdict]
doc = "Logged reason (then the call defers) when a script returns a value that is not a verdict."
value = "unexpected verdict {value}"

[script.engine_only_checks]
doc = "Checks with NO Node twin (their fallback command is a no-op). When one of these scripts cannot answer, its failure mode decides (script.failure_mode_by_check): `open` allows (logged and counted), `closed` blocks on a guard event (dispatch.guard_events). Every other check defers to its Node hook on a script failure, so a broken script never changes a decision."
value = ["sibling-sweep", "handover-hygiene", "agent-reminders", "gh-rt-advisory", "procwatch-advisory", "engine-role-guard"]

[script.failure_mode_by_check]
doc = "Failure mode of an engine-only check whose script cannot answer (an exception, the CPU-time limit, out of memory, a verdict of the wrong shape, no script file): `open` ALLOWS (the failure is logged as script_error and counted as a telemetry check event with outcome error), `closed` BLOCKS on a guard event with script.msg_fail_closed. A check's own failure must never block the user's agent, so only a security guard whose silent allow would let through what it exists to stop is `closed`. None ships `closed`: sibling-sweep, agent-reminders, gh-rt-advisory, handover-hygiene and procwatch-advisory are advisories, and engine-role-guard is a second line (the ah-engine command line refuses a verb the caller's role may not run by itself). A check not listed takes script.failure_mode_default. On 2026-10-09 sibling-sweep was fail-closed and blocked a SubagentStop when its script hit the CPU limit on a long transcript."
value = { sibling-sweep = "open", handover-hygiene = "open", agent-reminders = "open", gh-rt-advisory = "open", procwatch-advisory = "open", engine-role-guard = "open" }

[script.failure_mode_default]
doc = "Failure mode of an engine-only check not listed in script.failure_mode_by_check."
value = "open"

[script.failure_mode_closed]
doc = "The failure-mode value that blocks on a guard event (any other value allows)."
value = "closed"

[script.msg_fail_closed]
doc = "Block reason of an engine-only check on a guard event whose script could not answer. Placeholders: {check}, {why}."
value = "anti-hall {check}: BLOCKED. Its check script failed ({why}) and this guard has no fallback, so the call is refused rather than allowed unchecked. Fix or remove the script in engine/logic or ~/.anti-hall/logic, or skip the guard."

[script.msg_no_script]
doc = "Reason logged (then the failure policy applies) when a check whose logic is a script has no script file."
value = "no script file"

[script.write_root]
doc = "The one directory under the home directory that a script may write to through `ah.state.writeAtomic` (a path must start with it; nothing outside it, no link below it)."
value = ".anti-hall"

[script.write_max_bytes]
doc = "Largest text one `ah.state.writeAtomic` call may write; a larger text is refused."
value = 1048576
min = 1024
unit = "bytes"

[script.write_path_max]
doc = "Longest relative path one `ah.state.writeAtomic` call may name."
value = 600
min = 16

[script.write_why_home]
doc = "Refusal reason of a scripted write when the request has no absolute home directory."
value = "no absolute home directory"

[script.write_why_size]
doc = "Refusal reason of a scripted write whose text is over script.write_max_bytes."
value = "text over the size cap"

[script.write_why_path]
doc = "Refusal reason of a scripted write whose path is absolute, outside the write root, too long, or has an empty, `.` or `..` part."
value = "path outside the allowed shape"

[script.write_why_link]
doc = "Refusal reason of a scripted write that would pass through a symbolic link below the write root."
value = "symbolic link below the write root"

[script.msg_write_refused]
doc = "Error a script sees when its write was refused. Placeholder: {why}."
value = "write refused: {why}"

[script.msg_env_incomplete]
doc = "Reason logged (then the failure policy applies) when the request's environment is incomplete, so no check can be evaluated."
value = "request environment incomplete"

[script.msg_settings_unreadable]
doc = "Reason logged (then the failure policy applies) when the settings file holds something only JavaScript can parse."
value = "settings file readable only by JavaScript"

[script.write_sync]
doc = "1: a scripted write fsyncs the file before the atomic rename (survives a power cut, costs several milliseconds per write); 0: it does not (a reader still never sees a half-written file, and the state a script keeps is advisory and rebuilt at the next run)."
value = 0
min = 0
max = 1

[script.readdir_max]
doc = "Most entries `ah.fs.readdir` returns; a directory with more entries answers null (a partial listing is never returned as a whole)."
value = 10000
min = 16

[script.exec_programs]
doc = "Program names `ah.exec` may run (bare names, resolved through the request's PATH). Anything else answers null."
value = ["git"]

[script.exec_timeout_max_ms]
doc = "Longest wall-clock time one `ah.exec` run may take whatever the script asks for; the run's process group is killed at the limit."
value = 5000
min = 10
unit = "ms"

[script.exec_timeout_scale]
doc = "Multiplier on the time every `ah.exec` run and every process listing a script asks for may take (the limit a script asks for, and the longest one, are both multiplied). 1 in production; a test build on a loaded machine raises it so a slow child process is not read as a failure."
value = 1
env = "AH_ENGINE_SCRIPT_EXEC_SCALE"
min = 1
max = 100

[script.exec_poll_ms]
doc = "How often the bounded runner checks whether an `ah.exec` child has finished."
value = 2
min = 1
unit = "ms"

[script.exec_max_calls]
doc = "Most `ah.exec` runs one script call may start; past it the call answers null."
value = 64
min = 1

[script.exec_output_max_bytes]
doc = "Largest stdout (and, separately, stderr) `ah.exec` hands back; the rest is cut and `truncated` is set."
value = 4194304
min = 1024
unit = "bytes"

[script.transcript_cache_entries]
doc = "Most (transcript, window) answers `ahHost.transcriptDedupeTail` keeps in the engine process, each valid while the file keeps its size and modification time; past it the cache is emptied."
value = 64
min = 1

[script.grep_max_bytes]
doc = "Most bytes of lines `ahHost.transcriptGrep` hands back to a script; a search that matches more is answered unsure and the script defers."
value = 2097152
min = 65536
unit = "bytes"

[script.tail_max_bytes]
doc = "Largest window `ah.transcript.tailLines` reads from the end of a file, whatever the script asks for."
value = 16777216
min = 65536
unit = "bytes"

[script.includes]
doc = "Scripts a check script builds on: check name to the names of other scripts in the logic directory, loaded as libraries (after the shared helpers, before the check's own script, which then defines the entry). A listed script that does not exist makes the check's script unavailable."
value = { git-audit = ["git"], codex-quota-detect = ["codex-availability"], codex-nudge = ["codex-availability"], coordinator-work-guard = ["command"], "rules/coordinator-work-baseline" = ["command", "coordinator-work-guard"], verify-first-orch-codex = ["verify-first-orch"], devswarm-parent-reply-tracker = ["devswarm-child-gate"], devswarm-child-drain = ["devswarm-child-gate", "devswarm-child-role"], devswarm-parent-gate = ["devswarm-child-role"], api-guard = ["command", "inc/shell-writes"], ship-it-guard = ["command", "inc/shell-writes"] }

[script.lock_max_held]
doc = "Most cross-process locks (`ah.state.lock`) a script may hold at once in one call. A script that nests two takes them in one fixed order and releases the inner one first."
value = 2
min = 1
max = 4

[script.lock_wait_max_ms]
doc = "Longest wait a script may ask `ah.state.lock` for in place of its group's wait."
value = 5000
min = 0
unit = "ms"

[script.sweep_max_remove]
doc = "Most files one `ah.state.sweep` call may delete, whatever the script asks for."
value = 200
min = 1

[script.msg_unknown_op]
doc = "Error a script sees when it asks a file operation the host does not have. Placeholder: {op}."
value = "unknown file operation {op}"

[script.tail_buf_bytes]
doc = "Size of the buffer `ah.transcript.tailLines` reads a file through."
value = 65536
min = 4096
max = 1048576
unit = "bytes"

[script.call_memory_by_check]
doc = "Per-check heap a single script call may allocate (bytes), replacing script.call_memory_bytes for a rules script that engine code calls with call_fn from a command-line process. `rules/jev-report` aggregates every retained generation of the Jev decision log (about 28,000 rows for 7 MB of log) in one call."
value = { "rules/jev-report" = 1073741824 }
unit = "bytes"

[script.time_limit_by_check]
doc = "Per-check limit of one script call (ms; the interpreter thread's CPU time, and the wall-clock backstop is script.wall_limit_factor times it), replacing script.time_limit_ms. A key is the check name, or `<check>:<event>` for one event, which wins. handover-hygiene reads and writes a whole directory tree, so its command-line and scheduled-job runs (event Cli) get seconds; `command` (command-guard) resolves repositories and runs `git` for its edit parity and carve-outs (a child process wait is credited back, but a loaded machine stretches the interpreter's own time as well); `git` (git-guard) tokenizes the whole command and its heredoc bodies (the frozen replay of 2026-10-09 interrupted it at 50 ms on 3 long heredoc commands, each answered the same with the time); api-guard and ship-it-guard parse Bash writes with command-guard's parsers (script.includes) and compact-declaration-guard parses the current turn of a 1.5 MB transcript tail, so they get command-guard's order of time and more; `precompact-snapshot` reads the transcript tail of a PreCompact (a real 1.5 MB tail takes about 190 ms in the interpreter, so 50 ms would defer it to Node every time); `claim-ledger` walks up to 2 MB of transcript evidence; the Stop-time and prompt-time checks that scan the transcript tail or state (tasklist-guard, task-guard, silent-agent-nudge, stale-agent-stop-note, auto-handover, auto-handover-pause-nag, compact-advice-guard, limit-conserve-inject, idle-agent-sweep) get 500 ms because, measured 2026-10-09 on the frozen replay (2113 calls), the 50 ms default interrupted tasklist-guard on 2 and silent-agent-nudge on 6 of 61 Stop calls (and stale-agent-stop-note on a 156 MB transcript), each deferring a decision the script makes identically when given the time; its SessionStart advisory only lists and stats files."
value = { "handover-hygiene:Cli" = 30000, "handover-hygiene" = 1000, command = 200, git = 500, git-audit = 500, api-guard = 500, ship-it-guard = 500, compact-declaration-guard = 500, precompact-snapshot = 500, claim-ledger = 500, tasklist-guard = 500, task-guard = 500, silent-agent-nudge = 500, stale-agent-stop-note = 500, auto-handover = 500, auto-handover-pause-nag = 500, compact-advice-guard = 500, limit-conserve-inject = 500, idle-agent-sweep = 500, "rules/jev-report" = 60000 }

[script.p95_budget_by_check]
doc = "Per-check own-p95 allowance (us) for scripted checks whose latency includes waiting on a child process or a disk sync, which the compiled port paid as well. Measured 2026-10-08 on the golden corpora (release, no LTO, loaded machine), compiled port then script: git p50 92 then 432 us, p95 13,902 then 22,324 us (the p95 is the `git` child processes of alias and handover lookups plus the longest commands' tokenizing); sibling-sweep p50 12,154 then 2,453 us, p95 13,261 then 3,903 us (the compiled state write fsynced). Batch 6 (2026-10-09, release no LTO, machine load average 12 to 17, so roughly twice the quiet figures): speculation-guard p50 236 us, p95 1,064 us (its corpus holds Jev asks and state writes), tasklist-guard p50 881 us, p95 2,775 us (it creates the progress directory, stats the progress and history files and appends to the session indexes); the other batch-6 checks stay under the 1,000 us default (dispatch-tier p95 510, model-routing 607, speculation-judge 338, silent-agent-nudge 967, task-guard 935). The compiled ports were not timed before removal, so these are the scripts' own p95s, not an added figure; merge-side-pick p50 38 then 106 us, p95 7,199 then 6,104 us (both are the per-session state file's locked read-modify-write; measured 2026-10-09 on a machine at load 25-30). Measured 2026-10-09 (lane d88fd, release, thread CPU time, best of three): command p50 77 then 295 us, p95 1,804 then 2,761 us on the 5,827-scenario command-guard lane corpus (the compiled port short-cut commands that cannot write or run anything heavy; the script runs the Node functions, and the corpus is skewed to heavy and write cases, which resolve repositories and spawn `git`); coordinator-work-guard p50 28 then 1,128 us, p95 798 then 3,009 us on its golden corpus, where the compiled port deferred 149 of 192 calls to a Node process (tens of milliseconds each) and the script answers all of them. Batch 7 (lane d88e, 2026-10-09, release no LTO, load average 5 to 8, own p95 over the golden corpus): idle-agent-sweep p95 1.4 ms (it writes the emit-dedupe state file durably, as the compiled port did); session-end-mcp-reaper p50 1.3 s, p95 1.7 s (its 500 ms grace period between the polite and the forced signal, plus the process listing, the age and service-manager probes and the re-listing, each a child process; the compiled port waited for the same); stale-agent-stop-note 207 us, claim-ledger 258 us, auto-handover-pause-nag 409 us and compact-advice-guard 258 us stay under the 1,000 us default. A real 1.5 MB transcript tail takes the precompact script about 190 ms (a script has 50 ms): on a large transcript it defers to Node until a transcript primitive or a per-check time limit exists. A check not listed here is held to script.p95_budget_us. Batch 6 (lane d88fc, 2026-10-09, release no LTO, load average about 40, own p95 over the golden corpus): the three that start `git` wait for the child as the compiled ports did (progress-prune p50 13.5 ms / p95 17 ms: `git check-ignore`; precompact-snapshot p50 34 ms / p95 53 ms: `git status` and `git log`; handover-resume p50 18 ms / p95 28 ms: three `git` calls); limit-conserve-inject p95 1.1 ms and output-verify-guard p95 1.3 ms (state reads and writes, the transcript tail scan); every other batch-6 script is under 0.9 ms. A real 1.5 MB transcript tail takes the precompact script about 190 ms (a script has 50 ms): on a large transcript it defers to Node until a transcript primitive or a per-check time limit exists. Batch 8 (lane d88f, 2026-10-09, release no LTO, load average 13 to 15, own p95 over the golden corpus): task-tracker p50 1.1 ms, p95 8.7 ms (UserPromptSubmit: it reads and parses the transcript tail on every prompt), verify-first p50 0.6 ms, p95 1.26 ms, codex-availability p50 0.37 ms, p95 1.4 ms (it writes the availability record on every session start), codex-nudge p50 0.6 ms, p95 1.2 ms; verify-first-orch p50 0.19 ms, p95 0.63 ms stays under the 1,000 us default."
value = { git = 30000, sibling-sweep = 5000, fable-availability = 2000, handover-hygiene = 200000, merge-side-pick = 12000, speculation-guard = 2000, tasklist-guard = 5000, limit-conserve-inject = 2000, output-verify-guard = 3000, progress-prune = 30000, precompact-snapshot = 100000, handover-resume = 60000, command = 6000, coordinator-work-guard = 8000, idle-agent-sweep = 3000, session-end-mcp-reaper = 3000000, task-tracker = 12000, verify-first = 2000, codex-availability = 2500, codex-nudge = 2000 }
