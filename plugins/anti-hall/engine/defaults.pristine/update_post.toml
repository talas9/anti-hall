[update_post.ingest_files]
doc = "Plugin files the ingest-daemon heal inspects (relative to the plugin dir); if one is missing Node answers."
value = ["companion/install-devswarm-ingest.js", "hooks/lib/doctor-repair.js", "hooks/lib/devswarm-detect.js"]

[update_post.ingest_gate_json]
doc = "The ingest heal answer when this is not a DevSwarm session and the cache was synced (healIngestDaemon's gate)."
value = '{"attempted":false,"healed":false,"detail":"not a DevSwarm session — ingest heal skipped (gate closed)"}'

[update_post.ingest_idle_json]
doc = "The ingest heal answer when nothing was synced and the unit does not need healing."
value = '{"attempted":false,"healed":false,"detail":"no cache sync this run and the installed ingest unit classifies ok — nothing to heal"}'

[update_post.deferred_json]
doc = "A stage deferred by the overall post-pull budget. Placeholders: name, budget."
value = '{"attempted":false,"deferred":true,"detail":"{name}: deferred — overall post-pull budget ({budget}ms) exhausted before this stage started; it runs on the NEXT update/doctor pass (idempotent/resumable, nothing lost)"}'

[update_post.node_failed_json]
doc = "A stage whose Node function could not be run or printed nothing usable (the stage functions never throw, so this is the engine's own fail-open answer). Placeholders: name, why."
value = '{"attempted":false,"detail":"{name} skipped: the Node stage could not run ({why})"}'

[update_post.node_args]
doc = "Arguments of the Node subprocess that runs one stage function: the code, then the plugin dir, the function name and the options (JSON) as arguments."
value = ["-e"]

[update_post.stage_snippet]
doc = "Runs one exported stage function of update.js with the paths resolved like its main(), and prints its answer as one JSON line. Arguments: plugin dir, function name, options JSON."
value = 'const u=require(process.argv[1]+"/skills/update/scripts/update.js");const o=JSON.parse(process.argv[3]);o.paths=u.resolvePaths(process.env,require("os").homedir());console.log(JSON.stringify(u[process.argv[2]](o)))'

[update_post.hashes_snippet]
doc = "The store hashes, ordered smallest first, as runUpdate computes them once for the store stages. Arguments: plugin dir."
value = 'const os=require("os");const u=require(process.argv[1]+"/skills/update/scripts/update.js");const d=require(process.argv[1]+"/companion/lib/devswarm-store.js");console.log(JSON.stringify(u.orderStoreHashesBySize(d,os.homedir(),d.listStoreHashes(os.homedir())||[],undefined)))'




[update_post.lib_errors]
doc = "The detail suffix when the library counted errors. Placeholder: n."
value = " ({n} error(s), fail-open)"

[update_post.hash_files]
doc = "Plugin files that must be there for the shared store-hash listing."
value = ["hooks/lib/devswarm-detect.js", "companion/lib/devswarm-store.js"]

[update_post.stage_timeout_ms]
doc = "Upper bound of one Node stage subprocess, in ms, besides the post-pull budget plus margins."
value = 300000

[update_post.marker_file]
doc = "The one-time stage markers, relative to the home directory."
value = ".anti-hall/update-sweep-state.json"

[update_post.ingest_needs_fn]
doc = "The exported Node function that says whether an installed ingest unit needs a heal when nothing was synced."
value = "ingestUnitNeedsHeal"

[update_post.ingest_heal_fn]
doc = "The exported Node function that heals the ingest daemon."
value = "healIngestDaemon"

[update_post.status_order]
doc = "The order of the stage keys in the status object (the script's object literal; it differs from the order the stages run in)."
value = ["ingestHeal", "reconcile", "fold", "foldAllStores", "healOrphanPartitions", "foldArchivedRows", "reRetireResurrected", "promoteUnclaimed", "ownerKeyMigrate", "cursorHygiene", "mergeSplitBackendStores", "readerCursorsImport", "readerFloorRepair", "appArchivedMarkers", "childSenderLabels", "dualPartitionAcks", "replyStateMigrate", "gateIntentsMigrate", "autoArchivedStateMigrate", "settingsMigrate", "healRegistryRows", "wakeMonitor", "codexGraphifyHooksMigrate"]

[update_post.ingest_dry_run_env]
doc = "The environment switch that turns the DevSwarm store repairs into a preview (`ANTIHALL_INGEST_DRY_RUN`); the value that turns it on is `ingest_dry_run_on`."
value = "ANTIHALL_INGEST_DRY_RUN"

[update_post.ingest_dry_run_on]
doc = "The value of `ingest_dry_run_env` that turns the preview on (the Node passes compare the string exactly)."
value = "1"

[update_post.settings_note]
doc = "Appended to the settings-migrate detail for the legacy key opt-in and the triage cache repair when they did not just skip. Placeholders: id, status, msg."
value = " | {id} {status}: {msg}"

[update_post.key_opt_in_id]
doc = "The legacy Jev key opt-in's step id (migrations.js runLegacyKeyOptInMigration)."
value = "migrate-legacy-key-opt-in"

[update_post.key_opt_in_note_id]
doc = "The name the settings-migrate detail gives the legacy key opt-in (update.js's own label)."
value = "legacy-key-opt-in"

[update_post.key_opt_in_marker]
doc = "The marker key of the one-time legacy Jev key opt-in in update-sweep-state.json."
value = "migrateLegacyKeyOptIn"

[update_post.key_opt_in_version]
doc = "The fixed version the legacy key opt-in is stamped with, so a later reset of the setting is not undone by the next update."
value = "once"

[update_post.key_opt_in_flag]
doc = "The setting the legacy key opt-in turns on (section jev)."
value = "allowLegacyKeyRead"

[update_post.key_opt_in_enabled_key]
doc = "The setting that says Jev is on (section jev)."
value = "enabled"

[update_post.key_opt_in_file_key]
doc = "The setting naming the Jev key file (section jev); empty means the vendor's default file."
value = "keyFile"

[update_post.key_opt_in_transport_key]
doc = "The setting naming the Jev vendor (section jev); it picks the default key file."
value = "transport"

[update_post.key_opt_in_transport_default]
doc = "The vendor when the transport setting resolves to nothing."
value = "vercel"

[update_post.key_opt_in_transport_typesafe]
doc = "The transport value whose default key file is jev.key_file_typesafe (every other value uses jev.key_file_vercel)."
value = "typesafe"

[update_post.key_opt_in_applied]
doc = "The legacy key opt-in already stamped."
value = "already applied (marker)"

[update_post.key_opt_in_unreadable]
doc = "settings.json exists but is not a JSON object: nothing is written and nothing stamped."
value = "settings.json is unreadable \u2014 left untouched, retries next update"

[update_post.key_opt_in_user_set]
doc = "The user already set jev.allowLegacyKeyRead (true or false)."
value = "jev.allowLegacyKeyRead already set by the user \u2014 left as is"

[update_post.key_opt_in_jev_off]
doc = "Jev is not enabled."
value = "Jev is not enabled \u2014 nothing to carry over"

[update_post.key_opt_in_no_file]
doc = "No non-empty Jev key file."
value = "no Jev key file found \u2014 nothing to carry over"

[update_post.key_opt_in_write_failed]
doc = "The setting could not be written (settings lock busy or a write error); nothing stamped, retried next update."
value = "could not write jev.allowLegacyKeyRead: unknown"

[update_post.key_opt_in_fixed]
doc = "The setting was turned on. Placeholder: path (the key file; it is never read or copied)."
value = "ENABLED jev.allowLegacyKeyRead (Jev is on and a key file exists at {path}, so anti-hall keeps reading it; the key was not read or copied). To turn it off: node scripts/settings.js set jev.allowLegacyKeyRead false (then store the key in the plugin's options screen -> jev_api_key)"

[update_post.graphify_hooks_rel]
doc = "The Codex hooks.json the graphify cleanup inspects, relative to the home and then to the working directory (codexGraphifyHooksMigratePostUpdate's two targets)."
value = ".codex/hooks.json"

[update_post.graphify_removed_files]
doc = "Hook scripts retired with graphify: a Codex hook group that registers one of them is removed (install-codex.js REMOVED_GRAPHIFY_FILES)."
value = ["graphify-session.js", "graphify-guard.js", "graphify-reminder.js"]

[update_post.graphify_backup_suffix]
doc = "The backup copy written next to a cleaned hooks.json, before the rewrite. Placeholder: stamp (the ISO time with ':' and '.' turned into '-')."
value = ".bak-{stamp}"

[update_post.graphify_detail]
doc = "The graphify cleanup's detail. Placeholders: changed, removed, errors (the error suffix)."
value = "codex graphify-hooks migrate: {changed} config(s) cleaned, {removed} stale group(s) removed{errors}"

[update_post.graphify_errors]
doc = "The graphify cleanup's error suffix. Placeholder: n."
value = " ({n} target error(s), fail-open)"

[update_post.node_test_env]
doc = "Set by the Node test runner; a store repair is then left to its Node stage (child-sender-labels refuses to run without an explicit home under it)."
value = "NODE_TEST_CONTEXT"
