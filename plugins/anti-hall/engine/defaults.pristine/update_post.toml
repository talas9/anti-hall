[update_post.held_json]
doc = "A stage the native path could not decide this time: nothing was run or written; it runs again on the NEXT update/doctor pass. Counted `held` (and `native_unable` at postpull:<name>). Placeholders: name, why."
value = '{"attempted":false,"held":true,"detail":"{name}: held - {why}; it runs on the NEXT update/doctor pass (idempotent/resumable, nothing lost)"}'

[update_post.why_native_unable]
doc = "The default reason of a held stage: the engine's native path did not answer it."
value = "the native path could not decide it this time"

[update_post.ingest_off_json]
doc = "The ingest heal answer while the engine does not own the ingest daemons (update_post.ingest_native is 0, or the Node daemons drain): nothing is healed or re-installed. Counted `disabled`."
value = '{"attempted":false,"healed":false,"disabled":true,"detail":"ingest heal disabled: the engine does not own the ingest daemons (update_post.ingest_native / devswarm_ingest.mode) - nothing healed"}'

[update_post.ingest_stage_name]
doc = "The accounting name of the ingest heal step."
value = "ingest heal"

[update_post.disabled_json]
doc = "A stage switched off with `enabled = false` in its stage row: the stage runs nothing. Placeholder: name."
value = '{"attempted":false,"disabled":true,"detail":"{name}: disabled (enabled = false in update_post.stages) - skipped"}'

[update_post.store_stages]
doc = "The `native` words of the store stages answered by src/migrate/poststages.rs (the DevSwarm store repairs of devswarm-lib)."
value = ["reader_cursors_import", "reader_floor_repair", "dual_partition_acks", "promote_unclaimed", "cursor_hygiene", "merge_split_backend_stores", "child_sender_labels", "owner_key_migrate", "app_archived_markers", "re_retire_resurrected"]

[update_post.cursor_gc_stale_ms]
doc = "The age (ms) past which a legacy per-instance cursor file counts as a hygiene candidate (cursors.js DEFAULT_INSTANCE_CURSOR_STALE_MS, 7 days)."
value = 604800000

[update_post.cursor_gc_budget]
doc = "The most instance cursor files one hygiene walk scans (cursors.js gcInstanceCursors budget)."
value = 5000

[update_post.journal_dir]
doc = "The directory (inside a store directory) that holds the journal backend's `.ndjson` segments; a store with a segment there AND a sqlite database is split."
value = "journal"

[update_post.anchor_prefix]
doc = "Prefix of the string a pre-Phase-3 build hashed to tag a harness instance: `anc:<pid>:<startMs>`."
value = "anc:"

[update_post.legacy_inst_sep]
doc = "Separator of a legacy per-instance store cursor file (`<id>#inst-<short6>.json`)."
value = "#inst-"

[update_post.legacy_nd_sep]
doc = "Separator of a legacy per-instance NDJSON cursor file (`<id>#nd-<short6>.json`)."
value = "#nd-"

[update_post.legacy_base_suffix]
doc = "Suffix of a partition's legacy baseline cursor file (`<id>#base.json`)."
value = "#base.json"

[update_post.sessions_rel]
doc = "The harness session files, relative to the home directory (`<pid>.json`: pid, startedAt, cwd)."
value = ".claude/sessions"

[update_post.err_read_only]
doc = "The error of a write asked of a store opened read-only for a preview."
value = "store opened read-only"

[update_post.note_store]
doc = "What a store stage swallowed (fail-open) and kept in the event log. Placeholders: stage, what, error."
value = "{stage}: {what}: {error}"

[update_post.cursor_gate]
doc = "The `gate` of the cursor-write journal line the dual-partition reconcile writes."
value = "dual-partition-reconcile"

[update_post.cursor_verb]
doc = "The `verb` of the cursor-write journal line a forward migration writes."
value = "migrate"

[update_post.promote_verb]
doc = "The verb named in the engine log when the summary refresh after a promotion fails."
value = "promote-unclaimed"

[update_post.promote_event_op]
doc = "The `op` of the central log line written for a promoted session."
value = "unclaimed-session-promoted"

[update_post.promote_event_msg]
doc = "The `msg` of that log line. Placeholders: id, marker."
value = "workspace {id} promoted from {marker} to a real session id"


[update_post.ingest_gate_json]
doc = "The ingest heal answer when this is not a DevSwarm session and the cache was synced (healIngestDaemon's gate)."
value = '{"attempted":false,"healed":false,"detail":"not a DevSwarm session — ingest heal skipped (gate closed)"}'

[update_post.ingest_idle_json]
doc = "The ingest heal answer when nothing was synced and the unit does not need healing."
value = '{"attempted":false,"healed":false,"detail":"no cache sync this run and the installed ingest unit classifies ok — nothing to heal"}'

[update_post.ingest_native]
doc = "1 (the default): while the engine owns the DevSwarm ingest daemons (devswarm_ingest.mode = engine) the ingest heal step answers by itself and never runs Node or re-installs a Node unit (units heal retires those). 0: always ask the Node functions."
value = 1

[update_post.ingest_engine_json]
doc = "The ingest heal answer in a DevSwarm session while the engine owns the ingest daemons (nothing is re-installed)."
value = '{"attempted":false,"healed":false,"detail":"ingest is drained by the engine (devswarm_ingest.mode = engine) - no Node ingest daemon to heal"}'

[update_post.deferred_json]
doc = "A stage deferred by the overall post-pull budget. Placeholders: name, budget."
value = '{"attempted":false,"deferred":true,"detail":"{name}: deferred — overall post-pull budget ({budget}ms) exhausted before this stage started; it runs on the NEXT update/doctor pass (idempotent/resumable, nothing lost)"}'





[update_post.lib_errors]
doc = "The detail suffix when the library counted errors. Placeholder: n."
value = " ({n} error(s), fail-open)"



[update_post.marker_file]
doc = "The one-time stage markers, relative to the home directory."
value = ".anti-hall/update-sweep-state.json"



[update_post.status_order]
doc = "The order of the stage keys in the status object (the script's object literal; it differs from the order the stages run in)."
value = ["ingestHeal", "reconcile", "fold", "foldAllStores", "healOrphanPartitions", "foldArchivedRows", "reRetireResurrected", "promoteUnclaimed", "ownerKeyMigrate", "cursorHygiene", "mergeSplitBackendStores", "readerCursorsImport", "readerFloorRepair", "appArchivedMarkers", "childSenderLabels", "dualPartitionAcks", "replyStateMigrate", "gateIntentsMigrate", "autoArchivedStateMigrate", "settingsMigrate", "healRegistryRows", "wakeMonitor", "codexGraphifyHooksMigrate"]

[update_post.ingest_dry_run_env]
doc = "The environment switch that turns the DevSwarm store repairs into a preview (`ANTIHALL_INGEST_DRY_RUN`); the value that turns it on is `ingest_dry_run_on`."
value = "ANTIHALL_INGEST_DRY_RUN"

[update_post.ingest_dry_run_on]
doc = "The value of `ingest_dry_run_env` that turns the preview on (the Node passes compare the string exactly)."
value = "1"

[update_post.settings_note]
doc = "Appended to the settings-migrate detail for the legacy key opt-in and the triage cache repair when they did not just skip. Placeholders: id, status, msg."
value = " | {id} {status}: {msg}"

[update_post.key_opt_in_id]
doc = "The legacy Jev key opt-in's step id."
value = "migrate-legacy-key-opt-in"

[update_post.key_opt_in_note_id]
doc = "The name the settings-migrate detail gives the legacy key opt-in (update.js's own label)."
value = "legacy-key-opt-in"

[update_post.key_opt_in_marker]
doc = "The marker key of the one-time legacy Jev key opt-in in update-sweep-state.json."
value = "migrateLegacyKeyOptIn"

[update_post.key_opt_in_version]
doc = "The fixed version the legacy key opt-in is stamped with, so a later reset of the setting is not undone by the next update."
value = "once"

