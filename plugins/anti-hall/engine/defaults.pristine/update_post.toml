[update_post.ingest_files]
doc = "Plugin files the ingest-daemon heal inspects (relative to the plugin dir); if one is missing Node answers."
value = ["companion/install-devswarm-ingest.js", "hooks/lib/doctor-repair.js", "hooks/lib/devswarm-detect.js"]

[update_post.ingest_gate_json]
doc = "The ingest heal answer when this is not a DevSwarm session and the cache was synced (healIngestDaemon's gate)."
value = '{"attempted":false,"healed":false,"detail":"not a DevSwarm session — ingest heal skipped (gate closed)"}'

[update_post.ingest_idle_json]
doc = "The ingest heal answer when nothing was synced and the unit does not need healing."
value = '{"attempted":false,"healed":false,"detail":"no cache sync this run and the installed ingest unit classifies ok — nothing to heal"}'

[update_post.deferred_json]
doc = "A stage deferred by the overall post-pull budget. Placeholders: name, budget."
value = '{"attempted":false,"deferred":true,"detail":"{name}: deferred — overall post-pull budget ({budget}ms) exhausted before this stage started; it runs on the NEXT update/doctor pass (idempotent/resumable, nothing lost)"}'

[update_post.node_failed_json]
doc = "A stage whose Node function could not be run or printed nothing usable (the stage functions never throw, so this is the engine's own fail-open answer). Placeholders: name, why."
value = '{"attempted":false,"detail":"{name} skipped: the Node stage could not run ({why})"}'

[update_post.node_args]
doc = "Arguments of the Node subprocess that runs one stage function: the code, then the plugin dir, the function name and the options (JSON) as arguments."
value = ["-e"]

[update_post.stage_snippet]
doc = "Runs one exported stage function of update.js with the paths resolved like its main(), and prints its answer as one JSON line. Arguments: plugin dir, function name, options JSON."
value = 'const u=require(process.argv[1]+"/skills/update/scripts/update.js");const o=JSON.parse(process.argv[3]);o.paths=u.resolvePaths(process.env,require("os").homedir());console.log(JSON.stringify(u[process.argv[2]](o)))'

[update_post.hashes_snippet]
doc = "The store hashes, ordered smallest first, as runUpdate computes them once for the store stages. Arguments: plugin dir."
value = 'const os=require("os");const u=require(process.argv[1]+"/skills/update/scripts/update.js");const d=require(process.argv[1]+"/companion/lib/devswarm-store.js");console.log(JSON.stringify(u.orderStoreHashesBySize(d,os.homedir(),d.listStoreHashes(os.homedir())||[],undefined)))'

[update_post.lib_snippet]
doc = "Runs one exported function of a plugin library with the home as its option and prints {r: answer}, {__nofn: true} or {__err: message}. Arguments: plugin dir, library file, function name."
value = 'let o;try{const m=require(process.argv[1]+"/"+process.argv[2]);const f=process.argv[3];o=typeof m[f]!=="function"?{__nofn:true}:{r:m[f]({home:require("os").homedir()})||{}}}catch(e){o={__err:String(e&&e.message?e.message:e)}}console.log(JSON.stringify(o))'

[update_post.lib_nofn]
doc = "A library without the function a stage needs. Placeholders: label, fn."
value = "{label} skipped: this build has no {fn}"

[update_post.lib_raised]
doc = "A library call that threw. Placeholders: label, why."
value = "{label} raised: {why}"

[update_post.lib_errors]
doc = "The detail suffix when the library counted errors. Placeholder: n."
value = " ({n} error(s), fail-open)"

[update_post.hash_files]
doc = "Plugin files that must be there for the shared store-hash listing."
value = ["hooks/lib/devswarm-detect.js", "companion/lib/devswarm-store.js"]

[update_post.stage_timeout_ms]
doc = "Upper bound of one Node stage subprocess, in ms, besides the post-pull budget plus margins."
value = 300000

[update_post.marker_file]
doc = "The one-time stage markers, relative to the home directory."
value = ".anti-hall/update-sweep-state.json"

[update_post.ingest_needs_fn]
doc = "The exported Node function that says whether an installed ingest unit needs a heal when nothing was synced."
value = "ingestUnitNeedsHeal"

[update_post.ingest_heal_fn]
doc = "The exported Node function that heals the ingest daemon."
value = "healIngestDaemon"

[update_post.status_order]
doc = "The order of the stage keys in the status object (the script's object literal; it differs from the order the stages run in)."
value = ["ingestHeal", "reconcile", "fold", "foldAllStores", "healOrphanPartitions", "foldArchivedRows", "reRetireResurrected", "promoteUnclaimed", "ownerKeyMigrate", "cursorHygiene", "mergeSplitBackendStores", "readerCursorsImport", "readerFloorRepair", "appArchivedMarkers", "childSenderLabels", "dualPartitionAcks", "replyStateMigrate", "gateIntentsMigrate", "autoArchivedStateMigrate", "settingsMigrate", "healRegistryRows", "wakeMonitor", "codexGraphifyHooksMigrate"]
