# ah-engine shipped defaults for the native post-pull stages of `update` (the stages update.js runs after the pull).
# Format: see the header of engine.toml. Every text and shape here is update.js's own, word for word; tests/it/update_parity.rs
# compares the command with the script on seeded scratch homes.

[update_post.stages]
doc = """The post-pull stages in the order update.js runs them. `name` is the progress name, `key` the status key. EVERY stage is native (no Node runs): `native` names the engine's own port (the state-file migrations of migrate-state.js, the settings forward-migration, the Codex graphify cleanup, the DevSwarm store repairs), `recon` marks the six reconcile-family stages run by the engine's ports (`dssup::recon`). A stage the native path cannot decide this time answers `held_json` (counted `held` and `native_unable`; it runs on the NEXT update/doctor pass), a stage switched off (`enabled = false`, or the engine-mode switch of a reconcile-family stage) answers `disabled_json`. `budget`: the overall post-pull budget defers the stage. `files`: plugin files the stage needs (relative to the plugin dir). `gate`: the stage is DevSwarm-session-only; `gate_json` is the answer with the gate closed. `state`: keys of update-sweep-state.json that must all hold completedVersion == the new version for the one-time stage to be done; `done_json` is the answer then (`{version}` in its detail). `enabled`: false makes the stage report itself disabled (`disabled_json`) without running anything (read on every run). `done`, `out`, `detail`, `detail_dry`, `errors_text`, `left_text`: the shape of a native store stage's answer (`done` names the count the detail's `{done}` shows, outside and inside the dry-run preview). `empty_when`: a store repair the engine answers itself when the machine has nothing for it to walk (`no_stores`: no DevSwarm store directory; `no_app_db`: no readable DevSwarm app database), with `empty_json` (`empty_dry_json` under the ingest dry-run switch) and the completion stamp the Node pass wrote then (the first `state` key)."""
