# ah-engine shipped defaults for the native post-pull stages of `update` (the stages update.js runs after the pull).
# Format: see the header of engine.toml. Every text and shape here is update.js's own, word for word; tests/it/update_parity.rs
# compares the command with the script on seeded scratch homes.

[update_post.stages]
doc = """The post-pull stages in the order update.js runs them. `name` is the progress name, `key` the status key, `fn` the exported Node stage function the engine runs (a bounded subprocess) when it cannot answer the stage itself. `budget`: the overall post-pull budget defers the stage. `files`: plugin files the stage needs (relative to the plugin dir); if one is missing Node answers. `gate`: the stage is DevSwarm-session-only; `gate_json` is the answer with the gate closed. `state`: keys of update-sweep-state.json that must all hold completedVersion == the new version for the one-time stage to be done; `done_json` is the answer then (`{version}` in its detail). `passes`: the options handed to the Node function (`version`, `hashes` = the store hashes ordered smallest first, `deadline` = the post-pull deadline)."""
value = [
  { name = "reconcile", key = "reconcile", fn = "reconcilePostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = [], passes = [], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — reconcile skipped (gate closed)"}', done_json = '' },
  { name = "fold", key = "fold", fn = "foldMeshPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = [], passes = [], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — fold skipped (gate closed)"}', done_json = '' },
  { name = "fold-all-stores", key = "foldAllStores", fn = "foldAllStoresPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js", "companion/lib/devswarm-store.js"], state = ["foldAllStores"], passes = ["version", "hashes", "deadline"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — fold-all-stores skipped (gate closed)"}', done_json = '{"attempted":true,"stores":0,"retired":0,"forwarded":0,"folded":0,"errors":0,"skippedAlreadyDone":true,"detail":"fold-all-stores: already completed for {version} — skipped (one-time per-version migration)"}' },
  { name = "heal-orphan-partitions", key = "healOrphanPartitions", fn = "healOrphanPartitionsPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js", "companion/lib/devswarm-store.js"], state = ["healOrphanPartitions"], passes = ["version", "hashes", "deadline"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — heal-orphan-partitions skipped (gate closed)"}', done_json = '{"attempted":true,"stores":0,"adopted":0,"forwarded":0,"unhealable":0,"skipped":0,"errors":0,"unhealableSample":[],"skippedAlreadyDone":true,"detail":"heal-orphan-partitions: already completed for {version} — skipped (one-time per-version migration)"}' },
  { name = "fold-archived-rows", key = "foldArchivedRows", fn = "foldArchivedRowsPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = ["foldArchivedRows", "foldArchivedFamilyDescriptors"], passes = ["version", "deadline"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — fold-archived-rows skipped (gate closed)"}', done_json = '{"attempted":true,"retired":0,"forwarded":0,"left":0,"errors":0,"skippedAlreadyDone":true,"detail":"fold-archived-rows: already completed for {version} — skipped (one-time per-version migration)"}' },
  { name = "re-retire-resurrected", key = "reRetireResurrected", fn = "reRetireResurrectedPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = ["reRetireResurrected"], passes = ["version"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — re-retire-resurrected skipped (gate closed)"}', done_json = '{"attempted":true,"candidates":0,"unhealable":0,"errors":0,"skippedAlreadyDone":true,"detail":"re-retire-resurrected: report already shown for {version} — skipped (one-time per-version report)"}' },
  { name = "promote-unclaimed", key = "promoteUnclaimed", fn = "promoteUnclaimedPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = [], passes = [], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — promote-unclaimed skipped (gate closed)"}', done_json = '' },
  { name = "owner-key-migrate", key = "ownerKeyMigrate", fn = "ownerKeyMigratePostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = ["ownerKeyMigrate"], passes = ["version"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — ownerKey migrate skipped (gate closed)"}', done_json = '{"attempted":true,"scanned":0,"backfilled":0,"rehomed":0,"errors":0,"skippedAlreadyDone":true,"detail":"ownerKey migrate: already completed for {version} — skipped (one-time per-version migration)"}' },
  { name = "reply-state-migrate", key = "replyStateMigrate", fn = "", lib = "scripts/migrate-state.js", lib_fn = "migrateReplyState", label = "reply-state migrate", out = ["scanned", "migrated", "alreadyAppendOnly", "errors"], detail = "reply-state migrate: scanned {scanned}, migrated {migrated}, already-append-only {alreadyAppendOnly}{errors}", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/migrate-state.js"], state = [], passes = [], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — reply-state migrate skipped (gate closed)"}', done_json = '' },
  { name = "cursor-hygiene", key = "cursorHygiene", fn = "cursorHygienePostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = ["cursorHygiene"], passes = ["version"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — cursor hygiene skipped (gate closed)"}', done_json = '{"attempted":true,"scanned":0,"deleted":0,"evicted":0,"kept":0,"errors":0,"skippedAlreadyDone":true,"detail":"cursor hygiene: already completed for {version} — skipped (one-time per-version migration)"}' },
  { name = "merge-split-backend-stores", key = "mergeSplitBackendStores", fn = "mergeSplitBackendStoresPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = ["mergeSplitBackendStores"], passes = ["version"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session - split-store merge skipped (gate closed)"}', done_json = '{"attempted":true,"stores":0,"splitStores":0,"messagesMerged":0,"registryMerged":0,"errors":0,"skippedAlreadyDone":true,"detail":"split-store merge: already completed for {version} - skipped (one-time per-version migration)"}' },
  { name = "reader-cursors-import", key = "readerCursorsImport", fn = "readerCursorsImportPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = ["readerCursorsImport"], passes = ["version"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session - reader-cursors import skipped (gate closed)"}', done_json = '{"attempted":true,"stores":0,"partitions":0,"imported":0,"errors":0,"skippedAlreadyDone":true,"detail":"reader-cursors import: already completed for {version} - skipped (one-time per-version migration)"}' },
  { name = "reader-floor-repair", key = "readerFloorRepair", fn = "readerFloorRepairPostUpdate", budget = true, gate = false, files = ["scripts/devswarm.js"], state = ["repairReaderFloors"], passes = ["version"], gate_json = '', done_json = '{"attempted":true,"stores":0,"partitions":0,"repaired":0,"retired":0,"errors":0,"skippedAlreadyDone":true,"detail":"reader-floor repair: already completed for {version} - skipped (one-time per-version migration)"}' },
  { name = "app-archived-markers", key = "appArchivedMarkers", fn = "markAppArchivedPostUpdate", budget = true, gate = false, files = ["scripts/devswarm.js"], state = ["markAppArchived"], passes = ["version"], gate_json = '', done_json = '{"attempted":true,"scanned":0,"marked":0,"errors":0,"skippedAlreadyDone":true,"detail":"app-archived markers: already completed for {version} - skipped (one-time per-version migration)"}' },
  { name = "child-sender-labels", key = "childSenderLabels", fn = "childSenderLabelsPostUpdate", budget = true, gate = false, files = ["scripts/devswarm.js"], state = ["repairChildSenderLabels"], passes = ["version"], gate_json = '', done_json = '{"attempted":true,"labels":0,"aliased":0,"retired":0,"forwarded":0,"errors":0,"skippedAlreadyDone":true,"detail":"child-sender-labels: already completed for {version} - skipped (one-time per-version migration)"}' },
  { name = "dual-partition-acks", key = "dualPartitionAcks", fn = "dualPartitionAcksPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js"], state = ["reconcileDualPartitionAcks"], passes = ["version"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session - dual-partition-acks skipped (gate closed)"}', done_json = '{"attempted":true,"stores":0,"raised":0,"rows":0,"errors":0,"skippedAlreadyDone":true,"detail":"dual-partition-acks: already completed for {version} - skipped (one-time per-version migration)"}' },
  { name = "gate-intents-migrate", key = "gateIntentsMigrate", fn = "", lib = "scripts/migrate-state.js", lib_fn = "migrateGateIntents", label = "gate-intents migrate", out = ["scanned", "migrated", "alreadyCurrent", "errors"], detail = "gate-intents migrate: scanned {scanned}, migrated {migrated}, already-current {alreadyCurrent}{errors}", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/migrate-state.js"], state = [], passes = [], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — gate-intents migrate skipped (gate closed)"}', done_json = '' },
  { name = "auto-archived-state-migrate", key = "autoArchivedStateMigrate", fn = "autoArchivedStateMigratePostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/migrate-state.js"], state = [], passes = [], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — auto-archived-state migrate skipped (gate closed)"}', done_json = '' },
  { name = "settings-migrate", key = "settingsMigrate", fn = "settingsMigratePostUpdate", budget = true, gate = false, files = [], state = [], passes = ["version"], gate_json = '', done_json = '' },
  { name = "heal-registry-rows", key = "healRegistryRows", fn = "healRegistryPostUpdate", budget = true, gate = true, files = ["hooks/lib/devswarm-detect.js", "scripts/devswarm.js", "companion/lib/devswarm-store.js"], state = ["healRegistry"], passes = ["version", "hashes"], gate_json = '{"attempted":false,"detail":"not a DevSwarm session — heal-registry-rows skipped (gate closed)"}', done_json = '{"attempted":true,"checked":0,"healed":0,"rehomed":0,"stores":[],"skippedAlreadyDone":true,"detail":"heal-registry-rows: already completed for {version} — skipped (one-time per-version migration)"}' },
  { name = "wake-monitor", key = "wakeMonitor", fn = "wakeMonitorPostUpdate", budget = false, gate = true, files = ["hooks/lib/devswarm-detect.js"], state = [], passes = [], gate_json = '{"attempted":false,"shipped":false,"live":false,"detail":"not a DevSwarm session — wake-monitor skipped (gate closed)"}', done_json = '' },
  { name = "codex-graphify-hooks-migrate", key = "codexGraphifyHooksMigrate", fn = "codexGraphifyHooksMigratePostUpdate", budget = false, gate = false, files = [], state = [], passes = [], gate_json = '', done_json = '' },
