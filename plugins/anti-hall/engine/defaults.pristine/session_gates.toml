# ah-engine shipped defaults for the session-start and prompt-time gates ported from Node: jev-weekly-scorecard,
# jev-review-reminder and repair-on-reload. Each check answers "nothing to say" itself when the Node hook would print and
# write nothing, and defers to the Node hook otherwise (the notices and the repair need the Jev report, the review log and
# the migration engine, which stay in Node). Format: see the header of engine.toml.

[session_gates.judge_child_env]
doc = "Environment variable the judge child process runs with; every one of these hooks does nothing in it."
value = "ANTIHALL_JUDGE_CHILD"

[session_gates.judge_child_value]
doc = "The value of that variable that marks the judge child."
value = "1"

[session_gates.child_branch_env]
doc = "Environment variable DevSwarm sets in a child workspace (a non-blank value marks the session as a child)."
value = "DEVSWARM_SOURCE_BRANCH"

[session_gates.entrypoint_env]
doc = "Environment variable that names how the host was started."
value = "CLAUDE_CODE_ENTRYPOINT"

[session_gates.headless_prefix]
doc = "Entry point names starting with this are non-interactive (SDK) runs."
value = "sdk-"

[session_gates.anti_hall_dir]
doc = "The anti-hall directory under the home directory."
value = ".anti-hall"

[session_gates.jev_config_file]
doc = "The legacy Jev configuration file, relative to the anti-hall directory."
value = "jev.json"

[session_gates.codex_tool]
doc = "The tool name only Codex has; its presence marks a Codex payload."
value = "apply_patch"

[session_gates.codex_fields]
doc = "Payload fields that are both non-empty strings on every Codex turn."
value = ["turn_id", "model"]

[session_gates.agent_key_markers]
doc = "Payload keys whose presence (with a value other than null) marks a subagent turn."
value = ["agent_id", "agent_type"]

[session_gates.sidechain_flags]
doc = "Payload keys that mark a sidechain (subagent) turn when exactly true."
value = ["isSidechain", "is_sidechain"]

[session_gates.jev_enabled_setting]
doc = "The setting jev.enabled (off by default; a legacy jev.json value is honoured)."
value = { section = "jev", key = "enabled", type = "boolean", env = "ANTIHALL_JEV", option = "jev_enabled", default = false, legacy_file = "jev.json", legacy_key = "enabled" }

[session_gates.jev_semantic_judge_setting]
doc = "The setting jev.semanticJudge (off by default)."
value = { section = "jev", key = "semanticJudge", type = "boolean", env = "ANTIHALL_SEMANTIC_JUDGE", option = "jev_semantic_judge", default = false }

[session_gates.default_event]
doc = "The hook event name an advisory carries when the payload names none (a non-empty string hook_event_name wins)."
value = "SessionStart"

[session_gates.test_markers]
doc = "Environment variables that mark a test run; with one set, the Node hook refuses to use the real (password database) home directory."
value = ["NODE_TEST_CONTEXT", "ANTIHALL_TEST", "ANTIHALL_TEST_ISOLATION"]

[session_gates.allow_real_home_env]
doc = "Environment variable that lets a test run use the real home directory anyway."
value = "ANTIHALL_ALLOW_REAL_HOME_TEST"

# ---- jev-weekly-scorecard ----------------------------------------------------------------------------------

[jev_weekly.summary]
doc = "One-line description of the jev-weekly-scorecard check in the generated reference."
value = "Stays silent when the weekly Jev scorecard notice cannot be due (Jev off, notice off, child workspace, checked within a week); when it is due it builds the 7-day verdicts (the jev-report scorecard), names the first integration whose mode does not yet match its KEEP or REMOVE verdict and stamps the weekly latch; a week whose scorecard could not be built is not consumed."

[jev_weekly.notice_setting]
doc = "The setting jev.weeklyNotice (on by default; a legacy jev.json value is honoured)."
value = { section = "jev", key = "weeklyNotice", type = "boolean", env = "", option = "jev_weekly_notice", default = true, legacy_file = "jev.json", legacy_key = "weeklyNotice" }

[jev_weekly.latch_file]
doc = "The weekly latch, relative to the anti-hall directory: the time of the last check."
value = "state/jev-weekly-notice.json"

[jev_weekly.latch_key]
doc = "The key of the weekly latch that holds the time of the last check."
value = "lastCheckedTs"

[jev_weekly.period_ms]
doc = "How often the scorecard check may run."
value = 604800000
unit = "ms"
min = 1000
max = 31536000000

[jev_weekly.guard]
doc = "The guard name on the weekly scorecard notice."
value = "jev-scorecard"

[jev_weekly.notice_what]
doc = "What the weekly scorecard notice says: {id} (the integration), {to} (jev_weekly.to_on or jev_weekly.to_off)."
value = "{id} is ready to switch {to}."

[jev_weekly.notice_instead]
doc = "What the weekly scorecard notice tells the reader to do."
value = "run /anti-hall:jev."

[jev_weekly.to_on]
doc = "The direction word of a KEEP verdict whose integration is not yet on."
value = "ON"

[jev_weekly.to_off]
doc = "The direction word of a REMOVE verdict whose integration is not yet off."
value = "OFF"

[jev_weekly.mode_on]
doc = "The Jev mode name of an integration that is on."
value = "on"

[jev_weekly.mode_off]
doc = "The Jev mode name of an integration that is off."
value = "off"

# ---- jev-review-reminder -----------------------------------------------------------------------------------

[jev_review.summary]
doc = "One-line description of the jev-review-reminder check in the generated reference."
value = "SessionStart notices of Jev: the one-time legacy-key notice, the recommend-Jev notice (Jev off) and the review-due line (Jev on), with their state files kept by the engine; answers every case itself."

[jev_review.recommend_setting]
doc = "The setting jev.recommendNotice (on by default): the one-in-30-days notice recommending Jev while it is off."
value = { section = "jev", key = "recommendNotice", type = "boolean", env = "ANTIHALL_JEV_RECOMMEND_NOTICE", option = "jev_recommend_notice", default = true }

[jev_review.recommend_latch_file]
doc = "The recommend notice latch, relative to the anti-hall directory: the time it was last shown."
value = "state/jev-recommend-notice.json"

[jev_review.latch_key]
doc = "The key of the recommend notice latch that holds the time it was last shown."
value = "lastShownTs"

[jev_review.headless_setting]
doc = "The setting jev.recommendNoticeHeadless (off by default): show the recommend notice in a non-interactive run too."
value = { section = "jev", key = "recommendNoticeHeadless", type = "boolean", env = "ANTIHALL_JEV_NOTICE_HEADLESS", option = "", default = false }

[jev_review.protocol_level_setting]
doc = "The setting context.protocolLevel; while jev.recommendNoticeHeadless is not set anywhere, the full level turns the headless notice on."
value = { section = "context", key = "protocolLevel", type = "enum", values = ["compact", "full"], env = "ANTIHALL_PROTOCOL_LEVEL", option = "", default = "compact" }

[jev_review.protocol_full]
doc = "The protocol level that turns the headless recommend notice on by default."
value = "full"

[jev_review.recommend_notice]
doc = "The recommend-Jev notice the session receives (the directive line, then the short notice), byte for byte."
value = "Tell the user now, verbatim, bold kept:\n**Recommended: enable Jev, the optional classifier, for more accurate guards.**\nWithout it the guards rely on pattern matching alone; with it they also get a model's second opinion (by default it can only add blocks the patterns miss, never remove one).\nOptional and off by default: needs your own API key, sends the text a guard judges to the provider you choose, uses credits. Details: README \"Enable Jev\" and PRIVACY.md.\nEnable: say \"activate jev\". Turn this reminder off: set `jev.recommendNotice` to false."

[jev_review.remind_every_ms]
doc = "How long after it was shown the recommend notice stays quiet."
value = 2592000000
unit = "ms"
min = 1000
max = 31536000000

# ---- jev-review-reminder: Jev on (review line and one-time legacy-key notice) -------------------------------------

[jev_review.reminder_setting]
doc = "The setting jev.reviewReminder (on by default): the session-start line that says a Jev shadow review is due."
value = { section = "jev", key = "reviewReminder", type = "boolean", env = "ANTIHALL_JEV_REVIEW_REMINDER", option = "jev_review_reminder", default = true }

[jev_review.after_days_setting]
doc = "The setting jev.reviewAfterDays: days an integration must have been in shadow (and since its last review) before a review is due."
value = { section = "jev", key = "reviewAfterDays", type = "number", env = "ANTIHALL_JEV_REVIEW_AFTER_DAYS", option = "jev_review_after_days", min = 1, max = 365, default = 7 }

[jev_review.after_days_fallback]
doc = "The days used when the resolved jev.reviewAfterDays is zero or not a number (Node: `Number(x) || 7`)."
value = 7

[jev_review.min_decisions_setting]
doc = "The setting jev.reviewMinDecisions: decisions an integration must have logged before a review is due."
value = { section = "jev", key = "reviewMinDecisions", type = "number", env = "ANTIHALL_JEV_REVIEW_MIN_DECISIONS", option = "jev_review_min_decisions", min = 0, max = 1000000000, default = 30 }

[jev_review.min_decisions_fallback]
doc = "The decisions used when the resolved jev.reviewMinDecisions is not a finite number (Node: `Number.isFinite(x) ? x : 30`)."
value = 30

[jev_review.max_named]
doc = "How many due integrations the review line names before it says how many more there are."
value = 3

[jev_review.max_line_chars]
doc = "The longest the review line may be (UTF-16 units); it names fewer integrations before it is cut."
value = 320

[jev_review.line_item]
doc = "How one due integration is named in the review line. Placeholders: {id}, {days}, {decisions}."
value = "{id} ({days}d, {decisions} decisions)"

[jev_review.line_list_joiner]
doc = "Between the named integrations of the review line."
value = ", "

[jev_review.line_more]
doc = "Appended to the list of the review line when more integrations are due than are named. Placeholder: {n}."
value = ", +{n} more"

[jev_review.line_text]
doc = "The review line, byte for byte. Placeholder: {list}."
value = "\U0001F4A1 anti-hall \u00B7 jev-review: review due for {list}.\nDo instead: tell the owner and offer to run `/anti-hall:jev report` (they asked to be reminded)."

[jev_review.line_ellipsis]
doc = "Ends a review line that is still over the limit after naming one integration."
value = "\u2026"

[jev_review.line_joiner]
doc = "Between the notices of the session start (the legacy-key notice, the recommend notice and the review line)."
value = "\n"

[session_gates.key_kind_jev]
doc = "The name of the Jev kind in the legacy-key notice state."
value = "jev"

[session_gates.key_kind_anthropic]
doc = "The name of the Anthropic kind in the legacy-key notice state."
value = "anthropic"

[session_gates.key_state_file]
doc = "The legacy-key notice state, relative to the anti-hall directory: which kinds were already named."
value = "legacy-key-notice-state.json"

[session_gates.allow_anthropic_setting]
doc = "The home-only setting guards.allowAnthropicEnvKey: whether ANTHROPIC_API_KEY may count as a key (off by default; no env name, no plugin option)."
value = { section = "guards", key = "allowAnthropicEnvKey", type = "boolean", env = "", aliases = [], option = "", default = false }

[session_gates.key_shown_member]
doc = "The member of the legacy-key notice state that holds the time each kind was named."
value = "shown"

[session_gates.key_binding_member]
doc = "The member of `shown` that records the generic-key binding note."
value = "jevBinding"

[session_gates.settings_jev_member]
doc = "The member of the home settings file that holds the Jev settings."
value = "jev"

[session_gates.generic_vendor_member]
doc = "The member of the Jev settings that records which vendor the generic key is bound to (jev.genericKeyVendor)."
value = "genericKeyVendor"

[session_gates.key_default_vendor]
doc = "The vendor a generic Jev key stays bound to until it is bound explicitly (the schema default of jev.transport)."
value = "vercel"

[session_gates.key_what_jev]
doc = "How the legacy-key notice calls a legacy Jev key."
value = "Jev key file/env var"

[session_gates.key_what_anthropic]
doc = "How the legacy-key notice calls a legacy Anthropic key."
value = "ANTHROPIC_API_KEY env var"

[session_gates.key_option_jev]
doc = "The plugin option that holds the Jev key."
value = "jev_api_key"

[session_gates.key_option_anthropic]
doc = "The plugin option that holds the Anthropic key."
value = "anthropic_api_key"

[session_gates.key_setting_jev]
doc = "The opt-in setting that keeps a legacy Jev key in use."
value = "jev.allowLegacyKeyRead"

[session_gates.key_setting_anthropic]
doc = "The opt-in setting that keeps a legacy Anthropic key in use."
value = "guards.allowAnthropicEnvKey"

[session_gates.key_migration_note]
doc = "The legacy-key notice for one kind. Placeholders: {what}, {option}, {setting}."
value = "a legacy {what} exists but anti-hall no longer reads credentials from this machine: re-enter your key in the plugin's options screen (anti-hall -> {option}), or enable {setting} to keep using the existing key."

[session_gates.key_binding_note]
doc = "The note that a generic Jev key is bound to the default vendor while the transport is typesafe. Placeholder: {vendor}."
value = "your generic Jev key (jev_api_key / jev.keyFile) is bound to {vendor} and is NOT sent to typesafe. Enter a typesafe key (jev-setup.js set-key --transport typesafe, or jev_typesafe_api_key in the plugin's options screen), or, if that generic key is a typesafe key, bind it: jev-setup.js bind-generic-key --vendor typesafe."

[session_gates.key_notice_prefix]
doc = "Starts the one-time legacy-key notice."
value = "anti-hall (shown once): "

[session_gates.key_notice_joiner]
doc = "Between the parts of the one-time legacy-key notice."
value = " "

# ---- repair-on-reload --------------------------------------------------------------------------------------

[repair_reload.summary]
doc = "One-line description of the repair-on-reload check in the generated reference."
value = "Stays silent when no repair can start (switch off, subagent turn, skipped, nothing pending at the running version, cooldown); otherwise defers to the Node hook, which takes the lock and starts the detached repair (port of the gates of repair-on-reload.js)."

[repair_reload.guard_name]
doc = "Hook name in the skip file."
value = "repair-on-reload"

[repair_reload.setting]
doc = "The switch maintenance.repairOnReload (on by default)."
value = { section = "maintenance", key = "repairOnReload", type = "boolean", env = "ANTIHALL_REPAIR_ON_RELOAD", option = "maintenance_repair_on_reload", default = true }

[repair_reload.cooldown_file]
doc = "The record of the last repair start, relative to the anti-hall directory."
value = "repair-on-reload.last.json"

[repair_reload.cooldown_ms]
doc = "How long after a repair start no other one starts at the same plugin version."
value = 3600000
unit = "ms"
min = 1000
max = 31536000000

[repair_reload.migration_keys]
doc = "The keys of the data migrations a reload repairs (the non-opt-in migrations); a test compares this list with the Node one, so a migration added there fails the build until it is added here."
value = [
  "mergeSplitBackendStores", "foldAllStores", "healOrphanPartitions", "foldArchivedRows", "foldArchivedFamilyDescriptors",
  "repairReaderFloors", "reconcileDualPartitionAcks", "markAppArchived", "retireStaleArchivedMarkers",
  "repairChildSenderLabels", "foldReadReceipts",
]

[repair_reload.version_re]
doc = "A plain three-part version (JavaScript regex)."
value = '^\d+\.\d+\.\d+$'
