# ah-engine shipped defaults for the handover and Codex hooks ported from Node (handover-resume, precompact-snapshot,
# codex-availability, codex-quota-detect, codex-nudge) and the JavaScript-behavior helpers they share (checks::jsport).
#
# Every pattern, message, file name, setting name and limit of these checks lives here. Regex sources use JavaScript
# syntax (the Node hooks are the authority) and are translated by `checks::guardkit::jsre`. Format: see the header of
# engine.toml.

[codex_handover.avail_context_codex]
doc = "The availability text for a Codex session (no Claude models, Workflow scripts or codex:codex-rescue agent type)."
value = "Codex binary detected on PATH (per a SessionStart PATH probe). This is NECESSARY BUT NOT SUFFICIENT -- it does NOT prove Codex is authenticated or functional, only that a spawn is worth ATTEMPTING. If a nested Codex run fails or returns nothing, fall back one gpt tier down for that seat -- that check is still the real backstop no matter what this probe says. Coordinators should read ~/.anti-hall/codex-availability.json instead of re-probing."

[codex_handover.avail_event]
doc = "The hook event name in the availability advisory."
value = "SessionStart"

[codex_handover.avail_guard]
doc = "The guard id the availability messages answer to."
value = "codex-availability"

[codex_handover.avail_instead]
doc = "Advice line of the availability tip."
value = "Workflow scripts have no filesystem and cannot read this fact, so pass args.codexAvailable=true into ship-it/deadly-loop Workflow invocations (same pattern as args.fableAvailable) so the Critic seat attempts agentType:'codex:codex-rescue' first. Outside a Workflow, prefer agentType:'codex:codex-rescue' for the deadly-loop/ship-it Critic seat and for everyday correctness-review plus a share of implementation load; coordinators there should read ~/.anti-hall/codex-availability.json instead of re-probing."

[codex_handover.avail_note_instead]
doc = "Advice of the unavailability warning; {tier} is where to route the review."
value = "route correctness review to {tier} until then."

[codex_handover.avail_note_what]
doc = "Headline of the warning that Codex is unavailable; {until} is an ISO time and {reason} the recorded reason."
value = "Codex unavailable until {until} ({reason})."

[codex_handover.avail_source]
doc = "The source recorded with a PATH probe result."
value = "path-probe"

[codex_handover.avail_summary]
doc = "One-line description of the codex-availability check in the generated reference."
value = "SessionStart: probes PATH for a real codex executable, records it, folds a Codex job-log usage-limit error into the quota record and tells the session (port of codex-availability.js)."

[codex_handover.avail_tier_claude]
doc = "Where a Claude session routes review while Codex is unavailable."
value = "Sonnet"

[codex_handover.avail_tier_codex]
doc = "Where a Codex session routes review while Codex is unavailable."
value = "a lower gpt tier"

[codex_handover.avail_what]
doc = "Headline of the availability tip when the Codex binary is on PATH."
value = "Codex binary detected on PATH (per a SessionStart PATH probe)."

[codex_handover.avail_why]
doc = "Reason line of the availability tip."
value = "Necessary but not sufficient: it does not prove Codex is authenticated or functional, only that a spawn is worth attempting. If a Codex spawn returns null at runtime, take the documented Opus/Sonnet fallback; that null-check is still the real backstop."

[codex_handover.availability_file]
doc = "The shared Codex availability and quota file, relative to the home directory."
value = ".anti-hall/codex-availability.json"

[codex_handover.branch_prefix]
