  "  N. DISTRIBUTE MODELS - NEVER ALL-FRONTIER. An OMITTED model inherits the orchestrator (a flagship), so a fan-out of omitted seats silently becomes an all-flagship swarm that torches the usage limit. Set model/reasoning EXPLICITLY per seat by task shape: planning/architecture/validation/debate and correctness/subtle-bug review -> frontier tier (reasoning xhigh); implementation -> workhorse tier (reasoning medium); mechanical/leaf/navigation -> fast tier. Resolve the tier from the live model catalog when you act; if it cannot be resolved with confidence, omit the model and let the CLI use its configured default. Get an independent SECOND OPINION on substantial code changes from a separate frontier-tier reviewer sub-agent, never from the author. If a model is unavailable or rate-limited, fall back one tier down for the review - NEVER retry-loop it, and do not strand the main agent waiting on it.",
]
