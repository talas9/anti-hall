[devswarm_role.pg_gone]
doc = "The gone-worktree note: {ids}, {verb}."
value = "NOTE — {ids} {verb} a GONE worktree at its recorded path — this cannot be cleared by cd-ing in. WARNING: a MOVED (not retired) worktree reads exactly the same way — this is a path-existence check only, not proof the workspace is dead — and `--ack-as-owner` bypasses ownership with no liveness check of its own, so do not apply it on this signal alone. FIRST inspect with `devswarm.js inbox read <id>` (read-only, works from any project/cwd, and will NOT clear this block either way) to see what is actually pending. Only once you have CONFIRMED the workspace is genuinely retired (not just relocated), clear it with `devswarm.js inbox ack <id> --ack-as-owner` — the sanctioned cross-workspace-ack override for a confirmed-dead workspace's backlog. "

[devswarm_role.pg_inspect]
