value = "INSPECT the unread backlog via `devswarm.js inbox peek-primary <id>` (read-only — does not advance any cursor) to see what is pending for each workspace, then follow up with that workspace as needed; a workspace's own cursor is only advanced by that workspace reading its own inbox, never by this Primary. "

