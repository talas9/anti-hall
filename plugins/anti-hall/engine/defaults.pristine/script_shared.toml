# Shared-include settings (a script compiled once per worker interpreter instead of once per check) and their metrics.
# Kept in its own file so the pinned pristine script.toml / telemetry.toml stay at their released bytes; this file is
# mirrored byte for byte in defaults.pristine/, so the failover copy carries the same required keys.

[script.msg_no_evaluator]
doc = "Reason logged when a shared include (script.shared_includes) does not evaluate to its evaluator function. Placeholder: {module}."
value = "{module}: the shared include defines no evaluator"

[script.shared_includes]
doc = "Scripts, among those named in `script.includes` (and checks of the same name), that are compiled ONCE per worker interpreter instead of once per check built on them. Each is evaluated as the body of one function (`script.module_scope`); a check built on it evaluates its own files inside that scope (so it sees every declaration of the include with live bindings, as when the include was spliced in front of it) and the check of the same name answers from the include's own entry. Before this, command.js (231 KB) was compiled into each of the five checks that build on it plus the command check, and git.js (157 KB) into git-audit plus the git check, in each of the worker interpreters, and every reload after the memory limit unloaded one compiled it again. A script is listed here only if it keeps no per-check state other than what a call sets and clears itself (command.js `cmdBegin`/`cmdEnd`, git.js its per-call state)."
value = ["command", "git"]

[script.module_scope]
doc = "How a shared include (`script.shared_includes`) is compiled into a worker interpreter: its source as the body of a function that returns an evaluator, so its declarations stay private to the module and a check's body evaluated through the evaluator sees them. Placeholder: {source}."
value = "(function () {\n{source}\n;return function (__src) { return eval(__src); };\n}).call(globalThis)"

[script.module_entry]
doc = "What the check of a shared include's own name evaluates through that include's evaluator: the include's entry function (placeholder {entry}, script.entry)."
value = "typeof {entry} === 'function' ? {entry} : undefined"

[script.modules_global]
doc = "Global object in which each worker interpreter keeps the evaluators of its shared includes, by script name."
value = "__ah_modules"

[metric.script_limit_trips]
doc = "Times a worker interpreter's memory limit acted: kind `soft` unloaded the least recently called checks down to the low-water mark (mem.quickjs_soft_bytes), kind `hard` recycled the interpreter (mem.quickjs_hard_bytes). Steady load on a limit sized to the working set keeps both at zero."
value = { kind = "counter", unit = "trips", labels = ["kind"] }

[metric.script_unloads]
doc = "Checks unloaded from a worker interpreter because its memory limit was reached."
value = { kind = "counter", unit = "checks", labels = [] }

[metric.script_reloads]
doc = "Checks rebuilt from their source on the next call after the memory limit unloaded them: the cost of a limit set under the working set (each is a read, parse and compile). Flat at zero under steady load when the limit fits."
value = { kind = "counter", unit = "checks", labels = [] }

[metric.script_module_loads]
doc = "Shared includes (script.shared_includes) compiled into a worker interpreter: once per interpreter and file version, not once per check that builds on them."
value = { kind = "counter", unit = "modules", labels = [] }
