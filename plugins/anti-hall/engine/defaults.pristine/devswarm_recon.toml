doc = "What Node runs for ONE item of a deferred stage the engine handed back (a store key, or rows / family for the archived stage): the very function the stage calls for that item, with the supervisor gate open. Arguments: root, home, stage, item, absolute deadline in ms. It prints the function's result as JSON."
value = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";process.env.ANTIHALL_DEVSWARM_SUPERVISOR="on";const D=require(process.argv[1]+"/scripts/devswarm.js");const home=process.argv[2],stage=process.argv[3],item=process.argv[4],deadline=Number(process.argv[5]),env=process.env,cwd=process.cwd();let r;try{if(stage==="fold-all-stores")r=D.foldMeshDuplicates(home,{cwd,env,repoKey:item,deadline});else if(stage==="heal-orphan-partitions")r=D.healOrphanPartitions(home,{cwd,env,repoKey:item,deadline});else if(stage==="heal-registry-rows")r=D.healRegistry(home,item,{cwd,env});else if(stage==="fold-archived-rows")r=item==="family"?D.foldArchivedFamilyDescriptors(home,{cwd,env,deadline}):D.foldArchivedRegistryRows(home,{cwd,env,deadline});else throw new Error("unknown stage")}catch(e){r={ok:false,error:String(e&&e.message||e),threw:true}}console.log(JSON.stringify(r===undefined?null:r))'

