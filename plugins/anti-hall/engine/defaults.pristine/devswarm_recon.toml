[devswarm_recon.node_names_snippet]
doc = "What Node runs to give a project's workspaces without a cached name the title hivecontrol's workspace list has for them. Arguments: the plugin root, the home, the project's worktree, the ids as JSON, the clock. It prints how many names it wrote."
value = 'process.env.HOME=process.argv[2];const root=process.argv[1],home=process.argv[2],cwd=process.argv[3],ids=JSON.parse(process.argv[4]),NOW=Number(process.argv[5]);const core=require(root+"/scripts/devswarm-lib/core.js"),RD=require(root+"/scripts/devswarm-lib/roster-diag.js");let n=0;try{const missing=ids.filter((id)=>!core.names.readName(home,id));if(missing.length>0){const lr=core.hcRun({args:["workspace","list","all"],env:process.env,cwd,timeout:RD.LIST_CHILDREN_TIMEOUT_MS});if(lr&&lr.ok){const m=new Map(RD.parseChildrenList(lr.raw).filter((e)=>e.id).map((e)=>[e.id,e.label]));for(const id of missing){const l=m.get(id);if(l&&core.names.writeName(home,id,l,NOW))n++}}}}catch(e){}console.log(JSON.stringify({backfilled:n}))'

