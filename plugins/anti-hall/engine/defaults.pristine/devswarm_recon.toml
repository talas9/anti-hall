# ah-engine shipped defaults for the native port of DevSwarm `reconcile` and the sweep tail (src/dssup/recon). Format: see the header of
# engine.toml. Nothing here is compiled into the binary. Every decision the engine takes over from Node here is witnessed first: Node's
# own function runs on a scratch mirror, the engine's op list runs on another, and only when the two end in the same state is the op
# list applied to the real home (design: RECONCILE-SWEEP-DESIGN.md).

[devswarm_recon.node_snippet]
doc = "What Node runs for the witness: a dispatcher over the recorded calls, each run in order against the scratch mirror with Date.now pinned to the engine's clock and HOME, USERPROFILE and the central log directory pointed into the mirror. Arguments: the plugin root, the mirror home, the pinned clock, the calls as JSON. It prints the list of return values."
value = 'const NOW=Number(process.argv[3]);Date.now=()=>NOW;const root=process.argv[1],home=process.argv[2],calls=JSON.parse(process.argv[4]);process.env.HOME=home;process.env.USERPROFILE=home;process.env.ANTI_HALL_LOG_DIR=home+"/.anti-hall/logs";const fs=require("fs"),path=require("path");const L=(m)=>require(root+"/"+m);const run=(c)=>{const a=c.args||{};switch(c.fn){case "sweepState":L("companion/devswarm-supervisor.js").writeReconcileSweepState(home,fs,{lastRunAt:a.lastRunAt});return null;case "resumeWrite":L("scripts/devswarm-lib/reconcile.js").writeReconcileResume(home,a.repoKey,a.ids);return null;case "nameWrite":return L("companion/lib/devswarm-names.js").writeName(home,a.id,a.name,a.now);case "repoUnknownRecord":return L("companion/lib/devswarm-repo-unknown.js").record(home,a.repoKey,a.scope,a.reason,a.now);case "repoUnknownClear":L("companion/lib/devswarm-repo-unknown.js").clear(home,a.repoKey,a.scope);return null;case "activeCache":{process.env.ANTIHALL_DEVSWARM_ACTIVE_FLOOR_PCT=String(a.floorPct);const r=L("companion/lib/devswarm-archived-cache.js").writeActiveCache({home,byRepoKey:a.byRepoKey,now:a.now,env:process.env});return r===null?null:path.relative(home,r)}case "sampling":{const S=L("companion/lib/devswarm-startup-sampling.js");return S.runSamplingPass(a.ids.map((id)=>({id})),{home,env:process.env,now:a.now,maxProbe:a.maxProbe,run:(id)=>a.probes[id]||{ok:false,error:"no probe"}})}case "healRegistry":return L("scripts/devswarm-lib/fold.js").healRegistry(home,a.repoKey,{});case "healRows":{const F=L("scripts/devswarm-lib/fold.js");return a.ids.map((id)=>F.rehomeMiskeyedRow(home,id,a.repoKey,{}))}case "pull":{const sd=path.join(path.dirname(home),"stub-bin");fs.mkdirSync(sd,{recursive:true});fs.writeFileSync(path.join(sd,"hivecontrol"),a.stub,{mode:493});const env=Object.assign({},process.env,{HOME:home,USERPROFILE:home,PATH:sd+":"+(process.env.PATH||""),ANTIHALL_RECONCILE_SWEEP:"1",ANTIHALL_INGEST_DRY_RUN:"1"});delete env.CLAUDE_CODE_SESSION_ID;delete env.DEVSWARM_BUILDER_ID;delete env.ANTIHALL_DEVSWARM_HIVECONTROL;process.chdir(a.cwd);const r=L("scripts/devswarm.js").run(["inbox","pull",a.id],{home,env,cwd:a.cwd,now:NOW});return r&&r.result?{ok:!!r.result.ok}:null}default:throw new Error("unknown call "+c.fn)}};const out=[];for(const c of calls){try{const r=run(c);out.push(r===undefined?null:r)}catch(e){out.push({threw:String(e&&e.message||e)})}}console.log(JSON.stringify(out))'

