[devswarm_recon.node_tail_snippet]
doc = "What Node runs for the rest of the reconcile sweep once the engine has reconciled the projects: Node's own reconcileSweepIfDue (the mesh fold, the active-workspace probe and its cache, the start-up sampling, the log line) with the cool-down already honoured and the engine's results answering the reconcile step; a project the engine did not answer is reconciled by Node inside the same call. Arguments: the plugin root, the home, the file that holds the engine's results keyed by worktree."
value = 'process.env.HOME=process.argv[2];process.env.ANTIHALL_CALLER="supervisor";const S=require(process.argv[1]+"/companion/devswarm-supervisor.js");const home=process.argv[2];const pre=JSON.parse(require("fs").readFileSync(process.argv[3],"utf8"));const r=S.reconcileSweepIfDue({home,cooldownMs:0,deps:{runReconcile:(wt)=>{if(Object.prototype.hasOwnProperty.call(pre,wt))return pre[wt];const D=require(process.argv[1]+"/scripts/devswarm.js");return D.run(["reconcile"],{home,env:process.env,cwd:wt}).result}}});console.log(JSON.stringify(S.compactReconcileForLog(r,null).line))'

