[devswarm_recon.stub_hivecontrol]
doc = "The recording hivecontrol Node's witness run is given instead of the real one: it answers the non-destructive message count with 0 (so the pull only replays what the delivery log holds) and refuses every other call, so a witness can never read, mark or change anything natively."
value = """#!/bin/sh
if [ "$1 $2" = "workspace message-count" ]; then echo 0; exit 0; fi
echo "witness stub: refused $*" >&2
exit 97
"""

[devswarm_recon.env_strip]
doc = "Environment variables a sweep drain removes: it speaks for no session, so it must not carry the identity of the session that started it (the builder id AND the AI pane id: hivecontrol checks the pane belongs to the targeted workspace and refuses a drain of a child run with the Primary's pane)."
