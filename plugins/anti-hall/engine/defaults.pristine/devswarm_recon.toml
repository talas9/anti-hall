[devswarm_recon.node_pull_snippet]
doc = "What Node runs for a workspace the engine does not drain itself: reconcile's own spawn of `inbox pull <id>` in that worktree. Arguments: the plugin root, the home, the workspace id, the worktree. It prints what the spawn returned."
value = 'process.env.HOME=process.argv[2];const R=require(process.argv[1]+"/scripts/devswarm-lib/reconcile.js");const r=R.defaultSpawnReconcile({id:process.argv[3],worktreePath:process.argv[4]},{home:process.argv[2],env:process.env});console.log(JSON.stringify({stdout:typeof r.stdout==="string"?r.stdout:null,stderr:typeof r.stderr==="string"?r.stderr:"",status:r.status===undefined?null:r.status,signal:r.signal||null,error:r.error?{code:r.error.code||null,message:String(r.error.message||r.error)}:null,worktreeMissing:!!r.worktreeMissing}))'

