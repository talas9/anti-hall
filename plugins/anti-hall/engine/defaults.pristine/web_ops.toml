# ah-engine shipped defaults for the Command Center's Accounts & usage, Updates and Logs screens (ah-web, GH #266). Format: see the
# header of engine.toml. `ah-web` reads this file itself (named by web.ops_cfg_rel) at start-up and whenever web.toml changes; the
# page gets its texts merged into the `ui` labels and the numbers from /api/ops/config. Nothing here is a credential: the screens
# never read a token or a key.

[web.ops.usage_cache_rel]
doc = "The usage cache the limit-conserve and spawn-usage checks read (the same file as ctxbudget.usage_cache), relative to the home directory. It holds percentages and reset times only."
value = ".claude/plugins/oh-my-claudecode/.usage-cache-anthropic.json"

[web.ops.usage_cache_max_bytes]
doc = "Largest usage cache read; a bigger file shows as unavailable."
value = 262144
unit = "bytes"

[web.ops.usage_stale_ms]
doc = "A usage cache older than this is shown as stale (the same limit as ctxbudget.usage_max_stale_ms)."
value = 21600000
unit = "ms"

[web.ops.usage_warn_pct]
doc = "Usage percent from which a bucket turns amber and says it is approaching its limit."
value = 70

[web.ops.usage_bad_pct]
doc = "Usage percent from which a bucket turns red (the limit-conserve threshold default, limitConserve.threshold)."
value = 85

[web.ops.usage_buckets]
doc = "The fixed buckets of the usage cache: id, the cache field holding the percent, the field holding the reset time, and the ui text key of its name."
value = [{ id = "five_hour", pct = "fiveHourPercent", resets = "fiveHourResetsAt", label_key = "ops_bucket_five_hour" }, { id = "weekly", pct = "weeklyPercent", resets = "weeklyResetsAt", label_key = "ops_bucket_weekly" }]

[web.ops.usage_scoped_field]
doc = "The usage cache field holding the per-model weekly buckets (each with id, label, percent, resetsAt)."
value = "scopedWeeklyBuckets"

[web.ops.usage_scoped_keys]
doc = "Field names inside one per-model bucket: label, percent, resets."
value = { label = "label", pct = "percent", resets = "resetsAt" }

[web.ops.usage_timestamp_field]
doc = "The usage cache field holding the time it was read, ms since the epoch."
value = "timestamp"

[web.ops.usage_data_field]
doc = "The usage cache field holding the buckets."
value = "data"

[web.ops.claude_json_rel]
doc = "The host's account file, relative to the home directory. Only the fields named in web.ops.claude_account_fields and a short fingerprint of userID are read out of it; no token, key or e-mail address."
value = ".claude.json"

[web.ops.claude_json_max_bytes]
doc = "Largest account file read."
value = 16777216
unit = "bytes"

[web.ops.claude_account_fields]
doc = "The fields of the account file's oauthAccount object that are shown, each with the ui text key of its name (plan and limits, never an identity or a credential)."
value = [{ field = "organizationType", label_key = "ops_plan" }, { field = "billingType", label_key = "ops_billing" }, { field = "organizationRateLimitTier", label_key = "ops_rate_tier" }, { field = "hasExtraUsageEnabled", label_key = "ops_extra_usage" }]

[web.ops.claude_account_key]
doc = "The account file's object that exists once the host is logged in."
value = "oauthAccount"

[web.ops.claude_user_key]
doc = "The account file's top-level id of the logged-in user; only its first characters are shown, as a fingerprint."
value = "userID"

[web.ops.fingerprint_chars]
doc = "How many leading characters of the user id the fingerprint shows."
value = 8

[web.ops.codex_auth_rel]
doc = "Codex's login file, relative to the home directory. Only its existence and modified time are looked at: it is never opened."
value = ".codex/auth.json"

[web.ops.cost_ctl]
doc = "The engine control request that carries the per-agent cost report (its agent_cost member is shown)."
value = "telemetry summary"

[web.ops.cost_key]
doc = "The member of the cost request's reply that holds the per-agent cost report."
value = "agent_cost"

[web.ops.cost_rows]
doc = "Most agents listed in the cost table (the highest spenders first). The engine's own cost report is capped by agent_tracker.cost_limit."
value = 50

[web.ops.cost_tree]
doc = "The text drawn in front of an agent's name in the cost table to show who it belongs to: branch (a child with later siblings), last (the last child), pipe (carried down under a branch), gap (carried down under a last child). Each is the same width."
value = { branch = "\u251c\u2500 ", last = "\u2514\u2500 ", pipe = "\u2502  ", gap = "   " }

[web.ops.cost_name_fallback]
doc = "What an agent with no title is called in the cost table. {dir} is the folder it works in (a workspace's branch folder), {id} the start of its id. Used only when no title exists in the tracker or the DevSwarm name cache."
value = "{dir} ({id})"

[web.ops.poll_accounts_ms]
doc = "How often the Accounts screen asks for fresh numbers while it is shown and the tab is visible."
value = 15000
unit = "ms"

[web.ops.tick_ms]
doc = "How often the reset countdowns redraw while the Accounts screen is shown and the tab is visible."
value = 1000
unit = "ms"

[web.ops.update_args]
doc = "The engine arguments of the update check. Must contain --check: the server refuses to run them otherwise, so this button can never apply an update."
value = ["update", "--check"]

[web.ops.update_guard_flag]
doc = "The flag update_args must contain."
value = "--check"

[web.ops.update_timeout_ms]
doc = "The update check is abandoned after this long (it fetches from the network)."
value = 60000
unit = "ms"

[web.ops.update_min_gap_ms]
doc = "Least time between two update checks; a button press inside it shows the last result."
value = 15000
unit = "ms"

[web.ops.update_text_max]
doc = "Characters of the check's message kept."
value = 600

[web.ops.logs_sources]
doc = "The logs the Logs screen can tail (through the engine's own `diag file`, which scrubs and caps them): id, ui text key, the engine file id, format (tsv or json), then where ts, component, level and text are. tsv fields are column numbers; json fields are member names (text may list several, comma separated, joined by a space). level_mode: rules (substring rules on the level field) or fixed (the level field is itself the level every line has: the debug log carries no level of its own)."
value = [{ id = "engine", label_key = "ops_src_engine", file = "state:ah-engine.log", format = "tsv", ts = "0", comp = "1", level = "2", text = "3", level_mode = "rules" }, { id = "debug", label_key = "ops_src_debug", file = "state:debug.ndjson", format = "json", ts = "ts", comp = "module", level = "debug", text = "msg,data", level_mode = "fixed" }, { id = "actions", label_key = "ops_src_actions", file = "state:actions.ndjson", format = "json", ts = "ts", comp = "feature", level = "outcome", text = "action,target,reason", level_mode = "rules" }]

[web.ops.logs_diag_args]
doc = "The engine arguments that read one log; {file} is the engine file id from web.ops.logs_sources."
value = ["diag", "file", "{file}", "--json"]

[web.ops.logs_cache_ms]
doc = "A log read is reused for this long, so several open tabs cost the engine one read."
value = 1500
unit = "ms"

[web.ops.logs_timeout_ms]
doc = "A log read is abandoned after this long."
value = 5000
unit = "ms"

[web.ops.logs_max_lines]
doc = "Most lines one reply carries."
value = 600

[web.ops.logs_text_max]
doc = "Characters kept of one line's text."
value = 400

[web.ops.logs_view_max]
doc = "Most lines the page keeps and draws; older ones scroll away."
value = 500

[web.ops.logs_poll_ms]
doc = "How often the Logs screen asks for new lines while it is shown, following and the tab is visible."
value = 3000
unit = "ms"

[web.ops.log_levels]
doc = "The level names, lowest first. The Logs screen filters at or above one."
value = ["debug", "info", "warn", "error"]

[web.ops.log_default_level]
doc = "The level a line gets when no rule matches."
value = "info"

[web.ops.log_level_rules]
doc = "Substring rules for level_mode rules, checked in order against the lower-cased level field: the first rule with a matching word sets the level."
value = [{ level = "error", words = ["error", "fail", "hard", "panic", "crash"] }, { level = "warn", words = ["soft", "late", "slow", "stall", "warn", "retry", "timeout", "unable", "refused", "denied"] }, { level = "debug", words = ["trace", "debug"] }]

[web.ops.idle_shell_state]
doc = "The host's session status that means a shell command is running (the registry's own word). With a finished turn it makes an agent show as idle, shell running, not running."
value = "shell"

