# R-pair (plan v3 L11, GH #589; task-id pairing: task #401, issue #595): every task is paired with the agent working on it. Check `task-pair-guard`
# (PreToolUse and PostToolUse on Agent and Task, Stop; Claude, engine-only, no Node twin). Logic: engine/logic/task-pair-guard.js. Every
# switch, number, label and text is here (D88). The task keys it reuses (owner name key, OMC step-aside, open statuses, coordinator owner)
# stay in task_guards.toml. With the switch off the facts are computed and counted (pair_rule_observed) and nothing is printed.

[pair_rule.sw]
doc = "Switch guards.pairRule (default on). On: an Agent or Task spawn without a name is denied, a named agent no open task names as owner gets an advisory, and a Stop with a live named agent that owns no open task (or an in-progress task owned by the agent's id or description instead of its launch name) is blocked. Off: the facts are only counted."
value = { section = "guards", key = "pairRule", type = "boolean", env = "ANTIHALL_PAIR_RULE", option = "", default = true }

[pair_rule.sw_by_id]
doc = "Switch guards.pairRuleByTaskId (default on, kill switch). On: an Agent or Task spawn without a name is not denied when its description names `#<id>` of an open task of the session's list (the parse is pair_rule.task_ref_re: `#<id>` as the leading token of the description, within its first pair_rule.description_scan_max characters), because a named teammate's reports do not reach the coordinator and the unnamed agent is paired by that task id; the PostToolUse advisory and the Stop block treat a name shorter than pair_rule.name_min_chars as no name. Needs guards.pairRule on to print anything. Off: every unnamed spawn is denied, as before."
value = { section = "guards", key = "pairRuleByTaskId", type = "boolean", env = "ANTIHALL_PAIR_RULE_BY_TASK_ID", option = "", default = true }

[pair_rule.summary]
doc = "One-line summary of the task-pair-guard check."
value = "Pairs every task with the agent working on it: an unnamed spawn is denied unless its description names an open task id (guards.pairRuleByTaskId), an agent no task names gets an advisory, a Stop with an unpaired live agent is blocked (guards.pairRule)."

[pair_rule.guard_name]
doc = "The guard id this check answers to in skip.json and in its messages."
value = "task-pair-guard"

[pair_rule.ids_max]
doc = "Most items (agents and tasks) the Stop block lists on its visible line (fewer when they do not fit pair_rule.what_budget); the rest are counted ({more}) and all are listed in the saved details."
value = 8
min = 1

[pair_rule.what_budget]
doc = "Most characters of the Stop block's visible line (the host cuts it near 115 units) when every item fits on it."
value = 115
min = 40

[pair_rule.what_budget_more]
doc = "Most characters of the Stop block's visible line when some items are left out and the saved-details link takes room on the next line: the shown items shrink until the line with its `(+n more)` tail fits."
value = 70
min = 20

[pair_rule.name_min_chars]
doc = "Fewest characters an Agent or Task call's `name` needs to count as a name; a shorter or missing one is an unnamed spawn."
value = 2
min = 1

[pair_rule.task_ref_re]
doc = "JavaScript regex source of the task reference in an unnamed spawn's description that pairs the agent with that task (capture 1 is the number): `#N` as the LEADING token of the description (optional leading white space, then `#N` followed by white space, `:` or the end), nothing else. A `#N` anywhere later (`do not task #400`, `background color (#400)`, `[#400]`, a second line) is prose, not a reference. This is the pair-rule's own stricter, start-anchored regex (no multiline flag); it is NOT the parse of the Stop idle-task guard, which reads task_guard.task_ref_re (`#N` anywhere)."
value = '^\s*#(\d+)(?:\s|:|$)'

[pair_rule.description_scan_max]
doc = "Most characters of an unnamed spawn's description examined for the task reference, cut before any regex runs (the reference must start within them; a description of mostly white space cannot cost the regex engine its memory). A spawn whose reference lies beyond is unnamed."
value = 512
min = 1

[pair_rule.id_refs_max]
doc = "Most distinct task references (pair_rule.task_ref_re) read from an unnamed spawn's description; the spawn pairs when ANY of them is an open task. A longer list is cut here (the Stop idle-task guard reads task_guard.task_ref_re with no cap)."
value = 64
min = 1

[pair_rule.name_max]
doc = "Most characters of an agent name or task owner shown on the visible line of a message (the saved details carry it whole)."
value = 24
min = 4

[pair_rule.tools]
doc = "The tools whose PreToolUse and PostToolUse the check reads: the ones that launch an agent."
value = ["Agent", "Task"]

[pair_rule.event_pre]
doc = "The hook event name of the spawn check (and of its counter label)."
value = "PreToolUse"

[pair_rule.event_post]
doc = "The hook event name of the advisory (and of its counter label)."
value = "PostToolUse"

[pair_rule.event_stop]
doc = "The hook event name of the turn-end block (and of its counter label)."
value = "Stop"

[pair_rule.error_re]
doc = "JavaScript regex source (case-insensitive) of a tool response string that is an error: the spawn started nothing, so there is no agent to pair. An object response is an error when is_error is true or error is a non-empty string."
value = '^\s*error\b'

[pair_rule.labels]
doc = "The text of each counter label value: results of pair_rule_observed (named, unnamed, paired_by_task_id, paired_unverified, unnamed_no_task, unnamed_closed_task, paired, unpaired, clean, agent_without_task, inexact_owner), kinds of pair_rule_fired (unnamed, unpaired, agent_without_task, inexact_owner) and reasons of pair_rule_suppressed (subagent, codex, plan_mode, stop_hook_active, omc, no_rows, liveness_unknown)."
value = { named = "named", unnamed = "unnamed", paired_by_task_id = "paired_by_task_id", paired_unverified = "paired_unverified", unnamed_no_task = "unnamed_no_task", unnamed_closed_task = "unnamed_closed_task", paired = "paired", unpaired = "unpaired", clean = "clean", agent_without_task = "agent_without_task", inexact_owner = "inexact_owner", subagent = "subagent", codex = "codex", plan_mode = "plan_mode", stop_hook_active = "stop_hook_active", omc = "omc", no_rows = "no_rows", liveness_unknown = "liveness_unknown" }

[pair_rule.msg_pre_what]
doc = "The spawn denial: what happened."
value = "this agent has no name, so its task cannot be paired with it."

[pair_rule.msg_pre_why]
doc = "The spawn denial: why (saved details)."
value = "An unnamed agent cannot be addressed by SendMessage and cannot be shown as the owner of a task."

[pair_rule.msg_pre_instead]
doc = "The spawn denial: the one step that clears it."
value = "add name: \"<short-name>\" to the Agent call (the name you will set as the task owner), then spawn again."

[pair_rule.msg_pre_why_id]
doc = "The spawn denial when guards.pairRuleByTaskId is on: why (saved details)."
value = "An unnamed agent cannot be addressed by SendMessage and cannot be shown as the owner of a task. An agent whose description names an open task (#<task id>) is paired with that task."

[pair_rule.msg_pre_instead_id]
doc = "The spawn denial when guards.pairRuleByTaskId is on: the steps that clear it (the base step plus the task id one), at most 115 characters."
value = "add name: \"<short-name>\" to the Agent call, or start the description with #<open task id>, then spawn again."

[pair_rule.msg_post_what]
doc = "The advisory after a named spawn that no open task names; `{name}` is the agent's name."
value = "agent \"{name}\" is running but no open task names it as owner."

[pair_rule.msg_post_why]
doc = "The advisory: why (saved details)."
value = "A task owned by the agent's name shows who works on it and the agent's live activity in the task panel."

[pair_rule.msg_post_instead]
doc = "The advisory: the step that clears it; `{name}` is the agent's name."
value = "TaskUpdate the task it works on with owner \"{name}\" (TaskCreate one first if it has none)."

[pair_rule.msg_post_instead_full]
doc = "The advisory's step when the visible line cannot show the agent's name exactly (longer than pair_rule.name_max, or with backticks, emoji or symbols the message cleaning drops): the exact name is only in the saved details, and the step points there."
value = "TaskCreate or TaskUpdate a task with owner = the exact agent name in the saved details."

[pair_rule.msg_stop_what]
doc = "The Stop block: what is unpaired; `{n}` items, `{items}` the first ones, `{more}` the tail. Kept short: see pair_rule.what_budget."
value = "{n} agent/task pairs are off: {items}{more}."

[pair_rule.msg_stop_why]
doc = "The Stop block: why (saved details)."
value = "Each task should be owned by the name of the agent working on it, so the task panel pairs them."

[pair_rule.msg_stop_instead]
doc = "The Stop block: the step that clears it, at most 115 characters (a longer one is shown as a pointer to the saved details) and about 78 so the visible line keeps its `(+n more)` tail. An agent short of a task needs a NEW task (changing the owner of a task the name already owns cannot add one); a task owned by an agent's id or description gets the launch name as owner (the listed item shows it)."
value = "TaskUpdate a task per listed agent to owner=its name (TaskCreate if none)."

[pair_rule.msg_stop_instead_full]
doc = "The Stop block's step when any listed name is shown cut or cleaned on the visible line, or is left off it (see pair_rule.msg_post_instead_full): the exact names are only in the saved details, which the message links, and the step says to use those."
value = "TaskCreate or TaskUpdate owner=the exact names in the saved details."

[pair_rule.msg_stop_instead_create]
doc = "The Stop block's step when only agents are short of a task (no task owner to correct): a missing task slot is supplied only by a NEW task, because changing the owner of a task adds none. At most 66 characters (see msg_stop_instead)."
value = "TaskCreate (not TaskUpdate) a task per agent, owner = full name."

[pair_rule.msg_stop_instead_create_full]
doc = "The create step when any listed name is shown cut or cleaned on the visible line, or is left off it (see pair_rule.msg_stop_instead_full): the exact names are only in the saved details."
value = "TaskCreate per agent, owner = exact names in the saved details."

[pair_rule.msg_stop_instead_mixed]
doc = "The Stop block's step when agents are short of a task AND tasks are owned by an agent's id or description: create for the former, correct the owner of the latter."
value = "TaskCreate per agent owning none, TaskUpdate owner of each #task."

[pair_rule.item_agent]
doc = "A visible item for a live agent that owns no open task; `{name}` is its launch name."
value = "agent \"{name}\" owns no task"

[pair_rule.item_task]
doc = "A visible item for an in-progress task owned by an agent's id or description; `{id}` the task id, `{owner}` its owner, `{name}` the agent's launch name."
value = "#{id} owner \"{owner}\" -> \"{name}\""

[pair_rule.detail_agent]
doc = "The saved-details line for a live agent that owns no open task: names the step. `{name}` is its launch name."
value = "agent \"{name}\" owns no open task: TaskUpdate the task it works on with owner=\"{name}\", or TaskCreate one and TaskUpdate it with that owner."

[pair_rule.item_agent_many]
doc = "A visible item for several live agents sharing one launch name that own fewer open tasks than there are agents: pairing is by name as a multiset (one task of the name per agent); `{name}` is the launch name, `{n}` how many of these agents have no task left."
value = "{n} agents named \"{name}\" own no task"

[pair_rule.detail_agent_many]
doc = "The saved-details line for the item_agent_many case: names the step. `{name}` is the launch name, `{n}` the agents left without a task."
value = "{n} live agents named \"{name}\" own no open task (one open task per agent): TaskCreate a task for each, then TaskUpdate it with owner=\"{name}\" (or TaskUpdate the tasks they work on)."

[pair_rule.item_agent_share]
doc = "A visible item for a launch name that owns some open tasks but fewer than it has live agents (pairing is by name as a multiset, one open task of the name per agent): only a NEW task clears it, because setting the owner of a task the name already owns adds none. `{name}` is the launch name, `{n}` how many of its agents have no task left."
value = "{n} of the agents named \"{name}\" own no task"

[pair_rule.detail_agent_share]
doc = "The saved-details line for the item_agent_share case: names the step. `{name}` is the launch name, `{n}` the agents left without a task, `{agents}` the live agents of that name, `{owned}` the open tasks it already owns."
value = "{n} of the {agents} live agents called \"{name}\" own no open task ({owned} open tasks already carry that owner, one per agent is needed): TaskCreate a task for each, then TaskUpdate it with owner=\"{name}\"."

[pair_rule.detail_task]
doc = "The saved-details line for an in-progress task whose owner is an agent's id or description. `{id}`, `{owner}`, `{name}` as in item_task."
value = "task #{id} owner \"{owner}\" is agent \"{name}\": TaskUpdate #{id} owner=\"{name}\"."

[pair_rule.item_sep]
doc = "Separator between the items of the visible Stop line."
value = "; "

[pair_rule.more]
doc = "Tail of the item list when more than pair_rule.ids_max items are off; `{n}` is how many were left out."
value = " (+{n} more)"

[metric.pair_rule_observed]
doc = "Facts the R-pair check computed, by hook event and result (PreToolUse: named, unnamed; with guards.pairRuleByTaskId on an unnamed spawn is counted instead as paired_by_task_id = its description names an open task, paired_unverified = it names a number and the task list is unreadable, unnamed_closed_task = it names only tasks that are not open, unnamed_no_task = it names no existing task; PostToolUse: paired, unpaired; Stop: clean, agent_without_task, inexact_owner), counted with the switch on or off. Unnamed-spawn rate = (unnamed + unnamed_no_task + unnamed_closed_task + paired_by_task_id + paired_unverified) / all PreToolUse; unpaired-stop rate = (agent_without_task + inexact_owner) / all Stop."
value = { kind = "counter", unit = "calls", labels = ["event", "result"] }

[metric.pair_rule_fired]
doc = "Answers R-pair delivered (switch on), by hook event and kind (unnamed = a spawn denied, unpaired, agent_without_task, inexact_owner)."
value = { kind = "counter", unit = "calls", labels = ["event", "kind"] }

[metric.pair_rule_suppressed]
doc = "Calls R-pair stepped aside on, by reason (subagent, codex, plan_mode, stop_hook_active, omc, no_rows = tasks or agents unreadable, liveness_unknown = an agent whose liveness no source tells; counted per agent)."
value = { kind = "counter", unit = "calls", labels = ["reason"] }
