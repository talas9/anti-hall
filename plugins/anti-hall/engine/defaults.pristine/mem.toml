# ah-engine shipped defaults for the memory module (issues #21 and #158). Format: see the header of engine.toml.
#
# Every long-lived in-memory holder of the daemon registers with the memory registry (src/mem) under a name and gets a SOFT and a
# HARD limit here: `mem.<holder>_soft_bytes`, `mem.<holder>_hard_bytes` and `mem.<holder>_low_water_pct`. At the soft limit the
# holder is told to shrink to the low-water mark (least recently used first) and requests keep being served; an insert that would
# cross the hard limit is refused (a cache miss, a script call that fails open) and the holder is recycled. `mem.global_*` bounds
# the process as a whole. `ah-engine status --memory` shows every holder against these numbers.

[mem.global_soft_bytes]
doc = "SOFT limit (125 MB, owner decision 2026-10-23; a limit, not a target). Process memory (the figure `daemon.mem_metric` selects) at which every holder is asked to shrink to its low-water mark. Logged once per excursion. The RSS cap (`daemon.rss_cap_kb`) stays the absolute backstop above it."
value = 131072000
min = 1048576
unit = "bytes"

[mem.global_hard_bytes]
doc = "HARD limit (200 MB, owner decision 2026-10-23). Process memory above which every holder is recycled and every cache insert is refused. If it is still above this `mem.global_restart_after_s` later, the daemon is asked to restart cleanly and the reason is recorded in the event log."
value = 209715200
min = 1048576
unit = "bytes"

[mem.global_low_water_pct]
doc = "Percent of the global soft and hard limits that process memory must fall to before the global triggers re-arm (hysteresis, so a total hovering at a limit is one excursion, not many)."
value = 90
min = 1
max = 100

[mem.global_restart_after_s]
doc = "How long the process total (or a holder that recycling cannot shrink, such as the defaults snapshots leaked on purpose) may stay over its hard limit after the recovery attempt before a clean restart is requested."
value = 60
min = 1
unit = "s"

[mem.global_log_min_interval_ms]
doc = "At most one soft or hard log line per holder per interval (the counters in `status --memory` still count every excursion), so a cache that cycles between its low-water mark and its soft limit cannot flood the event log."
value = 60000
min = 0
unit = "ms"

[mem.ledger_skew_bytes]
doc = "Slack in the memory ledger's invariant (the named holders must fit inside the counted Rust heap): the holders and the heap are read a few microseconds apart while other threads allocate, so a holder total up to this much over the heap is not reported as an overcount."
value = 262144
min = 0
unit = "bytes"

[mem.regex_soft_bytes]
doc = "Estimated bytes of compiled regular expressions plus their per-thread search scratch (script.regex_scratch_bytes per worker) the shared `ah.re.*` cache may hold before it evicts the least recently used down to its low-water mark (an entry weighs the heap its build kept, measured by the counting allocator; where that is off, script.regex_entry_base_bytes plus script.regex_bytes_per_src_byte per byte of its translated source). The shipped checks reach about 47 distinct patterns on a short run (7.3 MB estimated, up to 5.3 MB measured on 4 workers) and more across a real day; at 8 MiB of programs alone the working set did not fit and the cache evicted and recompiled in a cycle (live20.1: 16 evictions in 7 h). With the scratch counted (147 shipped patterns weigh about 27 MB at 4 workers) 48 MiB keeps them all."
value = 50331648
min = 262144
unit = "bytes"

[mem.regex_hard_bytes]
doc = "Estimated bytes of compiled regular expressions plus their per-thread search scratch at which the `ah.re.*` cache refuses an insert (the pattern is compiled and used, not kept) and is recycled."
value = 83886080
min = 262144
unit = "bytes"

[mem.regex_low_water_pct]
doc = "Percent of mem.regex_soft_bytes the `ah.re.*` cache is evicted down to when the soft limit is reached."
value = 80
min = 1
max = 100

[mem.regex_max_entries]
doc = "Compiled regular expressions the process-wide `ah.re.*` cache keeps at most (all workers share one cache); past it the least recently used pattern is dropped first, and its per-thread search caches go with it. 167 patterns are in use today."
value = 256
min = 8

[mem.quickjs_soft_bytes]
doc = "What ONE worker thread's script interpreter may hold after loading a check (measured after a collection). At or above it the least recently called checks are unloaded down to the low-water mark and rebuilt from their files by their next call. All shipped checks loaded take about 3.84 MB per worker after a collection (measured 2026-10-16 with 73 checks, `examples/script_mem.rs`, 4 threads) plus the garbage a request leaves before the next collection; the default keeps headroom above that cold set so the first hook call does not unload and rebuild checks while racing the client deadline. At 4 MiB the loaded set sat 9% under the limit and live20.1 unloaded and rebuilt checks 154 times (four workers, bytes held 4.2 MB each: at the limit). A limit near 3 MB made the replay about twice as slow (the checks one request runs are reloaded again and again), and 4 MB costs a few percent. Default 5 MiB; the 4 MiB of the replay below was the knee when the cold set was smaller. The sweep, from a 600-event replay on a scratch daemon (4 workers): soft 6 MiB held 18.9 MB in the interpreters (footprint 58.8 MB, CPU 6.7 s), 4 MiB 14.7 MB (55.2 MB, 7.6 s), 3 MiB 8.7 MB (51.8 MB) but CPU tripled (19.6 s, checks reloaded constantly), 2 MiB the same thrash."
value = 5242880
min = 524288
unit = "bytes"

[mem.quickjs_hard_bytes]
doc = "Absolute ceiling of one worker's script interpreter heap (bytes). A call's own allowance (script.call_memory_bytes above the size after loading) never lifts the ceiling past it, so a baseline that creeps up cannot raise the limit without bound. An interpreter found above it is recycled and the call that needed it fails open (a deferral)."
value = 33554432
min = 8388608
unit = "bytes"

[mem.quickjs_low_water_pct]
doc = "Percent of mem.quickjs_soft_bytes an interpreter is unloaded down to once it reached the soft limit, so the next load does not trigger another unload."
value = 90
min = 1
max = 100


