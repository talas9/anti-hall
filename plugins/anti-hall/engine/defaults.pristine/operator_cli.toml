# ah-engine shipped defaults for the operator command-line verbs made engine-only by lane L03 (v1.0, no Node): the native
# answers of `defect` and `jev-setup` for the cases that used to defer to their Node scripts, and the verbs `dispatch-report`,
# `finding-dedup`, `auto-handover-config` and `coordinator-work-baseline`. Format: see the header of engine.toml.
# Texts that a parity test compares with a Node script are that script's own words.

[opcli.fail_exit]
doc = "Exit code of a run that could not finish or was refused (the Node scripts' own code for a failure)."
value = 1

# ---- defect --------------------------------------------------------------------------------------------------------------

[opcli.collate_digit_base]
doc = "Collation of `defect recurring` / `similar` sorts: the weight of '0' (digits sort after the punctuation of defect.collation_symbols)."
value = 1000

[opcli.collate_letter_base]
doc = "Collation: the weight of 'a' and 'A' (letters sort after digits, case ignored at this level)."
value = 2000

[opcli.collate_other_base]
doc = "Collation: the weight added to the code point of any other character (non-ASCII, control), so it sorts after every ASCII letter, by code point. ICU's own tables (an accented letter beside its base letter) are not reproduced."
value = 3000

[opcli.defect_reason_unread_date]
doc = "`defect archive`: the reason an entry stays in place when its last-seen date is one this tool does not read (a hand-edited record)."
value = "unreadable date"

[opcli.defect_reason_move_failed]
doc = "`defect archive`: the reason an entry stays in place when moving it into the archive failed (the Node tool stopped with a stack trace here). Placeholder: {error}."
value = "move failed: {error}"

[opcli.defect_argv_common]
doc = "The git arguments that print the common git directory of the checkout {root} (relative to it or absolute), asked when the file resolver is unsure of the repository layout."
value = ["-C", "{root}", "rev-parse", "--git-common-dir"]

[opcli.defect_since_unread]
doc = "`defect recurring --since`: refused when it is neither a version nor a date this tool reads. Placeholder: {since}."
value = "❌ anti-hall · defect: recurring: --since \"{since}\" is not a date this tool reads; use YYYY-MM-DD[THH:MM[:SS]][Z], \"Mon D, YYYY\" or a version like v1.2.3"

[opcli.defect_internal]
doc = "Said when a defect run met an internal fault (nothing was written)."
value = "❌ anti-hall · defect: internal error; nothing was written"

# ---- jev-setup: the shadow-review verbs and `test` -----------------------------------------------------------------------

[opcli.review_state_file]
doc = "The durable shadow-review state, relative to the anti-hall home directory."
value = "jev-review-state.json"

[opcli.review_metrics_file]
doc = "The shadow-review metrics log (one JSON row per event), relative to the anti-hall home directory."
value = "logs/jev-review.ndjson"

[opcli.review_after_days_default]
doc = "jev.reviewAfterDays when the setting is zero or not a number (Node: `Number(x) || 7`)."
value = 7

[opcli.review_min_decisions_default]
doc = "jev.reviewMinDecisions when the setting is not a finite number."
value = 30

[opcli.review_day_ms]
doc = "Milliseconds in a day (the review windows and the snooze are counted in whole days)."
value = 86400000

[opcli.review_hour_ms]
doc = "Milliseconds in an hour (the due-to-reviewed latency is said in hours)."
value = 3600000

[opcli.review_max_time_ms]
doc = "The largest instant a date can hold, in milliseconds (a snooze past it has no date)."
value = 8640000000000000

[opcli.review_mode_shadow]
doc = "The mode an integration must be in for its shadow numbers to be reviewed."
value = "shadow"

[opcli.review_rollup_midnight]
doc = "The suffix that turns a rollup's day into its UTC midnight."
value = "T00:00:00Z"

[opcli.review_keys]
doc = "Names of the JSON members of the review state, a decision row and a rollup."
value = { integrations = "integrations", shadow_since = "shadowSince", last_reviewed = "lastReviewedAt", snoozed_until = "snoozedUntil", due_since = "dueSince", id = "id", type = "type", day = "day", groups = "groups", n = "n", ts = "ts", days = "days", decisions = "decisions", latency = "latencyMs", reviewed_type = "reviewed" }

[opcli.review_none]
doc = "`review-due` when nothing is due. Placeholders: {after}, {min}."
value = "jev review-due: nothing due (reviewAfterDays={after}, reviewMinDecisions={min})"

[opcli.review_head]
doc = "`review-due` heading above the due integrations."
value = "jev review-due:"

[opcli.review_row]
doc = "`review-due` line of one due integration. Placeholders: {id}, {days}, {decisions}."
value = "  {id} ({days}d, {decisions} decisions)"

[opcli.review_json_flag]
doc = "The argument that makes `review-due` print JSON."
value = "--json"

[opcli.reviewed_usage]
doc = "`reviewed` without an integration."
value = "reviewed: usage is `reviewed <integration>`"

[opcli.reviewed_ok]
doc = "`reviewed` confirmation. Placeholders: {id}, {late}."
value = "{id} marked reviewed{late}"

[opcli.reviewed_late]
doc = "The part of the `reviewed` confirmation that says how long the review was due. Placeholder: {hours}."
value = " (was due for {hours}h)"

[opcli.snooze_usage]
doc = "`snooze` without an integration or with a missing or non-positive --days."
value = "snooze: usage is `snooze <integration> --days N`"

[opcli.snooze_days_error]
doc = "`snooze` refused: the number of days is not a positive number (the review library's own check)."
value = "snooze: --days must be a positive number"

[opcli.snooze_range]
doc = "`snooze` refused: the snooze would end after the last date a date can hold (nothing is written)."
value = "snooze: --days is too large for a date"

[opcli.snooze_ok]
doc = "`snooze` confirmation. Placeholders: {id}, {until}."
value = "{id} snoozed until {until}"

[opcli.review_write_failed]
doc = "A review-state write that failed after the verb was answered (best effort, as in Node: said, not fatal). Placeholder: {error}."
value = "⚠️ anti-hall · jev-setup: could not save the review state: {error}"

[opcli.review_state_bad]
doc = "The review state holds an entry that is not an object, which the verb cannot update (nothing is written). Placeholder: {id}."
value = "review state: the entry of {id} is not an object; fix or remove ~/.anti-hall/jev-review-state.json"

[opcli.test_not_enabled]
doc = "`test` while Jev is off."
value = "test: jev is not enabled — run `enable` first"

[opcli.test_question]
doc = "The yes/no question `test` asks (a Noul question: instructions, then the labels of true and false)."
value = { instructions = "Is the sky typically blue on a clear day?", when_true = "yes", when_false = "no" }

[opcli.test_state]
doc = "The text `test` has Jev judge."
value = "On a clear day, the sky appears blue."

[opcli.test_ok]
doc = "`test` line of a target that answered. Placeholders: {ms}, {confidence}, {tag}."
value = "ok — latency {ms}ms, confidence {confidence} ({tag})"

[opcli.test_failed]
doc = "`test` line of a target that did not answer. Placeholders: {reason}, {tag}."
value = "failed: {reason} ({tag})"

[opcli.test_tag_one]
doc = "`test` tag when one transport is tested. Placeholder: {transport}."
value = "transport: {transport}"

[opcli.test_tag_two]
doc = "`test` tag when primary and fallback are both tested. Placeholders: {label}, {transport}."
value = "{label}, transport: {transport}"

[opcli.test_label_primary]
doc = "`test` label of the primary transport."
value = "primary"

[opcli.test_label_fallback]
doc = "`test` label of the fallback transport."
value = "fallback"

[opcli.test_rejected_re]
doc = "A failure reason that means the vendor rejected the key."
value = "^http-40[13]"

[opcli.test_rejected_hint]
doc = "What `test` adds when the key was rejected."
value = "the key was rejected — check the key is correct AND that the transport (vercel vs typesafe) matches where the key was issued"
