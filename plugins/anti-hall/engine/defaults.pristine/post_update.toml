value = "stopped (TERM)"

[post_update.how_kill]
doc = "Stopped by KILL after the grace."
value = "stopped (KILL after grace)"

[post_update.how_removed]
doc = "A file was removed."
value = "removed"

[post_update.how_would_remove]
doc = "A dry run would remove a file."
value = "would be removed"

[post_update.how_would_stop]
doc = "A dry run would stop a process."
value = "would be stopped"

[post_update.how_would_wait]
doc = "A dry run would wait for a watcher to re-execute."
value = "would get a settle window to re-execute"

[post_update.why_deleted]
