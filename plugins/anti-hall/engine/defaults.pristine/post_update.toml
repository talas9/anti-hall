value = "scratch daemon (runs from a scratch directory)"

[post_update.why_second_daemon]
doc = "Why a daemon is stopped: it is not the verified one."
value = "second daemon (not the verified one)"

[post_update.why_duplicate]
doc = "Why a watcher is stopped. {verb}, {session}."
value = "duplicate {verb} watcher of session {session} (the newest stays)"

[post_update.why_watcher_old]
doc = "Why a watcher is reported: it is still on the replaced binary."
value = "still running the replaced binary"

[post_update.why_web_old]
doc = "Why the dashboard server is reported. {why}."
value = "dashboard server: {why}"

[post_update.why_old_binary]
doc = "Why an old binary copy is removed."
value = "old binary copy beyond the kept ones"

[post_update.why_dead_owner]
doc = "Why a pid or temp file is removed. {pid}."
