# ah-engine shipped defaults for `ah-engine post-update-check` (src/operator/post_update.rs): the step every update path ends with. It
# verifies the live daemon, stops stray anti-hall processes by verified pid, and cleans old artifacts. Format: see the header of engine.toml.

[cmd.post-update-check]
doc = "The step every update ends with: verify exactly one live engine runs the installed binary (sha, path, answers status and a ping inside its budget), stop stale and scratch daemons and duplicate watchers by verified pid (never pkill), let watchers on a replaced binary re-execute themselves, report servers on an old binary, and clean old binary copies, dead pid files, a dead socket and dead temp files. --dry-run reports and changes nothing. Exit 0 verified, 1 not."
value = { args = "[--dry-run] [--expect-sha <sha256>]", read_only = false, status = "implemented" }

[post_update.flag_dry_run]
doc = "Report what would be done, change nothing."
value = "--dry-run"

[post_update.flag_expect_sha]
doc = "The sha256 the installed engine binary must have (default: the recorded .expected file)."
value = "--expect-sha"

[post_update.msg_flag_value]
doc = "A flag lacks its value. {flag}."
value = "post-update-check: {flag} needs a value"

[post_update.msg_bad_arg]
doc = "Unknown argument. {arg}."
value = "post-update-check: unknown argument {arg}\nusage: post-update-check [--dry-run] [--expect-sha <sha256>] [--json]"

# ---- what a process is --------------------------------------------------------------------------------------------------------

[post_update.engine_names]
doc = "Program names of the engine binary in a process listing."
value = ["ah-engine"]

[post_update.web_names]
doc = "Program names of the dashboard server."
value = ["ah-web"]

[post_update.serve_words]
doc = "An argument that makes an engine / dashboard process a long-running server."
value = ["serve"]

[post_update.watch_words]
doc = "An argument that makes an engine process a long-running watcher (`ah-engine devswarm wake-watch`)."
value = ["wake-watch"]

[post_update.scratch_roots]
doc = "Directories under which a running engine is a scratch or experiment daemon ({home} is the home directory): stopped as scratch, never as 'second daemon'."
value = ["{home}/.anti-hall/work/", "/tmp/", "/private/tmp/", "/var/folders/", "/private/var/folders/"]

[post_update.home_token]
doc = "The placeholder for the home directory in scratch_roots."
value = "{home}"

# ---- timings ---------------------------------------------------------------------------------------------------------------------

[post_update.change_slack_s]
doc = "A binary file counts as replaced after a process started only when it changed more than this many seconds later."
value = 2
unit = "s"

[post_update.grace_ms]
doc = "How long a stopped process gets to exit after TERM before KILL."
value = 3000
unit = "ms"

[post_update.poll_ms]
doc = "Polling step while waiting for a process to exit or a watcher to re-execute."
value = 100
unit = "ms"

[post_update.kill_wait_ms]
doc = "Wait after KILL before checking the process is gone."
value = 300
unit = "ms"

[post_update.verify_tries]
doc = "How many times the daemon is asked for its status while it is still coming up."
value = 20

[post_update.verify_pause_ms]
doc = "Pause between those tries."
value = 500
unit = "ms"

[post_update.ping_budget_ms]
doc = "A control round trip (ping) slower than this is a problem."
value = 1000
unit = "ms"

[post_update.watcher_settle_s]
doc = "How long watchers on a replaced binary get to re-execute themselves before they are reported."
value = 8
unit = "s"

[post_update.sha_chars]
doc = "Characters of a sha256 shown in texts."
value = 8

# ---- cleanup ----------------------------------------------------------------------------------------------------------------------

[post_update.artifact_names]
doc = "Binary names whose old copies (`<name>.<anything>`) in the binary directory are cleaned."
value = ["ah-engine", "ah-hook"]

[post_update.keep_suffixes]
doc = "Copies with these suffixes (after the binary name) are never cleaned: the previous binary, the known-good copy and the integrity records."
value = [".prev", ".good", ".good.sha256", ".expected", ".accepted"]

[post_update.artifact_min_age_s]
doc = "An old binary copy is cleaned only when it is older than this."
value = 300
unit = "s"

[post_update.pid_files]
doc = "Pid files (in the state directory) removed when the process named in them is gone."
value = ["daemon.run"]

[post_update.tmp_suffix]
doc = "Temp files `<name>.<pid>.<n>.tmp` of a dead process end in this."
value = ".tmp"

[post_update.tmp_min_age_s]
doc = "A temp file is cleaned only when older than this."
value = 600
unit = "s"

