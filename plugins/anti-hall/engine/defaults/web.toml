[web.msg_no_bin]
doc = "Printed when the server binary is missing. Placeholder: {bin}."
value = "The Command Center server binary was not found: {bin}"

[web.msg_status_stopped]
doc = "Printed by `ah-engine web status` when no server is running."
value = "Command Center: not running"

[web.msg_status_running]
doc = "Printed by `ah-engine web status` when the server runs. Placeholders: {pid}, {url}."
value = "Command Center: running (pid {pid}) {url}"

[web.msg_usage]
doc = "Usage line of `ah-engine web`."
value = "usage: ah-engine web [open|status] [--no-open] [--json]"

[web.csp]
doc = "Content-Security-Policy header sent with every page and file."
value = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

[web.mime]
doc = "Content type by file extension for the files the server serves; any other extension is refused."
value = { html = "text/html; charset=utf-8", css = "text/css; charset=utf-8", js = "text/javascript; charset=utf-8", mjs = "text/javascript; charset=utf-8", wasm = "application/wasm", json = "application/json", svg = "image/svg+xml", woff2 = "font/woff2", png = "image/png", ico = "image/x-icon" }

[web.boot_marker]
doc = "The text in the index file that the server replaces with the page's boot data (texts and thresholds as JSON)."
value = "__AH_BOOT__"

[web.step_max_chars]
doc = "Longest 'doing now' text sent per agent, in characters."
value = 240
min = 20

[web.kind_order]
doc = "Order of agent kinds in the tree (first = top)."
value = ["main", "workspace", "subagent", "teammate", "codex", "heartbeat"]

[web.msg_unauthorized]
doc = "Body of the refusal sent to a request without the session token."
value = "Open the Command Center with `ah-hook web`."

[web.msg_busy]
doc = "Body sent when too many event streams are open."
value = "Too many open dashboard tabs."

[web.msg_not_found]
doc = "Body sent for a file that does not exist."
value = "Not found."

