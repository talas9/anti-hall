# ah-engine shipped defaults for the Command Center web dashboard (`ah-engine web`, binary ah-web; GH #266). Format: see the
# header of engine.toml. The dashboard is a local page: it binds to the loopback address only, on a random free port, behind a
# per-session token, and exits when nobody has used it for web.idle_exit_s. Nothing runs until `ah-engine web` is called.
# `ah-web` reads this file itself (start-up and whenever the file changes); the engine reads the start-up keys.

[web.enabled]
doc = "Master switch: when false, `ah-engine web` prints web.msg_disabled and starts nothing."
value = true

[web.bind_host]
doc = "The address the dashboard server binds to. Keep it a loopback address: the page can send agent messages."
value = "127.0.0.1"

[web.port_min]
doc = "Lowest port tried when picking a random free port."
value = 20000
min = 1024
max = 65535

[web.port_max]
doc = "Highest port tried when picking a random free port."
value = 29999
min = 1024
max = 65535

[web.bind_attempts]
doc = "How many random ports are tried before the server gives up."
value = 40
min = 1

[web.idle_exit_s]
doc = "The server exits after this many seconds with no request and no open stream; 0 = never (a dashboard kept running as a service)."
value = 300
min = 0
max = 3600

[web.idle_check_s]
doc = "How often the server checks whether it has been idle long enough to exit."
value = 5
min = 1

[web.token_bytes]
doc = "Random bytes in the per-session token (shown as twice as many hex digits)."
value = 16
min = 8

[web.cookie_name]
doc = "Name of the session cookie the browser receives after it presents the token."
value = "ah_web_session"

[web.log_file]
doc = "File (in the state directory the server was started with) it appends one line to for its start, every signal it receives and its exit with the reason, so a server that disappears says why. Rotated to `<name>.1` at web.log_max_bytes."
value = "ah-web.log"

[web.log_max_bytes]
doc = "Size at which the server's log file is rotated (one old copy is kept)."
value = 262144
min = 4096

[web.state_file]
doc = "File (in the engine state directory) the server writes while it runs: pid, port, token and URL. Mode 0600."
value = "web.json"

[web.config_rel]
doc = "This file's path relative to the plugin root; the engine hands it to the server, which reads it itself."
value = "engine/defaults/web.toml"

[web.static_dir]
doc = "Directory of the page's own files (index, CSS), relative to the plugin root."
value = "web/static"

[web.pkg_dir]
doc = "Directory of the compiled page (WASM and its loader), relative to the plugin root."
value = "web/pkg"

[web.index_file]
doc = "The page served at /, inside web.static_dir."
value = "index.html"

[web.port]
doc = "The port the dashboard listens on. When something else holds it, a random free port from web.port_min..web.port_max is used and printed."
value = 47821
min = 1024
max = 65535

[web.mode]
doc = "The tier the page starts in: auto (full unless the browser asks for reduced motion), full, or lite (no animation, a lower rate, static styling). The header toggle changes it live and the browser remembers the choice."
value = "auto"

[web.full_push_ms]
doc = "Milliseconds between pushes to a tab in the full tier (500 = 2 per second; never below web.push_min_ms)."
value = 500
min = 100

[web.lite_push_ms]
doc = "Milliseconds between pushes to a tab in the lite tier (5000 = one every 5 seconds)."
value = 5000
min = 500

[web.push_min_ms]
doc = "Hard floor of the time between pushes and between asking the engine (500 = at most 2 per second)."
value = 500
min = 100

[web.ctl_timeout_ms]
doc = "A request to the engine's control socket that takes longer than this is abandoned (the last data stays on screen)."
value = 2000
min = 100

[web.ctl_max_bytes]
doc = "Largest engine reply accepted."
value = 16777216
min = 65536

[web.delta_ring]
doc = "Changes kept so a slow tab can be sent everything it missed in one message; a tab further behind gets a full snapshot."
value = 64
min = 2

[web.pulse_min_interval_ms]
doc = "How often the engine's vital signs (CPU, memory, requests, errors) are read and pushed."
value = 2000
min = 250

[web.agents_poll_ms]
doc = "How often the engine is asked whether the agent list changed (a request that finds it unchanged costs one stat)."
value = 1000
min = 250

[web.decisions_poll_ms]
doc = "How often the engine is asked for new check decisions (the activity feed)."
value = 2000
min = 250

[web.mesh_poll_ms]
doc = "How often the mesh store is read for new messages while a tab is connected."
value = 1000
min = 250

[web.mesh_db_rel]
doc = "The mesh store, relative to the home directory."
value = ".anti-hall/devswarm/store/devswarm.db"

[web.mesh_limit]
doc = "Most mesh messages read in one round."
value = 200
min = 1

[web.feed_max]
doc = "Activity feed lines kept (server and page)."
value = 100
min = 10

[web.feed_decisions_shown]
doc = "Which check decisions become feed lines (allow is left out: it is the normal case)."
value = ["block", "advisory", "error"]

[web.feed_text]
doc = "Feed sentences by kind. Placeholders: {check}, {event}, {rule}, {sender}, {recipient}, {type}."
value = { block = "{check} blocked a step ({event})", advisory = "{check} gave advice ({event})", error = "{check} failed ({event})", mesh = "{sender} sent a {type} message to {recipient}", unknown = "an agent", everyone = "everyone", engine_up = "The engine is reachable again", engine_down = "The engine does not answer" }

[web.feed_events]
doc = "Plain names for the host's event names in the feed; an event not listed shows as it is."
value = { PreToolUse = "before a tool call", PostToolUse = "after a tool call", UserPromptSubmit = "on a prompt", SessionStart = "at session start", Stop = "at turn end", SubagentStart = "at subagent start", SubagentStop = "at subagent end" }

[web.pulse_cpu_warn_permille]
doc = "Engine CPU (parts per thousand of one core) at which the CPU pill turns amber."
value = 50

[web.pulse_cpu_bad_permille]
doc = "Engine CPU (parts per thousand of one core) at which the CPU pill turns red."
value = 100

[web.pulse_mem_warn_mb]
doc = "Engine memory footprint (MB) at which the MEM pill turns amber (the engine's soft memory limit)."
value = 125

[web.pulse_mem_bad_mb]
doc = "Engine memory footprint (MB) at which the MEM pill turns red (the engine's hard memory limit)."
value = 200

[web.pulse_err_warn]
doc = "Failed engine requests at which the ERR pill turns amber."
value = 1

[web.pulse_err_bad]
doc = "Failed engine requests at which the ERR pill turns red."
value = 25

[web.action_timeout_ms]
doc = "An action that takes longer than this is reported as failed."
value = 10000
min = 500

[web.action_note_max_chars]
doc = "Longest verb result shown after a successful action."
value = 160
min = 20

[web.actions]
doc = "The agent action menu, in order. name: sent to the server; label: key of the page's text table; confirm: the page asks first; local: no engine call (opens the details); done: the sentence shown on success, with the verb's own numbers in {braces}; args: the engine arguments, {id} is the agent's id. Every engine action is audited by the engine."
value = [
  { name = "details", label = "act_details", confirm = false, local = true, done = "", args = [] },
  { name = "progress", label = "act_progress", confirm = false, local = false, done = "Progress requested. {backlog} waiting for the agent; it sees them at its next prompt.", args = ["agents", "send", "{id}", "--progress-request", "--json"] },
  { name = "ping", label = "act_ping", confirm = false, local = false, done = "Heartbeat checked. Agent live: {live}, {backlog} waiting.", args = ["agents", "send", "{id}", "--ping", "--json"] },
  { name = "stop", label = "act_stop", confirm = true, local = false, done = "Stop requested. {backlog} waiting for the agent; it sees them at its next prompt.", args = ["agents", "send", "{id}", "--stop-request", "--json"] },
]

[web.detail_skip_keys]
doc = "Tracker fields left out of the details panel."
value = ["agent", "tasks"]

[web.msg_action_unknown]
doc = "Said for an action the menu does not list."
value = "That action is not available."

[web.msg_action_bad_id]
doc = "Said for an agent id that is not a tracker id."
value = "That is not an agent id."

[web.msg_action_confirm]
doc = "Said when an action that asks first arrives without the confirmation."
value = "This action needs your confirmation first."

[web.msg_action_timeout]
doc = "Said when the engine did not answer in time."
value = "The engine did not answer in time."

[web.msg_action_failed]
doc = "Said when the verb failed without a message."
value = "The action failed."

[web.coverage]
doc = "Which dashboard screen shows which engine feature, for `ah-engine describe --coverage` (the header badge counts what no screen covers). Screen to selectors; a selector is `kind:name` with `*` as a wildcard. Kinds: verbs, checks, settings, files, jobs, jev, switches, sources."
value = { agents = ["verbs:agents", "verbs:mesh", "verbs:proj", "verbs:devswarm", "verbs:handovers", "verbs:gh"], pipeline = ["checks:*", "jobs:*", "verbs:check", "verbs:hook", "verbs:gen-hooks", "verbs:schedule"], health = ["verbs:status", "verbs:doctor", "verbs:diag", "verbs:units", "verbs:proc", "verbs:serve", "verbs:stop", "verbs:reset", "verbs:web", "verbs:statusline", "verbs:capability-scan", "verbs:harvest", "verbs:briefing", "verbs:mcp-reaper", "verbs:codex-limit-status"], telemetry = ["verbs:telemetry", "verbs:metrics", "verbs:defect", "sources:*"], impact = ["verbs:impact", "verbs:dispatch-report", "verbs:finding-dedup", "verbs:coordinator-work-baseline"], manage = ["settings:*", "files:*", "switches:*", "verbs:settings", "verbs:config", "verbs:docs", "verbs:describe", "verbs:query", "verbs:phase", "verbs:auto-handover-config"], jev = ["jev:*", "verbs:jev", "verbs:jev-setup", "verbs:jev_sweep", "verbs:jev-report"], updates = ["verbs:version", "verbs:update", "verbs:engine-update", "verbs:install-codex", "verbs:install-statusline", "verbs:uninstall-statusline", "verbs:migrate", "verbs:refresh", "verbs:maintain", "verbs:backup", "verbs:restore"] }

[web.sse_keepalive_s]
doc = "Interval of the keep-alive comment on the event stream."
value = 15
min = 1

[web.max_streams]
doc = "Most event streams open at once; more are refused with 503."
value = 16
min = 1

[web.start_wait_ms]
doc = "How long `ah-engine web` waits for a freshly started server to publish its state file."
value = 8000
min = 500

[web.start_poll_ms]
doc = "Poll interval of that wait."
value = 50
min = 10

[web.open_browser]
doc = "Open the page in the default browser after `ah-engine web` (the --no-open flag overrides it)."
value = true

[web.open_cmd]
doc = "Command that opens a URL; the URL is appended as the last argument."
value = ["open"]

[web.proc_name]
doc = "The name the server is recorded under for `ah-engine proc` (status, stop, restart by pid)."
value = "ah-web"

[web.proc_kind]
doc = "The kind it is recorded as."
value = "web"

[web.bin_name]
doc = "File name of the server binary, looked up next to the engine binary."
value = "ah-web"

[web.heartbeat_warn_s]
doc = "An agent whose last output is older than this many seconds shows its heartbeat in the warning colour."
value = 60
min = 1

[web.heartbeat_stale_s]
doc = "An agent whose last output is older than this many seconds shows its heartbeat in the stale colour."
value = 600
min = 1

[web.msg_disabled]
doc = "Printed when web.enabled is false."
value = "The Command Center is switched off (web.enabled = false)."

[web.msg_url]
doc = "Printed with the page address. Placeholder: {url}."
value = "Command Center: {url}"

[web.msg_start_failed]
doc = "Printed when the server did not publish its state file in time. Placeholder: {bin}."
value = "The Command Center did not start ({bin}); see the engine log."

[web.msg_no_bin]
doc = "Printed when the server binary is missing. Placeholder: {bin}."
value = "The Command Center server binary was not found: {bin}"

[web.msg_status_stopped]
doc = "Printed by `ah-engine web status` when no server is running."
value = "Command Center: not running"

[web.msg_status_running]
doc = "Printed by `ah-engine web status` when the server runs. Placeholders: {pid}, {url}."
value = "Command Center: running (pid {pid}) {url}"

[web.msg_usage]
doc = "Usage line of `ah-engine web`."
value = "usage: ah-engine web [open|status] [--no-open] [--json]"

[web.csp]
doc = "Content-Security-Policy header sent with every page and file."
value = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

[web.mime]
doc = "Content type by file extension for the files the server serves; any other extension is refused."
value = { html = "text/html; charset=utf-8", css = "text/css; charset=utf-8", js = "text/javascript; charset=utf-8", mjs = "text/javascript; charset=utf-8", wasm = "application/wasm", json = "application/json", svg = "image/svg+xml", woff2 = "font/woff2", png = "image/png", ico = "image/x-icon" }

[web.boot_marker]
doc = "The text in the index file that the server replaces with the page's boot data (texts and thresholds as JSON)."
value = "__AH_BOOT__"

[web.step_max_chars]
doc = "Longest 'doing now' text sent per agent, in characters."
value = 240
min = 20

[web.number_units]
doc = "How the page writes long numbers (tokens, requests, counts, in the tables, tiles and details): from `from` up a number is divided by `div` and gets `suffix`. Ascending; the last step reached applies; below the first step the number is written whole."
value = [
  { suffix = "k", from = 1000, div = 1000 },
  { suffix = "M", from = 1000000, div = 1000000 },
  { suffix = "G", from = 1000000000, div = 1000000000 },
]

[web.number_decimals]
doc = "Digits after the point in a scaled number (1.1M); a trailing zero part is dropped (12k, not 12.0k)."
value = 1
min = 0
max = 3

[web.number_raw_keys]
doc = "Tracker fields in the details panel that are identifiers, not quantities, and so are never scaled."
value = ["pid"]

[web.project_workspace_marker]
doc = "A path segment that marks a DevSwarm workspace checkout; agents whose directory contains it are workspaces of the project their checkout belongs to, never that project's Primary."
value = "/.devswarm/repos/"

[web.project_git_entry]
doc = "Name of the entry that marks a git checkout's top folder (a folder for a clone, a file for a linked worktree or submodule)."
value = ".git"

[web.project_gitdir_split]
doc = "In the path a linked worktree or submodule's git file points at, the text after which the shared repository's own folder ends; the project is the folder before it."
value = "/.git/"

[web.project_primary_role]
doc = "The tracker role of a project's Primary agent."
value = "primary"

[web.project_primary_kinds]
doc = "Agent kinds that can be a project's Primary."
value = ["main", "workspace"]

[web.project_workspace_kinds]
doc = "Agent kinds that are a DevSwarm workspace when their directory is a workspace checkout."
value = ["main", "workspace"]

[web.project_cache_max]
doc = "How many directory-to-project answers the server keeps; the cache is emptied when it grows past this."
value = 2000
min = 10

[web.placeholder_kind]
doc = "The kind shown for a parent agent that a sub-agent names but the tracker does not list."
value = "workspace"

[web.project_workspace_file]
doc = "The file in a DevSwarm workspace set's folder (the first segment after the workspace marker) that names the repository the set belongs to: a checkout that is gone is still grouped under that repository's project."
value = ".devswarm.code-workspace"

[web.project_workspace_folders]
doc = "The key of that file's list of folders; the first one is the repository."
value = "folders"

[web.project_workspace_path]
doc = "The key of a folder entry's path."
value = "path"

[web.placeholder_state]
doc = "The state shown for such a parent."
value = "waiting"

[web.placeholder_label]
doc = "The name shown for such a parent (never its raw id). Placeholder: {id} is still accepted and replaced by its first characters."
value = "Workspace (no longer tracked)"

[web.client_label]
doc = "How a Health client (a hook session) is named once the tracker knows it. Placeholders: {project}, {name} (its session or agent title)."
value = "{project} \u00b7 {name}"

[web.placeholder_id_chars]
doc = "How many characters of the missing parent's id its name carries."
value = 8
min = 1

[web.project_home_label]
doc = "The project name shown for agents working in the home folder."
value = "Home"

[web.project_none_label]
doc = "The project name shown for agents that report no folder."
value = "Other"

[web.kind_order]
doc = "Order of agent kinds in the tree (first = top)."
value = ["main", "workspace", "subagent", "teammate", "codex", "heartbeat"]

[web.msg_unauthorized]
doc = "Body of the refusal sent to a request without the session token."
value = "Open the Command Center with `ah-engine web`."

[web.msg_busy]
doc = "Body sent when too many event streams are open."
value = "Too many open dashboard tabs."

[web.msg_not_found]
doc = "Body sent for a file that does not exist."
value = "Not found."

