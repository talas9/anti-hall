min = 4
max = 200

[web.live_events_max]
doc = "Most hook-event nodes the Live screen draws."
value = 8
min = 2
max = 60

[web.live_rate_window_s]
doc = "Seconds the Live screen averages a rate over (decisions per second, edge rates)."
value = 10
min = 1
max = 300
unit = "s"

[web.live_block_window_s]
doc = "Seconds the Live screen's blocks counter looks back."
value = 300
min = 10
max = 86400
unit = "s"

[web.live_timeline_max]
doc = "Rows of the Live screen's timeline strip."
value = 40
min = 5
max = 500

[web.live_panel_rows]
doc = "Recent decisions kept per node for the Live screen's side panel."
value = 12
min = 1
max = 200

[web.live_top_n]
doc = "Checks listed in the Live screen's top list."
value = 5
min = 1
max = 50

[web.live_tick_ms]
doc = "Milliseconds between the Live screen's counter and edge-rate updates (500 = twice a second at most)."
value = 500
min = 250
max = 10000
unit = "ms"

[web.live_block_decisions]
doc = "Decision names the Live screen counts as a block."
value = ["block"]

[web.live_action_fx]
doc = "Effect each action plays on its node: ripple, ring or shake. Keys are the engine's action-log action names; a refused action always shakes."
value = { send = "ripple", progress = "ripple", ping = "ripple", stop = "ring", restart = "ring", set = "ring", reset = "ring", undo = "ring", poke = "ripple", nudge = "ripple", default = "ripple" }

[web.live_outcome_fx]
doc = "Effect colour key by action outcome (see web.graph.fx.colors)."
value = { ok = "action", refused = "refused", failed = "block" }

[web.live_travel_fx]
doc = "Effect colour key of the first leg of a decision particle (event to check)."
value = "travel"

[web.live_decision_fx]
doc = "Effect colour key by decision name (see web.graph.fx.colors): allow green, advisory amber, block red; error plays as a block, defer as an inject."
value = { allow = "allow", advisory = "advise", block = "block", error = "block", defer = "inject" }

[web.live_inject_decision]
doc = "A decision with this name that put text into the model's context plays in the inject colour instead."
value = "allow"

[web.live_inject_fx]
doc = "Effect colour key of a decision that injected text into the context."
value = "inject"

[web.live_backfill]
doc = "Newest decisions a new page receives with its first snapshot, so the Live screen starts with something to show."
value = 40
min = 0
max = 500

[web.live_actions_file]
doc = "The engine's action log, in the directory of the engine socket; the server follows it for the Live screen's action effects."
value = "actions.ndjson"

[web.live_actions_max_bytes]
doc = "Most bytes of the action log read in one round (a larger backlog is skipped to its newest lines)."
value = 65536
min = 1024
max = 4194304
unit = "bytes"

[web.live_map_ttl_s]
doc = "Seconds the hook wiring (event to check) is kept before `describe` is asked again."
value = 300
min = 5
max = 86400
unit = "s"

[web.live_map_timeout_ms]
doc = "Longest the server waits for `describe` to answer."
value = 15000
min = 1000
max = 120000
unit = "ms"

[web.live_map_parts]
doc = "The `describe` parts the Live screen reads (`describe --part`)."
value = ["bindings"]

