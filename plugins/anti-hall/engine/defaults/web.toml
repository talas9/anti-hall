doc = "The graph component's config file, relative to the plugin root; the server turns it into the JSON the page reads."
value = "engine/defaults/web_graph.toml"

[web.live_col_gap]
doc = "Distance between the Live screen's columns (events, checks, decisions), in graph units."
value = 330
min = 100
max = 2000

[web.live_row_gap]
doc = "Distance between two rows of the Live screen, in graph units."
value = 70
min = 40
max = 400

