value = "gate-intent"

[devswarm_cli.verb_wake_directive]
doc = "The verb that reprints the SessionStart mailbox-wake directive (native for a child workspace)."
value = "wake-directive"

[devswarm_cli.verb_notice]
doc = "The maintainer-notice verb (`--list` is native, `--post` is Node's)."
value = "notice"

