# ah-engine shipped defaults for the task fact model and task Stop gates ported from Node (task-lifecycle-log,
# dispatch-tier, task-tracker, task-guard, tasklist-guard) and the helpers they share (checks::taskkit) (D17, D30, D74).
# Format: see the header of engine.toml. Regex sources use JavaScript syntax and are translated by checks::guardkit::jsre.

# ---- shared helpers (checks::taskkit) ---------------------------------------------------------------------

[taskkit.unknown_session]
doc = "The session id used in a file name when the payload carries none, or only characters a file name part may not hold (the Node `UNKNOWN_SESSION`)."
value = "unknown-session"

[taskkit.session_id_unsafe]
doc = "Characters that are removed from a session id before it becomes part of a ledger file name (JavaScript regex source of a negated class)."
value = '[^A-Za-z0-9_-]'

[taskkit.control_chars]
doc = "Characters a ledger line replaces with a space (C0 controls, DEL and C1 controls), as the body of a JavaScript regex class."
value = '[\x00-\x1F\x7F-\x9F]'

[taskkit.exact_digits]
doc = "Most significant digits a JSON number may have for its text to be taken as JavaScript prints it; a number with more digits is left to the Node hook (several shortest round-trip texts exist and the two languages may pick different ones)."
value = 15
min = 1
max = 15

[taskkit.tmp_env_names]
doc = "The environment variables `os.tmpdir()` reads for the temp directory, in order; without any the temp directory is /tmp."
value = ["TMPDIR", "TMP", "TEMP"]

[taskkit.ellipsis]
doc = "What is appended to a ledger field that was cut to its limit."
value = "…"

[taskkit.gitdir_line]
doc = "JavaScript regex source of the line that names the git directory in a `.git` file (the `m` flag applies)."
value = '^\s*gitdir:\s*(.+?)\s*$'

[taskkit.git_entry]
doc = "The name of the entry that marks a git checkout root."
value = ".git"

# ---- task-lifecycle-log ---------------------------------------------------------

[task_lifecycle_log.summary]
doc = "One-line description of the task-lifecycle-log check in the generated reference."
value = "Appends one line per TaskCreated/TaskCompleted event to the per-session history ledger and its index."

[task_lifecycle_log.setting]
doc = "Where the on/off switch is read from (maintenance.taskLifecycleLog, default on)."
value = { section = "maintenance", key = "taskLifecycleLog", env = "", aliases = [], option = "maintenance_task_lifecycle_log", default = true }

[task_lifecycle_log.dedupe_setting]
doc = "Off switch (maintenance.taskLifecycleDedupe, default on, GH #794): a task event (created, completed) is written to the history ledger once. A repeat of the same event for the same task id (the hook is reached again for a teammate's completion, then the session's) adds no row; one completion produced five."
value = { section = "maintenance", key = "taskLifecycleDedupe", env = "ANTIHALL_TASK_LIFECYCLE_DEDUPE", aliases = [], option = "", default = true }

[task_lifecycle_log.events]
doc = "The hook events the ledger records."
value = ["TaskCreated", "TaskCompleted"]

[task_lifecycle_log.task_id_max]
doc = "Longest task id kept in a ledger line, in UTF-16 units."
value = 200
min = 1

[task_lifecycle_log.subject_max]
doc = "Longest task subject kept in a ledger line, in UTF-16 units."
value = 200
min = 1

[task_lifecycle_log.teammate_max]
doc = "Longest teammate name kept in a ledger line, in UTF-16 units."
value = 100
min = 1

[task_lifecycle_log.separator]
doc = "The separator between the fields of a ledger line (a middle dot with a space on each side)."
value = " · "

[task_lifecycle_log.name_max]
doc = "Longest file name (in bytes) the file system takes; a ledger name past it cannot be created, so the event is not recorded (Node: the append fails and the hook stops quietly)."
value = 255
min = 1

[task_lifecycle_log.history_dir]
doc = "The ledger directory under the project root, as path segments."
value = [".anti-hall", "history"]

[task_lifecycle_log.index_name]
doc = "The index file name inside the history directory."
value = "INDEX.md"

[task_lifecycle_log.ledger_ext]
doc = "The ledger file extension."
value = ".md"

# ---- dispatch-tier -------------------------------------------------------------------------

[dispatch_tier.summary]
doc = "One-line description of the dispatch-tier check in the generated reference."
value = "Asks Jev (dispatchTier, detached) how a new or changed task should be dispatched, once per task text, and keeps the request marker in dispatch-tier-state.json; does nothing while the integration is off."

[dispatch_tier.jev_id]
doc = "The Jev integration id the dispatch-tier hook asks."
value = "dispatchTier"

[dispatch_tier.tools]
doc = "The task tools whose text changes the hook classifies."
value = ["TaskCreate", "TaskUpdate"]

[dispatch_tier.owner_marker_setting]
doc = "Owner-blocked marker switch. Where the switch of the owner-blocked marker is read from (guards.taskGuardOwnerBlockedMarker, default on): a task marked as waiting on the owner is never classified."
value = { section = "guards", key = "taskGuardOwnerBlockedMarker", env = "ANTIHALL_TASK_GUARD_OWNER_BLOCKED_MARKER", aliases = [], option = "guards_task_guard_owner_blocked_marker", default = true }

[dispatch_tier.owner_values]
doc = "The blockedOn values (trimmed, lowercase) that mark a task as waiting on the owner."
value = ["owner", "user", "human", "external"]

[dispatch_tier.owner_subject_re]
doc = "JavaScript regex source (case-insensitive) of a subject that marks a task as waiting on the owner (OWNER: ... or OWNER DECISION ...)."
value = '^\s*owner(:|\s+decision\b)'

[dispatch_tier.text_cap]
doc = "Most UTF-16 units of a task's text (subject, newline, description) that Jev is asked about."
value = 600
min = 1

[dispatch_tier.request_ttl_ms]
doc = "How long a request marker stops the same task text from being asked again while the first ask may still be in flight; older markers are dropped when the state is written."
value = 600000
min = 1
unit = "ms"

[dispatch_tier.max_sessions]
doc = "Sessions the state file keeps recommendation tracking for; the longest untouched go first."
value = 50
min = 1

[dispatch_tier.state_file]
doc = "The state file (requested markers and per-session tracking), inside the anti-hall directory of the home."
value = "dispatch-tier-state.json"

[dispatch_tier.question_instructions]
doc = "The question put to Jev (a choice question over the three tiers)."
value = "Classify how an orchestrating agent should dispatch this task."

[dispatch_tier.tier_workspace]
doc = "The description of the workspace tier in the question."
value = "a large multi-step feature, migration or release spanning several files or components over a long stretch of work, that needs its own branch and its own review (a separate child workspace). NOT a bug fix, UI text or copy change, or any task confined to one file or one component"

[dispatch_tier.tier_workflow]
doc = "The description of the workflow tier in the question."
value = "breadth-first or parallelisable work: 3 or more clearly independent or nested agent spawns, or a review fan-out over many targets, best lifted into one deterministic workflow. NOT a single-file or single-component change, however important its priority label"

[dispatch_tier.tier_subagent]
doc = "The description of the subagent tier in the question."
value = "the DEFAULT when unsure: a lookup, a bug fix, a UI text or copy change, any change confined to one file or one component, a single command, or a single review pass that one background agent can finish. A priority label (P0, P1, P2) says nothing about size"

# ---- task fact model (checks::taskstate: lib/task-state.js, task-guard.js parseTasksFromFile, lib/task-subject-backfill.js) ----

[taskstate.js_parse_max_depth]
doc = "The deepest bracket nesting of a transcript line the engine reads the way JSON.parse does when serde_json's 128-level limit rejects it (JavaScript's own stack ends far past it). A deeper line cannot be read and leaves the scan unsure."
value = 2000
min = 128
max = 100000

[taskstate.tail_bytes]
doc = "How much of the end of a transcript the task reconstruction reads (the Node `MAX_TAIL_BYTES`, 1.5 MiB)."
value = 1572864
min = 1

[taskstate.prompt_key_max_lines]
doc = "How many of the newest user-entry lines of the transcript tail the task guard reads to find the newest real prompt (its key). Tool results are user entries too, so a long run of them is skipped; when the newest this-many are all unusable the whole tail is read, so the key is the same as a full scan gives. 0 reads every user line."
value = 64
min = 0

[taskstate.store_base]
doc = "Path parts, under the home directory, of Claude Code's own task store: one directory per task list, one `<id>.json` per task. It is the authoritative list when it exists (the transcript tail of a long session no longer holds the creates). Codex has no such store, so it keeps the transcript reconstruction."
value = [".claude", "tasks"]

[taskstate.store_dir_names]
doc = "Candidate directory names of a session's task list under the store, tried in order, the first that exists wins. `{sid}` is the session id, `{sid8}` its first 8 characters (the list id the `session-<8>` convention uses). A session id with a character outside `[A-Za-z0-9_-]` is not looked up."
value = ["session-{sid8}", "{sid}"]

[taskstate.store_pointer_file]
doc = "Name of the file a session's own store directory holds when its tasks live in ANOTHER list (a resumed or shared session): its text is the id of that list (`taskstate.list_id_re`), whose directory under the store is then read instead. Followed one hop; a missing file, an invalid id or a list directory that does not exist leaves the session's own directory as the list."
value = ".session-list"

[taskstate.store_pointer_max_bytes]
doc = "Bytes of the pointer file read (a list id is one directory name)."
value = 256
min = 1

[taskstate.list_id_env]
doc = "Name of the environment variable Claude Code reads to put a session's tasks in a NAMED list (`<store_base>/<list id>/`) instead of `session-<8>`. The R-pair spawn-by-id check reads that named list as THE list when the variable is set to a valid id and its directory exists (even empty: Claude Code then keeps the session's tasks only there, and the `session-<8>` directory is left empty). Forwarded to the checks by `request_env.allow`. Unset, or a value that is not a valid id, or no such directory: the `store_dir_names` candidates apply."
value = "CLAUDE_CODE_TASK_LIST_ID"

[taskstate.list_id_re]
doc = "A valid named-list id (one directory name under the store: starts with a letter, digit or underscore, then letters, digits, `_`, `.` or `-`; never a path)."
value = "^[A-Za-z0-9_][A-Za-z0-9_.-]*$"

[taskstate.store_file_suffix]
doc = "Suffix of the task files in a store directory (the lock and high-water-mark files lack it)."
value = ".json"

[taskstate.store_max_files]
doc = "Most task files read from one store directory; a larger directory is read as absent and the transcript reconstruction answers (fail-open, bounded hook latency)."
value = 1000
min = 1

[taskstate.store_file_max_bytes]
doc = "Largest task file read; a bigger one is skipped."
value = 65536
min = 1

[taskstate.store_fields]
doc = "Field names of a task file in the store that a reader needs: `id` (a string or a number) and `status` (a string). A file without both is not a task. The ladder reads the open-task fact from the store with them, as the task guards do."
value = { id = "id", status = "status" }

[taskstate.memo_entries]
doc = "How many task reconstructions of a transcript file the engine remembers, each for one state of the file (its size, modification time, window sizes and variant). The Stop checks task-guard (twice), task-pair-guard and tasklist-guard each rebuild the same task list from the same tail, and a tail cut in the middle of a task's history makes each of them scan back up to taskstate.backfill_exact_bytes; with this memo the first check computes it and the others take its answer. A changed file is read afresh. The least recently used is dropped first. 0 turns the memo off and every check reconstructs for itself."
value = 16
min = 0
unit = "count"

[taskstate.re_created]
doc = "JavaScript regex source (case-insensitive) of the tool result that announces a new task and names its number."
value = '^Task\s+#(\d+)\s+created\s+successfully'

[taskstate.re_list_empty]
doc = "JavaScript regex source (case-insensitive) of the TaskList result that says the task store is empty."
value = '^\s*No\s+tasks\s+found\b'

[taskstate.re_not_found]
doc = "JavaScript regex source (case-insensitive) of the TaskGet or TaskUpdate result that says one task id does not exist."
value = '^\s*Task\s*(?:#\S+)?\s*not\s+found\b'

[taskstate.id_keys]
doc = "The input fields a task tool call may name its task id in, in order: the harness's `taskId`, then `id`, then `task_id`."
value = ["taskId", "id", "task_id"]

[taskstate.skipped_row_types]
doc = "The transcript row types the task model does not read: rows that replay a request's whole message array (the `api-request-blob` rows), which carry copies of task tool uses and of their results for tasks the conversation has long settled, so reading them makes ghost or stale tasks. Every other row type, an unknown, empty, missing or non-string one included, is read as conversation (a skipped real row could let a Stop through with a task open)."
value = ["api-request-blob"]

[taskstate.tools_collect_keys]
doc = "The object keys the tool-use collector descends into, in order (the Node `collectToolUses`)."
value = ["content", "message", "messages", "tool_uses", "parts"]

[taskstate.task_tools]
doc = "The tool names a task reconstruction reacts to (a call that creates, updates, lists or reads tasks, or rewrites the whole list). The kept task lines (transcript.tasks_cache_*) hold every line that names one; a name a reconstruction acts on that is missing here would make its kept answer differ from a fresh read."
value = ["TodoWrite", "TaskCreate", "TaskUpdate", "TaskList", "TaskGet"]

[taskstate.in_progress_statuses]
doc = "Statuses (lowercase) that count a task as in progress (a subset of the open statuses); the open-task facts the Stop gate reads from the session task store use it."
value = ["in_progress", "in-progress"]

[taskstate.pending_statuses]
doc = "Statuses (lowercase) that count an open task as waiting to start; with the in-progress statuses they make up the open ids the Stop gate reads from the session task store."
value = ["pending"]

[taskstate.open_statuses]
doc = "Statuses (lowercase) that make a task open."
value = ["pending", "in_progress", "in-progress"]

[taskstate.done_statuses]
doc = "Statuses (lowercase) that count as completed for the completed-task advisory."
value = ["completed", "done", "cancelled", "canceled"]

[taskstate.since_status_re]
doc = "JavaScript regex source (case-insensitive) of the TaskUpdate statuses that restart a task's clock (`sinceMs`, read by the idle-neglect proof)."
value = '^(pending|in[-_]?progress)$'

[taskstate.terminal_status_re]
doc = "JavaScript regex source (case-insensitive) of the statuses that close a task for the backfill (`TERMINAL`)."
value = '^(completed|done|cancelled|canceled|deleted)$'

[taskstate.backfill_max_subject]
doc = "Longest subject the backfill recovers, in UTF-16 units."
value = 200
min = 1

[taskstate.backfill_max_candidates]
doc = "How many unpaired task-creation results the backfill remembers while scanning backward."
value = 256
min = 1

[taskstate.backfill_chunk_bytes]
doc = "How much of the transcript the backfill reads at a time."
value = 1048576
min = 4096

[taskstate.cut_check_lines]
doc = "How many transcript lines the task-state scans (the tail reconstruction, the scan view and the widened task-activity search) read between two looks at their call's cut (the request's client deadline, or the check's cap: daemon.check_reserve_ms); the backfill looks once per chunk (taskstate.backfill_chunk_bytes). A cut scan stops and answers unsure (never a partial list taken as whole, and never kept for the next call), so the call fails as a cut and the checks after it keep their time (#763)."
value = 256
min = 1

[taskstate.backfill_exact_bytes]
doc = "How far back the backfill scans before the engine hands the call to Node: Node's own byte cap (64 MiB). Node also stops after 150 ms of wall clock; the engine scans a fixed number of bytes instead so its answer never depends on machine speed. Where Node's clock would have stopped it short on a slow machine, the engine finds the subjects Node missed (a fuller note, never a missing one); past this bound it defers rather than guess where Node would have stopped."
value = 67108864
min = 4096

[taskstate.backfill_prefix_scan_bytes]
doc = "How far past the window start the backfill looks for the end of the line that straddles it."
value = 8388608
min = 4096

[taskstate.unknown_max_notes]
doc = "How many times the unknown-state note may be printed for one session and tag."
value = 3
min = 1

[taskstate.unknown_note_text]
doc = "The unknown-state note; `{n}` is the number of tasks."
value = "{n} task(s) in an unknown state (their records are too far back to read) — re-state each with TaskUpdate (status) to refresh."

[taskstate.unknown_file_prefix]
doc = "Prefix of the per-session file that remembers which unknown set was last announced."
value = "last-unknown"

[taskstate.prune_ttl_days]
doc = "Per-session state files older than this many days are removed by the opportunistic sweep."
value = 7
min = 1

[taskstate.prune_throttle_hours]
doc = "The sweep of one file prefix runs at most once per this many hours."
value = 6
min = 1

[taskstate.prune_stamp_prefix]
doc = "Prefix of the stamp file that throttles one prefix's sweep."
value = ".prune-stamp-"

# ---- task snapshot (#390): the list a transcript tail can no longer show -----------------------------

[taskstate.snapshot_enabled]
doc = "Keep one snapshot file of each session's rebuilt task list and lay the transcript-tail result over it (the tail wins per task id). Without it a list whose creates lie more than taskstate.tail_bytes before the end of the transcript is read as no tasks, and every task guard goes quiet. False = the tail alone, as before (kill switch)."
value = true

[taskstate.snapshot_dir]
doc = "Directory of the task snapshots, relative to paths.base_dir (the home directory's state directory). One file per session transcript, overwritten in place. The engine never deletes a snapshot: when taskstate.snapshot_max_files is reached no new file is made, and old ones are left for the owner to remove."
value = "ah-engine/task-snapshots"

[taskstate.snapshot_file]
doc = "File name of one session's snapshot. `{name}` is the transcript's file name without its extension (characters outside [A-Za-z0-9_.-] become `_`, cut to taskstate.snapshot_name_max), `{hash}` the first taskstate.snapshot_hash_len hex digits of the SHA-1 of the transcript path (two transcripts of one name do not share a file)."
value = "{name}-{hash}.json"

[taskstate.snapshot_name_max]
doc = "Most characters of the transcript's file name used in a snapshot file name."
value = 64
min = 1

[taskstate.snapshot_hash_len]
doc = "Hex digits of the transcript path's SHA-1 in a snapshot file name."
value = 8
min = 4
max = 40

[taskstate.snapshot_max_files]
doc = "Most files in the snapshot directory. At the cap a session that has no snapshot yet gets none (fail-open: its tail alone answers; counted as snapshot_error kind `cap`); nothing is deleted. A session that already has a file keeps updating it."
value = 200
min = 1

[taskstate.snapshot_max_bytes]
doc = "Largest snapshot written. A list over it is written without its finished tasks; still over, the write is skipped (counted as snapshot_error kind `big`). Must stay under script.write_max_bytes."
value = 262144
min = 1024
unit = "bytes"

[taskstate.snapshot_gap_max_bytes]
doc = "Most bytes read to catch a snapshot up when the transcript tail starts after the snapshot's size (bytes nobody has read since the snapshot was written, which can hold a TaskUpdate that finished a task the snapshot still lists as open). The rebuild then reads back to the snapshot's size instead of taskstate.tail_bytes. A gap over this is not read: the snapshot is not trusted for that rebuild (discarded, reason gap) and the tail alone answers, so no Stop blocks on a list that may be stale."
value = 8388608
min = 1
unit = "bytes"

[taskstate.snapshot_refresh_bytes]
doc = "A snapshot whose tasks did not change is rewritten only after the transcript grew by this much since the last write (the recorded size is what tells a replaced, smaller transcript from the one the snapshot belongs to)."
value = 262144
min = 1
unit = "bytes"

[taskstate.snapshot_format]
doc = "Version stamped in a snapshot; a snapshot with another number is read as absent (counted as discarded, reason `format`) and replaced. 2 added the session id and the file fingerprint; 3 added, per task, the tool-use id of the TaskCreate that made it (a task's identity: the subject is not one)."
value = 3
min = 1

[taskstate.snapshot_lock_suffix]
doc = "Suffix of the lock file a rebuild holds while it merges and rewrites a session's snapshot (next to the snapshot, never counted against taskstate.snapshot_max_files). Without a lock two hooks that rebuild at the same instant could each rewrite the whole file and lose the other's section."
value = ".lock"

[taskstate.snapshot_lock_kind]
doc = "How the snapshot lock is taken: `flock` (a kernel lock on the file named by taskstate.snapshot_flock_suffix: one open and one lock call, released by the kernel when the holder dies; no Node peer uses this file) or `file` (the lock file of taskstate.snapshot_lock_suffix with the owner record, stale takeover and sidecar of the Node lock protocol: four directory creates and four removals per cycle). `file` is the kill switch. Where the platform or filesystem has no flock at all (ENOTSUP, EOPNOTSUPP, ENOSYS), a rebuild falls back to `file` on its own (counted snapshot_lock kind `fallback`); any other failure to take the flock (the file will not open, is a link, an errno) writes nothing (counted snapshot_lock result `failed`). On `file` and on the fallback a lock that is not positively held (busy, no lock file can be made, an exception) also writes nothing."
value = "flock"

[taskstate.snapshot_flock_suffix]
doc = "Suffix of the file a rebuild flocks when taskstate.snapshot_lock_kind is `flock`. Kept (never deleted) next to the snapshot and never counted against taskstate.snapshot_max_files. Must differ from taskstate.snapshot_lock_suffix: an engine still on the lock-file protocol would read this empty file as a stale holder."
value = ".flock"

[taskstate.snapshot_lock_group]
doc = "The defaults group whose `lock_*` keys (stale, step, reclaim, release) time the snapshot lock; the wait is taskstate.snapshot_lock_wait_ms."
value = "advisor"

[taskstate.snapshot_lock_wait_ms]
doc = "How long a rebuild waits for the snapshot lock. A rebuild that cannot take it writes no snapshot this time (its answer is unchanged; counted as snapshot_error kind `lock`) and the next rebuild writes."
value = 250
unit = "ms"
min = 0

[taskstate.snapshot_fingerprint_bytes]
doc = "Bytes hashed for the transcript fingerprint kept in a snapshot: the first bytes of the file, and the same number of bytes just before the tail window as it stood when the snapshot was written (read back at that fixed offset, so appends do not move it). A transcript whose bytes there differ is another file under the same path: the snapshot is discarded (reason `replaced`). Two reads of this size per rebuild."
value = 4096
min = 64
unit = "bytes"

# ---- task-guard --------------------------------------------------------------------------------

[task_guard.summary]
doc = "One-line description of the task-guard check in the generated reference."
value = "Stop gate: blocks a Stop while tasks are open (the idle-neglect block when dispatchable work has no running agent, else the generic block), with the loop state, the per-prompt budget and the OMC and live-agent steps aside of the Node hook; hands a Stop whose answer needs the DevSwarm app database to Node."

[task_guard.guard_name]
doc = "The guard id of task-guard (the skip key and the message prefix)."
value = "task-guard"

[task_guard.setting]
doc = "Where the on/off switch is read from (guards.taskGuard, default on)."
value = { section = "guards", key = "taskGuard", env = "", aliases = [], option = "guards_task_guard", default = true }

[task_guard.prune_setting]
doc = "Completed or cancelled tasks kept before the task tracker suggests pruning."
value = { section = "guards", key = "pruneCompletedTasksAfter", env = "ANTIHALL_PRUNE_COMPLETED_TASKS_AFTER", aliases = [], min = 1, default = 3 }

[task_guard.hold_state_prefix]
doc = "Prefix of the per-session file under the state directory that holds, per task hold (the task id, the exemption kind and a hash of its marker text), when the Stop first saw it: the clock of nudges.hold.hold_max_ms. Past it the hold lapses and the normal rule applies; a changed marker text is a confirmed blocker and restarts the clock. Covers the owner, blocked_on, parked and clock exemptions of task-guard."
value = "task-holds-"

[task_guard.state_prefix]
doc = "Prefix of the per-session file that holds the last blocked task set (`last-stop-taskset-<session>`)."
value = "last-stop-taskset-"

[task_guard.session_hash_len]
doc = "How many hex characters of the transcript path hash name a session that has no id."
value = 16
min = 1

[task_guard.note_line]
doc = "The line that carries the unknown-state note; `{note}` is the note."
value = "[task-guard] {note}\n"

[task_guard.unknown_tag]
doc = "The tag of the unknown-state note's state file for task-guard."
value = "guard"

[task_guard.judge_child_env]
doc = "The environment variable that marks a judge child process; every task hook is a no-op there."
value = "ANTIHALL_JUDGE_CHILD"

# -- task-guard: the open-task decision (sharp idle-neglect block, generic block, loop state)

[task_guard.max_blocks]
doc = "Most Stop blocks task-guard makes per cap_scope window (both kinds counted); a new real owner turn resets the default owner_turn window. Same-set dedupe remains independent."
value = 5
min = 1

[task_guard.cap_scope]
doc = "Block-cap scope: owner_turn (default) resets max_blocks on a new real user turn; session keeps a session-wide cap. Tool results, hook text, notifications and cross-session messages never reset it. Missing legacy window metadata starts a fresh owner-turn window, with an original-state backup."
value = "owner_turn"

[task_guard.hash_sep]
doc = "The separator between the task ids hashed into the loop state (a NUL character)."
value = "\u0000"

[task_guard.idle_hash_tags]
doc = "The words that start the hashed text of an idle-neglect block, so its loop state never equals a generic block's."
value = ["idle", "no-agents"]

[task_guard.state_hash_key]
doc = "The loop state file's field for the hash of the last blocked set."
value = "hash"

[task_guard.state_blocks_key]
doc = "The loop state file's field for the number of blocks made in the current cap_scope window."
value = "blocks"

[task_guard.pending_status]
doc = "The status (lowercase) of a task that can be dispatched now."
value = "pending"

[task_guard.owner_name_key]
doc = "The field of the Agent call that launched a running agent which names it (its `name`). A task whose owner is that name is attended, like one owned by the agent's id or description."
value = "name"

[task_guard.owner_decision_markers]
doc = "Case-insensitive phrases in a task owner, subject or description that mean an explicit owner decision is pending. Honored while guards.taskGuardOwnerBlockedMarker is enabled."
value = ["owner-go", "waiting owner", "needs your OK"]

[task_guard.advise_unresolved_owners]
doc = "Advise instead of blocking Stop when a non-coordinator task owner names agent work this session can see (a launched or tracked agent) whose liveness no source can tell. An owner whose agent is known to have ended is not unresolved and blocks. False restores blocking for unresolved owners."
value = true

