# ---- work detection (checks::taskkit::workdetect: lib/work-detect.js) ---------------------------------------------------

[workdetect.always_work]
doc = "JavaScript regex source (case-insensitive) of the shell commands that always count as work: git history and dependency mutations, `sed -i`, installs and `patch`."
value = '\bgit\s+(?:commit|rebase|merge|cherry-pick|stash|reset|apply|am)\b|\bgit\s+(?:checkout|switch|restore|clean)\b|\bsed\s+-i|\bnpm\s+(?:install|i|ci)\b|\b(?:pnpm|yarn)\s+(?:add|install)\b|\bpip\s+install\b|\bpatch\b'

[workdetect.command_position]
doc = "Regex source (case-insensitive) of the bare file verbs that count as work only at command position: at the start of a line, or after a separator, an opening parenthesis, a backtick or `$(`. A JavaScript `^` with the multiline flag also matches after a carriage return and the two Unicode line separators, which the character class lists."
value = '(?:^|[\n\r\u2028\u2029;&|`(]|\$\()\s*(?:rm|cp|mv|tee|mkdir|touch|make|chmod)\b'

[workdetect.scratchpad_path]
doc = "Regex source of a path inside the session scratchpad (a segment literally named scratchpad); writes there are message passing, not project work."
value = '\/scratchpad\/'

[workdetect.state_dir]
doc = "Regex source of a path inside anti-hall's own progress, history or handover directories; writing the bookkeeping the guard asks for is not work."
value = '(?:^|[\s/])\.anti-hall\/(?:progress|history|handovers)\/'

[workdetect.devswarm_housekeeping]
doc = "Regex source (case-insensitive) of a command segment that is only DevSwarm mesh housekeeping through the stable launcher: an inbox, heartbeat, send, relay, notice, nudge, roster or wake-directive verb."
value = '^\s*(?:node\s+)?(?:\S*[\\/])?devswarm\.js\s+(?:-\S+(?:\s+[^-\s]\S*)?\s+)*(?:inbox\s+(?:-\S+(?:\s+[^-\s]\S*)?\s+)*(?:pull|ack|ack-primary|read|read-primary|tick|count|peek-primary|messages)\b|heartbeat\b|send\b|relay\b|notice\b|nudge\b|roster\b|wake-directive\b)'

[workdetect.crontab_segment]
doc = "Regex source (case-insensitive) of the start of a crontab call at command position, optionally inside a leading subshell paren; a name that continues with a word character, dot or hyphen is not a crontab call (checked in code)."
value = '^[({\s]*crontab'

[workdetect.tmp_housekeeping_target]
doc = "Regex source (case-insensitive) of the redirect targets a housekeeping crontab install may write to: the scratchpad or a tmp directory."
value = '\/scratchpad\/|(?:^|\/)tmp\/'

[workdetect.dev_null]
doc = "Regex source of the null device, a redirect target that never counts as a write."
value = '\/dev\/null'

[workdetect.heredoc_delimiter]
doc = "Regex source of a heredoc operator and its delimiter word, which may be partly quoted or escaped; group 1 is the word."
value = '''^<<-?\s*((?:[^\s;&|()<>'"\\]|'[^'\n]*'|"[^"\n]*"|\\[^\n])+)'''

[workdetect.request_path_re]
doc = "Regex source (global) of a path named in a user request: an absolute, `~`, `./` or `../` path (group 1), or a relative one with at least one `/` (group 2). A write under such a path in a session with exactly ONE user request is the requested output, not untracked work."
value = '''(?:^|[\s"'`(=:,<>])(?:((?:~|\.{1,2})?\/[\w.@+~-]+(?:\/[\w.@+~-]+)*)|([\w.@+-]+(?:\/[\w.@+~-]+)+))'''

[workdetect.request_skip_prefixes]
doc = "A user-role transcript entry whose text starts with one of these is not a user request (a task notification, an injected reminder, a command echo, an interrupt marker); it neither counts as a request nor names an output path."
value = ["<task-notification", "<system-reminder", "<command-", "<local-command", "Caveat:", "[Request interrupted"]

[workdetect.request_path_trim]
doc = "Characters stripped from the end of a path found in a user request (sentence punctuation)."
value = ".,;:)>`'\""

[workdetect.never_work_tools]
doc = "Tools that start or schedule work and never change a file themselves."
value = ["Agent", "Task", "CronCreate", "CronDelete"]

[workdetect.mutating_tools]
doc = "File-mutating tools: each call counts as work unless it targets an excluded path."
value = ["Edit", "Write", "MultiEdit", "NotebookEdit"]

[workdetect.bash_write_verbs]
doc = "Shell commands whose file arguments are files the command changes (GH #794: the tasklist work count names real files, not command strings). The value says which arguments: `all` (every non-flag argument), `last` (the destination of cp, ditto and ln), `rest` (every argument after the first: the mode of chmod, the owner of chown) and `sed` (only `sed -i`: the file arguments after the script). A redirect target (`>`, `>>`) counts for any command. A command that names no file (git commit, mkdir, a build, an install) changes no file this count can name and counts nothing."
value = { rm = "all", cp = "last", mv = "all", tee = "all", touch = "all", chmod = "rest", chown = "rest", ln = "last", ditto = "last", ex = "all", vi = "all", vim = "all", sed = "sed" }

[workdetect.git_write_subcommands]
doc = "The git subcommands that change working-tree files by name, and how the files are named: `all` (every non-flag argument: `git rm`, `git mv`, `git restore`) and `dashes` (`git checkout`: the arguments after `--`, or, with no `--`, the arguments that are existing files, since a branch or ref is not one). Any other git command (commit, merge, rebase, stash, apply, push) names no file and counts nothing."
value = { rm = "all", mv = "all", restore = "all", checkout = "dashes" }

[workdetect.assign_builtins]
doc = "Shell builtins that stand before a `NAME=value` assignment and still make it (`export F=src/x`): the assignment is kept for the later segments of the same command, so `export F=src/x; echo > $F` names `src/x`."
value = ["export", "declare", "local", "readonly", "typeset"]

[workdetect.git_unknown_subcommands]
doc = "The git subcommands that change working-tree files WITHOUT naming them (GH #794: a command that changes files the count cannot name counts as one unknown project file, never zero). The value lists the words that make the subcommand count: `*` is always, `<none>` is the bare subcommand (a plain `git stash` stashes the changes), any other entry is a word among the arguments (`reset --hard`, `merge --continue`, `stash pop`). A merge, cherry-pick or branch switch that only brings in committed work is the integration the tasklist guard leaves out (workdetect.integration_work)."
value = { apply = ["*"], am = ["*"], rebase = ["*"], revert = ["*"], clean = ["*"], stash = ["<none>", "pop", "apply", "push", "save"], reset = ["--hard", "--merge", "--keep"], merge = ["--continue", "--abort"], "cherry-pick" = ["--continue"] }

[workdetect.unknown_write_res]
doc = "Regex sources (case-SENSITIVE: `-I` is not `-i`, `-C` is not `-c`) tested against a simple command from its command word on (quotes removed): a command that writes files whose names the count cannot read from its words counts as one unknown project file when no destination can be read from it (workdetect.unknown_write_targets) and it is not a dry run or listing (workdetect.unknown_write_readonly_res) (GH #794). `patch`, `install`, `dd of=`, `rsync`, `truncate`, an extracting or creating `tar` (also the dash-less `tar xzf`, workdetect.old_style_option_verbs), `unzip`, `perl -i` (only among the options BEFORE the script path or `-e`: `perl x.pl -input a` is a script argument), `awk -i inplace`."
value = ['^patch\b', '^install\b', '^dd\b.*\bof=', '^rsync\b', '^truncate\b', '^tar\b.*(?:\s-[A-Za-z]*[xcru]|\s--(?:extract|create|get|append|update)\b)', '^unzip\b', '^perl(?:\s+-I\s+\S+|\s+-[^\s-]\S*)*?\s+-[nalpsw0]*i', '^g?awk\b.*\s-i\s*inplace']

[workdetect.unknown_write_readonly_res]
doc = "Regex sources (case-sensitive) tested against a command that matched workdetect.unknown_write_res: a dry run, a check or a listing writes nothing, so it counts as no file. `rsync -n`/`--dry-run`/`--list-only`, `patch --dry-run`/`--check`/`-C`, `unzip -l`/`-t`/`-v`/`-p`/`-Z`, `tar -t`/`--list`, `tar -O`/`--to-stdout` (extracts to the terminal). A `dd of=/dev/null` is a device file, judged by workdetect.excluded_path_res."
value = ['^rsync\b.*\s(?:-[A-Za-z]*n[A-Za-z]*|--dry-run|--list-only)(?:\s|$)', '^patch\b.*\s(?:--dry-run|--check|-C)(?:\s|$)', '^unzip\b.*\s-[A-Za-z]*[ltvpZ]', '^tar\b.*(?:\s-[A-Za-z]*t|\s--list\b)', '^tar\b.*(?:\s-[A-Za-z]*O|\s--to-stdout\b)']

[workdetect.unknown_write_cwd_verbs]
doc = "Commands of workdetect.unknown_write_res that, with no destination named, write into the working directory (`unzip a.zip`, `tar -xf a.tar`): when that directory (after a `cd`) is the scratchpad or a temp directory (workdetect.excluded_path_res and friends) the command counts as no project file."
value = ["unzip", "tar"]

[tasklist_guard.counted_unknown]
doc = "How a write the count cannot name is listed in the 'Counted:' list of a block: {verb} is the command word (and a git subcommand). The raw command is never shown as a file."
value = "{verb} (unnamed)"

[tasklist_guard.counted_unknown_verb]
doc = "The {verb} shown in counted_unknown when the command word cannot be read."
value = "a command"

[workdetect.unknown_write_targets]
doc = "Where a command of workdetect.unknown_write_res names its destination, by command word: `last` is the last non-option word (when there is more than one), a word ending in `=` is a `key=value` argument (`of=`), any other word is an option whose next word is the destination (`-C`, `-d`). The destination is judged like any written path (a device file or a path outside the project counts nothing; one inside counts as that file); a command with no entry here, or none of whose destinations is found, counts as one unknown project file."
value = { rsync = ["last"], install = ["last"], dd = ["of="], tar = ["-C", "--directory"], unzip = ["-d"] }

[workdetect.unknown_write_targets_when]
doc = "Rules, by command word, that choose which workdetect.unknown_write_targets-style keys name the destination: the first rule whose `re` (case-sensitive, tested against the command from its command word on) matches gives its `keys`; with no match the command's entry in workdetect.unknown_write_targets is used. `tar` that creates or appends (`-c`, `-r`, `-u`, `--create`) writes the ARCHIVE named by `-f`/`--file` (a one-letter option also matches the end of a short-flag cluster: `-czf` is `-f`); the `-f` of an extraction is the archive it reads. A path of `-` (the terminal) names no file."
value = { tar = [ { re = '\s(?:-[A-Za-z]*[cru][A-Za-z]*|--(?:create|append|update))(?=\s|$)', keys = ["-f", "--file", "--file="] } ] }

[workdetect.remote_target_res]
doc = "Regex sources (case-sensitive) for a destination word that names another machine: `host:path`, `user@host:path` and a URL (`rsync://host/mod`). A command whose destination is one writes nothing on this machine, so it counts no file (`rsync -av dist/ host:/srv/app`)."
value = ['^(?:[^/\s@:]+@)?[^/\s@:]+:', '^[A-Za-z][A-Za-z0-9+.-]*://']

[workdetect.old_style_option_verbs]
doc = "Commands whose first word may be a bundle of option letters with no dash (`tar xzf a.tgz` is `tar -xzf a.tgz`): the command is read with the dash added before workdetect.unknown_write_res is tested."
value = ["tar"]

[workdetect.git_readonly_flag_res]
doc = "Regex sources (case-sensitive) by git subcommand: an argument that matches one makes a subcommand of workdetect.git_unknown_subcommands a dry run or a check that changes no file (`git apply --check`/`--stat`, `git clean -n`/`--dry-run`, `git am`/`git rebase --show-current-patch`), or, for a subcommand of workdetect.git_write_subcommands, one that names no working-tree file (`git restore --staged` changes the index only)."
value = { apply = ['^--(?:check|stat|numstat|summary)$'], clean = ['^-[A-Za-z]*n[A-Za-z]*$', '^--dry-run$'], am = ['^--show-current-patch(?:=.*)?$'], rebase = ['^--show-current-patch$'], restore = ['^--staged$', '^-S$'] }

[workdetect.indirect_end_words]
doc = "The words that end the command an indirect runner (`find -exec`, `xargs`) runs: a `;` (the `\\;` of `find -exec` reaches the count as a lone `\\`) or a `+`; `:::` ends the command of `parallel` (the words after it are its inputs)."
value = ["\\", ";", "+", ":::"]

[workdetect.indirect_skip_words]
doc = "The words of the command an indirect runner runs that are placeholders for the found file (`find -exec cp {} DEST \\;`), not a destination."
value = ["{}"]

[workdetect.indirect_exec_words]
doc = "For a runner that runs a command per found file, the words after which that command starts: `find -exec CMD ... \\;`. A write verb is looked for only at the start of such a command (`find . -name cp` and `find . -iname '*.js' -exec sed -n 1p {} \\;` write nothing). A runner not listed here (`xargs`, `parallel`) starts its command after its own options (workdetect.indirect_option_args)."
value = { find = ["-exec", "-execdir", "-ok", "-okdir"] }

[workdetect.indirect_option_args]
doc = "The options of `xargs`/`parallel` that take the NEXT word as their argument, so the command is not mistaken for it (`xargs -I {} cp {} dest`, `xargs -n 1 grep rm`). A glued form (`-I{}`, `--max-args=1`) is one word and needs no entry."
value = { xargs = ["-I", "-J", "-L", "-n", "-P", "-s", "-E", "-a", "-d", "--max-args", "--max-procs", "--max-lines", "--delimiter", "--arg-file", "--eof"], parallel = ["-j", "-n", "-N", "-a", "-S", "--jobs", "--max-args", "--arg-file", "--sshlogin"] }

[workdetect.indirect_write_flags]
doc = "Words of an indirect runner that make it delete or change files it does not name: `find -delete`. The command counts as one unknown project file."
value = { find = ["-delete"] }

[workdetect.indirect_verbs]
doc = "Commands that run another command over files they find or read (`xargs sed -i`, `find -exec rm`): when a word after them is a write verb (workdetect.bash_write_verbs; `sed` only with an in-place flag) and no file was named, the command counts as one unknown project file."
value = ["xargs", "find", "parallel"]

[workdetect.shell_verbs]
doc = "Shells whose `-c` argument is itself a command line: it is read for the files it writes (`bash -c 'echo > f'`), down to workdetect.shell_depth_max levels."
value = ["bash", "sh", "zsh", "dash"]

[workdetect.shell_depth_max]
doc = "How many nested `bash -c` levels are read for the files they write; a deeper command line counts as one unknown project file."
value = 2
min = 0

[workdetect.empty_redirect_verbs]
doc = "Command words whose redirect writes no content (`: > f`, `true > f`): an empty truncation is not a progress update."
value = [":", "true", "false"]

[workdetect.progress_dest_verbs]
doc = "Write verbs whose LAST argument is a destination that receives content (`cp x P`, `mv x P`): a write to the session's progress file by one of them is a progress update, like a redirect. Any other argument (`mv P /x` moves the file away) and the other verbs (`rm`, `touch`, `chmod`) are not."
value = ["cp", "mv"]

[workdetect.excluded_redirect_res]
doc = "Regex sources of redirect targets that are build or run logs, not project work (`make &> build.log`): a shell redirect to such a file does not count. Only a `>`/`>>`/`&>` target is judged; an Edit or Write of the file counts."
value = ['\.log$']

[workdetect.bash_wrappers]
doc = "Words that may stand before the command proper (`sudo rm f`, `env X=1 tee f`) and are skipped when the write verb is looked for."
value = ["sudo", "env", "command", "nohup", "time", "nice", "exec", "builtin"]

[workdetect.excluded_path_res]
doc = "Regex sources of absolute paths that are never project work for the tasklist work count, wherever the project is: the device files (a redirect to /dev/stderr writes no file). The scratchpad directory, anti-hall's progress/history/handover files (workdetect.scratchpad_path, workdetect.state_dir), the TMPDIR of the request and a path the one user request names are excluded on top of these."
value = ['^/dev/']

[workdetect.excluded_outside_res]
doc = "Regex sources of absolute paths that are not project work when they lie OUTSIDE the session's project: the system and per-user temporary directories (a session's scratchpad lives there). Only read while guards.tasklistProjectOnly is off and the project is known; with it on, every path outside the project is already left out. A path inside the project or the session's directory is never excluded by these, so a project that lives under a temp directory keeps counting."
value = ['^/(?:private/)?tmp(?:/|$)', '^/(?:private/)?var/(?:folders|tmp)(?:/|$)']

