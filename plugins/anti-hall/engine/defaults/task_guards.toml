# ah-engine shipped defaults for the task fact model and task Stop gates ported from Node (task-lifecycle-log,
# dispatch-tier, task-tracker, task-guard, tasklist-guard) and the helpers they share (checks::taskkit) (D17, D30, D74).
# Format: see the header of engine.toml. Regex sources use JavaScript syntax and are translated by checks::guardkit::jsre.

# ---- shared helpers (checks::taskkit) ---------------------------------------------------------------------

[taskkit.unknown_session]
doc = "The session id used in a file name when the payload carries none, or only characters a file name part may not hold (the Node `UNKNOWN_SESSION`)."
value = "unknown-session"

[taskkit.session_id_unsafe]
doc = "Characters that are removed from a session id before it becomes part of a ledger file name (JavaScript regex source of a negated class)."
value = '[^A-Za-z0-9_-]'

[taskkit.control_chars]
doc = "Characters a ledger line replaces with a space (C0 controls, DEL and C1 controls), as the body of a JavaScript regex class."
value = '[\x00-\x1F\x7F-\x9F]'

[taskkit.exact_digits]
doc = "Most significant digits a JSON number may have for its text to be taken as JavaScript prints it; a number with more digits is left to the Node hook (several shortest round-trip texts exist and the two languages may pick different ones)."
value = 15
min = 1
max = 15

[taskkit.tmp_env_names]
doc = "The environment variables `os.tmpdir()` reads for the temp directory, in order; without any the temp directory is /tmp."
value = ["TMPDIR", "TMP", "TEMP"]

[taskkit.ellipsis]
doc = "What is appended to a ledger field that was cut to its limit."
value = "…"

[taskkit.gitdir_line]
doc = "JavaScript regex source of the line that names the git directory in a `.git` file (the `m` flag applies)."
value = '^\s*gitdir:\s*(.+?)\s*$'

[taskkit.git_entry]
doc = "The name of the entry that marks a git checkout root."
value = ".git"

# ---- task-lifecycle-log ---------------------------------------------------------

[task_lifecycle_log.summary]
doc = "One-line description of the task-lifecycle-log check in the generated reference."
value = "Appends one line per TaskCreated/TaskCompleted event to the per-session history ledger and its index."

[task_lifecycle_log.setting]
doc = "Where the on/off switch is read from (maintenance.taskLifecycleLog, default on)."
value = { section = "maintenance", key = "taskLifecycleLog", env = "", aliases = [], option = "maintenance_task_lifecycle_log", default = true }

[task_lifecycle_log.events]
doc = "The hook events the ledger records."
value = ["TaskCreated", "TaskCompleted"]

[task_lifecycle_log.task_id_max]
doc = "Longest task id kept in a ledger line, in UTF-16 units."
value = 200
min = 1

[task_lifecycle_log.subject_max]
doc = "Longest task subject kept in a ledger line, in UTF-16 units."
value = 200
min = 1

[task_lifecycle_log.teammate_max]
doc = "Longest teammate name kept in a ledger line, in UTF-16 units."
value = 100
min = 1

[task_lifecycle_log.separator]
doc = "The separator between the fields of a ledger line (a middle dot with a space on each side)."
value = " · "

[task_lifecycle_log.name_max]
doc = "Longest file name (in bytes) the file system takes; a ledger name past it cannot be created, so the event is not recorded (Node: the append fails and the hook stops quietly)."
value = 255
min = 1

[task_lifecycle_log.history_dir]
doc = "The ledger directory under the project root, as path segments."
value = [".anti-hall", "history"]

[task_lifecycle_log.index_name]
doc = "The index file name inside the history directory."
value = "INDEX.md"

[task_lifecycle_log.ledger_ext]
doc = "The ledger file extension."
value = ".md"

# ---- dispatch-tier -------------------------------------------------------------------------

[dispatch_tier.summary]
doc = "One-line description of the dispatch-tier check in the generated reference."
value = "Asks Jev (dispatchTier, detached) how a new or changed task should be dispatched, once per task text, and keeps the request marker in dispatch-tier-state.json; does nothing while the integration is off."

[dispatch_tier.jev_id]
doc = "The Jev integration id the dispatch-tier hook asks."
value = "dispatchTier"

[dispatch_tier.tools]
doc = "The task tools whose text changes the hook classifies."
value = ["TaskCreate", "TaskUpdate"]

[dispatch_tier.owner_marker_setting]
doc = "Where the switch of the owner-blocked marker is read from (guards.taskGuardOwnerBlockedMarker, default on): a task marked as waiting on the owner is never classified."
value = { section = "guards", key = "taskGuardOwnerBlockedMarker", env = "ANTIHALL_TASK_GUARD_OWNER_BLOCKED_MARKER", aliases = [], option = "guards_task_guard_owner_blocked_marker", default = true }

[dispatch_tier.owner_values]
doc = "The blockedOn values (trimmed, lowercase) that mark a task as waiting on the owner."
value = ["owner", "user", "human", "external"]

[dispatch_tier.owner_subject_re]
doc = "JavaScript regex source (case-insensitive) of a subject that marks a task as waiting on the owner (OWNER: ... or OWNER DECISION ...)."
value = '^\s*owner(:|\s+decision\b)'

[dispatch_tier.text_cap]
doc = "Most UTF-16 units of a task's text (subject, newline, description) that Jev is asked about."
value = 600
min = 1

[dispatch_tier.request_ttl_ms]
doc = "How long a request marker stops the same task text from being asked again while the first ask may still be in flight; older markers are dropped when the state is written."
value = 600000
min = 1
unit = "ms"

[dispatch_tier.max_sessions]
doc = "Sessions the state file keeps recommendation tracking for; the longest untouched go first."
value = 50
min = 1

[dispatch_tier.state_file]
doc = "The state file (requested markers and per-session tracking), inside the anti-hall directory of the home."
value = "dispatch-tier-state.json"

[dispatch_tier.question_instructions]
doc = "The question put to Jev (a choice question over the three tiers)."
value = "Classify how an orchestrating agent should dispatch this task."

[dispatch_tier.tier_workspace]
doc = "The description of the workspace tier in the question."
value = "a large multi-step feature, migration or release spanning several files or components over a long stretch of work, that needs its own branch and its own review (a separate child workspace). NOT a bug fix, UI text or copy change, or any task confined to one file or one component"

[dispatch_tier.tier_workflow]
doc = "The description of the workflow tier in the question."
value = "breadth-first or parallelisable work: 3 or more clearly independent or nested agent spawns, or a review fan-out over many targets, best lifted into one deterministic workflow. NOT a single-file or single-component change, however important its priority label"

[dispatch_tier.tier_subagent]
doc = "The description of the subagent tier in the question."
value = "the DEFAULT when unsure: a lookup, a bug fix, a UI text or copy change, any change confined to one file or one component, a single command, or a single review pass that one background agent can finish. A priority label (P0, P1, P2) says nothing about size"

# ---- task fact model (checks::taskstate: lib/task-state.js, task-guard.js parseTasksFromFile, lib/task-subject-backfill.js) ----

[taskstate.js_parse_max_depth]
doc = "The deepest bracket nesting of a transcript line the engine reads the way JSON.parse does when serde_json's 128-level limit rejects it (JavaScript's own stack ends far past it). A deeper line cannot be read and leaves the scan unsure."
value = 2000
min = 128
max = 100000

[taskstate.tail_bytes]
doc = "How much of the end of a transcript the task reconstruction reads (the Node `MAX_TAIL_BYTES`, 1.5 MiB)."
value = 1572864
min = 1

[taskstate.re_created]
doc = "JavaScript regex source (case-insensitive) of the tool result that announces a new task and names its number."
value = '^Task\s+#(\d+)\s+created\s+successfully'

[taskstate.re_list_empty]
doc = "JavaScript regex source (case-insensitive) of the TaskList result that says the task store is empty."
value = '^\s*No\s+tasks\s+found\b'

[taskstate.re_not_found]
doc = "JavaScript regex source (case-insensitive) of the TaskGet or TaskUpdate result that says one task id does not exist."
value = '^\s*Task\s*(?:#\S+)?\s*not\s+found\b'

[taskstate.id_keys]
doc = "The input fields a task tool call may name its task id in, in order: the harness's `taskId`, then `id`, then `task_id`."
value = ["taskId", "id", "task_id"]

[taskstate.tools_collect_keys]
doc = "The object keys the tool-use collector descends into, in order (the Node `collectToolUses`)."
value = ["content", "message", "messages", "tool_uses", "parts"]

[taskstate.task_tools]
doc = "The tool names a task reconstruction reacts to (a call that creates, updates, lists or reads tasks, or rewrites the whole list). The kept task lines (transcript.tasks_cache_*) hold every line that names one; a name a reconstruction acts on that is missing here would make its kept answer differ from a fresh read."
value = ["TodoWrite", "TaskCreate", "TaskUpdate", "TaskList", "TaskGet"]

[taskstate.open_statuses]
doc = "Statuses (lowercase) that make a task open."
value = ["pending", "in_progress", "in-progress"]

[taskstate.done_statuses]
doc = "Statuses (lowercase) that count as completed for the completed-task advisory."
value = ["completed", "done", "cancelled", "canceled"]

[taskstate.since_status_re]
doc = "JavaScript regex source (case-insensitive) of the TaskUpdate statuses that restart a task's clock (`sinceMs`, read by the idle-neglect proof)."
value = '^(pending|in[-_]?progress)$'

[taskstate.terminal_status_re]
doc = "JavaScript regex source (case-insensitive) of the statuses that close a task for the backfill (`TERMINAL`)."
value = '^(completed|done|cancelled|canceled|deleted)$'

[taskstate.backfill_max_subject]
doc = "Longest subject the backfill recovers, in UTF-16 units."
value = 200
min = 1

[taskstate.backfill_max_candidates]
doc = "How many unpaired task-creation results the backfill remembers while scanning backward."
value = 256
min = 1

[taskstate.backfill_chunk_bytes]
doc = "How much of the transcript the backfill reads at a time."
value = 1048576
min = 4096

[taskstate.backfill_exact_bytes]
doc = "How far back the backfill scans before the engine hands the call to Node: Node's own byte cap (64 MiB). Node also stops after 150 ms of wall clock; the engine scans a fixed number of bytes instead so its answer never depends on machine speed. Where Node's clock would have stopped it short on a slow machine, the engine finds the subjects Node missed (a fuller note, never a missing one); past this bound it defers rather than guess where Node would have stopped."
value = 67108864
min = 4096

[taskstate.backfill_prefix_scan_bytes]
doc = "How far past the window start the backfill looks for the end of the line that straddles it."
value = 8388608
min = 4096

[taskstate.unknown_max_notes]
doc = "How many times the unknown-state note may be printed for one session and tag."
value = 3
min = 1

[taskstate.unknown_note_text]
doc = "The unknown-state note; `{n}` is the number of tasks."
value = "{n} task(s) in an unknown state (their records are too far back to read) — re-state each with TaskUpdate (status) to refresh."

[taskstate.unknown_file_prefix]
doc = "Prefix of the per-session file that remembers which unknown set was last announced."
value = "last-unknown"

[taskstate.prune_ttl_days]
doc = "Per-session state files older than this many days are removed by the opportunistic sweep."
value = 7
min = 1

[taskstate.prune_throttle_hours]
doc = "The sweep of one file prefix runs at most once per this many hours."
value = 6
min = 1

[taskstate.prune_stamp_prefix]
doc = "Prefix of the stamp file that throttles one prefix's sweep."
value = ".prune-stamp-"

# ---- task-guard --------------------------------------------------------------------------------

[task_guard.summary]
doc = "One-line description of the task-guard check in the generated reference."
value = "Stop gate: blocks a Stop while tasks are open (the idle-neglect block when dispatchable work has no running agent, else the generic block), with the loop state, the per-prompt budget and the OMC and live-agent steps aside of the Node hook; hands a Stop whose answer needs the DevSwarm app database to Node."

[task_guard.guard_name]
doc = "The guard id of task-guard (the skip key and the message prefix)."
value = "task-guard"

[task_guard.setting]
doc = "Where the on/off switch is read from (guards.taskGuard, default on)."
value = { section = "guards", key = "taskGuard", env = "", aliases = [], option = "guards_task_guard", default = true }

[task_guard.prune_setting]
doc = "How many completed or cancelled tasks the list may hold before the Stop advisory suggests pruning them (guards.pruneCompletedTasksAfter)."
value = { section = "guards", key = "pruneCompletedTasksAfter", env = "ANTIHALL_PRUNE_COMPLETED_TASKS_AFTER", aliases = [], min = 1, default = 10 }

[task_guard.state_prefix]
doc = "Prefix of the per-session file that holds the last blocked task set (`last-stop-taskset-<session>`)."
value = "last-stop-taskset-"

[task_guard.session_hash_len]
doc = "How many hex characters of the transcript path hash name a session that has no id."
value = 16
min = 1

[task_guard.prune_advisory]
doc = "The advisory printed when the list holds many completed tasks; `{n}` is how many and `{limit}` the limit."
value = "[task-guard] {n} completed/cancelled tasks in the list (> {limit}) — advisory: after recording them in the history ledger, prune them with TaskUpdate status=deleted so the harness reminder stops re-printing them every turn.\n"

[task_guard.note_line]
doc = "The line that carries the unknown-state note; `{note}` is the note."
value = "[task-guard] {note}\n"

[task_guard.unknown_tag]
doc = "The tag of the unknown-state note's state file for task-guard."
value = "guard"

[task_guard.judge_child_env]
doc = "The environment variable that marks a judge child process; every task hook is a no-op there."
value = "ANTIHALL_JUDGE_CHILD"

# -- task-guard: the open-task decision (sharp idle-neglect block, generic block, loop state)

[task_guard.max_blocks]
doc = "Most Stop blocks task-guard makes per cap_scope window (both kinds counted); a new real owner turn resets the default owner_turn window. Same-set dedupe remains independent."
value = 5
min = 1

[task_guard.cap_scope]
doc = "Block-cap scope: owner_turn (default) resets max_blocks on a new real user turn; session keeps a session-wide cap. Tool results, hook text, notifications and cross-session messages never reset it. Missing legacy window metadata starts a fresh owner-turn window, with an original-state backup."
value = "owner_turn"

[task_guard.hash_sep]
doc = "The separator between the task ids hashed into the loop state (a NUL character)."
value = "\u0000"

[task_guard.idle_hash_tags]
doc = "The words that start the hashed text of an idle-neglect block, so its loop state never equals a generic block's."
value = ["idle", "no-agents"]

[task_guard.state_hash_key]
doc = "The loop state file's field for the hash of the last blocked set."
value = "hash"

[task_guard.state_blocks_key]
doc = "The loop state file's field for the number of blocks made in the current cap_scope window."
value = "blocks"

[task_guard.pending_status]
doc = "The status (lowercase) of a task that can be dispatched now."
value = "pending"

[task_guard.owner_name_key]
doc = "The field of the Agent call that launched a running agent which names it (its `name`). A task whose owner is that name is attended, like one owned by the agent's id or description."
value = "name"

[task_guard.owner_match_min]
doc = "The shortest task owner text that counts as naming a running agent by a part of its description (an owner of fewer characters matches only the agent's id or its whole description). A task owned by a running agent is attended and is not listed by the generic block."
value = 4
unit = "chars"
min = 1
max = 40

[task_guard.coordinator_owner_re]
doc = "JavaScript regex source (case-insensitive) of an owner that is the orchestrator itself; such a task still counts as unowned."
value = '^(main|orchestrator|coordinator)$'

[task_guard.workspace_prefix_re]
doc = "JavaScript regex source (case-insensitive) of the prefix removed from an owner before it is looked up as a DevSwarm workspace."
value = '^(workspace|ws|devswarm)\s*[:#]\s*'

[task_guard.priority_rank_re]
doc = "JavaScript regex source of a priority label with a rank (`p0`, `p1`, ...), matched on the trimmed lowercase label."
value = '^p([0-9]+)$'

[task_guard.priority_default_rank]
doc = "The rank of a task with no priority or an unrecognised one (fail-open: it counts as P1)."
value = 1
min = 0

[task_guard.priority_low]
doc = "Priority words (lowercase) that rank below the default."
value = ["low", "deferred"]

[task_guard.priority_low_rank]
doc = "The rank of a low or deferred task."
value = 2
min = 0

[task_guard.min_priority_setting]
doc = "The priority floor of the idle-neglect block (guards.idleNeglectMinPriority): a pending task below it is backlog and never nags."
value = { section = "guards", key = "idleNeglectMinPriority", type = "enum", values = ["p0", "p1", "p2", "p3"], env = "ANTIHALL_IDLE_NEGLECT_MIN_PRIORITY", aliases = [], default = "p1" }

[task_guard.dispatch_demand_setting]
doc = "Whether running agents are counted per task from this session's transcript (guards.dispatchDemand, default on); off restores the legacy rule (any fresh agent heartbeat silences the idle-neglect block)."
value = { section = "guards", key = "dispatchDemand", env = "ANTIHALL_DISPATCH_DEMAND", aliases = [], default = true }

[task_guard.proven_only_setting]
doc = "Block on idle neglect only when a dispatchable task is uncovered under every placement of the agents that name no task (guards.idleNeglectProvenOnly, default on)."
value = { section = "guards", key = "idleNeglectProvenOnly", env = "ANTIHALL_IDLE_NEGLECT_PROVEN_ONLY", aliases = [], default = true }

[task_guard.agent_max_age_setting]
doc = "Minutes after which a running agent that names no task stops counting as cover in the proven count (guards.idleNeglectAgentMaxAgeMin; 0 = never)."
value = { section = "guards", key = "idleNeglectAgentMaxAgeMin", env = "ANTIHALL_IDLE_NEGLECT_AGENT_MAX_AGE_MIN", aliases = [], min = 0, default = 30 }

[task_guard.agent_max_age_default_min]
doc = "The agent age limit used when the setting does not resolve to a number, in minutes."
value = 30
min = 0

[task_guard.ms_per_minute]
doc = "Milliseconds in a minute (the unit conversion of the agent age limit)."
value = 60000
min = 1

[task_guard.max_parallel_setting]
doc = "A fixed cap on running background agents (guards.maxParallelDispatch); 0 uses the CPU-based cap."
value = { section = "guards", key = "maxParallelDispatch", env = "ANTIHALL_MAX_PARALLEL_DISPATCH", aliases = [], min = 0, default = 0 }

[task_guard.cap_ceiling]
doc = "The highest CPU-based parallel cap."
value = 16
min = 1

[task_guard.cap_reserve]
doc = "CPUs kept free when the parallel cap is derived from the CPU count."
value = 2
min = 0

[task_guard.cap_floor]
doc = "The lowest CPU-based parallel cap."
value = 1
min = 1

[task_guard.cap_fallback_cores]
doc = "The CPU count assumed when none is reported."
value = 4
min = 1

[task_guard.task_ref_re]
doc = "JavaScript regex source of a task number named in an agent's description (`#12`); such an agent covers that task."
value = '#(\d+)\b'

[task_guard.in_progress_re]
doc = "JavaScript regex source (case-insensitive) of an in-progress status (tested unanchored, as Node does)."
value = 'in[-_]?progress'

[task_guard.agents_dir]
doc = "The directory of agent heartbeat files inside the anti-hall directory (the legacy liveness signal)."
value = "agents"

[task_guard.agents_ext]
doc = "The file ending of an agent heartbeat file."
value = ".json"

[task_guard.agents_ts_key]
doc = "The heartbeat file's time field (milliseconds); without it the file time is used."
value = "ts"

[task_guard.agents_fresh_ms]
doc = "How long an agent heartbeat counts as a running agent."
value = 1200000
min = 1
unit = "ms"

[task_guard.label_max]
doc = "Longest task subject in the idle-neglect block's list, in UTF-16 units."
value = 40
min = 1

[task_guard.label_priority_prefix_re]
doc = "JavaScript regex source (case-insensitive) of a priority prefix (`P1: `, `P0 - `) removed from a subject in the idle-neglect list."
value = '^\s*P\d\s*[:\-—]\s*'

[task_guard.label_sep]
doc = "The separator between the tasks of the idle-neglect list."
value = ", "

[task_guard.dispatch_list_max]
doc = "Most tasks the idle-neglect block names."
value = 12
min = 1

[task_guard.list_max]
doc = "Most tasks the generic block names."
value = 5
min = 1

[task_guard.list_sep]
doc = "The separator between the tasks of the generic block's list."
value = "; "

[task_guard.subject_max]
doc = "Longest task subject in the generic block's list, in UTF-16 units."
value = 60
min = 1

[task_guard.status_max]
doc = "Longest task status in the generic block's list, in UTF-16 units."
value = 24
min = 1

[task_guard.subject_unknown]
doc = "What the generic block shows for a task whose subject was never seen."
value = "(subject unknown)"

[task_guard.status_open]
doc = "What the generic block shows for a task without a status."
value = "open"

[task_guard.more]
doc = "The tail of a block's list when tasks were left out; `{n}` is how many."
value = " (and {n} more)"

[task_guard.cap_formula]
doc = "The parallel cap as the idle-neglect block names it when no number was computed (the legacy rule)."
value = "~min(16, cores-2)"

[task_guard.update_claude]
doc = "How the block messages name the task update tool on Claude Code."
value = "TaskUpdate"

[task_guard.update_codex]
doc = "How the block messages name the task update on Codex, which has no task tools."
value = "update your task list"

[task_guard.codex_patch_tool]
doc = "The Codex tool name that marks a Codex payload on its own."
value = "apply_patch"

[task_guard.idle_what]
doc = "The first line of the idle-neglect block; `{n}` is how many tasks, `{list}` the listed ones, `{more}` the tail."
value = "{n} open tasks have no agent working on them."

[task_guard.idle_why]
doc = "The why line of the idle-neglect block."
value = "Work that could run in parallel is sitting idle."

[task_guard.devswarm_hint]
doc = "The DevSwarm sentence added to the idle-neglect block's do-instead line while the app database shows a live workspace; `{upd}` is the task update tool."
value = " If a DevSwarm workspace has it, set the owner ({upd} owner) to that workspace's title."

[task_guard.idle_instead]
doc = "The do-instead line of the idle-neglect block; `{cap}` is the parallel cap, `{upd}` the task update tool, `{devswarm}` the DevSwarm sentence (or nothing)."
value = "assign the pending tasks to agents."

[task_guard.idle_allowed]
doc = "The allowed-here line of the idle-neglect block."
value = "a task waiting on the user (hardware, a decision): mark it blocked on 'owner', or start its subject with \"OWNER:\"."

[task_guard.generic_what]
doc = "The first line of the generic block; `{list}` is the listed tasks, `{more}` the tail."
value = "open tasks remain unfinished."

[task_guard.generic_why]
doc = "The why line of the generic block."
value = "Open tasks should not be left behind when the session stops."

[task_guard.generic_instead]
doc = "The do-instead line of the generic block; `{upd}` is the task update tool."
value = "finish the pending tasks before stopping."

[task_guard.generic_allowed]
doc = "The allowed-here line of the generic block; `{upd}` is the task update tool."
value = "a task that is truly blocked: mark it with {upd} (blockedBy an open task, or blockedOn 'owner'); it is then no longer listed."

[task_guard.block_json]
doc = "The stdout line of a block; `{reason}` is the reason as a JSON string."
value = "{\"decision\":\"block\",\"reason\":{reason}}\n"

[task_guard.omc_line]
doc = "The advisory printed instead of a block while an OMC autonomous loop is active."
value = "[task-guard] OMC autonomous loop active — deferring Stop block to avoid deadlock.\n"

[task_guard.agents_line]
doc = "The advisory printed instead of the generic block while agents are live."
value = "[task-guard] open tasks remain but live agents are active — deferring Stop block.\n"

[task_guard.metrics_file]
doc = "The dispatch-demand metrics file inside the anti-hall directory (the idle-neglect block counts itself there)."
value = "dispatch-demand-metrics.json"

[task_guard.metrics_counters]
doc = "The counters of the metrics file, each reset to 0 when it is not a finite number of at least 0, in this order."
value = ["demandsShown", "demandsFollowed", "demandsIgnored", "idleNeglectBlocks"]

[task_guard.metrics_idle_key]
doc = "The counter an idle-neglect block increments."
value = "idleNeglectBlocks"

[task_guard.metrics_pending_key]
doc = "The metrics file's per-session pending-demand object (kept as is, made an empty object when it is not one)."
value = "pending"

# -- task-guard: the DevSwarm app database; its presence defers the answers that need it

[task_guard.app_db_env]
doc = "The environment variable that names the DevSwarm app database (or `off`)."
value = "ANTIHALL_DEVSWARM_APP_DB"

[task_guard.app_db_off]
doc = "The override value (lowercase) that turns the DevSwarm app database off."
value = "off"

[task_guard.app_db_darwin_dir]
doc = "The application data directory under the home directory on macOS, as path segments."
value = ["Library", "Application Support"]

[task_guard.app_db_xdg_env]
doc = "The environment variable that moves the configuration directory on Linux."
value = "XDG_CONFIG_HOME"

[task_guard.app_db_linux_config]
doc = "The configuration directory under the home directory on Linux."
value = ".config"

[task_guard.app_db_file]
doc = "The DevSwarm app database under the application data directory, as path segments."
value = ["DevSwarm", "devswarm.db"]

# -- task-guard: OMC loop detection

[task_guard.omc_disable_env]
doc = "The environment variable that turns OMC off."
value = "DISABLE_OMC"

[task_guard.omc_disable_value]
doc = "The value of the OMC kill switch that turns it off."
value = "1"

