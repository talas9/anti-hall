[tasklist_guard.omc_max_bytes]
doc = "Largest loop state file read; a bigger one counts as malformed."
value = 65536
min = 1

[tasklist_guard.omc_settings_max_bytes]
doc = "Largest Claude settings file read when checking that oh-my-claudecode is enabled."
value = 262144
min = 1

[tasklist_guard.omc_settings_files]
doc = "The Claude settings files that can enable oh-my-claudecode: the home one, then the project's two."
value = [".claude/settings.json", ".claude/settings.local.json"]

[tasklist_guard.omc_plugin]
doc = "The enabledPlugins key of oh-my-claudecode."
value = "oh-my-claudecode@omc"

[tasklist_guard.omc_kill_env]
doc = "Environment variable that disables oh-my-claudecode (value 1)."
value = "DISABLE_OMC"

[tasklist_guard.omc_skip_env]
doc = "Environment variable listing skipped oh-my-claudecode hooks (comma separated)."
value = "OMC_SKIP_HOOKS"

[tasklist_guard.omc_skip_token]
doc = "The skipped hook that turns the loop detection off."
value = "persistent-mode"

[tasklist_guard.omc_ts_keys]
doc = "Timestamp fields of a loop state, in order."
value = ["last_checked_at", "updated_at", "started_at"]

[tasklist_guard.codex_tool]
doc = "A tool name only Codex payloads carry (isCodexPayload)."
value = "apply_patch"

[tasklist_guard.codex_fields]
doc = "Payload fields that, all non-empty strings, mark a Codex payload (isCodexPayload)."
value = ["turn_id", "model"]


[taskkit.codex_rollout]
doc = "JavaScript regex source of a Codex rollout transcript path."
value = '(^|[\\/])rollout-[^\\/]*\.jsonl$'

[taskkit.codex_dir]
doc = "JavaScript regex source of a path with a `.codex` directory in it."
value = '[\\/]\.codex[\\/]'

[tasklist_guard.low_priorities]
doc = "Priorities (lowercase) below the actionable floor for the stalled-in-progress count."
value = ["p2", "low", "deferred"]

[tasklist_guard.instead_progress]
doc = "Compact guard message text."
value = "update the progress file, then stop again."

[tasklist_guard.resume_instead]
doc = "Compact guard message text."
value = "verify the handover and record the result."
