# ---- tasklist-hygiene ------------------------------------------------------------------------

[tasklist_hygiene.summary]
doc = "One-line description of the tasklist-hygiene check in the generated reference."
value = "Claude only (Codex has no task tools). After a task is marked completed, orders the agent in one line (Do now: ...) to log the outcome in the named history ledger path and then delete the task (own task entries are not user data; the progress percentage comes from the progress file, not from kept tasks); a completed task that stays in the list past guards.doneOrderAfterMin is ordered deleted again at UserPromptSubmit (task-tracker) on the done_order.steps_min schedule, and at Stop (task-guard) only with handover.taskListEnforce = block, each counted as completed_lingering, order_emitted and followed (guards.doneOrder switches it); when a task subject is over handover.taskSubjectMax or the open tasks are over handover.taskListBudget, one advisory line with the numbers (handover.taskListEnforce = block refuses the call instead). Switches handover.taskDoneNote and handover.taskListEnforce."

[tasklist_hygiene.skip_subagent]
doc = "true: a subagent's task call (its payload carries a coordinator_work.agent_markers field) marked done gets no delete order and no done tip: a subagent's list is the spawner's, and its order to delete a task it may not edit was ignored by design (ignored-rules audit 2026-11-20). Only those two are skipped: the taskListEnforce = block refusal, the budget line and the deleted count still apply."
value = true

[tasklist_hygiene.guard_name]
doc = "The guard id this check answers to in skip.json and in messages."
value = "tasklist-hygiene"

[tasklist_hygiene.create_tool]
doc = "The tool that creates a task."
value = "TaskCreate"

[tasklist_hygiene.update_tool]
doc = "The tool that changes a task (status, subject)."
value = "TaskUpdate"

[tasklist_hygiene.done_trigger]
doc = "The TaskUpdate status values that count as a task being finished and trigger the delete-it line."
value = ["completed"]

[tasklist_hygiene.msg_done]
doc = "What the done line says; {id} is the task id."
value = "task {id} done: write its Cause/Fix/Verified ledger entry yourself."

[tasklist_hygiene.instead_done]
doc = "What to do, in the done line."
value = "TaskUpdate status=deleted (own task entries are not user data)."

[tasklist_hygiene.detail_done]
doc = "Extra line of the done note, saved only in the details file (never shown inline): why deleting is allowed and where the progress percentage comes from."
value = "Write the ledger entry yourself (Write or Edit tool, no heredoc). Ledger: .anti-hall/history/<date>/<session>.md. Deleting this session's own finished task entries is not deleting user data (nothing else is exempt from the never-delete rule). Compute progress % (done/total) from the progress file or ledger counts, not by keeping completed tasks in the list; the list holds open tasks only."

[tasklist_hygiene.event_nudge]
doc = "Counter event: a completed-task note was shown (one per TaskUpdate to a done status)."
value = "nudge"

[tasklist_hygiene.event_subagent_skipped]
doc = "Counter event: the check stayed silent on a task call of a subagent (tasklist_hygiene.skip_subagent), so its order to delete a task it may not edit was not sent."
value = "subagent_skipped"

[tasklist_hygiene.event_deleted]
doc = "Counter event: a task was deleted through TaskUpdate (the action the completed-task note asks for; an acted_on proxy, not tied to a nudge)."
value = "deleted"

[tasklist_hygiene.event_prune]
doc = "Counter event: the prune suggestion (more finished tasks than the prune default) reached the model."
value = "prune_suggested"

[tasklist_hygiene.delete_trigger]
doc = "The TaskUpdate statuses that count as deleting a task."
value = ["deleted"]

[metric.tasklist_hygiene]
doc = "Task-list hygiene events (completed-task note shown, task deleted, prune suggestion shown, and the done_order events completed_lingering, order_emitted and followed), by event; recorded through the advisory counters (`ah.advisory(advisory_kind, event)`), so the engine report's `advisory` section shows tasklist_hygiene.<event>."
value = { kind = "counter", unit = "events", labels = ["event"], advisory_kind = "tasklist_hygiene" }

[tasklist_hygiene.order_joiner]
doc = "Separator between the completion order and the budget tip in one PostToolUse line."
value = "\n"

[tasklist_hygiene.msg_subject]
doc = "The subject breach; {n} is the subject length and {max} handover.taskSubjectMax."
value = "task subject is {n} chars (max {max})."

[tasklist_hygiene.msg_open]
doc = "The open-count breach; {n} is the open-task count and {max} handover.taskListBudget."
value = "{n} open tasks (budget {max})."

[tasklist_hygiene.join]
doc = "Separator between the parts of one line."
value = " "

[tasklist_hygiene.instead_budget]
doc = "What to do, in the advisory line."
value = "keep subjects as `T-<n> [P] title`, details in the history ledger; delete finished tasks."

[tasklist_hygiene.instead_block]
