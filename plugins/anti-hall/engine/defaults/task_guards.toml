# ---- R-idle (plan v2 section 4, GH #461 #516 #517 #262 #177): the idle-task rule behind guards.idleRule (off by default) ----
# With the switch off nothing below is read and the Stop answers are the ones task-guard always gave. With it on, the Stop block skips a task
# that has a live owner agent, that an agent's description or launch name names (#<id>), that waits on the owner, that carries a blockedOn
# reason, that says it is parked/blocked/waiting and gives the reason, or that waits on a clock; plan mode is quiet; and the block names the
# exact task ids and the one step that clears them. Acted-on / ignored come from the delivery funnel (delivery.act, row task-guard).

[task_guard.idle_rule_setting]
doc = "Switch guards.idleRule (default off, plan v2 D14). On: the task-guard Stop blocks leave out tasks that are not idle (live owner agent, an agent that names the task, owner decision, blockedOn reason, parked/blocked/waiting marker with its reason, a wait on a clock), stay quiet in plan mode, and name the exact task ids and the step that clears them. Off: the Stop answers are unchanged."
value = { section = "guards", key = "idleRule", type = "boolean", env = "ANTIHALL_IDLE_RULE", option = "", default = false }

[idle_rule.text_max]
doc = "Most UTF-16 units of a task's subject plus description that the parked and clock markers are looked for in."
value = 600
min = 1

[idle_rule.blocked_on_min]
doc = "Fewest characters a task's blockedOn text needs to count as a stated reason (a bare or one-letter value does not)."
value = 3
min = 1

[idle_rule.parked_re]
doc = "JavaScript regex source (case-insensitive) of a parked/blocked/waiting marker that GIVES ITS REASON: the marker word, then a colon, dash, parenthesis or on/for/until/till/by/behind, then at least two characters of reason. A bare BLOCKED with no reason does not match, so it still counts as idle; a negated marker (not/no/never blocked) does not match either."
value = '(?:^|[\s\[(])(?<!\b(?:not|no|never)\s+)(?:parked|blocked|waiting|on hold|deferred)\b\s*(?::|-|–|—|\(|\bon\b|\bfor\b|\buntil\b|\btill\b|\bby\b|\bbehind\b)\s*[^\s.,;:)]{2,}'

[idle_rule.clock_re]
doc = "JavaScript regex source (case-insensitive) of a wait on a clock: a waiting word (wait, until, till, after, retry, recheck, resume) that opens the text or a clause (after punctuation or the word then), so a noun inside a task title such as implement retry after 2 minutes is not a wait, followed within 40 characters of a time of day, a duration, tomorrow, tonight, next week/month/day or an ISO date."
value = '(?:^|[\n.;:,(\[–—]\s*|\bthen\s+)(?:waiting|wait|until|till|after|retry|retrying|re-?check|resumes?|resuming)\b[^.\n]{0,40}?(?:\b\d{1,2}:\d{2}\b|\b\d+(?:\.\d+)?\s*(?:s|sec|secs|seconds?|m|min|mins|minutes?|h|hr|hrs|hours?|d|days?|weeks?)\b|\btomorrow\b|\btonight\b|\bnext (?:week|month|day)\b|\b\d{4}-\d{2}-\d{2}\b)'

[idle_rule.reason_owner]
doc = "Suppression reason label: the task waits on the owner."
value = "owner"

[idle_rule.reason_blocked_on]
doc = "Suppression reason label: the task has a blockedOn reason."
value = "blocked_on"

[idle_rule.reason_parked]
doc = "Suppression reason label: the task says parked/blocked/waiting and gives the reason."
value = "parked"

[idle_rule.reason_clock]
doc = "Suppression reason label: the task waits on a clock."
value = "clock"

[idle_rule.reason_live_agent]
doc = "Suppression reason label: the task's owner is a live agent or workspace."
value = "live_agent"

[idle_rule.reason_agent_ref]
doc = "Suppression reason label: a running agent's description or launch name names the task (#<id>)."
value = "agent_ref"

[idle_rule.reason_bg_job]
doc = "Suppression reason label: an in-progress task while a background shell or Monitor of this session is running (the task waits on that job)."
value = "bg_job"

[idle_rule.reason_plan_mode]
doc = "Suppression reason label: the session is in plan mode (counted once per open task)."
value = "plan_mode"

[idle_rule.kind_idle]
doc = "Counter label: the sharp idle-neglect block (dispatchable tasks no agent covers)."
value = "idle"

[idle_rule.kind_open]
doc = "Counter label: the generic open-tasks block."
value = "open"

[idle_rule.minutes_cap]
doc = "Most minutes one block adds to idle_slot_minutes (the age of the oldest listed task is capped here)."
value = 240
unit = "min"
min = 1

[idle_rule.ids_max]
doc = "Most task ids the visible block line names; the rest are counted ({more}) and listed in the saved details."
value = 6
min = 1

[idle_rule.id_sep]
doc = "Separator between the task ids of the visible block line."
value = ", "

[idle_rule.more]
doc = "Tail of the id list when more tasks than idle_rule.ids_max are idle; `{n}` is how many were left out."
value = " (+{n} more)"

[idle_rule.prompt_ref_max]
doc = "Most UTF-16 units of a running agent's spawn prompt (from its start) that are read for a task number (#<id>) or a task subject; an agent launched for a task names it in its brief even when its description only names the work."
value = 600
min = 1

[idle_rule.prompt_ref_skip_re]
doc = "JavaScript regex source (case-insensitive) of GitHub-style references in a spawn prompt that are NOT task numbers: a PR, pull request, issue, commit or bug number (a list of them: 'PRs #829, #827 and #826'), or owner/repo#N. They are blanked before the prompt is read for #<id>, so a brief that reviews PR #12 does not attend task #12."
value = '''\b(?:prs?|pull\s+requests?|pulls?|issues?|gh|commits?|bugs?)\s*:?\s*#\d+(?:\s*(?:,|and|&|/)?\s*#\d+)*|[\w.-]+/[\w.-]+#\d+'''

[idle_rule.subject_ref_min]
doc = "Fewest characters a task subject (after its priority prefix) needs to count as named when an agent's description, launch name or prompt start quotes it whole; shorter subjects match too much by chance."
value = 12
min = 1

[idle_rule.subject_ref_max]
doc = "Most characters of a task subject compared against the running agents' description, launch name and prompt start."
value = 80
min = 1

[idle_rule.what_idle]
doc = "First line of the R-idle idle block; `{n}` tasks, `{ids}` the ids (#<id>), `{more}` the tail. Kept short: the visible line is cut near 115 units."
value = "{n} open tasks idle, no live agent, no blocked reason: {ids}{more}."

[idle_rule.what_open]
doc = "First line of the R-idle generic block; same placeholders as what_idle."
value = "{n} open tasks unfinished, none has a live agent or a blocked reason: {ids}{more}."

[idle_rule.instead]
doc = "The step that clears the block, in the instead line (kept under 115 units so it stays visible); `{upd}` the task update tool, `{first}` the first listed id."
value = "spawn an agent with #{first} in its description, or {upd} it blockedOn=<reason>, or finish it."

[idle_rule.details_list]
doc = "Saved-details block listing every idle task; `{list}` has one line per task: id, subject, status."
value = "Idle tasks:\n{list}"

[idle_rule.details_steps]
doc = "Saved-details text with the three ways to clear a listed task; `{upd}` the task update tool, `{first}` the first listed id."
value = "To clear a task, do one of: (1) start an agent whose description contains its id, for example description \"#{first} <what it does>\"; (2) {upd} taskId={first} with metadata blockedOn=<the reason>, or write a line \"BLOCKED: <reason>\" in its subject or description (a bare BLOCKED with no reason does not clear it); a wait on a clock: write \"waiting until <time>\"; (3) finish it and mark it completed."

[metric.idle_rule_fired]
doc = "R-idle Stop blocks delivered (guards.idleRule on), by kind (idle: the dispatch-demand block; open: the generic block)."
value = { kind = "counter", unit = "blocks", labels = ["kind"] }

[metric.idle_rule_listed]
doc = "Tasks named by delivered R-idle blocks, by kind."
value = { kind = "counter", unit = "tasks", labels = ["kind"] }

[metric.idle_rule_hold_lapsed]
doc = "Task holds whose exemption lapsed after nudges.hold.hold_max_ms (the normal rule applies again), by exemption kind (owner, blocked_on, parked, clock). Counted once per Stop and task."
value = { kind = "counter", unit = "tasks", labels = ["reason"] }

[metric.idle_rule_suppressed]
doc = "Open tasks the R-idle filter kept out of a block's list, by reason (owner, blocked_on, parked, clock, live_agent, agent_ref; plan_mode counts the open tasks of a plan-mode Stop). Counted once per delivered block, plus once per plan-mode Stop."
value = { kind = "counter", unit = "tasks", labels = ["reason"] }

[metric.idle_slot_minutes]
doc = "PROXY for plan v2's idle-slot minutes: at each delivered R-idle block, the age in minutes of the oldest listed task since it was created or last set pending/in progress, capped at idle_rule.minutes_cap. Not a time integral (that would need persistent state); blocks of one idle spell add up, so read it as a relative size, not as minutes."
value = { kind = "counter", unit = "min", labels = ["kind"] }

[metric.idle_rule_age_unknown]
doc = "Delivered R-idle blocks whose listed tasks had no known start time (a task list read from the store carries none), so idle_slot_minutes got nothing from them."
value = { kind = "counter", unit = "blocks", labels = ["kind"] }

[metric.taskstate_rows_skipped]
doc = "Transcript rows the task model skipped because their type is in taskstate.skipped_row_types (replayed API-request rows, not the conversation). Counted once per rebuild pass in the hook dispatcher or the daemon."
value = { kind = "counter", unit = "rows", labels = [] }

[metric.snapshot_written]
doc = "Task snapshot files written (taskstate.snapshot_enabled): the session's rebuilt list saved so a later rebuild can recover tasks that left the transcript tail."
value = { kind = "counter", unit = "files", labels = [] }

[metric.snapshot_overlaid]
doc = "Tasks a rebuild recovered from the session's snapshot because the transcript tail no longer showed them."
value = { kind = "counter", unit = "tasks", labels = [] }

[metric.snapshot_gap]
doc = "Rebuilds whose transcript tail started after the snapshot's size, by result (caught_up: the bytes between were read, so a completion in them is seen; too_big: the gap is over taskstate.snapshot_gap_max_bytes; unread: the wider read could not be made exactly). too_big and unread discard the snapshot (snapshot_discarded reason gap): the Stop answers from the tail alone."
value = { kind = "counter", unit = "rebuilds", labels = ["result"] }

[metric.snapshot_discarded]
doc = "Snapshots not laid over a rebuild, by reason (shrunk: the transcript is smaller than when the snapshot was written; reset: the tail restarted or emptied the list; renumbered: the tail holds a TaskCreate for a number the snapshot holds whose tool-use id is not the one the snapshot recorded for it, so a new list began (subjects play no part); format: another snapshot version; session: the snapshot names another transcript path or session id; replaced: the transcript bytes at the fingerprinted places differ, so another file lies under the path; gap: the bytes between the snapshot's size and the tail's start could not be read, so the snapshot may be stale). A discarded snapshot is replaced by the new list, never deleted."
value = { kind = "counter", unit = "snapshots", labels = ["reason"] }

[metric.snapshot_identity_unknown]
doc = "Rebuilds whose tail holds a TaskCreate for a number the snapshot holds, over bytes the snapshot already covers, where the create's tool-use id or the snapshot's recorded one is missing (a task no create was recorded for, as a TodoWrite makes). Which list it belongs to cannot be told: the snapshot is kept (fail-open to the snapshot)."
value = { kind = "counter", unit = "rebuilds", labels = [] }

[metric.snapshot_lock]
doc = "Task snapshot lock takes, by kind (flock: the kernel lock; file: the lock file of the Node protocol, by taskstate.snapshot_lock_kind; fallback: this platform or filesystem has no flock at all, the lock file was used) and result (taken; busy: held elsewhere past taskstate.snapshot_lock_wait_ms, nothing written; failed: the flock could not be acquired (the file would not open or is a link, or flock failed with an errno other than unsupported), nothing written). On the file and fallback kinds busy also covers a lock file that cannot be made (a directory or link in its place, an unwritable directory) and failed a lock call that raised: nothing is written either way. A write happens only under a lock that is positively held."
value = { kind = "counter", unit = "takes", labels = ["kind", "result"] }

[metric.snapshot_error]
doc = "Task snapshot reads or writes that failed and left the rebuild as the tail alone gives it, by kind (read, parse, shape: a section with a malformed task, write, big: over taskstate.snapshot_max_bytes (on a read, the file is replaced), lock: the snapshot lock was busy, cap: taskstate.snapshot_max_files reached, home: no usable home)."
value = { kind = "counter", unit = "errors", labels = ["kind"] }

[task_guard.prune_advisory]
doc = "The advisory printed when the list holds many completed tasks; `{n}` is how many and `{limit}` the limit."
value = "[task-guard] {n} completed/cancelled tasks in the list (> {limit}) — advisory: after recording them in the history ledger, prune them with TaskUpdate status=deleted so the harness reminder stops re-printing them every turn.\n"
