# The engine hardening bar (v1.0 "solid engine"): every threshold, rate, count and report text of the hardening harness
# (`ah-engine/tests/hardening_bar.rs`, driven by `ah-engine/scripts/soak.sh`). Tuning the bar is editing this file, never
# the test source.
#
# This file is read by the harness only. It is deliberately NOT listed in `index.toml`: the engine never loads it, so none of
# these keys is an engine setting. Each entry has the same shape as the engine's own defaults (`doc`, `value`, optional
# `unit`). Engine settings the bar holds the daemon to (the client deadline, the RSS cap, the defer exit) are read from the
# engine's own defaults by name, never copied here.

# ---- report ----------------------------------------------------------------------------------------------------------

[report.title]
doc = "Heading of the bar report soak.sh writes."
value = "ah-engine hardening bar"

[report.pass]
doc = "Word for a check that met its limit."
value = "PASS"

[report.fail]
doc = "Word for a check that missed its limit."
value = "FAIL"

[report.columns]
doc = "Column headings of each bar's table: check, measured, limit, result."
value = ["check", "measured", "limit", "result"]

[report.bar_crash_loop]
doc = "Title of the crash-loop bar."
value = "Crash loop"

[report.bar_breaker]
doc = "Title of the breaker bar."
value = "Breaker"

[report.bar_panic]
doc = "Title of the panic-injection bar."
value = "Panic injection"

[report.bar_corrupt_socket]
doc = "Title of the corrupt-socket bar."
value = "Corrupt socket"

[report.bar_kill_mid_call]
doc = "Title of the daemon-killed-mid-call bar."
value = "Daemon killed mid-call"

[report.bar_load]
doc = "Title of the load bar."
value = "Load (sustained and burst)"

[report.bar_memory]
doc = "Title of the memory-soak bar."
value = "Memory soak"

# ---- shared -----------------------------------------------------------------------------------------------------------

[common.call_slack_ms]
doc = "Allowance over the client deadline before one hook call counts as blocking the tool: covers process start and the fallback stand-in on a loaded machine, and stays far below anything a host would notice as a hang."
value = 3000
unit = "ms"

[common.ready_ms]
doc = "How long the harness waits for a daemon to come up, a marker to appear or a cooldown to pass before the bar fails."
value = 20000
unit = "ms"

[common.poll_ms]
doc = "Poll interval of the harness's waits."
value = 25
unit = "ms"

[common.gone_log_lines]
doc = "Most lines of the daemon's own log a failing bar copies into the report when the daemon is reported gone (after the filter)."
value = 40

[common.gone_log_filter]
doc = "Words (case-insensitive) that mark a daemon log line as explaining an exit: only those lines are copied into the report."
value = ["exit", "drain", "orphan", "watchdog", "rss", "panic", "restart", "start_fail", "budget_hard", "cpu_hard"]

[common.progress_every_calls]
doc = "A long bar (load, memory soak) prints one progress line (elapsed, calls, daemon alive, RSS, restarts, control-socket status) every this many calls."
value = 1000

[common.progress_every_s]
doc = "...and at least this often by wall clock, so a slow or hung bar still shows a line in the CI log."
value = 60
unit = "s"

[common.progress_poll_ms]
doc = "How often the progress watcher thread wakes to check whether a line or a stall report is due."
value = 1000
unit = "ms"

[common.stall_report_s]
doc = "No completed call for this long writes the gone-daemon report at once (to the log and next to the bar's fragment) instead of at the end of the bar."
value = 300
unit = "s"

[common.progress_status_chars]
doc = "Longest control-socket status text a progress line carries (longer text is cut)."
value = 120

# ---- crash loop -------------------------------------------------------------------------------------------------------

[crash.n]
doc = "Daemon deaths the bar inflicts, and the crash-loop threshold it sets (`AH_ENGINE_CRASH_N`) for the run."
value = 3

[crash.window_s]
doc = "Crash-loop counting window for the run (`AH_ENGINE_CRASH_WINDOW_S`); the deaths must land inside it."
value = 10
unit = "s"

[crash.cooldown_s]
doc = "Crash-loop cooldown for the run (`AH_ENGINE_CRASH_COOLDOWN_S`); longer than the window, so the deaths have aged out when it ends and the engine recovers."
value = 12
unit = "s"

[crash.tripped_calls]
doc = "Hook calls made while the crash loop holds: each must answer through the fallback, quickly, and none may respawn the daemon."
value = 5

[crash.recover_extra_ms]
doc = "Time after the cooldown ends within which a hook call must be answered by a freshly started engine again."
value = 15000
unit = "ms"

# ---- breaker ----------------------------------------------------------------------------------------------------------

[breaker.n]
doc = "Engine failures that open the breaker for the run (`AH_ENGINE_BREAKER_N`)."
value = 3

[breaker.window_s]
doc = "Breaker counting window for the run (`AH_ENGINE_BREAKER_WINDOW_S`); long enough to hold every failure of the bar, including the half-open probe."
value = 120
unit = "s"

[breaker.cooldown_s]
doc = "Breaker cooldown for the run (`AH_ENGINE_BREAKER_COOLDOWN_S`)."
value = 2
unit = "s"

[breaker.down_marker_ttl_ms]
doc = "Down-marker TTL for the run (`AH_ENGINE_DOWN_MARKER_TTL_MS`): a failed exchange marks the daemon down and suppresses attempts for this long, so only calls spaced beyond it each reach the daemon and count toward the breaker. Kept near zero so the bar drives real failures back to back."
value = 1
unit = "ms"

[breaker.deadline_ms]
doc = "Client deadline for the run (`AH_ENGINE_DEADLINE_MS`) given to every call of the bar."
value = 150
unit = "ms"

[breaker.open_calls]
doc = "Hook calls made while the breaker is open: each must skip the engine (the garbage-frame stand-in sees no new connection) and pass through."
value = 5

# ---- panic injection --------------------------------------------------------------------------------------------------

[panic.rounds]
doc = "Panics injected into one daemon (test-only `CTL panic`); every one must be contained and the same daemon keep serving."
value = 5

# ---- corrupt socket ---------------------------------------------------------------------------------------------------

[corrupt.calls]
doc = "Hook calls against each corrupt-socket case (a garbage-frame server, a non-socket file at the socket path)."
value = 4

[corrupt.down_marker_ttl_ms]
doc = "Down-marker TTL for the garbage-frame case (`AH_ENGINE_DOWN_MARKER_TTL_MS`): kept near zero so every call reaches the stand-in and counts as its own failure instead of being skipped by the marker."
value = 1
unit = "ms"

[corrupt.garbage]
doc = "The bytes the garbage-frame stand-in answers with: not a valid frame."
value = "OK 9999999 not-a-frame \u0000\u0001\u0002 garbage"

# ---- daemon killed mid-call -------------------------------------------------------------------------------------------

[kill.clients]
doc = "Concurrent hook clients running while the daemon is SIGKILLed."
value = 6

[kill.calls_per_client]
doc = "Hook calls each client makes."
value = 12

[kill.kill_after_answers]
doc = "Engine answers seen before the daemon is killed, so calls are in flight when it dies."
value = 8

# ---- load -------------------------------------------------------------------------------------------------------------

[load.sessions]
doc = "Distinct session ids the load spreads over (one session alone would hit `daemon.session_rps`)."
value = 40

[load.transcript_kb]
doc = "Size of the transcript the load's Stop calls read."
value = 2048
unit = "KB"

[load.warmup_calls]
doc = "Sequential calls before measuring (cold caches, first script compile)."
value = 200

[load.sustained_rps]
doc = "Documented sustained rate: calls per second, paced, across all clients. Below `daemon.project_rps` so the per-project limiter never sheds a documented rate."
value = 40
unit = "calls/s"

[load.sustained_s]
doc = "Duration of the sustained phase."
value = 30
unit = "s"

[load.sustained_clients]
doc = "Concurrent clients of the sustained phase (each paced at sustained_rps / sustained_clients)."
value = 4

[load.settle_ms]
doc = "Pause between the sustained and burst phases, so the per-project bucket refills (`daemon.project_burst` at `daemon.project_rps`)."
value = 5000
unit = "ms"

[load.burst_clients]
doc = "Documented burst: clients released at once. At most `daemon.workers` + `daemon.queue`, beyond which load shedding (BUSY) is the documented answer."
value = 16

[load.burst_calls_per_client]
doc = "Back-to-back calls each burst client makes."
value = 20

[load.p99_ms_max]
doc = "p99 of the client's wall time per call (connect, write, daemon queue, processing, read) that the bar allows; well inside the hook budget (`client.deadline_ms`), which the harness also asserts."
value = 250
unit = "ms"

[load.fallbacks_max]
doc = "Whole-event fallbacks allowed at the documented rates (BUSY, ERR, timeout, failed exchange): the bar is zero."
value = 0

[load.late_max]
doc = "Replies the daemon delivered after the client's deadline (`slow_replies`, #22) allowed at the documented rates."
value = 0

# ---- memory soak ------------------------------------------------------------------------------------------------------

[memory.calls]
doc = "Calls in the memory soak."
value = 50000

[memory.warmup_calls]
doc = "Calls before the reference sample; growth is measured from here."
value = 5000

[memory.sample_every]
doc = "Calls between RSS samples."
value = 2500

[memory.sessions]
doc = "Distinct session ids the soak cycles through."
value = 40

[memory.transcript_kb]
doc = "Size of the transcript the Stop calls read (larger than the widest tail window any check reads)."
value = 20480
unit = "KB"

[memory.band_kb_jemalloc]
doc = "Largest RSS rise over the reference sample allowed on jemalloc targets (macOS arm64, Linux gnu)."
value = 16384
unit = "KB"

[memory.band_kb_system]
doc = "Largest RSS rise over the reference sample allowed on system-allocator targets (macOS x86_64, musl): that allocator keeps freed pages, so it gets a wider band."
value = 32768
unit = "KB"

[memory.slope_kb_per_1k_jemalloc]
doc = "Largest least-squares RSS growth per 1,000 calls after the reference sample on jemalloc targets (a leak shows as a steady slope, #21)."
value = 128
unit = "KB"

[memory.slope_kb_per_1k_system]
doc = "Largest least-squares RSS growth per 1,000 calls after the reference sample on system-allocator targets."
value = 256
unit = "KB"

# ---- honest diagnostics: what "gone" means, and why a call was not answered by the daemon ------------------------------------

[diag.label_gone]
doc = "Report words for a daemon whose process is dead (not running, or an unreaped zombie). Only this state may be called gone."
value = "daemon gone"

[diag.label_unreachable]
doc = "Report words for a control-socket status read that failed while the daemon process is still alive."
value = "control socket unreachable (pid alive)"

[diag.zombie_states]
doc = "First letters of a `ps -o stat=` value that mean the process is dead although its pid still exists (a zombie not yet reaped by its parent)."
value = ["Z"]

[diag.ps_path]
doc = "The `ps` binary the harness asks for a process state."
value = "/bin/ps"

[diag.reason_engine]
doc = "Breakdown label: calls the daemon answered."
value = "daemon"

[diag.reason_busy]
doc = "Breakdown label: calls the daemon shed with BUSY (queue overflow or a rate limit; the daemon's own busy_by_reason splits them)."
value = "busy"

[diag.reason_err]
doc = "Breakdown label: calls the daemon answered ERR."
value = "err"

[diag.reason_slow]
doc = "Breakdown label: calls with no reply inside the wait window (slow timeout)."
value = "slow-timeout"

[diag.reason_hung]
doc = "Breakdown label: calls the client gave up on because the daemon heartbeat was stale."
value = "hung"

[diag.reason_transport]
doc = "Breakdown label: calls that failed in transport (no listener, refused, unsafe socket, bad or truncated frame, I/O error such as a reset)."
value = "transport"

[diag.breakdown_prefix]
doc = "Report note prefix of the per-reason answer breakdown. Placeholder: {bar}."
value = "{bar} answers by reason"

[diag.transport_sample_max]
doc = "Most distinct transport-failure texts a breakdown quotes (the first ones seen)."
value = 3

[diag.daemon_busy_prefix]
doc = "Report note prefix of the daemon's own split of its BUSY replies (status busy_by_reason)."
value = "daemon busy_by_reason"
