[metric.inject_suppressed_bytes]
doc = "Bytes the gate kept out of the context (the dropped blocks, and what a keepalive form saved over the whole block), by cut."
value = { kind = "counter", unit = "bytes", labels = ["cut"] }

[metric.inject_gate_sessions]
doc = "Sessions the injection gate holds state for (bounded by inject_gate.max_sessions)."
