[metric.tel_events]
doc = "Telemetry invocations recorded, by kind (k), hook or check (h), hook event (e) and outcome (o) (D78)."
value = { kind = "counter", unit = "invocations", labels = ["k", "h", "e", "o"] }

[metric.tel_injected_bytes]
doc = "Bytes injected into model context, by hook or check (h) and hook event (e). The whole-hook rows (h=hook) add up to the total; a per-check row is attribution inside it (D78)."
value = { kind = "counter", unit = "bytes", labels = ["h", "e"] }

[metric.tel_dropped]
doc = "Telemetry samples or events that could not be kept: slots (a counter table was full) or ring (an event was overwritten before it was flushed)."
