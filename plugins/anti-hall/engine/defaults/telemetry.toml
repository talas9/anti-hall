value = { kind = "gauge", unit = "bytes", labels = [] }

[metric.db_archive_bytes]
doc = "Size of archive.db (0 until it is first used)."
value = { kind = "gauge", unit = "bytes", labels = [] }

[metric.db_archive_wal_bytes]
doc = "Size of archive.db's write-ahead log."
value = { kind = "gauge", unit = "bytes", labels = [] }

[metric.maintain_runs]
doc = "Maintenance runs recorded in hot.db (D26)."
