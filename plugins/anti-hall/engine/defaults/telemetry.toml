value = { kind = "gauge", unit = "KB", labels = [] }

[metric.queue_depth]
doc = "Connections waiting for a worker when status or metrics is read."
value = { kind = "gauge", unit = "connections", labels = [] }

[metric.uptime_s]
doc = "Seconds since the daemon started."
value = { kind = "gauge", unit = "s", labels = [] }

[metric.tier_items]
doc = "Active key-value items held in memory (D22)."
value = { kind = "gauge", unit = "items", labels = [] }

[metric.tier_bytes]
doc = "Bytes charged to the in-memory layer's budget (D25)."
value = { kind = "gauge", unit = "bytes", labels = [] }

[metric.tier_hits]
doc = "Key-value reads answered from memory since the daemon started."
value = { kind = "gauge", unit = "reads", labels = [] }

[metric.tier_misses]
doc = "Key-value reads that went to SQLite since the daemon started."
value = { kind = "gauge", unit = "reads", labels = [] }

[metric.inject_emitted]
doc = "Gated hook blocks passed on whole, by cut (injection gate)."
value = { kind = "counter", unit = "blocks", labels = ["cut"] }

[metric.inject_emitted_bytes]
doc = "Bytes of the gated hook blocks that were injected (whole blocks, and the short keepalive forms), by cut."
