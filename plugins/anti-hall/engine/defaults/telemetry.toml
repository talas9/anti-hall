# ah-engine shipped metric and impact-event registries (D51, D52). Format: see the header of engine.toml.
#
# A metric or impact kind that code records must be registered here, so `ah-engine docs` lists it and a test
# catches a typo; a registered name nothing records is flagged by the same test. Metrics are kept in memory, bounded,
# and snapshotted to hot.db with rollups in archive.db (D51); impact events are stored in hot.db (D52).

[telemetry.latency_buckets_us]
doc = "Upper bounds of the latency histogram buckets; a quantile is reported as the upper bound of the bucket holding that rank, so it is an upper estimate."
value = [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 100000, 1000000]
unit = "us"

[telemetry.byte_buckets_bytes]
doc = "Upper bounds of the byte histogram buckets (the per-call memory histograms `check_mem_peak_bytes` and `check_mem_alloc_bytes`); a quantile is reported as the upper bound of the bucket holding that rank, so it is an upper estimate."
value = [4096, 16384, 65536, 262144, 1048576, 4194304, 16777216, 67108864]
unit = "bytes"

[telemetry.byte_unit]
doc = "The metric unit that makes a histogram use the byte buckets (`telemetry.byte_buckets_bytes`) instead of the latency buckets."
value = "bytes"

[telemetry.top_checks]
doc = "How many checks `status --json` lists in `cpu.top_checks`, the ones that spent the most CPU (with calls and CPU per call)."
value = 5
min = 1

[telemetry.max_series]
doc = "Most distinct label combinations kept per metric; further combinations keep the labels named in overflow_keep_labels (up to max_series_kept) and collapse the rest into one overflow value."
value = 128

[telemetry.max_series_by_metric]
doc = "Per metric, a larger label-combination cap than telemetry.max_series. delivery_funnel and delivery_channel carry check x model x project x stage (or channel), which would collapse into the overflow label at 128 series and erase the split the funnel exists for; both stay bounded by delivery.project_slots and the model families, and by this cap; past it model and project fold into the overflow label and the check and stage stay (telemetry.overflow_keep_by_metric)."
value = { delivery_funnel = 768, delivery_channel = 512 }

[telemetry.overflow_keep_labels]
doc = "Label names that keep their own value once a metric has more than max_series label combinations: the other labels of the series collapse into the overflow label, so the cost per check stays readable (the pre-fix cap folded every label into `other` and hid 1.8 GB of transcript reads). The series that keep a value are bounded by max_series_kept."
value = ["check"]

[telemetry.overflow_keep_by_metric]
doc = "Per metric, the label names that keep their own value once the metric passes its series cap, instead of telemetry.overflow_keep_labels: the other labels fold into the overflow label. Series kept this way are never cut by max_series_kept (they are bounded by the number of checks times the stage or channel words), so no count of these metrics is ever lost. delivery_funnel keeps check and stage, delivery_channel keeps check and channel, so a total per check and stage stays exact and only model and project fold."
value = { delivery_funnel = ["check", "stage"], delivery_channel = ["check", "channel"] }

[telemetry.max_series_kept]
doc = "Most series per metric that keep an overflow_keep_labels value past max_series; beyond it every label collapses into the overflow label."
value = 1024
min = 1

[telemetry.recent_default]
doc = "How many of the most recent impact events `impact` shows unless asked for more."
value = 20

[telemetry.max_events]
doc = "Most impact events kept in memory (oldest dropped first); counts per kind are kept exactly in separate counters."
value = 5000
env = "AH_ENGINE_MAX_EVENTS"

[telemetry.not_persisted_note]
doc = "Printed with metrics, and with impact output when storage could not open, while they live in memory only."
value = "kept in memory by the running daemon and reset when it exits"

[telemetry.metrics_persisted_note]
doc = "Printed with metrics output when counters and histograms are snapshotted to hot.db."
value = "counters and histograms are snapshotted to hot.db every telemetry.snapshot_ms and at exit, and rolled up into archive.db; gauges are live readings"

[telemetry.snapshot_ms]
doc = "Interval of the scheduled metrics snapshot job, which keeps the counters in hot.db and their rollups in archive.db (D51); the daemon also keeps one when it exits."
value = 60000
env = "AH_ENGINE_SNAPSHOT_MS"
unit = "ms"
min = 50

[telemetry.rollups]
doc = "Metric rollup resolutions in archive.db: each bucket keeps the last snapshot taken in it, and buckets older than keep_s are pruned by `ah-engine maintain` (derived data, D59)."
value = [
  { name = "minute", bucket_s = 60, keep_s = 86400 },
  { name = "hour", bucket_s = 3600, keep_s = 2592000 },
]

[telemetry.impact_persisted_note]
doc = "Printed with impact output when the events are stored in hot.db."
value = "stored in hot.db: totals and events survive a restart"

[telemetry.overflow_label]
doc = "Label value used for series beyond max_series."
value = "other"

[telemetry.project_key_len]
doc = "Hex digits of the hashed project key shown in impact events (the project path itself is never stored)."
value = 12

# ---- telemetry (D78, D77) -------------------------------------------------------------------------------
# The engine's own telemetry: every hook, check and rule the daemon runs is counted (invocations, outcome, latency
# bucket, bytes injected) in memory with no I/O, flushed to hot.db on an interval, and rolled up daily into archive.db.
# Local only, never uploaded, never holds text content.

[telemetry.enabled]
doc = "Record telemetry (D78). Local only: nothing is uploaded. Off stops recording; what was already stored stays."
value = true

[telemetry.flush_ms]
doc = "How often the recorder's counters and events are stored in hot.db, and at shutdown. A kill -9 loses at most this much (the data recorded since the last flush)."
value = 10000
env = "AH_ENGINE_TELEMETRY_FLUSH_MS"
min = 50
unit = "ms"

[telemetry.block_keep_days]
doc = "How many days a guard block stays queryable (`ah-engine query guard_blocks`): who was blocked by which guard, when, and the first line of the message."
value = 14
min = 1
unit = "days"

[telemetry.block_reason_chars]
doc = "How many characters of a guard block's message (its first non-empty line) are kept with the block."
value = 200
min = 20
unit = "chars"

[telemetry.retention_days]
doc = "How many days of per-day counter rows and events stay in hot.db; older ones are removed by `telemetry rollup` after they are archived in archive.db, where the daily rollups are kept."
value = 30
min = 1
unit = "days"

[telemetry.shards]
doc = "Counter tables the hot path spreads threads over, so threads rarely share a cache line."
value = 4
min = 1

[telemetry.slots]
doc = "Label combinations (kind, hook or check, event, outcome) one shard holds; rounded up to a power of two. A full table counts the sample as dropped instead of waiting."
value = 256
min = 16

[telemetry.ring_size]
doc = "Rich events (routing decisions, spawn results, Jev calls, spills) held in memory between flushes; older ones are overwritten and counted as dropped."
value = 2048
min = 16

[telemetry.token_max_len]
doc = "Longest identifier a telemetry event may hold in any text field (hook, event, model, task class, spawn key); longer ones are cut. Event text fields hold identifiers only, never prose."
value = 64
min = 8
unit = "bytes"

[telemetry.default_window_days]
doc = "Window the `telemetry` and `impact` reports cover unless --window is given."
value = 7
min = 1
unit = "days"

[telemetry.bytes_per_token]
doc = "Bytes of injected context counted as one token when `impact` estimates what injection costs."
value = 4
min = 1
unit = "bytes"

[telemetry.link_window_s]
doc = "How long before a spawn result a routing decision with the same spawn key still belongs to it (D77)."
value = 7200
min = 1
unit = "s"

[telemetry.max_event_rows]
doc = "Most events kept in hot.db; the oldest beyond this are removed when `telemetry rollup` runs."
value = 200000
min = 100

[telemetry.inherit_prefix]
doc = "Prefix used when a route event records an inherited model. The model-routing hook can use a parent_model field from the hook payload; otherwise it records inherit:unknown because no current settings source exposes the parent model."
value = "inherit:"

[telemetry.hook_label]
doc = "The `h` label of the whole-hook telemetry row (one per hook request, whatever checks ran inside it)."
value = "hook"

[telemetry.rule_label]
doc = "The `h` label of the telemetry row counting regex rule matches."
value = "rule"

[telemetry.no_event_label]
doc = "The `e` label used when the hook event is unknown."
value = "-"

[telemetry.no_answer_reason]
doc = "The reason stored with a no-answer impact row when the check was dropped outside the dispatcher (which names its own: shed, client_gone, hard_deadline, check_deferred, cpu_budget)."
value = "no_answer"

[telemetry.spawn_result]
doc = "The spawn-result event the engine records itself when an agent launch finishes (PostToolUse of the agent tool), linked to the route event by the same spawn key: the key is rebuilt from the same payload fields the routing check hashes (session, calling agent, subagent type, prompt prefix of model_routing.key_prefix_chars characters; joined with sep). event / tool: which call; session, agent, input, prompt, subagent_type: payload fields; response, usage, model: fields of the tool response (model = the model the agent ran on); in, out, cache_read, cache_write: usage fields; check: the h label of the recorded event; key_prefix: the key's text prefix."
value = { event = "PostToolUse", tool = "Agent", session = "session_id", agent = "agent_id", input = "tool_input", prompt = "prompt", subagent_type = "subagent_type", response = "tool_response", usage = "usage", model = "resolvedModel", in = "input_tokens", out = "output_tokens", cache_read = "cache_read_input_tokens", cache_write = "cache_creation_input_tokens", check = "model-routing", key_prefix = "spawn-", sep = "\u001f" }

[telemetry.injection_kinds]
doc = "The telemetry row kinds whose injected bytes count as context the engine put in front of the model: check (what each check's advisory or context reply injected) and spill (a reply spilled to a file). The old whole-hook kind is left out: nothing records it any more."
value = ["check", "spill"]

[telemetry.net_name_injection]
doc = "Name of the injected-context spender in the NET figure's not-measured list."
value = "injected context"

[telemetry.net_name_jev]
doc = "Name of the Jev spender in the NET figure's not-measured list."
value = "Jev cost"

[telemetry.net_name_routing]
doc = "Name of the routing saving in the NET figure's not-measured list (no routing decision is linked to a spawn result yet)."
value = "model routing"

[telemetry.jev_skip_backend]
doc = "The backend label of a Jev call that got no usable answer (the rule baseline stood): counted as skipped, not as a model call."
value = "baseline-only"

[telemetry.jev_skip_reason_default]
doc = "The reason token counted for a Jev call that got no answer and recorded none (no call was made)."
value = "not-asked"

[telemetry.net_method]
doc = "How the NET figure of `impact` is computed, shown next to it."
value = "estimate: routing saved minus routing spent up, minus the estimated cost of injected context (injected bytes / bytes_per_token, priced as input tokens of the most common parent model) minus recorded Jev cost; models missing from the price table are counted as unpriced, not guessed"

# ---- coverage telemetry: Node hooks, Jev, commands, daemon health, model calls ------------------------------------------
# Everything that decides, calls a model or writes state records one event (kind, id, outcome, duration, small typed
# extras). A process that is not the daemon (the hook dispatcher, a one-shot command, `jev ask`) appends its events to the
# inbox file in the state directory; the daemon reads and empties that file on every flush, so nothing needs a socket
# round trip on the hook path. Events hold identifiers and numbers only: never prompt text, paths or secrets.

[telemetry.fields]
doc = "The extra fields of the event kinds whose schema is data. Each entry is `name:type`, with type `num` (a whole number) or `tok` (an identifier: letters, digits and `._:/[]@+-`, at most token_max_len bytes). A reader refuses any field a kind does not list, so prose cannot be stored. node: one Node hook the dispatcher ran (h = hook id, e = hook event, o = allow|block|advise|error|timeout, ms = wall time, ib = stdout bytes; exit = exit code when it exited, fate = ran|timeout|spawn|died|incomplete, err_bytes = stderr bytes). cmd: one run of a state-writing engine command (h = command, e = its first argument or `-`, o = allow|error, ms = duration; items = what it changed, exit = exit code). daemon: a health snapshot (h and e are daemon_label and daemon_event_label, o = allow, or advise when degraded; fields are readings). model: one model call, recorded by `telemetry::emit::model(&ModelCall { backend, model, purpose, outcome, micros, tokens_in, tokens_out })` once per finished call, from any process (the daemon records at once; any other process appends to the telemetry inbox for the daemon to read); backend and model are identifiers (the model ALIAS, never a pinned version or prompt text), outcome is Allow, Error or Timeout, the token counts are None when the backend did not report them (h = backend, e = model alias, o = allow|error|timeout, ms = latency; tokens_in/tokens_out when known, purpose = what the call was for; counted by backend, alias and outcome with a latency histogram and shown in `telemetry summary` under detail.model). agent: the agent tracker (h = series|signal|reminder|outcome, e = the signal, channel or outcome kind, o = advise for a raised signal or a delivered reminder, skip for one held back by its cooldown or cap, allow otherwise; agent = the agent id, akind = main|subagent|workspace|heartbeat, tin/tout/tcr/tcw = cumulative input, output, cache-read and cache-write tokens, tools = tool calls, progress = progress units, flagged = 1 while a signal is up, state, channel = session|mesh|owner|coordinator, result = sent|suppressed|recovered|false_positive|open, evidence = the number the signal tripped on, idle_s = seconds without output, lat_s = seconds from a reminder to the agent recovering, fp = 1 for a flagged agent that proved productive, recovered = 1 when it recovered, source = transcript|claude_cli|heartbeat|devswarm; shown in `telemetry summary` under detail.agent). act: one action of an acting feature, the ONE schema every feature lane emits with `telemetry::emit::act` (h = feature, e = action, o = allow when it ran|block when refused or stale|skip when not applicable|error|timeout, ms = latency_ms; target = what it acted on, inputs = a short digest of its inputs, reason = why it was refused or failed, action_id = the idempotency key). mistake: a later signal that an earlier action should not have been taken, emitted with `telemetry::emit::mistake` (h = feature, e = action, o = advise; action_id = the act event it refers to, reason = what showed it was wrong, target); `ah-engine devswarm ledger` joins the two for the per-feature mistake rate. jev: the detail of a Jev call beside integration, mode, verdict and cost_uc (conf_pm = confidence in thousandths, backend = jev|cache|baseline-only, breaker = open|closed, error = the failure reason, absent when there was none)."
value = { node = ["exit:num", "fate:tok", "err_bytes:num"], cmd = ["items:num", "exit:num"], daemon = ["rss_kb:num", "rss_cap_kb:num", "cpu_permille:num", "budget_breach:num", "heap_live_kb:num", "restarts:num", "degraded:num", "queue_depth:num", "queue_cap:num", "workers:num", "busy:num", "saturated:num", "peak_in_flight:num", "max_wait_us:num"], model = ["tokens_in:num", "tokens_out:num", "purpose:tok"], jev = ["conf_pm:num", "backend:tok", "breaker:tok", "error:tok"], agent = ["agent:tok", "akind:tok", "tin:num", "tout:num", "tcr:num", "tcw:num", "tools:num", "progress:num", "flagged:num", "state:tok", "channel:tok", "result:tok", "evidence:num", "idle_s:num", "lat_s:num", "fp:num", "recovered:num", "source:tok", "nudge:tok", "parent:tok", "trigger:tok", "answer:tok", "answer_source:tok", "outcome:tok", "path:tok", "health:tok", "tier:tok", "action:tok", "agree:num", "reminders:num", "ignored:num", "snoozes:num", "snooze_min:num", "escalated:num", "walked:num", "delivered:num", "tokens:num", "idle_min:num", "tokens_after:num", "ans_s:num", "act_s:num"], act = ["target:tok", "inputs:tok", "reason:tok", "action_id:tok"], mistake = ["target:tok", "inputs:tok", "reason:tok", "action_id:tok"] }

[telemetry.cmd_record]
doc = "The engine commands whose runs are recorded as `cmd` events (they write state). Each entry is a command word, or `command:arg|arg` to record only runs that carry one of those arguments (`doctor:--repair|--fix` records a repair, not a read-only check; `config:heal` records the heal, not the show)."
value = ["mesh", "migrate", "jev-setup", "doctor:--repair|--fix", "config:heal"]

[telemetry.inbox_max_bytes]
doc = "Largest the telemetry inbox may grow while no daemon reads it; events appended beyond that are not kept (the daemon empties the file on every flush)."
value = 4194304
unit = "bytes"
min = 1024

[telemetry.health_snapshot_ms]
doc = "How often the daemon records a `daemon` health snapshot event (resident set, its cap, restarts, degraded flag, queue and worker load, saturation). Events are kept for retention_days and capped by max_event_rows."
value = 60000
env = "AH_ENGINE_HEALTH_SNAPSHOT_MS"
unit = "ms"
min = 50

[telemetry.summary_event_limit]
doc = "Most events of one kind `telemetry summary` reads to build its jev, cmd, model and daemon sections."
value = 5000
min = 10

[telemetry.daemon_label]
doc = "The `h` label of the daemon health snapshot events."
value = "daemon"

[telemetry.daemon_event_label]
doc = "The `e` label of the daemon health snapshot events."
value = "snapshot"

# ---- metrics --------------------------------------------------------------------------------------------

[metric.requests]
doc = "Requests the daemon handled, any type."
value = { kind = "counter", unit = "requests", labels = [] }

[metric.busy_replies]
doc = "Requests answered BUSY (queue full or rate limited), which made the client fall back."
value = { kind = "counter", unit = "requests", labels = [] }

[metric.errors]
doc = "Requests answered ERR."
value = { kind = "counter", unit = "requests", labels = [] }

[metric.budget_trips]
doc = "Evaluations cut off by the per-request CPU budget."
value = { kind = "counter", unit = "evaluations", labels = [] }

[metric.answers_dropped]
doc = "Check answers a request did not get, by the event, whether it was a guard event's (kind guard) or an optional one's (kind optional) and the reason (shed, client_gone, hard_deadline, cpu_budget, check_deferred). The check's failure policy decided in their place. Lifetime; status answers_dropped.this_daemon has the count since the daemon started."
value = { kind = "counter", unit = "answers", labels = ["event", "kind", "reason"] }

[metric.delivery_stage]
doc = "Per check, how many of its answers reached each stage (#312): decided (it said something), delivered (the reply carrying it was written in time), complied (the agent made a reaction tool call within the window, `delivery.react`), ignored (the window ended without one). Lifetime; `status` delivery shows it with the lost and shed counts."
value = { kind = "counter", unit = "answers", labels = ["check", "stage"] }

[metric.delivery_lost]
doc = "Per check and reason, answers that did not reach the agent: shed (CPU hard limit), hard_deadline, cpu_budget, client_gone, check_deferred (the reasons of answers_dropped) and undelivered (the reply was not written in time). Lifetime."
value = { kind = "counter", unit = "answers", labels = ["check", "reason"] }

[metric.delivery_funnel]
doc = "The delivery funnel split by the session's model family and the project (B1; `telemetry funnel`): per check, model, project and stage (decided, delivered, acted_on, ignored, lost, shed, suppressed), how many answers reached it. A shadowed entry's answer is decided and suppressed, never delivered. Past the series cap only model and project fold into the overflow label (telemetry.overflow_keep_by_metric): no count is lost. acted_on and ignored follow the check's delivery.act (else delivery.react) condition. Lifetime. Off with delivery.funnel_enabled = 0."
value = { kind = "counter", unit = "answers", labels = ["check", "model", "project", "stage"] }

[metric.delivery_channel]
doc = "Per check, model, project and output channel (delivery.channel_label: block, soft_block, advisory, system_message, stderr, plain), how many answers used it. An answer using several channels counts once in each. Lifetime. Off with delivery.funnel_enabled = 0."
value = { kind = "counter", unit = "answers", labels = ["check", "channel", "model", "project"] }

[metric.funnel_reports]
doc = "Funnel reports (`telemetry report`, or `telemetry funnel` with a time window) the running daemon computed (B4), by outcome: ok (the window start and end were read from stored snapshots, or no window was asked), partial (no stored snapshot was as old as the window start), reset (some series went down inside the window, the counters restarted), error (a bad flag, no snapshot at --to, or the report switched off with delivery.report_enabled = 0). A report run without a daemon is not counted (its process is gone). Lifetime."
value = { kind = "counter", unit = "reports", labels = ["outcome"] }

[metric.context_spills]
doc = "Joined hook contexts that were over the host's inline cap and spilled to a file (#311), by event. Lifetime; `status` delivery.spills_by_event."
value = { kind = "counter", unit = "spills", labels = ["event"] }

[metric.context_spill_pinned]
doc = "Spills whose file held a context at or above dispatch.context_pin_priority (the case the priorities exist to prevent). Lifetime; `status` delivery.pinned_spills."
value = { kind = "counter", unit = "spills", labels = [] }

[metric.budget_soft]
doc = "Requests that used more thread CPU than the SOFT budget (daemon.eval_soft_us); only warned about, every check kept its answer."
value = { kind = "counter", unit = "requests", labels = [] }

[metric.deadline_soft]
doc = "Requests answered after the client's fail-fast wait (client.deadline_ms) but inside the hard deadline; only warned about."
value = { kind = "counter", unit = "requests", labels = [] }

[metric.script_soft]
doc = "Script calls that used more thread CPU than their SOFT limit (script.time_limit_ms); only warned about, the call was not cut."
value = { kind = "counter", unit = "calls", labels = [] }

[metric.panics]
doc = "Request-handler panics that were contained."
value = { kind = "counter", unit = "panics", labels = [] }

[metric.accept_errors]
doc = "Accept calls that failed for a reason other than nothing pending (EMFILE, ENFILE, ENOBUFS, ENOMEM), by OS error code (os<n>); each one backs the accept loop off for daemon.accept_error_backoff_ms."
value = { kind = "counter", unit = "errors", labels = ["code"] }

[metric.client_gone_skipped]
doc = "Checks not run because the request's client had already closed its connection (daemon.skip_when_client_gone)."
value = { kind = "counter", unit = "checks", labels = [] }

[metric.slow_replies]
doc = "Replies finished after their client's deadline had passed: slow but healthy (the client fell back to Node), counted apart from errors."
value = { kind = "counter", unit = "replies", labels = [] }

[metric.rejected_peers]
doc = "Connections dropped because the peer uid was not ours."
value = { kind = "counter", unit = "connections", labels = [] }

[metric.dispatch_checks]
doc = "Built-in check entries the dispatcher sent to the daemon, by event, check and answer (decided, or defer = its Node hook ran instead) (D58)."
value = { kind = "counter", unit = "entries", labels = ["event", "check", "answer"] }

[metric.dispatch_entries]
doc = "What the dispatcher's plan did to each table entry of an event it asked the daemon about (D87): ran, skipped_predicate, skipped_max_rules, skipped_budget, shadowed or off, by event, entry, outcome and the hash of the non-default hook configuration the plan was made under (`default` when none)."
value = { kind = "counter", unit = "entries", labels = ["event", "entry", "outcome", "cfg"] }

[metric.hook_calls]
doc = "Hook requests served, by hook event."
value = { kind = "counter", unit = "requests", labels = ["event"] }

[metric.hook_latency_us]
doc = "Wall time to serve a hook request inside the daemon, by hook event."
value = { kind = "histogram", unit = "us", labels = ["event"] }

[metric.check_calls]
doc = "Built-in check runs, by check."
value = { kind = "counter", unit = "runs", labels = ["check"] }

[metric.check_decisions]
doc = "Built-in check outcomes, by check and decision (allow, block, advisory, defer)."
value = { kind = "counter", unit = "runs", labels = ["check", "decision"] }

[metric.check_latency_us]
doc = "Wall time of a built-in check run, by check."
value = { kind = "histogram", unit = "us", labels = ["check"] }

[metric.check_latency_by_size_us]
doc = "Wall time of a built-in check run, by check and by the size class of the transcript the request named (load.size_labels)."
value = { kind = "histogram", unit = "us", labels = ["check", "size"] }

[metric.check_bytes_read]
doc = "Transcript bytes a built-in check read (tail windows and walks it opened), by check and transcript size class; divide by check_calls for the mean per run."
value = { kind = "counter", unit = "bytes", labels = ["check", "size"] }

[metric.agent_scan_kept]
doc = "Kept-walk lookups of the agent scan (silent-agent-nudge and the agent gates): hit (the walk resumed from where the last scan stopped) or miss."
value = { kind = "counter", unit = "lookups", labels = ["result"] }

[metric.agent_scan_kept_miss]
doc = "Why a kept-walk lookup missed and the window was walked afresh: none (nothing kept: first scan, daemon restart, eviction or idle expiry), gen (defaults changed), file (other file or shrunk), window (kept walk older than the slid window allows), rel_min or straddles (an event or call left the window), digest (head or back of the file changed), straddles_after (appended lines judged a call outside the window), error (an older line raised)."
value = { kind = "counter", unit = "lookups", labels = ["reason"] }

[metric.transcript_line_skipped_oversize]
doc = "Transcript lines the agent scan read past without holding or parsing because they were longer than agent_scan.max_line_bytes (one huge tool_result), by reader: scan_window (a fresh read of the window) or scan_kept (the kept walk). A line is counted each time a scan reads past it. The scan is then unknown (agent_scan_degraded), never an answer made as if the line were not there."
value = { kind = "counter", unit = "lines", labels = ["reader"] }

[metric.agent_scan_degraded]
doc = "Agent scans that returned unknown (the callers' unsure path: the Node hook decides, the silent-agent nudge judges no transcript agents and does not block a Stop on it) because the window held a line longer than agent_scan.max_line_bytes that was skipped unparsed, by reader: scan_window or scan_kept. Any oversize line degrades the scan, noise or not, since the skipped line may have carried a completion."
value = { kind = "counter", unit = "scans", labels = ["reader"] }

[metric.dispatch_overhead_us]
doc = "Wall time of a dispatched hook request that no built-in check accounts for (request wall minus the sum of the checks), by hook event: parsing, plan, locks, waits and queueing inside the daemon."
value = { kind = "histogram", unit = "us", labels = ["event"] }

[metric.evidence_cache]
doc = "Transcript evidence lookups (claim-ledger and other `ah.transcript.evidence` callers): hit (nothing appended), extend (only the appended bytes were read) or rebuild (the window was read afresh)."
value = { kind = "counter", unit = "lookups", labels = ["result"] }

[metric.evidence_walk]
doc = "Evidence walks (the claim ledger's `ah.transcript.evidenceWalk`) the memory registry refused to keep, so the check deferred."
value = { kind = "counter", unit = "walks", labels = ["result"] }

[metric.evidence_cache_rebuild]
doc = "Why a transcript evidence lookup read its window afresh: none (nothing kept: first call, daemon restart, eviction or idle expiry), file (another file or a shorter one), window (the window moved past the kept lines) or digest (the file was rewritten in place)."
value = { kind = "counter", unit = "lookups", labels = ["reason"] }

[metric.check_cpu_us]
doc = "CPU time (microseconds, the worker thread's own) spent inside each built-in check, by check: the sum over its calls. Divide by `check_calls` for the mean; wall time is `check_latency_us`."
value = { kind = "counter", unit = "us", labels = ["check"] }

[metric.event_check_cpu_us]
doc = "CPU time (microseconds, the worker thread's own) spent inside built-in checks while serving each hook event: the sum over every check call of that event (`status --json` `cpu.by_event`)."
value = { kind = "counter", unit = "us", labels = ["event"] }

[metric.check_mem_peak_bytes]
doc = "The most one call of a built-in check (and its script) grew the heap above where the call started, in bytes, by check: a histogram whose max is the check's worst call. Counted from per-thread counters in the allocator (`diagnostics.check_mem`)."
value = { kind = "histogram", unit = "bytes", labels = ["check"] }

[metric.check_mem_alloc_bytes]
doc = "The bytes one call of a built-in check (and its script) allocated in total, freed or not, by check: a histogram whose max is the check's worst call (`diagnostics.check_mem`)."
value = { kind = "histogram", unit = "bytes", labels = ["check"] }

[metric.check_mem_retained_bytes]
doc = "The bytes a check's calls kept allocated when they returned (allocated minus freed, positive only), by check: the sum over its calls. A check that keeps growing here holds on to memory. Calls that freed more than they allocated add nothing."
value = { kind = "counter", unit = "bytes", labels = ["check"] }

[metric.tasks_cache]
doc = "Task-line lookups of `ah.transcript.tasks` (task-guard, tasklist-guard, task-tracker): hit (nothing appended), extend (only the appended bytes were read) or rebuild (the window was read afresh)."
value = { kind = "counter", unit = "lookups", labels = ["result"] }

[metric.tasks_cache_rebuild]
doc = "Why a task-line lookup read its window afresh: none (nothing kept: first call, daemon restart, eviction or idle expiry), file (another file or a shorter one), window (the window moved past the kept lines) or digest (the file was rewritten in place)."
value = { kind = "counter", unit = "lookups", labels = ["reason"] }

[metric.rule_hits]
doc = "Regex rule matches, by action (deny, warn, context)."
value = { kind = "counter", unit = "matches", labels = ["action"] }

[metric.rss_kb]
