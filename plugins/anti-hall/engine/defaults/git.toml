# ---- limits, budgets and timeouts ------------------------------------------------------------------------

[git.max_chain]
doc = "Longest git alias chain followed before giving up."
value = 10

[git.alias_depth]
doc = "Deepest alias or shell-definition expansion that is rescanned."
value = 3

[git.launcher_hops]
doc = "Most symlink hops followed when resolving a dangling launcher link."
value = 10

[git.inline_depth]
doc = "Nesting depth of inline shells (`bash -c`), eval and command substitutions the git check follows into (the git-guard.js `d < 3`; the command check has its own command.max_depth). The minimum is the shipped value: a security scan must not be loosened below its pre-config literal; raising is allowed."
value = 3
min = 3
max = 16

[git.heredoc_levels]
doc = "Deepest nesting of heredoc bodies the git check reads for a git command fed through a heredoc; a deeper body is not scanned. The minimum is the shipped value: a security scan must not be loosened below its pre-config literal; raising is allowed."
value = 6
min = 6
max = 32

[git.var_hops]
doc = "Most variable indirections (`$A` naming `$B` ...) followed when deciding whether a path variable names the hook launcher. The minimum is the shipped value: a security scan must not be loosened below its pre-config literal; raising is allowed."
value = 4
min = 4
max = 32

[git.cd_max_chars]
doc = "A tracked cd directory longer than this many characters is dropped (a command that long is not worth resolving)."
value = 4096
unit = "chars"

[git.cd_max_segments]
doc = "A tracked cd directory with more path segments than this is dropped."
value = 64

[git.commit_hash_len]
