  "verbose",
], big_l = ["sched-runtime", "sched-period", "sched-deadline"], ops = 1 }, taskset = { s = "apc", v = "", l = ["all-tasks", "pid", "cpu-list"], big_l = [], ops = 1 }, doas = { s = "nsL", v = "uC", l = [], big_l = [], ops = 0 } }

