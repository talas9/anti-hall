# ---- GH #457: unresolved expansion in a commit message, and the pre-push credit backstop -----------------------

[git.commit_expansion_patterns]
doc = "Regular expressions (JavaScript syntax) for a shell expansion left in the raw text of an inline commit message argument: the guard reads the command text, so a trailer behind a variable or a substitution is invisible to it."
value = ["\\$[A-Za-z_{]", "\\$\\(", "`"]

[git.commit_expansion_allow]
doc = "Regular expressions tested against the text that starts at an expansion; a match means the expansion is a form the guard already reads (a heredoc substitution, or the `$(:)` stand-in the guard puts where it already scanned a heredoc body), so it is not refused."
value = ["^\\$\\([ \\t]*cat[ \\t]*<<", "^\\$\\([ \\t]*:[ \\t]*\\)"]

[git.msg_commit_expansion]
doc = "Block: an inline commit message holds an unresolved shell expansion. Placeholder: {shown} (the first expansion found)."
value = { what = "the commit message holds a shell expansion ({shown}).", why = "The guard reads the command text, so a credit line behind a variable or substitution cannot be checked.", instead = "write the message literally in the -m argument (or a heredoc) and commit again." }

[git.push_skip_opts]
doc = "git push options after which nothing is published, so the pre-push credit backstop is skipped."
value = ["--dry-run", "-n", "--delete", "-d"]

[git.push_argv_log]
doc = "git arguments listing every local commit no remote has (the pre-push credit check reads all of them, whatever the push would publish): {dir} is the repository directory, {repo} expands to the command's --git-dir/--work-tree, {n} the most commits read (the cap plus one, to see an overflow). Fields are separated by US and records end with RS (git_audit.field_sep, git_audit.record_sep)."
value = ["-C", "{dir}", "{repo}", "log", "-n", "{n}", "--format=%H%x1f%B%x1e", "--exclude=refs/stash", "--exclude=refs/original/*", "--all", "--not", "--remotes"]

[git.msg_push_over_cap]
doc = "Block: more local commits are on no remote than the pre-push credit check reads, so a credit past the cap could not be ruled out. Placeholder: {cap}."
value = { what = "more than {cap} local commits are on no remote, more than the credit check reads.", why = "A credit in a commit past the cap could not be ruled out, and the guard never allows what it did not read.", instead = "check them yourself (git log --all --not --remotes), reword any with an AI credit, then push.", override = "turn off guards.gitPushCreditCheck for this push, only after you checked the range." }

[git.push_unchecked_advisory]
doc = "Advisory when a git query of the pre-push credit check could not run (unavailable), failed (non-zero exit, e.g. not a repository) or passed push_timeout_ms: the push is let through unchecked."
value = "anti-hall: this push was not checked for AI credit lines (git could not run, failed or timed out); check git log --all --not --remotes yourself."

[git.push_same_call_subs]
doc = "Subcommands whose message the same-call check reads: with a push in the same Bash call, one whose message layer 1 cannot read is refused (msg_push_same_call)."
value = ["commit", "commit-tree", "tag", "merge", "revert", "rebase"]

[git.push_same_call_always]
doc = "Subcommands that write a commit message layer 1 never reads (a patch, a copied commit); with a push in the same Bash call they are refused."
value = ["am", "cherry-pick"]

[git.push_same_call_need_message]
doc = "Subcommands of push_same_call_subs that open an editor or reuse a message without a literal -m (or -F - fed by a quoted heredoc): with none, the message counts as unread."
value = ["commit", "merge", "revert"]

[git.push_same_call_opts]
doc = "Regular expressions (JavaScript syntax) for options that take the message from somewhere layer 1 does not read (a reused or edited commit, a template, an editor: -e or --edit); any one makes the message unread. A short-flag cluster ending in m (-em) is matched on its flags before the m."
value = ["^-[A-Za-z]*[Ccte]", "^--(?:reuse-message|reedit-message|template|edit|continue)(?:=|$)"]

[git.push_same_call_no_commit_opts]
doc = "Regular expressions (JavaScript syntax) for options with which a subcommand of push_same_call_subs writes no commit of its own (an aborted, skipped or fast-forward-only merge, rebase or revert): the same-call check lets it through."
value = ["^--(?:abort|quit|skip|ff-only|squash|no-commit)$"]

[git.push_same_call_no_edit_subs]
doc = "Subcommands of push_same_call_need_message whose message git writes itself when push_same_call_no_edit_opt is given (a revert's own subject line): that option counts as a read message."
value = ["revert"]

[git.push_same_call_no_edit_opt]
doc = "The option that makes git write the message of a push_same_call_no_edit_subs subcommand itself, with no editor and no prepared message."
value = "--no-edit"

[git.push_same_call_quoted_heredoc]
doc = "Regular expression (JavaScript syntax) for a quoted heredoc on the commit's own command: -F - fed by one is read by layer 1 (its body never expands)."
value = "<<-?[ \\t]*(?:'[^']+'|\"[^\"]+\"|\\\\\\S)"

[git.push_same_call_here_string]
doc = "Regular expression (JavaScript syntax) for a here-string on the commit's command; it expands, so -F - fed by one is unread."
value = "<<<"

[git.msg_push_same_call]
doc = "Block: one Bash call creates a commit whose message layer 1 cannot read and pushes. Placeholder: {sub} (the subcommand)."
value = { what = "this call creates a commit whose message the guard cannot read (git {sub}) and pushes in the same call.", why = "A credit line in that message would be published before any check could see it, and a published commit cannot be reworded without a force push.", instead = "split it: commit in one call, push in a separate call (the push is checked on what git stored)." }

[git.script_run_verbs]
doc = "Commands whose first argument is a script file run in the current shell (source, .); the file is scanned like a script run by path (msg_script_credit)."
value = ["source", "."]

[git.script_scan_max_bytes]
doc = "Largest script (in bytes) a Bash call runs by literal path (bash x.sh, sh x.sh, ./x.sh, source x) that is read and scanned for AI credit lines and a same-call commit and push; a larger, missing or non-literal one is let through with script_unchecked_advisory."
value = 262144
min = 1024
max = 16777216

[git.script_inert_line_re]
doc = "A line of a script that cannot put text into a commit message: a pure comment line, or a plain grep, egrep, fgrep or rg of a pattern. A grep line with a pipe, a here-string or other input or output redirection, a process or command substitution, a variable expansion or a ; / & continuation is live (it can feed a command). The script credit scan ignores inert lines, and a script that never commits, merges, tags, pushes or publishes with gh (push_same_call_subs, push, and a gh command of gh_subs and gh_actions, whose body is checked like the direct command) is not scanned for credit text at all."
value = "^[ \\t]*(?:#|(?:(?:e|f)?grep|rg)\\b[^|<>;&`$]*$)"

[git.msg_script_credit]
doc = "Block: a Bash call runs a script whose text carries an AI credit line. Placeholders: {file} (the script path), {line} (the first line with the credit)."
value = { what = "this call runs {file}, whose line {line} carries an AI credit line.", why = "The script would commit or publish that line before any check could see the stored message.", instead = "remove the credit line from {file} and run it again; credit lines never go into commits, pushes or PR text." }

[git.script_unchecked_advisory]
doc = "Advisory when a script a Bash call runs by path could not be read (missing, over script_scan_max_bytes, or not a literal path): it is let through unchecked. Placeholder: {file}."
value = "anti-hall: the script {file} was not checked for AI credit lines (missing, too large or not a literal path); check it yourself before it commits or pushes."

[git.push_max_commits]
doc = "Most unpushed local commits (on any ref, pushed or not by this push) the pre-push credit check reads; more is refused (msg_push_over_cap), never allowed unread."
value = 50
min = 1
max = 1000

[git.push_timeout_ms]
doc = "Timeout of each git query the pre-push credit backstop runs."
value = 4000
unit = "ms"

[git.msg_push_credit]
doc = "Block: a push would publish commits that carry an AI credit. Placeholder: {shown} (each short hash with the branches that hold it, push_hit_format)."
value = { what = "this push would publish commits with AI credit: {shown}.", why = "Commits in this setup carry no AI credit, and the guard never rewrites history for you.", instead = "unpushed tip of your branch: switch to it, reword it (commit --amend); already public or other: tell the owner." }

[git.push_ack_max_shas]
doc = "OFF by default (0): a credited commit never reaches a push, and an identical retry of a blocked push is blocked again. When set above 0 (PR #469 round 6), after msg_push_credit blocked a push once, the identical push retried unchanged (same command text and directory) downgrades the commits it named to push_ack_advisory for the rest of the session; a new credited commit still blocks first, and past this many the oldest acknowledgement is dropped. Trade-off: a commit that is already public but whose remote-tracking ref was pruned looks unpushed offline and blocks every push until it is acknowledged, so the owner may enable this knowingly; it also lets ANY credited commit through on an identical retry, which agents do after a block. A stamp that cannot be written lets the blocked commits through with the advisory at once (fails toward advisory)."
value = 0

[git.push_ack_state_prefix]
doc = "File name prefix of the per-session push acknowledgement stamp (push_ack_max_shas), kept in replykit.state_dir under the home directory with replykit.json_ext; the session id follows it."
value = "git-push-ack-"

[git.push_ack_advisory]
doc = "Advisory when a push is let through because its credited commits were acknowledged in this session (push_ack_max_shas). Placeholder: {shown} (as in msg_push_credit)."
value = "anti-hall: this push was let through although it may publish commits with AI credit: {shown}. They were blocked once and the same push was retried unchanged, so they are taken as already public; if they are not, stop and tell the owner."

[git.push_hit_format]
doc = "One credited commit in msg_push_credit. Placeholders: {sha} (short hash), {branches} (the local branches that contain it, from push_argv_branch_contains), {where} (push_hit_where_format for a submodule, else empty)."
value = "{sha} on {branches}{where}"

[git.push_hit_no_branch_format]
doc = "One credited commit in msg_push_credit that no local branch contains (a tag, a custom ref, a detached HEAD), or whose branches could not be read. Placeholders: {sha}, {where}."
value = "{sha} (on no local branch){where}"

[git.push_hit_where_format]
doc = "Appended to a credited commit found inside a submodule. Placeholder: {path} (the submodule directory)."
value = " in submodule {path}"

[git.push_argv_branch_contains]
doc = "git arguments listing the local branches that contain one credited commit, for the block message ({dir}, {repo} as in push_argv_log; {sha} the commit). At most git.shown hits are looked up, each bounded by push_timeout_ms."
value = ["-C", "{dir}", "{repo}", "branch", "--format=%(refname:short)", "--contains", "{sha}"]

[git.push_argv_cdup]
doc = "git arguments printing the path from the push directory to the top of its work tree (empty at the top and in a bare repository); .gitmodules there means submodules are scanned."
value = ["-C", "{dir}", "{repo}", "rev-parse", "--show-cdup"]

[git.push_gitmodules_file]
doc = "The file at the top of a work tree whose presence makes the pre-push credit check scan each checked-out submodule too."
value = ".gitmodules"

[git.push_argv_submodules]
doc = "git arguments printing the absolute path of each checked-out submodule, nested ones included; each is scanned with push_argv_log, and all of them share push_max_commits."
value = ["-C", "{dir}", "{repo}", "submodule", "foreach", "--quiet", "--recursive", "pwd"]

[git.push_argv_tags]
doc = "git arguments listing the newest local tags ({n} of them, the commit cap plus one) as object type, name, tagged object and message. An annotated tag (push_tag_object_type) is in scope only when the commit it tags is itself unpushed (in the push_argv_log result): a tag on a commit a remote already has is taken as public, so a fetched credited tag never blocks, and a tag made locally on an already-pushed commit (or a tag of a tag) is not scanned. One in scope whose message carries an AI credit refuses the push. Fields end with US and records with RS."
value = ["-C", "{dir}", "{repo}", "for-each-ref", "--count={n}", "--sort=-creatordate", "--format=%(objecttype)%1f%(refname:short)%1f%(*objectname)%1f%(contents)%1e", "refs/tags"]

[git.push_tag_object_type]
doc = "The object type for-each-ref prints for an annotated tag (a lightweight tag prints its commit's type and is covered by the commit scan)."
value = "tag"

[git.msg_push_tag_credit]
doc = "Block: a local annotated tag's message carries an AI credit. Placeholder: {tags} (the tag names)."
value = { what = "the local annotated tag {tags} carries an AI credit in its message.", why = "A push would publish it, and a published tag cannot be reworded without a force push.", instead = "if you made it and no remote has it, recreate it cleanly; else stop and tell the owner. Never force push." }

[git.push_repo_env_names]
doc = "Environment names that move the repository a push runs in: a value the shell expands at run time refuses the push (msg_push_dynamic_repo), and submodule scans run without them."
value = ["GIT_DIR", "GIT_WORK_TREE"]

[git.push_repo_opts]
doc = "git options before the subcommand whose value is the repository a push runs in; a value the shell expands at run time refuses the push (msg_push_dynamic_repo)."
value = ["-C", "--git-dir", "--work-tree"]

[git.push_dynamic_path_res]
doc = "Regular expressions (JavaScript syntax) for a repository path, as written, that the guard cannot expand (a ~user home, an unquoted glob); a $ or backtick expansion is always one."
value = ["^~[^/]", "^[^'\"]*[*?\\[]"]

[git.push_dynamic_repo_cmd_re]
doc = "Regular expression (JavaScript syntax) over the whole command for a git push at command position whose -C, --git-dir or --work-tree value holds an unquoted command substitution (a quoted one is read on the token): the segment splitter cuts the command there, so the push is matched on the raw text (msg_push_dynamic_repo)."
value = "(?:^|[;&|\\n(]\\s*)(?:[A-Za-z_][A-Za-z0-9_]*=[^\\s;&|'\"]*\\s+)*git\\s+(?:[^\\s;&|'\"]+\\s+)*?(?:-C\\s+|--git-dir[=\\s]|--work-tree[=\\s])[^\\s;&|'\"]*(?:\\$\\(|`)[^;&|\\n]*\\bpush\\b"

[git.msg_push_dynamic_repo]
doc = "Block: a push whose repository (-C, --git-dir, --work-tree, GIT_DIR, GIT_WORK_TREE) is a path the shell expands at run time. Placeholder: {arg}."
value = { what = "this push runs in a repository path the guard cannot read before it runs ({arg}).", why = "The credit check would read some other directory and could miss a credited commit.", instead = "write the repository path literally (git -C /full/path push, or cd /full/path first)." }

[git.block_key_prefix]
doc = "The prefix of a message key that is removed to make the reason label of the git_blocked counter."
value = "msg_"

[metric.git_blocked]
doc = "Commands the git guard blocked, by reason (the message key without its prefix, e.g. commit_credit, commit_expansion, push_credit, gh_credit, force_push)."
value = { kind = "counter", unit = "commands", labels = ["reason"] }

[metric.git_push_blocked]
doc = "Pushes the pre-push credit backstop blocked because an unpushed commit carries an AI credit (GH #457)."
value = { kind = "counter", unit = "pushes", labels = [] }

[metric.git_push_ack_downgraded]
doc = "Pushes the credit backstop let through as an advisory because the identical push had been blocked once and git.push_ack_max_shas acknowledges it (off by default)."
value = { kind = "counter", unit = "pushes", labels = [] }

[metric.git_audit_blocked]
doc = "Bash calls the post-call commit check blocked because a commit git just wrote carries an AI credit (PR #469)."
value = { kind = "counter", unit = "blocks", labels = [] }

[git.expansion_shown_chars]
doc = "How many characters of the expansion the refusal shows."
value = 12
min = 1
max = 80
unit = "chars"

[git.block_reason_other]
doc = "The reason label of the git_blocked counter for a block that has no message key."
value = "other"
