# ah-engine shipped defaults for the built-in `git` check (a port of the git-guard hook), D17 and D30.
#
# Every table, allowlist, wrapper grammar, limit, timeout, setting name and block-message text of the check lives
# here; the Rust code in src/checks/git holds only the parsing logic. Format: see the header of engine.toml.
# Compact option-name sets are space-separated strings (as in the Node source); lists are TOML arrays. Message
# entries are tables of `what` / `why` / `instead` / `override` lines with `{name}` placeholders.

# ---- shell grammar tables (tokenizer and wrappers) -------------------------------------------------------

[git.wrappers]
doc = "Words that run another command and are looked through when finding what a segment really executes."
value = [
  "command", "builtin", "exec", "sudo", "env", "nice", "nohup", "time", "timeout", "then", "do", "else",
  "if", "while", "until", "elif", "coproc", "!",
]

[git.wrapper_value_opts]
doc = "Options of the sudo, timeout and nice wrappers that take a value, so the word after them is not the wrapped command (git-guard.js SUDO_VAL and the timeout and nice branches)."
value = { sudo = [
  "-u", "-g", "-p", "-C", "-r", "-t", "-U", "-h", "--user", "--group", "--prompt", "--close-from", "--role",
  "--type", "--other-user", "--host",
], timeout = ["-s", "--signal", "-k", "--kill-after"], nice = ["-n", "--adjustment"] }

