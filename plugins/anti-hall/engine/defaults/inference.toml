# ah-engine shipped defaults for the unsupported-inference scan of the speculation guard (guards.inferenceCheck, default off): a
# confident causal claim in a reply that no tool evidence in the transcript tail mentions. Rules and word lists live here; the scan
# itself is engine/logic/lib/80-inference.js. Format: see the header of engine.toml.

[inference.window_bytes]
doc = "How much of the end of the transcript is read as evidence."
value = 1048576
unit = "bytes"

[inference.connectives_after]
doc = "Regular expressions (JavaScript syntax, case-insensitive) of causal connectives whose cause follows them."
value = [
  '\b(?:is|are|was|were|being|been)\s+(?:caused|triggered|driven)\s+by\b',
  '\bcaused\s+by\b',
  '\b(?:the\s+)?(?:root\s+)?cause\s+(?:is|was)\b(?!\s+(?:not|now|still|fixed|proven|known|unknown|unclear|confirmed|resolved|addressed|un\w+)\b)',
  '\b(?:is|are|was|were)\s+due\s+to\b',
  '\bdue\s+to\b',
  '\bbecause(?:\s+of)?\b',
  '\b(?:stems?|stemmed|comes?|came|results|resulted|originates?|originated)\s+from\b',
  '\b(?:this|that|which|it)\s+means\b',
  '\bthe\s+culprit\s+(?:is|was)\b',
  '\b(?:root\s+)?cause\s*:(?!\s*(?:not|still|fixed|proven|known|unknown|unclear|confirmed|resolved|tbd|n/a|un\w+)\b)',
  '\b(?:comes?|came|boils?|boiled)\s+down\s+to\b',
  "\\bthat'?s\\s+why\\b",
  '\bthe\s+(?:issue|problem|bug|reason)\s+(?:is|was)\b',
  '\b(?:crash|crashes|failure|failures|error|errors|leak|lag|slowdown|spike|jump|mismatch|flake|hang|regression|outage|offset|drop|drops|delay|rollback|duplicates)\s+(?:is|are|was|were)\s+(?:the|a|an)\b(?!\s+(?:known|expected|same|only|one)\b)',
]

[inference.connectives_before]
doc = "Regular expressions (JavaScript syntax, case-insensitive) of causal connectives whose cause comes before them."
value = [
  '\b(?:is|was)\s+the\s+(?:culprit|root\s+cause|cause)\b',
  '\b(?:is|was)\s+(?:responsible|to\s+blame)\s+for\b',
  '\b(?:is|was)\s+what\s+(?:causes|caused|breaks|broke|triggers|triggered|crashes|crashed|slows|slowed|blocks|blocked)\b',
]

[inference.hypothetical_re]
doc = "A modal, conditional or hypothetical word (case-insensitive): a sentence with one in its head or its cause clause is a possibility, not a claim."
value = "\\b(?:if|whether|suppose|supposing|assuming|unless|would|could|might|may|can)\\b(?!['\\u2019]t)"

[inference.first_person_re]
doc = "First-person wording (case-sensitive) that marks design rationale or a plan, not a claim about the project's state."
value = "(?:^|[^\\w'])(?:I|we|We|I'(?:ll|d|ve|m))(?=[\\s,])"

[inference.plan_prefix_re]
doc = "A plan, next-step or option label at the start of a sentence (case-insensitive): not a claim."
value = '^\s*(?:[-*+•]\s+|\d+[.)]\s+)?(?:(?:the\s+)?plan|next(?:\s+step)?|todo|proposal|option\s+\w+|step\s+\d+)\s*[:\-—]'

[inference.unverified_re]
doc = "Wording (case-insensitive) by which the reply says its claim is unverified; a reply holding it is never flagged."
value = "\\b(?:unverified|not\\s+(?:yet\\s+)?(?:verified|confirmed|checked)|ha(?:ve|s)n'?t\\s+(?:yet\\s+)?(?:verified|confirmed|checked)|ha(?:ve|s)\\s+not\\s+(?:yet\\s+)?(?:verified|confirmed|checked)|i\\s+don'?t\\s+know|let\\s+me\\s+(?:verify|check|confirm)|need\\s+to\\s+(?:verify|confirm|check))\\b"

[inference.stop_words]
doc = "Space-separated function words and words too generic to identify a cause."
value = "a an the and or but nor so yet for of to in on at by with from into onto over under about after before between through during without within across against along around than then that this these those there here it its it's they them their he she his her we our you your i me my is are was were be been being am do does did done has have had having not no nor only also just still even very too more most less least much many some any all each every both either neither one two three first second last new old same other another such what which who whom whose when where why how because since due cause caused causes causing root reason means mean meaning culprit issue issues problem problems bug bugs thing things way ways case cases part parts kind lot lots time times now today yesterday again ever never always will would should could might may can must shall get gets got getting make makes made making use uses used using run runs ran running set sets setting go goes went going come comes came coming take takes took see sees saw seen show shows showed shown look looks looked keep keeps kept stay stays stayed instead actually really already anymore longer like as if else while until unless though although whether every per via etc file files code line lines value values data thing step steps result results resulted stems stem stemmed comes originates originated triggered driven responsible blame why that's happens happened happen work works worked working fail fails failed failing break breaks broke broken error errors wrong right correct incorrect still slower faster slow fast large small huge big"

[inference.ident_re]
doc = "A code-like identifier token (dotted, snake_case, camelCase, a path, a flag, a number with units)."
value = '^(?:[\w-]+\.[\w.-]+|[a-z0-9]+_[\w]+|[a-z]+[A-Z]\w*|[A-Z]{2,}\w*|\/[\w./-]+|--?[\w-]+|[\w:.-]*\d[\w:.-]*)$'

[inference.token_re]
doc = "The pattern that splits a cause clause into candidate tokens."
value = "[\\w./:'-]+"

[inference.token_trim_re]
doc = "Leading and trailing punctuation trimmed from a token."
value = "^['.:-]+|['.:-]+$"

[inference.ident_min_len_letters]
doc = "The shortest identifier containing a letter that counts as distinctive evidence."
value = 3
min = 1

[inference.ident_min_len_other]
doc = "The shortest identifier with no letter (a number) that counts as distinctive evidence."
value = 4
min = 1

[inference.word_min_len]
doc = "The shortest plain word that counts as a content word."
value = 4
min = 1

[inference.stem_re]
doc = "The suffix stripped from a content word before it is stemmed."
value = '(?:ing|ed|es|s)$'

[inference.stem_len]
doc = "How many characters of a word are kept as its stem."
value = 7
min = 1

[inference.words_needed]
doc = "How many content-word stems of the cause must co-occur in one evidence chunk when it has no distinctive identifier."
value = 2
min = 1

[inference.sentence_sep_re]
doc = "Where a line splits into sentences: sentence punctuation followed by white space and a capital, digit, quote or bracket."
value = "(?<=[.!?])\\s+(?=[A-Z0-9\"'(`*])"

[inference.question_re]
doc = "A sentence ending in a question mark is not a claim."
value = '\?\s*$'

[inference.cause_clause_split_re]
doc = "Where the cause clause of a sentence ends for the modal test (the first comma, colon, semicolon or dash)."
value = '[,:;—]'

[inference.observe_tools_re]
doc = "Names (case-insensitive) of the tools whose input counts as observation evidence."
value = '^(?:bash|read|grep|glob|ls|notebookread|webfetch|websearch|exec_command|shell|local_shell|container\.exec|exec|bashoutput|taskoutput|monitor|mcp__.*)$'

[inference.task_notification_re]
doc = "Text that marks a task notification (always evidence)."
value = '<task-notification>'

[inference.fence_re]
doc = "A fenced block pasted by the user (evidence)."
value = '(```|~~~)[^\n]*\n([\s\S]*?)\1'

[inference.max_chunk]
doc = "The most characters of one evidence chunk that are searched."
value = 20000
min = 100

[inference.oneline_control_re]
doc = "Control characters replaced by a space when a sentence is quoted back."
value = '[\x00-\x1F\x7F-\x9F]'

[inference.oneline_bidi_re]
doc = "Bidirectional control characters removed when a sentence is quoted back."
value = '[‪-‮⁦-⁩]'

[inference.oneline_max]
doc = "The longest quoted sentence in the block reason, in characters."
value = 120
min = 20

[inference.ellipsis]
doc = "Appended to a quoted sentence that was cut."
value = "…"

[inference.source]
doc = "The source recorded in the pending outcome of a block this scan made."
value = "inference"

[inference.msg_what]
doc = "Block headline of an unsupported inference; {sentence} is the reply's own sentence."
value = "your reply states a cause as fact ('{sentence}') but no tool output in this session mentions it."
