# ---- client failure reasons ---------------------------------------------------------------------------

[msg.client_bad_socket]
doc = "Exchange failure when the socket path is not a socket owned by this user."
value = "socket is not a socket owned by this user"

[msg.run_engine_missing]
doc = "Printed on stderr by the plugin's launcher script (scripts/ah-run.sh) when no engine can run the command, which exits 127: nothing else runs in its place. Placeholder: {what} (the verb or command words)."
value = "anti-hall: the engine is not installed or not runnable, so `{what}` did not run. Start a new session to reinstall it, or run `ah-hook.sh --doctor`."

[msg.engine_unreachable_notice]
doc = "Printed once per session on stderr by the hook wrapper when the engine is unreachable (not installed, crashed, did not answer in time, marked down): the call passes through unchecked because no fallback hooks exist. Placeholders: {event}, {why}."
value = "anti-hall: the engine did not answer this {event} call ({why}); it went through unchecked. Run `ah-engine doctor` if it keeps happening."

[msg.launcher_unreachable_why_missing]
doc = "The {why} of the engine-unreachable notice when no engine is installed."
value = "the engine is not installed"

[msg.launcher_unreachable_why_down]
doc = "The {why} of the engine-unreachable notice when the daemon-down marker is fresh."
value = "the engine is marked down"

[msg.launcher_unreachable_why_handed_back]
doc = "The {why} of the engine-unreachable notice when the engine handed the call back."
value = "the engine handed the call back"

[msg.launcher_unreachable_why_silent]
doc = "The {why} of the engine-unreachable notice when the engine exited without an answer."
value = "the engine exited without an answer"

[msg.launcher_unreachable_why_timed_out]
doc = "The {why} of the engine-unreachable notice when the engine did not answer in time."
value = "the engine did not answer in time"

[msg.launcher_unreachable_why_unfinished]
doc = "The {why} of the engine-unreachable notice when the engine did not finish."
value = "the engine did not finish"

[msg.launcher_unreachable_why_not_started]
doc = "The {why} of the engine-unreachable notice when the engine could not be started."
value = "the engine could not be started"

[msg.engine_unreachable_why_daemon]
doc = "The {why} of the engine-unreachable notice when the client could not reach the engine's daemon (down, breaker open, crash-loop stop)."
value = "the engine daemon could not be reached"

[msg.cold_guard_notice]
doc = "Printed once per session on stderr when a guard event gave up waiting for a cold-starting daemon and was let through unchecked; {event} is the event name."
value = "anti-hall: the engine was still starting, so this {event} was not checked; the guards apply again once it is up"

[msg.client_skip]
doc = "Log detail for a hook call that skipped the daemon because a down marker, the breaker or the crash-loop cooldown was active."
value = "skipped"

[msg.client_hung]
doc = "Log detail for a hook call that stopped waiting because the daemon's heartbeat is stale, seen for the first time (a suspicion, nothing is signalled). {pid} = the daemon, {age} = the heartbeat's age in ms."
value = "daemon {pid} heartbeat stale ({age} ms): suspected stopped or wedged"

[msg.client_hung_confirmed]
doc = "Log detail for a hook call that stopped waiting because the daemon's heartbeat stayed stale and unchanged past client.heartbeat_confirm_ms (a confirmed hang). {pid} = the daemon, {age} = the heartbeat's age in ms, {held} = how long the same heartbeat was seen unchanged in ms."
value = "daemon {pid} heartbeat stale ({age} ms) and unchanged for {held} ms: stopped or wedged"

[msg.log_hung_spared]
doc = "Log detail when a client declines to end a daemon it found hung, because the heartbeat moved, or the process generation (pid, start time, executable, state dir) could not be confirmed. {pid} = the pid the heartbeat names, {why} = the stale-heartbeat detail."
value = "did not end daemon {pid}: its heartbeat moved or its process generation could not be confirmed ({why})"

[msg.log_hung_kill]
doc = "Log detail when a client ends a hung daemon (verified pid) so a new one can start. {pid} = the ended daemon, {why} = the stale-heartbeat detail."
value = "ended hung daemon {pid} with SIGKILL: {why}"

[msg.client_timeout]
doc = "Exchange failure when the hard deadline passed."
value = "timeout"

[msg.client_connect]
doc = "Exchange failure when connecting failed. Placeholder: {err}."
value = "connect: {err}"

[msg.client_io]
doc = "Exchange failure for another I/O step. Placeholders: {what}, {err}."
value = "{what}: {err}"

[msg.client_bad_frame]
doc = "Exchange failure when the reply frame was damaged. Placeholder: {err}."
value = "bad reply frame: {err}"

[msg.client_what_stat]
doc = "The step named in msg.client_io when the socket path cannot be examined (a permission or path error, not a missing socket)."
value = "stat"

[msg.client_no_verdict]
doc = "Event-log detail and stderr reason when the engine answered a hook call with no verdict (BUSY, ERR or a damaged reply) on a guard event: the event's configured failure mode (dispatch.failure_mode, path infra) answers."
value = "anti-hall: the engine gave no verdict for this guard event"

[msg.log_malloc_decay_applied]
doc = "Event-log detail (kind malloc_decay) when the daemon, started without the allocator tuning in its environment, applied the decay settings of daemon.malloc_conf at runtime. Placeholder: {settings} (key=value list)."
value = "allocator decay applied at start: {settings}"

[msg.log_malloc_decay_skipped]
doc = "Event-log detail (kind malloc_decay) when the allocator decay settings could not be applied at start; the daemon runs with the allocator's own defaults. Placeholder: {reason}."
value = "allocator decay not applied: {reason}"

[msg.log_allocator_invalid]
doc = "Event-log detail (kind alloc_invalid) when diagnostics.allocator holds a value that is not an accepted allocator; the daemon starts with jemalloc. Placeholder: {value}."
value = "diagnostics.allocator={value} is not an accepted allocator; using jemalloc"

[msg.log_daemon_spawn_failed]
doc = "Event-log detail (kind spawn_fail, code os<n>) when the client could not start the daemon (fork or exec failed: EAGAIN, ENOMEM, a missing executable). Placeholder: {err}."
value = "could not start the daemon: {err}"

[msg.client_unavailable]
doc = "Printed on stderr when stdin cannot safely be sent to the engine (undecodable or oversized). Guard events exit 2; non-guard events exit 0 with this note."
