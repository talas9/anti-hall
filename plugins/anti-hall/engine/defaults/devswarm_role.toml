# ah-engine shipped defaults for the DevSwarm role checks ported from Node: devswarm-child-role (SessionStart) and
# devswarm-parent-gate (Stop). Every name, switch, pattern and message text of those two checks lives here (D17). Format: see the
# header of engine.toml. The message templates are the exact message text with
# the run-time values replaced by {placeholders}.

[devswarm_role.child_summary]
doc = "One-line description of the devswarm-child-role check in the generated reference."
value = "SessionStart: injects the DevSwarm mesh-only messaging directive for a child workspace or a Primary with no seat to settle; a Primary in a git checkout (seat adoption writes the mesh store), a stale stable launcher or anything else it cannot prove byte-identical defers to Node."

[devswarm_role.gate_summary]
doc = "One-line description of the devswarm-parent-gate check in the generated reference."
value = "Stop: the DevSwarm Primary gate (port of devswarm-parent-gate.js, decided in engine/logic/devswarm-parent-gate.js): the early exits, the inert and clean passes (loop state removed), the busy and grace advisories, and the neglect block with its loop state, cap, escalation, waiting-on-human lines and wake line; own unread, pending questions, stale verdicts, a parked escalation and every case it cannot reproduce byte for byte defer to the Node gate before anything is written."

[devswarm_role.gate_guard]
doc = "The skip-file name of the parent gate."
value = "devswarm-parent-gate"

[devswarm_role.judge_env]
doc = "Environment variable that marks the claude -p judge child; hooks that load in it exit silently."
value = "ANTIHALL_JUDGE_CHILD"

[devswarm_role.kill_env]
doc = "Environment variable whose value 1 switches the DevSwarm integration off (checked before the supervisor mode)."
value = "DISABLE_ANTIHALL_DEVSWARM"

[devswarm_role.repo_env]
doc = "Environment variable DevSwarm sets for a session under it; its presence is the auto-mode detection of an active supervisor."
value = "DEVSWARM_REPO_ID"

[devswarm_role.branch_env]
doc = "Environment variable that tells a child workspace (non-empty) from a Primary (empty or unset)."
value = "DEVSWARM_SOURCE_BRANCH"

[devswarm_role.builder_env]
doc = "Environment variable holding the workspace id the injected commands name."
value = "DEVSWARM_BUILDER_ID"

[devswarm_role.agent_env]
doc = "Environment variable naming the workspace's agent (claude, codex, ...); only claude is told about the idle-wake cron and monitor tools."
value = "DEVSWARM_AI_AGENT"

[devswarm_role.claude_agent]
doc = "The agent name that has the idle-wake cron and monitor tools."
value = "claude"

[devswarm_role.test_markers]
doc = "Environment variables that mark a test run; with one of them set and the home equal to the real home the Node settings reader refuses, so the script counts the case as abandoned and allows rather than guess what Node does."
value = ["ANTIHALL_TEST", "ANTIHALL_TEST_ISOLATION"]

[devswarm_role.real_home_escape]
doc = "Environment variable that lifts the real-home refusal of the Node settings reader (tests that need the real home)."
value = "ANTIHALL_ALLOW_REAL_HOME_TEST"

[devswarm_role.sw_child_role]
doc = "Switch devswarm.childRole (default on): off makes the SessionStart hook a no-op."
value = { section = "devswarm", key = "childRole", option = "devswarm_child_role", default = true }

[devswarm_role.sw_parent_gate]
doc = "Switch devswarm.parentGate (default on): off makes the Stop gate a no-op."
value = { section = "devswarm", key = "parentGate", option = "devswarm_parent_gate", default = true }

[devswarm_role.sw_stable_launcher]
doc = "Switch devswarm.stableLauncher (default on): point the injected text at the version-independent launchers under the anti-hall bin directory instead of the plugin's own versioned path."
value = { section = "devswarm", key = "stableLauncher", env = "ANTIHALL_DEVSWARM_STABLE_LAUNCHER", default = true }

[devswarm_role.sw_rearm]
doc = "Switch devswarm.rearmOnTickOnly (default on): re-arm a lapsed monitor only from the cron tick, never inline on the monitor's own expiry."
value = { section = "devswarm", key = "rearmOnTickOnly", env = "ANTIHALL_DEVSWARM_REARM_ON_TICK_ONLY", option = "devswarm_rearm_on_tick_only", default = true }

[devswarm_role.sw_supervisor_mode]
doc = "Setting devswarm.supervisorMode (auto, on or off): force the supervisor context on or off, or detect it from the environment. default is also the manifest default the plugin option is compared with."
value = { section = "devswarm", key = "supervisorMode", env = "ANTIHALL_DEVSWARM_SUPERVISOR", option = "devswarm_supervisor_mode", default = "auto", values = ["auto", "on", "off"] }

[devswarm_role.sw_wake_cron]
doc = "Setting devswarm.wakeCron: the cron schedule of the mailbox-wake job, untrusted text that is validated before it is injected."
value = { section = "devswarm", key = "wakeCron", env = "ANTIHALL_DEVSWARM_WAKE_CRON", default = "7,37 * * * *" }

[devswarm_role.cron_charset]
doc = "The only characters a cron field may contain (anything else would let the setting inject text into the directive)."
value = "0123456789*/,-"

[devswarm_role.cron_fields]
doc = "How many whitespace-separated fields a valid cron schedule has."
value = 5
min = 1
max = 10

[devswarm_role.id_extra_chars]
doc = "Characters besides ASCII letters and digits that a workspace id may contain."
value = "._-"

[devswarm_role.id_placeholder]
doc = "What the injected commands name when the workspace id is absent or unsafe."
value = "<DEVSWARM_BUILDER_ID>"

[devswarm_role.hooks_dir]
doc = "The plugin's hooks directory, relative to the plugin root; the Node hooks resolve their own location from it (real path)."
value = "hooks"

[devswarm_role.bin_dir]
doc = "The directory of the stable launchers, relative to the home directory."
value = ".anti-hall/bin"

[devswarm_role.launcher_cli]
doc = "The stable launcher of the DevSwarm CLI: its file name under the bin directory and the script it resolves, relative to the plugin root."
value = { name = "devswarm.js", target = "../anti-hall-node/scripts/devswarm.js" }

[devswarm_role.launcher_watcher]
doc = "The stable launcher of the mailbox watcher: its file name under the bin directory and the script it resolves, relative to the plugin root."
value = { name = "wake-watch.js", target = "../anti-hall-node/companion/lib/devswarm-wake-watch.js" }

[devswarm_role.out_prefix]
doc = "The SessionStart hook output up to the directive text (host protocol; the text follows as a JSON string)."
value = '{"hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":'

[devswarm_role.out_suffix]
doc = "The SessionStart hook output after the directive text."
value = '}}'

[devswarm_role.msg_base]
doc = "The mesh-only messaging directive of a child workspace (placeholder {cli}: the DevSwarm CLI path)."
value = '''
💡 anti-hall · devswarm-comms: anti-hall's shared mesh store is this workspace's ONLY messaging channel for DevSwarm coordination — native hivecontrol send commands (`workspace message-*`) are BLOCKED. Report status: `{cli} heartbeat <id> --summary "<text>"`. Direct-message: `{cli} send --to-primary --message-file <path>` (or `--to <meshId>`). Check in: `{cli} roster`, `mesh read` (CONSUMES broadcasts — use `--peek` to check in without consuming), `inbox read-primary <id>` (read-only — then run the `ackCommand` it returns). RESTING state = keep polling the mesh — do not idle silently. Scope: COMMUNICATION ONLY; this never changes your assigned task. BLOCKED ON A DECISION? Never ask the human directly, never halt all work — a question parks ONE sub-task; keep working every other unblocked item. Send via `send --to-primary --question` (message = blocked/options/recommendation/DEFAULT you'll take/deadline). DEFAULT-AND-PROCEED: no reply by deadline -> take that default, proceed, and flag it LOUDLY as an explicit assumption in your report — never silently. Hard-stop ONLY for a destructive/irreversible action: park + report, do not guess a default. Ladder: child -> parent -> human, never child -> human. WHEN MERGED run `{cli} done --summary "..."` once; auto-archived after. If you have been idle with no active task for a while, proactively run `{cli} heartbeat <id> --summary "idle — reassign me a task or archive me"` so the parent orchestrator's task list stays honest instead of you sitting idle unnoticed.'''

[devswarm_role.msg_wake_other]
doc = "The mailbox-wake text of a workspace whose agent is not claude (placeholders {cli}, {id}, {agent})."
value = '''
 MAILBOX WAKE: this workspace runs `{agent}`, which has NO idle-wake primitive — once you go idle, nothing can wake you, so a message that lands after you stop waits for your next turn. Drain your mailbox at the START of every turn and again BEFORE you stop: first run `{cli} inbox pull {id}` (cheap, inline — imports anything waiting in your native queue) then `{cli} inbox count {id}` (both plain: no pipes/filters); if `unreadTotal` is 0 AND `meshGapWithheld` is NOT `true` AND `known` is NOT `false`, say so and stop — do NOT spawn a subagent; otherwise (either `unreadTotal` is greater than 0, or `meshGapWithheld` is `true`, or `known` is `false`), run `{cli} inbox read-primary {id}` (read-only; after handling, run the `ackCommand` it returns) (delegate to a subagent only if the payload is large — its ackCommand is the cursor-advancing step, matching devswarm-child-turn.js's own mesh-direct instruction; `inbox read` is a non-mutating peek and cannot clear the withheld gap) — if that reports `ok:false`, report the `reason` (and `storeUnavailableReason`/`storeUnavailableDetail` when present) in one line and stop (do not loop, do not spawn a subagent).'''

[devswarm_role.msg_wake_claude]
doc = "The mailbox-wake text of a claude workspace (placeholders {cli}, {watcher}, {id}, {cron}, {expiry})."
value = '''
 MAILBOX WAKE (do this NOW, on your FIRST turn): call `CronList`. If ANY existing job already runs `inbox tick` for this workspace — any schedule, id, or partition UUID — that counts as present; do nothing, never create a second one. Only if ABSENT — never created, or auto-expired (recurring tasks self-delete 7 days after creation) — call `CronCreate` with schedule `{cron}` and a prompt that runs run `{cli} inbox tick {id} --child --quiet` (run plain: no pipes/filters) (with `--child` it first imports anything waiting in your native queue, then prints one line with the SAME unread/meshGap/known signal `inbox count` reports, and writes a liveness marker + refreshes your heartbeat — one command instead of pull+count); If its `watcherArmed` reads `false` (your Monitor lapsed at its 30-min cap; not `idle-skip`/`limit-skip`), re-arm: `Monitor` with `{watcher}` and timeout_ms 1800000 (without it the Monitor expires after the 5-minute default; add persistent: true if supported). if the printed line reads `unread 0` AND `meshGap false` AND `known` is NOT `false`, say so and stop — do NOT spawn a subagent; otherwise (either `unread` is greater than 0, or `meshGap` is `true`, or `known` is `false`), run `{cli} inbox read-primary {id}` (read-only; after handling, run the `ackCommand` it returns) (delegate to a subagent only if the payload is large — this is the cursor-advancing verb, matching devswarm-child-turn.js's own mesh-direct instruction; `inbox read` is a non-mutating peek and cannot clear the withheld gap) — if that reports `ok:false`, report the `reason` (and `storeUnavailableReason`/`storeUnavailableDetail` when present) in one line and stop (do not loop, do not spawn a subagent) and acts on anything unread. Cron jobs fire while this session is IDLE (each tick is a full turn) — this cron is now a 30-MINUTE FALLBACK cadence (cheaper than the pre-D13 5-minute default), NEVER disarmed — it is the only thing that will wake you to drain your mailbox once you go idle; a message that lands after you stop is otherwise never seen. ALSO arm the `Monitor` tool as your PRIMARY wake path (Cron above is the 30-minute FALLBACK — it still fires independently; Monitor is IN ADDITION, never instead): first check whether a mailbox-wake Monitor is already armed so you never arm a second one (double-arming causes duplicate wakes; the watcher script also self-guards with a lock, but do not rely on that alone). If none is armed, call `Monitor` with command `{watcher}` and a description like "devswarm mailbox wake watcher": use `persistent: true` if your Monitor tool supports it, else max `timeout_ms`{expiry} — never two watchers at once. Every line it prints on stdout becomes a transcript event, waking this session even while fully idle, with far lower latency than the cron tick above. A first line starting `[wake-watch] REFUSED TO ARM` means you do NOT have this coverage — do not assume you do; the cron job above is still your only wake path.'''

[devswarm_role.msg_base_parent]
doc = "The mesh-only messaging directive of a Primary (placeholder {cli}: the DevSwarm CLI path)."
value = '''
💡 anti-hall · devswarm-comms: anti-hall's shared mesh store is this workspace's ONLY messaging channel for DevSwarm coordination — native hivecontrol send commands (`workspace message-*`) are BLOCKED. Report status: `{cli} heartbeat <id> --summary "<text>"`. Direct-message: `{cli} send --to-primary --message-file <path>` (or `--to <meshId>`). Check in: `{cli} roster`, `mesh read` (CONSUMES broadcasts — use `--peek` to check in without consuming), `inbox read-primary <id>` (read-only — then run the `ackCommand` it returns). RESTING state = keep polling the mesh — do not idle silently. Scope: COMMUNICATION ONLY; this never changes your assigned task. BLOCKED-QUESTION REPLIES: a child's question means YOU decide from the plan context, replying via `send --to <meshId>`; escalate to the human only for a genuine human call (destructive/irreversible, scope-changing, unsafe to assume). Ladder: child -> parent -> human, never child -> human. Full verb list: `{cli} help --short`.'''

[devswarm_role.msg_wake_other_parent]
doc = "The mailbox-wake text of a Primary whose agent is not claude (placeholders {cli}, {id}, {agent})."
value = '''
 MAILBOX WAKE: this workspace runs `{agent}`, which has NO idle-wake primitive — once you go idle, nothing can wake you, so a message that lands after you stop waits for your next turn. Drain your mailbox at the START of every turn and again BEFORE you stop: first run `{cli} inbox count {id}` (run plain: no pipes/filters); if `unreadTotal` is 0 AND `meshGapWithheld` is NOT `true` AND `known` is NOT `false`, say so and stop — do NOT spawn a subagent; otherwise (either `unreadTotal` is greater than 0, or `meshGapWithheld` is `true`, or `known` is `false`), run `{cli} inbox read-primary {id}` (read-only; after handling, run the `ackCommand` it returns) (delegate to a subagent only if the payload is large) — if that reports `ok:false`, report the `reason` (and `storeUnavailableReason`/`storeUnavailableDetail` when present) in one line and stop (do not loop, do not spawn a subagent).'''

[devswarm_role.msg_wake_claude_parent]
doc = "The mailbox-wake text of a claude Primary (placeholders {cli}, {watcher}, {id}, {cron}, {expiry})."
value = '''
 MAILBOX WAKE (do this NOW, on your FIRST turn): call `CronList`. If ANY existing job already runs `inbox tick` for this workspace — any schedule, id, or partition UUID — that counts as present; do nothing, never create a second one. Only if ABSENT — never created, or auto-expired (recurring tasks self-delete 7 days after creation) — call `CronCreate` with schedule `{cron}` and a prompt that runs run `{cli} inbox tick {id} --quiet` (run plain: no pipes/filters) (with `--child` it first imports anything waiting in your native queue, then prints a status line with the SAME unread/meshGap/known signal `inbox count` reports, and writes a liveness marker + refreshes your heartbeat — one command instead of pull+count); If its `watcherArmed` reads `false` (your Monitor lapsed at its 30-min cap; not `idle-skip`/`limit-skip`), re-arm: `Monitor` with `{watcher}` and timeout_ms 1800000 (without it the Monitor expires after the 5-minute default; add persistent: true if supported). if the FIRST printed line (any lines after it are an informational roster: ignore them here) reads `unread 0` AND `meshGap false` AND `known` is NOT `false`, say so and stop — do NOT spawn a subagent; otherwise (either `unread` is greater than 0, or `meshGap` is `true`, or `known` is `false`), run `{cli} inbox read-primary {id}` (read-only; after handling, run the `ackCommand` it returns) (delegate to a subagent only if the payload is large) — if that reports `ok:false`, report the `reason` (and `storeUnavailableReason`/`storeUnavailableDetail` when present) in one line and stop (do not loop, do not spawn a subagent) and acts on anything unread. Cron jobs fire while this session is IDLE (each tick is a full turn) — this cron is now a 30-MINUTE FALLBACK cadence (cheaper than the pre-D13 5-minute default), NEVER disarmed — it is the only thing that will wake you to drain your mailbox once you go idle; a message that lands after you stop is otherwise never seen. ALSO arm the `Monitor` tool as your PRIMARY wake path (Cron above is the 30-minute FALLBACK — it still fires independently; Monitor is IN ADDITION, never instead): first check whether a mailbox-wake Monitor is already armed so you never arm a second one (double-arming causes duplicate wakes; the watcher script also self-guards with a lock, but do not rely on that alone). If none is armed, call `Monitor` with command `{watcher}` and a description like "devswarm mailbox wake watcher": use `persistent: true` if your Monitor tool supports it, else max `timeout_ms`{expiry} — never two watchers at once. Every line it prints on stdout becomes a transcript event, waking this session even while fully idle, with far lower latency than the cron tick above. A first line starting `[wake-watch] REFUSED TO ARM` means you do NOT have this coverage — do not assume you do; the cron job above is still your only wake path.'''

[devswarm_role.msg_expiry_tick]
doc = "The monitor-expiry clause when re-arming happens only from the cron tick."
value = '''
. Do NOT re-arm inline when it emits its final/expired event — reply in one line and stop; the next `inbox tick` cron turn re-arms it via `watcherArmed`'''

[devswarm_role.msg_expiry_inline]
doc = "The monitor-expiry clause when the monitor is also re-armed inline on its own expiry."
value = '''
 + re-arm on its final/expired event'''

[devswarm_role.engine_cli]
doc = "The command agents run for every DevSwarm CLI verb ({cli} in the texts): the native thin client's `mesh` verb (the old `bin/devswarm.js` shim stays installed for old sessions but is never advised). Placeholder: {home}, the absolute home directory."
value = "{home}/.anti-hall/ah-engine/bin/ah-hook mesh"

[devswarm_role.engine_watcher]
doc = "The command agents arm with `Monitor` for the mailbox watcher ({watcher} in the texts): the stable POSIX-sh shim that execs the engine's wake-watch verb. Placeholder: {home}."
value = "{home}/.anti-hall/bin/wake-watch.js"

[devswarm_role.engine_bin]
doc = "The engine binary the shims exec. Placeholder: {home}."
value = "{home}/.anti-hall/ah-engine/bin/ah-engine"

[devswarm_role.shim_cli]
doc = "The source of the DevSwarm CLI shim (placeholder {engine}: the engine binary). POSIX sh, no Node; compared byte for byte with the file on disk and rewritten when it differs."
value = '''#!/bin/sh
# AUTO-GENERATED by anti-hall (ah-engine) - do not edit by hand; rewritten when it differs.
exec "{engine}" mesh "$@"
'''

[devswarm_role.shim_watcher]
doc = "The source of the mailbox-watcher shim (placeholder {engine}: the engine binary). POSIX sh, no Node."
value = '''#!/bin/sh
# AUTO-GENERATED by anti-hall (ah-engine) - do not edit by hand; rewritten when it differs.
exec "{engine}" devswarm wake-watch "$@"
'''


