# ah-engine shipped defaults for the operator commands `update` and `install-codex` (D81, lane L9b): the ports of
# skills/update/scripts/update.js and codex/install-codex.js. Format: see the header of engine.toml.
#
# The texts are the Node scripts' own, word for word: tests/operator_parity.rs runs the script and the command on the same seeded
# scratch home and compares their output and the files they leave behind.

# ---- environment variable names -----------------------------------------------------------------------------------------

[env.update_marketplace_dir]
doc = "Overrides the marketplace clone `update` works on (an absolute path to an existing directory, else ignored with a warning). Test-only escape hatch."
value = "ANTIHALL_MARKETPLACE_DIR"

[env.update_postpull_budget]
doc = "Time budget in ms for the post-pull stages of `update` (0 = unlimited); also sizes the wait for the Node stage run."
value = "ANTIHALL_UPDATE_POSTPULL_BUDGET_MS"

[env.update_quiet]
doc = "When 1 (or true), `update` prints no `[update] <stage> start/done` progress lines on stderr. Settings key updates.quiet is the other source."
value = "ANTIHALL_UPDATE_QUIET"

[env.claude_execpath]
doc = "The running Claude Code binary; the fallback `update` runs `plugin update` with when `claude` is not on the PATH."
value = "CLAUDE_CODE_EXECPATH"

# ---- shadow comparison --------------------------------------------------------------------------------------------------

[operator.shadow]
doc = "1 = the Node version of an operator command runs read-only beside the engine's (update: `--check` after the update; install-codex: `--dry-run` before the write) and a difference in the reported result is logged. The engine's result is always the real one; the Node script is never run in a way that repeats a side effect. 0 = off."
value = 1
min = 0
max = 1

[operator.shadow_timeout_ms]
doc = "How long the Node shadow run may take before it is abandoned (nothing is logged for an abandoned run)."
value = 30000
unit = "ms"
min = 1000

[operator.shadow_update_log]
doc = "Event-log text when the Node `update.js --check` disagrees with the engine's update about the latest version."
value = "update shadow mismatch: node --check reports latest {nl}, the engine updated to {el}"

[operator.shadow_check_log]
doc = "Event-log text when the Node `update.js --check` prints a different status line than `update --check`."
value = "update --check shadow mismatch: node={node} engine={engine}"

[operator.shadow_codex_log]
doc = "Event-log text when the Node `install-codex.js --dry-run` reports something other than what the engine then wrote."
value = "install-codex shadow mismatch: node={node} engine={engine}"

[operator.dry_run_flag]
doc = "The flag that makes install-codex write nothing (given to the Node shadow run)."
value = "--dry-run"

[operator.codex_script_rel]
doc = "The Node installer inside the plugin directory."
value = "codex/install-codex.js"

# ---- update: paths and limits ---------------------------------------------------------------------------------------------

[update.marketplace_rel]
doc = "The marketplace clone of the plugin, relative to the home directory."
value = ".claude/plugins/marketplaces/anti-hall"

[update.cache_rel]
doc = "The version-pinned cache root, relative to the plugins root (two levels above the marketplace clone)."
value = "cache/anti-hall/anti-hall"

[update.installed_json]
doc = "The harness-owned registry of installed plugins under the plugins root. `update` reads it and never writes it."
value = "installed_plugins.json"

[update.plugin_src_rel]
doc = "The plugin directory inside the marketplace clone."
value = "plugins/anti-hall"

[update.plugin_json_rel]
doc = "The plugin manifest inside the plugin directory (its version is the version authority)."
value = ".claude-plugin/plugin.json"

[update.changelog_file]
doc = "The changelog at the top of the marketplace clone."
value = "CHANGELOG.md"

[update.remote_manifest]
doc = "The manifest as git names it on a remote ref (`--check` reads the remote version from it)."
value = "plugins/anti-hall/.claude-plugin/plugin.json"

[update.node_script_rel]
doc = "The Node update script inside the plugin directory, run with --post-pull-only for the stages the engine does not port (the DevSwarm store sweeps and the settings migration)."
value = "skills/update/scripts/update.js"

[update.max_bytes]
doc = "Largest manifest, registry or changelog `update` reads; a larger file counts as unread."
value = 4194304
unit = "bytes"
min = 1024

[update.json_max_depth]
doc = "Nesting past which a JSON file `update` reads counts as unreadable."
value = 512
min = 8

[update.git_timeout_ms]
doc = "How long one git call of `update` may take before it fails into the offline path."
value = 20000
unit = "ms"
min = 1000

[update.harness_timeout_ms]
doc = "How long `claude plugin update` may take before the registration is reported as failed."
value = 20000
unit = "ms"
min = 1000

[update.default_postpull_budget_ms]
doc = "The post-pull stages' overall budget when the environment does not set one."
value = 90000
unit = "ms"

[update.reexec_margin_ms]
doc = "Extra wait for the Node stage run beyond its budget and the harness registration (one overrunning stage plus process start)."
value = 60000
unit = "ms"

[update.poll_ms]
doc = "How often `update` checks a child process it waits for."
value = 25
unit = "ms"
min = 1

[update.git_bin]
doc = "The git binary."
value = "git"

[update.claude_bin]
doc = "The Claude Code binary the harness registration runs."
value = "claude"

[update.settings_file]
doc = "The settings file, relative to the home directory (updates.quiet is read from it)."
value = ".anti-hall/settings.json"

# ---- update: commands -----------------------------------------------------------------------------------------------------

[update.git_status]
doc = "git arguments: is the clone clean."
value = ["status", "--porcelain"]

[update.git_pull]
doc = "git arguments: fast-forward only. Never a merge, a rebase or a force."
value = ["pull", "--ff-only"]

[update.git_fetch]
doc = "git arguments: fetch without merging (`--check`)."
value = ["fetch", "--quiet"]

[update.git_upstream]
doc = "git arguments: the upstream ref of the current branch."
value = ["rev-parse", "--abbrev-ref", "--symbolic-full-name", "@{u}"]

[update.git_default_ref]
doc = "The remote ref used when the branch has no upstream."
value = "origin/HEAD"

[update.git_show]
doc = "git arguments to read a file from a ref: the word, then `<ref>:<path>` is appended."
value = ["show"]

[update.harness_args]
doc = "The arguments the harness registration runs the Claude binary with."
value = ["plugin", "update", "anti-hall@anti-hall"]

[update.git_spawn_error]
doc = "What a git call that could not start reads as ({code} is ENOENT for a missing binary)."
value = "spawnSync {prog} {code}"

[update.git_timeout_error]
doc = "What a call that ran past its timeout reads as."
value = "spawnSync {prog} ETIMEDOUT"

[update.git_failed_error]
doc = "What a call that exited non-zero with nothing on stderr reads as."
value = "Command failed: {cmd}"

[update.git_error_fallback]
doc = "The reason when a git error has no text at all."
value = "git error"

[update.offline_patterns]
doc = "The ONLY pull-failure shapes that fail open (case-insensitive): network, resolver and no-git errors. Any other pull failure is a hard STOP."
value = [
  "could not resolve host", "unable to access", "could not read from remote", "failed to connect",
  "connection (?:refused|reset|timed? ?out)", "network is unreachable", "temporary failure in name resolution",
  "no route to host", "operation timed out", "timed out", "command not found",
  "not recognized as an internal or external command",
  "ENOENT", "EAI_AGAIN", "ENOTFOUND", "ECONNREFUSED", "ECONNRESET", "ETIMEDOUT", "ENETUNREACH",
]

[update.semver_re]
doc = "A version string: X.Y.Z with an optional pre-release or build suffix; no path separators. Fully anchored."
value = "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"

[update.heading_re]
doc = "A changelog section heading; the first group is the version."
value = "^##\\s+v?([0-9]+(?:\\.[0-9]+)*)(?-u:\\b)"

[update.version_prefix_re]
doc = "The leading numeric part of a version string."
value = "^([0-9]+(?:\\.[0-9]+)*)"

[update.confirm_re]
doc = "A harness reply that asks for a confirmation (command-source installs); the engine never supplies it."
value = "(?i)accept-command|sha256"

[update.confirm_shown]
doc = "How many UTF-16 units of that reply are shown."
value = 300

[update.failed_re]
doc = "The words in a status action that make the human summary read as a failure."
value = "(?i-u)\\bSTOP\\b|dirty|diverged|failed|error"

