unit = "bytes"

[mem.jev_lanes_hard_bytes]
doc = "Estimated bytes held by resident Jev lanes at which new lane or queue retention is refused and recoverable lanes are recycled."
value = 4194304
min = 65536
unit = "bytes"

[mem.jev_lanes_low_water_pct]
doc = "Percent of mem.jev_lanes_soft_bytes resident Jev lanes are evicted down to when the soft limit is reached."
value = 80
min = 1
max = 100

[mem.jev_lanes_max_entries]
doc = "Resident Jev home lanes kept at most; past it the least recently used idle lane is dropped first."
value = 16
