[mem.jev_lanes_idle_ttl_ms]
doc = "How long a resident Jev lane may be idle before its worker is stopped and its lane may be evicted."
value = 600000
min = 1000
unit = "ms"

[mem.jev_queue_max_bytes]
doc = "Estimated bytes of detached Jev ask payloads a resident lane queue may hold before further queued asks are answered busy."
value = 1048576
min = 4096
unit = "bytes"

[mem.jev_queue_soft_bytes]
doc = "Estimated bytes of resident Jev async request payloads queued across lanes before the holder reports a soft memory trip."
value = 524288
