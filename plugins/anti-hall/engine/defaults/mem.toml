[mem.buckets_hard_bytes]
doc = "Estimated bytes of daemon session and project token-bucket keys at which unknown keys are refused and recoverable buckets are recycled."
value = 1048576
min = 4096
unit = "bytes"

[mem.buckets_low_water_pct]
