unit = "bytes"

[mem.jev_queue_hard_bytes]
doc = "Estimated bytes of resident Jev async request payloads queued across lanes at which new async asks are logged busy instead of being retained."
value = 1048576
min = 4096
unit = "bytes"

[mem.jev_queue_low_water_pct]
doc = "Percent of mem.jev_queue_soft_bytes the resident Jev async queue holder must fall to before soft and hard trips re-arm."
value = 80
min = 1
max = 100

[mem.buckets_soft_bytes]
