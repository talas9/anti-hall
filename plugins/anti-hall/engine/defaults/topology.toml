# ah-engine shipped defaults for the topology registry and the node action verbs (`ah-engine topology`, `ah-engine node`,
# src/topology.rs, src/nodeops.rs). Format: see the header of engine.toml.
#
# The registry counts, per client session, per store (a config, state or log file, a database, the transcript reads) and for the
# worker pool, with no per-call log: a call adds to a few counters under one short lock, and only every Nth call also fills the
# latency histogram and measures the registry's own cost.

[topology.enabled]
doc = "1 = the registry counts calls and store accesses; 0 = it counts nothing (the verb then reports empty tables)."
value = 1
min = 0
max = 1

[topology.latency_sample_every]
doc = "Every Nth served call also fills the latency histogram of its client and measures the registry's own cost; the other calls only add to their counters."
value = 4
min = 1

[topology.latency_bounds_us]
doc = "Upper bounds of the latency histogram buckets, in microseconds, ascending; a percentile is reported as the bound of the bucket it falls in (capped at the last bound)."
value = [500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 250000, 1000000]

[topology.key_max]
doc = "Most characters of a client or store name kept in the registry; longer names are cut."
value = 64
min = 8

[topology.clients_soft]
doc = "Soft limit of distinct clients kept: past it the registry still records, and counts the hit (`soft_hits`)."
value = 64
min = 1

[topology.clients_hard]
doc = "Hard limit of distinct clients kept: a new client past it is not kept and is counted in `dropped`."
value = 256
min = 1

[topology.stores_soft]
doc = "Soft limit of distinct stores kept: past it the registry still records, and counts the hit (`soft_hits`)."
value = 64
min = 1

[topology.stores_hard]
doc = "Hard limit of distinct stores kept: a new store past it is not kept and is counted in `dropped`."
value = 256
min = 1

[topology.overhead_budget_ns]
doc = "Budget for the registry's own cost, in nanoseconds per sampled call, measured by the registry itself; the report says when the measured average is over it."
value = 2000
min = 1

[topology.min_calls_for_health]
doc = "Fewest calls (or store operations) before a node's health is judged; below it the node reads as ok because there is not enough to tell."
value = 20
min = 1

[topology.warn_fail_open_pct]
doc = "A client is `warn` when this percent or more of its calls failed open (busy, internal error)."
value = 5
min = 0

[topology.bad_fail_open_pct]
doc = "A client is `bad` when this percent or more of its calls failed open."
value = 20
min = 0

[topology.warn_p95_us]
doc = "A client is `warn` when its sampled p95 latency reaches this many microseconds."
value = 20000
min = 0

[topology.bad_p95_us]
doc = "A client is `bad` when its sampled p95 latency reaches this many microseconds."
value = 100000
min = 0

[topology.warn_store_error_pct]
doc = "A store is `warn` when this percent or more of its operations failed."
value = 1
min = 0

[topology.bad_store_error_pct]
doc = "A store is `bad` when this percent or more of its operations failed."
value = 10
min = 0

[topology.warn_queue_depth]
doc = "The worker pool is `warn` when this many connections wait in the queue."
value = 4
min = 0

[topology.bad_queue_depth]
doc = "The worker pool is `bad` when this many connections wait in the queue."
value = 12
min = 0

[topology.state_ok]
doc = "Health word of a node that is fine."
value = "ok"

[topology.state_warn]
doc = "Health word of a node that is degraded."
value = "warn"

[topology.state_bad]
doc = "Health word of a node that is failing."
value = "bad"

[topology.kind_client]
doc = "Node kind of a hook client (one per session)."
value = "client"

[topology.kind_engine]
doc = "Node kind of the engine daemon."
value = "engine"

[topology.kind_store]
doc = "Node kind of a file, database or transcript store."
value = "store"

[topology.kind_subsystem]
doc = "Node kind of a daemon thread group (a worker, a watcher, the scheduler)."
value = "subsystem"

[topology.label_engine]
doc = "Label of the engine node."
value = "engine"

[topology.label_workers]
doc = "Label of the request worker pool node."
value = "workers"

[topology.label_unknown_client]
doc = "Client name used for a call that named no session."
value = "unknown"

[topology.label_unnamed_thread]
doc = "Subsystem name used for a thread that has no name."
value = "unnamed"

[topology.label_hot_db]
doc = "Store name of the hot database."
value = "hot.db"

[topology.label_archive_db]
doc = "Store name of the archive database."
value = "archive.db"

[topology.label_transcripts]
doc = "Store name under which the transcript reads of the checks are counted."
value = "transcripts"

[topology.label_config]
doc = "Store name prefix of the config files the engine reads."
value = "config"

[topology.label_outside_state]
doc = "Prefix of a store name for a file outside the state directory; the home directory is shown as the part after it."
value = "~"

[topology.ctl_verb]
doc = "The daemon request word that returns the topology report."
value = "topology"

[topology.msg_not_running]
doc = "What `topology` says when no daemon is running (the registry lives in the daemon)."
value = "The engine daemon is not running, so there is no topology to report."

# ---- node action verbs ------------------------------------------------------------------------------------------------------

[node.feature]
doc = "The feature name every node action is audited under (the action log and the telemetry `act` event)."
value = "node_action"

[node.procs_dir]
doc = "Directory under the state directory that holds one record per managed process (pid, start stamp, executable, restart command)."
value = "procs"

[node.proc_keep_ms]
doc = "How long the record of a managed process that is gone is kept (milliseconds) before registering another process sweeps it."
value = 604800000
min = 1000

[node.watcher_name]
doc = "Name prefix of the managed-process record of a session's wake watcher (the session key follows it)."
value = "wake-watch"

[node.watcher_kind]
doc = "Kind shown for a managed wake watcher."
value = "watcher"

[node.stop_wait_ms]
doc = "How long a stop or restart waits for the process to exit after SIGTERM before it reports it still running; it never escalates to SIGKILL."
value = 3000
min = 100

[node.stop_poll_ms]
doc = "Poll interval while a stop or restart waits for the process to exit."
value = 50
min = 10

[node.progress_signal]
doc = "Signal name on a progress request put in an agent's reminder queue."
value = "progress_request"

[node.progress_text]
doc = "The reminder an agent gets when the owner requests progress from the dashboard."
value = "Progress requested from the dashboard: reply with a short status (what is done, what is running, what is blocked) before you continue."

[node.kinds]
doc = "The node kinds the `node` verb accepts."
value = ["agent", "proc", "engine"]

[node.agent_actions]
doc = "The agent actions the `node` verb accepts."
value = ["request-progress", "ping-heartbeat"]

[node.proc_actions]
doc = "The managed-process actions; `stop` and `restart` change state and need --confirm."
value = ["list", "status", "stop", "restart"]

[node.engine_actions]
doc = "The engine actions the `node` verb accepts."
value = ["reload-config"]

[node.destructive]
doc = "The actions that need an explicit --confirm, as `kind:action`."
value = ["proc:stop", "proc:restart"]

[node.flag_confirm]
doc = "The flag that confirms a destructive node action."
value = "--confirm"

[node.flag_text]
doc = "The flag that carries custom text for request-progress."
value = "--text"

[node.msg_usage]
doc = "Usage line of the `node` verb."
value = "usage: ah-engine node <agent request-progress|ping-heartbeat <session>> | <proc list|status|stop|restart [name] [--confirm]> | <engine reload-config> [--json]"

[node.msg_unknown]
doc = "Said for an unknown node kind or action."
value = "unknown node action: {what}"

[node.msg_confirm]
doc = "Said when a destructive action is run without --confirm; nothing was done."
value = "{what} changes state: run it again with --confirm. Nothing was done."

[node.msg_no_proc]
doc = "Said when the named managed process has no record."
value = "no managed process named {name}"

[node.msg_gone]
doc = "Said when the recorded process is no longer the process that was recorded (exited, or the pid was reused): nothing was signalled."
value = "{name} is not running as recorded (pid {pid}); nothing was signalled"

[node.msg_self]
doc = "Said when the target is this very process: never signalled."
value = "refusing to signal the process running this command"

[node.msg_still_running]
doc = "Said when SIGTERM was sent and the process is still alive after the wait."
value = "{name} (pid {pid}) is still running after {ms} ms; it was sent SIGTERM and not escalated"

[node.msg_no_restart]
doc = "Said when a process cannot be restarted because it recorded no restart command."
value = "{name} recorded no restart command, so it can be stopped but not restarted from here"

[node.msg_no_daemon]
doc = "Said when an action needs the daemon and none is running."
value = "the engine daemon is not running"

[node.msg_no_session]
doc = "Said when an agent action names no session."
value = "an agent action needs a session id"

[node.msg_no_env]
doc = "Said when the agent tracker has no home directory to work in."
value = "no home directory: the agent tracker cannot be reached"
