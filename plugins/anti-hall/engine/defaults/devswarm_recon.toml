value = "mesh-anchor-attended"

[devswarm_recon.reason_raced]
doc = "The reason a left row is given when it has no descriptor (archiveLeftReason)."
value = "raced-re-register"

[devswarm_recon.reason_live_descriptor]
doc = "The reason a left row with a descriptor and a live session is given (archiveLeftReason)."
value = "live-descriptor"

[devswarm_recon.reason_no_live_session]
doc = "The reason a left row with a descriptor and no live session is given (archiveLeftReason)."
value = "descriptor-no-live-session"

[devswarm_recon.reason_forward_failed]
doc = "The reason a row whose forward failed is reported as left."
value = "forward-failed"

[devswarm_recon.status_ok]
doc = "The status of a forward that completed."
value = "ok"

[devswarm_recon.status_gone]
doc = "The status of a forward whose destination is not registered."
value = "gone"

[devswarm_recon.archived_forward_prefix]
