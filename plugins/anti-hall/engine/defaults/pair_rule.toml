# R-pair (plan v3 L11, GH #589; task-id pairing: task #401, issue #595): every task is paired with the agent working on it. Check `task-pair-guard`
# (PreToolUse and PostToolUse on Agent and Task, Stop; Claude, engine-only, no Node twin). Logic: engine/logic/task-pair-guard.js. Every
# switch, number, label and text is here (D88). The task keys it reuses (owner name key, OMC step-aside, open statuses, coordinator owner)
# stay in task_guards.toml. With the switch off the facts are computed and counted (pair_rule_observed) and nothing is printed.

[pair_rule.sw]
doc = "Switch guards.pairRule (default on). On: an Agent or Task spawn without a name is denied, a named agent no open task names as owner gets an advisory, and a Stop with a live named agent that owns no open task (or an in-progress task owned by the agent's id or description instead of its launch name) is blocked. Off: the facts are only counted."
value = { section = "guards", key = "pairRule", type = "boolean", env = "ANTIHALL_PAIR_RULE", option = "", default = true }

[pair_rule.sw_by_id]
doc = "Switch guards.pairRuleByTaskId (default on, kill switch). On: an Agent or Task spawn without a name is not denied when its description starts with `#<id>` of an open task of the session's list that no other agent owns (the leading token only, a bounded linear scan within its first pair_rule.description_scan_max characters; allow only on positive proof, so an unreadable task list, an unclear reference or a task another agent owns is denied), because a named teammate's reports do not reach the coordinator and the unnamed agent is paired by that task id; the PostToolUse advisory and the Stop block treat a name shorter than pair_rule.name_min_chars as no name. Needs guards.pairRule on to print anything. Off: every unnamed spawn is denied, as before."
value = { section = "guards", key = "pairRuleByTaskId", type = "boolean", env = "ANTIHALL_PAIR_RULE_BY_TASK_ID", option = "", default = true }

[pair_rule.summary]
doc = "One-line summary of the task-pair-guard check."
value = "Pairs every task with the agent working on it: an unnamed spawn is denied unless its description names an open task id (guards.pairRuleByTaskId), an agent no task names gets an advisory, a Stop with an unpaired live agent is blocked (guards.pairRule)."

[pair_rule.guard_name]
doc = "The guard id this check answers to in skip.json and in its messages."
value = "task-pair-guard"

[pair_rule.ids_max]
doc = "Most items (agents and tasks) the Stop block lists on its visible line (fewer when they do not fit pair_rule.what_budget); the rest are counted ({more}) and all are listed in the saved details."
value = 8
min = 1

[pair_rule.what_budget]
doc = "Most characters of the Stop block's visible line (the host cuts it near 115 units) when every item fits on it."
value = 115
min = 40

[pair_rule.what_budget_more]
doc = "Most characters of the Stop block's visible line when some items are left out and the saved-details link takes room on the next line: the shown items shrink until the line with its `(+n more)` tail fits."
value = 70
min = 20

[pair_rule.name_min_chars]
doc = "Fewest characters an Agent or Task call's `name` needs to count as a name; a shorter or missing one is an unnamed spawn."
value = 2
min = 1

[pair_rule.description_scan_max]
doc = "Most characters of an unnamed spawn's description the reference scan reads (a bounded linear scan, no regex). Allow only on positive proof: a first token at or after this limit, or a digit run that reaches it, is unclear and denied."
value = 512
min = 1

[pair_rule.ref_lead_chars]
doc = "Characters the reference scan skips before the reference (ASCII white space). A no-break space, byte order mark or zero-width character is not one: a description that starts with it has no reference and is denied."
value = " \t\n\r"

[pair_rule.ref_sigil]
doc = "The character that starts a task reference in an unnamed spawn's description (`#` + digits)."
value = "#"

[pair_rule.ref_end_chars]
doc = "Characters that may follow the digits of the task reference (ASCII white space and `:`), besides the end of the whole description. Anything else (`#400a`, `#400,#401`, `#400#401`) is unclear and denied."
value = " \t\n\r:"

[pair_rule.name_max]
doc = "Most characters of an agent name or task owner shown on the visible line of a message (the saved details carry it whole)."
value = 24
min = 4

[pair_rule.tools]
doc = "The tools whose PreToolUse and PostToolUse the check reads: the ones that launch an agent."
value = ["Agent", "Task"]

[pair_rule.event_pre]
doc = "The hook event name of the spawn check (and of its counter label)."
value = "PreToolUse"

[pair_rule.event_post]
doc = "The hook event name of the advisory (and of its counter label)."
value = "PostToolUse"

[pair_rule.event_stop]
doc = "The hook event name of the turn-end block (and of its counter label)."
value = "Stop"

[pair_rule.error_re]
doc = "JavaScript regex source (case-insensitive) of a tool response string that is an error: the spawn started nothing, so there is no agent to pair. An object response is an error when is_error is true or error is a non-empty string."
value = '^\s*error\b'

[pair_rule.labels]
doc = "The text of each counter label value: results of pair_rule_observed (named, unnamed, paired_by_task_id, unnamed_no_task, unnamed_ref_unclear, unnamed_closed_task, unnamed_other_owner, unnamed_duplicate_task, unnamed_owner_unverified, unnamed_unverified, paired, unpaired, clean, agent_without_task, inexact_owner), kinds of pair_rule_fired (unnamed, unpaired, agent_without_task, inexact_owner) and reasons of pair_rule_suppressed (subagent, codex, plan_mode, stop_hook_active, omc, no_rows, liveness_unknown)."
value = { named = "named", unnamed = "unnamed", paired_by_task_id = "paired_by_task_id", unnamed_no_task = "unnamed_no_task", unnamed_ref_unclear = "unnamed_ref_unclear", unnamed_closed_task = "unnamed_closed_task", unnamed_other_owner = "unnamed_other_owner", unnamed_duplicate_task = "unnamed_duplicate_task", unnamed_owner_unverified = "unnamed_owner_unverified", unnamed_unverified = "unnamed_unverified", paired = "paired", unpaired = "unpaired", clean = "clean", agent_without_task = "agent_without_task", inexact_owner = "inexact_owner", subagent = "subagent", codex = "codex", plan_mode = "plan_mode", stop_hook_active = "stop_hook_active", omc = "omc", no_rows = "no_rows", liveness_unknown = "liveness_unknown" }

[pair_rule.msg_pre_what]
doc = "The spawn denial: what happened."
value = "this agent has no name, so its task cannot be paired with it."

[pair_rule.msg_pre_why]
doc = "The spawn denial: why (saved details)."
value = "An unnamed agent cannot be addressed by SendMessage and cannot be shown as the owner of a task."

[pair_rule.msg_pre_instead]
doc = "The spawn denial: the one step that clears it."
value = "add name: \"<short-name>\" to the Agent call (the name you will set as the task owner), then spawn again."

[pair_rule.msg_pre_why_id]
doc = "The spawn denial when guards.pairRuleByTaskId is on: why (saved details)."
value = "An unnamed agent cannot be addressed by SendMessage and cannot be shown as the owner of a task. An agent whose description names an open task (#<task id>) is paired with that task."

[pair_rule.msg_pre_instead_id]
doc = "The spawn denial when guards.pairRuleByTaskId is on: the steps that clear it (the base step plus the task id one), at most 115 characters."
value = "add name: \"<short-name>\" to the Agent call, or start the description with #<open task id>, then spawn again."

[pair_rule.msg_pre_why_owner]
doc = "The spawn denial when the description names an open task another agent owns: why (saved details). `{id}` the task id, `{owner}` its owner."
value = "An unnamed agent cannot be addressed by SendMessage and cannot be shown as the owner of a task. Task #{id} is open but owned by \"{owner}\", so it is not free to pair with a new agent."

[pair_rule.msg_pre_instead_owner]
doc = "The spawn denial when the description names an open task another agent owns: the step that clears it (names the owner and the fix; `{id}` the task id, `{owner}` its owner cut to pair_rule.name_max), at most 115 characters."
value = "#{id} is owned by \"{owner}\": TaskUpdate owner=\"\" to free it, or spawn with name: \"{owner}\"."

[pair_rule.msg_post_what]
doc = "The advisory after a named spawn that no open task names; `{name}` is the agent's name."
value = "agent \"{name}\" is running but no open task names it as owner."

[pair_rule.msg_post_why]
doc = "The advisory: why (saved details)."
value = "A task owned by the agent's name shows who works on it and the agent's live activity in the task panel."

[pair_rule.msg_post_instead]
doc = "The advisory: the step that clears it; `{name}` is the agent's name."
value = "TaskUpdate the task it works on with owner \"{name}\" (TaskCreate one first if it has none)."

[pair_rule.msg_post_instead_full]
doc = "The advisory's step when the visible line cannot show the agent's name exactly (longer than pair_rule.name_max, or with backticks, emoji or symbols the message cleaning drops): the exact name is only in the saved details, and the step points there."
value = "TaskCreate or TaskUpdate a task with owner = the exact agent name in the saved details."

[pair_rule.msg_stop_what]
doc = "The Stop block: what is unpaired; `{n}` items, `{items}` the first ones, `{more}` the tail. Kept short: see pair_rule.what_budget."
value = "{n} agent/task pairs are off: {items}{more}."

[pair_rule.msg_stop_why]
doc = "The Stop block: why (saved details)."
value = "Each task should be owned by the name of the agent working on it, so the task panel pairs them."

[pair_rule.msg_stop_instead]
doc = "The Stop block: the step that clears it, at most 115 characters (a longer one is shown as a pointer to the saved details) and about 78 so the visible line keeps its `(+n more)` tail. An agent short of a task needs a NEW task (changing the owner of a task the name already owns cannot add one); a task owned by an agent's id or description gets the launch name as owner (the listed item shows it)."
value = "TaskUpdate a task per listed agent to owner=its name (TaskCreate if none)."

[pair_rule.msg_stop_instead_full]
doc = "The Stop block's step when any listed name is shown cut or cleaned on the visible line, or is left off it (see pair_rule.msg_post_instead_full): the exact names are only in the saved details, which the message links, and the step says to use those."
value = "TaskCreate or TaskUpdate owner=the exact names in the saved details."

[pair_rule.msg_stop_instead_create]
doc = "The Stop block's step when only agents are short of a task (no task owner to correct): a missing task slot is supplied only by a NEW task, because changing the owner of a task adds none. At most 66 characters (see msg_stop_instead)."
value = "TaskCreate (not TaskUpdate) a task per agent, owner = full name."

[pair_rule.msg_stop_instead_create_full]
doc = "The create step when any listed name is shown cut or cleaned on the visible line, or is left off it (see pair_rule.msg_stop_instead_full): the exact names are only in the saved details."
value = "TaskCreate per agent, owner = exact names in the saved details."

[pair_rule.msg_stop_instead_mixed]
doc = "The Stop block's step when agents are short of a task AND tasks are owned by an agent's id or description: create for the former, correct the owner of the latter."
value = "TaskCreate per agent owning none, TaskUpdate owner of each #task."

[pair_rule.item_agent]
doc = "A visible item for a live agent that owns no open task; `{name}` is its launch name."
value = "agent \"{name}\" owns no task"

[pair_rule.item_task]
doc = "A visible item for an in-progress task owned by an agent's id or description; `{id}` the task id, `{owner}` its owner, `{name}` the agent's launch name."
value = "#{id} owner \"{owner}\" -> \"{name}\""

[pair_rule.detail_agent]
doc = "The saved-details line for a live agent that owns no open task: names the step. `{name}` is its launch name."
value = "agent \"{name}\" owns no open task: TaskUpdate the task it works on with owner=\"{name}\", or TaskCreate one and TaskUpdate it with that owner."

[pair_rule.item_agent_many]
doc = "A visible item for several live agents sharing one launch name that own fewer open tasks than there are agents: pairing is by name as a multiset (one task of the name per agent); `{name}` is the launch name, `{n}` how many of these agents have no task left."
value = "{n} agents named \"{name}\" own no task"

[pair_rule.detail_agent_many]
doc = "The saved-details line for the item_agent_many case: names the step. `{name}` is the launch name, `{n}` the agents left without a task."
value = "{n} live agents named \"{name}\" own no open task (one open task per agent): TaskCreate a task for each, then TaskUpdate it with owner=\"{name}\" (or TaskUpdate the tasks they work on)."

[pair_rule.item_agent_share]
doc = "A visible item for a launch name that owns some open tasks but fewer than it has live agents (pairing is by name as a multiset, one open task of the name per agent): only a NEW task clears it, because setting the owner of a task the name already owns adds none. `{name}` is the launch name, `{n}` how many of its agents have no task left."
value = "{n} of the agents named \"{name}\" own no task"

[pair_rule.detail_agent_share]
doc = "The saved-details line for the item_agent_share case: names the step. `{name}` is the launch name, `{n}` the agents left without a task, `{agents}` the live agents of that name, `{owned}` the open tasks it already owns."
value = "{n} of the {agents} live agents called \"{name}\" own no open task ({owned} open tasks already carry that owner, one per agent is needed): TaskCreate a task for each, then TaskUpdate it with owner=\"{name}\"."

[pair_rule.detail_task]
doc = "The saved-details line for an in-progress task whose owner is an agent's id or description. `{id}`, `{owner}`, `{name}` as in item_task."
value = "task #{id} owner \"{owner}\" is agent \"{name}\": TaskUpdate #{id} owner=\"{name}\"."

[pair_rule.item_sep]
doc = "Separator between the items of the visible Stop line."
value = "; "

[pair_rule.more]
doc = "Tail of the item list when more than pair_rule.ids_max items are off; `{n}` is how many were left out."
value = " (+{n} more)"

[metric.pair_rule_observed]
doc = "Facts the R-pair check computed, by hook event and result (PreToolUse: named, unnamed; with guards.pairRuleByTaskId on an unnamed spawn is counted instead as paired_by_task_id = its description names an open task, unnamed_unverified = it names a number and the task list is unreadable (denied), unnamed_ref_unclear = its leading reference cannot be read exactly (denied), unnamed_other_owner = the task is open but another agent owns it (denied), unnamed_duplicate_task = two store files carry the same task id (denied), unnamed_owner_unverified = the task's owner field is not text (denied), unnamed_closed_task = the task is not open, unnamed_no_task = it names no existing task; PostToolUse: paired, unpaired; Stop: clean, agent_without_task, inexact_owner), counted with the switch on or off. Unnamed-spawn rate = (unnamed + unnamed_no_task + unnamed_ref_unclear + unnamed_closed_task + unnamed_other_owner + unnamed_duplicate_task + unnamed_owner_unverified + unnamed_unverified + paired_by_task_id) / all PreToolUse; unpaired-stop rate = (agent_without_task + inexact_owner) / all Stop."
value = { kind = "counter", unit = "calls", labels = ["event", "result"] }

[metric.pair_rule_fired]
doc = "Answers R-pair delivered (switch on), by hook event and kind (unnamed = a spawn denied, unpaired, agent_without_task, inexact_owner)."
value = { kind = "counter", unit = "calls", labels = ["event", "kind"] }

[metric.pair_rule_suppressed]
doc = "Calls R-pair stepped aside on, by reason (subagent, codex, plan_mode, stop_hook_active, omc, no_rows = tasks or agents unreadable, liveness_unknown = an agent whose liveness no source tells; counted per agent)."
value = { kind = "counter", unit = "calls", labels = ["reason"] }

# ---- strict task-list rules (GH #682): the session that owns the task list is held to it on every Stop, in ONE block ----------------
# Rules: `ledger` (a completed task with no Cause/Fix/Verified entry in the session history file; the engine writes the entry itself
# first, so only an entry it could not write is listed), `owner` (an in-progress task with no owner, or whose owner is not a live agent),
# `blocked_on` (a pending task with no metadata.blockedOn), `agent_task` (a live named agent that owns no open task: the R-pair F2/F3
# facts above). Each rule has its own tier setting: block = the Stop is blocked, advise = a note, the Stop goes on. Only the main session
# of a Claude host is held (subagents, teammates with agent markers, Codex, plan mode, an OMC loop and a re-fired Stop step aside, as
# R-pair does); guards.pairRule off counts the facts and prints nothing. A rule PR-head check (a task text naming a stale PR head) is not
# here: the engine's GitHub poller keeps one PR per followed checkout's current branch, not the head of any PR a task names.

[pair_rule.strict_ledger_tier]
doc = "Tier of the strict rule `ledger` (guards.taskStrictLedger): a completed task of the session's list whose Cause/Fix/Verified entry is not in the session history file and could not be written by the engine. block = the Stop is blocked; advise = a note only."
value = { type = "enum", section = "guards", key = "taskStrictLedger", env = "ANTIHALL_TASK_STRICT_LEDGER", option = "", values = ["block", "advise"], default = "block" }

[pair_rule.strict_owner_tier]
doc = "Tier of the strict rule `owner` (guards.taskStrictOwner): an in-progress task with no owner, or whose owner is not a live agent (the agent tracker says it ended, or the owner names no agent of the session). A coordinator-like owner (task_guard.coordinator_owner_re) is the session itself and counts as live; an owner whose liveness no source can tell is not judged (counted as owner_unknown). block = the Stop is blocked; advise = a note only."
value = { type = "enum", section = "guards", key = "taskStrictOwner", env = "ANTIHALL_TASK_STRICT_OWNER", option = "", values = ["block", "advise"], default = "block" }

[pair_rule.strict_blocked_on_tier]
doc = "Tier of the strict rule `blocked_on` (guards.taskStrictBlockedOn): a pending task with no metadata.blockedOn (a task waiting on open tasks through blockedBy also passes when pair_rule.strict_pending_blocked_by_ok is true). block = the Stop is blocked; advise = a note only."
value = { type = "enum", section = "guards", key = "taskStrictBlockedOn", env = "ANTIHALL_TASK_STRICT_BLOCKED_ON", option = "", values = ["block", "advise"], default = "block" }

[pair_rule.strict_agent_task_tier]
doc = "Tier of the strict rule `agent_task` (guards.taskStrictAgentTask): a live named agent that owns no open task, or an in-progress task owned by an agent's id or description instead of its launch name (the R-pair Stop facts). block = the Stop is blocked; advise = a note only."
value = { type = "enum", section = "guards", key = "taskStrictAgentTask", env = "ANTIHALL_TASK_STRICT_AGENT_TASK", option = "", values = ["block", "advise"], default = "block" }

[pair_rule.strict_auto_ledger]
doc = "Switch guards.taskAutoLedger (default on): the engine writes the Cause/Fix/Verified entry of a task itself, from its subject, description and metadata (metadata.cause, metadata.fix, metadata.verified), when a TaskUpdate marks it completed and again at each Stop for a completed task that has none, so the agent spends no tokens on it. Off: the entry is the agent's to write and the `ledger` rule lists every completed task without one."
value = { section = "guards", key = "taskAutoLedger", type = "boolean", env = "ANTIHALL_TASK_AUTO_LEDGER", option = "", default = true }

[pair_rule.strict_tiers]
doc = "Each strict rule and the setting key (in this file) that holds its tier."
value = { ledger = "pair_rule.strict_ledger_tier", owner = "pair_rule.strict_owner_tier", blocked_on = "pair_rule.strict_blocked_on_tier", agent_task = "pair_rule.strict_agent_task_tier" }

[pair_rule.strict_tier_block]
doc = "The tier value that blocks the Stop."
value = "block"

[pair_rule.strict_guard_name]
doc = "The check name the strict block shows (`<icon> <name>: <facts>`)."
value = "task list"

[pair_rule.strict_icons]
doc = "The leading icon of the strict message, by tier."
value = { block = "⛔", advise = "⚠️" }

[pair_rule.strict_msg]
doc = "The strict message, house format: `{icon} {name}: {facts}` then `Do now: {calls}`. {facts} the visible items joined by strict_item_sep plus the {more} tail, {calls} the exact calls of the visible items joined by strict_call_sep, {details} the saved-details pointer when items were left off the visible list."
value = "{icon} {name}: {facts}{more}\nDo now: {calls}{details}"

[pair_rule.strict_items_max]
doc = "Most items the strict message lists with their calls; the rest are counted ({more}) and every item with its call is in the saved details."
value = 4
min = 1

[pair_rule.strict_more]
doc = "Tail of the visible facts when items were left off; {n} how many."
value = " (+{n} more)"

[pair_rule.strict_details]
doc = "Pointer to the saved details holding every item and call, when items were left off; {path} the file."
value = " (all calls: {path})"

[pair_rule.strict_item_sep]
doc = "Separator between visible items."
value = "; "

[pair_rule.strict_call_sep]
doc = "Separator between visible calls."
value = " · "

[pair_rule.strict_item_ledger]
doc = "Item: a completed task with no ledger entry the engine could write. {id} the task id."
value = "#{id} completed, no ledger entry"

[pair_rule.strict_call_ledger]
doc = "Call that clears strict_item_ledger: write the entry (marker pair_rule.strict_ledger_marker), then delete the task. {id} the task id, {marker} the entry heading, {path} the ledger path."
value = "append \"{marker} ...\" with Cause/Fix/Verified to {path}, then TaskUpdate({taskId: \"{id}\", status: \"deleted\"})"

[pair_rule.strict_item_no_owner]
doc = "Item: an in-progress task with no owner. {id} the task id."
value = "#{id} in_progress, no owner"

[pair_rule.strict_item_dead_owner]
doc = "Item: an in-progress task whose owner is not a live agent. {id} the task id, {owner} the owner."
value = "#{id} in_progress, owner \"{owner}\" not a live agent"

[pair_rule.strict_call_owner]
doc = "Call that clears an owner item: give it the live agent working on it, or put it back to pending with what it waits on. {id} the task id, {agent} a live agent that owns no task (strict_agent_placeholder when none)."
value = "TaskUpdate({taskId: \"{id}\", owner: \"{agent}\"}) or TaskUpdate({taskId: \"{id}\", status: \"pending\", metadata: {blockedOn: \"<what it waits on>\"}})"

[pair_rule.strict_agent_placeholder]
doc = "The {agent} of strict_call_owner when no live agent is free to name."
value = "<live agent name>"

[pair_rule.strict_item_no_blocked_on]
doc = "Item: a pending task with no metadata.blockedOn. {id} the task id."
value = "#{id} pending, no blockedOn"

[pair_rule.strict_call_blocked_on]
doc = "Call that clears strict_item_no_blocked_on. {id} the task id."
value = "TaskUpdate({taskId: \"{id}\", metadata: {blockedOn: \"<what it waits on>\"}})"

[pair_rule.strict_details_id]
doc = "The id the strict message's saved details file is named after (block-details/<id>-<session>)."
value = "task-list"

[pair_rule.strict_join]
doc = "Between the R-pair text and the strict message when both are in one answer (one block per Stop)."
value = "\n\n"

[pair_rule.strict_name_max]
doc = "Most characters of an owner or agent name inside a visible item or call (a longer one is cut; the saved details hold it whole)."
value = 40
min = 8

[pair_rule.strict_pending_blocked_by_ok]
doc = "A pending task whose blockedBy names an open task of the list passes the `blocked_on` rule (the dependency is its reason)."
value = true

[pair_rule.strict_coordinator_live]
doc = "An in-progress task owned by a coordinator-like owner (task_guard.coordinator_owner_re: the session itself) passes the `owner` rule."
value = true

[pair_rule.strict_ledger_marker]
doc = "The heading of a ledger entry; the `ledger` rule finds an entry by it. {id} the task id."
value = "### Task #{id}:"

[pair_rule.strict_ledger_entry]
doc = "The ledger entry the engine appends. {id}, {subject}, and the three facts: {cause} (metadata.cause, else the subject), {fix} (metadata.fix, else the description, else the subject), {verified} (metadata.verified, else strict_ledger_unverified). Starts with the marker (strict_ledger_marker)."
value = "\n### Task #{id}: {subject}\n- Cause: {cause}\n- Fix: {fix}\n- Verified: {verified}\n"

[pair_rule.strict_ledger_meta_keys]
doc = "The task metadata keys the ledger entry reads its Cause, Fix and Verified from."
value = { cause = "cause", fix = "fix", verified = "verified" }

[pair_rule.strict_ledger_unverified]
doc = "The Verified text of an entry whose task carried no metadata.verified."
value = "not stated (the task carried no metadata.verified)"

[pair_rule.strict_ledger_field_max]
doc = "Most characters of one ledger field (one line each)."
value = 400
min = 40

[pair_rule.strict_ledger_scan_days]
doc = "How many of the newest history date directories are searched for a task's entry (a session's ledger is spread over the UTC dates it ran on)."
value = 14
min = 1

[pair_rule.strict_ledger_date_re]
doc = "Rust/JavaScript regex of a history date directory name."
value = '^\d{4}-\d{2}-\d{2}$'

[pair_rule.strict_report_components]
doc = "`defect report --component <c>` values that count as a strict rule reported wrong (metric task_strict_reported_wrong), each to its rule label."
value = { "task-strict.ledger" = "ledger", "task-strict.owner" = "owner", "task-strict.blocked_on" = "blocked_on", "task-strict.agent_task" = "agent_task", "task-pair-guard" = "agent_task", "tasklist-hygiene" = "ledger" }

[metric.task_strict_fired]
doc = "Strict task-list facts found at a Stop of the main session (counted with guards.pairRule off too), by rule (ledger, owner, blocked_on, agent_task); one per item."
value = { kind = "counter", unit = "items", labels = ["rule"] }

[metric.task_strict_blocked]
doc = "Stops the strict task-list block stopped, by rule whose block-tier items it carried (one per rule per Stop)."
value = { kind = "counter", unit = "calls", labels = ["rule"] }

[metric.task_strict_auto_ledgered]
doc = "Ledger entries the engine wrote itself, by event (PostToolUse = on TaskUpdate status=completed, Stop = a completed task found without one)."
