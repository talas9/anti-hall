# ah-engine shipped defaults for memory diagnostics (issue #21). Format: see the header of engine.toml.
#
# Two files in the state directory answer "where does the daemon's memory go": a per-request NDJSON log (resident set and allocator
# figures before and after each request) and one snapshot written when the resident-set cap trips. `ah-engine status --memory`
# prints the latest snapshot and a summary of the log. Nothing here changes what a hook decides.

[diagnostics.mem_log]
doc = "Append one NDJSON line per served request to the memory log: time, request kind, event, the checks that ran, resident set and allocator figures before and after, and the size of the transcript file. Costs a few microseconds and one small append per request; turn it off once the memory question is closed."
value = true

[diagnostics.allocator]
doc = "Allocator for the daemon the client spawns: jemalloc (default) or system. The client passes it on as AH_ENGINE_ALLOCATOR unless that is already set. Changing it requires a daemon restart."
value = "jemalloc"

[diagnostics.allocator_env]
doc = "Environment variable the client sets on the daemon it spawns to select the allocator (the daemon reads it before its first allocation). An existing value in the client's own environment wins."
value = "AH_ENGINE_ALLOCATOR"

[diagnostics.allocator_choices]
doc = "Allocator names the client accepts from diagnostics.allocator; any other value is logged and the daemon starts with jemalloc."
value = ["jemalloc", "system"]

[diagnostics.mem_log_max_bytes]
doc = "Size at which the memory log is rotated (the old file is kept once, as <name>.1, replacing the previous one), so the log never holds more than twice this."
value = 4194304
min = 4096
unit = "bytes"

[diagnostics.mem_snapshot]
doc = "When the resident-set cap trips, write one snapshot before the daemon exits: allocator figures, thread count, the interpreters and caches of every worker, and the platform's own memory map of the process."
value = true

[diagnostics.mem_snapshot_max_bytes]
doc = "Largest the snapshot file may be; the platform memory-map text is cut to fit."
value = 262144
min = 4096
unit = "bytes"

[diagnostics.mem_snapshot_wait_ms]
doc = "Longest the snapshot waits for every worker to report its interpreter and caches (a busy worker reports after its request); workers that have not reported by then are listed as missing."
value = 3000
min = 0
unit = "ms"

[diagnostics.mem_snapshot_probe]
doc = "Command whose output goes into the snapshot as the platform's memory map of the daemon (macOS: vmmap summary); the program, then its arguments with `{pid}` substituted. Where /proc/<pid>/smaps_rollup exists it is used instead. An empty list or a missing program leaves the field empty."
value = ["vmmap", "--summary", "{pid}"]

[diagnostics.mem_snapshot_probe_ms]
doc = "Longest the memory-map command may run."
value = 4000
min = 1
unit = "ms"

[diagnostics.summary_top]
doc = "Rows shown per ranking (events, checks) in the memory summary of `ah-engine status --memory`."
value = 10
min = 1

[diagnostics.summary_read_bytes]
doc = "Most of the memory log (newest part) `status --memory` reads to build its summary."
value = 8388608
min = 4096
unit = "bytes"

[diagnostics.malloc_stack_logging]
doc = "Diagnostic label for an operator-run macOS `MallocStackLogging` repro (`lite` or empty). The engine only accepts and reports it; the OS facility must be enabled in the process environment before start."
value = ""

[files.mem_log]
doc = "Per-request memory log file name (state directory)."
value = "mem.ndjson"

[files.mem_snapshot]
doc = "Cap-trip memory snapshot file name (state directory)."
value = "mem-snapshot.json"
