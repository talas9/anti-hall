# ah-engine transcript index defaults (X1, D22). Format: see the header of engine.toml.
#
# The index reads a session transcript (JSONL) incrementally and keeps a bounded set of facts the hooks ask for.
# Every cap here bounds memory per indexed transcript; a hook never sees a line, only facts.

[transcript.initial_window_bytes]
doc = "Bytes read from the end of a transcript the first time it is indexed (a long transcript is never read from the start)."
value = 1572864
min = 4096
unit = "bytes"

[transcript.max_update_bytes]
doc = "Most appended bytes one refresh reads; when more than this was appended since the last refresh the index skips ahead to the newest bytes and counts a gap instead of stalling the hook."
value = 8388608
min = 4096
unit = "bytes"

[transcript.fingerprint_bytes]
doc = "Leading bytes of the file hashed to notice a rewritten or rotated transcript."
value = 256
min = 16
max = 4096
unit = "bytes"

[transcript.recent_tool_uses]
doc = "How many of the newest tool uses of any tool the index keeps."
value = 64
min = 1

[transcript.tool_input_max_bytes]
doc = "Largest serialized tool input kept as is for a recent tool use; a larger input is replaced by null and flagged."
value = 4096
unit = "bytes"

[transcript.task_tools]
doc = "Names of the task tools whose uses and string results are kept in order, so a task list can be rebuilt from the index."
value = ["TodoWrite", "TaskCreate", "TaskUpdate", "TaskList", "TaskGet"]

[transcript.task_events]
doc = "How many of the newest task-tool uses and results the index keeps."
value = 4096
min = 1

[transcript.task_input_max_bytes]
doc = "Largest serialized task-tool input kept as is; a larger input is replaced by null and flagged."
value = 65536
unit = "bytes"

[transcript.task_result_max_bytes]
doc = "Longest task-tool result text kept; the rest is cut at a character boundary and flagged."
value = 1024
unit = "bytes"

[transcript.notifications_kept]
doc = "How many of the newest task-notification blocks the index keeps."
value = 2048
min = 1

[transcript.task_statuses_kept]
doc = "How many of the newest task_status attachments (agents re-injected by a compaction) the index keeps."
value = 256
min = 1

[transcript.assistant_text_max_bytes]
doc = "Longest last-assistant text kept; the rest is cut at a character boundary and flagged."
value = 1048576
unit = "bytes"

[transcript.prompt_max_bytes]
doc = "Longest last typed prompt kept; the rest is cut at a character boundary and flagged."
value = 65536
unit = "bytes"

[transcript.max_kinds]
doc = "Most distinct record kinds counted separately; further kinds are counted under the overflow kind."
value = 64
min = 4

[transcript.overflow_kind]
doc = "Kind name that collects records whose type is missing or not a string, and kinds beyond the limit."
value = "other"

[transcript.malformed_kind]
doc = "Kind name that counts non-empty lines that are not a JSON object."
value = "malformed"

[transcript.max_indexes]
doc = "Most transcripts the registry indexes at once; the least recently used one is dropped beyond this."
value = 32
min = 1

[transcript.idle_ttl_ms]
doc = "How long the registry keeps an index nobody asked for; a dropped index is rebuilt from the file on the next request."
value = 21600000
unit = "ms"

[transcript.terminal_statuses]
doc = "Task-notification statuses that mean an agent has ended, case-insensitive."
value = "completed failed stopped killed cancelled canceled"

[transcript.final_statuses]
doc = "Task-notification statuses the DevSwarm idle gate treats as final, case-insensitive."
value = "completed failed stopped"

[transcript.non_prompt_prefixes]
doc = "Text starts that mark a user entry as injected, not typed."
value = ["<task-notification", "<command-", "<local-command", "<system-reminder"]

[transcript.msg_io]
doc = "Printed when a transcript cannot be read; {path} and {err} are filled in."
value = "Cannot read the transcript {path}: {err}."

# ---- the text evidence of a transcript (`ah.transcript.evidence`, D88 batch 7) --------------------------------------------

[transcript.evidence_max_bytes]
doc = "Largest window `ah.transcript.evidence` reads from the end of a transcript, whatever the script asks for."
value = 8388608
min = 65536
unit = "bytes"

[transcript.evidence_max_chars]
doc = "Most characters of text `ah.transcript.evidence` returns in all; a transcript whose evidence is larger is reported as unsure."
value = 16777216
min = 65536

[transcript.evidence_cache_max_paths]
doc = "How many transcripts' evidence `ah.transcript.evidence` keeps between calls, so a Stop reads only the bytes appended since the last one (0 turns the cache off and every call reads its whole window). The least recently used is dropped first, so more concurrently stopping sessions than this each read their whole window every time."
value = 8
min = 0
unit = "count"

[transcript.evidence_cache_idle_ms]
doc = "How long a kept transcript evidence may sit unused before it is dropped."
value = 600000
min = 0
unit = "ms"

[transcript.evidence_cache_entry_max_bytes]
doc = "Largest estimated size of one kept transcript evidence; a larger one is not kept (the next call reads its window afresh)."
value = 6291456
min = 65536
unit = "bytes"

[transcript.evidence_walk_max_entries]
doc = "How many evidence walks (`ah.transcript.evidenceWalk`, the claim ledger's) are kept at once: one per script run in flight, replaced by the next walk of the same worker. The least recently used is dropped first, and a question about a dropped walk makes the check fail open."
value = 16
min = 1
unit = "count"

[transcript.evidence_walk_idle_ms]
doc = "How long a kept evidence walk may sit unused before it is dropped (it is only asked about within the script run that made it)."
value = 30000
min = 0
unit = "ms"

[transcript.msg_walk_lost]
doc = "Thrown by `ah.transcript.walkHas` / `walkNumbers` when the thread has no kept evidence walk (it was never made, or the memory registry dropped it)."
value = "No evidence walk is kept for this check run."

[transcript.msg_walk_which]
doc = "Thrown by `ah.transcript.walkHas` / `walkNumbers` for a text other than `evidence` or `withLast`; {which} is the name given."
value = "Unknown evidence walk text {which}; expected evidence or withLast."

[transcript.tasks_cache_max_paths]
doc = "How many transcript windows' task lines `ah.transcript.tasks` keeps between calls, so a Stop reads only the bytes appended since the last one (0 turns the cache off and every call reads and parses its whole window). Each window size of a transcript is one entry. The least recently used is dropped first."
value = 24
min = 0
unit = "count"

[transcript.tasks_cache_idle_ms]
doc = "How long kept task lines may sit unused before they are dropped."
value = 600000
min = 0
unit = "ms"

[transcript.tasks_cache_probe_bytes]
doc = "Bytes the first look for the newline that ends the cut first line of a window reads (a line is usually shorter); each further look reads twice as much, up to transcript.evidence_read_chunk_bytes."
value = 4096
min = 1
unit = "bytes"

[transcript.tasks_cache_entry_max_bytes]
doc = "Largest estimated size of the kept task lines of one window; a larger one is not kept (the next call reads its window afresh)."
value = 4194304
min = 65536
unit = "bytes"

[transcript.evidence_fingerprint_bytes]
doc = "Bytes hashed at each end of the kept lines to notice that a transcript was rewritten in place."
value = 4096
min = 1
unit = "bytes"

[transcript.evidence_read_chunk_bytes]
doc = "Bytes read at a time while looking for the newline that ends the cut first line of a window."
value = 65536
min = 1
unit = "bytes"

[transcript.ev_type_text]
doc = "The content block type of a text block."
value = "text"

[transcript.ev_type_tool_use]
doc = "The content block type of a tool call."
value = "tool_use"

[transcript.ev_type_tool_result]
doc = "The content block type of a tool result."
value = "tool_result"

[transcript.ev_role_user]
doc = "The role of a user transcript entry."
value = "user"

[transcript.ev_role_assistant]
doc = "The role of an assistant transcript entry."
value = "assistant"

[transcript.ev_role_attachment]
doc = "The role of a hook attachment transcript entry."
value = "attachment"

# ---- the per-session transcript store (D) ---------------------------------------------------------------------------------

[transcript.read_buf_bytes]
doc = "Size of the one fixed buffer the transcript store reads a file with. A reader never holds a window: it reads this much at a time and parses each byte once."
value = 65536
min = 4096
unit = "bytes"

[transcript.max_line_bytes]
doc = "Longest transcript line the store parses; a longer line is skipped (counted in transcript_store_oversize_lines) and a query whose window covers it answers unsure."
value = 4194304
min = 4096
unit = "bytes"

[transcript.oversize_head_bytes]
doc = "Leading bytes of a skipped oversize line that are kept (enough to classify its kind); the rest is read past and dropped."
value = 256
min = 16
unit = "bytes"

[transcript.horizon_bytes]
doc = "How far behind the end of a transcript the store keeps facts (the widest window any consumer asks for). A cold build reads this much at most; older facts are dropped, except the keyed task and agent maps."
value = 67108864
min = 65536
unit = "bytes"

[transcript.session_budget_bytes]
doc = "Bytes of facts and keyed maps one session may hold. Over it the oldest facts are evicted and `covered_from` rises; a query whose window starts before it answers unsure (counted in transcript_store_partial)."
value = 2097152
min = 65536
unit = "bytes"

[transcript.global_budget_bytes]
doc = "Bytes all session stores may hold together; over it the least recently used sessions are evicted (their snapshot is written first)."
value = 25165824
min = 65536
unit = "bytes"

[transcript.wait_ms]
doc = "How long a request waits for another request's refresh of the same session, or for a cold-build permit, before it answers unsure instead of reading the file itself."
value = 2000
min = 1
unit = "ms"

[transcript.cold_build_permits]
doc = "Cold builds (a first touch with no usable snapshot, or a rebuild after a rewrite) that may run at once in the whole process, so sessions that start together share one read buffer and never hold N windows."
value = 1
min = 1
unit = "count"

[transcript.fact_fixed_bytes]
doc = "Bytes charged to the budgets for every fact on top of its strings and JSON values (the record itself)."
value = 96
min = 0
unit = "bytes"

[transcript.fact_text_max_bytes]
doc = "Longest assistant text a stored fact keeps; the rest is cut at a character boundary and flagged. A reader that needs a whole long reply streams the file instead."
value = 32768
min = 256
unit = "bytes"

[transcript.task_map_max]
doc = "Most tasks the keyed task map holds (subject, status, owner, blocked-by). It outlives the horizon, which is what lets the store replace a long backward walk for task subjects; the oldest-inserted task goes first."
value = 1024
min = 1
unit = "count"

[transcript.agent_map_max]
doc = "Most agents the keyed agent map holds (launch offset, terminal or not). It outlives the horizon; the oldest-inserted agent goes first."
value = 256
min = 1
unit = "count"

[transcript.task_ids_max]
doc = "Most task-tool use ids remembered, so a tool result can be recognised as a task tool's result."
value = 2048
min = 1
unit = "count"

[transcript.oversize_kept]
doc = "Most skipped-line offsets remembered per session; past it the oldest is forgotten and `covered_from` rises past it."
value = 64
min = 1
unit = "count"

[transcript.tail_probe_bytes]
doc = "Bytes hashed just before a session's offset to notice an in-place rewrite that keeps the start of the file."
value = 64
min = 8
max = 4096
unit = "bytes"

[transcript.agent_tools]
doc = "Names of the tools that launch an agent; a use of one is recorded in the keyed agent map under its tool-use id."
value = ["Agent", "Task"]

[transcript.task_create_tool]
doc = "Name of the tool that creates a task; its result carries the new task's id."
value = "TaskCreate"

[transcript.task_created_re]
doc = "Regular expression whose first group is the task id in a create result."
value = "Task #(\\d+) created"

[transcript.snapshot_dir]
doc = "Directory under the state directory that holds the restart snapshots of the session stores."
value = "tstore"

[transcript.snapshot_ext]
doc = "File extension of a session store snapshot."
value = ".json"

[transcript.snapshot_max_bytes]
doc = "Largest snapshot written or loaded; a session over it is not saved and costs one cold build after a restart."
value = 4194304
min = 4096
unit = "bytes"

[transcript.snapshot_version]
doc = "Version of the snapshot format; a snapshot of another version is ignored."
value = 1
min = 1

[transcript.unsure_busy]
doc = "Short word for a question left unsure because another request held the session or a cold build was running."
value = "busy"

[transcript.unsure_missing]
doc = "Short word for a question left unsure because the transcript is missing or empty."
value = "missing"

[transcript.unsure_io]
doc = "Short word for a question left unsure because the transcript could not be read."
value = "io"

[transcript.unsure_partial]
doc = "Short word for a question left unsure because the window starts before what the store still holds or covers a skipped line."
value = "partial"

[transcript.msg_unsure]
doc = "Printed when a transcript question is left unsure; {why} is one of the transcript.unsure_* words."
value = "The transcript store cannot answer ({why}); the caller defers."

[transcript.stamp_prefix]
doc = "Prefix of the settings whose values stamp a restart snapshot: a snapshot is used only when none of them changed since it was written."
value = "transcript."
# ---- bounded transcript reads (transcript::scan, T-3 spike fix) ----

[transcript.scan_peak_budget_bytes]
doc = "The most the daemon's heap may rise above where it stood when four requests (two Stop, two UserPromptSubmit) read one 100 MB and one 300 MB transcript at once, the per-session state that stays (the walk of the agent scan, the evidence and task lines) included. An end-to-end guard (tests/it/transcript_scan_peak.rs), not a runtime limit; measured 2026-11 at 5-12 MB. The per-reader gate that fails on the old whole-window reads is transcript.reader_peak_budget_bytes."
value = 16777216
min = 1048576
unit = "bytes"

[transcript.reader_peak_budget_bytes]
doc = "The most one transcript reader may hold at once while it reads a window of 16 MiB or more: a block (transcript.read_block_bytes) plus the line being assembled, not the window. A test gate (tests/transcript_scan_blocks.rs), not a runtime limit."
value = 2097152
min = 262144
unit = "bytes"

[transcript.read_block_bytes]
doc = "Bytes a transcript reader holds at once (transcript::scan). A window of the transcript, of any size, is read in blocks of this size and folded into a small state line by line, so the heap a read raises is one block plus the one line being assembled, never the window. Measured 2026-11: readers that held a whole 12-64 MiB window raised the heap 40-90 MB for half a second when a few requests read one 300 MB transcript, enough to pass the RSS cap."
value = 262144
min = 4096
unit = "bytes"

[transcript.max_concurrent_scans]
doc = "Most transcript windows being read in the daemon at once. The turn bounds concurrency only and never changes an answer: a request that gets no turn before its own deadline or transcript.scan_wait_max_ms reads anyway, without one, and is counted in transcript_scan_turn_bypassed; one that waited is counted in transcript_scan_waits. 0 turns the bound off."
value = 1
min = 0
unit = "scans"

[transcript.scan_wait_max_ms]
doc = "Longest a request waits for its turn at reading a transcript window (also cut at the request's own deadline)."
value = 1500
min = 0
unit = "ms"
