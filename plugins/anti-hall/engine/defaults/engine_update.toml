# ah-engine shipped defaults for `ah-engine engine-update` and the `engine_update` scheduler job (issue #140). Format: see the header of engine.toml.
#
# The engine has no network code. `engine-update` only hands its arguments to the thin client's updater (`ah-engine update`), so a
# broken engine can still be fixed with the client by hand. The updater reads its URLs, timeouts and channel names from `[updater.*]`
# in engine.toml. The scheduler job runs `engine-update --auto`: the updater then does nothing unless the setting `engine.autoUpdate`
# is `stable` or `dev`, and limits itself to one check per `updater.auto_interval_s`.

[cmd.engine-update]
doc = "Update the engine binary: runs the thin client's updater (ah-engine update) with the given arguments (--from FILE [--sha256 X] [--yes] | --channel stable|dev | --rollback | --auto | --dry-run). The engine itself does no network access."
value = { args = "--from <file> [--sha256 <x>] [--yes] | --channel <stable|dev> | --rollback | --auto [--dry-run] [--no-restart]", read_only = false, status = "implemented" }

[job.engine_update]
doc = "Automatic engine update check: runs `ah-engine engine-update --auto --json` as a subprocess. A no-op unless the setting engine.autoUpdate is stable or dev; the script limits itself to one check a day. Off when engine_update.every_ms is 0."
value = { kind = "engine", action = "engine_update", every_key = "engine_update.every_ms", jitter_ms = 600000, timeout_ms = 900000, retries = 0, backoff_ms = 60000, backoff_max_ms = 600000, cooldown_ms = 3600000, catch_up = "skip", persist = false }

[engine_update.every_ms]
doc = "How often the job starts the updater's automatic check; the script's own daily limit decides whether it does any work. 0 turns the job off."
value = 21600000
env = "AH_ENGINE_UPDATE_MS"
unit = "ms"

[engine_update.msg_no_client]
doc = "Printed when the thin client (the updater) is not installed. Placeholders: {path}."
value = "engine-update: the thin client is not installed: {path}\n  state: nothing changed - the installed engine is still active\n  next: install it with the setup skill (/anti-hall:activate)"

[engine_update.msg_spawn_failed]
doc = "Printed when the thin client cannot be started. Placeholders: {path}, {why}."
value = "engine-update: cannot start the thin client {path}: {why}\n  state: nothing changed - the installed engine is still active\n  next: run it by hand to see why: {path} update --help"
