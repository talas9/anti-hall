# The invisible-channel ratchet (GH #530, plan v2 B3; test: ah-engine/tests/it/invisible_channel.rs). A model-facing advisory that leaves
# on a channel the model cannot read is lost: the model never acts on it. The test replays every output path the dispatcher has
# (the recorded answers of the golden corpus tests/golden/<check>.jsonl through the dispatcher's own combiner, the rule engine's
# note for every event, and the health advisory merge) and fails when text lands on an invisible channel that is not listed below.
# The list is a ratchet: it may only shrink. The test also fails when a listed offender no longer offends (remove its row) and
# when a check/event pair that has no recorded advisory is not listed as unexercised (or is listed and now has one).
#
# Channels the model can read (docs/KB-claude-code-hooks.md): a block reason (exit 2 stderr, `decision: block`, a PreToolUse deny) on a
# blocking event, `additionalContext` on an event that takes it, plain stdout (exit 0) on an event where it is context
# (`dispatch.plain_context_events`). Channels it cannot read: `systemMessage` (a warning for the user), stderr on exit 0, stdout on
# exit 0 anywhere else, `additionalContext` on an event that ignores it. Reaching the model through a Stop `additionalContext`
# is the plan v2 F5 lab result (the KB marks the docs claim unresolved); C1 moves the Stop notes there.

[channel_ratchet.context_events]
doc = "Events whose hookSpecificOutput.additionalContext reaches the model (KB-claude-code-hooks.md table, additionalContext column; Stop per plan v2 F5)."
value = ["SessionStart", "UserPromptSubmit", "PreToolUse", "PostToolUse", "PostToolUseFailure", "SubagentStart", "SubagentStop", "TaskCreated", "TaskCompleted", "Stop"]

[channel_ratchet.block_events]
doc = "Events where a block reason (exit 2 stderr, decision block, a PreToolUse deny) is shown to the model."
value = ["PreToolUse", "PostToolUse", "PostToolUseFailure", "UserPromptSubmit", "Stop", "SubagentStop", "TaskCreated", "TaskCompleted"]

[channel_ratchet.offenders]
doc = "Today's offenders: text a check emits on a channel the model cannot read. One row per check, event and channel. Only ever removed from (the fix is plan v2 C1/C2); a new offender fails the test, so does a row that no longer offends."
value = [
