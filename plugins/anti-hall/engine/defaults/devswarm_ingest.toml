# ah-engine shipped defaults for the native ingest drain (lane l7b, `src/dssup/ingest`): what the Node ingest daemon
# (companion/devswarm-ingest.js, one launchd / systemd unit per project) does - the single-consumer drain of `hivecontrol workspace
# monitor` into the per-repo store - taken over by the engine so those units can be uninstalled. Format: see the header of
# engine.toml. Every key can be overridden in the `devswarm_ingest` section of settings.json. Nothing here is compiled into the binary.
#
# THE SWITCH: `devswarm_ingest.mode`. `witness` (the default) leaves the drain to the Node daemons and the engine starts nothing.
# `engine` makes the engine's daemon run one drain per project. While a Node daemon still holds a project's lock the engine waits for
# it (a live holder's lock is never taken over, so a destructive queue is never read by two consumers) and takes over as soon as the
# holder is gone. The go-live steps are in docs/AH-ENGINE.md, "DevSwarm supervisor and ingest cutover".

[devswarm_ingest.mode]
doc = "Who drains the DevSwarm native queue: witness (the Node ingest daemons do; the engine starts nothing) | engine (the engine's daemon runs one drain per project). Anything else reads as witness, so a typo never starts a second consumer. The engine never edits any settings file or any launchd / systemd unit."
value = "witness"

[devswarm_ingest.mode_words]
doc = "The words of devswarm_ingest.mode, in the order witness, engine."
value = ["witness", "engine"]

[devswarm_ingest.projects]
doc = "Extra projects to drain, as paths of a git repository separated by the character in projects_separator (any worktree of it will do). Projects with a fresh Node ingest heartbeat and the ones an earlier run remembered are drained too."
value = ""

[devswarm_ingest.projects_separator]
doc = "The character that separates paths in devswarm_ingest.projects."
value = ":"

[devswarm_ingest.remembered]
doc = "The projects the engine has drained or found, a JSON list of paths, in the engine state directory. Nothing is ever removed from it."
value = "devswarm-ingest-projects.json"

[devswarm_ingest.discover_ms]
doc = "How often the engine looks for projects it does not drain yet."
value = 60000
min = 1000
max = 86400000
unit = "ms"

[devswarm_ingest.discover_max_age_ms]
doc = "A Node ingest heartbeat written within this long names a project the Node daemon serves, so the engine serves it after the cutover."
value = 900000
min = 60000
max = 31536000000
unit = "ms"

