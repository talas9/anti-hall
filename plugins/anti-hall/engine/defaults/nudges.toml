# ah-engine shipped defaults for the nudge escalation ladder (GH #516): an advisory that keeps firing while nothing changes stops
# being advisory. Format: see the header of engine.toml. The dispatcher watches the advisories of the hooks each nudge kind lists
# (exit 0, not a block, text matching the kind's `match` list when it has one), counts at most one fire per kind per turn (Stop to
# Stop) per session, and at a Stop answers one block that names the required next action and the consequence once a kind is due:
# a `block` kind at its first fire, an `escalate` kind after `after` fires and every `every` fires after that. An `advisory` kind is
# only counted. The kind's hooks running quiet for `quiet_reset` calls in a row is the condition clearing (acted on): the count
# resets. A Stop whose payload says a Stop hook already blocked this turn (stop_hook_active) never adds a ladder block, so one
# escalation can never loop. Any internal failure (unreadable or corrupt state, a write that fails, a panic) adds nothing: the
# ladder fails open. Telemetry: one `check` event per step, hook `nudge-<kind>`, event = the step word.

[nudges.sw_enabled]
doc = "Nudge ladder on/off."
value = { section = "nudges", key = "enabled", env = "ANTIHALL_NUDGES", aliases = [], option = "", default = true }

[nudges.override_key]
doc = "The key in the nudges section of settings.json that holds the per-kind class override: an object of kind name to class word (advisory, escalate, block, off), e.g. {\"nudges\": {\"kinds\": {\"model_routing\": \"escalate\"}}}."
value = "kinds"

[nudges.section]
doc = "The settings.json section the per-kind override is read from."
value = "nudges"

[nudges.events]
doc = "Events on which the ladder counts advisories."
value = ["PreToolUse", "PostToolUse", "UserPromptSubmit", "Stop"]

[nudges.block_events]
doc = "Events whose answer may carry the ladder's block (a Stop of the main session only: a SubagentStop carries the parent's session id and would block the wrong agent)."
value = ["Stop"]

[nudges.class_words]
doc = "The class words of the severity table and of the per-kind override: advisory (counted only), escalate (block after `after` fires, then every `every`), block (P0: block at the first fire, then every `every`), off (not watched)."
value = { advisory = "advisory", escalate = "escalate", block = "block", off = "off" }

[nudges.after]
doc = "Default fires of an escalate kind before its first block (a kind's own `after` wins)."
value = 3
min = 1

[nudges.every]
doc = "Default further fires between two blocks of one kind (a kind's own `every` wins)."
value = 2
min = 1

[nudges.quiet_reset]
doc = "Default consecutive quiet runs of a kind's hooks that count as the condition cleared and reset its count (0 = quiet never resets; a kind's own `quiet_reset` wins)."
value = 2

[nudges.kinds]
doc = "The severity class table: per kind, its class word, the hook ids (dispatch table ids) whose advisories it counts, optional `match` substrings (any one in the advisory text; empty = any advisory of those hooks), optional `after`, `every`, `quiet_reset`, and `action`: the single required next action the block states. P0 kinds (block at first fire): agent cap and spawn ceiling, model routing on non-trivial work, main-thread heavy work inline. The idle-with-open-tasks P0 is already a Stop block of task-guard (idle-neglect); its advisories are counted here too."
value = { agent_cap = { class = "block", hooks = ["swarm-guard", "swarm-guard#2"], match = [], action = "stop the finished agents and keep running agents under the cap before spawning again" }, model_routing = { class = "block", hooks = ["model-routing-guard", "model-routing-guard#2"], match = [], action = "re-spawn the agent with the model the routing note names" }, orchestration_inline = { class = "block", hooks = ["coordinator-work-guard", "coordinator-work-guard:post"], match = [], quiet_reset = 0, action = "hand the heavy commands to a background agent instead of running them on the main thread" }, idle_open_tasks = { class = "block", hooks = ["task-guard"], match = [], action = "dispatch the unassigned pending tasks to agents" }, finished_agents = { class = "escalate", hooks = ["idle-agent-sweep"], match = [], action = "stop the finished agents the sweep names" }, completed_tasks = { class = "escalate", hooks = ["tasklist-hygiene:post"], match = [], quiet_reset = 1, action = "delete the completed tasks after writing the ledger entry" }, stuck_agents = { class = "escalate", hooks = ["agent-reminders"], match = [], action = "answer the agent nudge: stop, message or snooze the agent it names" } }

[nudges.hook_id]
doc = "The id the ladder's own block carries among the hook results of a call."
value = "nudge-ladder"

[nudges.system_message_field]
doc = "The hook output field whose text counts as an advisory next to additionalContext (Claude and Codex hook docs: systemMessage)."
value = "systemMessage"

[nudges.state_dir]
doc = "The directory under the state dir holding one ladder state file per session."
value = "nudge-ladder"

[nudges.state_ext]
doc = "The file name ending of a session's ladder state file."
value = ".json"

[nudges.state_max_age_days]
doc = "Ladder state files not touched for this many days are removed (sessions that ended)."
value = 7
min = 1

[nudges.headline_chars]
doc = "Most characters of the advisory's first line the block quotes as its detail (ASCII only, so the block keeps one emoji)."
value = 120

[nudges.max_chars]
doc = "Most characters of the ladder's whole block reason (several due kinds are joined with dispatch.reason_joiner and cut here)."
value = 1200

[nudges.msg_escalated]
doc = "Block reason of an escalate kind that is due. Two lines, one emoji. Placeholders: {action}, {detail}, {n} (fires without action)."
value = "⛔ Required next: {action}{detail}.\nShown {n}x with no change: every Stop stays blocked until it is done."

[nudges.msg_first_fire]
doc = "Block reason of a block (P0) kind. Two lines, one emoji. Placeholders: {action}, {detail}, {n}."
value = "⛔ Required next: {action}{detail}.\nP0 rule, blocked at first fire: the Stop stays blocked until it is done."

[nudges.msg_detail]
doc = "How the advisory's first line is quoted in a block reason (empty headline: nothing). Placeholders: {text}."
value = " (seen: {text})"

[nudges.telemetry_prefix]
doc = "Prefix of the telemetry hook name of a ladder step (the kind name follows)."
value = "nudge-"

[nudges.step_words]
doc = "Telemetry event words of the ladder steps: fired (first fire), repeated (a later fire), escalated (an escalate kind blocked), blocked (a P0 kind blocked), acted (the condition cleared), ignored (a fire after a block was shown). This is the compliance metric."
value = { fired = "fired", repeated = "repeated", escalated = "escalated", blocked = "blocked", acted = "acted", ignored = "ignored" }

[nudges.msg_fail_open]
doc = "Event-log detail when the ladder failed internally and added nothing (fail open)."
value = "nudge ladder failed open: {why}"
