# ah-engine shipped defaults for the per-hook inline caps (src/dispatch/shrink.rs): the token cut for events that re-send context at
# every start, resume and compaction. A hook's additionalContext over its cap is replaced by a one-line summary and the path of a
# file that holds the full text (nothing is truncated: every character is inline or in the file). Format: see the header of
# engine.toml. Owner rule: hook output over the host's inline cap spills to a file, it is never cut; this keeps each hook far under it.

[context_size.sw_enabled]
doc = "Master switch of the per-hook inline caps (context.shrinkInline, default on): off sends every hook's context whole, as before."
value = { section = "context", key = "shrinkInline", env = "ANTIHALL_CONTEXT_SHRINK", option = "", default = true }

[context_size.num_hook_cap]
doc = "Characters one hook's context may take inline at the events in context_size.events before it becomes a summary line plus a file (context.inlineHookChars; 0 = no per-hook cap, only the event total applies). context_size.hook_caps overrides it per hook entry."
value = { section = "context", key = "inlineHookChars", env = "ANTIHALL_CONTEXT_INLINE_HOOK", option = "", default = 1500, min = 0 }

[context_size.num_event_cap]
doc = "Characters all hooks of one event may take inline together (context.inlineEventChars; 0 = no total). Over it, the largest shrinkable contexts become a summary line plus a file until the event fits. The host's own inline cap is dispatch.context_cap; this is the lower, token-oriented budget."
value = { section = "context", key = "inlineEventChars", env = "ANTIHALL_CONTEXT_INLINE_EVENT", option = "", default = 6000, min = 0 }

[context_size.events]
doc = "The hook events whose contexts are capped: the ones that fire at every start, resume and compaction."
value = ["SessionStart"]

[context_size.never]
doc = "Dispatch entry ids (a variant suffix is ignored) whose context is never shrunk: behavioural blocks that size themselves (the verify-first protocol and orchestration rules, delivered once per session or on the first spawn) and the handover resume steps, which are the task."
value = ["verify-first-full", "verify-first-orch", "handover-resume", "engine-role-note"]

[context_size.hook_caps]
doc = "Per hook entry id, the inline cap in characters that replaces context_size.num_hook_cap (0 = no per-hook cap for that hook). The DevSwarm comms manual is reference text that the full mesh help also prints."
value = { devswarm-child-role = 1200 }

[context_size.summary_chars]
doc = "Longest summary line a shrunk context keeps inline: its first line, cut at a word end."
value = 280
min = 40
max = 2000

[context_size.ellipsis]
doc = "Appended to a summary that was cut."
value = "…"

[context_size.path_reserve]
doc = "Characters reserved for the file path in the size estimate of a shrunk context."
value = 150

[context_size.msg_ref]
doc = "What a shrunk context becomes. Placeholders: {summary} the first line, {chars} the size of the full text, {path} the file that holds it."
value = "{summary}\n[anti-hall: full text, {chars} characters, in {path} - Read it before acting on this notice.]"

[context_size.file]
doc = "File name of the full texts of one event (in dispatch.spill_dir, mode 0600, swept like the other spill files). Placeholders: {event}, {ts} (milliseconds), {pid}, {seq} (a per-process counter: the daemon dispatches on several threads)."
value = "{event}-full-{ts}-{pid}-{seq}.txt"

[context_size.section_head]
doc = "Heading before each hook's full text in that file. Placeholder: {id}."
value = "== {id} ==\n"

[context_size.msg_shrunk]
doc = "Event-log detail after contexts were replaced by summaries. Placeholders: {hooks}, {before}, {after} (characters), {path}."
value = "{hooks} hook context(s) shrunk: {before} characters became {after} inline, the full text is in {path}"
