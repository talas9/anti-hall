value = "a quick question, finishing the in-flight task the handover names, or spawning a DevSwarm workspace (it runs in its own context)."

[ctxbudget.ah_gate_override]
doc = "The gate's override line."
value = "if the user has explicitly insisted on proceeding, proceed"

[ctxbudget.ah_backstop_what]
doc = "The backstop's first line; {pct} context percent, {b} budget, {hp} handover percent."
value = "post-handover budget exceeded: context is ~{pct}%, more than {b} points past the ~{hp}% at which the handover was saved."

[ctxbudget.ah_backstop_instead]
doc = "The backstop's instructions; {skill} the handover skill, {reset} the reset commands."
value = "refresh the handover now ({skill}: write the next HANDOVER-<n>.md) so it covers the work since, then offer the user to park the rest in the task list + handover and continue after {reset}. This reminder fires once per handover."

[ctxbudget.ah_parts_sep]
doc = "What joins the parts of one auto-handover context (backstop, gate, nag)."
value = "\n\n"

[ctxbudget.ah_via_stop_prefix]
doc = "The prefix the Stop-side fire records in the latch's firedVia."
value = "stop-"

[ctxbudget.stop_block_line]
doc = "The stdout line of a Stop hook that blocks with {reason} (already JSON-quoted), newline included."
value = "{\"decision\":\"block\",\"reason\":{reason}}\n"

[ctxbudget.ah_hash_tag_len]
doc = "Hex digits of the transcript path's SHA-1 that tag a session without a usable id (auto-handover-state.js sessionTag)."
value = 16

[ctxbudget.ah_via_pct]
doc = "The firedVia word of a percent crossing."
value = "pct"

[ctxbudget.ah_via_tokens]
doc = "The firedVia word of a token-ceiling crossing."
value = "tokens"

[ctxbudget.ah_heading_mark]
doc = "The Markdown mark that opens a handover section heading (followed by white space)."
value = "##"

[ctxbudget.ah_jev_id]
doc = "The Jev integration the post-handover gate consults (detached, never changes the injected text)."
value = "postHandoverGate"

[ctxbudget.ah_jev_instructions]
doc = "The question put to Jev about the user's request; {b} is the budget percent and {tok} the token estimate text."
value = "The session is past its auto-handover threshold and a handover is saved. Does the user's request below fit in the remaining post-handover budget of about {b}% of the context window{tok} \u2014 e.g. a quick question, finishing the in-flight task, or spawning a separate workspace \u2014 rather than needing a fresh context?"

[ctxbudget.ah_jev_tokens]
doc = "Token estimate appended to the Jev question; {k} is thousands of tokens."
value = " (about {k}K tokens)"

[ctxbudget.ah_jev_true]
doc = "The label of a Jev answer that the request fits."
value = "fits in the remaining budget"

[ctxbudget.ah_jev_false]
doc = "The label of a Jev answer that the request needs more than the budget."
value = "needs more than the remaining budget"

[ctxbudget.ah_jev_state_chars]
doc = "How much of the prompt, in UTF-16 units, the Jev question carries."
value = 4000
min = 100

# ---- compact-advice-guard ------------------------------------------------------------------------------------

[ctxbudget.summary_compact_advice]
doc = "One-line description of the compact-advice-guard check in the generated reference."
value = "Stop: blocks, once per declaration, a final reply that recommends compacting at low context or just after a compact (phrase analysis, latch exception and record as in Node); defers a text with a line terminator other than LF and what JavaScript could read differently (port of compact-advice-guard.js)."

[ctxbudget.set_compact_advice_guard]
doc = "The guards.compactAdviceGuard setting: block a /compact recommendation made at low context or just after a compact."
value = { section = "guards", key = "compactAdviceGuard", kind = "bool", env = "", aliases = [], option = "guards_compact_advice_guard", manifest_default = "true", default = true }
[ctxbudget.set_ca_margin]
doc = "The guards.compactAdviceMarginPct setting: context points below autoHandover.pct at which a /compact recommendation counts as low-context."
value = { section = "guards", key = "compactAdviceMarginPct", kind = "num", env = "", aliases = [], option = "", manifest_default = "", default = 10, min = 0, max = 50 }

[ctxbudget.set_ca_recent]
doc = "The guards.compactAdviceRecentTurns setting: a compact boundary within this many turns makes a /compact recommendation a block (0: off)."
value = { section = "guards", key = "compactAdviceRecentTurns", kind = "num", env = "", aliases = [], option = "guards_compact_advice_recent_turns", manifest_default = "10", default = 10, min = 0, max = 100 }

[ctxbudget.ca_guard]
doc = "The guard name of the compact-advice block."
value = "compact-advice-guard"

[ctxbudget.ca_state_dir]
doc = "The directory under the state root that holds the once-per-declaration records of the compact-advice guard."
value = "compact-advice"

[ctxbudget.ca_tokens_vias]
doc = "The firedVia words of a token-ceiling fire, whose SAFE declaration is allowed even at a low percent."
value = ["tokens", "stop-tokens"]

[ctxbudget.ca_what]
doc = "The block's first line; {phrase} is the recommendation, {why} the reasons."
value = 'your reply recommends compacting ("{phrase}") but {why}.'

[ctxbudget.ca_why_pct]
doc = "The reason when the context is known; {pct} rounded, {threshold} the auto-handover threshold."
value = "context is {pct}% (auto-handover threshold {threshold}%)"

[ctxbudget.ca_why_unknown]
doc = "The reason when the context is unknown."
value = "context % is unknown"

[ctxbudget.ca_recent_now]
doc = "The reason when a compact happened in this very turn."
value = "a compact happened earlier in this turn"

[ctxbudget.ca_recent_one]
doc = "The reason when a compact happened one turn ago ({n})."
value = "a compact happened {n} turn ago"

[ctxbudget.ca_recent_n]
doc = "The reason when a compact happened {n} turns ago."
value = "a compact happened {n} turns ago"

[ctxbudget.ca_why_join]
doc = "What joins the reasons."
value = ", and "

[ctxbudget.ca_why]
doc = "The block's Why line."
value = '"No background agents running" is necessary, not sufficient; only the auto-handover threshold directive (or genuinely high context) justifies a SAFE TO COMPACT line.'

[ctxbudget.ca_instead]
doc = "The block's instructions; {ctx} is the context clause."
value = 'retract it in one line, e.g. "RETRACT SAFE TO COMPACT: context is {ctx}; no need to compact", then continue or end the turn.'

[ctxbudget.ca_ctx_pct]
doc = "The context clause of the instructions when the percent is known ({pct} rounded)."
value = "{pct}%"

[ctxbudget.ca_ctx_low]
doc = "The context clause of the instructions when the percent is unknown."
value = "low"

[ctxbudget.advice_needs_safe]
doc = "Words that, together with the word safe, can form a compact recommendation (safe to compact, safe to /clear, safe for a reset or /new); a final text with none of the pairs holds no recommendation."
value = ["compact", "/clear", "reset", "/new"]

[ctxbudget.advice_safe_word]
doc = "The word that opens the safe-to and safe-for recommendation wordings."
value = "safe"

[ctxbudget.advice_slash_compact]
doc = "The slash command whose mention alone can be a recommendation (run /compact, a standalone /compact line)."
value = "/compact"

[ctxbudget.advice_good_word]
doc = "The word that opens the good-point-to recommendation wording."
value = "good"

[ctxbudget.advice_needs_good]
doc = "Words that, together with the word good, can form a good-point-to recommendation (good point to compact, /clear or /new)."
value = ["compact", "clear", "/new"]

[ctxbudget.advice_prefilter]
doc = "Substrings whose absence from the whole transcript tail (and from every unicode escape) proves that no assistant text of it can hold a compact recommendation."
value = ["compact", "clear", "reset", "/new"]
