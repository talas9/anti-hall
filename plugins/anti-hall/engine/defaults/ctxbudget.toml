# ---- limit-conserve-inject (hooks/limit-conserve-inject.js, hooks/limit-conserve.js) -------------------------

[ctxbudget.summary_limit_conserve]
doc = "One-line description of the limit-conserve-inject check in the generated reference."
value = "UserPromptSubmit: injects the limit-conservation directive while conservation is on or a usage bucket is at the threshold (account-switch guard and emit-dedupe as in Node), else an empty context; defers only what JavaScript could read differently (port of limit-conserve-inject.js)."

[ctxbudget.usage_cache]
doc = "The OMC usage cache file, relative to the home directory."
value = ".claude/plugins/oh-my-claudecode/.usage-cache-anthropic.json"

[ctxbudget.usage_max_stale_ms]
doc = "Snapshot age beyond which a bucket without a usable reset time counts as 0 percent (hooks/limit-conserve.js MAX_STALE_MS)."
value = 21600000
unit = "ms"

[ctxbudget.set_limit_mode]
doc = "The limitConserve.mode setting: force conservation on or off, or auto-detect from the usage cache."
value = { section = "limitConserve", key = "mode", kind = "enum", values = ["auto", "on", "off"], env = "ANTIHALL_LIMIT_CONSERVE", aliases = [], option = "limit_conserve_mode", manifest_default = "auto", default = "auto" }

[ctxbudget.set_limit_threshold]
doc = "The limitConserve.threshold setting: the usage percent at which conservation starts."
value = { section = "limitConserve", key = "threshold", kind = "num", env = "ANTIHALL_LIMIT_THRESHOLD", aliases = [], option = "limit_conserve_threshold", manifest_default = "85", default = 85, min = 1, max = 99 }

[ctxbudget.set_limit_account_check]
doc = "The limitConserve.accountCheck setting: hold a high usage reading stale after an account switch until the cache is refreshed."
value = { section = "limitConserve", key = "accountCheck", kind = "bool", env = "ANTIHALL_LIMIT_ACCOUNT_CHECK", aliases = [], option = "", manifest_default = "", default = true }

[ctxbudget.claude_json]
doc = "The host file whose top-level userID names the logged-in account, relative to the home directory (read only that field)."
value = ".claude.json"

[ctxbudget.account_state]
doc = "The account-switch state file of limit conservation, relative to the home directory (hooks/limit-conserve.js ACCOUNT_STATE_FILE)."
value = ".anti-hall/limit-conserve-account.json"

[ctxbudget.lc_account_json]
doc = "The account-switch state file body as Node writes it; {user} is the JSON-quoted account id, {mtime} the cache mtime in ms (or null)."
value = "{\"userID\":{user},\"usageCacheMtime\":{mtime}}"

[ctxbudget.json_null]
doc = "The JSON literal null."
value = "null"

[ctxbudget.lc_bucket_pct]
doc = "The usage-cache fields holding each bucket percent, in the order the trips are listed."
value = ["fiveHourPercent", "weeklyPercent", "sonnetWeeklyPercent"]

[ctxbudget.lc_bucket_resets]
doc = "The usage-cache fields holding each bucket reset time, parallel to lc_bucket_pct."
value = ["fiveHourResetsAt", "weeklyResetsAt", "sonnetWeeklyResetsAt"]

[ctxbudget.lc_bucket_trip]
doc = "The name each tripped bucket has in the directive reason, parallel to lc_bucket_pct."
value = ["5h", "weekly", "sonnetWeekly"]

[ctxbudget.lc_reason_manual]
doc = "The directive reason when the mode setting forces conservation on."
value = "manual-on"

[ctxbudget.lc_guard]
doc = "The guard name the limit-conservation directive carries (hooks/lib/block-message.js guard)."
value = "limit-conserve"

[ctxbudget.lc_dedupe_key]
doc = "The emit-dedupe key of the limit-conservation directive."
value = "limit-conserve"

[ctxbudget.lc_keepalive_turns]
doc = "The emit-dedupe keepalive of the directive: an unchanged, delivered directive is re-sent after this many turns."
value = 10
unit = "turns"

[ctxbudget.lc_what]
doc = "The first line of the directive; {reason} is the tripped buckets joined with + (or the manual reason)."
value = "limit conservation is active ({reason})."

[ctxbudget.lc_why]
doc = "The Why line of the directive."
value = "Usage is near a plan limit."

[ctxbudget.lc_instead]
doc = "The start of the Do instead line of the directive (the reset clause and the downshift text follow)."
value = "route execution to Codex (codex:codex-rescue, separate limit) and cheap Claude (Sonnet, or Haiku for trivial work, uses less of the shared Claude pool; no Claude model is a separate bucket); keep the MAIN agent on Claude and send hard reasoning to subagents; if Codex is unavailable or rate-limited degrade to Sonnet, never retry-loop (backoff)."

[ctxbudget.lc_resets_at]
doc = "The reset clause when a tripped bucket states its reset time ({at}, rounded per ctxbudget.lc_reset_round)."
value = " Defer non-urgent heavy work until reset at {at}."

[ctxbudget.lc_reset_round]
doc = "The reset time in the reset clause is rounded to the nearest `ms` (a minute) and printed as an ISO time with a whole-minute `cut` replaced by `to`: the usage API reports the reset with millisecond jitter, which would change the directive every turn and defeat emit-dedupe. A reset time that is not a date is printed as written."
value = { ms = 60000, cut = ":00.000Z", to = "Z" }

[ctxbudget.lc_resets_next]
doc = "The reset clause when no tripped bucket states a reset time."
value = " Defer non-urgent heavy work until the next reset."

[ctxbudget.lc_downshift]
doc = "The main-model downshift text at the end of the directive (limit-conserve-inject.js DOWNSHIFT_DIRECTIVE)."
value = "Main-model downshift: if the main agent is on the flagship model (Claude Opus or Codex frontier category), switch it to the cheaper 1M-context variant to use less of the shared Claude pool (a cheaper model draws it down more slowly) — Claude → Sonnet (1M context), Codex → the workhorse category's 1M-context model (resolve the slug from the live catalog; never pin one). NEVER downshift to a smaller-context model (e.g. a fast-category model may have well under 1M context) — check the catalog's context window first. Keep the flagship for delegated hard-reasoning subagents and on-demand escalation. The agent cannot self-switch models (/model is a user action) — SURFACE this recommendation to the user; under an orchestration layer that can set the model (OMC/OMX), route main accordingly."

[ctxbudget.ups_line]
doc = "The stdout line of a UserPromptSubmit hook that injects {text} (already JSON-quoted), newline included."
value = "{\"hookSpecificOutput\":{\"hookEventName\":\"UserPromptSubmit\",\"additionalContext\":{text}}}\n"

# ---- auto-handover and auto-handover-pause-nag ----------------------------------------------------------------

[ctxbudget.summary_auto_handover]
doc = "One-line description of the auto-handover check in the generated reference."
value = "UserPromptSubmit: the threshold fire, the soft advisory, the milestone nag, the latch re-arm and the post-handover gate with its backstop, latch and inferred-window writes as in Node; defers the gate on a prompt with text (Node logs a Jev decision row there) and what JavaScript could read differently (port of auto-handover.js)."

[ctxbudget.summary_pause_nag]
doc = "One-line description of the auto-handover-pause-nag check in the generated reference."
value = "Stop: the Stop-side fire with the decisive good-point line, the pause nag (step, quiet window, open tasks, recent spawns, handover freshness) and the re-arm, latch writes as in Node; defers only what JavaScript could read differently (port of auto-handover-pause-nag.js)."

