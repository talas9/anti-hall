# ah-engine shipped defaults for the agent waste sensor (`src/agents/waste`, GH #270). Format: see the header of engine.toml.
# The sensor watches every agent kind the tracker follows (main session, subagent, teammate, DevSwarm Primary and workspace,
# Codex) and scores tokens spent against outcomes achieved: waste_score = ktokens / (sum(weight * outcome) + eps), raised by
# multipliers for re-reads, repeats, idle polling, waiting and a failing streak, lowered for read-heavy roles. Over the soft
# threshold (and with enough evidence) Jev is asked for a verdict; the formula alone decides at the hard threshold when Jev is
# unavailable. Every weight, threshold, window, word and text is tuned here, never in Rust.

[agent_waste.setting]
doc = "Where the waste sensor's on/off switch is read from (agents.wasteSense, default on): off, no agent is scored, judged or flagged for waste."
value = { section = "agents", key = "wasteSense", env = "ANTIHALL_AGENT_WASTE_SENSE", aliases = [], option = "", default = true }

[agent_waste.limits]
doc = """Bounds of one evaluation. window_ms: the rolling window tokens, outcomes and calls are compared over. min_span_ms: the least history in the window before an agent is scored. min_tokens: tokens spent in the window below which nothing is wasted. cache_read_pct: how much a cache-read token counts toward the spend, in percent. eps_pct: the epsilon of the formula, in hundredths of an outcome unit (progress units are those of agent_tracker.weights: commit, step, test, file). judge_cooldown_ms: least time between two judge calls about one agent (a verdict is also trusted for twice this). max_judge_per_tick: judge calls one tracker tick may make, all agents. goal_cap: characters of the goal sent to the judge. call_cap: most recent tool calls summarised for the judge. line_cap: characters of one summarised call. fail_cap: failed commands in the window at which the failing-streak factor is full. min_calls: tool calls in the window below which the ratios are not trusted (they count as zero)."""
value = { window_ms = 1800000, min_span_ms = 600000, min_tokens = 300000, cache_read_pct = 10, eps_pct = 100, judge_cooldown_ms = 1200000, max_judge_per_tick = 2, goal_cap = 300, call_cap = 12, line_cap = 140, fail_cap = 5, min_calls = 6 }

[agent_waste.thresholds]
doc = "Score thresholds, in thousands of tokens per outcome unit after the multipliers: soft (ask the judge, warn if it confirms) and hard (act on the formula alone when the judge is unavailable, and escalate a confirmed verdict). Calibrated so the 2026-10-23 incident pattern (1.5-7.7M tokens in 30 minutes, no commit, many re-reads, queued on a lock) scores far over hard while a productive lane (about 1M tokens, 3 commits, few re-reads) scores far under soft."
value = { soft = 150, hard = 600 }

[agent_waste.multipliers]
doc = "How much each ratio (0 to 1) raises the score, in percent: factor = 1 + weight/100 * ratio. reread: Reads and Greps of something already read in the window. repeat: identical tool inputs. poll: sleep, status and listing loops. wait: time blocked on a lock or a background task. fail: failed commands in the window over fail_cap."
value = { reread = 100, repeat = 100, poll = 150, wait = 100, fail = 100 }

[agent_waste.relief]
doc = "Roles expected to read a lot spend tokens without outcome by design: an agent whose name contains one of these words (case-insensitive) has its score divided by divisor_pct/100."
value = { names = ["review", "explor", "audit", "research", "verif", "investigat", "scout"], divisor_pct = 250 }

[agent_waste.patterns]
doc = "How calls are classified (the recent-call label is `<Tool> <what>`, matched case-insensitively from its start). reads: tool names that read. poll: label prefixes that poll (sleep, status checks, listing loops). wait: label substrings that wait on a lock or a background task. wait_tools: tool names that wait for a background task."
value = { reads = ["read", "grep", "glob"], poll = ["bash sleep", "bash ls", "bash pgrep", "bash ps ", "bash gh run", "bash tail", "bash cat /tmp", "bash until", "bash while"], wait = ["lockf", "cargo-heavy", "flock", "wait "], wait_tools = ["taskoutput", "monitor"] }

[agent_waste.policy]
doc = "What a confirmed waste does, by agent kind. hard_kinds: kinds that are escalated to a hard action (the burn breaker may pause or block them); every other kind (the main session and the Primary, Codex sessions, heartbeats) is only warned and the owner is told. waste_verdicts: judge verdicts that count as waste; ok_verdicts: verdicts that clear it."
value = { hard_kinds = ["subagent", "teammate", "workspace"], waste_verdicts = ["looping", "waiting-wasting", "stuck"], ok_verdicts = ["productive", "slow-but-progressing"] }

[agent_waste.reason_fmt]
doc = "The one-line reason built from the signals. Placeholders: {tokens_k}, {outcome}, {reread}, {repeat}, {poll}, {wait}, {fail} (percentages for the ratios)."
value = "{tokens_k}k tokens for {outcome} outcome units; re-read {reread}%, repeated {repeat}%, polling {poll}%, waiting {wait}%, {fail} failed commands"

[agent_waste.words]
doc = "Words the sensor writes: the source of a decision (judge or formula), the actions (warn, hard) and the telemetry class."
value = { judge = "judge", formula = "formula", warn = "warn", hard = "hard", class = "waste", fire = "fire", judged = "judge", no_goal = "unknown" }

[agent_waste.judge_sections]
doc = "Headings-free section names of the evidence pack sent to the judge (must match the sections of evidence.cfg.agentWaste)."
value = { goal = "goal", calls = "tool_calls", outcomes = "outcomes", signals = "signals" }

[msg.agent_waste]
doc = "Advisory: an agent spends tokens without matching outcomes. Placeholders: {agent}, {kind}, {score}, {source} (judge or formula), {verdict}, {window}, {reason}."
value = "agent tracker: {kind} {agent} is spending tokens without matching outcomes (waste score {score}, {source}: {verdict}) over the last {window}: {reason}. Commit or finish a step, stop re-reading and polling, or hand the work over."
