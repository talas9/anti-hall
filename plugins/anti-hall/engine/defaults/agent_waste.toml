# ah-engine shipped defaults for the agent waste sensor (`src/agents/waste`, GH #270). Format: see the header of engine.toml.
# The sensor watches every agent kind the tracker follows (main session, subagent, teammate, DevSwarm Primary and workspace,
# Codex) and scores tokens spent against outcomes achieved: waste_score = ktokens / (sum(weight * outcome) + eps), raised by
# multipliers for re-reads, repeats, idle polling, waiting and a failing streak, lowered for read-heavy roles. Over the soft
# threshold (and with enough evidence) Jev is asked for a verdict; the formula alone decides at the hard threshold when Jev is
# unavailable. Every weight, threshold, window, word and text is tuned here, never in Rust.

[agent_waste.setting]
doc = "Where the waste sensor's on/off switch is read from (agents.wasteSense, default on): off, no agent is scored, judged or flagged for waste."
value = { section = "agents", key = "wasteSense", env = "ANTIHALL_AGENT_WASTE_SENSE", aliases = [], option = "", default = true }

[agent_waste.limits]
doc = """Bounds of one evaluation. window_ms: the rolling window tokens, outcomes and calls are compared over. min_span_ms: the least history in the window before an agent is scored. min_tokens: tokens spent in the window below which nothing is wasted. cache_read_pct: how much a cache-read token counts toward the spend, in percent. readonly_pct: percent taken off the score when every call in the window only looks (scaled by the share that does; see patterns.readonly). eps_pct: the epsilon of the formula, in hundredths of an outcome unit (progress units are those of agent_tracker.weights: commit, step, test, file). judge_cooldown_ms: least time between two judge calls about one agent (a verdict is also trusted for twice this). max_judge_per_tick: judge calls one tracker tick may make, all agents. goal_cap: characters of the goal sent to the judge. call_cap: most recent tool calls summarised for the judge. line_cap: characters of one summarised call. fail_cap: failed commands in the window at which the failing-streak factor is full. min_calls: tool calls in the window below which the ratios are not trusted (they count as zero). evidence_min_tokens: tokens spent in the window below which nothing is waste on the formula alone and no action is ever hard (a silent agent spends nothing: the tracker's hung signal covers it, not the waste sensor)."""
value = { window_ms = 1800000, min_span_ms = 600000, min_tokens = 300000, cache_read_pct = 10, eps_pct = 100, readonly_pct = 85, judge_cooldown_ms = 1200000, max_judge_per_tick = 2, goal_cap = 300, call_cap = 12, line_cap = 140, fail_cap = 5, min_calls = 6, evidence_min_tokens = 50000 }

[agent_waste.thresholds]
doc = "Score thresholds, in thousands of tokens per outcome unit after the multipliers: soft (ask the judge, warn if it confirms) and hard (act on the formula alone when the judge is unavailable, and escalate a confirmed verdict). Calibrated so the 2026-10-23 incident pattern (1.5-7.7M tokens in 30 minutes, no commit, many re-reads, queued on a lock) scores far over hard while a productive lane (about 1M tokens, 3 commits, few re-reads) scores far under soft."
value = { soft = 150, hard = 600 }

[agent_waste.multipliers]
doc = "How much each ratio (0 to 1) raises the score, in percent: factor = 1 + weight/100 * ratio. reread: Reads and Greps of something already read in the window. repeat: identical tool inputs. poll: sleep, status and listing loops. wait: time blocked on a lock or a background task. fail: failed commands in the window over fail_cap."
value = { reread = 100, repeat = 100, poll = 150, wait = 100, fail = 100 }

[agent_waste.relief]
doc = "Roles expected to read a lot spend tokens without outcome by design: an agent whose name contains one of these words (case-insensitive) has its score divided by divisor_pct/100."
value = { names = ["review", "explor", "audit", "research", "verif", "investigat", "scout"], divisor_pct = 250 }

[agent_waste.patterns]
doc = "How calls are classified (the recent-call label is `<Tool> <what>`, matched case-insensitively from its start). readonly: label prefixes of calls that only look (read, search, git history, PR and run status, listing, sampling): investigation, which lowers the score by limits.readonly_pct percent times their share of the calls. reads: tool names that read. poll: label prefixes that poll (sleep, status checks, listing loops). wait: label substrings that wait on a lock or a background task. wait_tools: tool names that wait for a background task."
value = { reads = ["read", "grep", "glob"], poll = ["bash sleep", "bash ls", "bash pgrep", "bash ps ", "bash gh run", "bash tail", "bash cat /tmp", "bash until", "bash while"], wait = ["lockf", "cargo-heavy", "flock", "wait "], wait_tools = ["taskoutput", "monitor"], readonly = ["read", "grep", "glob", "bash git log", "bash git show", "bash git diff", "bash git status", "bash git -c", "bash git branch", "bash gh pr", "bash gh run", "bash gh issue", "bash gh api", "bash ls", "bash cat ", "bash head", "bash tail", "bash sample", "bash ps ", "bash pgrep", "bash lsof", "bash wc ", "bash sqlite3"] }

[agent_waste.policy]
doc = "What a confirmed waste does, by agent kind. hard_kinds: kinds that are escalated to a hard action (the burn breaker may pause or block them); every other kind (the main session and the Primary, Codex sessions, heartbeats) is only warned and the owner is told. waste_verdicts: judge verdicts that count as waste; ok_verdicts: verdicts that clear it."
value = { hard_kinds = ["subagent", "teammate", "workspace"], waste_verdicts = ["looping", "waiting-wasting", "stuck"], ok_verdicts = ["productive", "slow-but-progressing"] }

[agent_waste.reason_fmt]
doc = "The one-line reason built from the signals. Placeholders: {tokens_k}, {outcome}, {reread}, {repeat}, {poll}, {wait}, {fail} (percentages for the ratios)."
value = "{tokens_k}k tokens for {outcome} outcome units; re-read {reread}%, repeated {repeat}%, polling {poll}%, waiting {wait}%, {fail} failed commands"

[agent_waste.words]
doc = "Words the sensor writes: the source of a decision (judge or formula), the actions (warn, hard) and the telemetry class."
value = { judge = "judge", formula = "formula", warn = "warn", hard = "hard", class = "waste", fire = "fire", judged = "judge", no_goal = "unknown", head_outcome = "head_outcome" }

[agent_waste.head]
doc = "Where a worktree's checked-out commit is read (no process is run): the HEAD file, its `ref: ` prefix, the commondir file of a linked worktree, and packed-refs. A HEAD that moved while the agent's own commit and push counts did not (the coordinator committed for it) is the agent's outcome."
value = { head = "HEAD", ref_prefix = "ref:", commondir = "commondir", packed = "packed-refs" }

[agent_waste.outcome_window]
doc = "Evidence line for the judge: the outcome units in the window. Placeholder: {outcome}."
value = "window: {outcome} outcome units"

[agent_waste.outcome_lifetime]
doc = "Evidence line for the judge: the agent's lifetime outcomes. Placeholders: {commits}, {checks}, {steps}, {files}."
value = "lifetime: {commits} commits, {checks} passing checks, {steps} steps done, {files} files edited"

[agent_waste.judge_sections]
doc = "Headings-free section names of the evidence pack sent to the judge (must match the sections of evidence.cfg.agentWaste)."
value = { goal = "goal", calls = "tool_calls", outcomes = "outcomes", signals = "signals" }

[msg.agent_waste]
doc = "Advisory: an agent spends tokens without matching outcomes. Placeholders: {agent}, {kind}, {score}, {source} (judge or formula), {verdict}, {window}, {reason}."
value = "agent tracker: {kind} {agent} is spending tokens without matching outcomes (waste score {score}, {source}: {verdict}) over the last {window}: {reason}. Commit or finish a step, stop re-reading and polling, or hand the work over."

# ---- time-based stall signals (GH #270 gap, task #185) ----------------------------------------------------------------------
# The token score cannot see a slow, cheap, stuck agent (a foreground command hung at 0% CPU, 176k tokens in 68 minutes). These
# two signals look at time instead and feed the same verdict path (Jev with context, else the formula level).

[agent_stall.limits]
doc = """Time-based no-outcome signals of the waste sensor. stalled_call_ms: one tool call (not exempt, not a background command) in flight longer than this, at near-zero CPU, is `stalled_call` (soft level; at stalled_call_ms * hard_factor_pct / 100 it is hard). check_after_ms: a call must be this old before the process table is read for it (so ordinary short calls never cost a `ps`). min_cpu_span_ms: least wall time between two CPU readings before a rate is trusted. idle_pm: CPU at or under this many thousandths of a core counts as idle. no_outcome_ms: a subagent, teammate or workspace with no outcome unit (commit, finished step, passing check, new file) for this long is `no_outcome_time`, whatever it spent (soft; hard at the same factor); no_outcome_other_ms: the same for the kinds not in agent_waste.policy.hard_kinds (main session, Primary), which are only warned. A read-heavy role (agent_waste.relief names) gets no_outcome_ms times relief.divisor_pct / 100. Both signals are 0 = off."""
value = { stalled_call_ms = 600000, hard_factor_pct = 200, check_after_ms = 120000, min_cpu_span_ms = 60000, idle_pm = 20, no_outcome_ms = 1200000, no_outcome_other_ms = 5400000 }

[agent_stall.policy]
doc = "Tool names (lower case) whose calls legitimately run long and are never a stalled_call: spawning and waiting on other agents, monitors, questions to the owner."
value = { exempt_tools = ["task", "agent", "taskoutput", "monitor", "sendmessage", "askuserquestion", "exitplanmode"] }

[agent_stall.procs]
doc = "The commands that read the process table, as argv. ps: pid, parent pid, instantaneous CPU percent, accumulated CPU time, command, no header. lsof: the open files of one path with their lock flag (fields p pid, c command, f fd, l lock), the path is appended after the `--`."
value = { ps = ["ps", "-A", "-o", "pid=,ppid=,pcpu=,time=,command="], lsof = ["lsof", "-nP", "-F", "pcfl", "--"] }

[agent_stall.texts]
doc = "Reason fragments the stall signals add to the waste reason. Placeholders: {label} (the running call), {min} (minutes), {cpu} (one of the cpu words)."
value = { stalled_fmt = "{label} has run {min} min with {cpu}", quiet_fmt = "no outcome for {min} min", cpu_idle = "near-zero CPU", cpu_unknown = "no CPU reading", stalled_word = "stalled_call", quiet_word = "no_outcome_time", signals_line = "stall signals: {reason}" }

[lock_watch.setting]
doc = "Where the lock-holder watchdog's on/off switch is read from (agents.lockWatch, default on): off, no lock file is watched."
value = { section = "agents", key = "lockWatch", env = "ANTIHALL_AGENT_LOCK_WATCH", aliases = [], option = "", default = true }

[lock_watch.term_setting]
doc = "Where the watchdog's auto-action switch is read from (agents.lockWatchTerm, default OFF): on, a holder idle for limits.term_after_ms with waiters is sent SIGTERM, by its verified pid (re-checked to still hold the lock right before), never by name."
value = { section = "agents", key = "lockWatchTerm", env = "ANTIHALL_AGENT_LOCK_TERM", aliases = [], option = "", default = false }

[lock_watch.locks]
doc = "The shared lock files to watch. A leading `~/` is the home directory; the file name may hold one `*`."
value = ["~/.anti-hall/work/cargo-heavy*.lock"]

[lock_watch.waiters]
doc = "Names (command basename) of the lock wrapper programs. A process running one of them with the lock path on its command line, that is not the holder or below it, is a waiter."
value = ["lockf", "flock"]

[lock_watch.limits]
doc = "interval_ms: least time between two watchdog passes. min_span_ms: least wall time between two CPU readings of the holder before a rate is trusted. idle_pm: the holder's process tree at or under this many thousandths of a core is idle. idle_after_ms: idle this long, with at least one process waiting on the same lock, raises the alert. renotify_ms: least time between two alerts for one holder. term_after_ms: idle this long, with waiters, before the auto-action (only when the term switch is on)."
value = { interval_ms = 60000, min_span_ms = 30000, idle_pm = 20, idle_after_ms = 300000, renotify_ms = 900000, term_after_ms = 900000 }

[lock_watch.words]
doc = "Words the watchdog writes: the telemetry class and events, the wake signal name, and the lock characters of the lsof lock field that mean a held lock."
value = { class = "lockwatch", stall = "stall", term = "term", signal = "lock_stall", held = "rRwWuU" }

[msg.lock_stall]
doc = "Wake notice to the coordinator: the process holding a shared lock is idle while others wait. Placeholders: {lock}, {pid}, {cmd}, {idle_min}, {waiters}, {term} (empty, or the auto-action sentence)."
value = "lock watch: {lock} is held by pid {pid} ({cmd}) which has used almost no CPU for {idle_min} min while {waiters} process(es) wait on it. Check whether its command is hung (a stuck foreground cargo test) and stop it by pid.{term}"

[msg.lock_stall_term]
doc = "Appended to the wake notice when the auto-action sent SIGTERM. Placeholder: {pid}."
value = " Sent SIGTERM to pid {pid}."
