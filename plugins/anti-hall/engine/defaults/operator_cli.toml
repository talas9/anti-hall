# ---- dispatch-report ------------------------------------------------------------------------------------------------------

[opcli.dr_demand_file]
doc = "The dispatch-demand metrics file, relative to the anti-hall home directory."
value = "dispatch-demand-metrics.json"

[opcli.dr_cw_metrics_file]
doc = "The coordinator-work metrics file, relative to the anti-hall home directory."
value = "coordinator-work-metrics.json"

[opcli.dr_cw_session_re]
doc = "The file name of a live coordinator-work session file."
value = "^coordinator-work-session-.+\\.json$"

[opcli.dr_json_flag]
doc = "The argument that makes `dispatch-report` print JSON."
value = "--json"

[opcli.dr_na]
doc = "How an undefined share or rate is said."
value = "n/a"

[opcli.dr_title]
doc = "`dispatch-report` heading."
value = "anti-hall dispatch report"

[opcli.dr_demand]
doc = "`dispatch-report` demand line. Placeholders: {shown}, {followed}, {ignored}, {compliance}."
value = "  dispatch demand: shown {shown} · followed {followed} · ignored {ignored} · compliance {compliance}"

[opcli.dr_idle]
doc = "`dispatch-report` idle-neglect line. Placeholder: {blocks}."
value = "  idle-neglect blocks: {blocks}"

[opcli.dr_tier_a]
doc = "`dispatch-report` dispatch-tier line 1. Placeholders: {workspace}, {workflow}, {subagent}."
value = "  jev dispatchTier: verdicts workspace {workspace} · workflow {workflow} · subagent {subagent}"

[opcli.dr_tier_b]
doc = "`dispatch-report` dispatch-tier line 2. Placeholders: {followed}, {overridden}, {rate}, {one_lane}, {escalated}, {fanned_out}, {no_fanout}."
value = "    followed {followed} · overridden {overridden} (follow rate {rate}) · subagent one-lane {one_lane} / escalated {escalated} · workflow fanned-out {fanned_out} / no-fanout {no_fanout}"

[opcli.dr_cw]
doc = "`dispatch-report` coordinator-work line. Placeholders: {nudges}, {blocks}, {mean}, {max}, {skipped}, {sessions}."
value = "  coordinator work: nudges {nudges} · blocks {blocks} · blocks/session mean {mean} max {max} · skipped would-be blocks {skipped} ({sessions} sessions)"

[opcli.dr_cw_version]
doc = "`dispatch-report` line of one plugin version. Placeholders: {version}, {sessions}, {share}, {attempted}."
value = "    {version}: sessions {sessions} · work share {share} (attempted {attempted})"

[opcli.dr_cw_baseline]
doc = "`dispatch-report` pointer to the baseline command."
value = "    baseline: ah-engine coordinator-work-baseline <transcript.jsonl> (share = as recorded (no enforcement), attempted = with enforcement)"

[opcli.dr_cw_delivery]
doc = "`dispatch-report` note on nudge delivery."
value = "    nudge delivery: live-observed on Claude Code CLI 2.1.238, not doc-confirmed; re-verify after a CLI upgrade; blocks are the enforcement"

[opcli.dr_cw_gaps]
doc = "`dispatch-report` note on the classifier's known gaps."
value = "    known gaps: obfuscated inline bodies, loose inline count-only, session-compiled binaries, mtime back-dating, managed-location scripts, gitignored build launchers and submodule scripts count, just/task, stash pop/apply (see GUIDE)"

# ---- finding-dedup ---------------------------------------------------------------------------------------------------------

[opcli.fd_id]
doc = "The Jev integration id of finding-dedup."
value = "findingDedup"

[opcli.fd_file_flag]
doc = "The argument that names the findings file (stdin otherwise)."
value = "--file"

[opcli.fd_max_pairs]
doc = "Most candidate pairs asked per run (the same pairs are dropped for the same input)."
value = 200

[opcli.fd_concurrency]
doc = "Pairs asked at the same time."
value = 4

[opcli.fd_line_window]
doc = "Two findings of the same file are candidates when their lines are at most this far apart."
value = 40

[opcli.fd_confidence_floor_pct]
doc = "The confidence (percent) a Jev answer needs for a pair to count as a duplicate, whatever confidenceThreshold the owner configured (the offline benchmark's floor)."
value = 85
min = 0
max = 100

[opcli.fd_question]
doc = "The yes/no question asked of each pair (the benchmark's exact wording): instructions, then the labels of true and false."
value = { instructions = "Do finding A and finding B describe the SAME underlying root-cause issue (even if worded differently, restated, or found at slightly different code lines)? Answer false if they are different bugs/mechanisms even if in the same area of code.", when_true = "same underlying issue", when_false = "different issues" }

[opcli.fd_unknown_file]
doc = "How the file of a finding without one is said in the text Jev judges."
value = "unknown"

[opcli.fd_state]
doc = "The text Jev judges for a pair. Placeholders: {a}, {b} (each a finding described by fd_describe)."
value = "Finding A: {a}\n\nFinding B: {b}"

[opcli.fd_dup_line]
doc = "stderr line of one Jev-confirmed pair. Placeholders: {a}, {b}, {confidence}."
value = "⚠️ anti-hall · finding-dedup: possible duplicates: {a} ~ {b} (conf {confidence})"

[opcli.fd_no_key]
doc = "stderr line when Jev is on and no key is visible to this process. Placeholder: {notice}."
value = "💡 anti-hall · finding-dedup: {notice}"

[opcli.fd_round_suffix]
doc = "How a finding that shares its id with another round is named. Placeholders: {id}, {round}."
value = "{id}@round{round}"

[opcli.fd_no_round]
doc = "The round written for a finding without one when its id is shared."
value = "-"

# ---- coordinator-work-baseline ---------------------------------------------------------------------------------------------

[opcli.cwb_from_flag]
doc = "The argument that skips the first lines of the transcript (its value is the first line used)."
value = "--from-line"

[opcli.cwb_cwd_flag]
doc = "The argument that sets the working directory of every replayed call."
value = "--cwd"

[opcli.cwb_json_flag]
doc = "The argument that makes the baseline print JSON."
value = "--json"

[opcli.cwb_prefilter]
doc = "A transcript line can matter only when it holds one of these texts (a Bash tool use or a tool result); the others are never read."
value = ["\"tool_use\"", "\"tool_result\""]

[opcli.cwb_not_found]
doc = "stderr when the transcript is not a file. Placeholder: {file}."
value = "coordinator-work-baseline: transcript not found: {file}"

[opcli.cwb_enoent]
doc = "The reason said when the transcript does not exist (the operating system's own words, as Node prints them). Placeholder: {path}."
value = "ENOENT: no such file or directory, stat '{path}'"

[opcli.cwb_error]
doc = "stderr when the transcript cannot be read. Placeholder: {error}."
value = "coordinator-work-baseline: {error}"

[opcli.cwb_line]
doc = "The baseline line. Placeholders: {calls}, {work}, {share}, {attempted}, {nudge}, {block}."
value = "coordinator work baseline: calls {calls} · work {work} · share {share} as recorded (no enforcement) · attempted share {attempted} with enforcement · would nudge {nudge} · would block {block}"

[opcli.cwb_unclassified]
doc = "stderr note when some commands could not be classified by the engine and were counted as not work. Placeholder: {count}."
value = "coordinator-work-baseline: {count} command(s) depend on something only the hook process can see (a relative path, an unreadable file) and were counted as not work"
