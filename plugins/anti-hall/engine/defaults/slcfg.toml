[slcfg.mig_dry_run]
doc = "Migration row (dry run): what would change. {path} {command}."
value = "would update the statusLine in {path} to run the engine first: {command}"

[slcfg.mig_ambiguous]
doc = "Migration row: the command appears other than once in the file's text, or the edit does not read back as intended, so the file is left exactly as it is. {path}."
value = "left the statusLine in {path} as it is (its command text is not a single plain string the migration can replace in place)"

[slcfg.mig_backup_failed]
doc = "Migration row: the one-time backup could not be made, so the file is left exactly as it is. {path}."
value = "left the statusLine in {path} as it is (its one-time backup could not be written)"

[slcfg.mig_write_failed]
doc = "Migration row: the settings file could not be written. {path}."
value = "could not write {path}; the statusLine there is unchanged"
