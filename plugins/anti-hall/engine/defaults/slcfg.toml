# ah-engine shipped defaults for the statusline helper commands (L9a): `phase` (statusline/phase.js), `install-statusline` and
# `uninstall-statusline` (the `src/ops/phase.rs` and `src/ops/slcfg.rs` modules). Format: see the header of engine.toml.
#
# The message texts are the Node scripts' own, word for word: the parity tests compare the commands' output with the scripts'
# byte for byte. A `{name}` in a text is filled in at run time.

