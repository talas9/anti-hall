# ah-engine shipped defaults for the install routine (`ah-engine update --from-local <dir> | --rollback`, src/operator/routine.rs): the ONE
# install used by the GitHub-release path (the thin client downloads and verifies, then calls it), the local-build path and
# scripts/engine-deploy.sh. Format: see the header of engine.toml. Every name, limit and text of the routine is here; nothing is compiled in.

# ---- command line ------------------------------------------------------------------------------------------------------------

[routine.flag_from_local]
doc = "Install from a local build directory (its layout: routine.*_candidates)."
value = "--from-local"

[routine.flag_engine_bin]
doc = "The engine binary to install, when it is not at one of routine.engine_candidates under the --from-local directory."
value = "--engine-bin"

[routine.flag_hook_bin]
doc = "The thin client (ah-hook) to install, when it is not at one of routine.hook_candidates."
value = "--hook-bin"

[routine.flag_tree]
doc = "The plugin tree (a directory holding routine.tree_marker) to install, when it is not at one of routine.tree_candidates."
value = "--tree"

[routine.flag_deploy]
doc = "With --rollback: the saved copy (a directory under routine.deploys_dir) to restore; default the newest."
value = "--deploy-dir"

[routine.flag_source]
doc = "Where the build came from, recorded in the install record (one of routine.sources)."
value = "--source"

[routine.flag_check]
doc = "Pre-check only: the same checks as an install, nothing changed."
value = "--check"

[routine.flag_rollback]
doc = "Restore the previous install from its saved copy (also what the automatic rollback does)."
value = "--rollback"

[routine.flag_yes]
doc = "Do it. Without it the routine prints what it would do and changes nothing."
value = "--yes"

[routine.flag_force]
doc = "Allow installing a lower version than the one running (a downgrade). An automatic rollback never needs it."
value = "--force"

[routine.flag_allow_leftovers]
doc = "Owner override: install a plugin tree although the entry-path audit lists js/sh leftovers (the override is printed)."
value = "--allow-entry-leftovers"

[routine.sources]
doc = "The values of the install record's `source`: `release` (downloaded and verified by the thin client), `local` (a local build) and `manual` (a binary put there by hand: the record does not match what is installed)."
value = ["release", "local", "manual"]

[routine.source_local]
doc = "The source recorded when --source is not given."
value = "local"

[routine.source_manual]
doc = "The source reported for an installed binary that no install record vouches for."
value = "manual"

# ---- layout of a local build directory ----------------------------------------------------------------------------------------

[routine.engine_candidates]
doc = "Where the engine binary is looked for under the --from-local directory (first existing file wins): the directory itself, then a cargo build of the repository checkout."
value = ["ah-engine", "bin/ah-engine", "ah-engine/target/release/ah-engine", "target/release/ah-engine"]

[routine.hook_candidates]
doc = "Where the thin client is looked for under the --from-local directory. Absent = the installed client stays."
value = ["ah-hook", "bin/ah-hook", "ah-launcher/target/release/ah-hook", "target/release/ah-hook"]

[routine.tree_candidates]
doc = "Where the plugin tree is looked for under the --from-local directory (a directory that holds routine.tree_marker). Absent = binaries only; the installed plugin stays."
value = ["plugin", "plugins/anti-hall", "."]

[routine.tree_marker]
doc = "The file whose presence makes a directory a plugin tree / plugin root."
value = "engine/defaults/index.toml"

[routine.defaults_dirs]
doc = "The plugin sub-directories synced first and taken whole (the engine reads them at start and on change)."
value = ["engine/defaults", "engine/defaults.pristine"]

[routine.tree_skip_dirs]
doc = "Directory names the plugin-tree sync never enters."
value = [".git", "node_modules"]

[routine.tree_skip_substrings]
doc = "A relative path containing one of these is not synced (backups, staging files, editor files)."
value = [".bak", ".deploy.", ".DS_Store"]

# ---- where it installs --------------------------------------------------------------------------------------------------------

[routine.env_roots]
doc = "Environment variable naming the plugin roots to install into (colon separated); when set it replaces the lookup below. Tests and scratch homes use it."
value = "AH_DEPLOY_ROOTS"

[routine.home_token]
doc = "The placeholder for the home directory in the paths below."
value = "{home}"

[routine.installed_json]
doc = "The harness plugin registry the cache root a hook runs from is read from."
value = "{home}/.claude/plugins/installed_plugins.json"

[routine.plugin_key]
doc = "The registry entry whose installPath is a plugin root to keep in step with the binary, besides the root the engine itself loads."
value = "anti-hall@anti-hall-engine-live"

[routine.default_roots]
doc = "More plugin roots to keep in step (used when they exist)."
value = ["{home}/.anti-hall/ah-engine-live/state/marketplace/plugins/anti-hall"]

[routine.state_file]
doc = "The install record in the state directory: {version, sha, source, time, built_at, previous}. The Updates page and `update --check --json` read it."
value = "install.json"

[routine.deploys_dir]
doc = "Directory in the state directory that holds the saved copy of every install (its manifest, the replaced files, the previous binaries)."
value = "deploys"

[routine.manifest_file]
doc = "File name of an install's manifest inside its saved-copy directory."
value = "manifest.json"

[routine.files_dir]
doc = "Sub-directory of a saved copy that holds the replaced plugin files."
value = "files"

[routine.added_dir]
doc = "Sub-directory of a saved copy where files the install had added are moved aside by a rollback (never deleted)."
value = "added"

[routine.keep_deploys]
doc = "How many saved copies of past installs are kept; older ones are removed at the end of a successful install."
value = 3
min = 1

[routine.stage_infix]
doc = "Between a file's name and the process id in the name of its staging file (renamed into place at commit)."
value = ".deploy."

[routine.tmp_ext]
doc = "Extension of the temporary file of an atomic write of the record, manifest or hold marker."
value = "tmp"

[routine.scratch_prefix]
doc = "Prefix of the routine's scratch directory under the temp dir (removed at the end)."
value = "ah-install-"

[routine.empty_toml]
doc = "Name of the empty file `config validate` is given in the pre-check."
value = "empty.toml"

# ---- timings ------------------------------------------------------------------------------------------------------------------

[routine.call_timeout_s]
doc = "Longest any one command of the routine (the new binary's version, validate, audit, the guard probe) may run."
value = 30
unit = "s"

[routine.stop_wait_s]
doc = "How long a stopped daemon gets to exit before it is stopped by its verified pid."
value = 10
unit = "s"

[routine.start_wait_s]
doc = "How long the new daemon gets to answer a ping after it was started."
value = 30
unit = "s"

[routine.settle_s]
doc = "Wait between the new daemon answering and the validation, so the first ticks, jobs and hooks have run before the log is read."
value = 5
unit = "s"

[routine.hold_ttl_s]
doc = "Lifetime of the maintenance hold (hooks start no engine while the binary is swapped); refreshed at each step. 0 = no hold. A crashed install leaves the guards off for at most this long."
value = 180
unit = "s"

[routine.detail_chars]
doc = "Characters of an event detail or error text shown in a problem line."
value = 160

# ---- commands -----------------------------------------------------------------------------------------------------------------

[routine.ctl_stop]
doc = "The control verb that asks the running daemon to exit."
value = "stop"

[routine.audit_args]
doc = "Arguments of the new binary's entry-path audit of the plugin tree being installed ({root} is the tree). Exit 0 = clean, 1 = leftovers."
value = ["audit", "entry-paths", "--root", "{root}", "--no-live"]

[routine.root_token]
doc = "The placeholder for the tree in routine.audit_args."
value = "{root}"

[routine.hook_version_args]
doc = "Arguments with which the new thin client reports its version (a smoke test: it must exit 0)."
value = ["--version"]

[routine.integrity_accept_args]
doc = "Arguments with which the installed thin client records the installed binaries as the expected ones."
value = ["integrity", "accept"]

[routine.release_check_args]
doc = "Arguments with which the thin client reports the latest GitHub release (one JSON line); it is the only part that touches the network."
value = ["update", "--check-release"]

[routine.release_check_timeout_s]
doc = "Longest `update --check --json` waits for the thin client's latest-release lookup."
value = 25
unit = "s"

# ---- validation ---------------------------------------------------------------------------------------------------------------

[routine.probe_event]
doc = "The hook event the guard probe sends to the installed thin client."
value = "PreToolUse"

[routine.probe_payload]
doc = "The probe's hook input: a force push to main, which a working guard blocks. {cwd} is the scratch directory."
value = '{"session_id":"install-probe","cwd":"{cwd}","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"git push --force origin main","description":"Push"},"tool_use_id":"toolu_install_probe"}'

[routine.probe_file]
doc = "Name of the file (in scratch) the probe input is written to."
value = "probe.json"

[routine.probe_root_env]
doc = "The variable through which the harness names the plugin root a hook runs from."
value = "CLAUDE_PLUGIN_ROOT"

[routine.probe_n]
doc = "How many probe calls in a row must all be blocked."
value = 3
min = 1

[routine.probe_block_code]
doc = "The exit code of a blocked hook call."
value = 2

[routine.bad_event_kinds]
doc = "Engine-log event kinds that, logged since the new daemon started, fail the validation (a panic, a crash, a failed start, a config error, a defaults fallback)."
value = ["panic", "thread_panic", "crash", "start_fail", "watchdog", "config_invalid", "defaults_fallback", "defaults_heal_skipped", "rss"]

[routine.job_event_kind]
doc = "The event kind a scheduler job outcome is logged under."
value = "schedule"

[routine.failed_job_codes]
doc = "The outcome codes of that kind that count as a failed job."
value = ["failed", "timeout"]

# ---- words -------------------------------------------------------------------------------------------------------------------

[routine.word_same]
doc = "Said when the new engine binary is identical to the installed one (only the plugin files change)."
value = "(same binary: only the plugin files change)"

[routine.word_up]
doc = "The daemon answered after the install."
value = "daemon up"

[routine.word_down]
doc = "The daemon did not answer after the install."
value = "daemon NOT answering"

[routine.word_no_client]
doc = "Reported as the latest-release error when no thin client is installed."
value = "no thin client installed"

[routine.no_code]
doc = "Shown for a command that did not exit (it timed out or could not start)."
value = "no exit"

[routine.why_plugin_lower]
doc = "Why an install is a downgrade: the plugin version is lower."
value = "its plugin version is lower"

[routine.why_local_running]
doc = "Why an install is refused: the running build is a local or hand-installed build of the same plugin version, which a release of that version does not replace."
