# ah-engine shipped defaults for the Command Center's Settings screens (settings, config files, checks and guards, Jev, history).
# Format: see the header of engine.toml. `ah-web` reads this file next to web.toml on every request of these screens and sends the
# page its texts and limits; the WASM page compiles in none of them.

[web.manage.describe_timeout_ms]
doc = "Longest the server waits for `describe` or `query` to answer."
value = 15000
min = 1000
max = 120000
unit = "ms"

[web.manage.write_timeout_ms]
doc = "Longest the server waits for a `config` write to answer."
value = 20000
min = 1000
max = 120000
unit = "ms"

[web.manage.history_limit]
doc = "Most history rows the History tab asks for."
value = 100
min = 10
max = 1000

[web.manage.stats_limit]
doc = "Most per-check rows read for the fire counts of the Checks tab."
value = 400
min = 50
max = 2000

[web.manage.key_max_chars]
doc = "Longest setting key or history id the server passes to the engine."
value = 120
min = 16
max = 512

[web.manage.value_max_chars]
doc = "Longest setting value the server passes to the engine."
value = 4000
min = 16
max = 65536

[web.manage.actor]
doc = "Who the history records for a write made from this page (set as the engine's history actor)."
value = "web"

[web.manage.actor_env]
doc = "The environment variable the engine reads the history actor from (`webapi.history_actor_env`)."
value = "AH_WEB_ACTOR"

[web.manage.jev_setting_prefix]
doc = "The registry key prefix of a Jev integration's mode setting (the integration id follows)."
value = "jevIntegrations."

[web.manage.jev_modes]
doc = "The modes a Jev integration can be in, in the order the page shows them."
value = ["on", "shadow", "off"]

[web.manage.safety_categories]
doc = "Registry categories whose settings always ask for a confirmation before a change."
value = ["Safety Guards"]

[web.manage.guard_categories]
doc = "Registry categories the Checks tab lists as guards (their switch is a safety switch)."
value = ["Guards", "Safety Guards"]

[web.manage.msg_bad_request]
doc = "Said when a request to these screens is malformed or names something the engine does not know."
value = "That request could not be understood."

[web.manage.msg_flag_value]
doc = "Said when a value would be read by the engine as an option."
value = "A value cannot start with two dashes."

[web.manage.msg_timeout]
doc = "Said when the engine did not answer in time."
value = "The engine did not answer in time."

[web.manage.msg_engine_failed]
doc = "Said when the engine answered something that is not a result."
value = "The engine gave no usable answer."

