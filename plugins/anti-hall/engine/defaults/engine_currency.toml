# ah-engine shipped defaults for the `engine_currency` scheduler job (issue #541): the engine reports when it lags the source checkout.
#
# Report only. The job reads two things from the checkout and one from the live plugin tree: the commit a branch ref points at,
# the git blob ids of the engine's own defaults and logic files at that commit, and the blob ids of the files the running engine
# reads. It never fetches (the engine has no network code), never reads the checkout's working tree, and never starts a deploy,
# rebuild or sync. The result is one event-log line, one counter and the `currency` field of `ah-engine status --json`. Nothing is
# persisted. The switch diagnostics.engineCurrency is on by default (kill switch); the job does nothing until `diagnostics.engineCurrencyCheckout` names a git checkout (a local path, so it has no shipped value).

[engine_currency.switch]
doc = "Engine currency job on or off (kill switch)."
value = { section = "diagnostics", key = "engineCurrency", type = "boolean", env = "ANTIHALL_ENGINE_CURRENCY", option = "", default = true }

[engine_currency.source_checkout]
doc = "Checkout the currency job compares with."
value = { section = "diagnostics", key = "engineCurrencyCheckout", type = "string", env = "ANTIHALL_ENGINE_CURRENCY_CHECKOUT", option = "", default = "" }

[engine_currency.branch]
doc = "The branch whose tip the running engine is compared with; it replaces {branch} in engine_currency.refs."
value = "dev"

[engine_currency.refs]
doc = "Refs tried in order for the branch tip. The local branch can be stale because deploys build from the remote-tracking ref, so that one comes first. {branch} is engine_currency.branch."
value = ["refs/remotes/origin/{branch}", "refs/heads/{branch}"]

[engine_currency.every_ms]
doc = "How often the currency job runs; 0 turns it off."
value = 3600000
unit = "ms"

[engine_currency.hash_paths]
doc = "Paths (relative to the repository root and to the live plugin tree) whose files are compared by git blob id."
value = ["plugins/anti-hall/engine/defaults", "plugins/anti-hall/engine/logic"]

[engine_currency.live_suffix]
doc = "What the engine's plugin root (the directory that holds engine/defaults) ends with inside a checkout-shaped tree; stripping it gives the live tree root that hash_paths are read from. A root that does not end with it is unreadable."
value = "plugins/anti-hall"

[engine_currency.sha_re]
doc = "Pattern that takes the commit out of the engine's build version (`0.2.1+d7e7b094`, `0.2.1+branch.d7e7b094-dirty`). Group 1 is the commit."
value = "[+.]([0-9a-f]{7,40})(?:-dirty)?$"

[engine_currency.git_program]
doc = "The git program the job runs (resolved through PATH)."
value = "git"

[engine_currency.git_timeout_ms]
doc = "Longest one git subprocess may run; its process group is killed at the limit and the result is unreadable."
value = 10000
min = 100
unit = "ms"

[engine_currency.poll_ms]
doc = "How often the bounded runner checks whether a git subprocess has finished."
value = 20
min = 1
unit = "ms"

[engine_currency.rev_parse_args]
doc = "Arguments of the git call that resolves a ref to a commit. {checkout} and {ref} are replaced."
value = ["-C", "{checkout}", "rev-parse", "--verify", "--quiet", "{ref}^{commit}"]

[engine_currency.ls_tree_args]
doc = "Arguments of the git call that lists the blob ids of hash_paths at a commit (the paths are appended after the last argument). {checkout} and {sha} are replaced."
value = ["-C", "{checkout}", "ls-tree", "-r", "--full-tree", "{sha}", "--"]

[engine_currency.hash_object_args]
doc = "Arguments of the git call that gives the blob id of each live file, one line per file in order (the files are appended after the last argument). {checkout} is replaced; the filters are off so the id is the id of the bytes."
value = ["-C", "{checkout}", "hash-object", "--no-filters", "--"]

[engine_currency.skip_names]
doc = "File and directory names the live walk skips (files the operating system adds that git never holds)."
value = [".DS_Store"]

[engine_currency.max_files]
doc = "Most live files read per run; a tree with more is unreadable (the walk is bounded)."
value = 2000
min = 1
unit = "files"

[engine_currency.hash_chars]
doc = "How many characters of the files digest the status field and the log line show."
value = 12
min = 4
unit = "chars"

[engine_currency.log_kind]
doc = "The event-log kind of the lines the job writes."
value = "currency"

[engine_currency.log_interval_ms]
doc = "Least time before the same result for the same pair of commits and digests is logged again."
value = 21600000
unit = "ms"

[engine_currency.result_ok]
doc = "Result label (metric.engine_currency_check): the engine is the checkout's branch tip and every compared file matches."
value = "ok"

[engine_currency.result_behind]
doc = "Result label: the branch tip is not the engine's commit."
value = "behind"

[engine_currency.result_files_differ]
doc = "Result label: the commit matches but a compared file differs."
value = "files_differ"

[engine_currency.result_unreadable]
doc = "Result label: the comparison could not be made; the reason is in engine_currency.reason_*."
value = "unreadable"

[engine_currency.reason_no_sha]
doc = "Unreadable reason: the engine's build version carries no commit."
value = "no build commit"

[engine_currency.reason_no_checkout]
doc = "Unreadable reason: the configured checkout is not a directory."
value = "checkout is not a directory"

[engine_currency.reason_no_ref]
doc = "Unreadable reason: none of engine_currency.refs resolves in the checkout (or git did not answer in time)."
value = "no branch ref resolves"

[engine_currency.reason_no_root]
doc = "Unreadable reason: the engine's plugin root is not inside a checkout-shaped tree (it does not end with engine_currency.live_suffix)."
value = "plugin root is not inside a checkout-shaped tree"

[engine_currency.reason_no_tree]
doc = "Unreadable reason: git did not list the compared paths at the branch tip."
value = "branch tip tree unreadable"

[engine_currency.reason_no_files]
doc = "Unreadable reason: the live files could not be listed or hashed (too many, none, or git failed)."
value = "live files unreadable"

[engine_currency.msg_behind]
doc = "Event-log detail when the engine lags the branch tip. Placeholders: {live}, {dev}, {files}."
value = "engine is behind the checkout: live={live} branch_tip={dev} files={files}. Rebuild and deploy the engine from the checkout to clear it."

[engine_currency.msg_files_differ]
doc = "Event-log detail when the commit matches but files differ. Placeholders: {live}, {dev}, {files}."
value = "engine files differ from the checkout at the same commit: live={live} branch_tip={dev} files={files}. Sync the plugin files from the checkout to clear it."

[engine_currency.msg_unreadable]
doc = "Event-log detail when the comparison could not be made. Placeholders: {reason}."
value = "engine currency not checked: {reason}"

[metric.engine_currency_check]
doc = "Engine currency checks (diagnostics.engineCurrency on, a checkout set), by result: ok, behind, files_differ, unreadable."
value = { kind = "counter", unit = "checks", labels = ["result"] }

[job.engine_currency]
doc = "Engine currency: compare the running engine's commit and plugin files with the branch tip of the checkout named by diagnostics.engineCurrencyCheckout and report the difference. Report only: never fetches, deploys or rebuilds. Does nothing until the checkout is set."
value = { kind = "engine", action = "engine_currency", every_key = "engine_currency.every_ms", jitter_ms = 60000, timeout_ms = 60000, retries = 0, backoff_ms = 60000, backoff_max_ms = 600000, cooldown_ms = 600000, catch_up = "skip", persist = false }
