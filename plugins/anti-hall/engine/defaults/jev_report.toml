# ah-engine shipped defaults for `ah-engine jev-report` (the port of scripts/jev-report.js): the report's thresholds, texts and file
# names. The rules that use them are the plugin script engine/logic/rules/jev-report.js. Format: see the header of engine.toml.
# The texts are the Node report's own, word for word, because the parity test compares the commands' output with the script's.

[jevrep.rules_script]
doc = "The plugin script (engine/logic/<name>.js) that holds the report rules."
value = "rules/jev-report"

[jevrep.thr_min_calls]
doc = "Below this many calls an integration is always REVIEW (not enough data)."
value = 50

[jevrep.thr_min_labeled]
doc = "Labelled outcomes (true and false positives, human and automatic) needed before KEEP or REMOVE can be given."
value = 20

[jevrep.thr_remove_min_calls]
doc = "Calls needed before REMOVE can be given."
value = 200

[jevrep.thr_remove_good_outcome_rate]
doc = "REMOVE when the good-outcome rate of changed decisions is below this fraction (a decimal number in a string)."
value = "0.60"

[jevrep.thr_remove_good_outcome_pct]
doc = "The same threshold as a whole percent, for the texts."
value = 60

[jevrep.thr_remove_failure_rate]
doc = "REMOVE when the failure rate is above this fraction (a decimal number in a string)."
value = "0.20"

[jevrep.thr_remove_failure_pct]
doc = "The same threshold as a whole percent, for the texts."
value = 20

[jevrep.thr_keep_changed_rate]
doc = "KEEP needs a changed-decision rate of at least this fraction (a decimal number in a string)."
value = "0.05"

[jevrep.thr_keep_good_outcome_rate]
doc = "KEEP needs a good-outcome rate of at least this fraction (a decimal number in a string)."
value = "0.80"

[jevrep.thr_low_yield_changed_rate]
doc = "A changed-decision rate below this fraction is noted as low yield, never a REMOVE reason (a decimal number in a string)."
value = "0.01"

[jevrep.thr_low_yield_pct]
doc = "The same threshold as a whole percent, for the texts."
value = 1

[jevrep.thr_bad_outcome_re]
doc = "Case-insensitive pattern of the outcome names that count as evidence a changed decision was wrong; every other outcome is good."
value = "^(user-override|false-positive|wrong|bad|reverted|repeat-speculation)"

[jevrep.thr_http_failure_prefix]
doc = "A baseline-only row whose reason starts with this counts as a failure."
value = "http-"

[jevrep.thr_failure_reasons]
doc = "The reasons of a baseline-only row that count as a real failure (as against off, disabled or not-applicable)."
value = ["timeout", "network-error", "no-key", "parse-error", "bad-response", "error"]

[jevrep.thr_over_ms]
doc = "A fresh call slower than this counts as slow in the overhead figures."
value = 1000
unit = "ms"

[jevrep.thr_day_ms]
doc = "Length of a day, for the windows and the rollups."
value = 86400000
unit = "ms"

[jevrep.thr_weekly_days]
doc = "The weekly scorecard always covers this many days."
value = 7

[jevrep.thr_p50]
doc = "The fraction of the median percentile (a decimal number in a string)."
value = "0.5"

[jevrep.thr_p95]
doc = "The fraction of the 95th percentile (a decimal number in a string)."
value = "0.95"

[jevrep.thr_windows]
doc = "The cost windows of the report: label to days."
value = { "24h" = 1, "7d" = 7 }

[jevrep.table_header]
doc = "The column headers of the per-integration table."
value = ["integration", "calls (fresh/cached)", "jev%", "agree% (n=distinct)", "label%", "added", "relaxed", "changed%", "good-outcome%", "outcome(jev/regex)", "p50ms", "p95ms", "cost", "suggestion"]

[jevrep.t_agree_no_signal]
doc = "The agree% cell of an integration with boolean answers but no comparison signal."
value = "n/a (no comparison signal)"

[jevrep.t_budget_exceeded]
doc = "The flag of a window whose spend passed its budget."
value = "EXCEEDED"

[jevrep.t_budget_ok]
doc = "The flag of a window whose spend is within its budget."
value = "ok"

[jevrep.t_budget_line]
doc = "One window of the budget section. Placeholders: {label}, {spent}, {budget}, {flag}."
value = "  {label}: ${spent} / ${budget} budget ({flag})"

[jevrep.t_budget_title]
doc = "Heading of the budget section."
value = "\nbudget (watch mode -- observability only, Jev is never auto-disabled):"

[jevrep.t_changed_label_only]
doc = "The changed% cell of a label-only integration. Placeholder: {n}."
value = "n/a ({n} distinct)"

[jevrep.t_cost_label]
doc = "The window heading of the real-cost section. Placeholder: {label}."
value = "  {label}:"

[jevrep.t_cost_line]
doc = "One integration of the real-cost section. Placeholders: {id}, {calls}, {total}, {perCall}, {perChanged}."
value = "    {id}: calls={calls} $total={total} {perCall} {perChanged}"

[jevrep.t_cost_none]
doc = "A window of the real-cost section with no priced row. Placeholder: {label}."
value = "  {label}: n/a — no row in this window carried a real cost (see jev-client.js's extractCostAndUsage, or set jev.json \"prices\")."

[jevrep.t_cost_per_call]
doc = "Real cost per call. Placeholder: {v}."
value = "${v}/call"

[jevrep.t_cost_per_changed]
doc = "Real cost per changed decision. Placeholder: {v}."
value = "${v}/changed"

[jevrep.t_cost_title]
doc = "Heading of the real-cost section."
value = "\nreal cost (gateway/price-table-reported, not the manual costPerCall estimate):"

[jevrep.t_cost_unset]
doc = "Said under the table when no costPerCall estimate is set."
value = "\ncost: n/a — set jev.json \"costPerCall\" (owner-supplied $/call estimate) to enable."

[jevrep.t_credit_balance]
doc = "The credit balance line. Placeholders: {balance}, {cached}."
value = "\ncredit balance (vercel): ${balance}{cached}"

[jevrep.t_credit_cached]
doc = "Marks a balance served from the cache."
value = " (cached)"

[jevrep.t_credit_failed]
doc = "The balance could not be read. Placeholder: {reason}."
value = "\ncredit balance (vercel): n/a ({reason})"

[jevrep.t_credit_low]
doc = "Said under a balance below the configured minimum. Placeholder: {min}."
value = "  LOW CREDIT: below configured minCreditUsd (${min}) -- Jev is never auto-disabled by this."

[jevrep.t_credit_no_key]
doc = "The balance needs a key this process cannot see. Placeholder: {notice}."
value = "\ncredit balance (vercel): n/a — {notice}"

[jevrep.t_credit_this_transport]
doc = "Names the transport when a transport has no balance endpoint and none is named."
value = "this transport"

[jevrep.t_credit_unsupported]
doc = "The transport has no balance endpoint. Placeholder: {transport}."
value = "\ncredit balance: not available on {transport} (no balance endpoint)"

[jevrep.t_group_cost_line]
doc = "One integration of a --by group's real cost. Placeholders: {id}, {calls}, {total}, {perCall}."
value = "    {id}: calls={calls} ${total} {perCall}"

[jevrep.t_group_cost_total]
doc = "A --by group's real cost total. Placeholder: {total}."
value = "  real cost: ${total} total"

[jevrep.t_group_title]
doc = "Heading of a --by group. Placeholders: {by}, {key}, {n}."
value = "\n=== {by}: {key} ({n} row(s)) ==="

[jevrep.t_headline]
doc = "The one-line headline of an integration. Placeholders: {id}, {changed}, {tp}, {cost}, {p50}, {suggestion}."
value = "{id}: {changed} · {tp} · {cost} · {p50} · {suggestion}"

[jevrep.t_headline_changed]
doc = "The changed part of a headline. Placeholders: {n}, {window}."
value = "{n} changed/{window}"

[jevrep.t_headline_cost]
doc = "The cost part of a headline. Placeholder: {cost}."
value = "${cost}/TP"

[jevrep.t_headline_cost_na]
doc = "The cost part of a headline with no cost."
value = "cost n/a"

[jevrep.t_headline_label_only]
doc = "The changed part of a label-only integration's headline. Placeholders: {n}, {window}."
value = "{n} distinct decisions/{window} (label-only)"

[jevrep.t_headline_p50]
doc = "The latency part of a headline. Placeholder: {ms}."
value = "p50={ms}ms"

[jevrep.t_headline_p50_na]
doc = "The latency part of a headline with no latency."
value = "p50 n/a"

[jevrep.t_headline_tp]
doc = "The true-positive part of a headline. Placeholders: {total}, {human}, {auto}."
value = "{total} TP ({human} human, {auto} auto)"

[jevrep.t_headlines_title]
doc = "Heading of the headlines section."
value = "\nheadlines:"

[jevrep.t_label_done]
doc = "Said after a label was recorded. Placeholders: {hash}, {label}."
value = "labeled {hash} as {label}"

[jevrep.t_label_has]
doc = "A hash that has a human label. Placeholder: {label}."
value = "labeled {label} (human)"

[jevrep.t_label_none]
doc = "A hash with no human label."
value = "unlabeled"

[jevrep.t_label_only_line]
doc = "One label-only integration under the table. Placeholders: {id}, {note}."
value = "  {id}: {note}"

[jevrep.t_label_only_note]
doc = "The note of a label-only integration. Placeholders: {all}, {fresh}."
value = "label-only: no boolean outcome to compare; {all} distinct decisions ({fresh} fresh)"

[jevrep.t_label_only_title]
doc = "Heading of the label-only notes."
value = "\nlabel-only integrations (changed% above reads \"n/a\" — a choice/label classifier has no boolean outcome to compare):"

[jevrep.t_label_snippet]
doc = "The stored audit snippet of a hash. Placeholder: {snippet}."
value = "snippet: {snippet}"

[jevrep.t_label_snippet_none]
doc = "A hash with no stored audit snippet."
value = "snippet: none (audit.snippets is off, or this decision predates it)"

[jevrep.t_label_usage_any]
doc = "Usage error of `label` with no hash."
value = "❌ anti-hall · jev-report: label: usage is `jev-report label <hash> [tp|fp]`"

[jevrep.t_label_usage_verdict]
doc = "Usage error of `label` with a verdict that is neither tp nor fp."
value = "❌ anti-hall · jev-report: label: usage is `jev-report label <hash> tp|fp`"

[jevrep.t_low_yield_note]
doc = "Why a REVIEW verdict is a low yield. Placeholders: {rate}, {pct}."
value = "low yield: changed {rate} < {pct}%"

[jevrep.t_na]
doc = "A value that is not known."
