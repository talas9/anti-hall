value = "prune-audit: kept {kept}, removed {removed} (older than {days}d)"

[jevrep.t_prune_usage]
doc = "Usage error of `prune-audit`."
value = "❌ anti-hall · jev-report: prune-audit: usage is `jev-report prune-audit --days N` (N > 0)"

[jevrep.t_report_none]
doc = "Said when the window holds no decision row."
value = "No jev-assist.ndjson activity found for this window."

[jevrep.t_report_title]
doc = "First line of the report. Placeholder: {at}."
value = "jev report — generated {at}"

[jevrep.t_rollup_footnote]
doc = "Footnote of the daily-rollup history."
value = "  * p50 = median of daily p50s, p95 = max of daily p95s (daily percentiles do not merge exactly)."

[jevrep.t_rollup_header]
doc = "Column header of the daily-rollup history."
value = "  id                      days   calls   fresh  changed  timeouts      cost  p50*   p95*"

[jevrep.t_rollup_title]
doc = "Heading of the daily-rollup history. Placeholders: {first}, {last}, {n}."
value = "\nOlder history from daily rollups ({first} .. {last}, {n} day(s) no longer in the raw logs):"

[jevrep.t_transports_line]
doc = "One transport row. Placeholders: {label}, {calls}, {errors}, {avg}, {fellBack}."
value = "  {label}: {calls} call(s), {errors} error(s), avg {avg}, {fellBack} fell back"

[jevrep.t_transports_title]
doc = "Heading of the transport section."
value = "\nby transport (calls that reached a vendor):"

[jevrep.t_transports_unrecorded]
doc = "Label of rows logged before transports were recorded."
value = "unrecorded (logged before transport tracking; vercel was the default, assumed)"

[jevrep.t_triage_normal]
doc = "The non-urgent triage answer time. Placeholders: {n}, {p50}, {p95}."
value = "  non-urgent: n={n}  p50={p50}  p95={p95}"

[jevrep.t_triage_title]
doc = "Heading of the triage answer-time section."
value = "\ntriage answer-time (ms, time from a labeled inbound to the next outbound reply):"

[jevrep.t_triage_urgent]
doc = "The urgent triage answer time. Placeholders: {n}, {p50}, {p95}."
value = "  urgent:     n={n}  p50={p50}  p95={p95}"

[jevrep.t_triggers_line]
doc = "One integration of the triggers section. Placeholders: {id}, {seen}, {why}, {calls}, {zero}."
value = "  {id}: triggers seen: {seen}{why}  [{calls} call(s){zero}]"

[jevrep.t_triggers_reason]
doc = "One skip reason with its count. Placeholders: {reason}, {n}."
value = "{reason} x{n}"

[jevrep.t_triggers_skipped]
doc = "The skipped part of a trigger line. Placeholders: {n}, {reasons}."
value = ", skipped {n} ({reasons})"

[jevrep.t_triggers_title]
doc = "Heading of the triggers section."
value = "\ntriggers (occurrences of a rare trigger, not calls):"

[jevrep.t_triggers_zero]
doc = "Marks a trigger that never led to a call."
value = " -- zero-call"

[jevrep.t_verdict_keep]
doc = "The verdict of an integration that earned its place."
value = "KEEP"

[jevrep.t_verdict_label_only]
doc = "The verdict of a label-only integration with no labelled outcome."
value = "REVIEW (label-only, no outcome signal yet)"

[jevrep.t_verdict_latency]
doc = "The verdict when the p95 latency is over the integration's budget."
value = "REVIEW (p95 latency exceeds budget)"

[jevrep.t_verdict_needs_labels]
doc = "The verdict with too few labelled outcomes. Placeholders: {n}, {min}."
value = "REVIEW (needs labels: {n}/{min})"

[jevrep.t_verdict_not_enough]
doc = "The verdict with too few calls. Placeholders: {calls}, {min}."
value = "REVIEW (not enough data: {calls} < {min} calls)"

[jevrep.t_verdict_remove]
doc = "The verdict of an integration with a proven bad record."
value = "REMOVE"

[jevrep.t_verdict_review]
doc = "The verdict that needs a look; every REVIEW verdict starts with this word."
value = "REVIEW"

[jevrep.t_verdict_review_note]
doc = "The REVIEW verdict with a note. Placeholder: {note}."
value = "REVIEW ({note})"

[jevrep.t_weekly_line]
doc = "One integration of the weekly scorecard. Placeholders: {id}, {mode}, {suggestion}, {reason}, {calls}."
value = "  {id} [{mode}]: {suggestion} — {reason} ({calls} calls)"

[jevrep.t_weekly_none]
doc = "Said when the weekly scorecard has no row."
value = "No jev-assist.ndjson activity in the last 7 days."

[jevrep.t_weekly_reason_calls]
doc = "The reason of a REMOVE with no named rate. Placeholder: {calls}."
value = "{calls} calls"

[jevrep.t_weekly_reason_failure]
doc = "A REMOVE reason. Placeholders: {rate}, {pct}."
value = "failure-rate {rate} > {pct}%"

[jevrep.t_weekly_reason_good]
doc = "A REMOVE reason. Placeholders: {rate}, {pct}."
value = "good-outcome {rate} < {pct}%"

[jevrep.t_weekly_reason_keep]
doc = "The reason of a KEEP. Placeholders: {changed}, {good}, {calls}."
value = "changed {changed}, good-outcome {good} over {calls} calls"

[jevrep.t_weekly_reason_no_data]
doc = "The reason of a REVIEW without a parenthesised cause."
value = "not enough data yet"

[jevrep.t_weekly_title]
doc = "First line of the weekly scorecard. Placeholder: {at}."
value = "jev weekly scorecard — generated {at} (last 7 days)"

[jevrep.t_window_exclude_project]
doc = "The excluded projects of the window line. Placeholder: {names}."
value = "exclude-project: {names}  "

[jevrep.t_window_line]
doc = "The window line. Placeholders: {since}, {until}, {excl}, {exclProject}, {inWindow}, {total}, {excluded}."
value = "window: {since} .. {until}  exclude: {excl}  {exclProject}rows: {inWindow} in window / {total} total ({excluded} excluded)"

[jevrep.t_window_log_end]
doc = "An open window end."
value = "(log end)"

[jevrep.t_window_log_start]
doc = "An open window start."
value = "(log start)"

[jevrep.t_window_none]
doc = "No excluded window."
value = "(none)"

