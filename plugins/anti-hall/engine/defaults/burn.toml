# Burn breaker (GH #270): tokens spent versus outcome. The agent tracker (src/agents/signals.rs) counts the tokens an agent spent since its
# last outcome (a commit, a finished step, a passing check, a new file) inside the waste window. Soft line: warn the agent through its
# next tool-call context and notify the coordinator's wake feed. Hard line: the `burn-breaker` check (engine/logic/burn-breaker.js,
# PreToolUse on every tool, subagents only) blocks the subagent's tool calls except commit, push, status, the restore class and its
# report; a build still in flight withholds the pause (GH #458). An outcome (also a file the shell wrote, a passing check, a live probe)
# resets the count. Every number, list, pattern and text is here (D88).

[burn.sw]
doc = "Switch agents.burnBreaker (default on): off raises no burn signal and lets the burn-breaker check allow every call."
value = { section = "agents", key = "burnBreaker", env = "ANTIHALL_BURN_BREAKER", option = "", default = true }

[burn.guard_name]
doc = "The guard id the burn-breaker check answers to in skip.json and in its messages."
value = "burn-breaker"

[burn.summary]
doc = "One-line description of the burn-breaker check in the generated reference."
value = "PreToolUse on every tool, subagents only: while the agent tracker holds the hard burn flag (tokens spent since the last commit, finished step, passing check or new file past burn.hard_tokens_no_outcome) blocks every call except commit (any message form, burn.heredoc), push, status, the restore class (burn.restore_bash_res), read-only inspection commands (grep, rg, ls, cat, head, tail, wc, git log/diff/show) and SendMessage (the report); an error while judging allows (GH #458)."

[burn.soft_tokens_no_outcome]
doc = "Soft line: tokens (cache reads weighted by agent_tracker.limits.cache_read_pct) spent since the last outcome, within agent_tracker.limits.waste_window_ms, at which the agent is warned and the coordinator notified. 0 = no soft line. Chosen from the 2026-10-23 incident (alerts of 1.5M to 7.7M per 30 minutes with no commit)."
value = 1500000

[burn.hard_tokens_no_outcome]
doc = "Hard line: tokens spent since the last outcome, within the waste window, at which the subagent's tool calls are blocked (see burn.allowed_tools and burn.allowed_bash_re). 0 = no hard line."
value = 3000000

[burn.doubt]
doc = "Classification doubt (GH #458): while a tool call of one of these classes (agent_tracker.patterns: a build waiting on or holding the build lock) is still in flight the agent waits on work, so the tracker withholds the pause marker; the hard flag and its nudge stay. max_ms: a call (or a background build task with no end notice yet) older than this no longer counts, so an interrupted call cannot withhold the pause for ever. metric/label/building: the counter, its label and the reason value it is counted under. In the breaker check an error while judging a call allows it (counted as burn_breaker_bypass kind=doubt)."
value = { classes = ["build"], metric = "burn_pause_withheld", label = "reason", building = "building", soft = "soft", max_ms = 2700000 }

[burn.soft_hold]
doc = "Soft outcomes (GH #458: a file the shell created or appended, a passing check command, a completed live probe; agent_tracker.patterns shell_write, check, probe) never reset the burn accounting: the threat is an accidental runaway (a loop, polling, waiting), and command text alone cannot prove work. A soft outcome within hold_ms holds off the pause (the hard flag and its nudge stay), but only while the agent has at most cap of them inside the waste window (agent_tracker.limits.waste_window_ms): a polling loop passes the cap and is paused."
value = { hold_ms = 600000, cap = 6 }

[metric.burn_pause_withheld]
doc = "Ticks the agent tracker held the hard burn flag but withheld the pause marker, by reason (building: a build call still in flight; soft: a recent soft outcome within burn.soft_hold). The nudge still goes out (GH #458)."
value = { kind = "counter", unit = "ticks", labels = ["reason"] }

[metric.burn_breaker_paused]
doc = "Tool calls the burn-breaker check paused, by reason (burn: the token line; waste: the waste sensor's hard mark) (GH #458)."
value = { kind = "counter", unit = "calls", labels = ["reason"] }

[metric.burn_breaker_bypass]
doc = "Tool calls the burn-breaker check let through while the breaker held, by kind (commit: a commit or push that lifts it; restore: the restore class; report: a report write; send: a mesh send; tool: an always-allowed tool; inspect: another allowed command; doubt: an error while judging, allowed) (GH #458)."
value = { kind = "counter", unit = "calls", labels = ["kind"] }

[burn.marker_dir]
doc = "Directory under the tracker directory that holds one marker file per agent while its hard flag is up."
value = "breaker"

[burn.marker_ext]
doc = "Extension of a marker file."
value = ".json"

[burn.marker_ttl_ms]
doc = "A marker older than this is ignored by the check and removed by the tracker. The tracker rewrites a standing marker on every tick, so an old one means the flag is no longer being kept up (the engine stopped, or the agent left the state without clearing it): the block lifts by itself."
value = 900000

[burn.agent_field]
doc = "Hook payload field that names a subagent; a call without it is the main session and is never blocked."
value = "agent_id"

[burn.allowed_tools]
doc = "Tools a blocked subagent may still call: SendMessage carries its final report."
value = ["SendMessage"]

[burn.report_tools]
doc = "Tools whose write into a report path (burn.report_path_res) passes while the breaker blocks, and lifts it: writing the report is the outcome the block asks for."
value = ["Write", "Edit"]

[burn.report_path_field]
doc = "The tool-input field that holds the path a report tool writes."
value = "file_path"

[burn.report_path_res]
doc = "Where a blocked subagent may still write its report: a scratchpad directory, a reports directory, the anti-hall handover, history and progress notes. Regular expressions (Rust syntax) tested on the path; a path holding `..` never passes."
value = [
  '''(?:^|/)scratchpad/[^\s]+\.(?:md|txt|json|log)$''',
  '''(?:^|/)reports?/[^\s]+\.(?:md|txt|json)$''',
  '''(?:^|/)\.anti-hall/(?:handovers|history|progress)/[^\s]+\.md$''',
]

[burn.report_bash_re]
doc = "The one Bash line a blocked subagent may use to write a report: `cat`, `echo` or `printf` with plain words or plain quoted strings (no file operand beyond words) and one redirect (`>` or `>>`) into one path, nothing else, on a single line (a heredoc never passes: the whole command is first screened by burn.reject_re, burn.charset_re and burn.max_cmd_chars). The path after the last `>` is checked against burn.report_path_res. Regular expression (Rust syntax)."
value = '''^\s*(?:cat|echo|printf)(?:\s+(?:\x27[^\x27]*\x27|\x22[^\x22]*\x22|[A-Za-z0-9_.,:/@%+=-]+))+\s*>>?\s*[A-Za-z0-9_./~+-]+\s*$'''

[burn.send_bash_re]
doc = "A mesh or agents send, which a blocked subagent may always run (the escalation to the parent and every mesh send): the engine launcher (`ah-engine` or `ah-hook`, bare or under ~/.anti-hall/bin) with `mesh` or `agents`, then `send`, then plain words or plain quoted strings, on one line. No environment-variable prefix and no other path is accepted; the whole command is first screened by burn.reject_re, burn.charset_re and burn.max_cmd_chars, and a `#`, `;`, `&`, pipe or redirect outside quotes fails it (burn.forbidden_bash_re). Regular expression (Rust syntax)."
value = '''^\s*(?:~/\.anti-hall/bin/)?ah-(?:engine|hook)\s+(?:mesh|agents)\s+send(?:\s+(?:\x27[^\x27]*\x27|\x22[^\x22]*\x22|[A-Za-z0-9_.,:/@%+=-]+))*\s*$'''

[burn.bash_tools]
doc = "Tools whose command text is checked against burn.allowed_bash_re while the breaker blocks."
value = ["Bash"]

[burn.allowed_bash_re]
doc = "A segment of a command a blocked subagent may still run (a commit has its own strict form, burn.commit_re). Git (optionally with any number of -C <dir> options; -c is denied by burn.deny_res) followed by add, push, status, log, diff, show, rev-parse or branch; read-only GitHub status (gh pr|run|issue checks, view, status, list, diff); a compile or check (cargo build|check|clippy, optionally behind lockf <file> and nice -n N), which is a step outcome when it finishes. Regular expression (Rust syntax), tested on each segment with its quoted strings blanked."
value = '''^\s*(?:git(?:\s+-C\s+\S+)*\s+(?:add|push|status|log|diff|show|rev-parse|branch)|gh\s+(?:pr|run|issue)\s+(?:checks|view|status|list|diff)|(?:lockf\s+\S+\s+)?(?:nice\s+-n\s+\d+\s+)?cargo\s+(?:build|check|clippy))(?:\s|$)'''

[burn.rm_target_re]
doc = "The one removal a blocked subagent may run: its own build output, `rm -rf <dir>/target` with exactly one plain path (dot-free components, no `..`, no `~`, no glob, no further argument) that ends at the end of the segment; a bare `/target` is refused. Tested on the RAW segment. Regular expression (Rust syntax)."
value = '''^\s*rm\s+-[rf]+\s+(?:/?\.?[A-Za-z0-9_+-][A-Za-z0-9_.+-]*/)+target/?\s*$'''

[burn.allowed_readonly_re]
doc = "A read-only inspection command a blocked subagent may still run, so it can look at its state before committing: grep, egrep, fgrep, rg, ls, cat, head, tail, wc, pwd, stat (judged like burn.allowed_bash_re: one segment, no pipe or redirect except burn.allowed_suffix_re, no command substitution). `file` is not listed: `file -C` writes a compiled magic file. Regular expression (Rust syntax)."
value = '''^\s*(?:grep|egrep|fgrep|rg|ls|cat|head|tail|wc|pwd|stat)(?:\s|$)'''

[burn.deny_res]
doc = "Options and settings that make an otherwise allowed command run another program or write a file. Each is a regular expression (Rust syntax, case-insensitive unless it says otherwise) tested on the RAW command text before any quote handling, so a quoted option is caught too. Any match blocks the whole command: ripgrep --pre and --hostname-bin; git --output, --ext-diff, --textconv, --upload-pack, --receive-pack, --exec, --exec-path, --config-env, --open-files-in-pager and their abbreviations; git `-c` (case-sensitive; among git's own options before the subcommand, so `git log -c` and text inside a quoted message pass); the `ext::` transport."
value = [
  '''(?i)--(?:pre|pr|hostname[a-z-]*|ho|output|ext|ext-[a-z-]*|ex|exe|exec[a-z-]*|textconv|textc[a-z]*|upload[a-z-]*|up|upl[a-z]*|receive[a-z-]*|rec|rece[a-z]*|conf[a-z-]*|open-files-in-pager|op|ope[a-z-]*)(?:[=\s]|$)''',
  '''(?-i)(?:^|&&|;)\s*git(?:\s+(?:-C\s+\S+|--?[A-Za-z][A-Za-z-]*(?:=\S+)?))*\s+-c''',
  '''(?i)\b(?:ext|fd)::''',
]

[burn.quote_char_re]
doc = "A quote character left in a command after its balanced quoted strings are blanked: the quotes are unbalanced, so the command is not judged and not allowed. Regular expression (Rust syntax)."
value = '''[\x27\x22]'''

[burn.allowed_cd_re]
doc = "The other segment a blocked subagent may run: `cd <dir>` (so `cd <dir> && git ...` passes). Regular expression (Rust syntax), tested like burn.allowed_bash_re."
value = '''^\s*cd\s+\S+\s*$'''

[burn.separator_re]
doc = "What splits a command into segments that are judged one by one: `&&` and `;`. Every segment must be allowed (burn.allowed_bash_re or burn.allowed_cd_re) for the command to pass. Regular expression (Rust syntax)."
value = '''&&|;'''

[burn.allowed_suffix_re]
doc = "A harmless tail of a segment, removed before the segment is judged: optionally `2>&1`, optionally piped into tail, head or wc with a line count or -l. Any other pipe or redirect stays forbidden. Regular expression (Rust syntax)."
value = '''(?:\s+2>&1)?(?:\s*\|\s*(?:tail|head|wc)(?:\s+-[nl]?\s*\d*)?)?\s*$'''

[burn.forbidden_bash_re]
doc = "What makes an otherwise allowed segment a hidden command: a pipe, lone `&` (background), redirect, backtick, `#` (comment), newline, CR or dollar-paren outside quoted text. (`&&` and `;` are separators, see burn.separator_re.) Regular expression (Rust syntax), tested on each segment with its quoted strings blanked."
value = '''[&|`<>#\n\r]|\$\('''

[burn.quoted_re]
doc = "A quoted string (single or double; the command has no backslash, backtick or dollar by then, so a quote cannot be escaped and nothing inside expands): blanked before the separator split and the hidden-command check, so a message may hold `;` or `&`. Regular expression (Rust syntax)."
value = '''\x27[^\x27]*\x27|\x22[^\x22]*\x22'''

[burn.msg_soft]
doc = "Soft advisory, delivered to the agent at its next tool call and to the coordinator's wake feed. Placeholders: {agent}, {kind}, {tokens}, {window}."
value = "agent tracker: {kind} {agent} spent about {tokens} tokens in the last {window} with no commit, finished step, passing check or new file. Commit what works or finish a step soon; otherwise its tool calls will be paused."

[burn.msg_hard]
doc = "Hard advisory, delivered to the agent and to the coordinator's wake feed. Placeholders: {agent}, {kind}, {tokens}, {window}."
value = "agent tracker: {kind} {agent} spent about {tokens} tokens in the last {window} with no commit, finished step, passing check or new file. Its tool calls are paused except commit, push, status, restore/rollback/cleanup and its report: commit what works, report, stop."

[burn.msg_hard_withheld]
doc = "Hard advisory while the pause is withheld because a build is still in flight (burn.doubt): delivered to the agent and to the coordinator's wake feed instead of burn.msg_hard. Placeholders: {agent}, {kind}, {tokens}, {window}."
value = "agent tracker: {kind} {agent} spent about {tokens} tokens in the last {window} with no commit, finished step, passing check or new file. A build is still in flight or it just produced output, so its tool calls are not paused yet; commit what works soon."

[burn.msg_what]
doc = "Heading of the block. Placeholders: {tokens} the tokens spent since the last outcome."
value = "this tool call is paused after work with no recorded outcome."

[burn.msg_what_waste]
doc = "Heading of the block when the waste sensor (agent_waste.toml) holds the hard mark rather than the token line. Placeholders: {score} the waste score (thousands of tokens per outcome unit), {hard} the hard threshold, {tokens} the tokens of the window, {reason} the sensor's own reason."
value = "this tool call is paused after repeated work with no outcome."

[burn.lift_bash_re]
doc = "A segment that lifts the block at once: a git commit or push (optionally with `-C <dir>`). A commit is the outcome the block asks for; the tracker counts it on its next tick and raises the flag again only if the hard condition still holds. Regular expression (Rust syntax), tested like burn.allowed_bash_re."
value = '''^\s*git(?:\s+-C\s+\S+)*\s+(?:commit|push)\b'''

[burn.msg_why]
doc = "Why the breaker blocks."
value = "Tokens spent with nothing to show for them are wasted budget; running agents in parallel is fine."

[burn.msg_instead]
doc = "What to do instead: the exact actions that lift the block, with the allowed command forms."
value = "save a report of the outcome and stop."

[burn.msg_allowed]
doc = "Allowed line of the block: what stays possible while the breaker holds."
value = "git commit/add/push/status/log/diff (any `git commit -m` message, the heredoc form too, or `-F <file>`), restore/rollback/revert/cleanup commands, read-only grep/rg/ls/cat/head/tail/wc, read-only gh checks, cargo build/check/clippy, report writes."

[burn.msg_override]
doc = "How the user can lift the block (shown on the last line)."
value = "tell the agent \"skip burn-breaker\" (or turn off agents.burnBreaker)."


[burn.commit_re]
doc = "The commit a blocked subagent may always run (GH #458: an allowed way out is never paused): `git [-C <dir>] commit [options] -m '<text>' [-m '<text>']...` (or `-am`, or double quotes), the same with `-F <path>` (a plain file path), or `--amend --no-edit`. Options: -a/--all, --allow-empty, -q/--quiet, -s/--signoff, -n/--no-verify, --amend, -v/--verbose. A single-quoted <text> holds any printable character but the single quote; a double-quoted one any printable character but the double quote (a `$`, backtick and backslash never reach here: burn.reject_re), so nothing in it expands or chains. The heredoc message form is rewritten to this one first (burn.heredoc). Tested on the RAW segment. Regular expression (Rust syntax)."
value = '''^\s*git(?:\s+-C\s+[A-Za-z0-9_./~+-]+)?\s+commit(?:\s+(?:-a|--all|--allow-empty|-q|--quiet|-s|--signoff|-n|--no-verify|--amend|-v|--verbose))*\s+(?:(?:-m|-am)\s+(?:\x27[\x20-\x26\x28-\x7e]*\x27|\x22[\x20\x21\x23-\x7e]*\x22)(?:\s+-m\s+(?:\x27[\x20-\x26\x28-\x7e]*\x27|\x22[\x20\x21\x23-\x7e]*\x22))*|-F\s+[A-Za-z0-9_./~+-]+|--no-edit)\s*$'''

[burn.heredoc]
doc = "The heredoc commit message (`git commit -m \"$(cat <<'EOF'` newline, body lines, `EOF`, `)\"`), the form Claude workers write: open_re ends the first line (a QUOTED delimiter, so the body never expands; `<<-` allowed), close_re starts the last line (the rest of that line joins the command), the line before the last is the delimiter, no body line equals the delimiter once trimmed (an early end), and bad_re (a control character other than tab and newline, so no CR trick) appears nowhere. The command is then judged with the whole message replaced by placeholder, so the commit, the chain around it and the lift follow the one-line rules. Regular expressions (Rust syntax)."
value = { open_re = '''-m\s+\x22\$\(cat\s+<<-?\s*\x27[A-Za-z_][A-Za-z0-9_]*\x27\s*$''', close_re = '''^\)\x22''', bad_re = '''[\x00-\x08\x0b-\x1f\x7f]''', placeholder = "-m 'msg'", quote = "'" }

[burn.restore_deny_res]
doc = "Options that disqualify a restore-class segment (it then has to pass the usual rules): an evaluate, command, file or directory option (-c, -e, -f, -C, --eval, --exec, --command, --file, --directory, --makefile), or an assignment. Regular expressions (Rust syntax) tested on the segment with quoted strings blanked."
value = ['''(?:^|\s)(?:-[cefC]|--(?:eval|exec|command|file|directory|makefile)\S*)(?:\s|=|$)''', '''=''']

[burn.restore_bash_res]
doc = "The restore class (GH #458): a command that puts earlier state back (a device or config restore, a rollback, a revert, an undo, a teardown or cleanup, git restore/checkout --/stash pop|apply/reset/revert). It is NEVER paused, whatever else it holds: a paused restore leaves live systems in test configuration. The command must pass the usual screen (burn.max_cmd_chars, burn.charset_re, burn.reject_re, burn.deny_res); each regular expression (Rust syntax) is then tested per segment on the text with quoted strings blanked, anchored at the program and matching an exact single-target form (a program or script whose name holds a restore word with plain arguments, an interpreter running such a script, exactly one make target, git restore/checkout --/stash pop|apply/revert <sha>/reset --hard with one target; burn.restore_deny_res disqualifies). It is a per-call exemption, never progress credit; an argument, an environment assignment, a quoted message or a word after `#` never qualifies (a word in a quoted message or after `#` does not count; a pipe, redirect or comment in that segment fails it), and every other segment must be allowed by the usual rules (counted as burn_breaker_bypass kind=restore)."
value = [
  '''(?i)^\s*(?:\.{0,2}/)?(?:[\w.-]+/)*[\w-]*(?:restore|rollback|roll-back|revert|undo|teardown|tear-down|cleanup|clean-up)[\w-]*(?:\.(?:sh|py|js|mjs))?(?:\s+[\w./@:,-]+)*\s*$''',
  '''(?i)^\s*(?:python3?|node|bash|sh)\s+(?:\.{0,2}/)?(?:[\w.-]+/)*[\w-]*(?:restore|rollback|roll-back|revert|undo|teardown|tear-down|cleanup|clean-up)[\w-]*\.(?:py|js|mjs|sh)(?:\s+[\w./@:,-]+)*\s*$''',
  '''(?i)^\s*make\s+[\w-]*(?:restore|rollback|roll-back|revert|undo|teardown|tear-down|cleanup|clean-up)[\w-]*\s*$''',
  '''^\s*git(?:\s+-C\s+[\w./~-]+)?\s+(?:restore(?:\s+--staged)?\s+[\w./-]+|checkout\s+--\s+[\w./-]+|stash\s+(?:pop|apply)|revert\s+(?:--no-edit\s+)?[0-9a-f]{7,40}|reset\s+--hard(?:\s+[\w./~^@-]+)?)\s*$''',
]

[burn.reject_re]
doc = "What rejects the WHOLE command up front, before any quote handling: a backslash, a backtick, a dollar sign (so no `$(`, `${` or `$VAR`), a heredoc `<<`, and process substitution `<(` or `>(`. Regular expression (Rust syntax)."
value = '''[\\`$]|<<|<\(|>\('''

[burn.charset_re]
doc = "The whole command must be this: printable ASCII only (so no CR, no newline, no tab, no NUL, no other control or non-ASCII character). Regular expression (Rust syntax)."
value = '''^[\x20-\x7e]+$'''

[burn.max_cmd_chars]
doc = "Longest command (characters) the breaker will judge while it holds; a longer one is not allowed (bounds the work of every pattern)."
value = 4000
