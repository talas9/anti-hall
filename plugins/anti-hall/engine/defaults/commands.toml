doc = "Activate, configure and inspect the opt-in Jev classifier (D81, the port of scripts/jev-setup.js): `status` (resolved settings, key presence yes or no, every integration's mode, calls in the last 24 hours, the Vercel credit balance), `enable` and `disable`, `set-key` (the key is read from stdin only and written 0600), `bind-generic-key`, `mode <integration> on|shadow|off`, `test` (one real gateway call per configured transport, each on its own) and the shadow-review verbs `review-due [--json]`, `reviewed <integration>` and `snooze <integration> --days N`."
value = { args = "<status|enable|disable|set-key|bind-generic-key|test|mode|review-due|reviewed|snooze> [--days <n>] [--transport vercel|typesafe] [--fallback vercel|typesafe|none] [--role fallback] [--vendor vercel|typesafe]", read_only = false, status = "implemented" }

