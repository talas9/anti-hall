[cmd.devswarm]
doc = "The DevSwarm realtime state and owner actions (lane dswire). `status` and `line` print the live workspace state and its statusline segment; `advisory --session <id>` prints the changes that session has not seen; `archive --id <ws> --request <id>`, `plan-prune --older-than <days>` and `prune --confirm-ids <a,b> --plan <nonce>` run the hivecontrol actions at the owner's request, with Node's preconditions, ledger and confirmations. `ingest` prints who drains the native queue (devswarm_ingest.mode), the projects and each project's lock and heartbeat (read-only). Roles (devswarm_wire.role_matrix): reads are open; the acting verbs are for the main session only. `create` is left to scripts/devswarm.js (exit 75); `merge` is the devswarm.js verb below. The devswarm.js verbs `help`, `skip`, `archive-ignore`, `archive-unignore`, `gate-intent`, `notice --list`, `plan set|show`, `scope add`, `gate`, `workspaces list`, `logs`, `wake-directive` (a child workspace), `ready-check`, `app-state`, `app-sync`, `done`, `primary`, `relay`, `archive-request`, `nudge`, `supervision-report`, `sync-ui`, `retention`, `unarchive`, `migrate-owner-keys`, `ensure`, `register`, `correct`, `reap-orphans`, `register-primary`, `diagnose`, `healthcheck`, `merge`, `spawn`, `respawn`, `reconcile-registry`, `reap-stale`, `reconcile-active` and `auto-archive` are native too (the guarded fronts: `spawn` answers its refusals, `respawn` its usage and not-primary refusals, `reap-stale` and `reconcile-active` their dry runs and an empty confirmed run, `auto-archive` the plan without the app database; Node answers the rest): `devswarm <verb> <the devswarm.js arguments>` prints what `node scripts/devswarm.js <verb> ...` prints (Node answers what the engine defers). `supervisor` prints who owns the supervisor duties (devswarm_sup.mode), whether the Node supervisor is still running and each duty's gate; `recover --id <ws> --request <id>` kills and resumes ONE session on demand (never from a sweep): the engine refuses an automated caller, an unsafe id, a repeated request, a workspace without a worktree and session and one already recovered the most times allowed, then Node's devswarm-recover.js `run` does the kill with its exactly-one-target, identity and working-directory confirmations. Roles (devswarm_wire.role_matrix): reads are open; the acting verbs are for the main session only. `create` is left to scripts/devswarm.js (exit 75); `merge` is the devswarm.js verb below. Inert (exit 64) where DevSwarm is absent. `wake-watch [--auto]` is the idle-wake Monitor the plugin runs for the whole session: it prints one line per event (armed, new mail, a persistent read error, a newer build) and runs until the session ends, on the realtime watch layer (OS events, polling where there are none) and the Node watcher's own tick; it reads plain files only and consumes nothing; roles: main session and workspace child. It answers exit 75 (nothing printed or written) for what only Node can decide, and the launcher then runs the Node watcher."
value = { args = "<status|line|supervisor|ingest|ledger [--since <window>]|recover --id <ws> --request <id>|advisory --session <id>|archive --id <ws> --request <id>|plan-prune --older-than <days>|prune --confirm-ids <ids> --plan <nonce>|help [<verb>]|skip <guard> [--ttl <min>]|archive-ignore <id>|archive-unignore <id>|gate-intent --reason <text>|notice --list|plan set|show <id>|scope add <id> --glob <g> --note <t>|gate <id> --set <csv> --clear <csv>|workspaces list|logs [--limit <n>]|wake-directive <id>|ready-check <sha> [--base <ref>]|app-state [--json]|app-sync [--dry-run]|done [--summary <text>]|primary [status|takeover] [--session <id>]|relay <seq> --to <id> [--note-file <path>]|archive-request <childId> [--reason <text>]|nudge <id>|supervision-report [--days <n>] [--json]|sync-ui --titles-json <file> [--yes]|retention status|run [--dry-run] [--store <key>]|unarchive <id>|migrate-owner-keys|ensure <id> [--worktree <p> --session <s>]|register <id> --worktree <p> --session <s> [--nudge <word>]|correct <id> [--dry-run]|reap-orphans [--apply --max <n>]|wake-watch [--auto]|register-primary [--worktree <p> --session <s> --force]|diagnose [--json]|healthcheck [--json]|merge [<hivecontrol merge-into-source args>]|spawn <branch> [-s <src> -a <agent> -p <brief> -t <title>]|respawn <id> [--dry-run]|reconcile-registry|reap-stale [--yes]|reconcile-active --active <ids> [--yes]|auto-archive>", read_only = false, read_only_args = ["status", "line"], status = "implemented" }

[cmd.mesh]
doc = "DevSwarm mesh store (D45). With `--db`: the read-only S0 reader (stage S0): `roster` lists the registered workspaces, `unread` the per-workspace counts, `read --id <ws>` its messages (`--since <n>` skips the first n, `--last <n>` the newest n, capped by mesh.read_byte_cap), `dump` the full canonical dump the parity harness compares with Node; the store is opened read-only and never created, and a journal-backed store is refused. Without `--db` (stage 2): the words after `mesh` are a `scripts/devswarm.js` argv, run per the `mesh.engine_writes` switch: off (default) hands it to Node; shadow lets Node act and replays it on a scratch copy of the store, logging the comparison (mesh_write.shadow_log); on answers `send`, `mesh read`, `mesh history` and `roster --ack` in the engine (same output, exit code, store rows and locks as Node) and hands everything it cannot reproduce exactly, and every other verb, to Node. The devswarm.js verb `archive <id>` (the local archive and the DevSwarm app leg, `hivecontrol workspace archive` with Node's retry) is answered here too, and only here: the owner action of the same name under the realtime command takes `--id` and `--request`."
value = { args = "<roster|unread|read|dump> --db <devswarm.db> [--id <ws>] [--since <n>] [--last <n>] | <devswarm.js argv>", read_only = false, read_only_flags = ["--db"], status = "implemented" }

