# ah-engine shipped defaults for scripted check logic (D88 spike): hook DECISION logic lives in editable plugin JavaScript
# (`engine/logic/<check>.js`, shared helpers in `engine/logic/lib/*.js`), run by an embedded QuickJS-NG runtime. The engine
# keeps only generic, read-only primitives the scripts call. Format: see the header of engine.toml.

[script.enabled]
doc = "1: a check whose script exists runs the script instead of its compiled port; 0: the compiled port always runs (the parity baseline)."
value = 1
env = "AH_ENGINE_SCRIPT"
min = 0
max = 1

[script.logic_dir]
doc = "Directory of the shipped check scripts, relative to the plugin root."
value = "engine/logic"

[script.override_dir]
doc = "Owner override directory, relative to the home directory: a script (or lib file) of the same name there takes precedence over the shipped one."
value = ".anti-hall/logic"

[script.lib_dir]
doc = "Sub-directory (of both the shipped and the override directory) whose `*.js` files are evaluated, in file-name order, before a check script."
value = "lib"

[script.ext]
doc = "File extension of a check script and of a lib file."
value = ".js"

[script.entry]
doc = "Global function a check script defines; it is called with the hook payload and returns the verdict."
value = "decide"

[script.time_limit_ms]
doc = "Wall-clock limit of one script call; past it the interpreter is interrupted and the call defers to Node (never a silent allow)."
value = 50
env = "AH_ENGINE_SCRIPT_TIME_MS"
min = 1
unit = "ms"

[script.call_memory_bytes]
doc = "Heap a single script call may allocate above the runtime's size after its scripts were loaded; past it the call fails and defers."
value = 16777216
min = 1048576
unit = "bytes"

[script.stack_bytes]
doc = "Largest interpreter stack one script call may use."
value = 262144
min = 65536
unit = "bytes"

[script.read_max_bytes]
doc = "Upper bound of one `ah.fs.readText` read, whatever the script asks for."
value = 4194304
min = 1024
unit = "bytes"

[script.regex_cache_max]
doc = "Compiled regular expressions kept per worker thread for `ah.re.*`; the cache is cleared when it is full."
value = 256
min = 8

[script.p95_budget_us]
doc = "Latency a scripted check may ADD over its compiled port at the 95th percentile, per call (the D88 go/no-go gate measures against it; the primitives a script calls, such as a transcript read, cost the same either way)."
value = 1000
unit = "us"

[script.msg_invalid_pattern]
doc = "Error a script sees when it hands `ah.re.*` a pattern that does not compile."
value = "invalid pattern {src}"

[script.msg_no_request]
doc = "Error a host function raises when it is called outside a check call (no request state)."
value = "no request state"

[script.msg_unknown_key]
doc = "Error a script sees when it asks `ah.cfg` for a key that is not shipped."
value = "unknown defaults key {key}"

[script.msg_not_number]
doc = "Error a script sees when it asks `ah.cfgNum` for a key whose value is not a number."
value = "{key} is not a number"

[script.msg_bad_verdict]
doc = "Logged reason (then the call defers) when a script returns a value that is not a verdict."
value = "unexpected verdict {value}"

[script.engine_only_checks]
doc = "Checks with NO Node twin (their fallback command is a no-op). When one of these scripts cannot answer, the safe outcome is the engine's own: BLOCK on a guard event (dispatch.guard_events), ALLOW quietly on any other event. Every other check defers to its Node hook on a script failure, so a broken script never changes a decision."
value = ["sibling-sweep"]

[script.msg_fail_closed]
doc = "Block reason of an engine-only check on a guard event whose script could not answer. Placeholders: {check}, {why}."
value = "anti-hall {check}: BLOCKED. Its check script failed ({why}) and this guard has no fallback, so the call is refused rather than allowed unchecked. Fix or remove the script in engine/logic or ~/.anti-hall/logic, or skip the guard."

[script.msg_no_script]
doc = "Reason logged (then the failure policy applies) when a check whose logic is a script has no script file."
value = "no script file"

[script.write_root]
doc = "The one directory under the home directory that a script may write to through `ah.state.writeAtomic` (a path must start with it; nothing outside it, no link below it)."
value = ".anti-hall"

[script.write_max_bytes]
doc = "Largest text one `ah.state.writeAtomic` call may write; a larger text is refused."
value = 1048576
min = 1024
unit = "bytes"

[script.write_path_max]
doc = "Longest relative path one `ah.state.writeAtomic` call may name."
value = 240
min = 16

[script.write_why_home]
doc = "Refusal reason of a scripted write when the request has no absolute home directory."
value = "no absolute home directory"

[script.write_why_size]
doc = "Refusal reason of a scripted write whose text is over script.write_max_bytes."
value = "text over the size cap"

[script.write_why_path]
doc = "Refusal reason of a scripted write whose path is absolute, outside the write root, too long, or has an empty, `.` or `..` part."
value = "path outside the allowed shape"

[script.write_why_link]
doc = "Refusal reason of a scripted write that would pass through a symbolic link below the write root."
value = "symbolic link below the write root"

[script.msg_write_refused]
doc = "Error a script sees when its write was refused. Placeholder: {why}."
value = "write refused: {why}"

[script.msg_env_incomplete]
doc = "Reason logged (then the failure policy applies) when the request's environment is incomplete, so no check can be evaluated."
value = "request environment incomplete"

[script.msg_settings_unreadable]
doc = "Reason logged (then the failure policy applies) when the settings file holds something only JavaScript can parse."
value = "settings file readable only by JavaScript"

[script.write_sync]
doc = "1: a scripted write fsyncs the file before the atomic rename (survives a power cut, costs several milliseconds per write); 0: it does not (a reader still never sees a half-written file, and the state a script keeps is advisory and rebuilt at the next run)."
value = 0
min = 0
max = 1

[script.readdir_max]
doc = "Most entries `ah.fs.readdir` returns; a directory with more entries answers null (a partial listing is never returned as a whole)."
value = 10000
min = 16

[script.exec_programs]
doc = "Program names `ah.exec` may run (bare names, resolved through the request's PATH). Anything else answers null."
value = ["git"]

[script.exec_timeout_max_ms]
doc = "Longest wall-clock time one `ah.exec` run may take whatever the script asks for; the run's process group is killed at the limit."
value = 5000
min = 10
unit = "ms"

[script.exec_poll_ms]
doc = "How often the bounded runner checks whether an `ah.exec` child has finished."
value = 2
min = 1
unit = "ms"

[script.exec_max_calls]
doc = "Most `ah.exec` runs one script call may start; past it the call answers null."
value = 64
min = 1

[script.exec_output_max_bytes]
doc = "Largest stdout (and, separately, stderr) `ah.exec` hands back; the rest is cut and `truncated` is set."
value = 4194304
min = 1024
unit = "bytes"

[script.tail_max_bytes]
doc = "Largest window `ah.transcript.tailLines` reads from the end of a file, whatever the script asks for."
value = 16777216
min = 65536
unit = "bytes"

[script.includes]
doc = "Scripts a check script builds on: check name to the names of other scripts in the logic directory, loaded as libraries (after the shared helpers, before the check's own script, which then defines the entry). A listed script that does not exist makes the check's script unavailable."
value = { git-audit = ["git"] }

[script.sweep_max_remove]
doc = "Most files one `ah.state.sweep` call may delete, whatever the script asks for."
value = 200
min = 1

[script.msg_unknown_op]
doc = "Error a script sees when it asks a file operation the host does not have. Placeholder: {op}."
value = "unknown file operation {op}"

[script.tail_buf_bytes]
doc = "Size of the buffer `ah.transcript.tailLines` reads a file through."
value = 65536
min = 4096
max = 1048576
unit = "bytes"

[script.p95_budget_by_check]
doc = "Per-check own-p95 allowance (us) for scripted checks whose latency includes waiting on a child process or a disk sync, which the compiled port paid as well. Measured 2026-10-08 on the golden corpora (release, no LTO, loaded machine), compiled port then script: git p50 92 then 432 us, p95 13,902 then 22,324 us (the p95 is the `git` child processes of alias and handover lookups plus the longest commands' tokenizing); sibling-sweep p50 12,154 then 2,453 us, p95 13,261 then 3,903 us (the compiled state write fsynced). A check not listed here is held to script.p95_budget_us."
value = { git = 30000, sibling-sweep = 5000, fable-availability = 2000 }
