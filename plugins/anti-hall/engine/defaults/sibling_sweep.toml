# ah-engine shipped defaults for the sibling-sweep check (Stop and SubagentStop). Format: see the header of engine.toml.
# Regex sources use JavaScript syntax (translated by `checks::guardkit::jsre`; no lookaround) and are TOML literal strings so no
# backslash is doubled. They are matched case-insensitively unless a doc says otherwise.

[sibling_sweep.summary]
doc = "One-line description of the sibling-sweep check in the generated reference."
value = "Stop and SubagentStop reminder: when the reply states the cause of a bug in a fix context and the turn shows no search for other occurrences of the same pattern, asks once per cause to search, fix or list every occurrence and state the search run; counts reminders and follow-through (engine-only, no Node twin)."

[sibling_sweep.guard_name]
doc = "The guard id this check answers to in skip.json and in messages."
value = "sibling-sweep"

[sibling_sweep.setting]
doc = "Where the on/off switch is read from (guards.siblingSweep, default on). A Jev mode for the judgement parts (is this a cause statement, did the search cover the pattern) is a later addition and is not wired."
value = { section = "guards", key = "siblingSweep", env = "", aliases = [], option = "guards_sibling_sweep", default = true }

[sibling_sweep.events]
doc = "The events this check answers; the payload's hook_event_name must be one of them."
value = ["Stop", "SubagentStop"]

[sibling_sweep.subagent_event]
doc = "The event name that is a subagent's own stop (the telemetry scope label differs and the agent's own transcript is read)."
value = "SubagentStop"

[sibling_sweep.child_env]
doc = "The environment variable the judge and Jev children carry; a hook that runs inside one does nothing (no recursion, no reminders to a classifier)."
value = "ANTIHALL_JUDGE_CHILD"

[sibling_sweep.child_value]
doc = "The value of the child variable that means this process is a judge or Jev child."
value = "1"

# ---- payload and transcript field names ---------------------------------------------------------------------

[sibling_sweep.f_event]
doc = "Payload field holding the event name."
value = "hook_event_name"

[sibling_sweep.f_session]
doc = "Payload field holding the session id."
value = "session_id"

[sibling_sweep.f_agent]
doc = "Payload field holding the subagent id (SubagentStop, and Stop inside a subagent)."
value = "agent_id"

[sibling_sweep.f_reply]
doc = "Payload field holding the reply being stopped."
value = "last_assistant_message"

[sibling_sweep.f_active]
doc = "Payload field that is true when the Stop is already a continuation of a Stop block; the check then only resolves follow-through and never reminds again."
value = "stop_hook_active"

[sibling_sweep.f_transcript]
doc = "Payload field holding the session transcript path."
value = "transcript_path"

[sibling_sweep.f_agent_transcript]
doc = "Payload field holding the subagent's own transcript path; it wins over the session transcript when present."
value = "agent_transcript_path"

[sibling_sweep.t_user]
doc = "Transcript entry type of a user entry."
value = "user"

[sibling_sweep.t_assistant]
doc = "Transcript entry type of an assistant entry."
value = "assistant"

[sibling_sweep.b_text]
doc = "Content block type of a text block."
value = "text"

[sibling_sweep.b_tool_use]
doc = "Content block type of a tool call."
value = "tool_use"

[sibling_sweep.injected_re]
doc = "Regex source of the text an injected user block starts with (notifications, reminders, command echoes), which is not a human prompt and so does not start a turn."
value = '^\s*<(?:task-notification|system-reminder|local-command|command-name|command-message|local-command-stdout)'

# ---- limits -------------------------------------------------------------------------------------------------

[sibling_sweep.window_bytes]
doc = "The most of the transcript's end that is read to find the turn (one streaming pass, never the whole file)."
value = 1048576
unit = "bytes"
min = 65536
max = 16777216

[sibling_sweep.line_max_bytes]
doc = "A transcript line longer than this is skipped unparsed (almost always one huge tool result); it bounds the memory of the one line being read."
value = 524288
unit = "bytes"
min = 4096
max = 8388608

[sibling_sweep.text_max_bytes]
doc = "The most of one assistant text that is scanned for a cause statement."
value = 65536
unit = "bytes"
min = 1024
max = 1048576

[sibling_sweep.max_events]
doc = "The most events (assistant texts and tool calls) kept for one turn; older ones are dropped, the newest kept. The turn is read from its end, so only these are analysed: this bounds the check's CPU time on a long turn (measured 2026-10-09, release: about 40 us per event, so 4000 events took 145 ms against the 50 ms script limit and the script was interrupted)."
value = 200
min = 100
max = 100000

[sibling_sweep.max_turn_text_chars]
doc = "The most assistant text (UTF-16 units, newest first) of one turn that is analysed for cause, fix and sweep statements; the walk back through the turn stops once it is reached. Analysis costs about 0.06 ms per 1,000 characters (measured 2026-10-09, release: 1 MB of turn text took 62 ms against the 50 ms script limit)."
value = 131072
min = 4096
max = 16777216

[sibling_sweep.max_lines]
doc = "The most transcript lines, counted from the end of the window, that the engine parses and hands to the script; the turn is looked for in these. It bounds the parse and the hand-over on a window of many small lines (measured 2026-10-09, release: 5,692 lines of a 1 MB window took 32 ms)."
value = 1000
min = 100
max = 1000000

[sibling_sweep.window_chars]
doc = "How many characters before a cue are searched for a hedge or negation that voids the cue."
value = 48
unit = "chars"
min = 8
max = 400

[sibling_sweep.snippet_chars]
doc = "The longest excerpt of the cause sentence shown in the reminder when the pattern is named from the message."
value = 100
unit = "chars"
min = 20
max = 400

[sibling_sweep.min_span_chars]
doc = "The shortest inline code span that names the pattern in the reminder (a one or two character span is punctuation, not a name)."
value = 3
unit = "chars"
min = 1
max = 40

[sibling_sweep.hash_chars]
doc = "How many characters of the normalised cause sentence feed its identity hash (the once-per-cause key)."
value = 200
unit = "chars"
min = 40
max = 2000

[sibling_sweep.hash_short]
doc = "How many hex characters of a cause hash are written to the telemetry log."
value = 10
min = 4
max = 40

[sibling_sweep.max_per_scope]
doc = "The most reminders for one session scope (the session, or one subagent of it); past it the check only counts."
value = 6
min = 1
max = 1000

[sibling_sweep.max_causes]
doc = "The most distinct causes remembered for one turn."
value = 8
min = 1
max = 100

[sibling_sweep.follow_window]
doc = "Follow-through: the search counts as following the reminder when a search tool call is among the first this many tool calls after the reminded reply."
value = 12
unit = "tool calls"
min = 1
max = 1000

# ---- the cause matcher --------------------------------------------------------------------------------------

[sibling_sweep.cause_cues]
doc = "Regex sources, any of which states the cause of a bug in the assertive form (root-cause statements, 'caused by', 'the bug was', 'found the bug', a Cause label). 'Root cause' must be the subject ('the root cause [of X] was'), not a modifier ('root-cause messages were captured by running ...' describes a method, issue #55). Matched sentence by sentence after markdown emphasis, fenced code and quoted lines are removed."
value = [
  '\broot[- ]causes?(?:\s+(?:of|for|behind|in)\b[^.\n]{0,80}?)?\s*,?\s+(?:(?:here|then|now|clearly|actually|really|ultimately|finally|itself)\s+)?(?:is|was|were|are|turned out|lies|lay|lives|came from)\b',
  '\broot[- ]causes?\s*(?::|—|–|-\s)',
  '\broot[- ]causes?\s+(?:is\s+|was\s+|now\s+)?(?:confirmed|found|identified|established|isolated|located|proven|proved|nailed\s+down|pinned\s+down|tracked\s+down)\b',
  '\b(?:found|identified|isolated|confirmed|proved|proven|traced|nailed|located|pinned down|tracked down|tracked)\s+(?:down\s+)?(?:the|its|a|an|that)\s+(?:actual\s+|real\s+|underlying\s+|exact\s+|true\s+)?(?:root[- ]cause|cause|culprit|bug)\b',
  '\b(?:the|its|this|that)\s+(?:actual\s+|real\s+|underlying\s+|exact\s+|true\s+|only\s+)?(?:cause|culprit|bug)\s+(?:is|was)\b',
  '\b(?:is|was|were|are|been|being)\s+caused\s+by\b',
  '\bthe\s+(?:actual\s+|real\s+)?(?:issue|problem|failure|crash|regression|defect)\s+(?:is|was)\s+(?:that|in|due|because|a|an|the)\b',
  '\bstems?\s+from\b',
  '^\s*(?:[-#]+\s*)?(?:the\s+)?(?:root\s+)?(?:cause|culprit)\s*:',
]

[sibling_sweep.self_correction_family]
doc = "The label of the self-correction cue family (the agent reports fixing its own typo or mistake): written to the per-scope state with the pending reminder so follow-through is counted for it. Empty is not allowed."
value = "self_correction"

[sibling_sweep.self_correction_cues]
doc = "Regex sources, any of which is the agent reporting a correction of its own typo or mistake. Each cue binds the agent as the actor of the mistake or its fix, not a first-person word anywhere in the sentence: 'I/I've/I'd fixed (found, made ...) a typo', 'found a mistake I made' or 'in my earlier edit', 'my (own) mistake', 'I used (typed, set ...) X, which should have been Y' or 'my edit ... should have been'; 'I reviewed Alice's fix: X should have been Y' is no statement. Matched like cause_cues (same hedge, negation, operational and attributed filters, same once-per-cause key, search evidence and per-scope cap) after fenced code and quoted lines are removed, on the whole reply with code spans and then the inline quotations (sibling_sweep.quote_chars_re) blanked before it is split into sentences."
value = [
  '''\bi(?:['’](?:ve|d)|\s+ha(?:ve|d))?\s+(?:just\s+|now\s+|also\s+|then\s+)?(?:fix(?:ed)?|correct(?:ed)?|repair(?:ed)?|found|spotted|caught|noticed|discovered|realis(?:ed|e)|realiz(?:ed|e)|made|introduced|left)\s+(?:a|an|the|my|one|this|that)\s+(?:own\s+)?(?:\w+\s+){0,2}(?:typo|mistake|slip(?:-?up)?|misspelling|oversight)s?\b''',
  '''\b(?:fix(?:ed|ing)?|correct(?:ed|ing)?|repair(?:ed|ing)?|found|spotted|caught|noticed|discovered|realis(?:ed|e)|realiz(?:ed|e))\s+(?:a|an|the|one)\s+(?:\w+\s+){0,2}(?:typo|mistake|slip(?:-?up)?|misspelling|oversight)s?\s+(?:(?:that|which)\s+)?(?:i(?:['’](?:ve|d)|\s+ha(?:ve|d))?\s+(?:made|introduced|wrote|added|left)|(?:in|from)\s+my\s+(?:own\s+)?(?:\w+\s+){0,2}(?:edit|change|commit|patch|fix|code|diff|update)s?)\b''',
  '\bmy\s+(?:own\s+)?(?:mistake|bad|fault|typo|slip(?:-?up)?|oversight)\b',
  '''\bi(?:['’](?:ve|d)|\s+ha(?:ve|d))?\s+(?:used|typed|got|put|set|passed|named|picked|spelled|spelt|entered|chose|gave|pointed|added|left)\b[^.\n]{0,80}\bshould\s+have\s+(?:been|said|read|used)\b''',
  '\bmy\s+(?:own\s+)?(?:\w+\s+)?(?:edit|change|commit|patch|code|diff)s?\b[^.\n]{0,80}\bshould\s+have\s+(?:been|said|read|used)\b',
  '''\b(?:wrong|incorrect|mistyped|misspelled|misspelt)\s+(?:\w+\s+){0,2}(?:that\s+)?i(?:['’](?:ve|d)|\s+ha(?:ve|d))?\s+(?:used|typed|set|passed|named|picked|spelled|spelt|entered|chose|wrote|gave|added|left|put)\b''',
]

[sibling_sweep.hedge_any_re]
doc = "Regex source of words that make the whole sentence a guess, a plan or a question rather than a finding: it is then no cause statement."
value = '\b(?:probably|possibly|presumably|perhaps|maybe|apparently|supposedly|seems?|appears?|i\s+(?:suspect|think|guess|believe|assume)|suspect(?:s|ed)?|hypothes\w+|guess(?:ing)?|not\s+sure|unclear|unknown|undetermined|unresolved|unproven|unverified|inferred|partly|still\s+(?:open|undecided)|not\s+(?:yet\s+)?(?:proven|confirmed|verified|known|established|determined|identified|found)|could\s+be|might\s+be|may\s+be|could\s+have\s+been|might\s+have\s+been|if\s+the\s+(?:root\s+)?cause|whether|(?:root[- ]causes?|cause)\s+(?:\w+\s+)?first|no\s+(?:single\s+)?(?:root\s+)?cause|not\s+the\s+(?:root\s+)?cause|isn.t\s+the\s+(?:root\s+)?cause|wasn.t\s+the\s+(?:root\s+)?cause)\b'

[sibling_sweep.hedge_before_re]
doc = "Regex source tested on the few characters just before the cue: a negation, condition, intent or modal there voids the cue ('to find the root cause', 'if it was caused by', 'may be caused by', 'not caused by')."
value = '\b(?:if|unless|suppose|assuming|whether|may|might|could|would|should|can|cannot|not|never|no|to\s+(?:find|identify|determine|figure|locate|understand|discover|isolate|prove|confirm|get)|find(?:ing)?|identify(?:ing)?|determine|investigat\w+|looking\s+for|look\s+for|trying\s+to|try\s+to|need(?:s)?\s+to|want(?:s)?\s+to|let\s+me|let.s|help\s+me|going\s+to|will|until|until)\s+(?:\w+\s+){0,3}$|n.t\s+(?:\w+\s+){0,3}$'

[sibling_sweep.operational_re]
doc = "Regex source of environment and operational facts (a leftover git lock file, machine load, disk or network state, other agents' activity): a sentence that states one is no code-bug cause, so there are no sibling code sites to search for and the check stays quiet. A dependency lockfile or a test that times out under load is still a code cause."
value = '\b(?:git\s+lock|index\.lock|(?:leftover|left-?over|orphaned?|hung)\s+(?:git\s+)?lock|lock\s?files?\s+(?:left|held|from)|machine\s+load|load\s+average|load\s*\(?[0-9]|disk\s+(?:was\s+)?(?:full|space)|(?:no|out\s+of)\s+(?:disk\s+)?space|network\s+(?:outage|was\s+down|is\s+down)|from\s+other\s+agents|other\s+(?:agents|sessions|processes)\b|zombie\s+process|stuck\s+process)'

[sibling_sweep.attributed_re]
doc = "Regex source of a cause that is quoted from someone else's report (an agent, worker, lane, reviewer or Codex says it, or 'according to', 'the report says'): it is the report's claim, not a finding the assistant states itself, so it is no cause statement here. First-person findings ('I found the root cause') never match."
value = '\b(?:(?:sub)?agents?|workers?|lanes?|reviewers?|auditors?|critics?|codex|explorers?|builders?|the\s+report|reports?)(?:.s)?\s+(?:report(?:s|ed)?|says?|said|found|finds|claims?|claimed|states?|stated|notes?|noted|identified|diagnosed|blames?|blamed|attributes?|attributed|summary|result|finding)\b|\b(?:agent|lane|worker|subagent|codex|reviewer)\s+(?:report|summary|result|finding)s?\b|\baccording\s+to\b|\bper\s+the\s+(?:agent|report|lane|worker)\b'

[sibling_sweep.reported_speech_re]
doc = "Regex source of a speech verb with the word before it ('Alice said: ...', 'Bob told me that ...', 'the reviewer wrote, ...'): a self-correction cue inside such a sentence is someone else's claim, not the agent's own correction. The speaker is the whole word token the match starts in (a contraction is one token: I've, I'd, Alice's), with sibling_sweep.speech_aux_words skipped leftwards; when its base (the part before an apostrophe) is one of sibling_sweep.self_speakers the speech is the agent's own ('I said, ...', 'As I've said, ...', 'I have said, ...') and still counts. Applies to the self-correction family only."
value = '''\b\w+\s+(?:(?:said|says|wrote|writes|replied|replies|commented|claimed|claims|answered)|(?:told|tells|asked|asks)\s+\w+)(?:\s*[:,]|\s+that\b)'''

[sibling_sweep.speech_aux_words]
doc = "Lower-case words skipped leftwards between the speaker and the speech verb of sibling_sweep.reported_speech_re ('I have said', 'Bob just wrote'), so the speaker is the word before them."
value = ["have", "has", "had", "just", "also", "already", "then", "earlier", "once", "previously", "now"]

[sibling_sweep.self_speakers]
doc = "Lower-case speaker bases that are the agent itself: speech by one of them is the agent's own words, not reported speech (the base of I've and I'd is i)."
value = ["i"]

[sibling_sweep.prefilter_re]
doc = "Regex source of one cheap whole-text scan that every cue needs: text (or a sentence) with none of these words cannot hold a cause or self-correction statement, so the per-sentence guard and cue patterns are skipped and neutral text costs one regex pass. It must match a word of every shipped cause_cues and self_correction_cues entry (a test checks the shipped corpora); when either cue list is edited away from the shipped one the prefilter is not used, and an empty value turns it off."
value = '\b(?:cause[sd]?|culprit|bug|stems?|issue|problem|failure|crash|regression|defect|typo|mistake|slip|misspell\w*|misspelt|oversight|bad|fault|should\s+have|wrong|incorrect|mistyped)'

[sibling_sweep.meta_re]
doc = "Regex source of mentions of the root-cause machinery itself (the skill, the nudge, a guard, a protocol): a sentence that holds one is about the tooling, not a bug cause."
value = '\broot[- ]cause[- ](?:claim|attribution|statement|skill|nudge|guard|hook|protocol|discipline|playbook|analysis|investigation|check|rule|section|step|field|label|column|template|tracer|nudges)\b|anti-hall:root-cause|/root-cause|root-cause\.md|root_cause|\brca\b'

[sibling_sweep.fence_re]
doc = "Regex source of a fenced code block (backtick or tilde fence), which is removed before matching (code and logs are not statements)."
value = '```[\s\S]*?```|~~~[\s\S]*?~~~'

[sibling_sweep.code_span_double_re]
doc = "Regex source of a double-backtick inline code span. It is blanked over the whole reply before it is split into sentences (so a span that holds a terminator is masked as one piece), before code_span_single_re, so a phrase inside one is no statement."
value = '``.*?``'

[sibling_sweep.code_span_single_re]
doc = "Regex source of a single-backtick inline code span (one line at most), blanked over the whole reply after code_span_double_re and before it is split into sentences, so a phrase inside one is no statement."
value = '`[^`\n]*`'

[sibling_sweep.quote_chars_re]
doc = "Regex source of the characters that may open or close an inline quotation or be an apostrophe (straight and curly quotes). One scan of the code-masked reply finds them; each is then classified by its neighbours and paired per line (sibling_sweep.quote_pairs, sibling_sweep.apostrophes): the quotations found are blanked before the self_correction_cues are matched, because someone else's words quoted in the reply are not the agent's own correction. The scan runs over the whole reply after the code spans are blanked (a quote character inside a code span is inert) and before it is split into sentences, so a quotation that holds a terminator is masked as one piece."
value = "[\"'\u201c\u201d\u2018\u2019]"

[sibling_sweep.quote_pairs]
doc = "The quotation delimiters, each an opener and a closer (two characters; the same character twice for a straight quote). A character opens when no word character precedes it and no space follows it, and closes when no word character follows it and no space precedes it; quotations pair per line, nest, and one left open at the end of its line masks the rest of that line (fail open) but never the next."
value = ['""', "''", "\u201c\u201d", "\u2018\u2019"]

[sibling_sweep.apostrophes]
doc = "The characters that are also apostrophes. Between two word characters one is part of the word (don't, I've, Alice's) and never a delimiter; the reported-speech speaker token includes it."
value = ["'", "\u2019"]

[sibling_sweep.plural_possessive_end]
doc = "Word endings (lower-case characters) after which an apostrophe closer may be a plural possessive (the files' names): it closes its quotation only when no later closer of the same quotation comes on the line before the next opener of that kind. After any other word character it closes."
value = ["s"]

[sibling_sweep.word_char_class]
doc = "A JavaScript (u-flag) character class of the word characters the quotation tokenizer sees as a quote character's neighbours."
value = '[\p{L}\p{N}\p{M}_]'

[sibling_sweep.quote_line_re]
doc = "Regex source of a quoted line (a Markdown quote), removed before matching."
value = '(?m)^[ \t]*>.*$'

[sibling_sweep.strip_chars]
doc = "Characters removed from the text before matching (markdown emphasis markers), so a bold 'Root cause:' label reads as plain text."
value = "*"

[sibling_sweep.terminators]
doc = "Characters that end a sentence when followed by white space or the end of the text (a newline and a semicolon always end one)."
value = ".!?"

[sibling_sweep.hard_breaks]
doc = "Characters that always end a sentence (a newline and a semicolon)."
value = "\n;"

[sibling_sweep.question_terminator]
doc = "The terminator that makes a sentence a question; a question is never a cause statement."
value = "?"

[sibling_sweep.code_span]
doc = "The character that opens and closes an inline code span; the first span of the cause sentence names the pattern in the reminder."
value = "`"

[sibling_sweep.fix_context_re]
doc = "Regex source of fix words: the reply is about a bug being fixed (an edit tool call in the turn also makes it a fix context)."
value = '\b(?:fix(?:ed|es|ing)?|patch(?:ed|es)?|resolv(?:ed|es|ing)|repair(?:ed|s)?|correct(?:ed|s)?|hotfix(?:ed)?|workaround|mitigat\w+|regress\w*|bugfix)\b'

[sibling_sweep.sweep_statement_re]
doc = "Regex sources, any of which is an explicit statement that other occurrences were searched for ('searched for other occurrences', 'no other occurrences', 'all call sites fixed', 'sibling sweep')."
value = [
  '\b(?:searched|grepp?ed|scanned|swept|checked|looked|audited|rg|ran)\b[^.\n]{0,60}\b(?:other|similar|same|sibling|remaining|all|every)\b[^.\n]{0,40}\b(?:occurrences?|instances?|sites?|places?|call\s?sites?|usages?|callers?|patterns?|spots?|copies)\b',
  '\bno\s+(?:other|more|further|remaining|similar)\s+(?:occurrences?|instances?|sites?|places?|usages?|call\s?sites?|callers?|copies|spots)\b',
  '\b(?:all|every)\s+(?:other\s+)?(?:occurrences?|instances?|sites?|call\s?sites?|usages?|copies)\b[^.\n]{0,40}\b(?:fixed|updated|covered|handled|checked|audited|listed|patched)\b',
  '\bsame\s+pattern\b[^.\n]{0,60}\b(?:elsewhere|nowhere|none|only|not\s+found|no\s+other|also)\b',
  '\b(?:only|sole)\s+(?:occurrence|instance|site|place|caller|usage)\b',
  '\bsibling[- ]sweep\b',
]

# ---- the tool evidence --------------------------------------------------------------------------------------

[sibling_sweep.search_tools]
doc = "Tool names whose use is a codebase search (matched exactly)."
value = ["Grep", "Glob"]

[sibling_sweep.search_tool_re]
doc = "Regex source of tool names that are searches by their name (MCP structural search, find-references, ripgrep servers)."
value = '(?:^|__)(?:ast_grep_search|lsp_find_references|rip_grep_packages|grep|find_references)$'

[sibling_sweep.bash_tool]
doc = "The tool name of a shell call, whose command is read for a search program."
value = "Bash"

[sibling_sweep.bash_search_re]
doc = "Regex source of a shell command that searches the codebase: rg, grep and relatives as a command word, git grep, git log -S/-G/--grep."
value = '(?:^|[\s;&|(`])(?:rg|grep|egrep|fgrep|ugrep|ag|ack)(?:\s|$)|\bgit\s+(?:-C\s+\S+\s+)?(?:grep|log\s+(?:-[SG]|--grep))'

[sibling_sweep.agent_tools]
doc = "Tool names that start a subagent; one whose subagent type is a search agent counts as a search."
value = ["Agent", "Task"]

[sibling_sweep.search_agent_types]
doc = "Subagent types that are search agents."
value = ["Explore", "explore", "oh-my-claudecode:explore"]

[sibling_sweep.edit_tools]
doc = "Tool names that change a file; one in the turn makes it a fix context."
value = ["Edit", "Write", "MultiEdit", "NotebookEdit"]

[sibling_sweep.f_tool_name]
doc = "Content block field holding the tool name."
value = "name"

[sibling_sweep.f_tool_input]
doc = "Content block field holding the tool input."
value = "input"

[sibling_sweep.f_command]
doc = "Tool input field holding a shell command."
value = "command"

[sibling_sweep.f_subagent_type]
doc = "Tool input field holding a subagent's type."
value = "subagent_type"

# ---- state and telemetry ------------------------------------------------------------------------------------

[sibling_sweep.state_prefix]
doc = "Prefix of the per-scope state file name under the state directory (the sanitised session id, the agent id and the JSON extension follow)."
value = "sibling-sweep"

[sibling_sweep.state_session_max]
doc = "The most characters of the session id and of the agent id in the state file name."
value = 80
unit = "chars"
min = 8
max = 200

[sibling_sweep.log]
doc = "The telemetry log, relative to the anti-hall home directory: one JSON line per detected cause statement (reminded, swept, capped, duplicate, no fix context) and per resolved follow-through; holds no message text, only hashes and counts."
value = "logs/sibling-sweep.ndjson"

[sibling_sweep.log_max_bytes]
doc = "The telemetry log is emptied before an append once it is larger than this (the same bound as the other guard logs)."
value = 1048576
unit = "bytes"
min = 1024

# ---- the reminder -------------------------------------------------------------------------------------------

[sibling_sweep.msg_what]
doc = "What happened, in the reminder. Placeholder: {pattern} (the pattern named from the cause statement, or empty)."
value = "this fix has no recorded search for the same cause elsewhere."

[sibling_sweep.msg_pattern]
doc = "The text that names the pattern in the reminder. Placeholder: {pattern}."
value = " ({pattern})"

[sibling_sweep.msg_why]
doc = "Why it matters, in the reminder."
value = "The same cause may affect more than one place."

[sibling_sweep.msg_instead]
doc = "What to do, in the reminder."
value = "search for the same cause and report other matches."

[sibling_sweep.msg_allowed]
doc = "What stays allowed, in the reminder."
value = "If there are no other matches, report the search and that result."

[sibling_sweep.msg_override]
doc = "How to turn the reminder off, in the reminder."
value = "tell the agent \"skip sibling-sweep\""

[sibling_sweep.what_log]
doc = "The {what} of `msg_log_failed` when the telemetry log cannot be written."
value = "the telemetry log"

[sibling_sweep.what_transcript]
doc = "The {what} of `msg_log_failed` when the transcript cannot be read."
value = "the transcript read"

[sibling_sweep.what_state]
doc = "The {what} of `msg_log_failed` when the per-scope state file cannot be read or written."
value = "the state file"

[sibling_sweep.msg_log_failed]
doc = "Daemon log line, written once per process, when the telemetry log or the state file cannot be written. Placeholders: {what}, {error}."
value = "sibling-sweep: cannot write {what}: {error}"

[sibling_sweep.msg_bad_setting]
doc = "Daemon log line, written once per process, when a settings file holds an invalid value for a sibling_sweep setting (a pattern that does not compile, a rejected config file); the shipped value is used instead. Placeholder: {setting}."
value = "sibling-sweep: ignoring an invalid value ({setting}), using the shipped one"

# ---- the self-correction counters ---------------------------------------------------------------------------

[metric.sibling_sweep_self_correction_fired]
doc = "Sibling-sweep reminders sent because a reply reported fixing the agent's own typo or mistake (the self_correction_cues family) and the turn showed no search for other occurrences."
value = { kind = "counter", unit = "reminders", labels = [] }

[metric.sibling_sweep_self_correction_suppressed]
doc = "Self-correction statements that did not remind, by reason: no_fix_context, swept (a search or a sweep statement was already there), continuation (the Stop already continues a Stop block), duplicate (the same cause was reminded this turn) or capped (the per-scope limit was reached)."
value = { kind = "counter", unit = "statements", labels = ["reason"] }

[metric.sibling_sweep_self_correction_followed_through]
doc = "Self-correction reminders after which a search tool call followed within sibling_sweep.follow_window tool calls."
value = { kind = "counter", unit = "reminders", labels = [] }
