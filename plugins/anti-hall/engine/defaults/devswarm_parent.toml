value = "wake-watch-"

[devswarm_parent.watch_lock_suffix]
doc = "The file name suffix of a mailbox watcher lock."
value = ".lock"

[devswarm_parent.wake_both]
doc = "The wake-path line when neither the watcher nor the cron tick is alive. Placeholders: {mon}, {cron}."
value = "NO MAILBOX WAKE PATH: you have live workspaces but no watcher and no recent mailbox tick. Do both now: (1) {mon} (2) {cron}."

[devswarm_parent.wake_tick]
doc = "The wake-path line when only the cron tick is missing. Placeholder: {cron}."
value = "NO MAILBOX TICK: you have live workspaces but no recent mailbox tick (session crons do not survive a restart). {cron}."

[devswarm_parent.wake_monitor]
