value = "CronList, then CronCreate \"{cron}\" running `{cli} inbox tick {id} --quiet` if absent"

[devswarm_parent.key_wake]
doc = "The emit-dedupe key of the wake-path line."
value = "parent-inbox-no-wake-path"

[devswarm_parent.drift_head_bytes]
doc = "How much of the start of a session transcript the drift check reads to find its working directory."
value = 65536

[devswarm_parent.drift_max_scan]
doc = "Most session transcripts of a worktree the drift check opens, newest first (MAX_SCAN)."
value = 25

[devswarm_parent.drift_cache_ms]
doc = "How long the list of a worktree's sessions (the project transcript directory read, every transcript stat-ed, the heads of the newest read) is reused by the drift check. It ran on every prompt of a parent session; a notice about a newer session is no worse for being a few seconds old. 0 = list every time. The first-line cwd of a transcript is cached per file (it never changes)."
value = 5000
min = 0
unit = "ms"

[devswarm_parent.drift_cache_keys_max]
doc = "Most worktrees whose session list the drift check keeps cached (the per-file cwd cache holds 64 times this); past it the cache is emptied."
value = 64
min = 1

[devswarm_parent.drift_cwd_re]
doc = "The pattern that finds the working directory a session transcript records (capture 1: the JSON string body)."
value = '"cwd"\s*:\s*"((?:[^"\\]|\\.)*)"'

[devswarm_parent.js_object_text]
doc = "What JavaScript's String() makes of an object (a session id field that holds one reads as this text)."
value = "[object Object]"

[devswarm_parent.drift_sid_re]
doc = "The shape of a session id the drift check accepts (SID_RE)."
value = "^[A-Za-z0-9._-]+$"

[devswarm_parent.key_drift]
doc = "The emit-dedupe key of the session-drift notice."
value = "parent-inbox-session-drift"

[devswarm_parent.drift_keepalive]
doc = "Turns after which the session-drift notice is repeated."
value = 20

[devswarm_parent.drift_notice]
doc = "The notice that a newer session of this worktree is active. Placeholders: {newest}, {anchor}."
