[defect.subject_version]
doc = "A fix subject that names its own release (case-insensitive); group 2 is the version."
value = "^fix(\\([^)]*\\))?!?:\\s*v(\\d+\\.\\d+(?:\\.\\d+)?)\\b"

[defect.tag_re]
doc = "A release tag."
value = "^v?\\d+\\.\\d+\\.\\d+$"

[defect.version_re]
doc = "A version given to --since."
value = "^v?\\d+\\.\\d+\\.\\d+$"

[defect.cl_heading]
doc = "A changelog release heading; group 1 is the version."
value = "^##\\s+v?(\\d+\\.\\d+\\.\\d+)\\b"

[defect.cl_any_heading]
doc = "Any changelog heading."
value = "^#"

[defect.cl_bullet]
doc = "A changelog bullet; group 1 is its text."
value = "^[-*]\\s+(.*)$"

[defect.cl_continuation]
doc = "A continuation line of a changelog bullet."
value = "^\\s+\\S"

[defect.changelog_file]
doc = "The changelog read by `backfill`, at the repository root."
value = "CHANGELOG.md"

[defect.stop_words]
doc = "Words ignored when matching a new bug against past fixes."
value = "the and for not but with from into that this than then when what does never now its it's are was were has have had can could should would will all any one two out off via per fix fixes fixed only also still just more less new old instead again after before"

[defect.git_bin]
doc = "The git program `backfill` runs."
value = "git"

[defect.git_dir_flag]
doc = "The git flag that names the repository directory."
value = "-C"

[defect.rs_char]
doc = "Separates commits in the git log format."
value = "\u001e"

[defect.us_char]
doc = "Separates the fields of a commit in the git log format."
value = "\u001f"

[defect.git_log_args]
doc = "The arguments of the git log that lists the commits ({rs} and {us} are the two separators)."
value = ["log", "--no-merges", "--no-renames", "--numstat", "--format={rs}%H{us}%aI{us}%s{us}%b{us}"]

[defect.git_tag_args]
doc = "The arguments of the git command that lists the tags."
value = ["tag", "--list"]

[defect.git_revlist_args]
doc = "The arguments of the git command that lists the commits under a tag."
value = ["rev-list", "{tag}"]

[defect.git_spawn_failed]
doc = "Why git could not run. Placeholder: bin."
