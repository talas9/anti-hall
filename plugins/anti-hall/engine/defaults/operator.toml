# ah-engine shipped defaults for the operator command-line tools (L9a): `settings`, `defect` and `statusline` (the `src/ops/`
# module). Format: see the header of engine.toml.
#
# The message texts are the Node tools' own, word for word, because the parity tests compare the commands' output with the
# scripts' byte for byte. Generated by ~/.anti-hall/work/cli-a-scratch/gen_toml.py during the port; edit this file directly from now on.

[ops.defer_exit]
doc = "Exit code of an operator command that leaves the work to the Node tool because it cannot reproduce the Node behaviour exactly (nothing is written)."
value = 75

[ops.list_sep]
doc = "Separator of the values listed in a settings message."
value = ", "

[ops.empty_value]
doc = "How `settings` prints an empty or missing value."
value = "(empty)"

[ops.code_quote]
doc = "The quote around an object value in the settings tables."
value = "`"

[ops.cell_sep]
doc = "Between two cells of a settings table row."
value = " | "

[ops.rule_cell]
doc = "One header-rule cell of a settings table."
value = "---"

[ops.heading_prefix]
doc = "In front of a section label in `settings show`."
value = "## "

[ops.table_headers]
doc = "The columns of a settings table."
value = ["Setting", "Value", "Default", "Source", "Description"]

[ops.table_headers_integrations]
doc = "The columns of the Jev integrations table."
value = ["Integration", "Effective", "Configured", "Source", "Logs to"]

[ops.advanced_suffix]
doc = "After the name of an advanced setting in the tables."
value = " (advanced)"

[ops.locked_suffix]
doc = "After the name of a safety setting in the tables."
value = " (safety: needs --confirmed)"

[ops.advanced_label]
doc = "Heading of the advanced settings table."
value = "**Advanced:**"

[ops.advanced_hidden]
doc = "Line shown when a section has advanced settings and `--all` was not given. Placeholder: count."
value = "_{count} advanced setting(s) hidden — rerun with `--all` to show them._"

[ops.integrations_title]
