[ops.not_toggleable_intro]
doc = "Introduction of the list of parts without a switch."
value = "These parts have no switch on purpose:"

[ops.not_toggleable_line]
doc = "One part without a switch. Placeholders: name, reason."
value = "- `{name}`: {reason}"

[ops.settings_sources]
