# ah-engine shipped mesh-writer defaults (D45, stage 2): the mesh CLI verbs that WRITE the per-repo DevSwarm store
# (`ah-engine mesh <devswarm.js argv>`), with Node's schema, statements, locking and output. Format: see the header of
# engine.toml. Every name, path, text and limit the port of scripts/devswarm.js and companion/lib/devswarm-store.js
# uses lives here; the values are Node's own (cited per key).

# ---- store and statements (companion/lib/devswarm-store.js) -------------------------------------------------------

[mesh_write.store_file]
doc = "File name of a per-repo store (`devswarm.db`)."
value = "devswarm.db"

[mesh_write.broadcast_partition]
doc = "The shared partition every broadcast and heartbeat row lands in (Node's BROADCAST_PARTITION_ID)."
value = "*mesh-broadcast*"

[mesh_write.mtype_direct]
doc = "The `mtype` of a direct message."
value = "direct"

[mesh_write.mtype_broadcast]
doc = "The `mtype` of a broadcast (also `send --type broadcast`)."
value = "broadcast"

[mesh_write.mesh_hash_prefix]
doc = "Prefix of a store-direct mesh message's dedupe hash (Node's meshMessageHash namespace)."
value = "mesh:"

[mesh_write.messages_added_columns]
doc = "The additive `messages` columns Node's ensureMessagesMeshColumns adds to an older table, in Node's order, as `name TYPE`."
value = ["sender TEXT", "recipient TEXT", "mtype TEXT", "urgency TEXT", "is_heartbeat INTEGER", "seq INTEGER", "needs_reply INTEGER", "orig_hash TEXT", "instance_nonce TEXT"]

[mesh_write.write_seq_column]
doc = "The registry's per-row write counter column (Node's ensureRegistryWriteSeqColumn)."
value = "write_seq"

[mesh_write.busy_retries]
doc = "Attempts of a write that meets SQLITE_BUSY after the busy timeout (Node's SQLITE_BUSY_MAX_RETRIES)."
value = 5
min = 1
max = 100

[mesh_write.busy_retry_base_ms]
doc = "Fixed part of the sleep between those attempts, in milliseconds (Node: 20)."
value = 20
min = 0
max = 10000

[mesh_write.busy_retry_jitter_ms]
doc = "Random part of that sleep, in milliseconds (Node: up to 40)."
value = 40
min = 0
max = 10000

[mesh_write.busy_text]
doc = "Lower-cased text of a SQLite busy error (Node's isSqliteBusyError also matches it)."
value = "database is locked"

[mesh_write.backend_journal]
doc = "The marker text of Node's journal backend; a store pinned to it is Node's alone."
value = "journal"

[mesh_write.env_store_backend]
doc = "The variable that forces Node's store backend (ANTIHALL_DEVSWARM_STORE_BACKEND)."
value = "ANTIHALL_DEVSWARM_STORE_BACKEND"

# ---- the per-workspace lock (scripts/devswarm-lib/core.js acquireIdLock, companion/lib/recovery.js acquireLock) ----

[mesh_write.id_lock_budget_ms]
doc = "How long one acquire keeps retrying a lock held by a live, fresh holder before the verb reports lockBusy (Node: 2000)."
value = 2000
min = 0
max = 60000

[mesh_write.id_lock_step_ms]
doc = "Pause between those retries, in milliseconds (Node: 25)."
value = 25
min = 1
max = 10000

[mesh_write.id_lock_stale_ms]
doc = "A lock older than this is taken over whoever holds it (Node's LOCK_STALE_MS, 15 minutes)."
value = 900000
min = 1000
max = 86400000

[mesh_write.id_lock_reclaim_stale_ms]
doc = "A takeover marker (`<lock>.reclaim`) older than this is abandoned (lock.js RECLAIM_STALE_MS)."
value = 5000
min = 100
max = 600000

[mesh_write.id_lock_release_tries]
doc = "Attempts a release makes to take the takeover marker (lock.js RELEASE_SIDECAR_TRIES)."
value = 5
min = 1
max = 100

[mesh_write.id_lock_release_step_ms]
doc = "Pause between those attempts (lock.js RELEASE_SIDECAR_STEP_MS)."
value = 10
min = 1
max = 10000

[mesh_write.id_lock_boot_slop_s]
doc = "Two boot times this close are one boot (lock.js BOOT_SLOP_S)."
value = 5
min = 0
max = 3600

[mesh_write.send_lock_attempts]
doc = "Whole lock acquisitions a direct send tries before reporting lockBusy (Node's SEND_LOCK_RETRY_ATTEMPTS)."
value = 3
min = 1
max = 20

[mesh_write.send_lock_retry_base_ms]
doc = "Backoff base between those attempts: base * 2^attempt plus up to base of jitter (Node's SEND_LOCK_RETRY_BASE_MS)."
value = 150
min = 0
max = 60000

[mesh_write.send_lock_max_shift]
doc = "Cap on the backoff exponent (a guard; Node's 3 attempts never reach it)."
value = 8
min = 0
max = 30

[mesh_write.lock_suffix]
doc = "File-name suffix of a lock file."
value = ".lock"

