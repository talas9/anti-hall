[mesh_write.reroute_incoherent]
doc = "Why a send was rerouted: the addressed row is live but its session runs in another checkout (`rerouteReason`)."
value = "session-worktree-incoherent"

[mesh_write.reroute_not_live]
doc = "Why a send was rerouted: the addressed row is not live and a live row of the same session exists (`rerouteReason`)."
