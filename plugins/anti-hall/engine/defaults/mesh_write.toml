doc = "Size past which the Jev triage log is rotated before a row is appended (jev-triage.js CACHE_LOG_MAX_BYTES)."
value = 1048576
min = 1

[mesh_write.jev_answered_type]
doc = "The `type` of the Jev triage log row written when a labeled message is answered."
value = "answered"

[mesh_write.jev_outcome_id]
doc = "The integration id of the Jev outcome row an answered labeled message records."
value = "triage"

[mesh_write.jev_outcome_value]
doc = "The outcome of that row."
value = "answered"

[mesh_write.jev_outcome_source]
doc = "The source of that row."
value = "triage-answer-latency"

[mesh_write.metric_jev_arrival_skipped]
doc = "Counter bumped when a direct send would have queued its text for Jev arrival labelling: the queue's drain worker was a Node process, which is not part of the live path, so nothing is queued."
value = "mesh_jev_arrival_skipped"

[mesh_write.file_read_hard_max_bytes]
doc = "Hard limit on a mesh file read through a path from a descriptor or a session record: Node's own string limit for `readFileSync(.., 'utf8')`, where its read fails too. A larger file is read as absent, counted and logged (reason `read_why_over_hard`). A FIFO, socket or device (whose read could block a worker for good) is read as absent the same way (reason `read_why_not_regular`)."
value = 536870888
min = 1024

[mesh_write.site_read_bounded]
doc = "The site named in the count and log of a bounded mesh file read made without a more specific site."
value = "read_bounded"

[mesh_write.read_why_not_regular]
doc = "The reason a mesh file read was skipped: the path is no regular file (a FIFO, socket or device)."
value = "not-a-regular-file"

[mesh_write.read_why_over_hard]
doc = "The reason a mesh file read was skipped: the file is past `file_read_hard_max_bytes`."
value = "file-over-hard-cap"

[mesh_write.read_why_over_soft]
doc = "The reason a mesh file read was counted and logged: the file is past `file_read_max_bytes` but was read."
value = "file-over-soft-cap"

[mesh_write.refusal_prefix]
doc = "What starts the reason of a deferral that is really the verb's own refusal (Node's `{ ok: false, ... }` result, exit `exit_refused`): the rest of the reason is the refusal's JSON body. Such a reason is printed, never handed on."
value = "refusal:"

[mesh_write.exit_refused]
doc = "Exit code of a verb's own refusal (Node's `{ ok: false }` result)."
value = 2
min = 1
max = 255

[mesh_write.result_refused]
doc = "Log result of a call the verb refused itself."
value = "refused"

[mesh_write.reason_seat_conflict]
doc = "The reason of a send, ack, spawn, merge or correct refused because another live session holds the Primary seat."
value = "primary-seat-conflict"

[mesh_write.reason_legacy_journal_store]
doc = "The reason a verb refuses a project whose mesh store is pinned to (or forced onto) the legacy journal backend, which only a Node older than 22.5 wrote and which no longer has a reader."
value = "legacy-journal-store"

[mesh_write.msg_legacy_journal_store]
doc = "The refusal text of that case: {repo_key} is the project's store."
value = "the mesh store of project {repo_key} uses the legacy journal backend (written by a Node older than 22.5), which this version cannot read or write; nothing was done. Move its data into the sqlite store with `doctor --repair`, or remove the BACKEND marker and the journal directory if the store holds nothing you need"

[mesh_write.heal_cooldown_flag]
doc = "The self-heal result field set while the cooldown of an earlier installer attempt has not elapsed (`daemonHealCooldown`)."
value = "daemonHealCooldown"

[mesh_write.heal_retry_after]
doc = "The self-heal result field naming the remaining cooldown in milliseconds (`retryAfterMs`)."
value = "retryAfterMs"

[mesh_write.msg_registry_unreadable]
doc = "The refusal text of a verb whose workspace registry could not be read; `{why}` is the reason."
value = "the workspace registry could not be read: {why}"

[mesh_write.msg_descriptor_field_shape]
doc = "The refusal text of a workspace descriptor whose field is not text; `{field}` is the field."
value = "workspace descriptor field {field} is not text"

[mesh_write.held_wal_unreadable]
doc = "The reason the reconcile sweep leaves a workspace's pull undone: its delivery log cannot be read."
value = "wal-unreadable"

[mesh_write.held_wal_spilled]
doc = "The reason the reconcile sweep leaves a workspace's pull undone: its delivery log holds spilled batches (the pull itself absorbs them under its lock)."
value = "wal-spilled"

[mesh_write.held_wal_foreign]
doc = "The reason the reconcile sweep leaves a workspace's pull undone: another reader holds open batches in the delivery log."
value = "wal-foreign"
