# ah-engine shipped defaults: process, paths, limits, timeouts, protocol options and health policy (D17).
#
# Format. Every setting is a table `[section.name]` with:
#   value  the default (number, string, list or table)
#   doc    what it is, in one sentence (a test fails if it is missing)
#   env    optional: the environment variable that overrides a numeric value for one process
#   min / max  optional clamps for a numeric value
# Code reads these through `ah_engine::defaults`; nothing here is repeated in Rust. The engine reads these files from the plugin
# at run time (start-up, plugin update, file change) and nothing is compiled into the binary: tune the engine by editing here.

# ---- environment variable names -------------------------------------------------------------------------

[env.debug]
doc = "When set to anything but 0 or empty, turns debug mode (diagnostics.debug_mode) on for that process."
value = "AH_ENGINE_DEBUG"

[env.dir]
doc = "Overrides the state directory (default: base_dir/state_dir under the home directory)."
value = "AH_ENGINE_DIR"

[env.done_file]
doc = "A file the dispatcher creates once it has dispatched an event and decided its exit code (D87). The thin client sets it, so that an engine exit code of a hook's own (1, say) is told from an engine failure and is not answered by running every hook a second time."
value = "AH_ENGINE_DONE_FILE"

[env.wait_file]
doc = "A file the client creates while it waits on the daemon and keeps when the daemon answered BUSY/ERR, so the call is handed to its Node hooks; it removes it when the daemon answered with nothing left for Node to decide (an OK reply whose entries defer to Node hooks keeps it until the call's final result is ready), gave no reply in the wait window, or none was there. The thin client sets it, so that its watchdog can tell a call that is still deciding (give it up to client.slow_fallback_max_ms) from a hung engine (kill at the normal budget)."
value = "AH_ENGINE_WAIT_FILE"

[env.fail_open_file]
doc = "A file the client appends one line to (`<reason> <check>`) for every engine-level fail-open the daemon reported in a reply (GitHub #201). The launcher sets it inside its per-call run directory and counts the lines after the engine exits, so its own stats and log know the call failed open."
value = "AH_ENGINE_FAIL_OPEN_FILE"

[env.rules]
doc = "Overrides the rules file path."
value = "AH_ENGINE_RULES"

[env.version]
doc = "Overrides the version this build reports and compares for handoff (the plugin version in production, arbitrary in tests)."
value = "AH_ENGINE_VERSION"

[env.hook_version]
doc = "Set by the hook launcher (ah-hook) on the engine client it runs, to the launcher's own build version. It travels with each request (`request_env.allow`) and the daemon reports the last one it saw as `hook_version` in status and pulse."
value = "AH_ENGINE_HOOK_VERSION"

[env.allocator]
doc = "Selects the daemon's allocator: jemalloc (default) or system. The client sets it from `diagnostics.allocator` on the daemon it spawns, unless it is already set; the daemon reads it before its first allocation."
value = "AH_ENGINE_ALLOCATOR"

[env.auto_update]
doc = "Read by `ah-hook update --auto`: off, stable or dev overrides the `engine.autoUpdate` setting for one run."
value = "AH_ENGINE_AUTO_UPDATE"

[env.bin]
doc = "Test-only: the engine binary the thin client runs instead of the installed one. The thin client ignores it unless AH_WRAPPER_TEST=1 is also set, so a stray value can never turn the safety net into a silent allow."
value = "AH_ENGINE_BIN"

[env.bootstrap]
doc = "Set to 0 or 1 to turn the automatic download of the sha256-pinned engine binary off or on (default off: the explicit install is `sh hooks/install.sh --download`); overrides the `engine.bootstrap` setting. Read by `ah-hook install --auto` and hooks/install.sh."
value = "AH_ENGINE_BOOTSTRAP"

[env.install_lock_token]
doc = "Set by an installer (`ah-hook update`) for the integrity check: the token of the install lock it already holds, so recording the expected sha256 runs under the caller's hold instead of waiting on it."
value = "AH_ENGINE_INSTALL_LOCK_TOKEN"

[env.release_base]
doc = "Test-only: download base URL for the engine binary (http allowed). Honored by `ah-hook install` and hooks/install.sh only with AH_WRAPPER_TEST=1."
value = "AH_ENGINE_RELEASE_BASE"

[env.wrapper_diag]
doc = "Test-only: absolute path of a file the thin client appends its diagnostic lines to. Honored only with AH_WRAPPER_TEST=1."
value = "AH_ENGINE_WRAPPER_DIAG"

[env.nospawn]
doc = "When set, the client never starts a daemon (tests, and hosts that manage the daemon themselves)."
value = "AH_ENGINE_NOSPAWN"

[env.test_hooks]
doc = "When set, the daemon accepts the test-only control verbs (sleep, stall, panic). Never set in production."
value = "AH_ENGINE_TEST_HOOKS"

[env.plugin_root]
doc = "Plugin install directory, used by built-in checks that build override commands (a rule's `options.plugin_root` wins)."
value = "AH_ENGINE_PLUGIN_ROOT"

[env.session]
doc = "Session id a `proj` write is spooled under; spooled writes keep their order per session (D24)."
value = "AH_ENGINE_SESSION"

[env.home]
doc = "Home directory variable."
value = "HOME"

[env.home_alt]
doc = "Fallback home directory variable (used by the git check when the home variable is unset)."
value = "USERPROFILE"

[env.tmpdir]
doc = "Temporary directory variable, used for the short-path socket fallback."
value = "TMPDIR"

# ---- paths and file names -------------------------------------------------------------------------------

[paths.base_dir]
doc = "Directory under the home directory that holds all anti-hall state."
value = ".anti-hall"

[paths.state_dir]
doc = "Engine state directory name inside base_dir (D53)."
value = "ah-engine"

[paths.live_state_dir]
doc = "Live-kit state directory name inside base_dir; excluded from scratch-daemon parent/socket orphan handling."
value = "ah-engine-live"

[paths.socket_file]
doc = "Socket file name inside the state directory."
value = "e.sock"

[paths.lock_suffix]
doc = "Suffix appended to the socket path for the singleton lock file."
value = ".lock"

[paths.rules_file]
doc = "Name of the user's rules file inside the state directory; when it exists its rules are merged over the plugin's by id (a known id changes that rule, a new id adds one; see layers.toml). It no longer replaces the plugin's file."
value = "rules.json"

[paths.plugin_rules_file]
doc = "The shipped rules file, relative to the plugin root (the engine reads it from the plugin, never from its own install)."
value = "engine/rules.json"

[paths.fallback_tmp]
doc = "Last-resort base for the short-path socket when TMPDIR is unset or too long."
value = "/tmp"

[paths.private_dir_prefix]
doc = "Prefix of the private per-user directory that holds a short-path socket (the uid is appended)."
value = "anti-hall-"

[paths.short_socket_ext]
doc = "Extension of a short-path socket file (its name is a stable hash of the state directory)."
value = ".sock"

[paths.socket_max_len]
doc = "Longest socket path used as is; unix socket paths are capped at 104 bytes on macOS (108 on Linux), so this leaves headroom."
value = 100
unit = "bytes"

[files.log]
doc = "Event log file name (state directory)."
value = "ah-engine.log"

[files.failure]
doc = "Last recorded failure, for the once-per-session advisory."
value = "failure.json"

[files.breaker_until]
doc = "Marker holding the time (ms since the epoch) until which the client breaker stays open."
value = "breaker.until"

[files.crashloop_until]
doc = "Marker holding the time until which respawning is stopped after a crash loop."
value = "crashloop.until"

[files.healthy_binary]
doc = "Holds the sha256 of the engine binary that last stayed up for daemon.healthy_after_s. The integrity check promotes that binary to the known-good copy; a binary with no entry here has never proven itself."
value = "healthy.binary"

[files.crashloop_bin]
doc = "Holds the size, modification time and sha256 of the binary the crash-loop rule tripped on. A cooldown ends early when the binary is replaced by a different one."
value = "crashloop.bin"

[files.rollback_request]
doc = "Written when the crash-loop rule trips on a binary with no healthy history: asks the integrity check to restore the known-good binary. Holds the sha256 of the binary to replace."
value = "rollback.request"

[files.rollback_last]
doc = "One line the integrity check writes when it rolls the engine binary back (time, reason, which binary was set aside). Shown by status and doctor."
value = "rollback.last"

[files.wrapper_fail_log]
doc = "Epoch seconds, one per line, of the thin client's engine failures (timeout, signal death, no answer). The integrity check counts them against rollback.fail_n."
value = "wrapper.fails"

[files.integrity_log]
doc = "Log of the integrity check (checks, promotions, roll-backs), inside the state directory."
value = "integrity.log"


[files.run_marker]
doc = "Written while a daemon runs; a leftover one with a dead pid is logged as one crash."
value = "daemon.run"

[files.unreachable_notice]
doc = "Holds the session id that already got the engine-unreachable notice, so the notice is shown once per session (the next session overwrites it)."
value = "unreachable.notice"

[files.cold_guard_notice]
doc = "Holds the session id that already got the cold-start notice, so the notice is shown once per session (the next session overwrites it)."
value = "cold-guard.notice"

[files.daemon_down_marker]
doc = "Short-lived client marker: when a hook client finds the daemon absent or hung, other clients skip connecting until this expires."
value = "daemon.down.until"

[files.slow_streak]
doc = "Client marker holding the count of consecutive slow (late) daemon replies and when the streak began; a normal reply removes it."
value = "daemon.slow.streak"

[files.heartbeat]
doc = "The daemon's liveness heartbeat: names the daemon's process generation, one field per line (pid, start time and executable as the operating system reports them, and the state dir); the watchdog thread touches its modification time at the start of every daemon.watchdog_tick_ms tick, before any maintenance, apart from request handling. A client past its deadline reads it to tell a slow daemon (heartbeat fresh) from a stopped or wedged one (stale, see client.heartbeat_stale_ms)."
value = "daemon.heartbeat"

[files.heartbeat_suspect]
doc = "Client suspicion carried between hook calls: when a stale heartbeat (client.heartbeat_stale_ms) was first seen (monotonic clock), and which heartbeat (modification time and generation). A later call confirms the hang only when that same heartbeat is still unchanged client.heartbeat_confirm_ms later."
value = "daemon.heartbeat.suspect"

[files.spawn_lock]
doc = "Short-lived client single-flight lock: only the client that creates it attempts to restart a missing daemon."
value = "daemon.spawn.lock"

[files.crash_breadcrumb]
doc = "Last request/job/check breadcrumb written at boundary entry so an abnormal exit can be reported with context on the next start."
value = "crash-breadcrumb.json"

[files.last_crash]
doc = "Last panic or stale-run-marker crash report, shown by status and doctor."
value = "last-crash.json"

[files.cli_crash]
doc = "Last panic of a non-daemon process (a CLI verb or the hook client). Kept apart from last-crash.json so it never counts as a daemon crash or restart."
value = "cli-crash.json"

[files.reaped_prefix]
doc = "Prefix of the temporary name a stale run marker is renamed to when it is claimed (the pid is appended)."
value = "daemon.run.reaped."

[files.starts]
doc = "Counter of daemon starts, surfaced as `starts` and `restarts` in status."
value = "starts"

[files.spool]
doc = "The write spool: project writes a client could not deliver, applied by the daemon in order (D24)."
value = "spool.log"

[files.telemetry_inbox]
doc = "Events recorded by processes other than the daemon (the hook dispatcher, one-shot commands), one JSON line each, in the state directory; the daemon reads and empties it on every telemetry flush."
value = "telemetry-inbox.jsonl"

[files.spool_quarantine]
doc = "Spool records that could not be parsed or that the store refused for good, kept with their reason, never dropped (D24)."
value = "spool.quarantine"

[files.backups_dir]
doc = "Directory inside the state directory that holds backups and pre-restore snapshots (D27); nothing in it is ever deleted by the engine."
value = "backups"

[files.schedules_override]
doc = "User overrides of the shipped schedules (D33): JSON, `{\"jobs\": {\"<name>\": {...}}}`; read when the daemon starts."
value = "schedules.json"

[files.advised_dir]
doc = "Directory with one empty file per session that has already seen the failure advisory."
value = "advised"

# ---- daemon limits --------------------------------------------------------------------------------------

[daemon.workers]
doc = "Worker threads evaluating requests."
value = 4
env = "AH_ENGINE_WORKERS"
min = 1
max = 32

[daemon.queue]
doc = "Connections that may wait for a worker; beyond this the daemon answers BUSY and the client falls back."
value = 16
env = "AH_ENGINE_QUEUE"
min = 1
max = 1024

[daemon.max_request]
doc = "Largest request the daemon reads; the client sends nothing larger (it falls back instead)."
value = 1048576
env = "AH_ENGINE_MAX_REQUEST"
unit = "bytes"

[daemon.read_ms]
doc = "Total time a client has to deliver its request."
value = 1000
env = "AH_ENGINE_READ_MS"
unit = "ms"

[daemon.write_ms]
doc = "Time allowed to write a reply."
value = 1000
env = "AH_ENGINE_WRITE_MS"
unit = "ms"

[daemon.eval_soft_us]
doc = "SOFT per-request thread CPU budget for rule evaluation: a request that used more is logged (budget_soft) and counted, and every check keeps its answer. The HARD budget is daemon.eval_budget_us. 0 turns the warning off."
value = 200000
min = 0
unit = "us"

[daemon.request_hard_ms]
doc = "HARD deadline of a request, measured from its arrival (less daemon.reply_slack_ms): the point where a scripted check still running is cut and a check not yet started gets no answer: both take the check's failure policy (script.failure_mode_by_check). The SOFT deadline is client.deadline_ms (past it the request is logged as deadline_soft and counted, nothing is cut). A client whose daemon is alive waits for a late reply up to client.slow_fallback_max_ms less client.slow_wait_margin_ms and uses it, so this must stay below that window."
value = 2000
min = 1
unit = "ms"

[daemon.eval_budget_us]
doc = "HARD thread CPU budget of ONE check: a check that used more than this alone loses its own answer (counted answers_dropped reason `cpu_budget`) and takes its failure policy; the checks after it still run and answer, and the request as a whole is bounded by daemon.request_hard_ms. The SOFT budget (a warning only) is daemon.eval_soft_us. 0 turns the hard budget off."
value = 1000000
env = "AH_ENGINE_EVAL_BUDGET_US"
unit = "us"

[daemon.mem_mb]
doc = "Data-segment limit applied with setrlimit; 0 = none. It is a ceiling against runaway allocation, not a budget (the RSS cap is the budget), and Linux enforces it on thread stacks, so it must exceed daemon.workers times git.stack_mb plus headroom or a check thread cannot start. macOS does not support RLIMIT_DATA here, so the daemon reports unsupported and relies on the RSS/footprint cap."
value = 512
env = "AH_ENGINE_MEM_MB"
unit = "MB"

[daemon.mem_metric]
doc = "Which figure `daemon.rss_cap_kb` is compared with: `footprint` (the process's own memory: macOS physical footprint, Linux RssAnon + RssShmem; shared and reclaimable file pages are not counted) or `rss` (the kernel's resident set, which also counts shared code pages touched over time and made the daemon restart without a real leak). Falls back to the resident set where the platform has no footprint."
value = "footprint"

[daemon.mem_metric_rss]
doc = "The word that selects the resident set for `daemon.mem_metric`."
value = "rss"

[daemon.rss_cap_kb]
doc = "Owner decision 2026-10-23: the restart cap sits at the hard memory limit (mem.global_hard_bytes, 200 MB; 204800 KB = 209715200 bytes), never below it. Memory cap, compared with the figure `daemon.mem_metric` selects (default: the footprint, not the resident set); above it the daemon drains and exits cleanly and the next call starts a fresh one; 0 = none. The measurement below is of the resident set. Set from measurement, not guessed (DECISIONS.md 1.111, 2026-10-09): on the real-payload replay (2,113 recorded hook calls, unpaced, isolated home) the engine with 16 scripted checks sits at 69 MB after one pass and 78 MB after three (jemalloc, aarch64-apple-darwin), and at 102 MB after one pass with the system allocator (the x86_64-apple-darwin and musl builds, measured as a system-allocator build on this Mac); the live heap is 45-52 MB. The engine before the scripted checks (live4) measured 62 and 68 MB on the same replay, so the previous 64 MB cap (set from a synthetic soak with a 16-18 MB live heap) sat inside the steady state of both: the daemon restarted 4 times in 600 s and the crash-loop breaker sent every hook to Node. The cap sits above the larger figure with room for the slow growth both builds show on repeated passes (about 1.5 MB per 1,000 calls), so only real growth trips it."
value = 204800
env = "AH_ENGINE_RSS_CAP_KB"
unit = "KB"

[daemon.malloc_conf]
doc = "Allocator purge tuning handed to the daemon at start (jemalloc `malloc_conf` syntax): one arena for the four worker threads (less fragmentation) and decay 0 (freed pages go back to the OS at once; the system allocators keep them, which left RSS at 2.5x the live heap). Measured on 1000 mixed calls, this Mac: system allocator 45-48 MB RSS, jemalloc with only decay 0 37 MB, with narenas:1 as well 32 MB (live heap 16 MB), adding tcache:false 27 MB but p50 call latency 10 ms against 6.5-7 ms, so tcache stays on. tcache_max:1024 caches only blocks up to 1 KiB per thread: after the same 220-hook run on the shipped checks and a 300 MB transcript, footprint was 84.3-85.0 MB without it and 75.8-76.0 MB with it (tcache_max 2048: 73.2 against 79.3 on a shorter run, 512: 72.8 but p50 +1.5 ms), hook p50 11.2-13.5 ms without and 11.5-12.0 ms with it, daemon CPU 3.25-3.83 s without and 3.07-3.47 s with it. empty = the allocator's own defaults. A variable the caller already set is not overridden."
value = "narenas:1,dirty_decay_ms:0,muzzy_decay_ms:0,tcache_max:1024"

[daemon.malloc_conf_vars]
doc = "Environment variables the allocator reads its tuning from (the crate's prefixed name and the plain one)."
value = ["_RJEM_MALLOC_CONF", "MALLOC_CONF"]

[daemon.spawn_env_allow]
doc = "The only environment variables the daemon (`ah-engine serve`) is started with; everything else of the hook that happened to start it is dropped. A daemon outlives the session that spawned it and serves every later one, so a per-session value left in its environment (the session id, the DevSwarm workspace and role variables, `CLAUDE_PROJECT_DIR`, the git object-store variables of the hook's repository) would be read for all of them: the first session to spawn it would own it. Per-session values reach the checks only with each request (`request_env.allow`). What is kept is what the daemon and the jobs and tools it starts need as the user: the account and search path (HOME, USER, LOGNAME, SHELL, PATH, the temp directory, locale, TZ, XDG_*), the user's git and GitHub credentials (SSH_AUTH_SOCK, GH_TOKEN, GITHUB_TOKEN, GH_HOST, GH_CONFIG_DIR), the engine's own tunables (AH_ENGINE_*, the allocator tuning variables), the plugin root the daemon loads its files from, the user's Jev settings and keys (ANTIHALL_JEV*, CLAUDE_PLUGIN_OPTION_JEV_*, the gateway keys), and the user-level DevSwarm and maintenance tunables. A trailing `*` matches a prefix."
value = ["HOME", "USER", "LOGNAME", "SHELL", "PATH", "TMPDIR", "TMP", "TEMP", "LANG", "LC_*", "TZ", "XDG_*", "SSH_AUTH_SOCK", "GH_TOKEN", "GITHUB_TOKEN", "GH_HOST", "GH_CONFIG_DIR", "AH_ENGINE_*", "_RJEM_MALLOC_CONF", "MALLOC_CONF", "CLAUDE_PLUGIN_ROOT", "PLUGIN_ROOT", "ANTIHALL_JEV*", "CLAUDE_PLUGIN_OPTION_JEV_*", "AI_GATEWAY_API_KEY", "TYPESAFE_API_KEY", "ANTHROPIC_API_KEY", "ANTIHALL_DEVSWARM_*", "ANTIHALL_RECONCILE_*", "ANTIHALL_ROSTER_*", "ANTIHALL_BROADCAST_*", "ANTIHALL_MARKETPLACE_DIR", "ANTIHALL_INGEST_DRY_RUN", "ANTIHALL_TEST_*", "ANTIHALL_ALLOW_REAL_HOME_TEST", "ANTIHALL_UNITS_ALLOW_TMP_HOME", "ANTI_HALL_LOG_DIR", "MCP_REAP_*"]

[daemon.spawn_env_deny]
doc = "Variables the daemon never inherits even when `daemon.spawn_env_allow` matches them by prefix: the ones that name the session, the role or the DevSwarm workspace of whoever started it. Deny wins."
value = ["ANTIHALL_ROLE", "ANTIHALL_SESSION_ID", "ANTIHALL_CALLER", "ANTIHALL_DEVSWARM_SOURCE_BRANCH", "ANTIHALL_JUDGE_CHILD", "ANTIHALL_WAKE_WATCH_HANDED_OFF"]

[daemon.spawn_cwd_fallback]
doc = "The working directory of a daemon whose starter has no usable home directory. Otherwise it starts in the home directory: the directory of the hook that spawned it can be a workspace's worktree that is archived and removed while the daemon, and every job it starts, keeps running."
value = "/"

[daemon.malloc_decay_keys]
doc = "The decay settings of `daemon.malloc_conf` that a daemon started without the tuning in its environment (a launchd or systemd unit, a replay or test driver) applies to the running allocator; each is also the name of the allocator control under `arenas.` and `arena.<all>.`. `narenas` is not among them: it cannot change once the allocator runs."
value = ["dirty_decay_ms", "muzzy_decay_ms"]

[daemon.malloc_decay_kind]
doc = "Event-log kind of the line written when the daemon applies (or cannot apply) the allocator decay settings at start."
value = "malloc_decay"

[daemon.malloc_decay_why_system]
doc = "Reason logged when the decay settings are not applied because the system allocator is active."
value = "the system allocator is active"

[daemon.malloc_decay_why_none]
doc = "Reason logged when `daemon.malloc_conf` holds none of `daemon.malloc_decay_keys`."
value = "daemon.malloc_conf holds no decay setting"

[daemon.malloc_decay_why_error]
doc = "Reason logged when the allocator refused a decay setting. Placeholders: {key}, {rc} (the allocator's error number)."
value = "the allocator refused {key} (error {rc})"

[daemon.rss_check_ms]
doc = "How often the watchdog samples resident memory."
value = 10000
env = "AH_ENGINE_RSS_CHECK_MS"
unit = "ms"

[daemon.stuck_ms]
doc = "A worker that makes no progress on its request for longer than this trips a drain and exit (a hung worker). Progress is a check starting or finishing and the script interpreter running, so a worker a loaded machine only slows down is not stuck; the time without progress is what a blocked host call (a lock, a child process, a disk sync) adds."
value = 8000
env = "AH_ENGINE_STUCK_MS"
unit = "ms"

[daemon.stall_ms]
doc = "An accept loop silent for longer than this trips a drain and exit."
value = 5000
env = "AH_ENGINE_STALL_MS"
unit = "ms"

[daemon.start_stall_ms]
doc = "How long a starting daemon may take from its start to the accept loop's first round (database open, spool drain, scheduler and wiring start) before the watchdog calls it stalled and restarts it. Longer than daemon.stall_ms because start-up work is not the accept loop and a loaded machine slows it; once the loop has run, daemon.stall_ms applies, and a loop that has returned (a clean drain) is never judged."
value = 60000
env = "AH_ENGINE_START_STALL_MS"
unit = "ms"

[daemon.watchdog_tick_ms]
doc = "How often the watchdog thread wakes to look at heartbeats."
value = 250
env = "AH_ENGINE_WATCHDOG_TICK_MS"
unit = "ms"

[daemon.healthy_after_s]
doc = "How long the daemon must stay up before its binary is recorded as having run healthy (files.healthy_binary). A binary that dies earlier never earns the record, so a roll-back may replace it."
value = 30
env = "AH_ENGINE_HEALTHY_AFTER_S"
unit = "s"


[daemon.nice]
doc = "`nice` increment applied to the daemon process."
value = 5
env = "AH_ENGINE_NICE"
min = 0
max = 19

[daemon.session_rps]
doc = "Sustained requests per second allowed per session; 0 = unlimited."
value = 50
env = "AH_ENGINE_SESSION_RPS"

[daemon.session_burst]
doc = "Token-bucket burst per session."
value = 200
env = "AH_ENGINE_SESSION_BURST"

[daemon.project_rps]
doc = "Sustained requests per second allowed per project; 0 = unlimited."
value = 100
env = "AH_ENGINE_PROJECT_RPS"

[daemon.project_burst]
doc = "Token-bucket burst per project."
value = 400
env = "AH_ENGINE_PROJECT_BURST"

[daemon.bucket_cap]
doc = "Most distinct keys one token-bucket map tracks; idle full buckets are dropped first and unknown keys are refused under a key flood."
value = 4096

[daemon.lock_wait_ms]
doc = "How long a starting daemon waits for an outgoing (version-handoff) daemon to release the singleton lock."
value = 1500
unit = "ms"

[daemon.lock_poll_ms]
doc = "Poll interval while waiting for the singleton lock."
value = 10
unit = "ms"

[daemon.close_max_ms]
doc = "Longest a drain's exit timer waits for the database close (the commit of everything queued) once it has started, so a timer that fires during the close cannot lose queued commits. A close wedged longer than this is cut off."
value = 30000
unit = "ms"

[daemon.drain_grace_ms]
doc = "After a drain starts, a worker or loop that has not finished in this long is cut off."
value = 1000
unit = "ms"

[daemon.drain_max_ms]
doc = "Longest a clean drain (handoff, stop, idle exit, SIGTERM) may take before the daemon exits anyway, so a worker stuck while draining can never keep the process (and the singleton lock) alive with its socket already gone. Above daemon.stuck_ms, so the stuck-worker check normally ends such a drain first."
value = 10000
min = 100
unit = "ms"

[daemon.accept_error_backoff_ms]
doc = "Sleep after an accept that failed for a reason other than nothing pending (a full descriptor table, EMFILE): the pending connection would make poll fire again at once, so without it the accept loop spins at full CPU. Kept well under daemon.stall_ms."
value = 50
min = 1
unit = "ms"

[daemon.reply_slack_ms]
doc = "Time kept back from a request's client deadline (client.deadline_ms, or what a dispatch request says) to write the reply: the inner budgets that could outlast the client's wait (a git call, a Jev consult) are clamped to the deadline minus this, so a slow dependency costs a fallback, not a lost answer."
value = 50
min = 0
unit = "ms"

[daemon.skip_when_client_gone]
