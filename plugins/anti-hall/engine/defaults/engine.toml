value = 250
min = 1
unit = "ms"

[client.wrapper_kill_grace_ms]
doc = "How long the hook launcher (ah-hook) waits after SIGTERM to a timed-out engine's process group before it sends SIGKILL. The soft stop lets the client write its markers; the hard stop bounds the call."
