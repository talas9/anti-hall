# ---- client limits --------------------------------------------------------------------------------------

[client.deadline_ms]
doc = "Overall hook-client deadline for one engine exchange (connect, write, read); a hard watchdog thread enforces it so a hung daemon fails open quickly."
value = 300
env = "AH_ENGINE_DEADLINE_MS"
max = 300
unit = "ms"

[client.deadline_slack_ms]
doc = "Extra wait for the exchange thread to report after the deadline before the client declares a timeout."
value = 10
unit = "ms"

[client.slow_fallback_max_ms]
doc = "How long, measured from the engine start, a hook call keeps waiting for the daemon's own reply once client.deadline_ms has passed (a daemon that is alive answers late rather than never). The wrapper's watchdog waits the same bound (never past the hook's own timeout), so a delayed block still blocks. A reply that arrives in the window is used as is: the daemon's decision. Nothing by then fails the call open and counts toward client.slow_down_n. A normal or unavailable daemon keeps the short fail-fast budget (client.deadline_ms + client.deadline_slack_ms + client.wrapper_extra_ms). 0 disables the extension."
value = 3000
env = "AH_ENGINE_SLOW_FALLBACK_MAX_MS"
min = 0
unit = "ms"

[client.slow_wait_margin_ms]
doc = "How much earlier than the wrapper's watchdog (client.slow_fallback_max_ms from the engine start) the client stops waiting for a late daemon reply, so the client fails open and counts the slow call itself instead of being killed by the watchdog first. Covers the client's own start-up before it begins to wait."
value = 400
unit = "ms"

[client.down_marker_ttl_ms]
doc = "How long other clients skip connecting after one client finds the daemon absent or failed, or hung (client.heartbeat_stale_ms) and not replaced, or after client.slow_down_n consecutive slow replies; this prevents hook pile-ups while a restart is attempted."
value = 3000
env = "AH_ENGINE_DOWN_MARKER_TTL_MS"
unit = "ms"

[client.slow_down_n]
doc = "Consecutive slow (late) daemon replies within client.slow_window_ms after which the daemon is treated as wedged and marked down. A single call that gets no reply in the window never marks it down: it fails open and the next client asks the daemon again."
value = 5
env = "AH_ENGINE_SLOW_DOWN_N"
min = 1

[client.slow_window_ms]
doc = "Window in which consecutive slow daemon replies are counted toward client.slow_down_n; a streak older than this starts over."
value = 10000
env = "AH_ENGINE_SLOW_WINDOW_MS"
unit = "ms"

[client.heartbeat_stale_ms]
doc = "A hook call past client.deadline_ms keeps waiting for a late reply (client.slow_fallback_max_ms) only while the daemon's heartbeat (files.heartbeat) is younger than this. Older means the daemon may be stopped or wedged, not slow: the call fails open at once and marks it down (client.down_marker_ttl_ms). One stale sample only raises a suspicion (files.heartbeat_suspect); the client ends that daemon only once the same heartbeat stayed unchanged for client.heartbeat_confirm_ms, and only when it is the pid holding the singleton lock, verified as this engine's daemon, of this state dir, and still the process generation the heartbeat recorded (start time and executable from the operating system, re-read immediately before the signal); single-flight and under the crash-loop rule. Then it starts a new one. A heartbeat that names another pid or is missing counts as alive. Keep it well above daemon.watchdog_tick_ms and below client.slow_fallback_max_ms less client.slow_wait_margin_ms, so a stop is detected within the first slow call. 0 disables the check."
value = 1500
env = "AH_ENGINE_HEARTBEAT_STALE_MS"
min = 0
unit = "ms"

[client.heartbeat_confirm_ms]
doc = "How long a stale daemon heartbeat (client.heartbeat_stale_ms) must stay unchanged, by the monotonic clock, before a client ends that daemon. The first stale sample only records a suspicion and fails open; any beat, a new daemon, or a wall-clock jump that only made a moving heartbeat read old resets it. Keep it at most client.down_marker_ttl_ms, so a stopped daemon is replaced by the first call after the down marker expires."
value = 1000
env = "AH_ENGINE_HEARTBEAT_CONFIRM_MS"
min = 1
unit = "ms"

[client.heartbeat_poll_ms]
doc = "While a hook call waits past its deadline for a late reply, how often it re-reads the daemon's heartbeat (client.heartbeat_stale_ms)."
value = 100
min = 1
unit = "ms"

[client.spawn_lock_ttl_ms]
doc = "How old the single-flight daemon spawn lock may get before another client treats it as stale and may try one restart."
value = 3000
env = "AH_ENGINE_SPAWN_LOCK_TTL_MS"
unit = "ms"

[client.breaker_n]
doc = "Engine failures within the window that open the breaker (the client then skips the engine)."
value = 5
env = "AH_ENGINE_BREAKER_N"
min = 1

[client.breaker_window_s]
doc = "Window in which breaker failures are counted."
value = 60
env = "AH_ENGINE_BREAKER_WINDOW_S"
unit = "s"

[client.breaker_cooldown_s]
doc = "How long the breaker stays open once tripped."
value = 60
env = "AH_ENGINE_BREAKER_COOLDOWN_S"
unit = "s"

[client.crash_n]
doc = "Daemon deaths within the window that stop respawning."
value = 4
env = "AH_ENGINE_CRASH_N"
min = 1

[client.crash_window_s]
doc = "Window in which daemon deaths are counted."
value = 600
env = "AH_ENGINE_CRASH_WINDOW_S"
unit = "s"

[client.crash_cooldown_s]
doc = "How long respawning stays stopped after a crash loop."
value = 1800
env = "AH_ENGINE_CRASH_COOLDOWN_S"
unit = "s"

[client.spawn_n]
doc = "Daemon starts within the spawn window that count as a crash loop even when the daemon reported no crash (a binary that exits at once reports nothing). Respawning then stops for client.crash_cooldown_s."
value = 6
env = "AH_ENGINE_SPAWN_N"
min = 1

[client.spawn_window_s]
doc = "Window in which daemon starts are counted for client.spawn_n."
value = 60
env = "AH_ENGINE_SPAWN_WINDOW_S"
unit = "s"


[client.cold_guard_wait_ms]
doc = "How long a guard event (PreToolUse, PermissionRequest, Stop, SubagentStop) waits for a cold-starting daemon before it is let through with one notice per session; 0 turns the wait off. The engine client keeps the same bound: a guard-event call that still finds no daemon (it starts one, or finds another call starting it) waits for it within this budget and then sends its request once, so it is never answered with nothing while a daemon starts. Prompts and advisories never wait. The wait never exceeds what the hook's own timeout leaves after the engine attempt. It is one absolute deadline: the kick, its kill grace and the socket poll all end within it, so a cold guard call takes at most this plus the normal engine attempt."
value = 2000
unit = "ms"

[client.cold_guard_poll_ms]
doc = "Poll interval of the cold-start wait for a guard event (the daemon socket appearing)."
value = 50
min = 1
unit = "ms"

[client.cold_guard_kick_event]
doc = "Event name of the empty request the wrapper sends to start a cold daemon before a guard event waits for it; it names no hook, so it decides nothing."
value = "ColdStartKick"

[client.cold_start_wait_ms]
doc = "How long a client with no fallback waits for a cold-started daemon before giving up (prints nothing)."
value = 40
unit = "ms"

[client.cold_start_poll_ms]
doc = "Poll interval while waiting for a cold-started daemon."
value = 1
unit = "ms"

[client.max_reply]
doc = "Largest reply the client reads."
value = 2097152
unit = "bytes"

[client.max_stdin]
doc = "Largest hook payload the client reads from stdin."
value = 8388608
unit = "bytes"

[client.wrapper_extra_ms]
doc = "Extra shell watchdog budget beyond the client deadline and client slack; this lets the client write the daemon-down marker and release the single-flight spawn lock before the wrapper kills it."
value = 250
min = 1
unit = "ms"

[client.wrapper_kill_grace_ms]
doc = "How long the hook launcher (ah-hook) waits after SIGTERM to a timed-out engine's process group before it sends SIGKILL. The soft stop lets the client write its markers; the hard stop bounds the call."
value = 200
min = 0
max = 5000
unit = "ms"

[client.wrapper_default_timeout_s]
doc = "Last-resort hook budget for the hook launcher (ah-hook) when the fallback list has no row for the event: the event's hook timeout it assumes, which also caps the slow-daemon window and the cold-start wait."
value = 10
min = 1
unit = "s"

[client.wrapper_watchdog_poll_ms]
doc = "Poll interval for the hook wrapper millisecond watchdog."
value = 2
min = 1
unit = "ms"

[client.ctl_timeout_ms]
doc = "Deadline for a control exchange (ping, status, reload, stop, project ops)."
value = 1500
unit = "ms"

[client.fallback_poll_ms]
doc = "Poll interval of short waits on a child process or a reply (the GitHub runtime, the Jev sweep and the scheduler use it)."
value = 2
