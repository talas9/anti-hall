[launcher.knob_fault]
doc = "Test-only: environment variable that injects a fault into the launcher (panic, hang, spin or alloc) so its never-panic and hard-limit paths can be tested end to end."
value = "AH_LAUNCHER_FAULT"

[launcher.test_flag_env]
doc = "Environment variable that must be 1 for the test-only knobs to be honoured."
value = "AH_WRAPPER_TEST"

[launcher.diag_env]
doc = "Test-only: environment variable naming a file the launcher appends its diagnostic lines to (an absolute path)."
value = "AH_ENGINE_WRAPPER_DIAG"

[launcher.in_process_env]
doc = "Environment variable that, set to 1, runs the engine's dispatch in process; the launcher then ignores the daemon-down marker."
value = "AH_ENGINE_DISPATCH_IN_PROCESS"

[launcher.plugin_root_envs]
doc = "Environment variables the host uses to name the plugin root, in the order the launcher tries them."
value = ["CLAUDE_PLUGIN_ROOT", "PLUGIN_ROOT"]

[launcher.hosts]
doc = "The hosts the launcher serves (the --host values); the first is the default."
value = ["claude", "codex"]

[launcher.fallback_list_claude]
doc = "Path, inside the Node backup directory (nodeback.node_dir), of the Claude fallback list: the per-event timeouts and the Node hooks the launcher runs while the Node fallback switch is on."
value = "hooks/ah-fallback.list"

[launcher.fallback_map_claude]
doc = "Path, inside the Node backup directory, of the Claude fallback map: the dispatch-table id of each fallback command, used to name its shadow-ledger row."
value = "hooks/ah-fallback.map.json"

[launcher.fallback_map_codex]
doc = "Path, inside the Node backup directory, of the Codex fallback map."
value = "hooks/ah-fallback.codex.map.json"

[launcher.arg_tool_from_payload]
doc = "The hook argument that makes the launcher read the tool name from the payload (implied on launcher.nodeback_tool_events)."
value = "--tool-from-payload"

[launcher.nodeback_tool_field]
doc = "The payload field that names the tool of a tool event; the Node fallback matches the list's matchers against it."
value = "tool_name"

[launcher.nodeback_keyless_events]
doc = "Guard events that no Node hook is registered for: the generated fallback list has no section for them, and the Node fallback answers them with the neutral no-op. A list without the section of any other guard event is damaged and fails closed."
value = ["PermissionRequest", "SubagentStop"]

[launcher.nodeback_tool_events]
doc = "The events on which the Node fallback reads the tool name from the payload and selects the list rows by their matcher."
value = ["PreToolUse", "PostToolUse", "PostToolUseFailure", "PermissionRequest"]

[launcher.nodeback_runners]
doc = "The programs a fallback-list command may start (looked up on PATH); the launcher starts them directly, never through a shell. A row that starts anything else is a no-op script of the dispatch table (the engine answers it in-process) and counts as having run."
value = ["node"]

[launcher.nodeback_unrunnable_markers]
doc = "Texts that must all appear on a Node hook's stderr (exit 1) for the hook to count as unrunnable (its script or a module is missing) instead of a non-blocking failure of the hook itself."
value = ["MODULE_NOT_FOUND", "Cannot find module"]

[launcher.fallback_list_codex]
doc = "Path, inside the Node backup directory, of the Codex fallback list."
value = "hooks/ah-fallback.codex.list"

[launcher.cli_integrity_verb]
doc = "The ah-hook command-line verb that runs the binary integrity check and roll-back (`ah-hook integrity record|accept|check|fail|status|lock|unlock`); the launcher starts itself with it in the background."
value = "integrity"

[files.fallback_switch]
doc = "Marker file (state directory) of the Node fallback switch (the Node backup, stage 2): present = the launcher runs the original Node hooks directly instead of the engine. Written and removed by `ah-engine fallback node|off`; read by the thin client (`ah-hook`)."
value = "fallback.node"

[launcher.arg_builtin]
doc = "The argument that makes `ah-hook doctor` run its built-in diagnosis even when the engine runs."
value = "--builtin"

[launcher.engine_lock_file]
doc = "File name, in the plugin root, of the engine lock: when present the session start may bootstrap the engine."
value = "ah-engine.lock"

[launcher.engine_bin_rel]
doc = "Path of the installed engine binary below the engine state directory."
value = "bin/ah-engine"

[launcher.engine_bin_name]
doc = "Name of the engine binary looked up on PATH when none is installed."
value = "ah-engine"

[launcher.cli_lowercase_verbs]
doc = "1: a first argument that starts with a lowercase letter is an engine command (`ah-hook <verb> [args...]` runs `ah-engine <verb> [args...]` by exec); hook event names are PascalCase, so they never match. 0: every first argument is a hook event."
value = 1
min = 0
max = 1

[launcher.cli_no_engine_exit]
doc = "Exit code of `ah-hook <verb>` when no engine can run the command (msg.run_engine_missing goes to stderr; nothing else runs)."
value = 127
min = 1
max = 255

[launcher.run_base_dir]
doc = "Directory, below the anti-hall base directory, for the launcher's private per-call run directories."
value = "tmp"

[launcher.tmp_dir_prefix]
doc = "Prefix of the private directory the launcher makes under the temp directory when the home directory is unusable (followed by the user id)."
value = "ah-hook-"

[launcher.run_dir_prefix]
doc = "Prefix of a per-call run directory (followed by the launcher's process id)."
value = "ah-launch."

[files.launcher_log]
doc = "The launcher's bounded failure log, inside the state directory."
value = "launcher.log"

[files.launcher_drops]
doc = "Count of the log lines the launcher dropped at the hard log size, inside the state directory."
value = "launcher.drops"

[files.launcher_spawn_lock]
doc = "Lock file that lets only one launcher at a time ask for a cold daemon start, inside the state directory."
value = "launcher.spawn.lock"

[files.launcher_spawn_log]
doc = "Times (epoch ms, one per line) of the daemon starts the launcher asked for, inside the state directory; the crash-loop window counts them."
value = "launcher.spawns"

# Daemon start provenance: bounded retained history, not a lifetime counter.
[health.start_ring_file]
doc = "The bounded JSON ring of actual daemon starts, relative to the engine state directory. Refused duplicate serve processes do not count."
value = "starts-reasons.json"

[health.start_ring_rows]
doc = "Maximum retained daemon-start rows; status starts_by_reason counts this retained history."
value = 128
min = 1
max = 4096

[health.start_ring_bytes]
doc = "Maximum bytes read or written for the start ring; oversized or unreadable history is ignored, without preventing daemon startup."
value = 65536
min = 1024
unit = "bytes"

[health.start_reason_flag]
doc = "The serve argument actual launchers use to identify their trigger. Plain serve defaults to manual."
value = "--start-reason"

[health.start_reasons]
doc = "Allowed start reasons: hook client, install/deploy routine, installed service managers, plain serve, and evidenced crash recovery. Crash recovery retains the original trigger in its own field."
value = { hook = "hook-client", routine = "deploy/routine", launchd = "launchd", systemd = "systemd", manual = "manual", crash = "after-crash" }

[health.start_fields]
doc = "Field names of a start row and its health summary: timestamp is Unix milliseconds; counts cover the retained bounded ring."
value = { timestamp = "ts", pid = "pid", reason = "reason", trigger = "trigger", counts = "starts_by_reason", last = "last_start" }

[health.start_lifecycle_kinds]
doc = "Event kinds that delimit daemon lifecycle evidence. The latest event after the prior ring start decides recovery; a clean exit or system reboot supersedes an old crash."
value = ["start", "exit", "crash", "panic", "system_restart"]

[health.start_crash_kinds]
doc = "Lifecycle event kinds proving the next actual start follows an unrecovered crash. Stale run-marker reaping writes crash, including when the hook client reaped it before serve."
value = ["crash", "panic"]

[health.start_doctor_line]
doc = "The doctor's one-line retained daemon-start summary. Placeholders: counts (JSON), timestamp (last start Unix milliseconds, 0 if none), reason."
value = "daemon starts (retained): {counts}; last ts={timestamp} reason={reason}"

[updater.engine_serve_args]
doc = "The legacy updater restart and detached restart-tail arguments after serve; identify both actual launch paths as deploy/routine."
value = ["--start-reason", "deploy/routine"]

[health.start_ring_write_kind]
doc = "The discard diagnostic key when writing daemon-start provenance fails; startup continues."
value = "daemon_start_ring_write"
