# ah-engine shipped defaults: process, paths, limits, timeouts, protocol options and health policy (D17).
#
# Format. Every setting is a table `[section.name]` with:
#   value  the default (number, string, list or table)
#   doc    what it is, in one sentence (a test fails if it is missing)
#   env    optional: the environment variable that overrides a numeric value for one process
#   min / max  optional clamps for a numeric value
# Code reads these through `ah_engine::defaults`; nothing here is repeated in Rust. The engine reads these files from the plugin
# at run time (start-up, plugin update, file change) and nothing is compiled into the binary: tune the engine by editing here.

# ---- environment variable names -------------------------------------------------------------------------

[env.dir]
doc = "Overrides the state directory (default: base_dir/state_dir under the home directory)."
value = "AH_ENGINE_DIR"

[env.done_file]
doc = "A file the dispatcher creates once it has dispatched an event and decided its exit code (D87). The reliability wrapper sets it, so that an engine exit code of a hook's own (1, say) is told from an engine failure and is not answered by running every hook a second time."
value = "AH_ENGINE_DONE_FILE"

[env.rules]
doc = "Overrides the rules file path."
value = "AH_ENGINE_RULES"

[env.version]
doc = "Overrides the version this build reports and compares for handoff (the plugin version in production, arbitrary in tests)."
value = "AH_ENGINE_VERSION"

[env.fallback]
doc = "Path of the Node hook the client runs when the engine cannot answer (the `--fallback` argument wins)."
value = "AH_ENGINE_FALLBACK"

[env.node]
doc = "The Node binary used to run the fallback hook."
value = "AH_ENGINE_NODE"

[env.nospawn]
doc = "When set, the client never starts a daemon (tests, and hosts that manage the daemon themselves)."
value = "AH_ENGINE_NOSPAWN"

[env.test_hooks]
doc = "When set, the daemon accepts the test-only control verbs (sleep, stall, panic). Never set in production."
value = "AH_ENGINE_TEST_HOOKS"

[env.plugin_root]
doc = "Plugin install directory, used by built-in checks that build override commands (a rule's `options.plugin_root` wins)."
value = "AH_ENGINE_PLUGIN_ROOT"

[env.session]
doc = "Session id a `proj` write is spooled under; spooled writes keep their order per session (D24)."
value = "AH_ENGINE_SESSION"

[env.home]
doc = "Home directory variable."
value = "HOME"

[env.home_alt]
doc = "Fallback home directory variable (used by the git check when the home variable is unset)."
value = "USERPROFILE"

[env.tmpdir]
doc = "Temporary directory variable, used for the short-path socket fallback."
value = "TMPDIR"

# ---- paths and file names -------------------------------------------------------------------------------

[paths.base_dir]
doc = "Directory under the home directory that holds all anti-hall state."
value = ".anti-hall"

[paths.state_dir]
doc = "Engine state directory name inside base_dir (D53)."
value = "ah-engine"

[paths.socket_file]
doc = "Socket file name inside the state directory."
value = "e.sock"

[paths.lock_suffix]
doc = "Suffix appended to the socket path for the singleton lock file."
value = ".lock"

[paths.rules_file]
doc = "Name of the user's rules override inside the state directory; when that file exists it replaces the plugin's rules file."
value = "rules.json"

[paths.plugin_rules_file]
doc = "The shipped rules file, relative to the plugin root (the engine reads it from the plugin, never from its own install)."
value = "engine/rules.json"

[paths.fallback_tmp]
doc = "Last-resort base for the short-path socket when TMPDIR is unset or too long."
value = "/tmp"

[paths.private_dir_prefix]
doc = "Prefix of the private per-user directory that holds a short-path socket (the uid is appended)."
value = "anti-hall-"

[paths.short_socket_ext]
doc = "Extension of a short-path socket file (its name is a stable hash of the state directory)."
value = ".sock"

[paths.socket_max_len]
doc = "Longest socket path used as is; unix socket paths are capped at 104 bytes on macOS (108 on Linux), so this leaves headroom."
value = 100
unit = "bytes"

[files.log]
doc = "Event log file name (state directory)."
value = "ah-engine.log"

[files.failure]
doc = "Last recorded failure, for the once-per-session advisory."
value = "failure.json"

[files.breaker_until]
doc = "Marker holding the time (ms since the epoch) until which the client breaker stays open."
value = "breaker.until"

[files.crashloop_until]
doc = "Marker holding the time until which respawning is stopped after a crash loop."
value = "crashloop.until"

[files.run_marker]
doc = "Written while a daemon runs; a leftover one with a dead pid is logged as one crash."
value = "daemon.run"

[files.reaped_prefix]
doc = "Prefix of the temporary name a stale run marker is renamed to when it is claimed (the pid is appended)."
value = "daemon.run.reaped."

[files.starts]
doc = "Counter of daemon starts, surfaced as `starts` and `restarts` in status."
value = "starts"

[files.spool]
doc = "The write spool: project writes a client could not deliver, applied by the daemon in order (D24)."
value = "spool.log"

[files.telemetry_inbox]
doc = "Events recorded by processes other than the daemon (the hook dispatcher, one-shot commands), one JSON line each, in the state directory; the daemon reads and empties it on every telemetry flush."
value = "telemetry-inbox.jsonl"

[files.spool_quarantine]
doc = "Spool records that could not be parsed or that the store refused for good, kept with their reason, never dropped (D24)."
value = "spool.quarantine"

[files.backups_dir]
doc = "Directory inside the state directory that holds backups and pre-restore snapshots (D27); nothing in it is ever deleted by the engine."
value = "backups"

[files.schedules_override]
doc = "User overrides of the shipped schedules (D33): JSON, `{\"jobs\": {\"<name>\": {...}}}`; read when the daemon starts."
value = "schedules.json"

[files.advised_dir]
doc = "Directory with one empty file per session that has already seen the failure advisory."
value = "advised"

# ---- daemon limits --------------------------------------------------------------------------------------

[daemon.workers]
doc = "Worker threads evaluating requests."
value = 4
env = "AH_ENGINE_WORKERS"
min = 1
max = 32

[daemon.queue]
doc = "Connections that may wait for a worker; beyond this the daemon answers BUSY and the client falls back."
value = 16
env = "AH_ENGINE_QUEUE"
min = 1
max = 1024

[daemon.max_request]
doc = "Largest request the daemon reads; the client sends nothing larger (it falls back instead)."
value = 1048576
env = "AH_ENGINE_MAX_REQUEST"
unit = "bytes"

[daemon.read_ms]
doc = "Total time a client has to deliver its request."
value = 1000
env = "AH_ENGINE_READ_MS"
unit = "ms"

[daemon.write_ms]
doc = "Time allowed to write a reply."
value = 1000
env = "AH_ENGINE_WRITE_MS"
unit = "ms"

[daemon.eval_budget_us]
doc = "Per-request thread CPU budget for rule evaluation; 0 turns the budget off."
value = 200000
env = "AH_ENGINE_EVAL_BUDGET_US"
unit = "us"

[daemon.mem_mb]
doc = "Data-segment limit applied with setrlimit; 0 = none. It is a ceiling against runaway allocation, not a budget (the RSS cap is the budget), and Linux enforces it on thread stacks, so it must exceed daemon.workers times git.stack_mb plus headroom or a check thread cannot start. macOS accepts the call but does not enforce it."
value = 512
env = "AH_ENGINE_MEM_MB"
unit = "MB"

[daemon.rss_cap_kb]
doc = "Resident-set cap; above it the daemon drains and exits cleanly and the next call starts a fresh one; 0 = none. Set from measurement, not guessed: steady state of the 61-check engine on a mixed real-payload replay (5000 calls, a 142 MB transcript read by the Stop checks) is 33-36 MB RSS with jemalloc (aarch64-apple-darwin, linux-gnu) and 45-52 MB with the system allocator (x86_64-apple-darwin, musl, which the allocator crate does not support); live heap is 16-18 MB in both. The cap sits above the larger figure, so only growth trips it. The previous 48 MB cap sat inside the system-allocator steady state, so the daemon restarted every ~10 s and the crash-loop breaker switched it off."
value = 65536
env = "AH_ENGINE_RSS_CAP_KB"
unit = "KB"

[daemon.malloc_conf]
doc = "Allocator purge tuning handed to the daemon at start (jemalloc `malloc_conf` syntax): one arena for the four worker threads (less fragmentation) and decay 0 (freed pages go back to the OS at once; the system allocators keep them, which left RSS at 2.5x the live heap). Measured on 1000 mixed calls, this Mac: system allocator 45-48 MB RSS, jemalloc with only decay 0 37 MB, with narenas:1 as well 32 MB (live heap 16 MB), adding tcache:false 27 MB but p50 call latency 10 ms against 6.5-7 ms, so tcache stays on. empty = the allocator's own defaults. A variable the caller already set is not overridden."
value = "narenas:1,dirty_decay_ms:0,muzzy_decay_ms:0"

[daemon.malloc_conf_vars]
doc = "Environment variables the allocator reads its tuning from (the crate's prefixed name and the plain one)."
value = ["_RJEM_MALLOC_CONF", "MALLOC_CONF"]

[daemon.rss_check_ms]
doc = "How often the watchdog samples resident memory."
value = 10000
env = "AH_ENGINE_RSS_CHECK_MS"
unit = "ms"

[daemon.stuck_ms]
doc = "A worker busy on one request for longer than this trips a drain and exit."
value = 8000
env = "AH_ENGINE_STUCK_MS"
unit = "ms"

[daemon.stall_ms]
doc = "An accept loop silent for longer than this trips a drain and exit."
value = 5000
env = "AH_ENGINE_STALL_MS"
unit = "ms"

[daemon.watchdog_tick_ms]
doc = "How often the watchdog thread wakes to look at heartbeats."
value = 250
env = "AH_ENGINE_WATCHDOG_TICK_MS"
unit = "ms"

[daemon.nice]
doc = "`nice` increment applied to the daemon process."
value = 5
env = "AH_ENGINE_NICE"
min = 0
max = 19

[daemon.session_rps]
doc = "Sustained requests per second allowed per session; 0 = unlimited."
value = 50
env = "AH_ENGINE_SESSION_RPS"

[daemon.session_burst]
doc = "Token-bucket burst per session."
value = 200
env = "AH_ENGINE_SESSION_BURST"

[daemon.project_rps]
doc = "Sustained requests per second allowed per project; 0 = unlimited."
value = 100
env = "AH_ENGINE_PROJECT_RPS"

[daemon.project_burst]
doc = "Token-bucket burst per project."
value = 400
env = "AH_ENGINE_PROJECT_BURST"

[daemon.bucket_cap]
doc = "Most distinct keys one token-bucket map tracks; idle full buckets are dropped first and unknown keys are refused under a key flood."
value = 4096

[daemon.lock_wait_ms]
doc = "How long a starting daemon waits for an outgoing (version-handoff) daemon to release the singleton lock."
value = 1500
unit = "ms"

[daemon.lock_poll_ms]
doc = "Poll interval while waiting for the singleton lock."
value = 10
unit = "ms"

[daemon.close_max_ms]
doc = "Longest a drain's exit timer waits for the database close (the commit of everything queued) once it has started, so a timer that fires during the close cannot lose queued commits. A close wedged longer than this is cut off."
value = 30000
unit = "ms"

[daemon.drain_grace_ms]
doc = "After a drain starts, a worker or loop that has not finished in this long is cut off."
value = 1000
unit = "ms"

[daemon.drain_max_ms]
doc = "Longest a clean drain (handoff, stop, idle exit, SIGTERM) may take before the daemon exits anyway, so a worker stuck while draining can never keep the process (and the singleton lock) alive with its socket already gone. Above daemon.stuck_ms, so the stuck-worker check normally ends such a drain first."
value = 10000
min = 100
unit = "ms"

[daemon.accept_error_backoff_ms]
doc = "Sleep after an accept that failed for a reason other than nothing pending (a full descriptor table, EMFILE): the pending connection would make poll fire again at once, so without it the accept loop spins at full CPU. Kept well under daemon.stall_ms."
value = 50
min = 1
unit = "ms"

[daemon.reply_slack_ms]
doc = "Time kept back from a request's client deadline (client.deadline_ms, or what a dispatch request says) to write the reply: the inner budgets that could outlast the client's wait (a git call, a Jev consult) are clamped to the deadline minus this, so a slow dependency costs a fallback, not a lost answer."
value = 150
min = 0
unit = "ms"

[daemon.accept_poll_ms]
doc = "Accept-loop poll interval while serving."
value = 200
unit = "ms"

[daemon.drain_poll_ms]
doc = "Accept-loop poll interval while draining."
value = 20
unit = "ms"

[daemon.rules_check_ms]
doc = "How often the daemon checks the rules file (and SIGHUP) for a change."
value = 200
unit = "ms"

[daemon.worker_wait_ms]
doc = "How long an idle worker sleeps on the queue before looking again."
value = 200
unit = "ms"

[daemon.read_poll_ms]
doc = "Socket read timeout slice while collecting a request (the total is read_ms)."
value = 100
unit = "ms"

[daemon.busy_write_ms]
doc = "Write timeout for the BUSY reply sent from the accept loop."
value = 100
unit = "ms"

[daemon.idle_exit_s]
doc = "Seconds without any request after which the daemon exits (the next hook call starts a fresh one, and the scheduler catches up its missed jobs); 0 keeps it resident. 0 by default: the daemon is always resident so the scheduler and mailbox keep running after every session closes (D7). A daemon whose state dir, lock file or executable is gone still exits on its own (daemon.orphan_check_ms)."
value = 0
env = "AH_ENGINE_IDLE_EXIT_S"
unit = "s"

[daemon.orphan_check_ms]
doc = "How often a daemon checks that its state directory, its lock file (same inode) and its executable still exist; once one is gone it drains and exits, so a daemon whose files were removed under it (a test's temporary dir, an uninstall) never runs on unreachable."
value = 2000
min = 100
unit = "ms"

[daemon.idle_check_ms]
doc = "How often the watchdog compares the last request time with idle_exit_s."
value = 1000
unit = "ms"

[daemon.forced_exit_code]
doc = "Exit status of a forced drain exit (sysexits EX_TEMPFAIL, 75); the next client call starts a fresh daemon."
value = 75

[daemon.start_fail_exit_code]
doc = "Exit status when the daemon cannot start (sysexits EX_CONFIG, 78)."
value = 78

# ---- client limits --------------------------------------------------------------------------------------

[client.deadline_ms]
doc = "Overall deadline for one engine exchange (connect, write, read); a hard watchdog thread enforces it."
value = 2000
env = "AH_ENGINE_DEADLINE_MS"
unit = "ms"

[client.deadline_slack_ms]
doc = "Extra wait for the exchange thread to report after the deadline before the client declares a timeout."
value = 50
unit = "ms"

[client.breaker_n]
doc = "Engine failures within the window that open the breaker (the client then skips the engine)."
value = 5
env = "AH_ENGINE_BREAKER_N"
min = 1

[client.breaker_window_s]
doc = "Window in which breaker failures are counted."
value = 60
env = "AH_ENGINE_BREAKER_WINDOW_S"
unit = "s"

[client.breaker_cooldown_s]
doc = "How long the breaker stays open once tripped."
value = 60
env = "AH_ENGINE_BREAKER_COOLDOWN_S"
unit = "s"

[client.crash_n]
doc = "Daemon deaths within the window that stop respawning."
value = 4
env = "AH_ENGINE_CRASH_N"
min = 1

[client.crash_window_s]
doc = "Window in which daemon deaths are counted."
value = 600
env = "AH_ENGINE_CRASH_WINDOW_S"
unit = "s"

[client.crash_cooldown_s]
doc = "How long respawning stays stopped after a crash loop."
value = 1800
env = "AH_ENGINE_CRASH_COOLDOWN_S"
unit = "s"

[client.fallback_ms]
doc = "The Node fallback hook must finish, and its stdout and stderr must reach EOF, within this long. A hook still running at the deadline is killed (then plain allow, since it is unavailable); one that finished with output still unread is an error outcome, never an empty stdout."
value = 8000
env = "AH_ENGINE_FALLBACK_MS"
unit = "ms"

[client.cold_start_wait_ms]
doc = "How long a client with no fallback waits for a cold-started daemon before giving up (prints nothing)."
value = 40
unit = "ms"

[client.cold_start_poll_ms]
doc = "Poll interval while waiting for a cold-started daemon."
value = 1
unit = "ms"

[client.max_reply]
doc = "Largest reply the client reads."
value = 2097152
unit = "bytes"

[client.max_stdin]
doc = "Largest hook payload the client reads from stdin."
value = 8388608
unit = "bytes"

[client.slow_probe_ms]
doc = "After an exchange times out, how long the client waits for a ping: a daemon that answers is slow but healthy (logged as client_slow, not counted toward the breaker); one that does not counts as a failure."
value = 200
min = 1
unit = "ms"

[client.ctl_timeout_ms]
doc = "Deadline for a control exchange (ping, status, reload, stop, project ops)."
value = 1500
unit = "ms"

[client.fallback_poll_ms]
doc = "Poll interval while the Node fallback runs."
value = 2
unit = "ms"

# ---- project store --------------------------------------------------------------------------------------

[store.max_projects]
doc = "Most project partitions holding a key or a pending message; a write that would start one more is refused."
value = 256

[store.mailbox_cap]
doc = "Most pending (unconsumed) mailbox entries per project."
value = 64

[store.kv_cap]
doc = "Most active (unexpired) key-value pairs per project."
value = 64

[store.value_cap]
doc = "Largest stored value."
value = 65536
unit = "bytes"

[store.key_cache_cap]
doc = "Most cwd-to-project-key mappings cached (cleared when full) so the hot path does not stat per request."
value = 1024

# ---- health and failure policy --------------------------------------------------------------------------

[health.log_cap]
doc = "Event log size above which it is trimmed to its last log_keep_lines lines."
value = 65536
unit = "bytes"

[health.log_keep_lines]
doc = "Lines kept when the event log is trimmed."
value = 200

[health.event_text_max]
doc = "Longest kind, code or detail written to one log line (newlines and tabs become spaces)."
value = 300
unit = "chars"

[health.crashy_kinds]
doc = "Event kinds that count toward the crash-loop threshold."
value = ["crash", "panic", "start_fail", "watchdog", "rss"]

[health.advisory_ttl_ms]
doc = "A recorded failure older than this no longer produces an advisory."
value = 3600000
unit = "ms"

[health.degraded_window_s]
doc = "The window over which `status` counts self-restarts and Node fallbacks, and over which a restart marks the engine degraded (shown by `status`, the shadow report and, once per session, in the session context)."
value = 3600
unit = "s"

[health.advised_cap]
doc = "When more session stamps than this exist, stamps older than advised_expire_s are removed."
value = 500

[health.advised_expire_s]
doc = "Age after which a session stamp may be removed."
value = 172800
unit = "s"

[health.diag_lines]
doc = "Event-log lines included in the diagnostic block of a permanent-failure advisory."
value = 8

[health.context_events]
doc = "Hook events whose output carries `additionalContext`; other events use `systemMessage` when an advisory is merged."
value = ["PreToolUse", "PostToolUse", "UserPromptSubmit", "SessionStart", "SubagentStart"]

[health.error_codes]
doc = "Error-code classification: environment-class codes get a plain self-fix hint (a message key); every other code is a permanent failure that asks for an issue."
value = [
  { codes = ["os28"], class = "env", hint = "msg.hint_disk_full" },
  { codes = ["os13", "os1", "unsafe_dir"], class = "env", hint = "msg.hint_state_dir" },
  { codes = ["os36", "os22", "path_too_long"], class = "env", hint = "msg.hint_socket_path" },
  { codes = ["os24", "os23"], class = "env", hint = "msg.hint_fds" },
  { codes = ["os12", "sig9"], class = "env", hint = "msg.hint_memory" },
]

[health.scrub_patterns]
doc = "Patterns removed from anything that goes into a diagnostic: each item is [regex, replacement]. Order matters."
value = [
  ["(?i)\\b(?:sk|pk|rk|xox[a-z])[-_][A-Za-z0-9_\\-]{12,}", "[redacted]"],
  ["\\bgh[pousr]_[A-Za-z0-9]{20,}", "[redacted]"],
  ["\\bAKIA[0-9A-Z]{16}\\b", "[redacted]"],
  ["(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=\\-]{8,}", "$1 [redacted]"],
  ["(?i)((?:api[_-]?key|token|secret|passw(?:or)?d|authorization)[\"']?\\s*[=:]\\s*)[\"']?[^\\s\"',}]+", "$1[redacted]"],
  ["[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}", "[email]"],
  ["\\b[A-Za-z0-9+/_\\-]{40,}\\b", "[redacted]"],
]

[health.pid_probe]
doc = "Command used to read a process's command line when checking whether a pid is a live engine: the program, then its arguments with `{pid}` substituted."
value = ["ps", "-p", "{pid}", "-o", "command="]

[health.proc_cmdline]
doc = "Where Linux keeps a process's command line (NUL-separated); read instead of running the pid probe. `{pid}` is substituted."
value = "/proc/{pid}/cmdline"

[health.probe_timeout_ms]
doc = "Longest a pid or memory probe command (health.pid_probe, health.rss_probe) may run; it runs on the hook path, so a wedged one is cut off and reads as no answer."
value = 1000
min = 1
unit = "ms"

[health.probe_poll_ms]
doc = "How often a running probe command is checked for completion."
value = 2
min = 1
unit = "ms"

[proc.read_grace_ms]
doc = "After a helper process (git, ps, vm_stat, a scheduled job) exits, the least time its output may take to reach end of file (it may also use what is left of the command's own timeout, as Node's spawnSync does); a process it left behind that still holds a pipe is then killed with its group and the output counts as unread, never as a whole answer."
value = 500
min = 1
unit = "ms"

[health.rss_probe]
doc = "Command used to read this process's resident set where /proc is unavailable (macOS): the program, then its arguments with `{pid}` substituted."
value = ["ps", "-o", "rss=", "-p", "{pid}"]

[health.serve_arg]
doc = "Subcommand a daemon is started with; also how a live engine is recognised in the process list."
value = "serve"

# ---- hook protocol adapter ------------------------------------------------------------------------------

[hook.event_keys]
doc = "Payload fields that can carry the event name, tried in order (Claude Code and Codex send `hook_event_name`)."
value = ["hook_event_name", "hookEventName", "event"]

[hook.warn_prefix]
doc = "Prefix of a `warn` rule's message in agent-visible output."
value = "anti-hall warning: "

# ---- socket protocol (listed in the generated reference, D50) -------------------------------------------

[protocol.hook]
doc = "A hook payload evaluated against the rules and built-in checks. The client half-closes after writing; the reply is always a framed OK, BUSY or ERR, and anything else makes the client run the Node hook."
value = { request = "V <client-version>\nE <request env JSON>\n<hook payload JSON>", reply = "OK <hook output JSON or empty> | BUSY | ERR <reason>" }

[protocol.ping]
doc = "Liveness probe; also how a starting daemon checks that a live one already owns the socket."
value = { request = "CTL ping", reply = "OK pong <version> <pid>" }

[protocol.reload]
doc = "Re-read the rules file now (it is also re-read on SIGHUP and on change)."
value = { request = "CTL reload", reply = "OK ok" }

[protocol.stop]
doc = "Drain and exit."
value = { request = "CTL stop", reply = "OK ok" }

[protocol.status]
doc = "The daemon's state as JSON, including a headline summary."
value = { request = "CTL status", reply = "OK <status JSON>" }

[protocol.metrics]
doc = "All metric series as JSON, optionally for one check; with rollup, the stored rollups of one resolution instead."
value = { request = "CTL metrics [check=<name>] [rollup=<resolution> since=<s>]", reply = "OK <metrics JSON>" }

[protocol.impact]
doc = "The impact ledger report as JSON."
value = { request = "CTL impact [kind=<kind>] [project=<hash>] [recent=<n>] [window=<7d>]", reply = "OK <impact JSON>" }

[protocol.telemetry]
doc = "The telemetry summary or its events as JSON, including what the daemon has recorded but not yet flushed (D78)."
value = { request = "CTL telemetry [summary|events] [window=<7d>] [kind=<k>] [limit=<n>]", reply = "OK <telemetry JSON>" }

[protocol.schedule]
doc = "The scheduler: the jobs and their schedules, run one now, or the run history."
value = { request = "CTL schedule list | run job=<name> | history [job=<name>] [limit=<n>]", reply = "OK <schedule JSON>" }

[protocol.project]
doc = "A per-project operation on hot.db; the daemon derives the partition from the cwd, so a request cannot name another project's key. A write is answered only after it commits; the optional write id makes it idempotent."
value = { request = "P <cwd>\n[W <write-id>\n]<put|take|len|set|setex|get> [args]", reply = "OK <value> | ERR <reason> | BUSY" }

# ---- the environment a request carries (D76) -------------------------------------------------------------

[request_env.allow]
doc = "The environment variables the client forwards with every request, and the only ones the daemon evaluates a check with (never its own environment). A trailing `*` matches a prefix. PATH is read by scan-throttle. DISABLE_ANTIHALL_DEVSWARM and DEVSWARM_REPO_ID decide whether DevSwarm is active, CLAUDE_CONFIG_DIR locates the host's transcripts and NODE_TEST_CONTEXT marks a test run (inbox-read-guard, orch-on-spawn, verify-first-orch). DEVSWARM_SOURCE_BRANCH (non-empty in a DevSwarm child workspace) is read by verify-first-subagent. verify-first also reads DEVSWARM_REPO_ID, DEVSWARM_SOURCE_BRANCH and DISABLE_ANTIHALL_DEVSWARM to see whether the session could be a DevSwarm Primary. DEVSWARM_SOURCE_BRANCH also marks a DevSwarm child workspace for ask-guard. DEVSWARM_REPO_ID, DEVSWARM_SOURCE_BRANCH and DISABLE_ANTIHALL_DEVSWARM are also read by the DevSwarm prompt gates (devswarm-parent-inbox, devswarm-child-turn). DEVSWARM_BUILDER_ID and DEVSWARM_AI_AGENT (with the repo id, the source branch and the DISABLE_ANTIHALL_DEVSWARM kill switch) are read by the devswarm-child-role and devswarm-parent-gate checks. CLAUDE_PLUGIN_OPTION_* carry the plugin options the guards' switch chain reads. The rest are what the git check needs to see the client's git, never the daemon's: the `gitcache.bypass_env` names, XDG_CONFIG_HOME (locates git's config), the GIT_CONFIG_* variables (GIT_CONFIG_COUNT with its KEY_n/VALUE_n pairs travel together, since git exits 128 on a COUNT without its KEY_0; PARAMETERS and NOSYSTEM likewise), GIT_EXEC_PATH (locates git's helpers) and the object-store variables GIT_OBJECT_DIRECTORY, GIT_ALTERNATE_OBJECT_DIRECTORIES and GIT_NO_REPLACE_OBJECTS. LANG and LC_* are not forwarded: the git calls discard stderr and read only config data from stdout. TZ decides the local calendar date and local-time date strings of the handover and Codex checks, and TMPDIR, TMP and TEMP locate the session scratchpad the Codex nudge exempts, and decide where `os.tmpdir()` points in the task checks (scratch paths do not count as work). DISABLE_OMC and OMC_SKIP_HOOKS are the oh-my-claudecode kill switches task-guard reads before it steps aside for an OMC loop."
value = ["CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CONFIG_DIR", "DEVSWARM_REPO_ID", "DEVSWARM_SOURCE_BRANCH", "DISABLE_ANTIHALL_DEVSWARM", "NODE_TEST_CONTEXT", "ANTIHALL_*", "ANTI_HALL_*", "HOME", "USERPROFILE", "CLAUDE_PROJECT_DIR", "CLAUDE_PLUGIN_OPTION_*", "PATH", "AH_ENGINE_PLUGIN_ROOT", "GIT_DIR", "GIT_WORK_TREE", "GIT_COMMON_DIR", "GIT_CEILING_DIRECTORIES", "GIT_DISCOVERY_ACROSS_FILESYSTEM", "GIT_CONFIG", "GIT_CONFIG_GLOBAL", "GIT_CONFIG_SYSTEM", "GIT_CONFIG_COUNT", "GIT_CONFIG_KEY_*", "GIT_CONFIG_VALUE_*", "GIT_CONFIG_PARAMETERS", "GIT_CONFIG_NOSYSTEM", "GIT_EXEC_PATH", "GIT_INDEX_FILE", "GIT_NAMESPACE", "GIT_OBJECT_DIRECTORY", "GIT_ALTERNATE_OBJECT_DIRECTORIES", "GIT_NO_REPLACE_OBJECTS", "XDG_CONFIG_HOME", "TZ", "TMPDIR", "TMP", "TEMP", "DEVSWARM_BUILDER_ID", "DEVSWARM_AI_AGENT", "DISABLE_OMC", "OMC_SKIP_HOOKS"]

[request_env.line_prefix]
doc = "Prefix of the request line that carries the forwarded environment as one JSON object."
value = "E "

[request_env.incomplete_key]
doc = "Reserved name, never a forwardable variable, that carries the request's incomplete flag inside the forwarded environment object (the client's variables were dropped or it had no HOME), so the daemon's checks defer to the Node guards."
value = "ah_env_incomplete"

[request_env.max_bytes]
doc = "Largest forwarded environment (sum of names and values); a client whose allowed variables exceed it forwards none of them and the request is marked incomplete, so every check defers to the Node guard (a missing or empty HOME marks it incomplete too)."
value = 65536
unit = "bytes"
min = 1024

[load.minutes_kept]
doc = "How many one-minute buckets of request load the daemon keeps (a rolling window; older buckets are dropped, so memory does not grow with traffic)."
value = 60
min = 1

[load.sessions_cap]
doc = "Most distinct session ids remembered per minute bucket; past it sessions are only counted."
value = 1024
min = 1

[load.events_cap]
doc = "Most distinct hook events listed per minute bucket; past it the rest are counted together."
value = 32
min = 1

[load.proc_buckets_us]
doc = "Upper edges of the processing-time histogram (microseconds) the per-minute p95 is read from."
value = [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 1000000]

[load.wait_noise_us]
doc = "A wait up to this long between accept and processing is the hand-off between two threads, not queueing; only longer waits count as `calls_that_waited`."
value = 1000
unit = "us"

[load.saturation_wait_ms]
doc = "A call that waited longer than this between accept and the start of its processing marks that minute saturated: calls are waiting on each other."
value = 100
unit = "ms"

[load.saturation_window_minutes]
doc = "`status` reports the engine saturated while a saturated minute lies within this many minutes."
value = 10
unit = "min"

# ---- atomic file writes ---------------------------------------------------------------------------------

[atomic.tmp_suffix]
doc = "Suffix of the temporary file every atomic state write goes through before the rename (a `.json` target keeps a `.json` ending after it)."
value = ".tmp"

# ---- deliberate discards --------------------------------------------------------------------------------

[discard.log_interval_ms]
doc = "A best-effort operation that fails (a state write the engine fails open on) is logged once per reason code in this many milliseconds; repeats inside the window are dropped so a failing disk cannot flood the event log."
value = 60000
unit = "ms"
min = 1000

[discard.log_kind]
doc = "The event-log kind of every line a best-effort operation writes when it fails; the reason code is the line's code."
value = "discard"

[health.degraded_kinds]
doc = "Event-log kinds that mark the engine degraded while one is in the degraded window (a defaults file or setting that fell back to the last-known-good or pristine copy, or missing settings that could not be healed)."
value = ["defaults_fallback", "defaults_heal_skipped"]

[defaults_load.msg_fallback]
doc = "Event-log detail when a defaults file or setting was rejected and another layer answered. Placeholders: {file}, {key} (empty for a whole file), {layer} (lkg or pristine), {why}."
value = "defaults {file} {key} rejected ({why}): using the {layer} copy"

[defaults_load.msg_lkg_failed]
doc = "Event-log detail when the last-known-good copy of the defaults could not be written. Placeholder: {err}."
value = "could not write the last-known-good defaults: {err}"

[defaults_load.lkg_keep]
doc = "How many last-known-good copies of the defaults (one per engine version, plugin root and shipped content) the state directory keeps; older ones are removed."
value = 3
min = 1
max = 100

[msg.advisory_defaults]
doc = "Appended to the degraded notice when defaults fell back to another layer. Placeholders: {count} fallbacks in the window, {last} the last one's detail."
value = " Defaults: {count} setting(s) or file(s) fell back to a safe copy (last: {last}); fix the file or run `ah-engine config heal`."

[defaults_load.vcs_markers]
doc = "Entries (a directory or a file) that mark a version-controlled checkout: when the plugin root or a directory above it holds one, missing settings are never written into its files automatically (only `ah-engine config heal` writes there)."
value = [".git"]

[defaults_load.backup_infix]
doc = "What separates a defaults file's name from the time stamp of its one-time backup, taken before the first heal writes the file."
value = ".bak-"

[defaults_load.msg_heal]
doc = "Event-log detail (and `config heal` output) when missing settings were added to an edited defaults file from the pristine copy. Placeholders: {file}, {keys}, {backup} (the backup file, or empty when one already existed)."
value = "defaults {file}: added missing {keys} from the pristine copy (backup {backup})"

[defaults_load.msg_heal_skipped]
doc = "Event-log detail when missing settings were not written because the plugin root is a version-controlled checkout. Placeholders: {file}, {keys}."
value = "defaults {file}: missing keys {keys}: run `ah-engine config heal` to add them"

[defaults_load.msg_heal_failed]
doc = "Event-log detail (and `config heal` output) when missing settings could not be added. Placeholders: {file}, {keys}, {err}."
value = "defaults {file}: could not add missing {keys}: {err}"

[defaults_load.msg_heal_none]
doc = "Printed by `config heal` when no edited defaults file lacks a setting of the pristine copy."
value = "nothing to heal: the edited defaults have every setting of the pristine copy"

