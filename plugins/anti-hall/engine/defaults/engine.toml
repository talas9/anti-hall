# ---- binary integrity and roll-back (`ah-hook integrity`, ah-launcher/src/integrity.rs) ---------------------------------------------------------
# The thin client (ah-hook) reads these keys itself, so a broken engine binary cannot stop it.

[rollback.hash_chunk]
doc = "Bytes read at a time when the engine hashes its own binary (sha256)."
value = 65536
min = 4096
unit = "bytes"

[rollback.field_sep]
doc = "Separator between the fields of the crash-loop binary record (files.crashloop_bin: size, modification time, sha256)."
value = " "

[rollback.line_end]
doc = "Line terminator of the crash-loop binary record."
value = "\n"

[rollback.client]
doc = "File name, in the binary directory (rollback.bin_dir) of the state directory, of the thin client (`ah-hook`) that runs the integrity verbs. The engine starts it with launcher.cli_integrity_verb and `check` after a crash-loop trip."
value = "ah-hook"

[rollback.on_mismatch]
doc = "1 = a binary whose sha256 differs from the one the installer recorded (swapped by hand) and that has never run healthy is rolled back to the known-good binary at the next check. 0 = never roll back on a mismatch alone (a local build you are developing). `accept` records the installed binary as the expected one."
value = 1
env = "AH_ENGINE_ROLLBACK_ON_MISMATCH"
min = 0
max = 1

[rollback.fail_n]
doc = "Engine failures seen by the thin client (timeout, signal death, no answer) within rollback.fail_window_s that roll a never-healthy binary back. The thin client counts them because a hung binary cannot count its own."
value = 3
env = "AH_ENGINE_ROLLBACK_FAIL_N"
min = 1

[rollback.fail_window_s]
doc = "Window in which the wrapper's engine failures are counted for rollback.fail_n."
value = 120
env = "AH_ENGINE_ROLLBACK_FAIL_WINDOW_S"
unit = "s"

[rollback.bin_dir]
doc = "Directory inside the state directory that holds the engine binary and its copies."
value = "bin"

[rollback.bin_name]
doc = "File name of the installed engine binary."
value = "ah-engine"

[rollback.good_suffix]
doc = "Suffix of the known-good copy of the binary (bin/ah-engine.good) and of its sha256 file (.good.sha256). Never deleted."
value = ".good"

[rollback.expected_suffix]
doc = "Suffix of the file holding the sha256 the installer expects the installed binary to have (bin/ah-engine.expected)."
value = ".expected"

[rollback.accepted_suffix]
doc = "Suffix added to the expected-sha file for the note that the operator vouched for exactly that binary (`accept`): a vouched-for binary is never rolled back."
value = ".accepted"

[rollback.sha_suffix]
doc = "Suffix of the file holding the sha256 of the known-good copy (bin/ah-engine.good.sha256)."
value = ".sha256"

[rollback.aside_infix]
doc = "A binary set aside by a roll-back is renamed bin/ah-engine.rolledback-<UTC time>-<sha prefix>; this is the word between. Set-aside binaries are never deleted."
value = ".rolledback-"

[rollback.install_lock]
doc = "Directory (inside the state directory) of the ONE lock every writer of the engine binary shares: the integrity check and roll-back, the installer's and the updater's install and roll-back, and the recording of the expected sha256. Taken and given back through `ah-hook integrity lock` and `unlock`."
value = "install.lock"

[rollback.lock_wait_s]
doc = "How long an install, a roll-back by the updater, or the recording of the expected sha256 waits for the install lock before giving up (the installer then fails and keeps the old binary)."
value = 60
env = "AH_ENGINE_INSTALL_LOCK_WAIT_S"
unit = "s"

[rollback.lock_hook_wait_s]
doc = "How long the integrity check started by the thin client waits for the install lock before skipping (the next run checks). A held lock never holds a session."
value = 2
env = "AH_ENGINE_INSTALL_LOCK_HOOK_WAIT_S"
unit = "s"

[rollback.lock_poll_ms]
doc = "How often a process waiting for the install lock looks at it again."
value = 1000
min = 10
unit = "ms"

[rollback.lock_stale_s]
doc = "An install lock held longer than this is broken (one whose holder process is gone is broken at once). Longer than the slowest install: updater.go_live_timeout_s."
value = 900
env = "AH_ENGINE_INSTALL_LOCK_STALE_S"
unit = "s"

[rollback.lock_owner_file]
doc = "Name of the file inside the install-lock directory that holds the owner token (\"<pid> <epoch>\" of the holder). Created only with a hard link and taken away only with a rename, so one taker wins."
value = "owner"

[rollback.log_max_bytes]
doc = "The integrity log (files.integrity_log) is cut back to its last rollback.log_keep_lines lines once it is larger than this."
value = 65536
min = 1024
unit = "bytes"

[rollback.log_keep_lines]
doc = "Lines the integrity log keeps when it is cut back."
value = 200
min = 1

[rollback.fail_log_max_lines]
doc = "The wrapper failure log (files.wrapper_fail_log) is cut back to its last rollback.fail_log_keep_lines lines once it has more lines than this."
value = 200
min = 1

[rollback.fail_log_keep_lines]
doc = "Lines the wrapper failure log keeps when it is cut back."
value = 50
min = 1

[crash.closed_pipe_prefix]
doc = "Start of the panic message Rust prints when a write to stdout or stderr fails; with `crash.closed_pipe_marker` it recognises a closed pipe (`ah-engine docs | head`), which is the reader leaving and not an engine crash."
value = "failed printing to std"

