[daemon.idle_exit_s]
doc = "Seconds without any request after which the daemon exits cleanly (the next hook call starts a fresh one, and the scheduler catches up its missed jobs); 0 keeps it resident. Default is 1800 (about 30 minutes), so a daemon with no sessions does not linger forever. A daemon whose state dir, lock file or executable is gone still exits on its own (daemon.orphan_check_ms)."
value = 1800
env = "AH_ENGINE_IDLE_EXIT_S"
unit = "s"

[daemon.cpu_check_ms]
