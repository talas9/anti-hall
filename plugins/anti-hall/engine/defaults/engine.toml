[launcher.knob_install_retry_s]
doc = "Test-only: environment variable that replaces install.retry_s."
value = "AH_BOOTSTRAP_RETRY_S"

[launcher.knob_install_run_s]
doc = "Test-only: environment variable that replaces install.run_s."
value = "AH_BOOTSTRAP_RUN_S"

[launcher.knob_integrity_park]
doc = "Test-only: environment variable naming a path prefix; the integrity verbs stop at their race points (`validated`, `before_break`, `after_break`) while the file <prefix>.<point> exists, and create <prefix>.<point>.parked when they arrive. Honoured only when the test flag is set. It makes the install-lock interleavings deterministic."
