# ---- socket protocol (listed in the generated reference, D50) -------------------------------------------

[protocol.hook]
doc = "A hook payload evaluated against the rules and built-in checks. The client half-closes after writing; the reply is always a framed OK, BUSY or ERR, and anything else makes the client run the Node hook."
value = { request = "V <client-version>\nE <request env JSON>\n<hook payload JSON>", reply = "OK <hook output JSON or empty> | BUSY | ERR <reason>" }

[protocol.ping]
doc = "Liveness probe; also how a starting daemon checks that a live one already owns the socket."
value = { request = "CTL ping", reply = "OK pong <version> <pid>" }

[protocol.reload]
doc = "Re-read the rules file now (it is also re-read on SIGHUP and on change)."
value = { request = "CTL reload", reply = "OK ok" }

[protocol.stop]
doc = "Drain and exit."
value = { request = "CTL stop", reply = "OK ok" }

[protocol.status]
doc = "The daemon's state as JSON, including a headline summary."
value = { request = "CTL status", reply = "OK <status JSON>" }

[protocol.metrics]
doc = "All metric series as JSON, optionally for one check; with rollup, the stored rollups of one resolution instead."
value = { request = "CTL metrics [check=<name>] [rollup=<resolution> since=<s>]", reply = "OK <metrics JSON>" }

[protocol.impact]
doc = "The impact ledger report as JSON."
value = { request = "CTL impact [kind=<kind>] [project=<hash>] [recent=<n>] [window=<7d>]", reply = "OK <impact JSON>" }

[protocol.telemetry]
doc = "The telemetry summary or its events as JSON, including what the daemon has recorded but not yet flushed (D78)."
value = { request = "CTL telemetry [summary|events] [window=<7d>] [kind=<k>] [limit=<n>]", reply = "OK <telemetry JSON>" }

[protocol.schedule]
doc = "The scheduler: the jobs and their schedules, run one now, or the run history."
value = { request = "CTL schedule list | run job=<name> | history [job=<name>] [limit=<n>]", reply = "OK <schedule JSON>" }

[protocol.project]
doc = "A per-project operation on hot.db; the daemon derives the partition from the cwd, so a request cannot name another project's key. A write is answered only after it commits; the optional write id makes it idempotent."
value = { request = "P <cwd>\n[W <write-id>\n]<put|take|len|set|setex|get> [args]", reply = "OK <value> | ERR <reason> | BUSY" }

# ---- the environment a request carries (D76) -------------------------------------------------------------

[request_env.peer_pid_key]
doc = "The name under which a daemon request's sender pid (its socket peer; 0 when the socket did not say) reaches the checks. Not on the allowlist, so no client can set it; host functions that walk the process ancestry (the DevSwarm reader nonce) start there. Absent in a one-shot `ah-engine check`, which starts at itself."
value = "AH_ENGINE_REQUEST_PEER_PID"

[request_env.allow]
doc = "The environment variables the client forwards with every request, and the only ones the daemon evaluates a check with (never its own environment). A trailing `*` matches a prefix. PATH is read by scan-throttle. DISABLE_ANTIHALL_DEVSWARM and DEVSWARM_REPO_ID decide whether DevSwarm is active, CLAUDE_CONFIG_DIR locates the host's transcripts and NODE_TEST_CONTEXT marks a test run (inbox-read-guard, orch-on-spawn, verify-first-orch). DEVSWARM_SOURCE_BRANCH (non-empty in a DevSwarm child workspace) is read by verify-first-subagent. verify-first also reads DEVSWARM_REPO_ID, DEVSWARM_SOURCE_BRANCH and DISABLE_ANTIHALL_DEVSWARM to see whether the session could be a DevSwarm Primary. DEVSWARM_SOURCE_BRANCH also marks a DevSwarm child workspace for ask-guard. DEVSWARM_REPO_ID, DEVSWARM_SOURCE_BRANCH and DISABLE_ANTIHALL_DEVSWARM are also read by the DevSwarm prompt gates (devswarm-parent-inbox, devswarm-child-turn). DEVSWARM_BUILDER_ID and DEVSWARM_AI_AGENT (with the repo id, the source branch and the DISABLE_ANTIHALL_DEVSWARM kill switch) are read by the devswarm-child-role and devswarm-parent-gate checks. DEVSWARM_BUILDER_NAME is written into the heartbeat of devswarm-child-turn. CLAUDE_PLUGIN_OPTION_* carry the plugin options the guards' switch chain reads. The rest are what the git check needs to see the client's git, never the daemon's: the `gitcache.bypass_env` names, XDG_CONFIG_HOME (locates git's config), the GIT_CONFIG_* variables (GIT_CONFIG_COUNT with its KEY_n/VALUE_n pairs travel together, since git exits 128 on a COUNT without its KEY_0; PARAMETERS and NOSYSTEM likewise), GIT_EXEC_PATH (locates git's helpers) and the object-store variables GIT_OBJECT_DIRECTORY, GIT_ALTERNATE_OBJECT_DIRECTORIES and GIT_NO_REPLACE_OBJECTS. LANG and LC_* are not forwarded: the git calls discard stderr and read only config data from stdout. TZ decides the local calendar date and local-time date strings of the handover and Codex checks, and TMPDIR, TMP and TEMP locate the session scratchpad the Codex nudge exempts, and decide where `os.tmpdir()` points in the task checks (scratch paths do not count as work). DISABLE_OMC and OMC_SKIP_HOOKS are the oh-my-claudecode kill switches task-guard reads before it steps aside for an OMC loop."
value = ["CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CONFIG_DIR", "DEVSWARM_REPO_ID", "DEVSWARM_SOURCE_BRANCH", "DISABLE_ANTIHALL_DEVSWARM", "NODE_TEST_CONTEXT", "ANTIHALL_*", "ANTI_HALL_*", "HOME", "USERPROFILE", "CLAUDE_PROJECT_DIR", "CLAUDE_PLUGIN_OPTION_*", "PATH", "AH_ENGINE_PLUGIN_ROOT", "GIT_DIR", "GIT_WORK_TREE", "GIT_COMMON_DIR", "GIT_CEILING_DIRECTORIES", "GIT_DISCOVERY_ACROSS_FILESYSTEM", "GIT_CONFIG", "GIT_CONFIG_GLOBAL", "GIT_CONFIG_SYSTEM", "GIT_CONFIG_COUNT", "GIT_CONFIG_KEY_*", "GIT_CONFIG_VALUE_*", "GIT_CONFIG_PARAMETERS", "GIT_CONFIG_NOSYSTEM", "GIT_EXEC_PATH", "GIT_INDEX_FILE", "GIT_NAMESPACE", "GIT_OBJECT_DIRECTORY", "GIT_ALTERNATE_OBJECT_DIRECTORIES", "GIT_NO_REPLACE_OBJECTS", "XDG_CONFIG_HOME", "TZ", "TMPDIR", "TMP", "TEMP", "DEVSWARM_BUILDER_ID", "DEVSWARM_BUILDER_NAME", "DEVSWARM_AI_AGENT", "DISABLE_OMC", "OMC_SKIP_HOOKS"]

[request_env.presence_only]
doc = "Environment variables whose PRESENCE the checks need but whose value they must never see (a secret): the client forwards the presence text when one is set and non-empty, nothing otherwise, and the value never leaves the client. These are the legacy API-key variables the session-start key notice looks for (credentials.js legacyKeyPresent)."
value = ["ANTHROPIC_API_KEY"]

[request_env.presence_text]
doc = "The value a presence-only variable carries on the wire."
value = "1"

[request_env.line_prefix]
doc = "Prefix of the request line that carries the forwarded environment as one JSON object."
value = "E "

[request_env.incomplete_key]
doc = "Reserved name, never a forwardable variable, that carries the request's incomplete flag inside the forwarded environment object (the client's variables were dropped or it had no HOME), so the daemon's checks defer to the Node guards."
value = "ah_env_incomplete"

[request_env.max_bytes]
doc = "Largest forwarded environment (sum of names and values); a client whose allowed variables exceed it forwards none of them and the request is marked incomplete, so every check defers to the Node guard (a missing or empty HOME marks it incomplete too)."
value = 65536
unit = "bytes"
min = 1024

[load.minutes_kept]
doc = "How many one-minute buckets of request load the daemon keeps (a rolling window; older buckets are dropped, so memory does not grow with traffic)."
value = 60
min = 1

[load.sessions_cap]
doc = "Most distinct session ids remembered per minute bucket; past it sessions are only counted."
value = 1024
min = 1

[load.events_cap]
doc = "Most distinct hook events listed per minute bucket; past it the rest are counted together."
value = 32
min = 1

[load.proc_buckets_us]
doc = "Upper edges of the processing-time histogram (microseconds) the per-minute p95 is read from."
value = [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 1000000]

[load.wait_noise_us]
doc = "A wait up to this long between accept and processing is the hand-off between two threads, not queueing; only longer waits count as `calls_that_waited`."
value = 1000
unit = "us"

[load.saturation_wait_ms]
doc = "A call that waited longer than this between accept and the start of its processing marks that minute saturated: calls are waiting on each other."
value = 100
unit = "ms"

[load.saturation_window_minutes]
doc = "`status` reports the engine saturated while a saturated minute lies within this many minutes."
value = 10
unit = "min"

[load.notes_cap]
doc = "Most counted events (a kept-walk hit or the reason it missed) one check may note before it finishes; further notes of that check are dropped."
value = 64
min = 1

[load.size_buckets_bytes]
doc = "Upper edges (bytes) of the transcript-size classes the per-check Stop latency and bytes-read metrics are split by; `load.size_labels` names the classes (one more label than edges, the last for anything larger)."
value = [204800, 1048576, 10485760, 104857600]
unit = "bytes"

[load.size_labels]
doc = "Names of the transcript-size classes, smallest first (one more than `load.size_buckets_bytes` has edges)."
value = ["lt200k", "lt1m", "lt10m", "lt100m", "ge100m"]

[load.size_label_unknown]
doc = "Size class used when a request names no readable transcript."
value = "none"

# ---- atomic file writes ---------------------------------------------------------------------------------

[atomic.tmp_suffix]
doc = "Suffix of the temporary file every atomic state write goes through before the rename (a `.json` target keeps a `.json` ending after it)."
value = ".tmp"

# ---- deliberate discards --------------------------------------------------------------------------------

[discard.log_interval_ms]
doc = "A best-effort operation that fails (a state write the engine fails open on) is logged once per reason code in this many milliseconds; repeats inside the window are dropped so a failing disk cannot flood the event log."
value = 60000
unit = "ms"
min = 1000

[discard.log_kind]
doc = "The event-log kind of every line a best-effort operation writes when it fails; the reason code is the line's code."
value = "discard"

[health.degraded_kinds]
doc = "Event-log kinds that mark the engine degraded while one is in the degraded window (a defaults file or setting that fell back to the last-known-good or pristine copy, or missing settings that could not be healed)."
value = ["defaults_fallback", "defaults_heal_skipped"]

[defaults_load.msg_fallback]
doc = "Event-log detail when a defaults file or setting was rejected and another layer answered. Placeholders: {file}, {key} (empty for a whole file), {layer} (lkg or pristine), {why}."
value = "defaults {file} {key} rejected ({why}): using the {layer} copy"

[defaults_load.msg_lkg_failed]
doc = "Event-log detail when the last-known-good copy of the defaults could not be written. Placeholder: {err}."
value = "could not write the last-known-good defaults: {err}"

[defaults_load.lkg_keep]
doc = "How many last-known-good copies of the defaults (one per engine version, plugin root and shipped content) the state directory keeps; older ones are removed."
value = 3
min = 1
max = 100

[msg.advisory_defaults]
doc = "Appended to the degraded notice when defaults fell back to another layer. Placeholders: {count} fallbacks in the window, {last} the last one's detail."
value = " Defaults: {count} setting(s) or file(s) fell back to a safe copy (last: {last}); fix the file or run `ah-engine config heal`."

[defaults_load.vcs_markers]
doc = "Entries (a directory or a file) that mark a version-controlled checkout: when the plugin root or a directory above it holds one, missing settings are never written into its files automatically (only `ah-engine config heal` writes there)."
value = [".git"]

[defaults_load.backup_infix]
doc = "What separates a defaults file's name from the time stamp of its one-time backup, taken before the first heal writes the file."
value = ".bak-"

[defaults_load.msg_heal]
doc = "Event-log detail (and `config heal` output) when missing settings were added to an edited defaults file from the pristine copy. Placeholders: {file}, {keys}, {backup} (the backup file, or empty when one already existed)."
value = "defaults {file}: added missing {keys} from the pristine copy (backup {backup})"

[defaults_load.msg_heal_held]
doc = "Event-log detail when missing settings were not written because a deploy hold (the daemon-down marker) is active: a deploy is replacing the plugin files, and a heal from the binary being replaced would write into the half-synced defaults. Placeholders: {file}, {keys}."
value = "defaults {file}: missing keys {keys}: not written during a deploy hold; the next load heals them once the hold ends"

[defaults_load.msg_heal_skipped]
doc = "Event-log detail when missing settings were not written because the plugin root is a version-controlled checkout. Placeholders: {file}, {keys}."
value = "defaults {file}: missing keys {keys}: run `ah-engine config heal` to add them"

[defaults_load.msg_heal_failed]
doc = "Event-log detail (and `config heal` output) when missing settings could not be added. Placeholders: {file}, {keys}, {err}."
value = "defaults {file}: could not add missing {keys}: {err}"

[defaults_load.msg_heal_none]
doc = "Printed by `config heal` when no edited defaults file lacks a setting of the pristine copy."
value = "nothing to heal: the edited defaults have every setting of the pristine copy"

# ---- binary integrity and roll-back (hooks/ah-engine-integrity.sh) ---------------------------------------------------------
# The script is POSIX sh and reads these keys itself (awk over this file, like the hook wrapper), so a broken binary cannot stop it.

[rollback.hash_chunk]
doc = "Bytes read at a time when the engine hashes its own binary (sha256)."
value = 65536
min = 4096
unit = "bytes"

[rollback.field_sep]
doc = "Separator between the fields of the crash-loop binary record (files.crashloop_bin: size, modification time, sha256)."
value = " "

[rollback.line_end]
doc = "Line terminator of the crash-loop binary record."
value = "\n"

[rollback.script]
doc = "The integrity script, relative to the plugin root. verbs: record, accept, check, fail, status."
value = "hooks/ah-engine-integrity.sh"

[rollback.shell]
doc = "The shell that runs the integrity script."
value = "sh"

[rollback.on_mismatch]
doc = "1 = a binary whose sha256 differs from the one the installer recorded (swapped by hand) and that has never run healthy is rolled back to the known-good binary at the next check. 0 = never roll back on a mismatch alone (a local build you are developing). `accept` records the installed binary as the expected one."
value = 1
env = "AH_ENGINE_ROLLBACK_ON_MISMATCH"
min = 0
max = 1

[rollback.fail_n]
doc = "Engine failures seen by the hook wrapper (timeout, signal death, no answer) within rollback.fail_window_s that roll a never-healthy binary back. The wrapper counts them because a hung binary cannot count its own."
value = 3
env = "AH_ENGINE_ROLLBACK_FAIL_N"
min = 1

[rollback.fail_window_s]
doc = "Window in which the wrapper's engine failures are counted for rollback.fail_n."
value = 120
env = "AH_ENGINE_ROLLBACK_FAIL_WINDOW_S"
unit = "s"

[rollback.bin_dir]
doc = "Directory inside the state directory that holds the engine binary and its copies."
value = "bin"

[rollback.bin_name]
doc = "File name of the installed engine binary."
value = "ah-engine"

[rollback.good_suffix]
doc = "Suffix of the known-good copy of the binary (bin/ah-engine.good) and of its sha256 file (.good.sha256). Never deleted."
value = ".good"

[rollback.expected_suffix]
doc = "Suffix of the file holding the sha256 the installer expects the installed binary to have (bin/ah-engine.expected)."
value = ".expected"

[rollback.accepted_suffix]
doc = "Suffix added to the expected-sha file for the note that the operator vouched for exactly that binary (`accept`): a vouched-for binary is never rolled back."
value = ".accepted"

[rollback.sha_suffix]
doc = "Suffix of the file holding the sha256 of the known-good copy (bin/ah-engine.good.sha256)."
value = ".sha256"

[rollback.aside_infix]
doc = "A binary set aside by a roll-back is renamed bin/ah-engine.rolledback-<UTC time>-<sha prefix>; this is the word between. Set-aside binaries are never deleted."
value = ".rolledback-"

[rollback.install_lock]
doc = "Directory (inside the state directory) of the ONE lock every writer of the engine binary shares: the integrity script's check and roll-back, the bootstrap's and ah-update's install and roll-back, and the recording of the expected sha256. Taken and given back through the integrity script's lock and unlock verbs."
value = "install.lock"

[rollback.lock_wait_s]
doc = "How long an install, a roll-back by ah-update, or the recording of the expected sha256 waits for the install lock before giving up (the installer then fails and keeps the old binary)."
value = 60
env = "AH_ENGINE_INSTALL_LOCK_WAIT_S"
unit = "s"

[rollback.lock_hook_wait_s]
doc = "How long the integrity check started by the hook wrapper waits for the install lock before skipping (the next run checks). A held lock never holds a session."
value = 2
env = "AH_ENGINE_INSTALL_LOCK_HOOK_WAIT_S"
unit = "s"

[rollback.lock_stale_s]
doc = "An install lock held longer than this is broken (one whose holder process is gone is broken at once). Longer than the slowest install: ah-update's go_live_timeout_s."
value = 900
env = "AH_ENGINE_INSTALL_LOCK_STALE_S"
unit = "s"

[crash.closed_pipe_prefix]
doc = "Start of the panic message Rust prints when a write to stdout or stderr fails; with `crash.closed_pipe_marker` it recognises a closed pipe (`ah-engine docs | head`), which is the reader leaving and not an engine crash."
value = "failed printing to std"

[crash.closed_pipe_marker]
doc = "Text of the I/O error that marks the closed-pipe panic (see `crash.closed_pipe_prefix`)."
value = "Broken pipe"

# ---- the hook launcher (ah-launcher, binary `ah-hook`): its own limits, names and switches ------------------------------------
# The launcher is the bootloader in front of the engine; it reads these at start. A missing or invalid file falls back to the
# launcher's built-in copy (ah-launcher/src/builtin.rs, kept equal to this file by a test).

[launcher.stdin_idle_ms]
doc = "How long the launcher waits for the host to deliver more of the hook payload before it stops reading and hands the engine what it has."
value = 1000
min = 1
unit = "ms"

[launcher.write_timeout_ms]
doc = "How long a write of the payload to the engine may make no progress (the engine is not reading) before the launcher stops feeding it."
value = 1000
min = 1
unit = "ms"

[launcher.connect_timeout_ms]
doc = "Bound on the launcher's probe connection to the daemon socket (it only tells a live daemon from a stale socket file)."
value = 50
min = 1
unit = "ms"

[launcher.spawn_retry_max]
doc = "How many times the launcher retries starting the engine when the start itself failed for a transient reason (resource exhaustion, binary busy). Never after the engine was started."
value = 2
max = 10
unit = "count"

[launcher.spawn_backoff_base_ms]
doc = "First wait between engine start retries; each retry doubles it up to launcher.spawn_backoff_cap_ms."
value = 5
min = 1
unit = "ms"

[launcher.spawn_backoff_cap_ms]
doc = "Longest wait between engine start retries (before jitter). Every wait also stays inside the event's hard deadline."
value = 40
min = 1
unit = "ms"

[launcher.spawn_jitter_pct]
doc = "Random share (percent) taken off each retry wait so concurrent launchers do not retry in step."
value = 50
max = 100
unit = "percent"

[launcher.io_chunk_bytes]
doc = "Size of the fixed buffer the launcher moves the payload and the engine's output with. Memory stays this size however large the payload is."
value = 65536
min = 512
unit = "bytes"

[launcher.payload_prefix_bytes]
doc = "How much of the payload the launcher keeps in memory: the part it inspects (session id, stop flag) and replays to the fallback runner. The rest is streamed through and never held."
value = 1048576
min = 4096
unit = "bytes"

[launcher.out_cap_bytes]
doc = "Most engine standard output the launcher keeps. A hook answer is small; more than this is treated as a failed engine and the hook is let through."
value = 4194304
min = 4096
unit = "bytes"

[launcher.err_cap_bytes]
doc = "Most engine standard error the launcher keeps (same rule as launcher.out_cap_bytes)."
value = 1048576
min = 4096
unit = "bytes"

[launcher.stdin_soft_bytes]
doc = "Soft limit on the payload size: past it the launcher still streams the payload, warns and counts it."
value = 8388608
min = 1
unit = "bytes"

[launcher.stdin_hard_bytes]
doc = "Hard limit on the payload size: the launcher stops reading there, closes the engine's input and counts it."
value = 536870912
min = 1
unit = "bytes"

[launcher.mem_soft_bytes]
doc = "Soft limit on the launcher's own heap: past it the launcher warns and counts it (at exit)."
value = 16777216
min = 1
unit = "bytes"

[launcher.mem_hard_bytes]
doc = "Hard limit on the launcher's own heap, enforced by its counting allocator and checked before any buffer grows: past it the launcher stops the engine, says so on stderr and lets the hook through (exit 0)."
value = 67108864
min = 1
unit = "bytes"

[launcher.cpu_soft_ms]
doc = "Soft limit on the launcher's own CPU time: past it the launcher warns and counts it (at exit)."
value = 500
min = 1
unit = "ms"

[launcher.cpu_hard_s]
doc = "Hard limit on the launcher's own CPU time (RLIMIT_CPU, whole seconds): past it the launcher stops the engine and lets the hook through. The engine does not inherit it."
value = 5
min = 1
unit = "s"

[launcher.wall_soft_ms]
doc = "Per hook event, the wall time (ms, from the launcher start) past which a call is logged as a soft wall hit and counted; nothing is cut. `default` applies to an event not listed; 0 means the fail-fast formula (client.cold_guard_wait_ms on a guard event plus the engine budget), which flags every call that uses the slow-reply extension. Set from the measured per-event distribution; the hard limits (client.slow_fallback_max_ms, launcher.wall_hard_margin_ms) are separate and higher."
value = { default = 0, SessionStart = 1100, UserPromptSubmit = 900, SessionEnd = 800, Stop = 3000 }
unit = "ms"

[launcher.wall_hard_margin_ms]
doc = "Margin added to the longest planned path of a call (cold wait, engine budget, kill grace) to get the wall-clock backstop (SIGALRM): at it the launcher stops the engine and lets the hook through. Never beyond the event's hook timeout."
value = 500
min = 1
unit = "ms"

[launcher.crashloop_window_s]
doc = "Window over which the launcher counts the daemon starts it asked for."
value = 60
min = 1
unit = "s"

[launcher.crashloop_max]
doc = "Daemon starts the launcher may ask for inside launcher.crashloop_window_s; past it the launcher stops asking and the hook is let through."
value = 5
min = 1
unit = "count"

[launcher.log_soft_bytes]
doc = "Size at which the launcher's failure log is rotated (one previous file is kept)."
value = 262144
min = 1024
unit = "bytes"

[launcher.log_hard_bytes]
doc = "Size at which the launcher's failure log stops accepting lines: further lines are dropped and the drops counted."
value = 1048576
min = 1024
unit = "bytes"

[launcher.log_line_max]
doc = "Longest line the launcher writes to its failure log; longer lines are cut."
value = 512
min = 64
unit = "bytes"

[launcher.log_rotate_min_s]
doc = "Fewest seconds between two rotations of the launcher's failure log. A flood of lines therefore grows the current file to launcher.log_hard_bytes (then lines are dropped and counted) instead of rotating the older history away."
value = 60
min = 0
unit = "s"

[launcher.spool_max_bytes]
doc = "Most of a payload larger than launcher.payload_prefix_bytes that the launcher copies to a private file in its run directory, so the shell fallback runner can be given the whole payload if the engine defers. Past it the payload is still streamed to the engine but cannot be replayed to the fallback runner."
value = 67108864
min = 0
unit = "bytes"

[launcher.run_done_file]
doc = "Name, inside a per-call run directory, of the file the engine creates when it has dispatched the event."
value = "done"

[launcher.run_wait_file]
doc = "Name, inside a per-call run directory, of the file the engine creates while it waits on a live daemon."
value = "wait"

[launcher.run_fail_open_file]
doc = "Name, inside a per-call run directory, of the file the engine client appends the call's reported fail-opens to (see env.fail_open_file)."
value = "fail_open"

[launcher.run_spool_file]
doc = "Name, inside a per-call run directory, of the private copy of a large payload (see launcher.spool_max_bytes)."
value = "payload"

[launcher.io_drain_ms]
doc = "How long, after the engine has exited, the launcher waits for its output pipes to reach end of file before it treats a helper still holding them as a failure."
value = 100
min = 1
unit = "ms"

[launcher.selftest_engine_timeout_ms]
doc = "How long --selftest lets the engine binary run its version check before it calls the binary broken."
value = 3000
min = 100
unit = "ms"

[launcher.reaper]
doc = "1 = the launcher starts a tiny watcher that kills the engine's process group if the launcher is killed without cleaning up (SIGKILL); 0 = no watcher."
value = 1
max = 1
unit = "flag"

[launcher.stats_env]
doc = "Environment variable through which the launcher hands its counters to the engine (sent inside the request, never written per call)."
value = "AH_LAUNCHER_STATS"

[launcher.knob_engine_bin]
doc = "Test-only: environment variable that replaces the engine binary (honoured only when the test flag is set)."
value = "AH_ENGINE_BIN"

[launcher.knob_fallback_list]
doc = "Test-only: environment variable that replaces the fallback list file."
value = "AH_FALLBACK_LIST"

[launcher.knob_timeout_s]
doc = "Test-only: environment variable that sets the hook budget in whole seconds."
value = "AH_HOOK_TIMEOUT_S"

[launcher.knob_timeout_ms]
doc = "Test-only: environment variable that sets the hook budget in milliseconds."
value = "AH_HOOK_TIMEOUT_MS"

[launcher.knob_kill_grace_s]
doc = "Test-only: environment variable that sets the kill grace in whole seconds."
value = "AH_KILL_GRACE_S"

[launcher.knob_sweep_age_s]
doc = "Test-only: environment variable of the shell wrapper's run-directory sweep age (accepted for parity, unused by the launcher)."
value = "AH_HOOK_SWEEP_AGE_S"

[launcher.knob_fault]
doc = "Test-only: environment variable that injects a fault into the launcher (panic, hang, spin or alloc) so its never-panic and hard-limit paths can be tested end to end."
value = "AH_LAUNCHER_FAULT"

[launcher.test_flag_env]
doc = "Environment variable that must be 1 for the test-only knobs to be honoured."
value = "AH_WRAPPER_TEST"

[launcher.diag_env]
doc = "Test-only: environment variable naming a file the launcher appends its diagnostic lines to (an absolute path)."
value = "AH_ENGINE_WRAPPER_DIAG"

[launcher.in_process_env]
doc = "Environment variable that, set to 1, runs the engine's dispatch in process; the launcher then ignores the daemon-down marker."
value = "AH_ENGINE_DISPATCH_IN_PROCESS"

[launcher.plugin_root_envs]
doc = "Environment variables the host uses to name the plugin root, in the order the launcher tries them."
value = ["CLAUDE_PLUGIN_ROOT", "PLUGIN_ROOT"]

[launcher.hosts]
doc = "The hosts the launcher serves (the --host values); the first is the default."
value = ["claude", "codex"]

[launcher.fallback_list_claude]
doc = "File name, inside the plugin's hooks directory, of the Claude fallback list (per-event timeouts)."
value = "ah-fallback.list"

[launcher.fallback_list_codex]
doc = "File name, inside the plugin's hooks directory, of the Codex fallback list."
value = "ah-fallback.codex.list"

[launcher.script_integrity]
doc = "Integrity script in the plugin's hooks directory (failure counting and rollback)."
value = "ah-engine-integrity.sh"

[launcher.script_bootstrap]
doc = "Bootstrap script in the plugin's hooks directory (installs the engine binary)."
value = "ah-engine-bootstrap.sh"

[files.fallback_switch]
doc = "Marker file (state directory) of the Node fallback switch (the Node backup, stage 2): present = the launcher runs the original Node hooks directly instead of the engine. Written and removed by `ah-engine fallback node|off`; read by hooks/ah-hook.sh and the thin launcher."
value = "fallback.node"

[launcher.script_hook]
doc = "The shell wrapper in the plugin's hooks directory; the launcher hands the call to it while the Node fallback switch is on (files.fallback_switch)."
value = "ah-hook.sh"

[launcher.script_doctor]
doc = "Doctor script in the plugin's hooks directory (the --doctor mode runs it)."
value = "ah-doctor.sh"

[launcher.engine_lock_file]
doc = "File name, in the plugin root, of the engine lock: when present the session start may bootstrap the engine."
value = "ah-engine.lock"

[launcher.engine_bin_rel]
doc = "Path of the installed engine binary below the engine state directory."
value = "bin/ah-engine"

[launcher.engine_bin_name]
doc = "Name of the engine binary looked up on PATH when none is installed."
value = "ah-engine"

[launcher.run_base_dir]
doc = "Directory, below the anti-hall base directory, for the launcher's private per-call run directories."
value = "tmp"

[launcher.tmp_dir_prefix]
doc = "Prefix of the private directory the launcher makes under the temp directory when the home directory is unusable (followed by the user id)."
value = "ah-hook-"

[launcher.run_dir_prefix]
doc = "Prefix of a per-call run directory (followed by the launcher's process id)."
value = "ah-launch."

[files.launcher_log]
doc = "The launcher's bounded failure log, inside the state directory."
value = "launcher.log"

[files.launcher_drops]
doc = "Count of the log lines the launcher dropped at the hard log size, inside the state directory."
value = "launcher.drops"

[files.launcher_spawn_lock]
doc = "Lock file that lets only one launcher at a time ask for a cold daemon start, inside the state directory."
value = "launcher.spawn.lock"

[files.launcher_spawn_log]
doc = "Times (epoch ms, one per line) of the daemon starts the launcher asked for, inside the state directory; the crash-loop window counts them."
value = "launcher.spawns"
