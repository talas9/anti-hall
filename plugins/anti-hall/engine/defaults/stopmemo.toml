# #857 R5/R6: the Stop memo (src/dispatch/stopmemo.rs). A Stop dispatch whose every check answered quiet (allow, no output) is
# remembered per session by a key of the request and the state it read; a repeated Stop with an unchanged key returns that answer
# without running the checks. Any new transcript bytes, a changed task or settings file, a config reload or the ttl miss. A block or an
# advisory is never remembered (a repeated block escalates). Every value lives here.

[stopmemo.enabled]
doc = "1 = a repeated Stop whose key is unchanged and whose last answer was quiet is answered from the memo; 0 = every Stop runs its checks."
value = 1
min = 0
max = 1

[stopmemo.events]
doc = "The events the memo applies to."
value = ["Stop"]

[stopmemo.ttl_ms]
doc = "How long one remembered answer stays valid, in milliseconds (state no stamp covers, such as time passing, cannot outlive this)."
value = 30000
min = 1000
max = 600000

[stopmemo.tail_bytes]
doc = "How many bytes at the end of the transcript are hashed into the key (its length is always part of it)."
value = 65536
min = 1024
max = 4194304

[stopmemo.max_sessions]
doc = "How many sessions the memo keeps (the oldest is dropped past it)."
value = 64
min = 1
max = 4096

[stopmemo.home_env]
doc = "The environment variable that names the home directory the stamp paths start from."
value = "HOME"

[stopmemo.stamp_paths]
doc = "Paths whose state is part of the key ({home}, {session_id}). A directory is stamped by the name, size and modification time of each entry in it, a file by its size and modification time; a missing path stamps as absent. Task lists, anti-hall settings, and the state the Stop checks that can block read outside the transcript: the runtime escalations and the runtime block counts (silent-agent-nudge), the devswarm summaries and parent-gate replies (devswarm-parent-gate)."
value = ["{home}/.claude/tasks/{session_id}", "{home}/.claude/tasks/session-{session_id}", "{home}/.anti-hall/settings.json", "{home}/.claude/settings.json", "{home}/.anti-hall/agent-tracker/runtime-escalations.json", "{home}/.anti-hall/ah-engine/runtime-block-stops.json", "{home}/.anti-hall/devswarm/summaries", "{home}/.anti-hall/devswarm/parent-gate"]

[stopmemo.outcome_hit]
doc = "Metric stopmemo outcome label: a Stop was answered from the memo."
value = "hit"

[stopmemo.outcome_miss]
doc = "Metric stopmemo outcome label: a Stop ran its checks (no memo, or its key changed)."
value = "miss"

[stopmemo.outcome_stored]
doc = "Metric stopmemo outcome label: a quiet Stop answer was remembered."
value = "stored"

[metric.stopmemo]
doc = "Stop memo outcomes (#857 R5/R6, defaults/stopmemo.toml), by event and outcome (hit, miss, stored)."
value = { kind = "counter", unit = "calls", labels = ["event", "outcome"] }
