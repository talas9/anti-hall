# Uncommitted-work guard (GH #270): a subagent's worktree may hold only so many uncommitted lines. Past the soft line the agent is warned
# (at most once per git.soft_warn_every_ms); past the hard line git.max_uncommitted_lines its Edit, Write, MultiEdit and apply_patch calls
# are blocked with "commit first" (commits stay allowed: only edits are matched). The decision logic is engine/logic/uncommitted-guard.js;
# every number, argument, pattern and text is here (D88).

[uncommitted.sw]
doc = "Switch guards.uncommittedWork (default on): off lets a subagent leave any amount of work uncommitted."
value = { section = "guards", key = "uncommittedWork", env = "ANTIHALL_UNCOMMITTED_GUARD", option = "", default = true }

[uncommitted.guard_name]
doc = "The guard id the uncommitted-guard check answers to in skip.json and in its messages."
value = "uncommitted-guard"

[uncommitted.summary]
doc = "One-line description of the uncommitted-guard check in the generated reference."
value = "PreToolUse on Edit, Write, MultiEdit, NotebookEdit and apply_patch, subagents only: warns past git.soft_uncommitted_lines and blocks past git.max_uncommitted_lines uncommitted lines in the subagent's worktree (commit first)."

[git.max_uncommitted_lines]
doc = "Hard line: uncommitted lines (insertions plus deletions against HEAD, plus the lines of untracked files) in a subagent's worktree at which its edits are blocked until it commits. 0 = no hard line."
value = 300

[git.soft_uncommitted_lines]
doc = "Soft line: uncommitted lines at which the subagent is warned to commit. 0 = no soft line."
value = 200

[uncommitted.agent_field]
doc = "Hook payload field that names a subagent; a call without it is the main session and is never judged."
value = "agent_id"

[uncommitted.cache_ttl_ms]
doc = "How long a count under the soft line is trusted per directory. A count at or over a line is always re-read before it blocks, so a commit lifts the block at once."
value = 15000

[uncommitted.soft_warn_every_ms]
doc = "Least time between two soft warnings for one directory."
value = 120000

[uncommitted.state_dir]
doc = "Where the per-directory counts are cached, relative to the user home."
value = ".anti-hall/uncommitted"

[uncommitted.state_ext]
doc = "Extension of a cache file."
value = ".json"

[uncommitted.event]
doc = "The hook event name the soft warning is attached to when the payload names none."
value = "PreToolUse"

[uncommitted.git_timeout_ms]
doc = "Bound of one git call."
value = 4000

[uncommitted.argv_diff]
doc = "Git arguments ({dir} is the directory) that print the summary of the tracked changes against HEAD."
value = ["-C", "{dir}", "diff", "HEAD", "--shortstat"]

[uncommitted.argv_untracked]
doc = "Git arguments ({dir} is the directory) that list the untracked files that are not ignored, one per line."
value = ["-C", "{dir}", "-c", "core.quotepath=off", "ls-files", "--others", "--exclude-standard"]

[uncommitted.insertions_re]
doc = "The insertions count in the summary line. Regular expression (JavaScript and Rust syntax); group 1 is the number."
value = '(\d+) insertions?\(\+\)'

[uncommitted.deletions_re]
doc = "The deletions count in the summary line. Regular expression (JavaScript and Rust syntax); group 1 is the number."
value = '(\d+) deletions?\(-\)'

[uncommitted.max_untracked_files]
doc = "Most untracked files whose lines are counted (the rest count as uncommitted_lines_per_unread_file lines each)."
value = 40

[uncommitted.untracked_read_max]
doc = "Largest untracked file read to count its lines; a larger one counts as uncommitted_lines_per_unread_file lines."
value = 200000

[uncommitted.lines_per_unread_file]
doc = "Lines counted for an untracked file that was not read (too many files, too large, unreadable)."
value = 50

[uncommitted.msg_what]
doc = "Heading of the block. Placeholders: {lines} uncommitted lines now, {max} the hard line."
value = "This edit is blocked: your worktree holds {lines} uncommitted lines (the limit is {max})."

[uncommitted.msg_why]
doc = "Why the guard blocks."
value = "Uncommitted work is lost when an agent stops, is killed or runs out of budget, and a large uncommitted diff cannot be reviewed or resumed; a 2026-10-23 swarm burned about 60% of a weekly limit with little committed."

[uncommitted.msg_instead]
doc = "What to do instead."
value = "Commit what works now (git add and git commit are allowed), then continue editing. Small commits reset the count."

[uncommitted.msg_override]
doc = "How the user can lift the block (shown on the last line)."
value = "the user turns the guard off with `guards.uncommittedWork`, skips it for a session in skip.json as uncommitted-guard, or raises git.max_uncommitted_lines (plugin data)."

[uncommitted.msg_soft]
doc = "Soft warning added to the agent's context. Placeholders: {lines} uncommitted lines now, {soft} the soft line, {max} the hard line."
value = "anti-hall uncommitted-guard: your worktree holds {lines} uncommitted lines (soft line {soft}, edits are blocked at {max}). Commit what works now."
