# ah-engine shipped defaults for caller roles (owner feature 22): which kind of session may use which engine verb, how the role is
# detected, the generated `anti-hall:engine` skill family (a tiny main skill plus one sub-skill per feature area) and the role note
# injected at SessionStart / SubagentStart. Format: see the header of engine.toml.
# A new verb is not complete until `roles.matrix` has a row for it (tests/it/roles.rs); the skills regenerate from the registry
# (`ah-engine docs --format skill --out <plugin root>`).

[roles.names]
doc = "The caller roles, most specific first when two apply (a workspace child that is a Codex session is a workspace child)."
value = ["subagent", "workspace", "codex", "main"]

[roles.describe]
doc = "What each role is, in one line (shown in the role note and the engine skill)."
value = { main = "the main session (Primary / coordinator): owns the repo, the settings and the other agents", workspace = "a DevSwarm workspace child: works on its own task and reports through the mesh", subagent = "a subagent or background task: does one assigned job and reports back", codex = "a Codex top-level session: the main seat on that platform" }

[roles.sw_guard]
doc = "Switch context.roleGuard (default on): off lets every role run every engine verb (the PreToolUse Bash check and the command-line check step aside)."
value = { section = "context", key = "roleGuard", env = "ANTIHALL_ROLE_GUARD", option = "", default = true }

[roles.sw_note]
doc = "Switch context.roleNote (default on): off stops the SessionStart / SubagentStart role note."
value = { section = "context", key = "roleNote", env = "ANTIHALL_ROLE_NOTE", option = "", default = true }

[roles.summary_guard]
doc = "One-line description of the engine-role-guard check in the generated reference."
value = "PreToolUse on Bash: refuses an ah-engine command the caller's role may not run, per the roles.matrix (subagent from the payload, workspace child from the environment)."

[roles.summary_note]
doc = "One-line description of the engine-role-note check in the generated reference."
value = "SessionStart and SubagentStart context: tells the session its role, the engine verbs it may use and where the full guide is (the anti-hall:engine skill)."

[roles.guard_name]
doc = "The guard id the role guard answers to in skip.json and in its messages."
value = "engine-role-guard"

[roles.declared_env]
doc = "Environment variable a wrapper may set to declare the caller's role on the command line (a role name from roles.names). It can only narrow what the environment says is possible, never name a role the detection ruled out: a workspace child stays a workspace child."
value = "ANTIHALL_ROLE"

[roles.branch_env]
doc = "Environment variable that is non-empty in a DevSwarm workspace child (and empty in a Primary)."
value = "DEVSWARM_SOURCE_BRANCH"

[roles.builder_env]
doc = "Environment variable holding the caller's own workspace id: what a workspace child may act on."
value = "DEVSWARM_BUILDER_ID"

[roles.self_flags]
doc = "Command-line flags whose value names a workspace; a workspace child may only name itself there."
value = ["--id", "--workspace", "--builder"]

[roles.engine_bin]
doc = "The engine's executable name, as an agent types it in a Bash command."
value = "ah-engine"

[roles.bash_re]
doc = "Finds an engine invocation in a Bash command (engine syntax), also as the first word of a quoted script or a command substitution; the words after the match are the verb and its arguments, up to the next shell operator. A match inside quoted text counts only where the shell runs that text (roles.script_words)."
value = "(?:^|[\\s;&|(\"'`])(?:\\S*/)?ah-engine(?:[\\s\"'`)]|$)"

[roles.script_words]
doc = "Commands besides the shells of git.shell_verbs whose quoted argument is itself a script, so an engine call quoted there still counts for the role guard; any other quoted engine name (a commit message, an echo) is text."
value = ["eval"]

[roles.refuse_exit]
doc = "Exit status of the command line when the caller's role may not run the verb."
value = 77

[roles.matrix]
doc = "Per engine verb: its feature area (`group`, a key of roles.groups), the roles that may run it (`roles`), the roles limited to acting on themselves (`self_only`: a --id or --workspace naming another workspace is refused) and the arguments that make a run owner-level (`owner_args`: with one of them only the roles in `owner_roles` may run it). Every implemented command has a row; a test fails otherwise. Owner-level work (settings changes, restore, stop, go-live and rollback, reaper kill, update, DevSwarm archive, delete, recover and merge) is main (and the Codex main seat) only."
value = { version = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, status = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, metrics = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, impact = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, telemetry = { group = "resources", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["rollup"] }, maintain = { group = "resources", roles = ["codex", "main"] }, backup = { group = "resources", roles = ["codex", "main"] }, restore = { group = "resources", roles = ["codex", "main"] }, ctl = { group = "resources", roles = ["codex", "main"] }, serve = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, stop = { group = "resources", roles = ["codex", "main"] }, reset = { group = "resources", roles = ["codex", "main"] }, schedule = { group = "resources", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["run"] }, check = { group = "guards", roles = ["subagent", "workspace", "codex", "main"] }, hook = { group = "guards", roles = ["subagent", "workspace", "codex", "main"] }, gen-hooks = { group = "guards", roles = ["subagent", "workspace", "codex", "main"] }, mesh = { group = "mesh", roles = ["subagent", "workspace", "codex", "main"], self_only = ["workspace"] }, proj = { group = "mesh", roles = ["workspace", "codex", "main"], self_only = ["workspace"] }, doctor = { group = "doctor", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["--repair", "--fix"] }, migrate = { group = "doctor", roles = ["codex", "main"] }, capability-scan = { group = "doctor", roles = ["subagent", "workspace", "codex", "main"] }, harvest = { group = "doctor", roles = ["subagent", "workspace", "codex", "main"] }, briefing = { group = "doctor", roles = ["subagent", "workspace", "codex", "main"] }, config = { group = "settings", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["heal"] }, docs = { group = "settings", roles = ["subagent", "workspace", "codex", "main"] }, jev = { group = "settings", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["ask", "evidence"] }, jev-setup = { group = "settings", roles = ["codex", "main"] }, jev_sweep = { group = "settings", roles = ["codex", "main"] }, jev-report = { group = "settings", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["label", "prune-audit"] }, auto-handover-config = { group = "settings", roles = ["codex", "main"] }, dispatch-report = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, finding-dedup = { group = "settings", roles = ["subagent", "workspace", "codex", "main"] }, coordinator-work-baseline = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, agents = { group = "agents", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["tick"] }, settings = { group = "settings", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["set", "reset", "judge", "trust-command-allow", "trust-edit-allow"] }, defect = { group = "doctor", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["rule", "archive"] }, statusline = { group = "settings", roles = ["subagent", "workspace", "codex", "main"] }, phase = { group = "settings", roles = ["codex", "main"] }, install-statusline = { group = "settings", roles = ["codex", "main"] }, uninstall-statusline = { group = "settings", roles = ["codex", "main"] }, shadow-compare = { group = "doctor", roles = ["subagent", "workspace", "codex", "main"] }, update = { group = "doctor", roles = ["codex", "main"] }, install-codex = { group = "doctor", roles = ["codex", "main"] }, handovers = { group = "handovers", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["--registered", "--force"] }, gh = { group = "github", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["poll"] }, gh_poll = { group = "github", roles = ["codex", "main"] }, agent_tick = { group = "agents", roles = ["codex", "main"] }, devswarm = { group = "devswarm", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["archive", "plan-prune", "prune", "recover", "create", "merge", "skip", "archive-ignore", "archive-unignore", "gate-intent", "notice"] }, refresh = { group = "doctor", roles = ["codex", "main"] }, units = { group = "resources", roles = ["subagent", "workspace", "codex", "main"], owner_args = ["install", "heal", "uninstall"] }, mcp-reaper = { group = "resources", roles = ["codex", "main"] }, codex-limit-status = { group = "resources", roles = ["subagent", "workspace", "codex", "main"] }, codex-activate = { group = "resources", roles = ["codex", "main"] } }

[roles.owner_roles]
doc = "The roles allowed to run a verb with one of its owner_args."
value = ["codex", "main"]

[roles.groups]
doc = "The feature areas, in skill order. `skill` is the sub-skill name (the main skill is `engine`), `title` its heading, `brief` the one line the main skill shows, `use_when` the sentence that makes the host load the sub-skill (a skill's description is what triggers loading), `prefixes` the engine checks (guards) it covers by name prefix and `settings_prefixes` the switches it lists by `section.key` prefix (first area that matches wins; the rest go to `guards`)."
value = { guards = { skill = "engine-guards", title = "Guards", brief = "What the automatic guards check and how to read a block.", use_when = "an anti-hall guard blocked, warned or injected something, or you need to know which guard covers a rule", prefixes = [], settings_prefixes = ["guards.api", "guards.shellWrite", "safety.commandGuard", "safety.editGuard", "guards.allowAnthropic"] }, mesh = { skill = "engine-mesh", title = "Mesh", brief = "Read the DevSwarm message store and per-project mailboxes.", use_when = "you need to read workspace messages, unread counts or the per-project mailbox through the engine", prefixes = [], settings_prefixes = [] }, devswarm_sup = { skill = "engine-devswarm-supervisor", title = "DevSwarm supervisor", brief = "The DevSwarm supervisor sweep: auto-archive, pokes, app sync, retention, reconcile and housekeeping.", use_when = "tuning or checking the DevSwarm supervisor sweep (auto-archive, pokes and escalation, app sync, retention, reconcile, housekeeping)", prefixes = [], settings_prefixes = ["devswarm.autoArchive", "devswarm.nudge", "devswarm.appSync", "devswarm.childGateRetention", "devswarm.housekeeping", "devswarm.reconcile", "devswarm.sweepTail", "devswarm.retention", "devswarm.supervisor", "devswarm.activeFloor", "devswarm.idleSec", "devswarm.maxRecoveries", "devswarm.reapedRetention", "devswarm.postSpawnGraceSec"] }, devswarm = { skill = "engine-devswarm", title = "DevSwarm", brief = "The DevSwarm role, gate and wake guards.", use_when = "working in or with DevSwarm workspaces and a DevSwarm gate, role directive or wake guard applies", prefixes = ["devswarm-"], settings_prefixes = ["devswarm."] }, github = { skill = "engine-github", title = "Git and GitHub", brief = "Git, merge and release guards.", use_when = "committing, pushing, merging or releasing and a git or merge guard applies", prefixes = ["git", "merge-", "gh-"], settings_prefixes = ["safety.gitGuard", "guards.git", "guards.merge", "guards.shipit"] }, resources = { skill = "engine-resources", title = "Resources and state", brief = "Daemon status, metrics, backups, schedules and limits.", use_when = "you need the engine daemon status, metrics, impact, telemetry, a backup or restore, a scheduled job, or context and usage limits", prefixes = ["limit-", "scan-", "ctxbudget", "session-end-mcp", "emit-"], settings_prefixes = ["limitConserve.", "context.injectGate", "maintenance.sessionEnd", "maintenance.mcpReaper", "guards.reaper", "guards.scanThrottle", "guards.emitDedupe", "context.dedupeWindow", "guards.injectionRepeat"] }, processes = { skill = "engine-processes", title = "Process, resource and disk watch", brief = "Leftover processes, runaway CPU or memory and low disk space.", use_when = "a warning names an orphaned process, a stuck agent, heavy CPU or memory use or low disk space, or you need to tune or switch off the process, resource or disk watch", prefixes = ["procwatch"], settings_prefixes = ["procwatch.", "resourceWatch.", "diskWatch."] }, handovers = { skill = "engine-handovers", title = "Handovers and compaction", brief = "Handover, resume and compaction guards.", use_when = "writing or resuming a handover, or compacting context, and a handover or compaction guard applies", prefixes = ["auto-handover", "handover-", "precompact-", "compact-", "progress-"], settings_prefixes = ["autoHandover.", "maintenance.precompact", "context.handover", "guards.handoverCommit", "guards.compactAdvice", "guards.compactDeclaration", "maintenance.progress"] }, agents = { skill = "engine-agents", title = "Agents and tasks", brief = "Subagent, task-list, delegation and routing guards.", use_when = "spawning, messaging or stopping agents, keeping the task list, or delegating work and a delegation, task or model-routing guard applies", prefixes = ["idle-agent", "silent-agent", "stale-agent", "orch-", "task-", "tasklist-", "model-routing", "coordinator-", "swarm-", "dispatch-", "phase-", "ask-", "verify-first-orch", "edit-guard", "agent-reminders", "sibling-"], settings_prefixes = ["agents.", "guards.coordinatorWork", "guards.idle", "guards.silentAgent", "guards.staleAgent", "guards.question", "guards.noBlocking", "guards.task", "guards.tasklist", "guards.dispatch", "guards.maxParallel", "guards.stopNag", "guards.progressFresh", "guards.sharedTree", "guards.siblingSweep", "safety.swarmGuard", "context.taskTracker", "context.verifyFirstOrch", "context.verifyFirstSub", "context.orchFull", "context.codexOrchFull", "maintenance.taskLifecycle"] }, doctor = { skill = "engine-doctor", title = "Doctor and repair", brief = "Health check, repair, migrations and capability scans.", use_when = "checking whether anti-hall works, repairing it, migrating its state, or scanning what it can do on this machine", prefixes = ["version-", "claude-cli-", "repo-self-", "defect-", "repair-", "fable-", "codex-", "engine-role", "failure-"], settings_prefixes = ["versionAlerts.", "guards.repoSelfDrift", "maintenance.repairOnReload", "maintenance.unitsHeal", "context.defectNudge", "guards.updateInSession", "guards.stopHookVersion", "codexNudge.", "guards.codexQuota"] }, settings = { skill = "engine-settings", title = "Settings and Jev", brief = "Settings switches, the generated reference and the Jev classifier.", use_when = "changing or reading an anti-hall setting or switch, looking up an engine reference, or configuring the Jev classifier", prefixes = ["speculation-", "claim-", "output-", "jev-"], settings_prefixes = ["jev", "context.protocolLevel", "context.verifyFirstTurn", "context.verifyFirstSession", "context.role", "guards.speculation", "guards.inference", "guards.claim", "guards.outputVerify", "guards.failure", "guards.stopAck"] } }

[roles.skill_budget]
doc = "Size limits of the generated skills, in bytes of SKILL.md: the main skill must stay tiny, a sub-skill bounded. A test fails when a generated skill is over its limit; shrink the area (split it into two) rather than raise the number."
value = { main = 2800, sub = 9000 }

[roles.line_max]
doc = "Longest one-line description of a verb or guard in a skill, in characters (longer ones are cut at a word with an ellipsis; the generated reference has the full text)."
value = 140

[roles.note_max]
doc = "Longest role note, in characters; the verb list is shortened to fit."
value = 900

[roles.main_skill]
doc = "The main skill: its name, its description (when to load it) and its intro line."
value = { name = "engine", description = "Use when you need to know what the anti-hall engine can do, which engine verbs your session may run, or which engine skill covers a feature area. Start here, then open the area's skill.", intro = "The anti-hall engine (`ah-engine`) runs the guards and the state behind anti-hall. Verbs are role-gated: ask which role you are first." }

[roles.skill_host]
doc = "Per host: where the generated skill files go under the plugin root, the skill folder name prefix, the command that names a skill in prose and the front matter name prefix. Codex skills are folders named anti-hall-<skill>."
value = { claude = { dir = "skills", prefix = "", ref = "/anti-hall:{skill}", name_prefix = "" }, codex = { dir = "codex/skills", prefix = "anti-hall-", ref = "$anti-hall-{skill}", name_prefix = "anti-hall-" } }

[roles.cli_cmd]
doc = "How a verb is typed, for the skills."
value = "ah-engine {verb}"

[roles.msg_refuse]
doc = "Refusal when the caller's role may not run a verb. Placeholders: {verb}, {role}, {allowed}, {why}."
value = "anti-hall engine: `{verb}` is not available to {role} sessions. Who may run it: {allowed}. {why}"

[roles.msg_why_owner]
doc = "The reason in msg_refuse when the verb or argument is owner-level."
value = "It changes or removes state, so it is reserved for the main session; ask it to run this."

[roles.msg_why_other]
doc = "The reason in msg_refuse when the role is simply not on the verb's list."
value = "This role is not on the verb's list in roles.matrix."

[roles.msg_refuse_self]
doc = "Refusal when a workspace child names another workspace. Placeholders: {verb}, {target}, {self}."
value = "anti-hall engine: `{verb}` from a workspace child may only act on itself ({self}); it named {target}. Ask the main session to act on another workspace."

[roles.msg_note]
doc = "The role note injected at SessionStart / SubagentStart. Placeholders: {role}, {what}, {verbs}, {more}, {skill}."
value = "anti-hall engine: you are {what} (role: {role}). Engine verbs you may run: {verbs}.{more} Full guide: {skill}"

[roles.msg_note_more]
doc = "Added to the note when the verb list was shortened. Placeholder: {n}."
value = " (+{n} more, see the guide)"

[roles.msg_none]
doc = "The verb list in the note when the role may run none."
value = "none"

[roles.skill_frontmatter]
doc = "Front matter of a generated skill. Placeholders: {name}, {description}."
value = "---\nname: {name}\ndescription: \"{description}\"\n---\n\n"

[roles.skill_labels]
doc = "Labels the generated skills use. `roles_head` heads the role table, `verbs_head` the verb table, `guards_head` the guard list, `settings_head` the switches, `none` marks an empty cell, `yes` an allowed role, `self` a self-only role."
value = { roles_head = "Roles", verbs_head = "Verbs", guards_head = "Guards", settings_head = "Switches", areas_head = "Feature areas", none = "-", table_head = "| Verb | What it does | Roles |\n|---|---|---|", yes = "yes", self_only = "self only", owner = "owner args", generated = "Generated from the engine registry by `ah-engine docs --format skill`; do not edit by hand.", roles_note = "Your role is in the note injected at session start. A role marked `*` in a Roles cell may only name its own workspace; owner args need the main session (or the Codex main seat).", more = "Details: the area skills above; the full reference is `ah-engine docs`." }
