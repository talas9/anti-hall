  { name = "reapedLogs", dir = "reaped", suffix = ".ndjson", days = "devswarm_sup.set_reaped_days" },
  { name = "childGate", dir = "child-gate", suffix = ".json", days = "devswarm_sup.set_child_gate_days" },
]

[devswarm_sup.set_reaped_days]
