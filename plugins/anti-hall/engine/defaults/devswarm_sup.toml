[devswarm_sup.env_disable]
doc = "The environment variable that is the hard kill switch of every DevSwarm job (Node: DISABLE_ANTIHALL_DEVSWARM)."
value = "DISABLE_ANTIHALL_DEVSWARM"

[devswarm_sup.env_disable_on]
doc = "The value of the kill switch that disables."
value = "1"

[devswarm_sup.env_supervisor]
doc = "The environment variable that switches the supervisor off (Node: ANTIHALL_DEVSWARM_SUPERVISOR)."
value = "ANTIHALL_DEVSWARM_SUPERVISOR"

[devswarm_sup.env_supervisor_off]
doc = "The value of the supervisor switch that disables."
value = "off"

# ---- housekeeping (native) ---------------------------------------------------------------------------------------------------

[devswarm_sup.hk_sweeps]
doc = "The age sweeps of the housekeeping duty, in order: name (the key in the result), dir (under the DevSwarm state directory), suffix (only files ending so are touched) and days (the setting holding the retention window in days)."
