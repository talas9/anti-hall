# ah-engine shipped defaults for the DevSwarm supervisor duties (lane l7, `src/dssup`): everything the Node liveness supervisor
# (companion/devswarm-supervisor.js, run by launchd / systemd / cron every 60-120 s) does besides auto-archive, so the engine's
# scheduler can take them over and the Node job can be switched off as a whole. Format: see the header of engine.toml. Every key
# can be overridden in the `devswarm_sup` section of settings.json. Nothing here is compiled into the binary.
#
# THE SWITCH: `devswarm_sup.mode`. `engine` (the default) makes the engine's scheduler job `devswarm_supervisor` run the duties
# below; `off` runs none of them (a diagnostic: the tick is counted as `disabled`). In engine mode the engine also takes
# poke and escalate (their executors default to `auto`, which follows this mode) and refuses to act while the Node supervisor is
# still running (the double-run guard). The go-live steps are in docs/AH-ENGINE.md, "DevSwarm supervisor cutover".

[devswarm_sup.mode]
doc = "Whether the engine runs the supervisor duties: engine (the default: the engine's scheduler runs them, poke and escalate follow; while a Node supervisor job is still installed and running the engine stands down, so there is never a second actor) | off (the diagnostic switch: the engine runs none of them; each tick is counted as disabled). Anything else reads as off, so a typo never starts a second actor. The engine never edits any settings file or any launchd / systemd unit."
value = "engine"

[devswarm_sup.reconcile_mode]
doc = "Whether the reconcile sweep duty runs while devswarm_sup.mode is `engine`: engine (the default: the engine reconciles each project natively and folds its duplicate mesh rows; the active-workspace probe and start-up sampling of Node's sweep are held) | off (the duty is disabled: counted, nothing run). Anything else reads as off."
value = "engine"

[devswarm_sup.reconcile_mode_words]
doc = "The words of devswarm_sup.reconcile_mode, in the order off, engine."
value = ["off", "engine"]

[devswarm_sup.mode_words]
doc = "The words of devswarm_sup.mode, in the order off, engine."
value = ["off", "engine"]

[devswarm_sup.tick_ms]
doc = "How often the scheduler job `devswarm_supervisor` runs while the mode is `engine` (Node's installer sweeps every 60-120 s). The job does nothing where DevSwarm is absent or the mode is witness."
value = 60000
min = 10000
max = 3600000
unit = "ms"

[devswarm_sup.tick_budget_ms]
doc = "Most time one tick spends starting duties; a duty not yet started when it is spent waits for the next tick. Each duty is also bounded by its own timeout_ms."
value = 900000
min = 1000
max = 3600000
unit = "ms"

# ---- the double-run guard --------------------------------------------------------------------------------------------------

[devswarm_sup.guard_ms]
doc = "The Node supervisor counts as running when its log (or the rotated copy) was written within this long. While it runs, the engine's supervisor duties AND the engine's poke / escalate stand down, so two actors never run one duty. Node writes one line per sweep and sweeps at least every 120 s."
value = 360000
min = 60000
max = 86400000
unit = "ms"

[devswarm_sup.node_log]
doc = "The Node supervisor's log, relative to the home directory (the launchd / systemd / cron job writes its sweep line there)."
value = ".anti-hall/devswarm-supervisor.log"

[devswarm_sup.log_backup_suffix]
doc = "The suffix of the one rotated generation of a log."
value = ".1"

[devswarm_sup.reason_no_log]
doc = "The rotation answer when the log does not exist yet (Node's words, so the two reports read alike)."
value = "no log file yet"

[devswarm_sup.reason_under]
doc = "The rotation answer when the log is not over the threshold."
value = "under threshold"

[devswarm_sup.reason_rotated]
doc = "The rotation answer after a rotation. {backup} is the rotated file."
value = "rotated to {backup}"

[devswarm_sup.reason_rotate_failed]
doc = "The rotation answer when the rename failed. {err}."
value = "rotation failed: {err}"

[devswarm_sup.engine_log]
doc = "The engine's own record of its ticks (one JSON line each), relative to the home directory. Kept apart from the Node log so the engine never trips its own guard."
value = ".anti-hall/logs/devswarm-supervisor-engine.ndjson"

[devswarm_sup.lock_file]
doc = "The single-flight sweep lock, relative to the DevSwarm state directory: the Node supervisor's own file, taken the same way (a dead holder or one older than lock_stale_ms is taken over), so while a tick runs a Node sweep exits at once."
value = "locks/sweep.lock"

[devswarm_sup.lock_stale_ms]
doc = "A sweep lock older than this is taken over (Node: SWEEP_LOCK_STALE_MS)."
value = 300000
min = 1000
max = 86400000
unit = "ms"

# ---- settings Node reads for these duties (same keys, tiers and defaults) --------------------------------------------------

[devswarm_sup.set_log_rotate_bytes]
doc = "Size above which the supervisor log is rotated to its .1 copy. Node: devswarm.supervisorLogRotateBytes."
value = { type = "number", section = "devswarm", key = "supervisorLogRotateBytes", env = "ANTIHALL_DEVSWARM_SUPERVISOR_LOG_ROTATE_BYTES", min = 1, max = 1099511627776, default = 10485760 }

[devswarm_sup.set_reconcile_mode]
doc = "Reconcile sweep switch: auto / on / off. Node: devswarm.reconcileSweep."
value = { type = "enum", section = "devswarm", key = "reconcileSweep", env = "ANTIHALL_DEVSWARM_RECONCILE_SWEEP", values = ["auto", "on", "off"], default = "auto" }

[devswarm_sup.set_reconcile_sec]
doc = "Least time between two reconcile sweeps. Node: devswarm.reconcileSweepSec (floor 300)."
value = { type = "number", section = "devswarm", key = "reconcileSweepSec", env = "ANTIHALL_DEVSWARM_RECONCILE_SWEEP_SEC", min = 300, max = 100000000, default = 900 }

[devswarm_sup.sweep_tail_mode]
doc = "Whether the engine decides the sweep tail (archived registry rows, twin descriptors, the deferred post-update stages and the reconcile-family update stages): engine (the default) | off (those steps are disabled: counted, nothing run)."
value = { type = "enum", section = "devswarm", key = "sweepTailMode", env = "ANTIHALL_DEVSWARM_SWEEP_TAIL_MODE", values = ["off", "engine"], default = "engine" }

[devswarm_sup.set_housekeeping_mode]
doc = "Housekeeping sweep switch: auto / on / off. Node: devswarm.housekeepingSweep."
value = { type = "enum", section = "devswarm", key = "housekeepingSweep", env = "ANTIHALL_DEVSWARM_HOUSEKEEPING_SWEEP", values = ["auto", "on", "off"], default = "auto" }

[devswarm_sup.set_housekeeping_sec]
doc = "Least time between two housekeeping sweeps. Node: devswarm.housekeepingSweepSec (floor 300)."
value = { type = "number", section = "devswarm", key = "housekeepingSweepSec", env = "ANTIHALL_DEVSWARM_HOUSEKEEPING_SWEEP_SEC", min = 300, max = 100000000, default = 3600 }

[devswarm_sup.set_sweep_budget_ms]
doc = "Time budget for one deferred stage of the sweep tail (one stage per tick). Node: devswarm.supervisorSweepBudgetMs."
value = { type = "number", section = "devswarm", key = "supervisorSweepBudgetMs", env = "ANTIHALL_SUPERVISOR_SWEEP_BUDGET_MS", min = 0, max = 86400000, default = 20000 }

[devswarm_sup.set_max_recoveries]
doc = "Most kill-and-resume recoveries of one workspace. Node: devswarm.maxRecoveries."
value = { type = "number", section = "devswarm", key = "maxRecoveries", env = "ANTIHALL_DEVSWARM_MAX_RECOVERIES", min = 1, max = 20, default = 3 }

# ---- input gates ---------------------------------------------------------------------------------------------------------------
# A gated duty is not run while the stat data of its inputs is unchanged since its last run, for at most gate_max_unchanged_ms.
# The gate only delays a duty by that bound; a tick that runs recomputes from fresh inputs.

[devswarm_sup.gate_duties]
doc = "The duties the input gate applies to (each needs entries in gate_inputs and gate_max_unchanged_ms). An empty list runs every duty on every tick."
value = ["verdicts", "app_sync", "retention"]

[devswarm_sup.gate_max_unchanged_ms]
doc = "Per gated duty, the longest it goes unrun while its inputs are unchanged (0 = never skipped). Past it the duty runs again whatever the stat data says; it bounds what an input the gate cannot see (a transcript being written, a process, the clock) can delay."
value = { verdicts = 120000, app_sync = 300000, retention = 600000 }

[devswarm_sup.gate_inputs]
doc = "Per gated duty, what its signature covers: appdb (the app database and its -wal), ds-dir:<dir> / ds-tree:<dir> (a directory under the DevSwarm state directory, tree = one level of subdirectories too), home-dir:<dir> / home-tree:<dir> / home-file:<file> (under the home directory). Outputs of the duties are not listed. A duty is only armed by a quiet run: the liveness sweep with a stale workspace, a forced notice or a parked notice keeps running every tick (nudge windows and retries are not file changes). verdicts leaves the heartbeats out on purpose (every working child rewrites its beat every few seconds, so the gate would never skip); a beat is picked up within gate_max_unchanged_ms."
value = { verdicts = ["ds-dir:workspaces", "ds-dir:plans", "ds-dir:escalation-pending", "ds-tree:store", "home-dir:.claude/sessions", "home-file:.anti-hall/state/jev-triage-pending.json", "home-file:.anti-hall/settings.json"], app_sync = ["appdb", "ds-dir:workspaces", "home-file:.anti-hall/settings.json"], retention = ["ds-tree:store", "home-file:.anti-hall/settings.json"] }

[devswarm_sup.gate_subdir_depth]
doc = "The gate_inputs kinds that also list one level of subdirectories."
value = ["ds-tree", "home-tree"]

[devswarm_sup.gate_env_prefix]
doc = "Environment variables whose names start with this are part of a gated duty's signature (the supervisor's switches and thresholds are read from them), so a changed switch runs the duty at once. The settings in force (a config reload) and who pokes are always part of it."
value = "ANTIHALL_"

[devswarm_sup.gate_ignore_suffixes]
doc = "File-name suffixes the gate ignores in a listing: a SQLite -shm index changes whenever any process opens the database, even a reader, and holds no data."
value = ["-shm"]

[devswarm_sup.msg_gate_unchanged]
doc = "The reason recorded for a gated duty that was not run. {age} seconds since its last run, {max} the bound."
value = "inputs unchanged for {age} s (bound {max} s)"

# ---- the duties ------------------------------------------------------------------------------------------------------------
# One table per duty, run in this order by the tick. Every duty is native (`kind`): the engine owns the schedule, the cool-down gate,
# the lock and the record, and writes the files Node wrote (byte for byte). gate `tick` runs on every tick, gate `cooldown` only when
# its state file's lastRunAt plus the `sec` setting has passed and the `mode` setting is not off.

[devswarm_sup.duties]
doc = "The duties of one tick, in order (the order of Node's main(): log rotation, the liveness sweep, reconcile, deferred stage, app sync, retention, housekeeping; auto-archive is the engine's own action layer and poke / escalate its action sweeps)."
value = ["log_rotate", "verdicts", "reconcile", "deferred", "app_sync", "retention", "housekeeping"]

[devswarm_sup."duty.log_rotate"]
doc = "Rotate the supervisor log (and the engine's own tick log) to one .1 generation when it passes set_log_rotate_bytes. Native. Only the supervisor's own bounded log is touched."
value = { kind = "native", gate = "tick" }

[devswarm_sup."duty.verdicts"]
doc = "The liveness sweep: compute and write every workspace's liveness verdict file natively, send the forced parent notice and re-send parked escalation notices when the engine owns poke and escalate. The per-workspace tail work (Jev blocker label, straying signals) and a workspace the engine cannot prove it decides like Node are held (counted native_unable, named in the record)."
value = { kind = "native", gate = "tick" }

[devswarm_sup."duty.reconcile"]
doc = "The reconcile sweep: drain stranded per-worktree queues into the shared store (reconcile) and fold duplicate mesh rows, project by project, natively. The active-workspace probe and start-up sampling of Node's sweep have no native port and are held. Node's state file reconcile-sweep-state.json keeps the cool-down."
value = { kind = "native", gate = "cooldown", state = "reconcile-sweep-state.json", sec = "devswarm_sup.set_reconcile_sec", mode = "devswarm_sup.set_reconcile_mode" }

[devswarm_sup."duty.deferred"]
doc = "One stage of the deferred post-update sweep per tick (fold-all-stores, heal-orphan-partitions, fold-archived-rows, heal-registry-rows, in rotation), only when its marker says work is pending. The rotation cursor (deferred-sweep-state.json), the marker peek and the stage itself (the engine's recon ports) are native; a stage the engine does not take is held and comes round again."
value = { kind = "native", gate = "tick" }

[devswarm_sup."duty.app_sync"]
doc = "Sync the DevSwarm app state (archived markers, titles, message gaps) into app-state.json and the names cache. Native: one read of the app database per tick, no process on a quiet tick; a marker is written from the engine's own plan. Retiring a stale marker (restoring a descriptor) has no native port and is held."
value = { kind = "native", gate = "tick" }

[devswarm_sup."duty.retention"]
doc = "Bounded growth of the message stores: archive-first tombstoning of old, fully read message bodies (never a row delete; positions and dedupe depend on every row staying). The engine plans twice and writes only when the plans are identical. The journal fold and the archive-cap eviction remove data for good and are owner-gated (rt_fold_alone, rt_cap_alone, both off by default: held)."
value = { kind = "native", gate = "tick" }

[devswarm_sup."duty.housekeeping"]
doc = "Disk hygiene: sweep the reaped-workspace logs and the child-gate files by the doctor's repair rules. Node's housekeeping-sweep-state.json keeps the cool-down. Native: removes only files older than the retention window, one directory level, only the sweep's own suffix."
value = { kind = "native", gate = "cooldown", state = "housekeeping-sweep-state.json", sec = "devswarm_sup.set_housekeeping_sec", mode = "devswarm_sup.set_housekeeping_mode" }

[devswarm_sup.duties_off]
doc = "The diagnostic switch of each duty: a duty named here (log_rotate, verdicts, reconcile, deferred, app_sync, retention, housekeeping, or recover for the on-demand recovery) does nothing, and says so: its record is `disabled` (a recover request is `refused`), logged and counted. Empty (the default): every duty runs natively."
value = []

[devswarm_sup.msg_duty_off]
doc = "The reason in the record of a duty that is switched off (devswarm_sup.duties_off or its mode setting)."
value = "switched off (devswarm_sup.duties_off or the duty's mode)"

[devswarm_sup.msg_duty_unknown]
doc = "The reason in the record of a duty name the engine has no native implementation of."
value = "no native implementation of this duty"

[devswarm_sup.tick_name]
doc = "The accounting name of the whole supervisor tick when it is switched off (devswarm_sup.mode off)."
value = "supervisor_tick"

[devswarm_sup.ds_why_cursor]
doc = "Why the deferred duty holds its tick: the rotation cursor is a value JavaScript would index differently."
value = "the rotation cursor cannot be read exactly like JavaScript"

[devswarm_sup.ds_why_stage]
doc = "Why the deferred duty holds a stage the engine does not take now (an unusable marker or an unknown stage). Placeholder: {stage}."
value = "stage {stage} not taken: marker unusable or stage unknown; it comes round again"

[devswarm_sup.lv_why_full]
doc = "Why the verdicts duty holds a workspace the engine cannot prove it decides like Node (a field of an unexpected type, a store it will not read exactly like Node)."
value = "workspace not decided natively (unexpected data); no verdict written this tick"

[devswarm_sup.rt_held_backoff_ms]
doc = "A store whose plan moved under the retention comparison (unstable) is not tried again before this long has passed."
value = 21600000
min = 1000
max = 31536000000
unit = "ms"

[devswarm_sup.set_rt_fold_alone]
doc = "Owner-gated (OFF by default). Fold a store's legacy journal (compress it, then REMOVE the raw journal file) on the engine's own plan. Off: the fold is held (counted `held`, nothing removed, named in the record). Node's merge check that used to agree to it is gone."
value = { type = "bool", section = "devswarm_sup", key = "retention.foldAlone", env = "ANTIHALL_DEVSWARM_SUP_RETENTION_FOLD_ALONE", default = false }

[devswarm_sup.set_rt_cap_alone]
doc = "Owner-gated (OFF by default). Evict archive month files over the archive size cap (archived message bodies are REMOVED for good) on the engine's own list. Off: the eviction is held (counted `held`, nothing removed, named in the record)."
value = { type = "bool", section = "devswarm_sup", key = "retention.capAlone", env = "ANTIHALL_DEVSWARM_SUP_RETENTION_CAP_ALONE", default = false }

[devswarm_sup.rt_step_fold]
doc = "The accounting name of the owner-gated journal fold."
value = "retention_fold"

[devswarm_sup.rt_step_cap]
doc = "The accounting name of the owner-gated archive-cap eviction."
value = "retention_cap"

[devswarm_sup.rt_fold_not_sqlite]
doc = "Why a journal is not folded: the store's chosen backend is not sqlite, or its database is empty (foldLegacyJournal reason)."
value = "not-sqlite-store"

[devswarm_sup.rt_fold_merge_not_recorded]
doc = "Why a journal is not folded: no merge marker records that the journal was merged into sqlite (foldLegacyJournal reason)."
value = "merge-not-recorded"

[devswarm_sup.rt_fold_merge_check_failed]
doc = "Why a journal is not folded: the dry run of the merge could not be made (foldLegacyJournal reason)."
value = "merge-check-failed"

[devswarm_sup.rt_fold_merge_pending]
doc = "Why a journal is not folded: the journal side holds messages or registry rows sqlite lacks, so removing it would lose them (foldLegacyJournal reason)."
value = "merge-pending"

[devswarm_sup.rt_why_fold_off]
doc = "Why the journal fold is held: removing the raw journal needs devswarm_sup.rt_fold_alone, which is off."
value = "held: the journal fold removes raw files and is owner-gated (devswarm_sup.rt_fold_alone is off)"

[devswarm_sup.rt_why_cap_off]
doc = "Why the archive-cap eviction is held: removing archived bodies needs devswarm_sup.rt_cap_alone, which is off."
value = "held: the archive-cap eviction removes archived bodies and is owner-gated (devswarm_sup.rt_cap_alone is off)"

[devswarm_sup.msg_recover_native_refused]
doc = "Printed when a recovery request passed every check and is refused all the same: the engine never kills or resumes a session (owner decision F)."
value = "recover is refused: the engine does not kill or resume a session, and there is no rollback of a kill; use the on-demand Node recovery (devswarm-recover) for a confirmed wedge"

# ---- the native result log ----------------------------------------------------------------------------------------------------
# The non-acting Node witness is gone; the native results of the duties that act on user data are logged to witness_file instead.

[devswarm_sup.witness_file]
doc = "The log of the native duties' results (retention plans and holds, app-sync marks), one JSON line each (`native`: true), relative to the home directory."
value = ".anti-hall/logs/devswarm-sup-witness.ndjson"

[devswarm_sup.action_log]
doc = "The action ledger of the supervisor, one JSON line per action it took (kind = action_kind: feature, action, target, inputs, outcome, reason, latency_ms, action_id) and per mistake signal found later (kind = mistake_kind, naming the action_id), relative to the home directory. Each line also goes to telemetry as a `cmd` event (h = the action, e = the outcome), counted in `ah-engine telemetry summary` under detail.cmd."
value = ".anti-hall/logs/devswarm-sup-actions.ndjson"

[devswarm_sup.action_kind]
doc = "The kind of an action line of the action ledger."
value = "action"

[devswarm_sup.mistake_kind]
doc = "The kind of a mistake line of the action ledger."
value = "mistake"

[devswarm_sup.action_feature]
doc = "The feature name of the supervisor's action lines."
value = "devswarm-supervisor"

[devswarm_sup.action_success]
doc = "The outcomes that count as success in telemetry; any other counts as an error (a notice that had to be parked, a write that failed)."
value = ["ok", "ran", "marked", "retired", "pruned"]

[devswarm_sup.act_skip_outcomes]
doc = "The outcome words that count as a skip (not applicable, nothing done) in an act telemetry event of the supervisor; a word in action_success is an allow, one in act_block_outcomes a block, any other an error."
value = ["skipped"]

[devswarm_sup.act_block_outcomes]
doc = "The outcome words that count as a refusal (block) in an act telemetry event of the supervisor (a recover request the engine refused)."
value = ["refused"]

[devswarm_sup.act_duty]
doc = "The action word of the act telemetry event of one duty's tick outcome ({duty} = the duty name)."
value = "duty-{duty}"

[devswarm_sup.act_recover_reasons]
doc = "The reason word of the act telemetry event for each way a recover request is refused (caller, id, request, duplicate, descriptor, max, switched_off, native_refused)."
