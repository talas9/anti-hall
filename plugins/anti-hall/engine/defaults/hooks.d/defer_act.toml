# ah-engine shipped defaults for the DevSwarm CLI verbs `done`, `relay`, `archive-request`, `nudge`, `archive`, `skip`,
# `gate-intent`, `notice`, `logs`, `wake-directive` and `help`: the answers they give where they used to hand the case to Node
# (their messages, reasons and the few constants Node holds in its modules). Format: see the header of engine.toml. The values
# are Node's own (scripts/devswarm-lib/*.js, companion/lib/devswarm-maintainer-notice.js, companion/lib/anti-hall-log.js).
# Nothing here is compiled into the binary.

[devswarm_cli.help_own_render]
doc = "Verbs whose own one-line renderer main() applies to ANY result when no --json is given, a help result included: the line Node prints for a help-shaped result (which carries none of the fields the renderer reads), by verb name. `supervision-report` is absent on purpose: its renderer throws on a help result in Node, so the usage text is printed."
value = { healthcheck = "healthcheck: ok [orphansWithUnread=0 stale=0 splits=0 deadSplits=0 mixedSplits=0 phantoms=0 unread=0]", diagnose = "diagnose: ok [registry=0 splits=0 deadSplits=0 mixedSplits=0 orphans=0 held=0 stale=0]" }

[devswarm_cli.help_render_send_quiet]
doc = "The line `send --quiet --help` prints (the quiet renderer read from a help-shaped result)."
value = "sent seq undefined -> (unknown), undefined bytes, ok"

[devswarm_cli.help_render_tick_quiet]
doc = "The line `inbox tick --quiet --help` prints (the quiet renderer read from a help-shaped result)."
value = "tick : unread null, known true, meshGap false, watcherArmed false"

[devswarm_cli.help_render_read_primary_text]
doc = "The line `inbox read-primary --format text --help` prints (the text renderer read from a help-shaped result)."
value = "(no messages)"


