# ah-engine rule and settings layers (shipped < user < project). Same format as engine.toml.
#
# Layers, lowest first: the shipped plugin files, the user (host) files under the base directory (`~/.anti-hall`), then the project
# files under the session's project root (`<root>/.anti-hall`, the git top level the engine's one canonical resolver names for the
# payload's cwd; a submodule is its own project). The environment stays on top for settings. Every layer MERGES into the one below
# it, key by key (tables deep-merge, a rule with a new id is added, a rule with a known id has the named fields replaced); no layer
# replaces another's file. Files are re-read on change.
#
#   rules      `<layer dir>/rules/*.toml`, each file holding `[[rules]]` tables (the fields of engine/rules.json; `enabled = false`
#              switches a rule of a lower layer off). The user layer also reads `rules.json` in the state directory, merged by id.
#   settings   the user layer is settings.json + config.toml (see config.toml); the project layer is `hooks.project_file`, which
#              may now also name settings listed in `layers.project_settings`.
#
# The project layer is repository content, so it is untrusted: data only (no `check`, no `options`, no scripts), size capped, schema
# validated, TIGHTEN-ONLY (it may add rules, raise an action's strictness and raise a listed setting in its stricter direction;
# loosening is refused and logged unless the USER layer lists the rule id or setting in `layers.project_may_loosen`), and a file
# that is invalid is ignored whole with one notice. A locked setting (`config.locked`) and a locked rule (`layers.locked_rules`)
# cannot be loosened by any file.

[layers.project_dir]
doc = "The project layer's directory, relative to the project root (the git top level of the payload's cwd)."
value = ".anti-hall"

[layers.rules_dir]
doc = "Name of the directory of rule files inside a layer's directory (`<home>/<base_dir>/<this>` for the user layer, `<root>/<project_dir>/<this>` for a project)."
value = "rules"

[layers.rules_ext]
doc = "Extension of a rule file; other files in the rules directory are ignored."
value = ".toml"

[layers.max_file_bytes]
doc = "Largest project-layer file the engine reads; a bigger one is ignored with a notice."
value = 65536
min = 1024
max = 4194304
unit = "bytes"

[layers.max_rule_files]
doc = "Most rule files read from one layer's rules directory (the first ones by name); the rest are ignored with a notice."
value = 32
min = 1
max = 1000

[layers.max_rules]
doc = "Most rules one layer may add or change; a layer over it is ignored whole with a notice."
value = 256
min = 1
max = 10000

[layers.max_field_len]
doc = "Longest `pattern`, `message`, `id` or path a rule of a project file may hold."
value = 4096
min = 16
max = 65536
unit = "bytes"

[layers.regex_size_limit]
doc = "Compiled-size limit of a project rule's regex (the regex crate's size_limit); a pattern over it is refused."
value = 262144
min = 1024
max = 10485760
unit = "bytes"

[layers.recheck_ms]
doc = "How often the files of a project layer are looked at again for a change while its sessions keep calling."
value = 500
min = 0
max = 60000
unit = "ms"

[layers.max_projects]
doc = "Most project layers kept in memory at once (the least recently used is dropped); the daemon is shared by every project."
value = 64
min = 1
max = 4096

[layers.rule_fields]
doc = "Fields a rule may have in a rule file; any other field makes the file invalid."
value = ["id", "events", "tools", "field", "pattern", "action", "message", "paths", "enabled", "check", "options"]

[layers.project_rule_fields]
doc = "Fields a PROJECT rule may have (data only: `check` and `options` run engine code and are refused)."
value = ["id", "events", "tools", "field", "pattern", "action", "message", "paths", "enabled"]

[layers.tighten_fields]
doc = "Fields a tighten-only layer may change on a rule a lower layer defines (everything else would narrow or switch off the rule)."
value = ["action", "message"]

[layers.action_rank]
doc = "Rule actions from the least to the most strict; a tighten-only layer may only move a rule up this list."
value = ["context", "warn", "deny"]

[layers.locked_rules]
doc = "Rule ids no file may loosen, not even the user's (they can still be tightened)."
value = ["git-no-force-push", "git-no-ai-self-credit"]

[layers.project_may_loosen]
doc = "Rule ids and setting keys a project file may loosen. Empty: a project only tightens. Honoured only when set in the USER layer (config.toml); a project file cannot grant itself this."
value = []

[layers.project_settings]
doc = "Settings a project file may set, each as `key:direction`, direction being the stricter one: `up` (a higher number), `down` (a lower number), `on` (true), `off` (false), `add` (a list may only gain entries). A setting not listed is refused in a project file."
value = ["speculation_guard.max_blocks:up", "task_guard.max_blocks:up"]

[layers.explain_rule_prefix]
doc = "`config explain <prefix><rule id>` explains a rule instead of a setting."
value = "rule:"

[layers.layer_names]
doc = "Names of the layers in `config explain`, highest precedence first: env, project, settings.json, user config.toml, shipped."
value = ["env", "project", "settings", "config_toml", "default"]

[msg.layer_ignored_file]
doc = "A layer file was ignored whole (unreadable, too big, not a regular file, invalid)."
value = "Layer file {path} ignored ({layer}): {why}"

[msg.layer_refused]
doc = "One entry of a layer file was refused; the rest of the file still applies."
value = "Layer file {path} ({layer}): {what} refused: {why}"

[msg.layer_why_size]
doc = "Reason: the file is over layers.max_file_bytes."
value = "larger than {max} bytes"

[msg.layer_why_not_file]
doc = "Reason: the path is not a plain file (a symlink, a pipe, a directory)."
value = "not a regular file"

[msg.layer_why_toml]
doc = "Reason: the text is not valid TOML. Placeholder: {err}."
value = "not valid TOML: {err}"

[msg.layer_why_top]
doc = "Reason: a rule file may only hold `rules` (an array of tables). Placeholder: {key}."
value = "unknown top-level key {key}"

[msg.layer_why_field]
doc = "Reason: a rule has a field the layer does not allow. Placeholders: {id}, {field}."
value = "rule {id}: field {field} is not allowed here"

[msg.layer_why_type]
doc = "Reason: a rule field has the wrong type. Placeholders: {id}, {field}."
value = "rule {id}: field {field} has the wrong type"

[msg.layer_why_len]
doc = "Reason: a rule field is too long. Placeholders: {id}, {field}, {max}."
value = "rule {id}: field {field} is longer than {max}"

[msg.layer_why_count]
doc = "Reason: a layer holds more rules than layers.max_rules."
value = "more than {max} rules"

[msg.layer_why_action]
doc = "Reason: the action is not one of layers.action_rank. Placeholder: {action}."
value = "unknown action {action}"

[msg.layer_why_regex]
doc = "Reason: the pattern does not compile (or is over layers.regex_size_limit). Placeholders: {id}, {err}."
value = "rule {id}: pattern: {err}"

[msg.layer_why_no_id]
doc = "Reason: a project rule has no id, so it cannot be told apart from another."
value = "a rule needs an id"

[msg.layer_why_loosen_action]
doc = "Reason: the rule would get a less strict action. Placeholders: {id}, {from}, {to}."
value = "rule {id}: action {to} is less strict than {from}"

[msg.layer_why_loosen_off]
doc = "Reason: the rule would be switched off."
value = "rule {id}: switching a rule off loosens it"

[msg.layer_why_loosen_field]
doc = "Reason: the field would change a rule of a lower layer (narrowing it). Placeholders: {id}, {field}."
value = "rule {id}: field {field} of a lower layer's rule cannot be changed here"

[msg.layer_why_setting_unlisted]
doc = "Reason: the project file names a setting that is not in layers.project_settings. Placeholder: {key}."
value = "setting {key} cannot be set by a project"

[msg.layer_why_setting_loosen]
doc = "Reason: the project value is less strict than the one below it. Placeholders: {key}, {value}, {below}, {dir}."
value = "setting {key} = {value} is not stricter ({dir}) than {below}"

[msg.layer_why_setting_dir]
doc = "Reason: a layers.project_settings entry has no known direction. Placeholder: {key}."
value = "setting {key} has no valid direction"

[msg.layer_explain_header]
doc = "First line of `config explain`. Placeholders: {key}, {value}, {source}."
value = "{key} = {value}  (from {source})"

[msg.layer_explain_line]
doc = "One layer line of `config explain`. Placeholders: {layer}, {state}, {value}."
value = "  {layer}: {state} {value}"

[layers.state_names]
doc = "The state words of a layer in `config explain`: applied (its value is the effective one), shadowed (a higher layer wins), refused (the layer's value was refused), absent (the layer does not set the key)."
value = ["applied", "shadowed", "refused", "-"]

[msg.layer_explain_usage]
doc = "Usage of `config explain`."
value = "usage: config explain <key | rule:<id>> [--cwd <dir>]"

[msg.layer_explain_unknown]
doc = "`config explain` was given a key that is not a setting or a rule. Placeholder: {key}."
value = "{key} is not a known setting or rule"

[layers.origin_names]
doc = "Names of the layers in notices and in `config explain`: shipped, user, project (in that order)."
value = ["shipped", "user", "project"]

[layers.log_kind]
doc = "Kind of the health-log line written for a layer file that was ignored or an entry that was refused."
value = "layer_notice"

[msg.layer_why_dup]
doc = "Reason: a rule id appears twice in one layer; the first is kept."
value = "duplicate rule id in this layer"

[msg.layer_why_incomplete]
doc = "Reason: a rule with a new id has no action (only a rule that changes a lower layer's rule may leave fields out). Placeholder: {id}."
value = "rule {id}: a new rule needs an action"
