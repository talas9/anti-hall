value = "verified: GitHub build attestation for {asset} (repo {repo})"

[msg.updater_verified_dl]
doc = "Placeholders: {asset}, {sums}."
value = "verified: sha256 of {asset} matches the release {sums}"

[msg.updater_verified_file]
doc = "Placeholders: {name}, {src}."
value = "verified: sha256 of {name} matches {src}"

[msg.updater_verified_lock]
doc = "Said when the download also matches the plugin lock."
value = "verified: also matches this plugin's ah-engine.lock"

[msg.launcher_nodeback_why_no_list]
doc = "The reason a guard event fails closed while the Node fallback switch is on and the fallback list is missing or empty."
value = "no fallback list"

[msg.launcher_nodeback_why_no_match]
doc = "The reason a guard event fails closed when no fallback hook matches its tool (the list has no neutral answer)."
value = "no matching fallback hooks"

[msg.launcher_nodeback_why_not_run]
doc = "The reason a guard event fails closed when matching fallback hooks existed but none finished."
value = "fallback hooks did not run"

[msg.launcher_nodeback_why_hard]
doc = "The reason a guard event fails closed when a fallback hook died or could not be started and no hook blocked."
value = "fallback hook failed before producing a complete answer"

[msg.launcher_nodeback_script_missing]
doc = "Written when a fallback command names a script under the plugin root that does not exist; that hook is skipped and counted as an error. Placeholder: {path}."
value = "anti-hall: hook script not found: {path}"

[msg.launcher_nodeback_merge_differs]
doc = "Written when the JSON answers of several fallback hooks carry different fields besides the merged additionalContext and systemMessage; the first hook's fields are kept."
value = "anti-hall: fallback merge kept the first hook's other fields; a later hook set different ones"

[msg.err_mesh_no_project]
doc = "The store reader was run without --db from a directory that is in no DevSwarm project (or whose project has no store yet). Placeholder: {cwd}."
value = "no DevSwarm store for {cwd}: run this inside the project's checkout, or pass --db <devswarm.db>"

[msg.err_mesh_read_id]
doc = "`mesh read` of the store reader was given no workspace id. The broadcast read is the mesh verb `mesh mesh read`."
value = "mesh read needs a workspace id: `ah-engine mesh read <id>` (or --id <id>). The broadcast read is `ah-engine mesh mesh read [--peek]`."

[msg.err_mesh_ambiguous_store]
doc = "The workspace id is in more than one project store. Placeholders: {id}, {stores} (comma separated repo keys)."
value = "workspace {id} is in several project stores ({stores}): run this from that project's checkout, or pass --db <devswarm.db>"

[msg.docs_empty]
doc = "Printed to stderr when `docs` generated no text (the defaults it reads could not be used), so nothing is written. Placeholders: what (the format asked for), out (the --out file, left as it was; empty when printing)."
value = "ah-engine docs: nothing was generated for format '{what}' (is the plugin's engine/defaults readable? set AH_ENGINE_PLUGIN_ROOT); the --out file '{out}' was left as it was"

[msg.docs_write_failed]
doc = "Printed to stderr when `docs --out` could not write its file. Placeholders: out, err."
value = "ah-engine docs: could not write '{out}': {err}"
