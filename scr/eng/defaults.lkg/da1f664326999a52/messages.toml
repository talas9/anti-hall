[msg.updater_help]
doc = "Printed by `ah-hook update --help`."
value = "ah-hook update: move the local ah-engine binary (and the thin client, when the release ships it) to an offline file, the latest stable release or the latest dev pre-release.\n  --from FILE [--sha256 X] [--yes]   offline: FILE is a release .tar.gz or a bare binary. Expected sha256 = --sha256, else the SHA256SUMS next to FILE, else the plugin's ah-engine.lock; with none of them the sha is printed and --yes is required\n  --channel stable|dev               latest ah-engine-v* release / latest ah-engine-dev-<sha8> pre-release (dev also syncs the plugin files when the live kit is installed)\n  --rollback                         restore the previous binaries (bin/ah-engine.prev, bin/ah-hook.prev); run twice to toggle\n  --auto                             honour the engine.autoUpdate setting (off|stable|dev) and the daily limit\noptions: --check-release (print one JSON line about the latest release of the channel, change nothing)  --force (allow a downgrade)  --launcher FILE  --dry-run (verify and smoke-test, install nothing)  --extract-to PATH  --no-restart  --no-plugin  --live-select LIST  -v  --json (ignored)\nOnline sources are verified against the release SHA256SUMS and, when gh is installed and logged in, the GitHub build attestation. Steps: verify, smoke test (<new> version), launcher self-test, then the NEW engine's install routine (`ah-engine update --from-local`: rollback copy, install, settle, validate, automatic rollback on failure, cleanup, install record); the client installs by itself (atomic swap, previous kept as .prev) only when that routine cannot be started. Nothing is deleted; a failure at any step keeps the old binary.\nExit: 0 done / already current / nothing to do, 1 failed (old binary kept), 2 usage, 3 --yes needed."

