# ah-engine shipped message texts (D17): everything a person or an agent can read that the engine produces,
# except the git check's block messages (git.toml). `{name}` marks a placeholder filled at the call site.
# Format: see the header of engine.toml. Error codes and event kinds are stable identifiers and live in code.

# ---- failure hints (one per environment-class error code group, see engine.toml health.error_codes) ----

[msg.hint_disk_full]
doc = "Self-fix hint when the disk is full (error code os28)."
value = "the disk is full (no space left); free some space, then it recovers by itself"

[msg.hint_state_dir]
doc = "Self-fix hint when the state directory is not writable or not private. Placeholders: {state_dir}, {env_dir}."
value = "ah-engine's state directory is not writable or not private; fix its ownership (chown to yourself) and permissions (chmod 700 {state_dir}), or set {env_dir} to a directory you own"

[msg.hint_socket_path]
doc = "Self-fix hint when the socket path is too long. Placeholder: {env_dir}."
value = "the socket path is too long; set {env_dir} to a shorter path (e.g. /tmp/ah)"

[msg.hint_fds]
doc = "Self-fix hint when the process ran out of file descriptors."
value = "the process ran out of file descriptors; raise `ulimit -n` or close other programs"

[msg.hint_memory]
doc = "Self-fix hint when the OS killed or starved the daemon. Placeholder: {env_mem}."
value = "the OS killed or starved ah-engine (low memory); close other programs or lower {env_mem}"

# ---- advisories ---------------------------------------------------------------------------------------

[msg.advisory_env]
doc = "Once-per-session advisory for an environment-class failure. Placeholder: {hint}."
value = "⚠️ anti-hall · ah-engine: {hint}. Using the built-in checks instead."

[msg.advisory_degraded]
doc = "Once-per-session notice that the engine is running below full strength. Placeholders: {restarts} self-restarts and {fallbacks} fallbacks to Node in the last {mins} minutes, {log} the event-log path."
value = "anti-hall engine degraded: {restarts} self-restarts, {fallbacks} Node fallbacks in the last {mins} min (`ah-engine status --json`, log {log})."

[msg.advisory_permanent]
doc = "Once-per-session advisory for a permanent failure; nothing is ever filed automatically. Placeholders: {reason}, {diagnostics}."
value = "⚠️ anti-hall · ah-engine: stopped after repeated failures ({reason}). Using the built-in checks instead. Please file an issue: https://github.com/talas9/anti-hall/issues/new\n{diagnostics}"

[msg.diagnostics]
doc = "Secret-scrubbed diagnostic block attached to a permanent-failure advisory. Placeholders: {version}, {os}, {arch}, {code}, {log}."
value = "--- anti-hall ah-engine diagnostics ---\nversion: {version}\nos: {os} {arch}\nerror code: {code}\nlast log lines (ts, kind, code, detail):\n{log}\n---"

[msg.reason_crashloop]
doc = "Recorded reason when the daemon keeps dying. Placeholders: {n}, {secs}."
value = "daemon died {n} times in {secs} s"

[msg.log_rollback_request]
doc = "Log detail when the crash-loop rule asks for a roll-back. Placeholder: {sha}."
value = "binary {sha} never ran healthy; asked the integrity check to restore the known-good binary"

[msg.log_crashloop_rollback]
doc = "Log detail added when a crash-loop trip also requested a roll-back."
value = "roll-back to the known-good binary requested"

[msg.log_crashloop_new_binary]
doc = "Log detail when a crash-loop cooldown ends because the binary was replaced. Placeholder: {sha}."
value = "binary replaced ({sha}); respawning allowed again"


[msg.reason_breaker]
doc = "Recorded reason when the client breaker opens. Placeholders: {n}, {secs}, {why}."
value = "{n} engine failures in {secs} s (last: {why})"

[msg.state_open]
doc = "Status text for a breaker that is open. Placeholder: {secs}."
value = "open ({secs} s left)"

[msg.state_stopped]
doc = "Status text for a crash-loop stop that is active. Placeholder: {secs}."
value = "stopped ({secs} s left)"

# ---- event log details --------------------------------------------------------------------------------

[msg.log_daemon_killed]
doc = "Log detail when the daemon was killed by a signal while starting."
value = "daemon killed while starting"

[msg.log_client_panic]
doc = "Log detail when the hook client hit an internal error (a panic) and failed open."
value = "hook client internal error; failing open"

[msg.log_fallback_read_timeout]
doc = "Log detail when the Node fallback finished but its stdout or stderr was still open at the deadline."
value = "node fallback output not read to the end"

[msg.fallback_read_timeout]
doc = "Printed on stderr when the Node fallback finished but its output could not be read to the end in time, so no decision exists. In the legacy direct forced-fallback path this exits 2 for guard events and 0 for non-guard events; otherwise it exits 1."
value = "anti-hall: the Node hook finished but its output was not complete before the deadline; no decision was made for this call"

[msg.log_operator_reset]
doc = "Log detail for `reset`."
value = "operator reset"

[msg.log_system_restart]
doc = "Log detail when a daemon is found gone without a clean exit AND the operating system booted after its last sign of life (a reboot, an OS update, a power loss): the machine stopped it, it did not crash. Placeholders: {pid}, {last_alive_ms}, {boot_ms}."
value = "daemon pid {pid} was ended by the system stopping (its last sign of life {last_alive_ms} ms, the system booted at {boot_ms} ms): not a crash"

[msg.log_crash_context]
doc = "Log detail when a daemon is found dead without a clean exit, with the last breadcrumb. Placeholders: {pid}, {context}."
value = "daemon pid {pid} died without a clean exit; last context {context}"

[msg.panic_payload_unknown]
doc = "Panic payload text when Rust did not carry a string."
value = "non-string panic payload"

[msg.panic_row]
doc = "Event-log detail for a panic: message and source location first so the row's length cap never cuts them; the backtrace lives only in the crash file. Placeholders: {message}, {location}, {thread}, {context}."
value = "{message} @ {location} (thread {thread}, context {context})"

[msg.thread_unknown]
doc = "Thread name used in panic reports for unnamed threads."
value = "unnamed"

[msg.thread_panic]
doc = "Log detail when a daemon service thread panics. Placeholders: {thread}, {n}, {max}."
value = "daemon service thread {thread} panicked ({n}/{max})"

[msg.thread_panic_restart]
doc = "Clean restart reason when a daemon service thread exceeds its panic restart cap. Placeholder: {thread}."
value = "daemon service thread {thread} exceeded panic restart cap"

[msg.log_budget]
doc = "Log detail when a rule evaluation exceeded its CPU budget."
value = "rule evaluation exceeded its cpu budget"

[msg.log_answer_dropped]
doc = "Event-log detail (kinds answer_dropped and guard_answer_dropped, at most one per check and reason per diagnostics.abandoned_log_interval_ms) when a check of a request gave no answer. Reasons: shed (CPU hard limit, diagnostics.shed_checks), client_gone (the client closed its connection), hard_deadline (the request passed daemon.request_hard_ms), cpu_budget (this check alone used more than daemon.eval_budget_us), check_deferred (the check itself gave no answer). The check's failure policy decides in its place."
value = "{check} ({event}) gave no answer: {reason}"

[msg.log_budget_crossed]
doc = "Log detail when a check ran and crossed the per-check CPU budget (daemon.eval_budget_us) alone, so its answer was dropped: the check's own thread CPU and wall time."
value = "cpu budget crossed by {check}: it used {cpu_us} us of cpu and {wall_us} us of wall time"

[msg.log_budget_skipped]
doc = "Log detail when a check was not started because the request's CPU budget was already spent; `by` names the check that crossed it (empty when it was crossed before the first check)."
value = "{check} deferred, cpu budget already spent (crossed by {by})"

[msg.script_limit_cpu]
doc = "Name of the script CPU-time limit in the line that says which limit interrupted a script call."
value = "cpu limit"

[msg.script_limit_wall]
doc = "Name of the script wall-clock backstop in the line that says which limit interrupted a script call."
value = "wall-clock backstop"

[msg.script_limit_request]
doc = "Name of the request's client deadline in the line that says which limit interrupted a script call."
value = "request deadline"

[msg.script_interrupted]
doc = "Failure detail of a script call that was interrupted: the interpreter's error, the limit that fired and the limits' sizes."
value = "{error} (interrupted by the {limit}; cpu limit {cpu_ms} ms, wall backstop {wall_ms} ms)"

[msg.log_budget_soft]
doc = "Log detail when a request used more thread CPU than its SOFT budget (a warning; nothing was cut)."
value = "request used {used_us} us of thread cpu, over the soft budget of {soft_us} us (hard budget {hard_us} us)"

[msg.log_deadline_soft]
doc = "Log detail when the client's fail-fast wait (the request's SOFT deadline) ended while a check was running: the request is {elapsed_ms} ms old and that check ran {ran_ms} ms. Nothing is cut: the checks keep running up to the hard deadline and the client uses the late reply."
value = "{check} ({event}): ran {ran_ms} ms, the client's fail-fast wait ended {elapsed_ms} ms after the request arrived; the request keeps running to its hard deadline"

[msg.log_deadline_soft_queued]
doc = "Log detail when the client's fail-fast wait (the request's SOFT deadline) had already ended before the first check of the request started, so the request waited {elapsed_ms} ms (queue, connection) before any check ran. {check} is the first check of the request. Nothing is cut."
value = "{check} ({event}): the client's fail-fast wait had ended {elapsed_ms} ms after the request arrived, before the first check started; the request keeps running to its hard deadline"

[msg.script_soft_overrun]
doc = "Log detail (code script_soft, rate-limited) of a script call that used more thread CPU than its SOFT limit; it was not cut."
value = "{check} ({event}) used {used_us} us of cpu, over its soft limit of {soft_ms} ms (hard limit {hard_ms} ms)"

[msg.jev_slow]
doc = "Log detail (code jev_slow, rate-limited) of a Jev call slower than its SOFT limit; its answer was still used."
value = "{id}: Jev took {ms} ms, over the soft limit of {soft_ms} ms"

[msg.log_panic]
doc = "Log and failure detail when a request handler panicked."
value = "a request handler panicked"

[msg.log_stall]
doc = "Log detail when the accept loop stalled."
value = "accept loop stalled"

[msg.failure_stall]
doc = "Failure reason when the accept loop stalled."
value = "the ah-engine loop stalled"

[msg.log_stuck]
doc = "Log detail when a worker is stuck. Placeholder: {i}."
value = "worker {i} stuck"

[msg.failure_stuck]
doc = "Failure reason when a worker is stuck."
value = "an ah-engine worker got stuck"

[msg.log_rss]
doc = "Log detail when the daemon is over its memory cap. Placeholders: {rss}, {cap}."
value = "rss {rss} KB over cap {cap} KB; restarting cleanly"

[msg.log_start]
doc = "Log detail for a daemon start. Placeholders: {version}, {pid}, {rlimit}."
value = "v{version} pid {pid} mem_limit {rlimit}"

[msg.log_lock_fail]
doc = "Start-failure detail when the lock file cannot be opened. Placeholders: {path}, {err}."
value = "lock {path}: {err}"

[msg.log_not_socket]
doc = "Start-failure detail when something other than a socket sits at the socket path. Placeholder: {path}."
value = "{path} exists and is not a socket"

[msg.log_bind_fail]
doc = "Start-failure detail when binding the socket fails. Placeholders: {path}, {err}."
value = "bind {path}: {err}"

[msg.log_accept_error]
doc = "Event-log detail (rate-limited) when the daemon's accept failed for a reason other than nothing pending. Placeholders: {code} (os<n>), {err}."
value = "accept failed ({code}: {err}); backing off before the next poll"

[msg.log_accept_recovered]
doc = "Event-log detail when the daemon accepts a connection again after accept failures (logged then, because a full descriptor table can keep the failure's own log line from being written). Placeholders: {n}, {code} (os<n> of the last failure)."
value = "accept works again after {n} failed accepts (last {code})"

[msg.log_proc_spawn]
doc = "Event-log detail (rate-limited, code proc_spawn_failed) when a helper process could not be started. Placeholders: {what} (the program), {code} (os<n>), {err}."
value = "could not start {what} ({code}: {err})"

[msg.log_proc_timeout]
doc = "Event-log detail (rate-limited, code proc_timeout) when a helper process ran past its timeout and its process group was killed. Placeholders: {what}, {ms}."
value = "{what} ran past {ms} ms; its process group was killed"

[msg.log_proc_unread]
doc = "Event-log detail (rate-limited, code proc_unread) when a helper exited but its output did not reach end of file within proc.read_grace_ms (a process it left behind held a pipe); its group was killed. Placeholder: {what}."
value = "{what} exited but its output was not complete; its process group was killed"

[msg.log_lock_no_daemon]
doc = "Log detail when a starting daemon gives up on the singleton lock while no daemon answers on the socket. Placeholders: {path}, {pid} (the pid the lock file names, may be empty), {live_engine}."
value = "lock {path} held (pid {pid}, live_engine={live_engine}) but no daemon answers; this start gives up and the call falls back to Node"

[msg.daemon_already_running]
doc = "Printed on stderr when a second daemon start finds an existing daemon/lock holder for the socket. Placeholders: {path}, {pid}, {live_engine}, {answers}."
value = "ah-engine daemon already running for socket {path}; exiting (holder pid {pid}, live_engine={live_engine}, answers={answers})"

[msg.log_cpu_sustained]
doc = "Event-log detail when the daemon CPU self-check observes sustained CPU and backs off scheduled jobs. Placeholders: {pct}, {ms}, {backoff_ms}."
value = "daemon CPU {pct}% over {ms} ms; backing off scheduled jobs for {backoff_ms} ms"

[msg.exit_reason_handoff]
doc = "Drain reason for a handoff to a newer build or a stop request."
value = "handoff or stop"

[msg.exit_reason_stall]
doc = "Drain reason for a stalled loop."
value = "loop stalled"

[msg.exit_reason_stuck]
doc = "Drain reason for a stuck worker."
value = "worker stuck"

[msg.log_data]
doc = "Log detail when the data segment nears the setrlimit ceiling. Placeholders: {data}, {limit}, {pct}."
value = "data segment {data} KB reached {pct} % of the {limit} KB limit; restarting cleanly"

[msg.exit_reason_data]
doc = "Drain reason for nearing the data-segment limit."
value = "data limit"

[msg.exit_reason_rss]
doc = "Drain reason for exceeding the memory cap."
value = "rss cap"

[msg.exit_reason_idle]
doc = "Drain reason for idle exit (only when daemon.idle_exit_s is set)."
value = "idle"

[msg.exit_reason_sigterm]
doc = "Drain reason for SIGTERM."
value = "SIGTERM"

[msg.exit_reason_sigint]
doc = "Drain reason for SIGINT."
value = "SIGINT"

