# ah-engine shipped defaults for the advisory layer (GitHub #225): how often an advisory may reach the model.
# Format: see the header of engine.toml.
#
# Fixed-text reminders fire once per session and again only after `repeat_turns` further calls; state tables (the open-task line, the
# dispatch line) fire only when their content hash changes; every kind has a per-session soft cap (warn + count) and hard cap
# (suppress). Judgment advisories (a rule flags, Jev confirms in the background, the advisory is injected on a later turn) count
# flagged / asked / confirmed / injected / suppressed / jev_error per kind under `advisory` in `status --json`.

[advisory.state_prefix]
doc = "The prefix of the per-session advisory state file under the base directory (`<prefix>-<session>.json`)."
value = "advisory-state"

[advisory.state_ext]
doc = "The extension of the per-session advisory state file."
value = ".json"

[advisory.session_safe_max]
doc = "The longest sanitised session id used in the advisory state file name."
value = 80
min = 8

[advisory.hash_len]
doc = "How many hex characters of a state table's content hash are kept in the advisory state."
value = 16
min = 8

[advisory.max_kinds]
doc = "The most advisory kinds one session's state file keeps (the least recently used go first)."
value = 32
min = 4

[advisory.repeat_turns_default]
doc = "How many further calls a fixed-text advisory is held back after it fired, unless its kind has its own entry in advisory.repeat_turns_by_kind."
value = 12
min = 1

[advisory.repeat_turns_by_kind]
doc = "Per-kind override of advisory.repeat_turns_default."
value = { task_guard_prune = 40, task_guard_omc = 40, task_guard_agents = 20, tasklist_omc = 40, tasklist_plan_mode = 40 }

[advisory.cap_soft_default]
doc = "The per-session soft cap of an advisory kind: past it the advisory still fires and the kind is counted as over its soft cap."
value = 8
min = 1

[advisory.cap_hard_default]
doc = "The per-session hard cap of an advisory kind: past it the advisory is suppressed (counted as suppressed)."
value = 30
min = 1

[advisory.cap_soft_by_kind]
doc = "Per-kind override of advisory.cap_soft_default."
value = { task_open_line = 12, task_demand_line = 12 }

[advisory.cap_hard_by_kind]
doc = "Per-kind override of advisory.cap_hard_default."
value = { task_open_line = 60, task_demand_line = 60, advisor_review = 3, advisor_plan = 3, advisor_retry = 3 }

[advisory.fallback_per_session]
doc = "How many times per session the rule-only fallback of a judgment advisory may fire when Jev cannot confirm it (error, no key, too slow)."
value = 1
min = 1

[advisory.metric_names]
doc = "The metric names the scripts count per advisory kind, by role: a rule flagged a candidate, a question was put to Jev, Jev confirmed, the advisory reached the model, it was held back (unchanged table, repeat, cap, Jev declined, rate-limited fallback), a Jev question failed, an advisory fired past its soft cap; the advisor-mode adherence counts: a failure armed the retry rule, the advisor was consulted after that failure, a retry block was acted on (advisor consulted before the next edit), an advisor call was seen."
value = { flagged = "flagged", asked = "asked", confirmed = "confirmed", injected = "injected", suppressed = "suppressed", jev_error = "jev_error", over_soft = "over_soft_cap", armed = "armed", consulted = "consulted", acted_on = "acted_on", consult = "consult" }

[advisory.kind_task_open_line]
doc = "The advisory kind name of the per-prompt open-tasks line of the task tracker."
value = "task_open_line"

[advisory.kind_task_demand_line]
doc = "The advisory kind name of the per-turn DISPATCH NOW line of the task tracker."
value = "task_demand_line"

[advisory.kind_task_tier_note]
doc = "The advisory kind name of the Jev dispatch-tier annotation on the DISPATCH NOW line."
value = "task_tier_note"

[advisory.kind_dispatch_tier]
doc = "The advisory kind name of the dispatch-tier hook's Jev question."
value = "dispatch_tier"

[advisory.kind_task_guard_prune]
doc = "The advisory kind name of the task guard's prune-the-task-list note."
value = "task_guard_prune"

[advisory.kind_task_guard_omc]
doc = "The advisory kind name of the task guard's step-aside note while an OMC loop runs."
value = "task_guard_omc"

[advisory.kind_task_guard_agents]
doc = "The advisory kind name of the task guard's step-aside note while agents run."
value = "task_guard_agents"

[advisory.kind_tasklist_omc]
doc = "The advisory kind name of the task-list guard's step-aside note while an OMC loop runs."
value = "tasklist_omc"

[advisory.kind_tasklist_plan_mode]
doc = "The advisory kind name of the task-list guard's plan-mode note."
value = "tasklist_plan_mode"

[advisory.kind_tasklist_budget]
doc = "The advisory kind name of the task-list hygiene line (a subject over handover.taskSubjectMax or open tasks over handover.taskListBudget)."
value = "tasklist_budget"
