# Lane L12 (v1.0): the keys the main-thread half of edit-guard and the pending-marker half of orch-on-spawn read beyond small_guards.toml
# (edit_guard.*), spawn_context.toml (orch_on_spawn.*, orch_state.*) and command.toml (command.eg_*, command.msg_edit_*), whose texts and
# tables they share with the Bash edit parity of command-guard.

[edit_guard.msg_what]
doc = "Heading of the delegation block ({tool} is the tool name, {who} the next text)."
value = "{tool} is not allowed: the {who} does not edit files directly."

[edit_guard.msg_self_edit_what]
doc = "Heading of the block on an edit of the repository's own edit allowlist ({tool} is the tool name)."
value = "{tool} on .anti-hall/edit-allow.json is not allowed."

[edit_guard.msg_self_edit_why]
doc = "Why the repository's own edit allowlist is never edited by the main thread."
value = "That file decides which files the main thread may edit, so the main thread never edits it."

[edit_guard.msg_self_edit_instead]
doc = "What to do instead ({sub} names the worker)."
value = "ask the user to update and re-trust the edit allowlist."

[edit_guard.msg_outside_what]
doc = "Heading of the block on a handover document outside the project ({tool} is the tool name)."
value = "{tool} on a handover file outside the project is not allowed."

[edit_guard.msg_outside_why]
doc = "Why a handover document outside the project is blocked."
value = "Handovers live inside the project, where they are found on resume."

[edit_guard.msg_outside_instead]
doc = "What to do instead ({path} is the canonical handover path)."
value = "write it yourself at {path}; no subagent or override is needed."

[edit_guard.msg_new_what]
doc = "Heading of the block on a new handover document at the wrong place ({tool} is the tool name)."
value = "a new handover must be written at the session path."

[edit_guard.msg_new_why]
doc = "Why a new handover document is redirected."
value = "New handovers belong under .anti-hall/handovers/<date>/<session>/HANDOVER.md."

[edit_guard.msg_new_instead]
doc = "What to do instead for a new handover document."
value = "write it at the session handover path."

[edit_guard.msg_new_allowed]
doc = "What stays allowed next to a redirected handover document."
value = ".anti-hall/handovers/**."

[edit_guard.msg_new_override]
doc = "The override line of the handover redirect ({skip} is the skip command)."
value = "tell the agent \"skip edit-guard\" (lasts 15 minutes)."

[edit_guard.msg_patch_what]
doc = "Heading of the block on an apply_patch the parser rejects ({error} is the parser's message)."
value = "this apply_patch could not be read ({error}), so its targets can't be checked."

[edit_guard.msg_patch_why]
doc = "Why an unparseable patch is blocked on the main thread."
value = "Edits in the main thread are checked against the delegation rule."

[edit_guard.msg_patch_instead]
doc = "What to do instead for an unparseable patch ({sub} names the worker)."
value = "send a well-formed patch."

[edit_guard.handover_parts]
doc = "The canonical handover path under the project root, as its parts before the date directory, and the file name after the session directory."
value = { dir = [".anti-hall", "handovers"], file = "HANDOVER.md", placeholder = "<session-id>" }

[edit_guard.session_id_unsafe]
doc = "Characters of a session id replaced by an underscore in the handover path (a regular expression, JavaScript syntax)."
value = "[^A-Za-z0-9._-]"

[edit_guard.builder_id_env]
doc = "The environment variable that holds a DevSwarm workspace's builder id."
value = "DEVSWARM_BUILDER_ID"

[edit_guard.builder_id_pattern]
doc = "What a builder id may look like to be looked up as a descriptor file name (a regular expression, JavaScript syntax)."
value = "^[A-Za-z0-9._-]+$"

[edit_guard.descriptor_dir]
doc = "Where anti-hall's DevSwarm workspace descriptors live under the home directory, as its parts."
value = [".anti-hall", "devswarm", "workspaces"]

[edit_guard.descriptor_ext]
doc = "The extension of a workspace descriptor file."
value = ".json"

[edit_guard.repos_dir]
doc = "DevSwarm's worktree root under the home directory, as its parts: a working directory below it belongs to a child workspace."
value = [".devswarm", "repos"]

[edit_guard.nudge_setting]
doc = "Where the inline-work advisory's switch is read from."
value = { section = "devswarm", key = "inlineWorkNudge", env = "ANTIHALL_DEVSWARM_INLINE_WORK_NUDGE", aliases = [], option = "devswarm_inline_work_nudge", default = true }

[edit_guard.nudge_threshold_setting]
doc = "Where the inline-work advisory's call threshold is read from."
value = { section = "devswarm", key = "inlineWorkNudgeThreshold", env = "ANTIHALL_DEVSWARM_INLINE_WORK_NUDGE_THRESHOLD", aliases = [], option = "devswarm_inline_work_nudge_threshold", default = 5, min = 1 }

[edit_guard.nudge_default_threshold]
doc = "The threshold used when the setting holds nothing usable."
value = 5

[edit_guard.nudge_state_prefix]
doc = "The state file name of the inline-work counter before the session id (under the state directory)."
value = "inline-work-"

[edit_guard.nudge_state_ext]
doc = "The extension of the inline-work counter file."
value = ".json"

[edit_guard.nudge_sid_unsafe]
doc = "Characters of the session id replaced by an underscore in the counter file name (a regular expression, JavaScript syntax)."
value = "[^A-Za-z0-9_.-]"

[edit_guard.nudge_sid_max]
doc = "The longest session id kept in the counter file name."
value = 128

[edit_guard.nudge_prune_prefix]
doc = "The writer prefix of the stale-file sweep of the counter files."
value = "inline-work"

# ---- orch-on-spawn, pending marker ----

[orch_on_spawn.lease_ms]
doc = "How long the first claim of an epoch is held before a second slot may be opened by a spawn that finds no delivered copy (2 minutes)."
value = 120000
unit = "ms"

[orch_on_spawn.claim_suffix]
doc = "The suffix of the first claim file name after the epoch id, before the extension."
value = "claim"

[orch_on_spawn.claim2_suffix]
doc = "The suffix of the retry claim file name after the epoch id, before the extension."
value = "claim2"

[orch_on_spawn.claim_ext]
doc = "The extension of a claim file."
value = ".json"

[orch_on_spawn.epoch_unsafe]
doc = "Characters of an epoch id dropped from a claim file name (a regular expression, JavaScript syntax)."
value = "[^A-Za-z0-9_-]"

[orch_on_spawn.token_format]
doc = "The token appended to the delivered text so the transcript scan can recognise this epoch's copy ({epoch} is the epoch id)."
value = "[anti-hall orch-full:{epoch}]"

[orch_on_spawn.codex_tool_suffix]
doc = "A spawn tool name ending in this text is Codex's (a regular expression, JavaScript syntax)."
value = "spawn_agent$"

[orch_on_spawn.default_event]
doc = "The event name echoed when the payload names none."
value = "PreToolUse"

[orch_on_spawn.tail_windows]
doc = "The transcript windows, in bytes, the delivered-copy scan reads in turn (a short tail first, then once wider)."
value = [262144, 4194304]
unit = "bytes"

[orch_on_spawn.line_max]
doc = "Longest transcript line, in bytes, the first-timestamp scan keeps."
value = 1048576
unit = "bytes"

[orch_on_spawn.claude_entry_type]
doc = "The transcript entry type that holds a Claude hook attachment."
value = "attachment"

[orch_on_spawn.claude_attachment_type]
doc = "The attachment type that is a delivered hook context."
value = "hook_additional_context"

[orch_on_spawn.codex_entry_type]
doc = "The rollout entry type that holds a Codex message."
value = "response_item"

[orch_on_spawn.codex_payload_type]
doc = "The rollout payload type of a message."
value = "message"

[orch_on_spawn.codex_role]
doc = "The rollout role of a delivered hook context."
value = "developer"

[edit_guard.nudge_note]
doc = "The once-per-session note to a DevSwarm Primary that keeps editing inline while actionable tasks are pending and no workspace is live."
value = "💡 coordinator workload: pending work needs a workspace.\nDo instead: hand the remaining work to a child workspace."
