[package]
name = "ah-hook"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Thin hook launcher for ah-engine: watchdog, fail-open/fail-closed outcome table, cold-start guard wait"

[[bin]]
name = "ah-hook"
path = "src/main.rs"

[dependencies]
# kill(2)/killpg for the process-group watchdog; std has no signal API
libc = "0.2.190"
# the plugin's defaults (the engine's own parser; A/B against a hand-written reader in THIN-LAUNCHER.md)
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

