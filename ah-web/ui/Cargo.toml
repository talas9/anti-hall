[package]
name = "ah-web-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Command Center page (Leptos, client-side rendered, compiled to WASM)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ah-web-proto = { path = "../proto" }
leptos = { version = "=0.8.22", features = ["csr"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["EventSource", "MessageEvent", "Event", "Window", "Document", "Element", "HtmlElement", "Storage", "Performance", "MediaQueryList", "Request", "RequestInit", "Response", "Headers"] }
js-sys = "=0.3.106"
wasm-bindgen-futures = "=0.4.79"
serde_json = "1"

# Its own workspace: another target and another release profile than the server.
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
