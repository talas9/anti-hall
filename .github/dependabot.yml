version: 2
updates:
  # Dependabot keeps a full-SHA pin ("uses: owner/repo@<sha> # v1.2.3") current: it bumps the SHA and rewrites the
  # trailing version comment. Every action in .github/workflows is pinned this way.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The Rust engine is its own Cargo workspace (D69). Majors are included on purpose (D84): no ignore rules.
  - package-ecosystem: "cargo"
    directory: "/ah-engine"
    target-branch: "dev"
    schedule:
      interval: "weekly"
