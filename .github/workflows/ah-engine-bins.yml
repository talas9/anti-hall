name: ah-engine prebuilt binaries

on:
  push:
    branches: [engine-proto]
    paths: ['ah-engine/**', '.github/workflows/ah-engine-bins.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-unknown-linux-gnu,  runner: ubuntu-22.04 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { triple: aarch64-apple-darwin,      runner: macos-14 }
          - { triple: x86_64-apple-darwin,       runner: macos-15-intel }
    defaults:
      run:
        working-directory: ah-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (per ah-engine/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ah-engine
          key: bins-${{ matrix.triple }}
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/ah-engine version
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp target/release/ah-engine dist/ah-engine
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum ah-engine > ah-engine.sha256; else shasum -a 256 ah-engine > ah-engine.sha256; fi
          cat ah-engine.sha256
      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ah-engine-${{ matrix.triple }}-${{ steps.sha.outputs.short }}
          path: |
            ah-engine/dist/ah-engine
            ah-engine/dist/ah-engine.sha256
          retention-days: 14
          if-no-files-found: error
