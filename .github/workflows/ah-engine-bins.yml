name: ah-engine prebuilt binaries

# On each push to engine-proto that changes ah-engine/: build every target and publish a GitHub PRE-RELEASE
# `ah-engine-dev-<sha8>` (archives + SHA256SUMS + COMMIT + build attestation) that `hooks/ah-update.sh --channel dev` installs.
# Releases are never deleted: dev pre-releases beyond the newest 5 are only marked superseded (a pre-release is never "latest").

on:
  push:
    branches: [engine-proto]
    paths: ['ah-engine/**', '.github/workflows/ah-engine-bins.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-unknown-linux-gnu,  runner: ubuntu-22.04 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { triple: aarch64-apple-darwin,      runner: macos-14 }
          - { triple: x86_64-apple-darwin,       runner: macos-15-intel }
          - { triple: x86_64-unknown-linux-musl,  runner: ubuntu-24.04,    apt: musl-tools }
          - { triple: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, apt: musl-tools }
    defaults:
      run:
        working-directory: ah-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        if: matrix.apt != ''
        env:
          APT: ${{ matrix.apt }}
        run: |
          read -ra pkgs <<< "$APT"
          sudo apt-get update -q
          sudo apt-get install -y -q "${pkgs[@]}"
      - name: Toolchain (per ah-engine/rust-toolchain.toml)
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          rustup show active-toolchain || rustup toolchain install --profile minimal
          rustup target add "$TRIPLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ah-engine
          key: bins-${{ matrix.triple }}
      - name: Build
        env:
          TRIPLE: ${{ matrix.triple }}
        run: scripts/build.sh --target "$TRIPLE"
      - name: Smoke test
        env:
          TRIPLE: ${{ matrix.triple }}
        run: ./target/"$TRIPLE"/release/ah-engine version
      - name: Package
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -eu
          mkdir -p dist
          cp "target/$TRIPLE/release/ah-engine" dist/ah-engine
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum ah-engine > ah-engine.sha256; else shasum -a 256 ah-engine > ah-engine.sha256; fi
          cat ah-engine.sha256
      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release archive (ah-engine-dev-<sha8>-<triple>.tar.gz)
        env:
          TRIPLE: ${{ matrix.triple }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -eu
          name="ah-engine-dev-${SHORT}-${TRIPLE}"
          mkdir -p "rel/$name"
          cp dist/ah-engine "rel/$name/ah-engine"
          cp ../LICENSE "rel/$name/LICENSE"
          cp README.md "rel/$name/README.md"
          tar -czf "rel/$name.tar.gz" -C rel "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ah-engine-${{ matrix.triple }}-${{ steps.sha.outputs.short }}
          path: |
            ah-engine/dist/ah-engine
            ah-engine/dist/ah-engine.sha256
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-release-${{ matrix.triple }}
          path: ah-engine/rel/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish dev pre-release
    needs: build
    if: github.ref == 'refs/heads/engine-proto'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: ah-engine-dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dev-release-*
          path: dist
          merge-multiple: true
      - name: Checksums and commit record
        run: |
          set -eu
          short="$(git rev-parse --short=8 HEAD)"
          echo "SHORT=$short" >> "$GITHUB_ENV"
          cd dist
          n="$(find . -maxdepth 1 -name 'ah-engine-dev-*.tar.gz' | wc -l)"
          [ "$n" -eq 6 ] || { echo "::error::expected 6 archives, found $n"; exit 1; }
          sha256sum ./ah-engine-dev-*.tar.gz | sed 's|  \./|  |' > SHA256SUMS
          sha256sum -c SHA256SUMS
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > COMMIT
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the pre-release
        run: |
          set -eu
          tag="ah-engine-dev-${SHORT}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists: leaving it as is (a release is never deleted or replaced)"
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "ah-engine dev ${SHORT}" \
              --notes "Dev build of engine-proto at ${GITHUB_SHA}. Install: sh hooks/ah-update.sh --channel dev. Assets, SHA256SUMS, COMMIT and build-provenance attestations; verification steps: ah-engine/RELEASING.md."
          fi
      - name: Mark dev pre-releases beyond the newest 5 as superseded (never deleted)
        run: |
          set -eu
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("ah-engine-dev-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            [ -n "$old" ] || continue
            title="$(gh release view "$old" --json name --jq .name)"
            case "$title" in *"(superseded)") continue ;; esac
            gh release edit "$old" --prerelease --latest=false --title "$title (superseded)"
          done
