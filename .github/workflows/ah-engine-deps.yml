name: ah-engine-deps

# Weekly dependency refresh for the Rust engine (D84): `cargo update`, the full gates, cargo audit and cargo deny, then
# a pull request to dev when Cargo.lock changed. A red gate fails the run and opens nothing. Dependabot covers the
# Cargo.toml requirement bumps (majors); this covers the lock.
#
# Note: the repository setting "Allow GitHub Actions to create and approve pull requests" must be on. A pull request
# opened with GITHUB_TOKEN does not trigger other workflows, so this run is itself the gate.
# paused until release: owner decision 2026-11-10 / #708. This job gates on test.sh and was written for Linux; on macOS Apple silicon its
# release-profile build would exceed the job limit (see ah-engine/test.sh), so the weekly cron is off and it runs on a manual dispatch only.
# Restore the cron below when Linux support returns or the gate is moved to the ci-test profile.
on:
  # schedule:
  #   - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ah-engine-deps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest # paused until release: owner decision 2026-11-10 / #708 (dispatch only)
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ah-engine
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install --profile minimal
      # Restore-only: the lock is updated here, so this run's own build must not displace the shared engine cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ah-engine
          shared-key: engine-${{ runner.os }}
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit,cargo-deny
      - name: Update the lock
        run: cargo update
      - name: Audit and deny (always, so a new advisory fails the weekly run even when the lock is unchanged)
        run: |
          cargo audit
          cargo deny check
      - name: Did the lock change
        id: lock
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Gates
        if: steps.lock.outputs.changed == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -eu
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo doc --no-deps
          ./test.sh
      - name: Open the pull request
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -eu
          if [ -n "$(gh pr list --base dev --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("deps/ah-engine-")) | .number')" ]; then
            echo "A weekly dependency pull request is already open; not opening another."
            exit 0
          fi
          branch="deps/ah-engine-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add ah-engine/Cargo.lock
          git commit -m "ah-engine: weekly cargo update (D84)"
          git push origin "$branch"
          gh pr create --base dev --head "$branch" --title "ah-engine: weekly cargo update (D84)" \
            --body "Automated \`cargo update\`. The full gates (fmt, clippy, doc, test.sh), cargo audit and cargo deny passed on this lock."
