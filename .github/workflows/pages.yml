name: pages

# Docs site (MkDocs + the open-source Material theme, built from docs/).
#   pull_request to main: build only, so broken docs fail the release PR.
#   push to main (a release merging dev -> main) or a manual run on main: build and deploy to GitHub Pages.
# dev has no CI by design. Local build: see docs/contributing.md.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs/requirements.txt'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'tools/site*'
      - 'plugins/anti-hall/hooks/lib/settings-schema.js'
      - 'plugins/anti-hall/engine/defaults/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs/requirements.txt'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'tools/site*'
      - 'plugins/anti-hall/hooks/lib/settings-schema.js'
      - 'plugins/anti-hall/engine/defaults/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install MkDocs (pinned, hash-checked)
        run: python -m pip install --require-hashes --no-deps -r docs/requirements.txt
      - name: Generate the settings reference and changelog pages
        run: python -I tools/site_gen.py
      - name: Build (strict)
        run: python -m mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
