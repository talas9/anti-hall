# PR check and triage (pull_request_target). The PR's code is NEVER checked out or run: the title,
# body and diff are read through the API as untrusted data, and the rules come from the default
# branch. Labels: size:*, type:* (from a conventional title), risk:workflow, risk:security,
# risk:private-data, needs-issue (no "Closes #n"; release PRs from dev are exempt), and
# moderation:review for a spam/abusive description. ONE sticky comment with the checklist and a
# review summary (model via ai-model.yml when AI_PROVIDER allows; dependabot and owner PRs get the
# rules-only path). Never approves, requests changes, merges or closes.
# The blocking secret/privacy check for PRs is privacy-scan.yml.
name: PR check

on:
  pull_request_target:
    types: [opened, synchronize, edited, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: number
      dry-run:
        description: Log the decisions without writing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      state: ${{ steps.gate.outputs.state }}
      want_model: ${{ steps.gate.outputs.want_model }}
      prompt: ${{ steps.gate.outputs.prompt }}
      schema: ${{ steps.gate.outputs.schema }}
      claude_model: ${{ steps.gate.outputs.claude_model }}
      copilot_model: ${{ steps.gate.outputs.copilot_model }}
      chain: ${{ steps.gate.outputs.chain }}
    steps:
      - name: Checkout the rules (default branch, never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Rules
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_DAILY_CAP: ${{ vars.AI_DAILY_CAP }}
        with:
          script: |
            const m = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/moderation/pr.js');
            await m.gate({ github, context, core });

  model:
    needs: gate
    if: needs.gate.outputs.want_model == 'true'
    permissions:
      contents: read
      copilot-requests: write
    uses: ./.github/workflows/ai-model.yml
    with:
      purpose: pr-summary
      prompt: ${{ needs.gate.outputs.prompt }}
      schema: ${{ needs.gate.outputs.schema }}
      claude_model: ${{ needs.gate.outputs.claude_model }}
      copilot_model: ${{ needs.gate.outputs.copilot_model }}
      chain: ${{ needs.gate.outputs.chain }}
      tools: none
      max_turns: 2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}

  apply:
    needs: [gate, model]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the rules (default branch, never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Label, comment and record
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATE: ${{ needs.gate.outputs.state }}
          MODEL_RESULT: ${{ needs.model.outputs.result }}
          MODEL_PROVIDER: ${{ needs.model.outputs.provider }}
          MODEL_REASON: ${{ needs.model.outputs.reason }}
          MODEL_LATENCY_MS: ${{ needs.model.outputs.latency_ms }}
          MODEL_TURNS: ${{ needs.model.outputs.turns }}
          MODEL_TOKENS: ${{ needs.model.outputs.tokens }}
        with:
          script: |
            const m = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/moderation/pr.js');
            await m.apply({ github, context, core });
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-check-log
          path: ${{ runner.temp }}/pr-check-log.jsonl
          retention-days: 90
          if-no-files-found: ignore
