name: ah-engine-release

# Two-step ah-engine release (D67, D68).
#   prepare: manual run. Builds and tests every target in ah-engine/targets.json, packages the assets, then opens a PR that updates ah-engine.lock
#            (version, fingerprint, per-asset sha256). Skipped when the fingerprint is unchanged, unless `force` is set.
#   publish: runs on tag ah-engine-vX.Y.Z. Takes the prepare run's artifacts named in ah-engine.lock, verifies them against the committed checksums,
#            attests build provenance and creates the GitHub Release. Fails if no matching prepare exists.
# Target set and runners: ah-engine/targets.json (single source). Procedure: ah-engine/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the fingerprint matches ah-engine.lock
        type: boolean
        default: false
      base:
        description: Branch the lock PR targets. Never main (main changes only through PRs from dev).
        type: string
        default: dev
  push:
    tags: ['ah-engine-v*']

permissions: {}

concurrency:
  group: ah-engine-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  # ---------- prepare ----------
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      changed: ${{ steps.meta.outputs.changed }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        env:
          FORCE: ${{ inputs.force }}
          BASE: ${{ inputs.base }}
        run: |
          if [ "$BASE" = main ] || [ -z "$BASE" ]; then
            echo "::error::base must not be main (or empty): the lock PR targets dev, and main changes only through PRs from dev"; exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' ah-engine/Cargo.toml | head -1)"
          fp="$(ah-engine/scripts/fingerprint.sh)"
          locked=""
          [ -f ah-engine.lock ] && locked="$(jq -r .fingerprint ah-engine.lock)"
          changed=true
          if [ "$fp" = "$locked" ] && [ "$FORCE" != "true" ]; then changed=false; fi
          if [ "$changed" = true ] && git ls-remote --exit-code --tags origin "refs/tags/ah-engine-v${version}" >/dev/null 2>&1; then
            echo "::error::tag ah-engine-v${version} already exists; bump ah-engine/Cargo.toml version"; exit 1
          fi
          {
            echo "version=$version"
            echo "changed=$changed"
            echo "matrix=$(jq -c . ah-engine/targets.json)"
          } >> "$GITHUB_OUTPUT"
          echo "fingerprint $fp; changed=$changed"

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        if: matrix.apt != ''
        env:
          APT: ${{ matrix.apt }}
        run: |
          read -ra pkgs <<< "$APT"
          sudo apt-get update -q
          sudo apt-get install -y -q "${pkgs[@]}"
      - name: Toolchain
        env:
          TRIPLE: ${{ matrix.triple }}
        working-directory: ah-engine
        run: |
          rustup show active-toolchain || rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup target add "$TRIPLE"
      - name: Build
        env:
          TRIPLE: ${{ matrix.triple }}
        working-directory: ah-engine
        run: scripts/build.sh --target "$TRIPLE"
      - name: Package
        env:
          TRIPLE: ${{ matrix.triple }}
        working-directory: ah-engine
        run: scripts/package.sh "$TRIPLE" "$GITHUB_WORKSPACE/dist"
      # Tests build their own binary, so they get a separate target directory and cannot replace the packaged one.
      - name: Test
        env:
          TRIPLE: ${{ matrix.triple }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/ah-engine/target-test
        working-directory: ah-engine
        run: cargo test --release --locked --target "$TRIPLE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.triple }}
          path: dist/*.tar.gz
          if-no-files-found: error

  source:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        working-directory: ah-engine
        run: rustup show active-toolchain || rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - name: Vendored source tarball
        working-directory: ah-engine
        run: scripts/package-src.sh "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-src
          path: dist/*.tar.gz
          if-no-files-found: error

  lock:
    needs: [plan, build, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Update ah-engine.lock
        run: |
          ah-engine/scripts/update-lock.sh dist ah-engine.lock "$GITHUB_RUN_ID"
          # The plugin installs only plugins/anti-hall, so its bootstrap (hooks/ah-engine-bootstrap.sh) reads this copy.
          cp ah-engine.lock plugins/anti-hall/ah-engine.lock
      - name: Open PR
        env:
          BASE: ${{ inputs.base }}
        run: |
          branch="ah-engine-prepare/v${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add ah-engine.lock plugins/anti-hall/ah-engine.lock
          git commit -m "chore(ah-engine): lock v${VERSION}"
          git push origin "$branch"
          [ "$BASE" != main ] || { echo "::error::base must not be main"; exit 1; }
          gh pr create --base "$BASE" --head "$branch" \
            --title "chore(ah-engine): lock v${VERSION}" \
            --body "Prepare run ${GITHUB_RUN_ID}: updates ah-engine.lock with the version, fingerprint and checksums of the built assets. After merge, tag ah-engine-v${VERSION} to publish. See ah-engine/RELEASING.md."

  # ---------- publish ----------
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the lock matches this tag and source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ -f ah-engine.lock ] || { echo "::error::ah-engine.lock is missing: run the prepare workflow and merge its PR before tagging"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}" || { echo "::error::tag $TAG is not on ${DEFAULT_BRANCH}: tag the merged commit"; exit 1; }
          version="${TAG#ah-engine-v}"
          [ "$(jq -r .version ah-engine.lock)" = "$version" ] || { echo "::error::ah-engine.lock version does not match tag $TAG"; exit 1; }
          [ "$(sed -n 's/^version = "\(.*\)"/\1/p' ah-engine/Cargo.toml | head -1)" = "$version" ] || { echo "::error::ah-engine/Cargo.toml version does not match tag $TAG"; exit 1; }
          [ "$(jq -r .fingerprint ah-engine.lock)" = "$(ah-engine/scripts/fingerprint.sh)" ] || { echo "::error::source fingerprint differs from ah-engine.lock: rerun prepare"; exit 1; }
          cmp ah-engine.lock plugins/anti-hall/ah-engine.lock || { echo "::error::plugins/anti-hall/ah-engine.lock differs from ah-engine.lock: rerun prepare"; exit 1; }
          jq -e '.prepare_run | type == "number"' ah-engine.lock >/dev/null || { echo "::error::ah-engine.lock has no prepare_run"; exit 1; }
      - name: Fetch prepare artifacts
        run: |
          run_id="$(jq -r .prepare_run ah-engine.lock)"
          info="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,event,headSha)"
          [ "$(jq -r '.workflowName + "/" + .conclusion + "/" + .event' <<<"$info")" = "ah-engine-release/success/workflow_dispatch" ] \
            || { echo "::error::run $run_id is not a successful manual ah-engine-release run"; exit 1; }
          head_sha="$(jq -r .headSha <<<"$info")"
          git cat-file -e "${head_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$head_sha" \
            || { echo "::error::source commit $head_sha of run $run_id is unavailable: it must stay reachable (merged into a branch) until publish; rerun prepare from a branch that will be merged"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/prepared-src" "$head_sha" >/dev/null
          [ "$("$RUNNER_TEMP/prepared-src/ah-engine/scripts/fingerprint.sh")" = "$(jq -r .fingerprint ah-engine.lock)" ] \
            || { echo "::error::run $run_id built a source whose fingerprint differs from ah-engine.lock"; exit 1; }
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'dist-*' --dir fetched \
            || { echo "::error::artifacts of run $run_id are unavailable (expired?): rerun prepare"; exit 1; }
          mkdir dist
          find fetched -type f -name '*.tar.gz' -exec mv {} dist/ \;
      - name: Verify against the committed checksums
        run: |
          version="${TAG#ah-engine-v}"
          expected="$(jq -r --arg v "$version" '([.[].triple | "ah-engine-v\($v)-\(.).tar.gz"] + ["ah-engine-v\($v)-src.tar.gz"])[]' ah-engine/targets.json | LC_ALL=C sort)"
          [ "$(jq -r '.assets | keys[]' ah-engine.lock | LC_ALL=C sort)" = "$expected" ] || { echo "::error::ah-engine.lock assets differ from the expected set (targets.json x version, plus src)"; exit 1; }
          [ "$(find dist -type f | sed 's|^dist/||' | LC_ALL=C sort)" = "$expected" ] || { echo "::error::downloaded assets differ from the expected set"; exit 1; }
          jq -r '.assets | to_entries | sort_by(.key)[] | "\(.value)  \(.key)"' ah-engine.lock > dist/SHA256SUMS
          (cd dist && shasum -a 256 -c SHA256SUMS)
          (cd dist && for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-dist
          path: dist
      - name: Re-check the checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the GitHub Release
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ah-engine ${TAG#ah-engine-}" \
            --notes "Assets, SHA256SUMS and build-provenance attestations for ${TAG}. Verification steps: ah-engine/RELEASING.md."
