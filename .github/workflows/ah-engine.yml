name: ah-engine

# Self-contained CI for the Rust engine in ah-engine/ (D69): fmt, clippy, tests and docs on the supported unix targets.
on:
  push:
    branches: [engine-proto]
    paths: ['ah-engine/**', 'docs/DEVELOPMENT.md', '.github/workflows/ah-engine.yml']
  pull_request:
    paths: ['ah-engine/**', 'docs/DEVELOPMENT.md', '.github/workflows/ah-engine.yml']
  schedule:
    - cron: '17 4 * * 1' # weekly: the full doc-check, with the long test suites
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ah-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Node parity lanes run the Node hooks; with CI=true they fail rather than skip when Node is missing.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Install exactly the toolchain pinned in rust-toolchain.toml (channel, rustfmt and clippy), so CI never drifts from it.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ah-engine
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./test.sh
        env:
          # Headroom for the script CPU limit on a loaded shared runner (the shipped default is sized for an idle machine).
          AH_ENGINE_SCRIPT_TIME_MS: "2000"
          # Wall-clock tests (a transcript answered within the script limit) get the same headroom: 2000 ms x 3.
          AH_TEST_TIME_SCALE: "3"
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Runs the shell commands in docs/DEVELOPMENT.md in a fresh clone (D83), so the guide cannot drift from the repo. A push
  # or pull request runs it with --fast (the blocks marked `long`, the full test suites, are skipped: the rust job above
  # already runs them); the weekly schedule and a manual dispatch run every block.
  doc-check:
    name: doc-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install --profile minimal
        working-directory: ah-engine
      - run: ah-engine/scripts/doc-check.sh ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '' || '--fast' }}

  # Supply chain (D84): known vulnerabilities (RustSec) and licence/source policy (ah-engine/deny.toml).
  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ah-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check

  # Informational, never gating (continue-on-error): scheduled reports. The schedule trigger is the weekly cron above;
  # a manual dispatch runs them too, a push or pull request does not.
  coverage:
    name: coverage (informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ah-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install --profile minimal
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ah-engine
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Line coverage summary
        run: cargo llvm-cov nextest --release --summary-only | tee "$GITHUB_STEP_SUMMARY"

  # Binary size report: total release size and the biggest crates (cargo-bloat). Informational; compare to ah-engine/RELEASING.md.
  size:
    name: size report (informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ah-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ah-engine
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-bloat
      - name: Release size and top crates
        run: |
          cargo build --release
          size=$(wc -c < target/release/ah-engine)
          # cargo-bloat needs symbols, and the release profile strips them: re-link an unstripped copy for the crate table only.
          CARGO_PROFILE_RELEASE_STRIP=false cargo bloat --release --crates -n 15 > /tmp/bloat.txt
          {
            echo '### ah-engine release binary'
            echo "$size bytes (stripped, as shipped)"
            echo '### Top crates (cargo-bloat)'
            echo '```'
            cat /tmp/bloat.txt
            echo '```'
          } | tee "$GITHUB_STEP_SUMMARY"
