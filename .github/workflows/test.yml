name: tests

# The Node test suite is retired (owner order 2026-10-23): the engine's tests run in ah-engine.yml (job `rust`). This workflow only
# keeps the job name `tests-passed`, which the dev and main rulesets still require; point the rulesets at `rust (ubuntu-latest)`
# and delete this file.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests-passed:
    name: tests-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "no Node tests remain; the engine suite is the ah-engine workflow (rust)"
