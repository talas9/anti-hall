name: nightly

# Suites that are gated out of the per-PR run:
#   hardening                engine hardening bar (#58): load, crash loop, breaker, 50k-call memory soak (never a PR check)
# On failure ONE issue titled "Nightly test failure" is opened or commented on.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      allocator:
        description: 'AH_ENGINE_ALLOCATOR for the daemon (jemalloc|system); empty = engine default'
        required: false
        default: ''
      malloc_conf:
        description: 'jemalloc conf string (_RJEM_MALLOC_CONF); empty = jemalloc defaults'
        required: false
        default: ''
      profile:
        description: 'turn the daemon profiler on for the load bar; profile.jsonl, nproc and daemon.workers go in the hardening-report artifact'
        type: boolean
        required: false
        default: false
      bars:
        description: 'soak.sh BARS filter (space-separated bar prefixes); empty = all bars'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  hardening:
    name: engine hardening bar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ah-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev  # the schedule runs the default branch's file; build dev, not stale main
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ah-engine
          shared-key: engine-${{ runner.os }}
          save-if: false
      - name: hardening bar (scripts/soak.sh)
        env:
          AH_ENGINE_ALLOCATOR: ${{ inputs.allocator }}
          _RJEM_MALLOC_CONF: ${{ inputs.malloc_conf }}
          BARS: ${{ inputs.bars }}
          AH_HARDENING_PROFILE: ${{ inputs.profile && '1' || '' }}
        run: ./scripts/soak.sh target/hardening/report.md
      - name: bar report
        if: always()
        run: cat target/hardening/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: failing bar's daemon log (tail 200)
        if: failure()
        run: |
          for f in target/hardening/fragments/*-daemon.log target/hardening/fragments/*-daemon.stderr; do
            [ -f "$f" ] && { echo "== $f"; tail -n 200 "$f"; }
          done
          true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hardening-report
          path: |
            ah-engine/target/hardening/report.md
            ah-engine/target/hardening/fragments/*-daemon.log
            ah-engine/target/hardening/**

  report:
    name: nightly failure issue
    needs: [hardening]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev  # the schedule runs the default branch's file; build dev, not stale main
      - name: open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HARDENING: ${{ needs.hardening.result }}
        run: |
          title="Nightly test failure"
          body="Run: ${RUN_URL}"$'\n'"hardening: ${HARDENING}"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then
            printf '%s' "$body" | ./.github/scripts/bot-comment.sh "$n" ci-failure
          else
            gh issue create --title "$title" --body "$body"
          fi
